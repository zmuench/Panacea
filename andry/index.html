function asmOf(d){const e=S.asm[d.id];return e&&e.dirty?e.t:autoAsm(d);}
function suggestedMods(){const c=cc();if(!c)return{};const m={};if(FU()){if(c.tr)m.cast=true;return m;}(c.mods||[]).forEach(k=>m[k]=true);
  if(c.tr)m.cast=true;
  if(S.dx.some(id=>{const p=S.dp[id]||{};return p.o==='open';}))m.open=true;
  const y=ageY();const natPos=hItems().some(x=>x.sec[0]==='Injury screen'&&S.marks[x.key]==='p');
  if(c.tr&&((y!=null&&y<1)||natPos))m.nat=true;
  return m;}
function modOn(k){return S.modsSet&&k in S.mods?S.mods[k]:!!suggestedMods()[k];}
function blocks(){const out=[];const c=cc();if(!c)return out;
  S.dx.forEach(id=>{const d=dxById(id);if(!d)return;const pl=visLines(d).filter(l=>lineOn(pkey(id),l)).map(l=>fillDx(d,l.t));out.push({h:['# '+headerOf(d)],a:asmOf(d),pl,id});});
  const extra=[];MOD_ORDER.forEach(k=>{if(!modOn(k)||MODS[k].sep)return;planLines(MODS[k].p).forEach(l=>{if(lineOn('m_'+k,l))extra.push(tok(fillSide(l.t)));});});
  if(extra.length){if(out.length)out[0].pl=out[0].pl.concat(extra.filter(x=>!out[0].pl.includes(x)));else out.push({h:['# '+cap(fillSide(c.cc))],a:'',pl:extra});}
  if(modOn('nat')){const flags=hItems().filter(x=>x.sec[0]==='Injury screen'&&S.marks[x.key]==='p').map(x=>x.it.t);
    const inj=S.dx.map(id=>{const d=dxById(id);return d?headerOf(d).toLowerCase():'';}).filter(Boolean);
    out.push({h:['# Concern for non-accidental trauma'],a:`${ageTxt()} ${sexL()} with ${inj.length?andL(inj):'an injury'}${flags.length?'; notable for '+andL(flags):''}. Evaluation for non-accidental trauma is indicated given ${(ageY()!=null&&ageY()<1)?'age and developmental stage':'the history'}.`,pl:planLines(MODS.nat.p).filter(l=>lineOn('m_nat',l)).map(l=>l.t)});}
  return out;}
function apPlain(){return blocks().map(b=>[...b.h,b.a,...b.pl.map(x=>'- '+x)].filter(Boolean).join('\n')).join('\n\n');}
const FS='font-family:Arial,sans-serif;font-size:11pt;';
function apRich(){return blocks().map(b=>`${b.h.map(h=>`<p style="${FS}margin:0">${esc(h)}</p>`).join('')}${b.a?`<p style="${FS}margin:0"><i>${esc(b.a)}</i></p>`:''}${b.pl.length?`<ul style="${FS}margin:0 0 10pt;padding-left:20pt">${b.pl.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p style="margin:0 0 10pt"></p>'}`).join('');}
const hl=t=>esc(t).replace(/\*\*\*/g,'<span class="hole">***</span>');
function apPreview(){const bl=blocks();if(!bl.length)return'<p class="fine">Pick at least one diagnosis.</p>';return bl.map(b=>`${b.h.map(h=>`<p class="bh">${esc(h)}</p>`).join('')}${b.a?`<p><i>${hl(b.a)}</i></p>`:''}${b.pl.length?`<ul>${b.pl.map(x=>`<li>${hl(x)}</li>`).join('')}</ul>`:''}`).join('');}
function hpiText(){return S.hpiDirty?S.hpi:buildHPI();}
function noteParts(){return{hpi:hpiText(),ex:buildExam(),ap:apPlain()};}
function notePlain(){const n=noteParts();return['HPI:',n.hpi,'','Physical exam:',n.ex,'','Assessment and plan:',n.ap].join('\n');}
function noteRich(){const n=noteParts();const p=t=>`<p style="${FS}margin:0">${esc(t)}</p>`;
  return `<p style="${FS}margin:0"><b>HPI:</b></p>${p(n.hpi)}<p style="margin:0 0 10pt"></p><p style="${FS}margin:0"><b>Physical exam:</b></p>${n.ex.split('\n').map(p).join('')}<p style="margin:0 0 10pt"></p><p style="${FS}margin:0"><b>Assessment and plan:</b></p>${apRich()}`;}

/* ---------- views ---------- */
const STEPS=['Patient','Complaint','HPI','Exam','A/P','Note'];
const chip=(a,v,on,label,extra='')=>`<button type="button" class="chip" aria-pressed="${!!on}" data-a="${a}" data-v="${esc(v)}" ${extra}>${esc(label)}</button>`;
const one=(a,cur,list,labels)=>`<div class="chips">${list.map((v,i)=>chip(a,v,cur===v,labels?labels[i]:shown(v))).join('')}</div>`;
const multi=(a,arr,list,labels)=>`<div class="chips">${list.map((v,i)=>chip(a,v,arr.includes(v),labels?labels[i]:shown(v))).join('')}</div>`;
const inp=(k,label,ph,cls='',type='text',im='')=>`<label class="in ${cls}"><span>${label}</span><input type="${type}" ${im?`inputmode="${im}"`:''} data-t="${k}" value="${esc(S[k])}" placeholder="${esc(ph)}"></label>`;
const pane=(eb,h,cue,body,cls='')=>`<section class="pane ${cls}"><div class="ph"><span class="eb">${eb}</span><h2>${h}</h2>${cue?`<p class="cue">${cue}</p>`:''}</div>${body}</section>`;

function vPatient(){
  return `<div class="grid one">${pane('Step 1','Patient','Age, sex, and weight decide which questions appear and dose the analgesics and antibiotics. Nothing is saved or sent.',`
  <div class="sec"><div class="row">${inp('age','Age','6','xs','number','decimal')}
    <div class="in" style="max-width:none;flex:0 1 auto"><span>Unit</span>${one('unit',S.unit,['y','m','d'],['Years','Months','Days'])}</div>
    ${inp('wt','Weight (kg)','22','xs','number','decimal')}</div>
    <div class="in" style="max-width:none"><span>Sex</span>${one('sex',S.sex,['female','male'],['Female','Male'])}</div>
    <p class="dose" id="doseEx">${wt()?`Example: acetaminophen ${fmt(dz(15,1000))} mg, ibuprofen ${fmt(dz(10,600))} mg.`:''}</p>
    <div class="row">${inp('opmh','Other PMHx, separated by commas','asthma, ADHD','wide')}</div></div>
  <div class="sec"><h3>Setting</h3>${one('set',S.set,['ed','inpt','clinic','fu'],['ED consult','Inpatient consult','Clinic, new','Clinic follow-up'])}
    ${S.set==='ed'||S.set==='inpt'?`<div class="row">${inp('by','Consulted by','the ED team, Dr. ***','wide')}</div>`:''}</div>
  <div class="sec"><h3>Source of history</h3>${multi('src',S.src,['patient','mother','father','parents','grandparent','guardian','ems','chart'],['Patient','Mother','Father','Parents','Grandparent','Guardian','EMS','Chart review'])}
    <div class="row">${inp('interp','Interpreter language','Spanish')}</div>
    <div class="in" style="max-width:none"><span>Hand dominance (used for arm and hand complaints)</span>${one('hand',S.hand,['right','left','ambi'],['Right','Left','Ambidextrous'])}</div></div>`)}</div>`;}

function vComplaint(){
  const q=S.q.trim().toLowerCase();
  const groups=GROUPS.map(g=>{const ks=Object.keys(C).filter(k=>C[k].g===g&&(!q||(C[k].n+' '+C[k].dx.map(d=>d.t).join(' ')).toLowerCase().includes(q)));if(!ks.length)return'';
    return `<div class="grp"><div class="grp-h">${esc(g)}</div><div class="chips">${ks.map(k=>chip('cc',k,S.cc===k,C[k].n)).join('')}</div></div>`;}).join('');
  const c=cc();
  return `<div class="grid one">${pane('Step 2','Complaint','Each complaint loads its own history questions, focused exam, imaging findings, and diagnoses with plans.',`
   <div class="sec"><input class="full" type="search" data-t="q" id="q" value="${esc(S.q)}" placeholder="Search complaints or diagnoses (e.g. Gartland, SCFE, Monteggia)" aria-label="Search complaints">
   <div class="cmp">${groups||'<p class="fine">Nothing matches. Try a shorter word.</p>'}</div></div>
   ${c&&c.sd!==0?`<div class="sec"><h3>Side</h3>${one('side',S.side,['right','left','bilateral'],['Right','Left','Bilateral'])}<p class="fine">Fills in the chief complaint, exam headers, imaging, and diagnoses.</p></div>`:''}`)}</div>`;}

function triChip(x){const v=S.marks[x.key];const cls=v==='p'?' pos':v==='n'?' neg':(x.it.red?' rf':'');
  return `<button type="button" class="chip${cls}" data-a="tri" data-v="${x.key}" aria-label="${esc(shown(x.it.t))}${v==='p'?', yes':v==='n'?', no':', not asked'}"><span class="mk">${v==='p'?'+':v==='n'?'−':''}</span>${esc(shown(x.it.t))}</button>`;}
const KIND={sx:'Ask about',pmh:'Past history',rf:'History',tx:'Tried',fhx:'Family history'};
function vStory(c){
  if(FU())return vFU(c);
  if(c.tr){const mechs=c.mech||[];
    return `<div class="sec"><h3>Injury</h3>
      <div class="flab">Mechanism (completes “${He()} ___”)</div>${one('mech',S.mech,mechs.concat(['other']),mechs.map(shown).concat(['Other']))}
      ${S.mech==='other'?`<div class="row">${inp('mechTxt','Mechanism, as it should read','fell off a horse','wide')}</div>`:''}
      <div class="row">${inp('when','When','at about 1600 today','wide')}${/height|monkey|playground|trampoline|bed/.test(S.mech)?inp('ht','Height (ft)','5','xs','number','decimal'):''}</div>
      <div class="flab">Witnessed</div>${one('wit',S.wit,['parent','adult','none'],['By a parent','By another adult','Unwitnessed'])}
      <div class="flab">Right after the injury</div>${multi('imm',S.imm,['immediate pain','immediate swelling','visible deformity','a pop at the time of injury'])}
      <div class="flab">${isUE(c)?'Use of the arm since':'Weight bearing since'}</div>${one('use',S.use,['unable','limited','normal'],isUE(c)?['Unable to use','Minimal use','Normal use']:['Unable to bear weight','With a limp','Bears weight'])}
      ${c.or?`<div class="row">${inp('lastPO','Last oral intake (time and what)','1200, juice','wide')}</div>`:''}</div>`;}
  if(NP[S.cc])return `<div class="sec"><h3>When it was noticed</h3><div class="row">${inp('ago','How long ago','6','xs','number','decimal')}<div class="in" style="max-width:none;flex:0 1 auto"><span>Unit</span>${one('agoU',S.agoU,['days','weeks','months','years'])}</div></div>
     <div class="flab">Course</div>${one('course',S.course,['worsening','improving','unchanged','resolved'])}</div>`;
  return `<div class="sec"><h3>Story</h3>
    <div class="flab">Onset</div>${one('onset',S.onset,['sudden','gradual'])}
    <div class="row">${inp('ago','How long ago','3','xs','number','decimal')}<div class="in" style="max-width:none;flex:0 1 auto"><span>Unit</span>${one('agoU',S.agoU,['days','weeks','months','years'])}</div></div>
    ${c.loc&&c.loc.length?`<div class="flab">Location</div>${multi('loc',S.loc,c.loc)}`:''}
    <div class="flab">Timing</div>${multi('timing',S.timing,['with activity','after activity','at rest','at night','in the morning with stiffness','constantly','intermittently'])}
    ${c.agg&&c.agg.length?`<div class="flab">Worse with</div>${multi('agg',S.agg,c.agg)}`:''}
    ${c.rel&&c.rel.length?`<div class="flab">Better with</div>${multi('rel',S.rel,c.rel)}`:''}
    <div class="flab">Course</div>${one('course',S.course,['worsening','improving','unchanged','resolved'])}
    <div class="flab">Severity at worst (0 to 10)</div><div class="seg">${[...Array(11).keys()].map(n=>`<button type="button" class="${S.sev===n?'on':''}" data-a="sev" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="flab">Prior episodes</div>${one('prior',S.prior,['first','similar'],['First episode','Similar before'])}</div>`;}
function vFU(c){const mechs=c.mech||[];
  return `<div class="sec"><h3>Follow-up visit</h3>
    <div class="flab">Visit</div>${one('fvis',S.fvis,['injury','post-op','cast off','pins out','recheck'],['Injury follow-up','Post-op check','Cast or splint removal','Pin removal','Symptom recheck'])}
    <div class="row">${inp('fdx','Diagnosis being followed (opens the HPI)',`a suspected ${sideW()?sideW()+' ':''}scaphoid fracture`,'wide')}</div>
    ${c.tr?`<div class="flab">Original injury (optional)</div>${one('mech',S.mech,mechs.concat(['other']),mechs.map(shown).concat(['Other']))}${S.mech==='other'?`<div class="row">${inp('mechTxt','Mechanism, as it should read','fell off a horse','wide')}</div>`:''}<div class="row">${inp('when','When','on 11/2','wide')}</div>`:''}
    <div class="flab">Initially seen at</div>${one('fwhere',S.fwhere,['an outside emergency department','our emergency department','an urgent care','the pediatrician’s office','our clinic'],['Outside ED','Our ED','Urgent care','Pediatrician','Our clinic'])}
    <div class="row">${inp('fwhen','Date of that visit','on 11/2','wide')}</div>
    <div class="flab">Imaging at that visit</div>${one('fimg',S.fimg,['negative','fracture','none'],['XR negative','XR showed the fracture','No imaging'])}
    <div class="flab">Treatment so far</div>${multi('ftx',S.ftx,['a splint','a thumb spica splint','a cast','a sling','a walking boot','a brace','crutches','a closed reduction','surgery'])}
    ${S.ftx.includes('surgery')?`<div class="row">${inp('fsurg','Procedure and date','CRPP on 11/3','wide')}</div>`:''}
    <div class="row">${inp('fago','Time since injury or surgery','10','xs','number','decimal')}<div class="in" style="max-width:none;flex:0 1 auto"><span>Unit</span>${one('fagoU',S.fagoU,['days','weeks','months'])}</div></div>
    <div class="flab">Wearing the ${esc(immNoun())}</div>${one('fcomp',S.fcomp,['as','part','not'],['As instructed','Part of the time','Not wearing it'])}
    <div class="flab">Pain since</div>${one('fpain',S.fpain,['improving','unchanged','worsening','resolved'])}
    <div class="flab">Pain now (0 to 10)</div><div class="seg">${[...Array(11).keys()].map(n=>`<button type="button" class="${S.sev===n?'on':''}" data-a="sev" data-v="${n}">${n}</button>`).join('')}</div></div>`;}
function vHPI(){const c=cc();if(!c)return needCC();const all=hItems();
  let pert='';
  hSecs().forEach((sec,si)=>{
    if(sec[1]==='pick'){pert+=`<div class="sec"><h3>${esc(sec[0])}</h3><div class="chips">${sec[2].map((o,ii)=>chip('hpick',si+'.'+ii,S.picks[si]===ii,shown(o))).join('')}</div></div>`;return;}
    const mine=all.filter(x=>x.si===si);if(!mine.length)return;const done=mine.filter(x=>S.marks[x.key]).length;
    pert+=`<div class="sec"><h3>${esc(sec[0])}<span class="kind">${KIND[sec[1]]}</span><span class="aside${done===mine.length?' done':''}">${done} of ${mine.length}</span></h3>
      <div class="chips">${mine.map(triChip).join('')}</div>
      ${mine.filter(x=>S.marks[x.key]==='p'&&x.it.ask).map(x=>`<label class="ask">${esc(shown(x.it.t))}: ${esc(x.it.ask)}<input type="text" data-i="${x.key}" value="${esc(S.idet[x.key]||'')}"></label>`).join('')}
      ${sec[1]==='tx'&&mine.some(x=>S.marks[x.key]==='p')?`<div class="flab">Response</div>${one('resp',S.resp,['full','partial','none'],['Relief','Partial relief','No relief'])}`:''}
      <div class="row"><button type="button" class="btn sm" data-a="restneg" data-v="${si}">Mark the rest negative</button></div>
      <input class="full" type="text" data-d="${si}" value="${esc(S.det[si]||'')}" placeholder="Details for ${esc(sec[0].toLowerCase())}" aria-label="Details"></div>`;});
  const left=`${pane('Step 3','History',`Tap once for yes, twice for no, a third time to clear. Blank items stay out of the note. Format: opening line, story, pertinents, then the chief concern and the closing line.`,`
    ${vStory(c)}
    <div class="sec"><h3>Activities</h3><div class="row">${inp('sports','Sports and activities','club soccer, 4 days a week','wide')}</div></div>
    <div class="legend"><span><i class="dot p"></i>Positive</span><span><i class="dot n"></i>Negative</span><span><i class="dot r"></i>Red flag not yet asked</span></div>
    ${pert}
    <div class="sec"><h3>Chief concern and closing</h3><div class="row">${inp('concern','Chief concern, in their words',fillSide(c.cc),'wide')}</div><div class="row">${inp('extra','Extra line before the close','Seen at urgent care yesterday and splinted','wide')}</div></div>`)}`;
  return `<div class="grid">${left}${sideHPI()}</div>`;}
function sideHPI(){const c=cc();const t=hTally();
  let coach='';if(t.left){const red=t.leftList.filter(x=>x.it.red);coach=red.length?`<div class="coach"><h3>Red flags not yet asked (${red.length})</h3><div class="chips">${red.map(triChip).join('')}</div></div>`:`<p class="fine">${t.left} of ${t.all} items not yet asked.</p>`;}else coach=`<div class="ok">Every pertinent item has an answer.</div>`;
  const txt=hpiText();
  return pane('Live','HPI','Edit freely. If you change answers after editing, tap Rebuild.',`
   ${S.hpiDirty?`<div class="banner"><span>You edited this text, so new answers are not added until you rebuild.</span><button class="btn sm" type="button" data-a="rebuild">Rebuild</button></div>`:''}
   <textarea class="out" id="hpiOut" aria-label="HPI text">${esc(txt)}</textarea>
   <div class="copyrow"><button class="btn primary" type="button" data-a="copy" data-v="hpi">Copy HPI</button></div>${coach}`,'side');}

function vExam(){const c=cc();if(!c)return needCC();
  let body=`<div class="legend"><span><i class="dot n"></i>Tap once: normal or absent</span><span><i class="dot p"></i>Twice: abnormal or present</span><span><i class="dot r"></i>Must document</span></div>
   <div class="row"><button class="btn sm" type="button" data-a="allnorm">Mark everything unmarked normal</button><button class="btn sm" type="button" data-a="exclear">Clear exam</button></div>`;
  exGroups().forEach(g=>{body+=`<div class="grouph">${esc(g.h||'General')}</div>`;
    g.ids.forEach(id=>{const [title,,,meas]=E[id];const els=elems(id);const done=els.every(e=>S.ex[id+'.'+e.i]);
      body+=`<div class="item${done?' done':''}"><div class="item-h"><b>${esc(title)}</b><span class="sp"></span><button class="btn sm" type="button" data-a="itnorm" data-v="${id}">Normal</button></div>
       <div class="chips">${els.map(e=>{const v=S.ex[id+'.'+e.i];const cls=v==='a'?' pos':v==='n'?' neg':(e.must?' rf':'');const lab=v==='a'?e.a:e.n;return `<button type="button" class="chip${cls}" data-a="ex" data-v="${id}.${e.i}"><span class="mk">${v==='a'?'+':v==='n'?'✓':''}</span>${esc(cap(lab))}</button>`;}).join('')}</div>
       ${meas?`<div class="meas">${meas.map(([k,l,u])=>`<label>${esc(l)} (${esc(u)})<input type="text" inputmode="decimal" data-m="${id}.${k}" value="${esc(S.exm[id+'.'+k]||'')}"></label>`).join('')}</div>`:''}
       <input class="det" type="text" data-x="${id}" value="${esc(S.exd[id]||'')}" placeholder="Other findings for ${esc(title.toLowerCase())}"></div>`;});});
  const t=exTally();
  const side=pane('Live','Exam',`Abnormal findings come first in each line, then the explicit negatives. A line is replaced by its normal sentence only when every element is normal.`,`
   <textarea class="out" id="exOut" readonly aria-label="Exam text">${esc(buildExam())}</textarea>
   <div class="copyrow"><button class="btn primary" type="button" data-a="copy" data-v="ex">Copy exam</button></div>
   ${t.must?`<div class="coach"><h3>Must document (${t.must})</h3><ul class="fine" style="margin:0;padding-left:18px">${t.mustList.map(x=>`<li>${esc(E[x.id][0])}: ${esc(x.e.n)}</li>`).join('')}</ul></div>`:t.left?`<p class="fine">${t.left} of ${t.all} elements not yet examined.</p>`:`<div class="ok">Every element is documented.</div>`}`,'side');
  return `<div class="grid">${pane('Step 4','Focused exam',`${esc(c.n)}: the exam to document, with explicit pertinent negatives.`,body)}${side}</div>`;}

function vAP(){const c=cc();if(!c)return needCC();
  let body=`<div class="sec"><h3>Imaging and labs</h3>
    <div class="flab">Studies</div>${multi('xr',S.xr,c.xr,c.xr.map(fillSide))}
    <div class="flab">Findings</div>${(()=>{const F=FU()?FU_F.concat(c.f):c.f;return multi('f',S.f,F,F.map(x=>cap(fillSide(x))));})()}
    <textarea class="full" data-t="ftxt" placeholder="Other findings or values (written into each assessment)">${esc(S.ftxt)}</textarea>
    <p class="fine">Fill any *** in the note after copying.</p></div>
   <div class="sec"><h3>Diagnoses</h3><p class="fine">Pick one or more. Each becomes a # problem with its own assessment and plan.</p><div class="chips">${c.dx.map(d=>chip('dx',d.id,S.dx.includes(d.id),cap(fillSide(d.t.replace(/\{(?!side|Side)\w+\}/g,'')).replace(/\s*,\s*$/,'').replace(/\(\s*\)/,'').replace(/\s{2,}/g,' ').replace(/ ,/g,',')))).join('')}</div></div>`;
  S.dx.forEach(id=>{const d=dxById(id);if(!d)return;pickDefault(d);const p=pk(d);
    body+=`<div class="dxcard"><h4># ${esc(headerOf(d))}</h4>
     ${pickList(d).map(([k,l,o])=>`<div class="pick"><div class="flab">${esc(l)}</div><div class="chips">${o.map(v=>chip('dp',id+'\u0001'+k+'\u0001'+v,p[k]===v,v===''?'None':cap(v.replace(/^[\s,]+/,'').replace(/^\((.*)\)$/,'$1')))).join('')}</div></div>`).join('')}
     <div class="flab">Plan</div><ul class="plan">${visLines(d).map(l=>{const on=lineOn(pkey(id),l);return `<li class="${on?'on':'off'}" data-a="pl" data-v="${pkey(id)}\u0001${l.i}" role="checkbox" aria-checked="${on}" tabindex="0"><span class="bx">${on?'✓':''}</span><span class="tx">${hl(fillDx(d,l.t))}</span></li>`;}).join('')}</ul>
     <div class="flab">Assessment</div><textarea class="full" data-asm="${id}" rows="4">${esc(asmOf(d))}</textarea>
     ${S.asm[id]&&S.asm[id].dirty?`<div class="row"><button class="btn sm" type="button" data-a="asmre" data-v="${id}">Rebuild assessment</button></div>`:''}
     ${d.kp?`<details class="kp"><summary>Key points</summary><ul>${d.kp.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="cite">${esc(d.src||'')}</div></details>`:''}</div>`;});
  const sm=suggestedMods();
  body+=`<div class="sec"><h3>Add-on plans</h3><p class="fine">Suggested ones are on. Lines merge into the first problem; non-accidental trauma becomes its own problem.</p>
    <div class="chips">${MOD_ORDER.map(k=>chip('mod',k,modOn(k),MODS[k].n+(sm[k]?' ·':''))).join('')}</div>
    ${!wt()&&(modOn('analg')||modOn('open'))?`<div class="warn">Add a weight on the Patient step to dose these.</div>`:''}
    ${MOD_ORDER.filter(modOn).map(k=>`<div class="dxcard"><h4>${esc(MODS[k].n)}</h4><ul class="plan">${planLines(MODS[k].p).map(l=>{const on=lineOn('m_'+k,l);return `<li class="${on?'on':'off'}" data-a="pl" data-v="m_${k}\u0001${l.i}" role="checkbox" aria-checked="${on}" tabindex="0"><span class="bx">${on?'✓':''}</span><span class="tx">${hl(tok(fillSide(l.t)))}</span></li>`;}).join('')}</ul></div>`).join('')}</div>`;
  const side=pane('Live','Assessment and plan','# header, italic assessment, bulleted plan. Copies with italics and bullets.',`<div class="out">${apPreview()}</div>
   <div class="copyrow"><button class="btn primary" type="button" data-a="copy" data-v="ap">Copy A/P</button><button class="btn" type="button" data-a="copy" data-v="applain">Copy plain</button></div>`,'side');
  return `<div class="grid">${pane('Step 5','Assessment and plan',`${esc(c.n)}`,body)}${side}</div>`;}

function vNote(){const c=cc();if(!c)return needCC();const n=noteParts();
  return `<div class="grid one">${pane('Step 6','Note','HPI, focused exam, and A/P together. Copy everything, or one section at a time.',`
   <div class="copyrow"><button class="btn primary" type="button" data-a="copy" data-v="all">Copy full note</button><button class="btn" type="button" data-a="copy" data-v="allplain">Copy as plain text</button><button class="btn" type="button" data-a="copy" data-v="hpi">HPI</button><button class="btn" type="button" data-a="copy" data-v="ex">Exam</button><button class="btn" type="button" data-a="copy" data-v="ap">A/P</button></div>
   <div class="out"><p class="sech">HPI</p><p>${hl(n.hpi)}</p><p class="sech">Physical exam</p>${n.ex?n.ex.split('\n').map(l=>`<p${/:$/.test(l)?' class="exh"':''}>${hl(l)}</p>`).join(''):'<p class="fine">Nothing examined yet.</p>'}<p class="sech">Assessment and plan</p>${apPreview()}</div>`)}</div>`;}
function needCC(){return `<div class="grid one">${pane('','Pick a complaint first','The history, exam, and plan depend on the complaint.',`<div><button class="btn primary" type="button" data-a="go" data-v="1">Choose a complaint</button></div>`)}</div>`;}

/* ---------- render ---------- */
function stepShort(i){const c=cc();
  if(i===0)return S.age?`${ageTxt()} ${S.sex?sexL():''}${S.wt?' · '+S.wt+' kg':''}`:'Age, sex, weight';
  if(i===1)return c?c.n+(S.side?' · '+S.side:''):'Not chosen';
  if(i===2){if(!c)return'';const t=hTally();return t.left?`${t.left} to ask`:'All asked';}
  if(i===3){if(!c)return'';const t=exTally();return t.left?`${t.left} to examine`:'Complete';}
  if(i===4)return S.dx.length?`${S.dx.length} problem${S.dx.length>1?'s':''}`:'No diagnosis yet';
  return'Copy';}
function render(keep){
  $('steps').innerHTML=STEPS.map((n,i)=>`<button type="button" class="stepbtn" data-a="go" data-v="${i}" ${i===S.step?'aria-current="step"':''}><span class="n">${i+1}</span><span class="t">${n}</span><span class="sh">${esc(stepShort(i))}</span></button>`).join('');
  const y=keep?window.scrollY:0;
  $('main').innerHTML=[vPatient,vComplaint,vHPI,vExam,vAP,vNote][S.step]();
  footer();if(keep)window.scrollTo(0,y);}
function footer(){$('back').style.visibility=S.step===0?'hidden':'visible';$('next').textContent=S.step===5?'Copy note':'Next';
  const c=cc();if(!c){$('where').textContent='No complaint chosen';return;}
  const t=hTally(),e=exTally();$('where').innerHTML=`${esc(c.n)} · ${t.left?`${t.left} to ask${t.red?` (<b>${t.red} red flag${t.red>1?'s':''}</b>)`:''}`:'history done'} · ${e.must?`<b>${e.must} must-document</b>`:e.left?`${e.left} to examine`:'exam done'}`;}
function refreshSide(){ // live panes without a full re-render (keeps focus while typing)
  const ho=$('hpiOut');if(ho&&!S.hpiDirty)ho.value=buildHPI();
  const eo=$('exOut');if(eo)eo.value=buildExam();
  const ap=document.querySelector('.pane.side .out');if(ap&&S.step===4)ap.innerHTML=apPreview();
  footer();}

function toggle(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
async function copyRich(html,plain,msg){try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);toast(msg);return;}throw 0;}catch(_){copyPlain(plain,msg);}}
async function copyPlain(text,msg){try{await navigator.clipboard.writeText(text);toast(msg);}catch(_){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(__){}t.remove();toast(ok?msg:'Copy blocked here. Select the text and copy it.');}}
function doCopy(v){
  if(v==='hpi')return copyPlain(hpiText(),'HPI copied.');
  if(v==='ex')return copyPlain(buildExam(),'Exam copied.');
  if(v==='ap')return copyRich(apRich(),apPlain(),'A/P copied with italics and bullets.');
  if(v==='applain')return copyPlain(apPlain(),'A/P copied as plain text.');
  if(v==='all')return copyRich(noteRich(),notePlain(),'Full note copied.');
  if(v==='allplain')return copyPlain(notePlain(),'Full note copied as plain text.');}
function resetComplaint(){Object.assign(S,{side:'',when:'',mech:'',mechTxt:'',ht:'',wit:'',imm:[],use:'',onset:'',ago:'',course:'',timing:[],sev:null,loc:[],agg:[],rel:[],prior:'',marks:{},idet:{},det:{},picks:{},resp:'',ex:{},exm:{},exd:{},xr:[],f:[],ftxt:'',dx:[],dp:{},plan:{},mods:{},modsSet:false,asm:{},hpi:'',hpiDirty:false});}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  const singles=['unit','sex','set','hand','side','wit','use','onset','agoU','course','prior','resp','fvis','fwhere','fimg','fagoU','fcomp','fpain'];
  const wasFU=FU();
  if(singles.includes(a)){S[a]=S[a]===v&&!['unit','agoU'].includes(a)?'':v;if(a==='side'){/* headers depend on side */}}
  else if(a==='mech'){S.mech=S.mech===v?'':v;}
  else if(['src','imm','timing','loc','agg','rel','xr','f','ftx'].includes(a))toggle(S[a],v);
  else if(a==='sev'){const n=+v;S.sev=S.sev===n?null:n;}
  else if(a==='cc'){if(S.cc!==v){S.cc=v;resetComplaint();}if(C[v].sd===0){S.step=2;window.scrollTo(0,0);}else if(S.side){S.step=2;window.scrollTo(0,0);}render(S.step===1);return;}
  else if(a==='hpick'){const [si,ii]=v.split('.').map(Number);S.picks[si]=S.picks[si]===ii?null:ii;if(S.picks[si]==null)delete S.picks[si];}
  else if(a==='tri'){const m=S.marks[v];if(!m)S.marks[v]='p';else if(m==='p')S.marks[v]='n';else delete S.marks[v];}
  else if(a==='restneg'){hItems().filter(x=>x.si===+v&&!S.marks[x.key]).forEach(x=>S.marks[x.key]='n');}
  else if(a==='rebuild'){S.hpiDirty=false;}
  else if(a==='ex'){const m=S.ex[v];if(!m)S.ex[v]='n';else if(m==='n')S.ex[v]='a';else delete S.ex[v];}
  else if(a==='itnorm'){elems(v).forEach(el=>S.ex[v+'.'+el.i]='n');}
  else if(a==='allnorm'){exGroups().forEach(g=>g.ids.forEach(id=>elems(id).forEach(el=>{if(!S.ex[id+'.'+el.i])S.ex[id+'.'+el.i]='n';})));}
  else if(a==='exclear'){S.ex={};S.exm={};S.exd={};}
  else if(a==='dx'){toggle(S.dx,v);}
  else if(a==='dp'){const [id,k,val]=v.split('\u0001');const p=S.dp[id]||(S.dp[id]={});p[k]=p[k]===val&&!pickList(dxById(id)).find(x=>x[0]===k)[2].includes('')?undefined:val;if(p[k]===undefined)delete p[k];}
  else if(a==='pl'){const [k,i]=v.split('\u0001');const l=(k.startsWith('m_')?planLines(MODS[k.slice(2)].p):planLines(planOf(dxById(k.replace(/^f_/,''))).p))[+i];S.plan[k]=S.plan[k]||{};S.plan[k][+i]=!lineOn(k,l);}
  else if(a==='mod'){if(!S.modsSet){S.modsSet=true;const sm=suggestedMods();MOD_ORDER.forEach(k=>S.mods[k]=!!sm[k]);}S.mods[v]=!S.mods[v];}
  else if(a==='asmre'){delete S.asm[v];}
  else if(a==='go'){S.step=+v;window.scrollTo(0,0);render();return;}
  else if(a==='copy'){doCopy(v);return;}
  else return;
  if(FU()!==wasFU){S.marks={};S.idet={};S.det={};S.asm={};S.hpiDirty=false;S.mods={};S.modsSet=false;}
  render(true);});
document.addEventListener('keydown',e=>{const li=e.target.closest&&e.target.closest('li[data-a]');if(li&&(e.key==='Enter'||e.key===' ')){e.preventDefault();li.click();}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.t){S[el.dataset.t]=el.value;
    if(el.dataset.t==='q'){const pos=el.selectionStart;render(true);const q=$('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}return;}
    if(['age','wt','sex'].includes(el.dataset.t)){const sb=document.querySelectorAll('.stepbtn .sh')[0];if(sb)sb.textContent=stepShort(0);const dl=$('doseEx');if(dl)dl.textContent=wt()?`Example: acetaminophen ${fmt(dz(15,1000))} mg, ibuprofen ${fmt(dz(10,600))} mg.`:'';}
    refreshSide();return;}
  if(el.dataset.d!=null){S.det[el.dataset.d]=el.value;refreshSide();return;}
  if(el.dataset.i!=null){S.idet[el.dataset.i]=el.value;refreshSide();return;}
  if(el.dataset.m!=null){S.exm[el.dataset.m]=el.value;refreshSide();return;}
  if(el.dataset.x!=null){S.exd[el.dataset.x]=el.value;refreshSide();return;}
  if(el.dataset.asm!=null){S.asm[el.dataset.asm]={t:el.value,dirty:true};refreshSide();return;}
  if(el.id==='hpiOut'){S.hpi=el.value;if(!S.hpiDirty){S.hpiDirty=true;render(true);const o=$('hpiOut');o.focus();o.setSelectionRange(o.value.length,o.value.length);}}});
$('back').addEventListener('click',()=>{if(S.step>0){S.step--;window.scrollTo(0,0);render();}});
$('next').addEventListener('click',()=>{if(S.step===5){doCopy('all');return;}if(S.step===1&&!S.cc){toast('Pick a complaint first.');return;}S.step++;window.scrollTo(0,0);render();});
$('reset').addEventListener('click',()=>{const b=$('reset');if(b.dataset.armed){S=blank();delete b.dataset.armed;b.textContent='New patient';render();window.scrollTo(0,0);}else{b.dataset.armed='1';b.textContent='Tap again to clear';setTimeout(()=>{delete b.dataset.armed;b.textContent='New patient';},2500);}});
render();
</script>
