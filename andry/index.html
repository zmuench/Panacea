<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Andry">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<title>Andry</title>
<style>
/* Andry: pediatric orthopaedics H&P. One complaint drives the HPI (Hx format), the focused exam (Px style, explicit
   negatives), and the assessment and plan (A/P format: # header, italic assessment, bulleted plan).
   Named for Nicolas Andry, who coined "orthopaedia" (1741) and drew the crooked tree tied to a stake.
   Base palette matches PANACEA; ehr.css (loaded last) applies the shared EHR look. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;--sunk:#F4F6F8;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --pos:#A8261C;--pos-soft:#FBE7E5;--neg:#1D6E49;--neg-soft:#E1F2E9;--amber:#8A5A00;--amber-soft:#FCF0D6;--paper:#FBFCFD;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-note:Georgia,"Times New Roman",serif;
  color-scheme:light only;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 90px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:1.5rem}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);text-decoration:none}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:38px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;margin-top:10px}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.stepbtn .n{font-size:.7rem;font-weight:700;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .sh{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:6px}
.grid.one{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pane.side{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}
.ph{display:flex;flex-direction:column;gap:3px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.3rem}
.ph .cue{margin:0;color:var(--muted);font-size:.9rem}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h3{margin:0;font-size:.98rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h3 .aside{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:700}
.sec h3 .aside.done{color:var(--neg)}
.kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.flab{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:.88rem;text-align:left;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.pos{background:var(--pos-soft);border-color:var(--pos);color:var(--pos);font-weight:700}
.chip.neg{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.chip.rf{border-style:dashed;border-color:var(--pos)}
.chip .mk{font:700 14px var(--f-note);min-width:10px;text-align:center}
.chip small{font-size:.72rem;opacity:.8;font-weight:400}
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.dot.p{background:var(--pos-soft);border-color:var(--pos)}.dot.n{background:var(--neg-soft);border-color:var(--neg)}.dot.r{border-style:dashed;border-color:var(--pos)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.in{display:flex;flex-direction:column;gap:3px;min-width:92px;flex:1 1 92px;max-width:170px}
.in>span{font-size:.74rem;font-weight:700;color:var(--muted)}
.in input,.in select,.in textarea,input.full,textarea.full{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);font-size:16px;width:100%;min-height:38px}
.in.wide{max-width:none;flex:2 1 220px}
.in.xs{max-width:96px;min-width:70px;flex:0 1 84px}
textarea.full{min-height:70px;resize:vertical;line-height:1.4}
.fine{font-size:.8rem;color:var(--muted);margin:0}
.ask{padding:6px 8px;border-left:3px solid var(--pos);background:var(--pos-soft);border-radius:0 8px 8px 0;color:var(--pos);font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.ask input{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:16px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:none;background:var(--sunk);min-width:34px;height:34px;cursor:pointer;border-left:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:#fff}
.grp{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.grp-h{font-weight:700;font-size:.82rem;color:var(--muted)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.item.done{border-color:#BFDCCB}
.item-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-h b{font-size:.95rem}
.item-h .sp{flex:1}
.item .det{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:16px;background:#fff;width:100%}
.meas{display:flex;flex-wrap:wrap;gap:8px}
.meas label{display:flex;flex-direction:column;font-size:.7rem;font-weight:700;color:var(--muted);gap:2px;width:96px}
.meas input{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:16px;background:#fff;width:100%}
.grouph{font-weight:700;font-size:.85rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.dxcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.dxcard h4{margin:0;font-size:1rem}
.pick{display:flex;flex-direction:column;gap:4px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plan li{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
.plan li:hover{background:var(--sunk)}
.plan li .bx{flex:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-size:12px;margin-top:1px;background:#fff}
.plan li.on .bx{background:var(--accent);border-color:var(--accent);color:#fff}
.plan li.off{color:var(--muted)}
.plan li.off .tx{text-decoration:none}
details.kp{background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:.86rem}
details.kp summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.kp ul{margin:6px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.cite{font-size:.75rem;color:var(--muted);font-style:italic}
.out{font:400 .98rem/1.55 var(--f-note);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-wrap:break-word}
.out p{margin:0}
.out .bh{font-family:var(--f-body);font-weight:700;margin-top:10px}
.out .bh:first-child{margin-top:0}
.out ul{margin:2px 0 0;padding-left:20px;white-space:normal}
.out .sech{font-family:var(--f-body);font-weight:700;color:var(--accent);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 4px}
.out .sech:first-child{margin-top:0}
.out .exh{font-weight:700}
.out .hole{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
textarea.out{width:100%;min-height:260px;white-space:pre-wrap;resize:vertical}
.coach{border:1.5px solid var(--pos);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.coach h3{color:var(--pos);margin:0;font-size:.95rem}
.ok{background:var(--neg-soft);color:var(--neg);border-radius:10px;padding:8px 12px;font-size:.88rem}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:.86rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 200px}
.warn{background:var(--pos-soft);color:var(--pos);border-radius:10px;padding:8px 12px;font-size:.86rem}
.copyrow{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.barin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px}
.barin .where{flex:1;font-size:.85rem;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barin .where b{color:var(--pos)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cgroup{display:flex;flex-direction:column;gap:6px}
.dose{font-size:.78rem;color:var(--muted)}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .pane.side{position:static;max-height:none}
  .steps{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
  .stepbtn{padding:6px 6px}
  .stepbtn .t{font-size:.8rem}
  .stepbtn .sh{display:none}
  .pane{padding:14px}
}
@media (max-width:480px){.stepbtn .n{display:none}.stepbtn{align-items:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../" aria-label="PANACEA home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></a><h1>Andry</h1></div>
      <p>Pediatric orthopaedics: HPI, focused exam, and assessment and plan from one complaint.</p>
    </div>
    <div class="row"><button class="btn sm" type="button" id="reset">New patient</button></div>
  </div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <div id="main"></div>
</div>
<footer class="bar"><div class="barin"><button class="btn" type="button" id="back">Back</button><div class="where" id="where"></div><button class="btn primary" type="button" id="next">Next</button></div></footer>
<script>
/* ---------- Exam library ----------
   E[id] = [title, normal sentence (used when every element is marked normal), [elements], measures]
   element "normal phrase|abnormal phrase"; a leading ! marks a must-document item.
   measures: [[key,label,unit]] numeric fields written after the item text.
   Exam technique and normal values follow Reider, The Orthopaedic Physical Exam (2nd ed.),
   Sarwark Ch 4, and Staheli Ch 2 (rotational profile). */
const E={
/* general */
gen:['General','Well-appearing, in no acute distress.',['well-appearing|ill- or toxic-appearing','in no acute distress|visible distress from pain','consolable and interactive|irritable or inconsolable']],
gait:['Gait','Ambulates independently with a normal, symmetric gait.',['!bears full weight on the affected limb|refuses to bear weight on the affected limb','no antalgic gait|antalgic gait','no Trendelenburg lurch|Trendelenburg (abductor) lurch','normal heel strike|toe walking','no circumduction or vaulting|circumduction or vaulting']],
survey:['Secondary survey','No tenderness or deformity of the other extremities, clavicles, pelvis, or spine; no concerning bruising.',['no tenderness or deformity of the other extremities|tenderness or deformity of another extremity','no midline spinal tenderness|midline spinal tenderness','pelvis stable and nontender|pelvic tenderness','no bruising of the torso, ears, neck, frenulum, jaw, cheeks, eyelids, or subconjunctivae (TEN-4-FACESp)|bruising in a TEN-4-FACESp distribution','no patterned bruises or burns|patterned bruises or burns']],
/* shoulder, clavicle, humerus */
cl_insp:['Clavicle and shoulder inspection','No deformity, swelling, or ecchymosis of the clavicle or shoulder; skin intact.',['no clavicle deformity|clavicle deformity','!no skin tenting|skin tenting over the fracture','!skin intact|open wound','no shoulder asymmetry or swelling|shoulder swelling or asymmetry','arm held normally|arm held adducted against the body']],
cl_palp:['Clavicle and shoulder palpation','Nontender along the clavicle, SC and AC joints, and proximal humerus.',['nontender over the midshaft clavicle|tender over the midshaft clavicle','nontender over the medial clavicle and SC joint|tender over the medial clavicle and SC joint','nontender over the lateral clavicle and AC joint|tender over the lateral clavicle and AC joint','nontender over the proximal humerus|tender over the proximal humerus','no crepitus|crepitus at the fracture']],
sh_rom:['Shoulder range of motion','Full active shoulder range of motion without pain.',['full active forward flexion and abduction|active shoulder motion limited by pain','full internal and external rotation|limited rotation','stable to apprehension testing|positive apprehension and relocation']],
nv_ax:['Axillary nerve','Axillary nerve intact: sensation over the lateral shoulder and deltoid firing.',['!axillary sensation intact over the lateral shoulder|decreased sensation over the lateral shoulder','deltoid fires|no deltoid activation']],
mediast:['Mediastinal screen','No dyspnea, stridor, dysphagia, or venous congestion of the arm or neck.',['!no dyspnea or stridor|dyspnea or stridor','!no dysphagia|dysphagia','no venous congestion of the arm or neck|venous congestion of the arm or neck']],
/* elbow */
el_insp:['Elbow inspection','No elbow deformity or swelling; skin intact without tenting, puckering, or wounds.',['no deformity|gross deformity (S-shaped arm)','no swelling|elbow swelling','no antecubital ecchymosis|antecubital ecchymosis','!no skin tenting or pucker sign|skin puckering or tenting (pucker sign) at the antecubital fossa','!skin intact without puncture wounds|puncture wound or open wound','no posterior olecranon abrasion|abrasion over the posterior olecranon (flexion mechanism)','arm held normally|arm held flexed and pronated against the body']],
el_palp:['Elbow palpation','No tenderness about the elbow.',['nontender at the supracondylar humerus|tender at the supracondylar humerus','nontender at the lateral condyle|tender at the lateral condyle','nontender at the medial epicondyle|tender at the medial epicondyle','nontender at the radial head|tender at the radial head','nontender at the olecranon|tender at the olecranon','no palpable effusion in the posterolateral soft spot|effusion in the posterolateral soft spot']],
el_rom:['Elbow range of motion','Full active elbow flexion, extension, pronation, and supination without pain.',['full flexion and extension|flexion and extension limited by pain','full pronation and supination|pronation and supination limited by pain','normal carrying angle compared with the contralateral side|altered carrying angle (cubitus varus or valgus)','stable to valgus stress|laxity or pain with valgus stress','no mechanical block to motion|mechanical block to motion (possible entrapped fragment)']],
nv_ue:['Neurovascular','Radial pulse 2+, hand warm and well perfused with capillary refill under 2 seconds; AIN, PIN, and ulnar motor function intact; median, radial, and ulnar sensation intact.',['!radial pulse palpable|radial pulse not palpable','!hand warm and pink with capillary refill under 2 seconds|hand pale or cool with delayed capillary refill','!AIN intact (thumb IP and index DIP flexion, OK sign)|AIN deficit (unable to flex the thumb IP or index DIP)','!PIN intact (thumb IP and finger MCP extension)|PIN deficit (unable to extend the thumb or fingers)','!ulnar motor intact (finger abduction, crossed fingers)|ulnar motor deficit (unable to abduct or cross the fingers)','median sensation intact (volar index tip)|decreased median sensation','radial sensation intact (dorsal first web space)|decreased radial sensation','ulnar sensation intact (volar small finger tip)|decreased ulnar sensation']],
comp_fa:['Compartments','Forearm and hand compartments soft and compressible; no pain with passive finger stretch.',['!forearm compartments soft and compressible|forearm compartments tense','!no pain with passive finger extension|pain with passive finger extension','no escalating analgesic need, agitation, or anxiety|escalating analgesic need, agitation, or anxiety (3 As)']],
/* forearm, wrist, hand */
fa_insp:['Forearm and wrist inspection','No forearm or wrist deformity or swelling; skin intact.',['no deformity|angular deformity of the forearm','no dorsal (dinner-fork) deformity of the wrist|dorsal deformity of the distal forearm','no swelling|swelling','!skin intact, no puncture wounds|puncture wound or open wound']],
fa_palp:['Forearm and wrist palpation','No tenderness of the radius, ulna, distal physes, or carpus.',['nontender along the radial shaft|tender along the radial shaft','nontender along the ulnar shaft|tender along the ulnar shaft','nontender at the distal radius metaphysis|tender at the distal radius metaphysis','nontender at the distal radial physis|tender at the distal radial physis','nontender at the distal ulna|tender at the distal ulna','!no anatomic snuffbox tenderness|anatomic snuffbox tenderness','no scaphoid tubercle tenderness|scaphoid tubercle tenderness','!elbow nontender with full motion|elbow tenderness or limited motion']],
wr_rom:['Wrist range of motion','Full wrist flexion, extension, radial and ulnar deviation, and forearm rotation.',['full wrist flexion and extension|wrist motion limited by pain','full forearm pronation and supination|forearm rotation limited by pain','no pain with axial thumb loading|pain with axial loading of the thumb']],
hd_insp:['Hand inspection','No deformity, swelling, or rotational malalignment of the digits; nail beds intact.',['no angular deformity of the digits|angular deformity of the digit','!no rotational malalignment or scissoring with composite fist|rotational malalignment with scissoring on composite fist','no swelling|swelling of the digit','!nail plate and nail bed intact|nail plate avulsed or nail bed laceration','!no proximal nail fold blood|blood at the proximal nail fold (possible Seymour fracture)','normal resting cascade|disrupted resting cascade']],
hd_palp:['Hand palpation','No tenderness of the metacarpals or phalanges.',['nontender over the metacarpals|tender over the metacarpal','nontender over the proximal phalanx|tender over the proximal phalanx','nontender over the middle and distal phalanges|tender over the middle or distal phalanx']],
hd_tend:['Tendons and joints','FDS and FDP intact to each digit; collateral ligaments stable; no extensor lag.',['FDS intact|FDS deficit','FDP intact|FDP deficit','no extensor lag (mallet)|extensor lag at the DIP (mallet)','collaterals stable|collateral laxity','thumb UCL stable|thumb UCL laxity']],
/* hip, pelvis, thigh */
hip_insp:['Hip inspection','Lies comfortably with the hip in neutral; no deformity, shortening, or swelling.',['lies comfortably with the hip in neutral|holds the hip flexed, abducted, and externally rotated','no limb shortening or rotation|limb shortened and externally rotated','no swelling or erythema|swelling or erythema of the hip or thigh']],
hip_palp:['Hip and pelvis palpation','Nontender over the hip, groin, greater trochanter, pelvic apophyses, and thigh.',['nontender in the groin|groin tenderness','nontender over the greater trochanter|greater trochanter tenderness','nontender over the ASIS and AIIS|tender over the ASIS or AIIS','nontender over the ischial tuberosity|tender over the ischial tuberosity','nontender over the iliac crest|tender over the iliac crest','nontender over the sacroiliac joint|sacroiliac tenderness','nontender over the femoral shaft|tender over the femoral shaft']],
hip_rom:['Hip range of motion','Full, painless hip flexion, internal and external rotation, and abduction; negative log roll.',['!log roll painless|pain with log roll','full flexion|flexion limited','!internal rotation full and painless|internal rotation limited or painful','external rotation full|external rotation limited','abduction full|abduction limited','!no obligate external rotation with flexion|obligate external rotation with hip flexion','no pain at extremes of motion|pain at the extremes of motion','!tolerates passive motion|exquisite pain with any passive motion']],
hip_spec:['Hip special tests','Negative FADIR, FABER, and Trendelenburg tests.',['negative FADIR|pain with FADIR (flexion, adduction, internal rotation)','negative FABER|pain with FABER','negative Trendelenburg sign|positive Trendelenburg sign','negative Thomas test (no flexion contracture)|positive Thomas test (hip flexion contracture)','resisted straight-leg raise painless|pain with resisted hip flexion']],
hip_inf:['Infant hip screen','Negative Barlow and Ortolani; symmetric abduction to more than 60 degrees; negative Galeazzi; symmetric thigh and gluteal folds.',['!negative Barlow|positive Barlow (hip dislocatable)','!negative Ortolani|positive Ortolani (dislocated hip reduces with a clunk)','!abduction symmetric and greater than 60 degrees|limited abduction','negative Galeazzi|positive Galeazzi (apparent femoral shortening)','symmetric thigh and gluteal folds|asymmetric thigh or gluteal folds','negative Klisic test|positive Klisic test (line points below the umbilicus)'],[['abdR','Abduction R','°'],['abdL','Abduction L','°']]],
hip_nm:['Hip (neuromuscular)','Hip abduction with hips extended greater than 45 degrees bilaterally; no flexion contracture; negative Galeazzi; no windswept posture.',['!abduction in extension symmetric and greater than 45 degrees|abduction in extension limited','no hip flexion contracture|hip flexion contracture','negative Galeazzi|positive Galeazzi','no windswept posture|windswept posture','no pain with hip motion|pain with hip motion'],[['abdR','Abduction R','°'],['abdL','Abduction L','°'],['popR','Popliteal angle R','°'],['popL','Popliteal angle L','°']]],

  kp:['Modified Gartland: I nondisplaced (may show only a posterior fat pad); IIA posterior cortex hinged, no rotation; IIB hinged with rotation or translation; III no cortical contact; IV unstable in both flexion and extension (found under anesthesia).','The AIN is the nerve most often injured in extension-type fractures: test thumb IP and index DIP flexion, since it has no sensory territory. The ulnar nerve is at risk in flexion-type fractures and with medial pins.','The anterior humeral line should pass through the middle third of the capitellum on a true lateral. Compare the Baumann angle with the other side for coronal alignment.','Little remodeling occurs at the distal humerus. An unreduced type III heals into cubitus varus, which needs an osteotomy later.','A pucker sign means the proximal spike has buttonholed through brachialis, so expect a difficult closed reduction. Do not hyperflex a swollen elbow or apply tight circumferential dressings.'],

   '[d=displaced 2 mm or more]Open reduction and internal fixation (tension band)',

  kp:['A posterior fat pad indicates an occult fracture in about 76% of cases, about half of them supracondylar.','Obtain an internal oblique view when the AP and lateral are negative but suspicion is high.'],
  src:'Sarwark Ch 44'},
 {id:'tp',t:'{side} transphyseal distal humerus separation',a:'Findings are consistent with a transphyseal separation of the distal humerus.',

 xr:['XR {side} clavicle (AP and 15 to 30 degree cephalic tilt)','XR {side} shoulder (AP, scapular Y, axillary)','XR {side} humerus (AP and lateral)','CT chest with contrast (posterior SC injury)'],
 f:['midshaft clavicle fracture','shortening *** cm','100% displacement','distal clavicle fracture','medial clavicle physeal injury, posteriorly displaced','proximal humerus physeal fracture, angulation *** degrees','proximal humerus metaphyseal fracture','glenohumeral dislocation (anterior)','Hill-Sachs or bony Bankart lesion','lesion at the fracture (possible pathologic fracture)'],
 dx:[
 {id:'clav',t:'{o} {side} midshaft clavicle fracture',a:'Findings are consistent with a {o} {side} midshaft clavicle fracture.',pk:[['o','Skin',['closed','open']],['sk','Skin',['skin not threatened','skin tenting']]],
  p:['Sling for comfort for 2 to 4 weeks; figure-of-eight bracing is not needed',
   'Range of motion as comfort allows; no contact sports for 6 to 8 weeks or until healed clinically and on XR',
   '[sk=skin tenting]Skin tenting: discuss ORIF to prevent conversion to an open fracture',
   '[o=open]Open fracture: irrigation and debridement with ORIF',
   '?Adolescent with shortening over 2 cm or 100% displacement: discuss operative versus nonoperative care (recent pediatric trials show similar function)',
   'A palpable callus bump is expected and remodels over 6 to 12 months',
   'Follow-up in clinic in 3 to 4 weeks with XR {side} clavicle'],
  kp:['Nearly all pediatric clavicle fractures heal and remodel; nonunion is rare.','Surgical indications: open fracture, skin at risk, neurovascular injury, floating shoulder. Displacement alone in an adolescent is debated.','A figure-of-eight strap is uncomfortable and no better than a sling.'],
  src:'Staheli Ch 4 (clavicle fractures; figure-of-eight splint); Sarwark Ch 44'},
 {id:'mclav',t:'{side} medial clavicle physeal injury, {d}',a:'Findings are concerning for a {d} medial clavicle physeal fracture.',pk:[['d','Direction',['anteriorly displaced','posteriorly displaced (retrosternal)']]],
  p:['[d=posteriorly displaced (retrosternal)]CT chest with contrast to assess the great vessels, trachea, and esophagus',
   '[d=posteriorly displaced (retrosternal)]Urgent closed or open reduction in the OR with thoracic or vascular surgery available',
   '[d=anteriorly displaced]Sling; closed reduction is often unstable and a prominence is cosmetic only',
   'Mediastinal symptoms (dyspnea, dysphagia, stridor, venous congestion) are an emergency'],
  kp:['Before about 23 to 25 years the medial clavicle physis is open, so what looks like an SC dislocation is usually a physeal fracture.','Posterior displacement can compress the mediastinum. The serendipity view or CT makes the diagnosis.'],
  src:'Staheli Ch 4 (clavicle physeal fractures)'},
 {id:'dclav',t:'{side} distal clavicle fracture',a:'Findings are consistent with a distal clavicle fracture (pseudo-AC injury).',
  p:['Sling for 2 to 3 weeks; the periosteal sleeve stays attached to the coracoclavicular ligaments and remodels',
   'Follow-up in clinic in 3 weeks with XR {side} clavicle'],kp:['In children, apparent AC separations are usually distal physeal fractures with an intact periosteal tube.'],src:'Staheli Ch 4'},
 {id:'ph',t:'{side} proximal humerus fracture, {d}',a:'Findings are consistent with a {side} proximal humerus fracture, {d}.',
  pk:[['d','Displacement',['minimally displaced','angulated, within acceptable limits for age','angulated beyond acceptable limits for age']]],
  p:['[d=minimally displaced,angulated, within acceptable limits for age]Sling or shoulder immobilizer for 2 to 3 weeks, then pendulums and progressive motion',
   '[d=angulated, within acceptable limits for age]The proximal humeral physis provides about 80% of humeral growth and remodels large deformities in younger children',
   '[d=angulated beyond acceptable limits for age]Closed reduction with percutaneous pinning or flexible nails (adolescents near maturity)',
   'If the fracture is through a lesion, see the bone lesion plan (unicameral bone cyst is the classic cause)',
   'Follow-up in clinic in 1 to 2 weeks with XR {side} shoulder'],
  kp:['Accepted angulation is wide in young children (often 60 degrees or more before 10 years) and narrows toward maturity (about 30 to 40 degrees in adolescents).','Look for a cyst: a pathologic fracture through a unicameral bone cyst often shows the fallen-fragment sign.'],
  src:'Staheli Ch 4 (remodeling of the proximal humerus)'},
 {id:'shd',t:'{side} anterior shoulder dislocation, {f}',a:'Findings are consistent with a {f} anterior glenohumeral dislocation.',
  pk:[['f','Episode',['first-time','recurrent']]],
  p:['Closed reduction with post-reduction XR and axillary nerve exam',
   'Sling for comfort for 1 to 2 weeks, then therapy for rotator cuff and scapular strengthening',
   '[f=recurrent]MRI arthrogram {side} shoulder for recurrent instability or a bony lesion',
   '?Adolescent contact athlete: discuss early stabilization (recurrence rates are high after a first dislocation in teenagers)',
   'Follow-up in clinic in 1 to 2 weeks'],
  kp:['Adolescents with open physes have the highest recurrence rates after a first-time anterior dislocation.','Check axillary nerve sensation before and after reduction.'],
  src:'Sarwark Ch 31'}
 ]},

forearm:{n:'Forearm injury',g:'Upper extremity injury',cc:'{side} forearm pain and deformity after a fall',tr:1,r:'upper extremity',or:1,mods:['analg','nv'],
 mech:MECH_UE,
 h:[SX_UE,PMH_TR,NAT_H,TX_TR,ANES_H],
 ex:'G: gen survey | R=upper extremity: fa_insp fa_palp wr_rom el_insp el_palp el_rom nv_ue comp_fa',
 xr:['XR {side} forearm (AP and lateral, including the wrist and elbow)','XR {side} elbow (AP and lateral)','XR {side} wrist (PA and lateral)'],
 f:['both-bone midshaft fracture','greenstick fracture','plastic deformation of the ulna','apex volar angulation *** degrees','apex dorsal angulation *** degrees','complete displacement with overlap','isolated ulna fracture','radiocapitellar line does not bisect the capitellum (radial head dislocated)','distal radioulnar joint widened (Galeazzi)','rotational malalignment (cortical width mismatch)'],
 dx:[
 {id:'bbfa',t:'{o} {side} both-bone forearm fracture, {d}',a:'Findings are consistent with a {o} {side} both-bone forearm fracture, {d}.',
  pk:[['o','Skin',['closed','open']],['d','Alignment',['within acceptable limits','beyond acceptable limits, reducible','unstable or irreducible']]],
  p:['[d=within acceptable limits]Long-arm cast with a good interosseous mold for 4 to 6 weeks (or long-arm 4 weeks then short-arm 2 weeks)',
   '[d=beyond acceptable limits, reducible]Closed reduction under procedural sedation (or hematoma or Bier block), then a well-molded long-arm cast or sugar-tong splint',
   '[d=unstable or irreducible]Elastic stable intramedullary nailing (flexible nails), or plate fixation in adolescents near maturity',
   '[o=open]Open fracture: irrigation and debridement with stabilization; small puncture wounds still count',
   'Acceptable alignment: under 9 years, up to 15 degrees of angulation and 45 degrees of malrotation; 9 years and older, up to 10 degrees of angulation and 30 degrees of malrotation; bayonet apposition is acceptable in young children',
   'Follow-up in clinic in 1 week with XR {side} forearm, then weekly for 3 weeks (most loss of reduction happens early)',
   'No contact sports for 6 to 8 weeks after cast removal (refracture risk is highest in the first months)'],
  kp:['Midshaft fractures remodel less than distal fractures; remodeling is greatest near the physis and in the plane of joint motion.','Malrotation does not remodel reliably. Compare cortical widths and the bicipital tuberosity and radial styloid, which should be 180 degrees apart.','Greenstick fractures may need the intact cortex completed to prevent recurrence of angulation.','Refracture is a known complication of both-bone fractures, so protect the arm after the cast comes off.'],
  src:'Sarwark Ch 44; Staheli Ch 4 (principles of reduction, remodeling)'},
 {id:'mont',t:'{side} Monteggia fracture-dislocation, Bado {b}',a:'Findings are consistent with a {side} Monteggia fracture-dislocation, Bado {b}, with an ulna fracture and radial head dislocation.',
  pk:[['b','Bado',['type I (anterior)','type II (posterior)','type III (lateral)','type IV (both bones with radial head dislocation)']],['u','Ulna',['plastic deformation or greenstick','complete transverse or short oblique','long oblique or comminuted']]],
  p:['Restore ulnar length and alignment; the radial head reduces when the ulna does',
   '[u=plastic deformation or greenstick]Closed reduction and long-arm cast in 100 to 110 degrees of flexion and supination (type I)',
   '[u=complete transverse or short oblique]Intramedullary fixation of the ulna if unstable after closed reduction',
   '[u=long oblique or comminuted]Open reduction and plate fixation of the ulna',
   'Confirm the radiocapitellar line bisects the capitellum on every view after reduction',
   'Check PIN function (most common nerve palsy, usually recovers)',
   'Follow-up in clinic in 1 week with XR {side} forearm and elbow, then weekly for 2 to 3 weeks'],
  kp:['Every isolated ulna fracture needs a dedicated elbow view; on every view the radiocapitellar line should bisect the capitellum.','A missed Monteggia leads to a chronic radial head dislocation with pain, stiffness, and deformity that is hard to fix late.'],
  src:'Sarwark Ch 44; Staheli Ch 4 (Monteggia equivalents)'},
 {id:'gal',t:'{side} Galeazzi fracture-dislocation',a:'Findings are consistent with a distal radius shaft fracture with DRUJ disruption (Galeazzi).',
  p:['Closed reduction and long-arm cast in supination for most children; ORIF in adolescents or if the DRUJ does not reduce',
   'Confirm DRUJ congruity on a true lateral after reduction','Follow-up in clinic in 1 week with XR {side} forearm and wrist'],
  kp:['The Galeazzi equivalent in children is a distal ulnar physeal separation rather than a DRUJ dislocation.'],src:'Sarwark Ch 44'}
 ]},

 dx:[
 {id:'buck',t:'{side} distal radius buckle fracture',a:'Findings are consistent with a stable buckle (torus) fracture of the distal radius.',
  p:['Removable wrist splint for 3 to 4 weeks, or a soft bandage as comfort allows; may remove for bathing',
   'No routine follow-up or repeat XR needed; return if pain persists after 3 to 4 weeks',
   'Return to non-contact activity as comfort allows; protect for contact sports up to 6 weeks'],
  kp:['A buckle fracture involves a single cortex. Any break in the opposite cortex makes it a complete fracture, which needs follow-up.','Level I evidence shows these were historically overtreated; healing is reliable without casting or imaging follow-up.'],
  src:'Sarwark Ch 44'},
 {id:'drf',t:'{o} {side} distal radius {ty} fracture, {d}',a:'Findings are consistent with a {o} {ty} fracture of the distal radius, {d}.',
  pk:[['o','Skin',['closed','open']],['ty','Pattern',['metaphyseal','Salter-Harris II physeal','Salter-Harris I physeal']],['d','Alignment',['within acceptable limits','beyond acceptable limits']]],
  p:['[d=within acceptable limits]Well-molded short-arm cast for 4 weeks (long-arm for the first 2 to 3 weeks if both bones are complete or unstable)',
   '[d=beyond acceptable limits]Closed reduction under procedural sedation or hematoma block, then a molded sugar-tong splint or cast (three-point mold, cast index under 0.8)',
   '[d=beyond acceptable limits]?Percutaneous pinning if unstable after reduction or if the ulna is intact with an overriding radius',
   '[ty=Salter-Harris II physeal,Salter-Harris I physeal]Physeal fracture: a single gentle reduction within the first 5 to 7 days; no repeat manipulation after a week (risk of physeal arrest); remodeling will correct residual angulation',
   '[ty=Salter-Harris II physeal,Salter-Harris I physeal]Follow for 6 to 12 months for growth arrest (ulnar positive variance or angulation)',
   'Acceptable sagittal angulation: about 20 degrees under 10 years, 15 degrees at 10 to 12, and 10 degrees in adolescents near maturity; bayonet apposition acceptable in young children with under 1 cm shortening',
   'Follow-up in clinic in 1 week with XR {side} wrist to confirm alignment (most redisplacement happens in the first 2 weeks)',
   '[o=open]Open fracture: irrigation and debridement; check for a volar puncture wound'],
  kp:['The distal radius remodels faster than any other site because its physis supplies about 75% of radial growth and the deformity lies in the plane of wrist motion.','Watch for acute carpal tunnel syndrome after displaced fractures: median numbness that progresses needs urgent reduction and release.','Physeal fractures should not be manipulated late, because repeat reduction after 5 to 7 days risks physeal injury.'],
  src:'Sarwark Ch 42 and 44; Staheli Ch 4 (remodeling of the wrist)'},
 {id:'scaph',t:'{side} scaphoid fracture, {d}',a:'Findings are most consistent with a {d} scaphoid fracture.',pk:[['d','Status',['nondisplaced','displaced','suspected (snuffbox tenderness, XR negative)']]],
  p:['[d=nondisplaced]Thumb spica cast for 6 weeks (up to 10 weeks if found late)',
   '[d=displaced]Open reduction and internal fixation (nonunion and osteonecrosis risk)',
   '[d=suspected (snuffbox tenderness, XR negative)]Thumb spica splint or cast with repeat XR {side} scaphoid series out of plaster in 2 weeks, or MRI {side} wrist if an answer is needed now',
   'No contact sports in the cast; follow-up in clinic in 2 weeks'],
  kp:['Scaphoid fractures are rare in young children and peak around 15 years.','Many are not visible on the first XR, so treat snuffbox tenderness as a fracture until proven otherwise.'],src:'Sarwark Ch 44'}
 ]},

  p:['[rot= without rotational malalignment]Buddy taping or an ulnar or radial gutter splint in the intrinsic-plus position for 3 weeks',

  kp:['Rotation does not remodel, so check for scissoring with a composite fist.','Phalangeal neck fractures remodel poorly in the coronal plane and often need pinning.'],src:'Staheli Ch 4 (hand injuries)'},
 {id:'seym',t:'{side} Seymour fracture (open distal phalanx physeal fracture)',a:'Findings are consistent with a Seymour fracture: an open physeal fracture of the distal phalanx with nail bed interposition.',

   'Follow-up in clinic in 1 week for a wound check'],
  kp:['Blood at the proximal nail fold with a flexed fingertip signals the diagnosis; it is easily mistaken for a mallet finger.','Untreated, it leads to osteomyelitis, physeal arrest, and nail deformity.'],src:'Staheli Ch 4 (mallet finger, articular fracture)'},
 {id:'mal',t:'{side} mallet finger, {ty}',a:'Findings are consistent with a {ty} mallet finger.',pk:[['ty','Type',['tendinous','bony (small fragment)','bony with joint subluxation']]],

 {id:'mc5',t:'{side} fifth metacarpal neck fracture',a:'Findings are consistent with a fifth metacarpal neck (boxer’s) fracture.',

 dx:[{id:'fem',t:'{o} {side} femoral shaft fracture',a:'Findings are consistent with a {o} {side} femoral shaft fracture in a {age} child.',
  pk:[['o','Skin',['closed','open']],['age','Age band',['0 to 6 month old','6 month to 5 year old','5 to 11 year old','11 year and older']],['st','Stability',['length-stable','length-unstable']]],
  p:['Long-leg posterior splint or traction for comfort until definitive care; femoral nerve or fascia iliaca block for analgesia',
   '[age=0 to 6 month old]Pavlik harness or soft spica for 3 to 4 weeks; up to 45 degrees of angulation remodels',
   '[age=0 to 6 month old]Skeletal survey and child abuse pediatrics consult (femur fracture in a non-ambulatory infant)',

   '[age=6 month to 5 year old]?Skeletal survey and child abuse evaluation if under 3 years or not yet walking, or if the history does not fit',
   '[age=5 to 11 year old;st=length-stable]Elastic stable intramedullary nailing (flexible nails)',
   '[age=5 to 11 year old;st=length-unstable]Submuscular bridge plating (or flexible nails with end caps); flexible nails are less reliable for length-unstable fractures or weight over 49 kg',
   '[age=11 year and older]Rigid lateral-entry (trochanteric) intramedullary nail; avoid piriformis entry (osteonecrosis risk)',
   '[o=open]Open fracture: irrigation and debridement with stabilization (external fixation for gross contamination)',
   'Type and screen; CBC',
   'Spica teaching and car seat assessment before discharge for spica patients',
   'Follow-up in clinic in 1 to 2 weeks with XR {side} femur'],
  kp:['Treatment is driven by age and size. Accept less shortening and angulation with age: about 30 degrees in infants, 15 degrees varus/valgus at 2 to 5 years, 10 degrees at 6 to 10, and 5 degrees at 11 and older.','In children 2 to 10, overgrowth of 1 to 2 cm is common after healing; older children tend toward shortening.','Femur fractures before walking age are frequently inflicted. After walking age most are accidental, and a spiral pattern in an ambulatory child is not by itself suspicious.','Blood loss into the thigh is real but rarely needs transfusion in isolated fractures; look for other injuries in high-energy mechanisms.'],
  src:'Sarwark Ch 45; Staheli Ch 4 (abuse; femoral shaft remodeling)'}]},

 {id:'lcp',t:'{side} Legg-Calvé-Perthes disease, {stg} stage{pil}',a:'Findings are consistent with Legg-Calvé-Perthes disease, {stg} stage{pil}, with onset at about {onset}.',pk:[['stg','Stage',['initial (sclerosis)','fragmentation','reossification','residual']],['pil','Lateral pillar',['',', lateral pillar A',', lateral pillar B',', lateral pillar B/C border',', lateral pillar C']],['onset','Age at onset',['under 6 years','6 to 8 years','8 to 11 years','over 11 years']]],

function ageY(){const a=parseFloat(S.age);if(isNaN(a))return null;return S.unit==='y'?a:S.unit==='m'?a/12:a/365;}
function gateOK(g){if(!g)return true;const y=ageY();
  if(g==='F')return S.sex!=='male';if(g==='M')return S.sex!=='female';
  if(g==='I')return y==null||y<1;if(g==='Y')return y==null||y<3;if(g==='O')return y==null||y>=10;return true;}
const cc=()=>S.cc?C[S.cc]:null;
const He=()=>S.sex==='male'?'He':S.sex==='female'?'She':'The patient';
const he=()=>S.sex==='male'?'he':S.sex==='female'?'she':'the patient';
const his=()=>S.sex==='male'?'his':S.sex==='female'?'her':'their';
const sideW=()=>S.side==='bilateral'?'bilateral':S.side||'';
const isUE=c=>/upper|hand/.test(c.r);
function fillSide(t){const sw=sideW();t=t.replace(/\{Side\}/g,cap(sw)).replace(/\{side\}/g,sw);return t.replace(/\s{2,}/g,' ').replace(/ ([,.)])/g,'$1').replace(/\( /g,'(').trim();}
function ageTxt(){const a=String(S.age).trim();if(!a)return'***';return a+' '+({y:'y/o',m:'m/o',d:'d/o'}[S.unit]);}
function sexL(){return{male:'M',female:'F'}[S.sex]||'***';}

/* ---------- dosing ---------- */
function wt(){const w=parseFloat(S.wt);return isNaN(w)||w<=0?null:w;}
function rnd(mg){if(mg>=100)return Math.round(mg/5)*5;if(mg>=10)return Math.round(mg);return Math.round(mg*10)/10;}
function dz(mgkg,max){const w=wt();if(!w)return null;return rnd(Math.min(w*mgkg,max));}
const fmt=n=>n==null?'***':n.toLocaleString('en-US');
function liq(mg,per5){if(mg==null)return'';const ml=Math.round(mg/per5*5*10)/10;return ml<=30?` (${ml} mL of ${per5} mg/5 mL)`:'';}
function TOK(){const w=wt();
  const a=dz(15,1000),i=dz(10,600),o=dz(0.1,5),m=dz(0.1,4),f=w?Math.min(Math.round(w*1.5),100):null,n=dz(0.15,4),cz=w?(w>=120?3000:Math.min(rnd(w*30),2000)):null,g=dz(7.5,1e9),c100=dz(100/3,2000),cl=dz(40/3,900),v=dz(15,1000);
  return{
  apap:`Acetaminophen 15 mg/kg = ${fmt(a)} mg PO q6h PRN pain${w&&w<40?liq(a,160):''} (max 1,000 mg/dose; 75 mg/kg/day up to 4 g/day)`,
  ibu:`Ibuprofen 10 mg/kg = ${fmt(i)} mg PO q6h PRN pain${w&&w<40?liq(i,100):''} (max 600 mg/dose; 40 mg/kg/day)`,
  oxy:`Oxycodone 0.1 mg/kg = ${fmt(o)} mg PO q4h PRN severe pain${w&&w<40?liq(o,5):''} (max 5 mg/dose; shortest course, fewest doses)`,
  mor:`Morphine 0.1 mg/kg = ${fmt(m)} mg IV q2h PRN severe pain (max 4 mg/dose)`,
  fent:`Fentanyl intranasal 1.5 mcg/kg = ${fmt(f)} mcg once for acute pain (max 100 mcg)`,
  ond:`Ondansetron 0.15 mg/kg = ${fmt(n)} mg IV or PO q8h PRN nausea (max 4 mg/dose)`,
  cefaz:`Cefazolin 30 mg/kg = ${fmt(cz)} mg IV within 60 minutes of arrival, then q8h (max 2 g/dose; 3 g if 120 kg or more)`,
  gent:`gentamicin 7.5 mg/kg = ${fmt(g)} mg IV q24h (levels per pharmacy)`,
  cefaz100:`cefazolin 100 mg/kg/day = ${fmt(c100)} mg IV q8h (max 2 g/dose)`,
  clinda:`clindamycin 40 mg/kg/day = ${fmt(cl)} mg IV q8h (max 900 mg/dose)`,
  vanc:`vancomycin 15 mg/kg = ${fmt(v)} mg IV q6h (initial; AUC dosing per pharmacy)`,
  po:S.lastPO.trim()?`; last oral intake ${S.lastPO.trim()}`:'; last oral intake ***'};}
function tok(t){const T=TOK();return t.replace(/\{(\w+)\}/g,(m,k)=>k in T?T[k]:m);}

/* ---------- state ---------- */
function blank(){return{step:0,age:'',unit:'y',sex:'',wt:'',set:'',by:'',src:[],interp:'',opmh:'',hand:'',
  cc:null,q:'',side:'',
  when:'',mech:'',mechTxt:'',ht:'',wit:'',imm:[],use:'',lastPO:'',
  onset:'',ago:'',agoU:'weeks',course:'',timing:[],sev:null,loc:[],agg:[],rel:[],prior:'',sports:'',concern:'',extra:'',
  marks:{},idet:{},det:{},picks:{},resp:'',
  ex:{},exm:{},exd:{},
  xr:[],f:[],ftxt:'',dx:[],dp:{},plan:{},mods:{},modsSet:false,asm:{},
  hpi:'',hpiDirty:false,fwhere:'',fwhen:'',fdx:'',fimg:'',ftx:[],fsurg:'',fago:'',fagoU:'weeks',fvis:'',fcomp:'',fpain:''};}
let S=blank();

/* ---------- HPI ---------- */
function hItems(){const c=cc();if(!c)return[];const r=[];
  hSecs().forEach((sec,si)=>{if(sec[1]==='pick')return;sec[2].forEach((raw,ii)=>{const it=P(raw);if(gateOK(it.gate))r.push({si,ii,key:si+'.'+ii,it,sec});});});return r;}
function hTally(){const all=hItems();const left=all.filter(x=>!S.marks[x.key]);return{all:all.length,left:left.length,red:left.filter(x=>x.it.red).length,leftList:left};}
function useLine(c){const ue=isUE(c);return{unable:ue?`${He()} has been unable to use the arm since.`:`${He()} has been unable to bear weight since.`,limited:ue?`${He()} has used the arm only minimally since.`:`${He()} has been able to bear weight only with a limp since.`,normal:ue?`${He()} has been using the arm normally since.`:`${He()} has been able to bear weight since.`}[S.use]||'';}
function immNoun(){const m=S.ftx.find(x=>/splint|cast|sling|boot|brace/.test(x));return m?m.replace(/^an? /,''):'immobilization';}
function fuStory(c,out){
  const mech=S.mech==='other'?S.mechTxt.trim():S.mech;
  if(c.tr&&(mech||S.when.trim()))out.push(sent(`${He()} ${mech||'was injured'}${S.when.trim()?' '+S.when.trim():''}`));
  if(S.fwhere||S.fwhen.trim())out.push(sent(`${He()} was initially seen ${S.fwhere?'at '+S.fwhere:''}${S.fwhen.trim()?' '+S.fwhen.trim():''}`));
  const im={negative:'XR at that time was negative for fracture.',fracture:`XR at that time demonstrated ${S.fdx.trim()?S.fdx.trim().replace(/^(a|an) /,'a '):'a fracture'}.`,none:'No imaging was obtained at that time.'}[S.fimg];if(im)out.push(im);
  if(S.ftx.length)out.push(`${He()} was treated with ${andL(S.ftx)}${S.fsurg.trim()?' ('+S.fsurg.trim()+')':''}.`);
  if(S.fago)out.push(`It has been about ${S.fago} ${parseFloat(S.fago)===1?S.fagoU.replace(/s$/,''):S.fagoU} since the ${S.ftx.includes('surgery')||S.fvis==='post-op'?'surgery':'injury'}.`);
  const n=immNoun();const cp={as:`${He()} reports wearing the ${n} as instructed.`,part:`${He()} reports wearing the ${n} only part of the time.`,not:`${He()} has not been wearing the ${n}.`}[S.fcomp];if(cp)out.push(cp);
  const pt={improving:'Pain has been improving',unchanged:'Pain has been unchanged',worsening:'Pain has been worsening',resolved:'Pain has resolved'}[S.fpain];
  if(pt)out.push(pt+(S.sev!=null&&S.fpain!=='resolved'?` and is currently rated ${S.sev}/10.`:'.'));else if(S.sev!=null)out.push(`Pain is currently rated ${S.sev}/10.`);}
function buildHPI(){
  const c=cc();if(!c)return'';const out=[];const H=hSecs();
  const lab=(it,key)=>{const d=(S.idet[key]||'').trim();return d?it.t+' ('+d+')':it.t;};
  const secPN=(si,sec)=>{const pos=[],neg=[];sec[2].forEach((raw,ii)=>{const it=P(raw);if(!gateOK(it.gate))return;const key=si+'.'+ii,m=S.marks[key];if(m==='p')pos.push(lab(it,key));if(m==='n')neg.push(it.t);});return{pos,neg};};
  const by=k=>{const pos=[],neg=[];H.forEach((sec,si)=>{if(sec[1]!==k)return;const r=secPN(si,sec);pos.push(...r.pos);neg.push(...r.neg);});return{pos,neg};};
  const y=ageY();const young=y!=null&&y<6;
  const cgOnly=S.src.length&&!S.src.includes('patient');
  const subj=cgOnly?(S.src.length===1?{mother:'Mother',father:'Father',parents:'Parents',grandparent:'Grandparent',guardian:'Guardian',ems:'EMS',chart:'Chart review'}[S.src[0]]||'Family':'Family'):He();
  const ccp=fillSide(c.cc);
  const ph=by('pmh');const other=S.opmh.split(/[,;]/).map(x=>x.trim()).filter(Boolean);const pmhAll=other.concat(ph.pos);
  const ag=String(S.age).trim();const art=/^8/.test(ag)||/^1[18]$/.test(ag)?'an':'a';
  const unit={y:'y/o',m:'m/o',d:'d/o'}[S.unit];
  out.push(`The patient is ${ag?art+' '+ag:'a ***'} ${unit} ${sexL()} with a PMHx of ${pmhAll.length?andL(pmhAll):'***'} presenting today for ${FU()?'follow-up of '+(S.fdx.trim()||ccp):'evaluation of '+ccp}.`);
  if(S.set==='ed'||S.set==='inpt')out.push(`Pediatric orthopaedic surgery was consulted by ${S.by.trim()||(S.set==='ed'?'the emergency department':'the primary team')}.`);
  if(S.src.length&&!(S.src.length===1&&S.src[0]==='patient')){const m={patient:'the patient',mother:'mother',father:'father',parents:'parents',grandparent:'grandparent',guardian:'guardian',ems:'EMS',chart:'chart review'};out.push('History was obtained from '+andL(S.src.map(x=>m[x]))+'.');}

  if(isUE(c)&&S.hand)out.push(`${He()} is ${S.hand}-hand dominant.`);
  if(FU()){fuStory(c,out);}
  else if(c.tr){
    const mech=S.mech==='other'?S.mechTxt.trim():S.mech;
    if(mech||S.when){let t=`${He()} ${mech||'sustained the injury'}${S.ht?` (estimated ${S.ht} ft)`:''}${S.when.trim()?' '+S.when.trim():''}`;out.push(sent(t));}
    const wv={parent:'The injury was witnessed by a parent.',adult:'The injury was witnessed by another adult.',none:'The injury was unwitnessed.'}[S.wit];if(wv)out.push(wv);

  } else if(NP[S.cc]){

    const tc={worsening:'It has been getting worse.',improving:'It has been improving.',unchanged:'It has been unchanged.',resolved:'It has since resolved.'}[S.course];if(tc)out.push(tc);
  } else {
    const N=young?'Symptoms':'The pain';
    const ago=S.ago?'about '+S.ago+' '+(parseFloat(S.ago)===1?S.agoU.replace(/s$/,''):S.agoU)+' ago':'';
    const adv={sudden:'suddenly',gradual:'gradually'}[S.onset]||'';
    if(adv||ago)out.push(`${N} began ${[adv,ago].filter(Boolean).join(' ')}.`);
    if(S.loc.length)out.push(`${young?'They are':'It is'} located at the ${andL(S.loc)}.`);
    if(S.timing.length)out.push(`${young?'They occur':'It occurs'} ${andL(S.timing)}.`);
    const ar=[];if(S.agg.length)ar.push('worse with '+andL(S.agg));if(S.rel.length)ar.push('better with '+andL(S.rel));if(ar.length)out.push(`${young?'They are':'It is'} ${ar.join(' and ')}.`);
    const tc={worsening:'getting worse',improving:'improving',unchanged:'unchanged',resolved:'resolved'}[S.course];
    if(tc)out.push(`${young?'They have':'It has'} been ${tc}${S.sev!=null?` and is rated ${S.sev}/10 at its worst`:''}.`);else if(S.sev!=null)out.push(`It is rated ${S.sev}/10 at its worst.`);
  }
  if(S.prior==='first')out.push('This is the first episode.');if(S.prior==='similar')out.push(`${He()} has had similar episodes before.`);

  if(S.sports.trim())out.push(`${He()} participates in ${S.sports.trim().replace(/\.$/,'')}.`);
  const sv=by('sx');if(sv.pos.length)out.push(`${subj} reports ${andL(sv.pos)}.`);if(sv.neg.length)out.push(`${subj} denies ${orL(sv.neg)}.`);
  H.forEach((sec,si)=>{if(sec[1]==='sx'&&S.det[si])out.push(sent(S.det[si]));});
  if(ph.neg.length)out.push(`${He()} has no known history of ${orL(ph.neg)}.`);
  H.forEach((sec,si)=>{if(sec[1]==='pmh'&&S.det[si])out.push(sent(S.det[si]));});
  H.forEach((sec,si)=>{const k=sec[1];if(!['rf','tx','fhx'].includes(k))return;const {pos,neg}=secPN(si,sec);const o=sec[3]||{};

    if(k==='tx'){const rv={full:' with relief',partial:' with partial relief',none:' without relief'}[S.resp]||'';const pre=c.tr&&!FU()?' prior to arrival':'';if(pos.length)out.push(`${He()} ${c.tr?'received':'has tried'} ${andL(pos)}${pre}${rv}.`);if(neg.length)out.push(`${He()} has not ${c.tr?'received':'tried'} ${orL(neg)}.`);}

  out.push(`${He()} denies any further complaints today.`);
  return out.join(' ');}

/* ---------- Exam ---------- */
function exGroups(){const c=cc();if(!c)return[];
  const gs=c.ex.split('|').map(g=>{g=g.trim();const i=g.indexOf(':');const lab=g.slice(0,i).trim(),ids=g.slice(i+1).trim().split(/\s+/).filter(x=>E[x]);
    let h='';if(lab==='G')h='';else if(lab.startsWith('R=')){const r=lab.slice(2);h=(sideW()&&sideW()!=='bilateral'?cap(sideW())+' '+r:(sideW()==='bilateral'?'Bilateral '+r:cap(r)));}else h=lab;

function elems(id){return E[id][2].map((raw,i)=>{let s=raw,must=false;if(s[0]==='!'){must=true;s=s.slice(1);}const [n,a]=s.split('|');return{i,must,n,a};});}

  const ans=els.filter(e=>S.ex[id+'.'+e.i]);const ab=els.filter(e=>S.ex[id+'.'+e.i]==='a').map(e=>e.a),nm=els.filter(e=>S.ex[id+'.'+e.i]==='n').map(e=>e.n);
  const ms=(meas||[]).map(([k,l,u])=>{const v=(S.exm[id+'.'+k]||'').trim();return v?`${l} ${v}${u==='°'?'°':' '+u}`:'';}).filter(Boolean);
  const d=(S.exd[id]||'').trim();

  else{if(ab.length)t+=sent(ab.join('; '));if(nm.length)t+=(t?' ':'')+sent(nm.join(', '));}

function buildExam(){const lines=[];exGroups().forEach(g=>{const its=g.ids.map(itemText).filter(Boolean);if(!its.length)return;if(g.h)lines.push(g.h+':');its.forEach(x=>lines.push(x));});return lines.join('\n');}
function exTally(){let all=0,left=0,must=0;const mustList=[];exGroups().forEach(g=>g.ids.forEach(id=>elems(id).forEach(e=>{all++;if(!S.ex[id+'.'+e.i]){left++;if(e.must){must++;mustList.push({id,e});}}})));return{all,left,must,mustList};}

/* ---------- A/P ---------- */
function dxList(){const c=cc();return c?c.dx:[];}

function pk(d){return S.dp[d.id]||(S.dp[d.id]={});}
function pickDefault(d){const p=pk(d);pickList(d).forEach(([k,,o])=>{if(p[k]==null&&o.includes(''))p[k]='';});}
function fillDx(d,t){const p=pk(d);t=t.replace(/\{(\w+)\}/g,(m,k)=>{if(k==='side'||k==='Side')return m;if(k==='hdr')return m;if(pickList(d).some(x=>x[0]===k))return p[k]!=null?p[k]:'***';return m;});return tok(fillSide(t));}
function condOK(d,cond){const p=pk(d);return cond.split(';').every(cl=>{const ne=cl.includes('!=');const [k,list]=cl.split(ne?'!=':'=');const v=p[k.trim()];
  const inL=v!=null&&(list===v||list.startsWith(v+',')||list.endsWith(','+v)||list.includes(','+v+','));return ne?!inL:inL;});}
function planLines(lines){return lines.map((raw,i)=>{let t=raw,cond=null,opt=false,gate=null;const m=t.match(/^\[([^\]]*)\]/);if(m){cond=m[1];t=t.slice(m[0].length);}if(t[0]==='?'){opt=true;t=t.slice(1);}const g=t.match(/^([IYOFM]):/);if(g){gate=g[1];t=t.slice(2);}return{i,t,cond,opt,gate};});}
function visLines(d){return planLines(planOf(d).p).filter(l=>(!l.cond||condOK(d,l.cond))&&gateOK(l.gate));}
function lineOn(key,l){const v=(S.plan[key]||{})[l.i];return v==null?!l.opt:v;}
function headerOf(d){return cap(fillDx(d,d.t).replace(/\{hdr\}/g,'').replace(/^\s*,\s*/,'').replace(/\s*\(\s*\)/,''));}
function mechWords(){const c=cc();if(!c)return'';if(c.tr){const m=S.mech==='other'?S.mechTxt.trim():S.mech;return m?`who ${m}${S.when.trim()?' '+S.when.trim():''}`:'';}
  if(NP[S.cc]){return S.ago?`with ${NP[S.cc]} first noticed about ${S.ago} ${parseFloat(S.ago)===1?S.agoU.replace(/s$/,''):S.agoU} ago`:'';}
  return S.ago?`with ${S.ago} ${parseFloat(S.ago)===1?S.agoU.replace(/s$/,''):S.agoU} of ${fillSide(c.cc)}`:'';}
function imgSentence(){const st=S.xr.map(fillSide),f=S.f.map(fillSide);const t=S.ftxt.trim();let s='';
  if(st.length&&(f.length||t))s=`${andL(st)} ${st.length>1?'demonstrate':'demonstrates'} ${andL(f.concat(t?[t.replace(/\.$/,'')]:[]))}.`;
  else if(f.length||t)s=`Imaging demonstrates ${andL(f.concat(t?[t.replace(/\.$/,'')]:[]))}.`;
  else if(st.length)s=`${andL(st)} ${st.length>1?'were':'was'} obtained.`;
  return s;}
function autoAsm(d){const c=cc();const parts=[];
  const other=S.opmh.split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  const mw=mechWords();
  if(FU()){const since=S.fago?`about ${S.fago} ${parseFloat(S.fago)===1?S.fagoU.replace(/s$/,''):S.fagoU} after ${S.ftx.includes('surgery')||S.fvis==='post-op'?'surgery':'injury'}`:'';
    const tx=S.ftx.length?`treated with ${andL(S.ftx)}`:'';const fi={negative:'initially negative radiographs',fracture:'a fracture on initial radiographs'}[S.fimg]||'';
    parts.push(`${ageTxt()} ${sexL()}${other.length?' with a PMHx of '+andL(other):''} seen in follow-up${since?' '+since:''}${fi?', with '+fi:''}${tx?', '+tx:''}.`);}
  else parts.push(`${ageTxt()} ${sexL()}${other.length?' with a PMHx of '+andL(other):''} ${mw||'presenting with '+fillSide(c.cc)}.`.replace(/\s+\./,'.'));
  const ab=exAbn();if(ab.length)parts.push(`Exam is notable for ${andL(ab)}.`);
  if(nvIntact())parts.push(`${He()} is neurovascularly intact distally.`);
  const im=imgSentence();if(im)parts.push(im);
  const pa=FU()&&planOf(d).a?planOf(d).a:d.a;parts.push(fillDx(d,pa).replace(/\{hdr\}/g,headerOf(d).replace(/^./,x=>x.toLowerCase())));
