<style>
/* Layout: seven tabs on the left (patient → note), the live H&P pinned on the right; one column on phones.
   Fixed light theme to match the rest of PANACEA. */
html,body{margin:0}
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-soft:#E1E9FB; --accent-ink:#FFFFFF;
  --ok:#1D6E49; --ok-soft:#E1F2E9; --warn:#8A4300; --warn-soft:#FCEFDF; --alert:#A3122B; --alert-soft:#FBE6E9;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.01em;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1840AE;color:var(--accent-ink)}
.btn.small{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--alert)}
.btn:focus-visible,.chip:focus-visible,.info:focus-visible,.stepbtn:focus-visible,input:focus-visible,textarea:focus-visible,.homebtn:focus-visible,.pi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0;position:relative}
.stepbtn .n{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0}
.stepbtn.done .dot{opacity:1}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.stepbtn[aria-current="step"] .n{color:var(--accent)}
@media (max-width:760px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.stepbtn{padding:6px 8px}.stepbtn .t{font-size:.8rem}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.ph .cue{margin:2px 0 0;color:var(--muted);font-size:.93rem;max-width:66ch}
.pfoot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.flab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.93rem}
.flab .sub{font-weight:400;color:var(--muted);font-size:.84rem}
.info{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:.74rem;font-style:italic;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;min-height:36px;line-height:1.2;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>.in{flex:1 1 140px}
.in{display:flex;flex-direction:column;gap:4px;min-width:0}
.in>span{font-size:.8rem;color:var(--muted);font-weight:700}
.in input,.in textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 10px;width:100%;font-size:.95rem;outline:0}
.in textarea{resize:vertical;min-height:64px;line-height:1.4}
.in input:focus,.in textarea:focus{border-color:var(--accent)}
.in.s{flex:0 1 110px}
.hint{margin:0;font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.calcout{margin:0;font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:8px 11px}
.sep{height:1px;background:var(--line)}
.gt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* problem library & cards */
.lib{display:flex;flex-direction:column;gap:12px}
.lib .sys{display:flex;flex-direction:column;gap:6px}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pch{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--sunk);border-bottom:1px solid var(--line)}
.pch .hash{font-weight:700;color:var(--accent)}
.pch input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:1rem;outline:0;padding:4px 2px}
.pch input:focus{background:var(--surface);border-radius:6px}
.pcb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.pcb .in textarea{min-height:48px}
.items{display:flex;flex-direction:column;gap:2px}
.pi{display:flex;align-items:flex-start;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:.9rem;line-height:1.35}
.pi:hover{background:var(--sunk)}
.pi .bx{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #9AA7B4;margin-top:1px;display:grid;place-items:center}
.pi[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.pi[aria-pressed="true"] .bx::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.pi[aria-pressed="false"] .tx{color:var(--muted)}
.mv{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:1rem}
.mv:hover{background:var(--surface);color:var(--ink)}
.empty{margin:0;color:var(--muted);font-size:.92rem}
.rec{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rec h3{margin:0;font-size:1rem}
.rec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.rec .note{font-size:.82rem;color:var(--muted);margin:0}
.rec .tag{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 92px);overflow:auto}
@media (max-width:980px){.out{position:static;max-height:none}}
.out h3{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dict{white-space:pre-wrap;font-size:.84rem;line-height:1.5;background:var(--bg);border-radius:10px;padding:12px;margin:0;font-family:var(--f-body);overflow-wrap:anywhere}
.outbtns{display:flex;gap:8px;flex-wrap:wrap}
.outbtns .btn{flex:1}
.toast{font-size:.84rem;color:var(--accent);min-height:1.2em;margin:0}
.toast a{color:var(--accent);font-weight:700}
.pop{position:fixed;z-index:50;width:380px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,35,58,.18);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:min(74vh,600px);overflow:auto}
.pop .pt{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pop p,.pop li{margin:0;font-size:.88rem}
.pop ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pop .close{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
@media (max-width:640px){.pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;max-height:72vh;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.privacy{font-size:.82rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>Admit</h1></div>
      <p>ICU and floor H&amp;P: problems with ready plans, antibiotics, bundles, and a handoff to ICU Rounder.</p>
    </div>
    <button class="btn" id="reset" type="button">New admission</button>
  </header>
  <nav class="steps" id="steps" aria-label="Sections"></nav>
  <div class="grid">
    <main id="panes"></main>
    <aside class="out" aria-live="polite">
      <h3>H&amp;P</h3>

      </div>
      <button class="btn" id="toRounder" type="button">Send to ICU Rounder</button>
      <p class="toast" id="toast"></p>
    </aside>
  </div>
</div>
<div class="pop" id="pop" hidden role="dialog"></div>

const VANC='Vancomycin IV (load 20–25 mg/kg, AUC-guided dosing per pharmacy)';
function abxRec(src,sev,M){
  const m=k=>M.includes(k),icu=sev==='icu';
  let r=[],w=[],d='',n=[];
  switch(src){
    case 'cap':
      if(m('allergy'))r.push('Levofloxacin 750 mg IV/PO daily');
      else if(m('pseudo'))r.push('Piperacillin-tazobactam 4.5 g IV q6h (extended infusion) or cefepime 2 g IV q8h');
      else r.push(`Ceftriaxone ${icu?'2 g':'1–2 g'} IV q24h`);
      if(!m('allergy'))r.push(icu?'+ Azithromycin 500 mg IV daily (or levofloxacin 750 mg daily)':'+ Azithromycin 500 mg daily ×3 days (or doxycycline 100 mg BID)');
      if(m('mrsa'))r.push('+ '+VANC+' (or linezolid 600 mg q12h)');
      if(icu)r.push('?Hydrocortisone 200 mg/day ×4–7 days for severe CAP (not with influenza or aspiration)');
      w.push('Blood cultures, sputum Gram stain/culture'+(icu?', Legionella and pneumococcal urine antigens':''),'Influenza/COVID PCR; oseltamivir 75 mg BID if influenza','MRSA nares PCR (stop MRSA coverage if negative)');
      d='Minimum 5 days and clinically stable ≥48 h';break;
    case 'hap':case 'vap':
      r.push(m('allergy')?'Aztreonam 2 g IV q8h (or levofloxacin 750 mg daily)':m('esbl')?'Meropenem 1 g IV q8h (extended infusion)':'Piperacillin-tazobactam 4.5 g IV q6h (extended infusion) or cefepime 2 g IV q8h');
      if(m('mrsa')||icu||src==='vap')r.push('+ '+VANC+' or linezolid 600 mg q12h (MRSA risk, unit prevalence >10–20%, or unknown)');
      if(icu&&(m('pseudo')||src==='vap'))r.push('?+ Second anti-pseudomonal agent (tobramycin/amikacin or levofloxacin) only if septic shock, high mortality risk, or IV antibiotics in past 90 days');
      w.push(src==='vap'?'Endotracheal aspirate culture (semi-quantitative), blood cultures':'Sputum culture, blood cultures','MRSA nares PCR');
      d='7 days; narrow to culture results';break;
    case 'asp':
      r.push('Aspiration pneumonitis (chemical, first 24–48 h): usually no antibiotics; supportive care');
      r.push(m('allergy')?'If pneumonia develops: levofloxacin 750 mg daily':'If pneumonia: treat as CAP (ceftriaxone ± azithromycin); hospital onset: as HAP');
      r.push('Anaerobic coverage only for lung abscess or empyema: ampicillin-sulbactam 3 g IV q6h');
      w.push('SLP swallow evaluation; aspiration precautions; HOB ≥30°');d='5–7 days if treating pneumonia';break;
    case 'uti':
      if(m('allergy'))r.push('Aztreonam 2 g IV q8h, or ciprofloxacin 400 mg IV q12h / levofloxacin 750 mg daily (avoid if FQ in past 12 months)');
      else if(m('esbl'))r.push(icu?'Meropenem 1 g IV q8h':'Ertapenem 1 g IV daily (meropenem if shock)');
      else if(icu||m('pseudo'))r.push('Cefepime 2 g IV q8h or piperacillin-tazobactam 4.5 g IV q6h');
      else r.push('Ceftriaxone 1–2 g IV q24h');
      w.push('Urine culture before antibiotics; blood cultures if septic','Review prior urine isolates and choose an agent they were susceptible to','Renal/bladder ultrasound or CT if septic shock, no improvement in 48–72 h, or obstruction suspected','Avoid nitrofurantoin and oral fosfomycin for cUTI');
      d='7 days for a non-FQ (5–7 days for a FQ); 7 days with gram-negative bacteremia; oral step-down when improving';n.push('IDSA 2025 cUTI guideline');break;
    case 'iai':
      if(m('allergy'))r.push('Aztreonam 2 g IV q8h + metronidazole 500 mg IV q8h + vancomycin');
      else if(icu||m('pseudo'))r.push(m('esbl')?'Meropenem 1 g IV q8h':'Piperacillin-tazobactam 4.5 g IV q6h (or cefepime 2 g q8h + metronidazole 500 mg q8h)');
      else r.push(m('esbl')?'Ertapenem 1 g IV daily':'Ceftriaxone 2 g IV q24h + metronidazole 500 mg IV/PO q8h');
      if(m('mrsa'))r.push('+ '+VANC);
      w.push('Source control: surgery / IR drainage','Blood cultures; intra-op or drain cultures');d='4 days after adequate source control';break;
    case 'biliary':
      r.push(m('allergy')?'Aztreonam 2 g IV q8h + metronidazole 500 mg q8h':icu?'Piperacillin-tazobactam 4.5 g IV q6h':'Ceftriaxone 2 g IV q24h + metronidazole 500 mg q8h');
      w.push('RUQ ultrasound; LFTs, lipase','GI for ERCP (cholangitis) or surgery for cholecystectomy','Blood cultures');d='4–7 days after source control';break;

      r.push(m('allergy')?'Vancomycin IV (or linezolid)':icu?'Vancomycin + piperacillin-tazobactam (systemic toxicity or necrotizing concern)':'Cefazolin 2 g IV q8h (oral step-down: cephalexin 500 mg QID)');
      if(m('mrsa')&&!icu&&!m('allergy'))r.push('+ '+VANC+' if MRSA risk or penetrating trauma');

      r.push('+ Clindamycin 900 mg IV q8h for toxin suppression');
      w.push('Emergent general/plastic surgery consult for debridement — do not delay for imaging','CK, lactate, blood cultures; LRINEC is not a rule-out');d='Until no further debridement needed and clinically improved';break;
    case 'dfi':

      w.push('Deep tissue/bone culture (not swab)','X-ray foot; MRI if osteomyelitis suspected; probe-to-bone','Podiatry / vascular surgery; ABI');d='1–2 weeks soft tissue; longer for osteomyelitis';break;

      r.push('?+ Acyclovir 10 mg/kg IV q8h if encephalitis concern');
      if(m('allergy'))r.push('Severe beta-lactam allergy: vancomycin + moxifloxacin (or aztreonam), + TMP-SMX for Listeria');
      w.push('Blood cultures, then antibiotics immediately; do not delay for CT','LP: opening pressure, cell count, glucose, protein, Gram stain/culture, ± HSV PCR/meningitis panel','Droplet precautions until N. meningitidis excluded');d='Per organism (e.g., 10–14 days pneumococcus)';break;
    case 'unknown':
      r.push(m('allergy')?'Vancomycin + aztreonam 2 g q8h + metronidazole 500 mg q8h':m('esbl')?'Vancomycin + meropenem 1 g IV q8h':'Vancomycin + piperacillin-tazobactam 4.5 g IV q6h (or cefepime 2 g q8h ± metronidazole)');
      r.push('?+ Micafungin 100 mg daily if candidemia risk (TPN, femoral line, abdominal surgery, prolonged broad abx, Candida colonization)');
      w.push('Blood cultures ×2, UA/UCx, CXR, lactate; imaging by exam','Search for source; reassess and narrow at 48–72 h');d='Define source and narrow';break;
    case 'neut':
      r.push(m('allergy')?'Aztreonam 2 g IV q8h + vancomycin':m('esbl')?'Meropenem 1 g IV q8h':'Cefepime 2 g IV q8h (or piperacillin-tazobactam / meropenem)');
      r.push('+ Vancomycin only if line infection, SSTI, pneumonia, hemodynamic instability, or MRSA colonization');
      w.push('Blood cultures from each lumen + peripheral; UA, CXR','Antifungal if fever persists after 4–7 days');d='Until ANC >500 and afebrile';break;
    case 'endo':
      r.push('Vancomycin IV + ceftriaxone 2 g IV q24h');
      w.push('Blood cultures ×3 before antibiotics','TTE then TEE','ID and cardiology consults; cardiac surgery if HF, abscess, or emboli');d='Usually 4–6 weeks from first negative culture';break;
    case 'cdi':
      r.push(icu?'Fulminant: vancomycin 500 mg PO/NG QID + metronidazole 500 mg IV q8h (± rectal vancomycin if ileus); surgery consult':'Fidaxomicin 200 mg PO BID ×10 days (preferred) or vancomycin 125 mg PO QID ×10 days');
      w.push('Contact precautions; stop other antibiotics and PPI when possible');d='10 days';break;
  }
  if(m('renal'))n.push('Doses assume normal renal function: pharmacy to adjust for CrCl <30 / dialysis.');
  n.push('Use your local antibiogram and prior cultures; narrow at 48–72 h.');
  return {r,w,d,n};
}

const inp=(path,label,o={})=>`<label class="in ${o.w||''}"><span>${label}</span>${o.ta?`<textarea data-p="${path}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(get(path)||'')}</textarea>`:`<input data-p="${path}" type="${o.type||'text'}" ${o.num?'inputmode="decimal"':''} placeholder="${esc(o.ph||'')}" value="${esc(get(path)||'')}" autocomplete="off">`}</label>`;
const seg=(path,opts)=>`<div class="chips">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<button type="button" class="chip" data-seg="${path}" data-v="${esc(v)}" aria-pressed="${get(path)===v}">${esc(l)}</button>`}).join('')}</div>`;
function get(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function set(path,v){const ks=path.split('.');let o=S;ks.slice(0,-1).forEach(k=>{if(o[k]==null)o[k]={};o=o[k]});o[ks[ks.length-1]]=v}

function dataKeys(){
  const ks=new Set(['wt']);
  S.pmh.forEach(p=>{const d=PMH.find(x=>x[0]===p);(d&&d[2]||[]).forEach(k=>ks.add(k))});
  S.probs.forEach(p=>{const L=LIB[p.key];(L&&L.data||[]).forEach(k=>ks.add(k))});
  if(S.abx.src)['cultures','micro'].forEach(k=>ks.add(k));
  if(S.pt.level==='ICU')['abg','lactate'].forEach(k=>ks.add(k));
  ks.add('lytes');ks.add('cbc');
  return Object.keys(DATA).filter(k=>ks.has(k));
}

const htIn=()=>{const h=parseFloat(S.pt.height);if(!h)return null;return S.pt.hUnit==='cm'?h/2.54:h};
const isXfer=()=>S.pt.source==='Floor transfer';
function hospDay(){const a=S.pt.hospAdmit,b=S.pt.admit;if(!a||!b)return null;const d=Math.round((new Date(b)-new Date(a))/864e5)+1;return d>0?d:null}
function hdText(){if(!S.pt.hospAdmit)return '';const d=hospDay();return d?`Transfer on hospital day ${d}.`:''}
function pmhList(){const a=S.pmh.map(k=>PMH.find(p=>p[0]===k)[1]);const o=(get('hx.pmhOther')||'').split(/\n|;|,/).map(s=>s.trim()).filter(Boolean);return a.concat(o)}
function oneLiner(){
  if(S.pt.oneLiner&&S.pt.oneLiner.trim())return S.pt.oneLiner.trim();
  const p=S.pt,a=p.age?p.age+(p.sex||''):'',pm=pmhList();
  if(!a&&!p.cc&&!pm.length)return '';
  if(isXfer()){const why=(p.xferWhy||'***').toLowerCase(),d=hospDay();return `${a||'***'} with ${pm.length?pm.join(', '):'***'}, admitted ${p.hospAdmit||'***'} for ${p.cc||'***'}, transferred from ${p.fromUnit||'the floor'} to ${p.level||'ICU'}${d?' on hospital day '+d:''} for ${why}${S.probs.length?'; now with '+S.probs.filter(x=>!(LIB[x.key]&&LIB[x.key].sys==='chronic')&&!['ckd','esrd'].includes(x.key)).slice(0,2).map(x=>x.name.charAt(0).toLowerCase()+x.name.slice(1)).join(' and '):''}.`}
  return `${a||'***'} with ${pm.length?pm.join(', '):'***'} presenting with ${p.cc||'***'}, admitted to ${p.level||'***'} for ${(()=>{const a=S.probs.filter(x=>!(LIB[x.key]&&LIB[x.key].sys==='chronic')&&!['ckd','esrd'].includes(x.key));return a.length?a.slice(0,2).map(x=>x.name.charAt(0).toLowerCase()+x.name.slice(1)).join(' and '):'***'})()}.`;
}
function probPlan(p){return p.items.filter(i=>i.on).map(i=>i.t.replace(/^\?/,'Consider: ')).concat((p.extra||'').split('\n').map(s=>s.trim()).filter(Boolean))}
function bundleLines(){
  const L=[];const icu=S.pt.level==='ICU';
  if(icu)ICUB.forEach(([k,l,opts])=>{const on=(S.bundle[k]||[]);if(on.length)L.push(`${k==='chk'?l:k.replace('2','')+' ('+l+')'}: ${opts.filter(o=>on.includes(o[0])).map(o=>o[1]).join('; ')}`)});
  FLOORB.forEach(([k,l,opts])=>{const on=(S.floor[k]||[]);if(on.length)L.push(`${l}: ${opts.filter(o=>on.includes(o[0])).map(o=>o[1]).join('; ')}`)});
  return L;
}
function apText(){
  const out=[];
  const ol=oneLiner();if(ol)out.push('ASSESSMENT: '+ol);
  S.probs.forEach(p=>{const pl=probPlan(p);out.push(`# ${p.name}${p.a?'\n'+p.a:''}${pl.length?'\n'+pl.map(x=>'- '+x).join('\n'):''}`)});
  const b=bundleLines();
  if(b.length)out.push(`# ${S.pt.level==='ICU'?'ICU bundle (FAST HUGS BID)':'Prophylaxis, nutrition, dispo'}\n`+b.map(x=>'- '+x).join('\n'));
  const fen=[];if(S.pt.code)fen.push('Code status: '+S.pt.code+(S.pt.hcpoa?' (HCPOA: '+S.pt.hcpoa+')':''));
  const mp=get('hx.medPlan');if(mp==='holdall')fen.push('Hold all PTA medications *** pending ***');if(mp==='cont')fen.push('Continue home medications except as noted');if(mp==='some')fen.push('Continue home medications; hold '+(get('hx.medHold')||'***'));
  if(fen.length)out.push('# Code / home meds\n'+fen.map(x=>'- '+x).join('\n'));
  return out.join('\n\n');
}
function noteText(){
  const p=S.pt,sec=[];
  const head=[`${isXfer()?(p.level==='Floor'?'TRANSFER':((p.level||'ICU').toUpperCase()+' TRANSFER'))+' NOTE':'ADMISSION H&P'} — ${p.level||'***'}${p.service?' · '+p.service:''}`];
  if(p.admit)head.push((isXfer()?'Transfer date: ':'Date: ')+p.admit);if(p.bed)head.push('Bed: '+p.bed);
  if(isXfer()){const d=hospDay();head.push(`Transferred from: ${p.fromUnit||'floor'}${p.hospAdmit?' (hospital admission '+p.hospAdmit+(d?', hospital day '+d:'')+')':''}`);if(p.xferWhy)head.push('Reason for transfer: '+p.xferWhy)}
  else if(p.source)head.push('Admitted from: '+p.source+(p.source==='Outside hospital'&&p.osh?' — '+p.osh:''));
  sec.push(head.join('\n'));
  if(p.cc)sec.push('CHIEF COMPLAINT: '+p.cc);
  if(isXfer()&&(p.course||p.xferDetail)){const c=[];if(p.course)c.push(p.course.trim());if(p.xferDetail)c.push('Events leading to transfer: '+p.xferDetail.trim());sec.push('HOSPITAL COURSE:\n'+c.join('\n'))}
  if(p.hpi)sec.push((isXfer()?'HPI (on admission):\n':'HPI:\n')+p.hpi.trim());
  const pm=pmhList();if(pm.length)sec.push('PAST MEDICAL HISTORY:\n'+pm.map(x=>'- '+x).join('\n'));
  if(get('hx.psh'))sec.push('PAST SURGICAL HISTORY:\n'+get('hx.psh').trim());
  if(get('hx.meds'))sec.push('HOME MEDICATIONS:\n'+get('hx.meds').split('\n').map(s=>s.trim()).filter(Boolean).map(x=>'- '+x).join('\n'));
  sec.push('ALLERGIES: '+(p.allergies||'***'));
  const soc=[];const h=S.hx||{};if(h.tob)soc.push('Tobacco: '+h.tob);if(h.etoh)soc.push('Alcohol: '+h.etoh);if(h.drugs)soc.push('Drugs: '+h.drugs);if(h.social)soc.push(h.social.trim());
  if(soc.length)sec.push('SOCIAL HISTORY: '+soc.join('. ')+'.');
  if(h.fam)sec.push('FAMILY HISTORY: '+h.fam.trim());
  const dk=dataKeys().filter(k=>S.data[k]&&S.data[k].trim());
  if(dk.length)sec.push('PERTINENT DATA:\n'+dk.map(k=>`- ${DATA[k][0]}: ${S.data[k].trim()}`).join('\n'));
  const ex=S.ex||{};if(ex.exam)sec.push('PHYSICAL EXAM:\n'+ex.exam.trim());if(ex.labs)sec.push('LABS / MICRO:\n'+ex.labs.trim());if(ex.imaging)sec.push('IMAGING / EKG:\n'+ex.imaging.trim());
  const ap=apText();if(ap)sec.push('ASSESSMENT AND PLAN:\n'+ap.replace(/^ASSESSMENT: /,''));
  return sec.join('\n\n');
}

function update(){

function toast(m,html){const t=document.getElementById('toast');t[html?'innerHTML':'textContent']=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',html?8000:2400)}

function addProb(key){const L=LIB[key];if(!L)return;if(S.probs.some(p=>p.key===key))return;
  const np={id:uid(),key,name:L.name,a:L.a||'',items:L.items.map(t=>({t:t.replace(/^\?/,''),on:!t.startsWith('?'),opt:t.startsWith('?')})),extra:''};
  const isChronic=k=>(LIB[k]&&LIB[k].sys==='chronic')||k==='ckd'||k==='esrd';
  if(isChronic(key))S.probs.push(np);else{const i=S.probs.findIndex(p=>isChronic(p.key));if(i<0)S.probs.push(np);else S.probs.splice(i,0,np)}}

const pop=document.getElementById('pop');let pinned=false;

function place(el){if(innerWidth<=640){pop.style.left='';pop.style.top='';pop.style.maxHeight='';return}

  const below=innerHeight-r.bottom-20,above=r.top-20,useBelow=below>=Math.min(need,320)||below>=above;

  const x=Math.min(Math.max(12,r.left-200),innerWidth-pw-12),y=useBelow?r.bottom+8:r.top-8-ph;

  const b=t.closest('[data-b]');if(b){const st=S[b.dataset.b],k=b.dataset.k,v=b.dataset.v;const a=new Set(st[k]||[]);a.has(v)?a.delete(v):a.add(v);st[k]=[...a];b.setAttribute('aria-pressed',a.has(v));update();return}

/* ---------- handoff to ICU Rounder (same site, same device storage) ---------- */
function sendToRounder(){
  const bed=String(S.pt.bed||'').trim();
  const say=m=>{const h=document.getElementById('hint-send');if(h){h.textContent=m;h.hidden=false}toast(m)};
  if(!bed){say('Add a bed number on the Patient tab first; ICU Rounder sorts by bed.');return}
  let R={patients:[]};
  try{const raw=localStorage.getItem('icu-rounds-v1');if(raw)R=JSON.parse(raw)}catch(e){}
  if(!R||!Array.isArray(R.patients))R={patients:[]};
  const clash=R.patients.find(p=>p.status==='active'&&String(p.bed)===bed);
  const admit=S.pt.admit||today();
  const np={id:uid(),status:'active',days:[],draft:null,bed,age:String(S.pt.age||'').trim(),sex:S.pt.sex||'',height:String(S.pt.height||'').trim(),hUnit:S.pt.hUnit||'in',admit,
    oneLiner:oneLiner(),pmh:pmhList().join(', '),code:S.pt.code||'Full code',allergies:String(S.pt.allergies||'').trim(),
    problems:S.probs.map(p=>({id:uid(),name:p.name,plan:probPlan(p).map(t=>({id:uid(),text:t,started:admit}))})),_mod:Date.now(),from:'admit'};
  R.patients.push(np);
  try{localStorage.setItem('icu-rounds-v1',JSON.stringify(R))}catch(e){say('Could not save to ICU Rounder on this device (storage blocked or full).');return}
  const m=`Sent to ICU Rounder as bed ${bed}${clash?' (another active patient already has this bed)':''}.`;
  const h=document.getElementById('hint-send');if(h){h.textContent=m;h.hidden=false}
  toast(m+' <a href="../icu-rounder/">Open ICU Rounder</a>',true);
}


/* ---------- hover help: with a mouse, popovers close once the pointer leaves both the trigger and the popover ---------- */
let lastPT='mouse',anchor=null,closeT=null,infoT=null;
document.addEventListener('pointerdown',e=>{lastPT=e.pointerType||'mouse'},true);
{const _op=openPop;openPop=function(h,el,pin){anchor=el;clearTimeout(closeT);closeT=null;_op(h,el,pin)}}
const overPop=t=>!!(t&&t.closest&&(t.closest('#pop')||(anchor&&anchor.contains(t))));
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||pop.hidden||pinned)return;
  if(overPop(e.target)){clearTimeout(closeT);closeT=null}
  else if(!closeT)closeT=setTimeout(()=>{closeT=null;if(!pinned)closePop()},160);
},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{if(!pinned)closePop()});
addEventListener('blur',()=>{if(!pinned)closePop()});
addEventListener('scroll',()=>{if(!pinned&&!pop.hidden&&!pop.matches(':hover'))closePop()},{passive:true});
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||pinned)return;const b=e.target.closest('[data-tipk]');if(!b)return;clearTimeout(infoT);infoT=setTimeout(()=>{if(b.matches(':hover')&&!pinned&&(pop.hidden||anchor!==b))b.click()},200)});

build();
</script>
