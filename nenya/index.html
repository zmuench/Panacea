<title>Nenya</title>

<style>
/* Layout: one narrow working column, tab rail on top, thumb-reach tab bar on the bottom.
   Palette and type match ICU Rounder and Dispo: fixed light theme, blue-gray ground, navy ink, royal blue accent. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-ink:#FFFFFF; --accent-soft:#E1E9FB;
  --pos:#1D6E49; --pos-soft:#E1F2E9; --neg:#A8261C; --neg-soft:#FBE7E5;
  --warn:#7A5000; --warn-soft:#FBF0D9;
  --f-display:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px}
.brandrow{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:28px;height:28px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:3px}
.sp{flex:1}
.saved{font-size:12px;color:var(--muted);text-align:right;line-height:1.25;max-width:150px}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);border-color:var(--neg);background:var(--surface)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.seg button:focus-visible,.rk:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1.step{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:20px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:62ch}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h2{font:700 1rem var(--f-body);margin:0;display:flex;align-items:center;gap:8px}
.sec h2 .aside{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:400 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip.on::before{content:"✓";color:var(--accent)}
.chip.x-neg.on{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.chip.x-neg.on::before{color:var(--neg)}
.chip.x-pos.on{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
.chip.x-pos.on::before{color:var(--pos)}
.chip .pts{font:600 .8rem var(--f-serif);opacity:.8}

/* priorities */
.plist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 4px;display:grid;grid-template-columns:34px 30px 1fr auto;gap:4px 8px;align-items:center;touch-action:pan-y}
.pitem.off{background:var(--sunk)}
.pitem.off .pname,.pitem.off .pno{color:var(--muted)}
.handle{width:34px;height:44px;display:grid;place-items:center;cursor:grab;color:var(--muted);touch-action:none}
.handle svg{width:18px;height:18px;fill:currentColor}
.pno{font:700 1.15rem var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.pbody{min-width:0}
.pname{font-weight:700;line-height:1.2}
.pdesc{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.wbar{grid-column:3/5;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wbar .track{flex:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.wbar .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pctl{display:flex;gap:4px}
.mini{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
.mini:disabled{opacity:.35;cursor:default}
.mini.tog{width:auto;padding:0 9px;font-size:12px}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 18px rgba(20,35,58,.16)}

/* programs */
.search{position:relative}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.4}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.res:first-child{border-top:none}
.res .rn{flex:1;min-width:0}
.res .rn b{display:block;font-weight:600;line-height:1.25}
.res .rn small{color:var(--muted);font-size:12px}
.added{font-size:12px;font-weight:700;color:var(--pos)}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit}
.pcard b{font-weight:700;line-height:1.25}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font:700 11.5px var(--f-body);padding:3px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);letter-spacing:.01em}
.pill.iv{background:var(--accent-soft);color:var(--accent)}
.pill.sch{background:var(--warn-soft);color:var(--warn)}
.pill.xp{background:var(--pos-soft);color:var(--pos)}
.pill.xn{background:var(--neg-soft);color:var(--neg)}
.pill.cu{background:var(--surface);border:1px solid var(--line)}
.scorebox{grid-row:1/3;grid-column:2;text-align:right}
.big{font:700 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.big.na{color:var(--muted);font-size:1.1rem}
.cov{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:15px}

/* form */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
label.f .was{font-weight:400;letter-spacing:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--neg);font-size:13px}

/* detail */
.back{margin-top:14px}
.dhead{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.dhead h1{font:700 1.45rem/1.15 var(--f-display);margin:0;text-wrap:balance;flex:1;min-width:0}
.dsub{color:var(--muted);font-size:14px;margin:4px 0 0}
.scorecard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.scorecard .big{font-size:2.4rem;color:var(--accent)}
.scorecard .big small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.math{font-size:13px;color:var(--muted);flex:1;min-width:180px}
.math b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{font:600 15px var(--f-serif);border:none;background:var(--sunk);color:var(--ink);width:42px;height:38px;cursor:pointer;border-left:1px solid var(--line);padding:0}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.auto{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:420px}
.seg.wide button{width:auto;height:auto;min-height:40px;padding:6px 8px;font:600 13.5px/1.2 var(--f-body)}
.doms{display:flex;flex-direction:column}
.dom{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.dom:first-child{border-top:none;padding-top:2px}
.dom.off{opacity:.55}
.domh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.domh .pr{font:700 13px var(--f-display);color:var(--accent);min-width:22px;font-variant-numeric:tabular-nums}
.domh b{flex:1;min-width:140px}
.tag{font:700 11px var(--f-body);padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tag.you{background:var(--ink);color:var(--surface)}
.tag.none{background:var(--sunk);color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin:0}
.why button{font:600 13px var(--f-body);color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
details.facts summary{font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;padding:2px 0}
dl.kv{margin:6px 0 0;display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:5px 12px;font-size:13px}
dl.kv dt{color:var(--muted);font-weight:600}
dl.kv dd{margin:0;white-space:pre-line;min-width:0;overflow-wrap:anywhere;font-family:var(--f-serif);font-size:14px}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);max-width:212px}
.confirm{padding:12px;border-radius:10px;border:1px solid var(--neg);background:var(--neg-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1 1 180px;font-weight:600}

/* rank */
.rks{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 8px;cursor:pointer;font:inherit;color:inherit}
.rk .no{font:700 1.5rem/1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.rk .mv{display:block;font:700 11px var(--f-body);margin-top:4px}
.mv.up{color:var(--pos)} .mv.dn{color:var(--neg)} .mv.new{color:var(--accent)}
.rk .mid{min-width:0;display:flex;flex-direction:column;gap:5px}
.rk .mid b{line-height:1.25}
.sbar{height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.sbar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:3px}
.sbar i.x{background:var(--pos)} .sbar i.xn{background:var(--neg);opacity:.5}
.rk .sc{text-align:right}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:62ch}
.note a{color:var(--accent)}

footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.barin{max-width:720px;margin:0 auto;padding-inline:8px;padding-block:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{border:none;background:none;font:600 12px var(--f-body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:10px;cursor:pointer;min-height:52px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.cur{color:var(--accent);background:var(--accent-soft)}
.tab .ct{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:420px){
  h1.step{font-size:1.45rem}
  .pitem{grid-template-columns:30px 24px 1fr}
  .pctl{grid-column:1/4;justify-content:flex-end}
  .wbar{grid-column:2/4}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  {k:'un',l:'Unionized',t:'yn'},{k:'pslf',l:'PSLF eligible',t:'yn'},{k:'mealY',l:'Meal stipend',t:'yn'},{k:'houseY',l:'Housing stipend',t:'yn'},{k:'moonY',l:'Moonlighting allowed',t:'yn'},
  {k:'web',l:'Website',t:'url',ph:'https://'}
];

/* ---------- state ---------- */
const LS_KEY = 'rankorder.v1';
function blank(){ return {v:1, order:DOMAINS.map(d=>d.id), off:[], prefs:{regions:[], len:0}, progs:[], snap:null, at:0}; }
let S = blank();
function sanitize(s){
  const b = blank(); if(!s||typeof s!=='object') return b;
  const order = Array.isArray(s.order)? s.order.filter(id=>DOM[id]) : [];
  DOMAINS.forEach(d=>{ if(!order.includes(d.id)) order.push(d.id); });
  return {v:1, order, off:(s.off||[]).filter(id=>DOM[id]), prefs:{regions:(s.prefs&&s.prefs.regions)||[], len:(s.prefs&&s.prefs.len)||0},
    progs:Array.isArray(s.progs)?s.progs:[], snap:s.snap||null, at:s.at||0};
}
try{ const raw=localStorage.getItem(LS_KEY); if(raw) S=sanitize(JSON.parse(raw)); }catch(e){}

let db=null, docRef=null, mode='device', saveTimer=null;
function setSaved(t){ document.getElementById('saved').textContent=t; }
function save(){
  S.at = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer);
  setSaved('Saving…');
  saveTimer = setTimeout(async ()=>{
    if(docRef && mode==='account'){
      try{ await docRef.set({json:JSON.stringify(S), at:S.at}); setSaved('Saved to your account'); return; }
      catch(e){ mode='device'; }
    }
    setSaved('Saved on this device');
  }, 700);
}
async function connect(){
  try{
    if(!window.claude||!claude.use) { setSaved('Saved on this device'); return; }
    db = await claude.use('db'); const user = await claude.use('user');
    const uid = user ? await user.id() : null;
    if(!db||!uid){ setSaved(S.at?'Saved on this device':''); return; }
    docRef = db.doc('data/users/'+uid+'/rankorder');
    const snap = await docRef.get();
    mode='account';
    if(snap.exists){
      const d = snap.data();
      if(d && d.at > S.at){ S = sanitize(JSON.parse(d.json)); try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} render(); }
      else if(S.at > (d&&d.at||0)) save();
      setSaved('Saved to your account');
    } else if(S.at){ save(); }
  }catch(e){ mode='device'; setSaved(S.at?'Saved on this device':''); }
}

/* ---------- scoring ---------- */
function progData(pr){ const base = pr.src==='sheet' ? (SHEET_BY.get(pr.key)||{n:pr.key}) : {n:pr.name}; const o = Object.assign({}, base, pr.ov||{}); if(o.st&&!o.rg) o.rg=STATE_REGION[o.st]; return o; }
function weights(){ const act=S.order.filter(id=>!S.off.includes(id)); const n=act.length; const w={}; act.forEach((id,i)=>w[id]=n-i); const tot=act.reduce((a,id)=>a+w[id],0); return {w,tot}; }
function rating(pr,id,p){ const u = pr.r&&pr.r[id]; if(u) return {v:u, src:'you'}; const a = DOM[id].auto(p); return a?{v:a.v, src:'sheet', why:a.why}:{v:null, src:'none'}; }
function score(pr){
  const p=progData(pr), {w,tot}=weights(); let sw=0, sv=0, n=0;
  for(const id in w){ const r=rating(pr,id,p); if(r.v){ sw+=w[id]; sv+=w[id]*(r.v-1)/4; n++; } else sv+=w[id]*0.5; }
  if(!sw) return {base:null, final:null, n:0, of:Object.keys(w).length, cov:0};
  const base = 100*sv/tot, x = pr.x||0;
  return {base, x, final:Math.max(0,Math.min(100,base+x)), n, of:Object.keys(w).length, cov:sw/tot};
}
function ranked(){ return S.progs.map(pr=>({pr, s:score(pr)})).sort((a,b)=>((b.s.final??-1)-(a.s.final??-1)) || a.pr.addedAt-b.pr.addedAt); }

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (sel,root=document) => root.querySelector(sel);
let toastT; function toast(m){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }
const shortName = n => n.replace(/\s+Program$/,'');
function statusPill(pr){ const s=pr.status||'con'; const cls=s==='iv'?'iv':s==='sch'?'sch':''; let t=STATUS.find(x=>x[0]===s)[1]; if(s==='sch') t=pr.date?'Interview '+fmtDate(pr.date):'Interview scheduled'; if(s==='iv') t='Interviewed'; return `<span class="pill ${cls}">${esc(t)}</span>`; }
function xPill(pr){ const x=pr.x||0; if(!x) return ''; return `<span class="pill ${x>0?'xp':'xn'}">${esc(XNAME[x]||'')} ${x>0?'+':''}${x}</span>`; }
function fmtDate(d){ const t=new Date(d+'T12:00'); return isNaN(t)?d:t.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
const grip = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

/* ---------- views ---------- */
let tab='pri', fromTab='prog', openId=null, query='', adding=false, confirmDel=false, editing=false;
function go(t,id){ if(tab==='rank'&&t!=='rank'){ S.snap=ranked().map(x=>x.pr.id); save(); } if(t==='detail') fromTab=tab==='detail'?fromTab:tab; tab=t; openId=id||null; confirmDel=false; editing=false; render(); window.scrollTo(0,0); }

function render(){
  document.querySelectorAll('.tab').forEach(b=>{ const cur = b.dataset.tab===tab || (tab==='detail'&&b.dataset.tab==='prog'); b.classList.toggle('cur',cur); b.setAttribute('aria-current',cur?'page':'false'); });
  $('#ctProg').textContent = S.progs.length?`(${S.progs.length})`:'';
  const v=$('#view');
  if(tab==='pri') v.innerHTML=viewPri();
  else if(tab==='prog') v.innerHTML=viewProg();
  else if(tab==='detail') v.innerHTML=viewDetail();
  else v.innerHTML=viewRank();
  if(tab==='pri') initSort();
}

function viewPri(){
  const {w,tot}=weights();
  const items = S.order.map((id,i)=>{
    const d=DOM[id], off=S.off.includes(id), pos=S.order.filter(x=>!S.off.includes(x)).indexOf(id)+1;
    const pct = off?0:Math.round(100*w[id]/tot);
    return `<li class="pitem${off?' off':''}" data-id="${id}">
      <span class="handle" aria-hidden="true">${grip}</span>
      <span class="pno">${off?'–':pos}</span>
      <div class="pbody"><div class="pname">${esc(d.name)}</div><div class="pdesc">${esc(d.desc)}</div></div>
      <div class="pctl">
        <button class="mini" type="button" data-act="up" data-id="${id}" aria-label="Move ${esc(d.name)} up" ${i===0?'disabled':''}>↑</button>
        <button class="mini" type="button" data-act="dn" data-id="${id}" aria-label="Move ${esc(d.name)} down" ${i===S.order.length-1?'disabled':''}>↓</button>
        <button class="mini tog" type="button" data-act="off" data-id="${id}" aria-pressed="${off}">${off?'Include':'Skip'}</button>
      </div>
      <div class="wbar"><span class="track"><i style="width:${Math.min(100,pct*4)}%"></i></span><span>${off?'Not counted':pct+'% of score'}</span></div>
    </li>`; }).join('');
  const regs = REGIONS.map(([r,sts])=>`<button class="chip${S.prefs.regions.includes(r)?' on':''}" type="button" data-act="reg" data-r="${esc(r)}" title="${esc(sts)}">${esc(r)}</button>`).join('');
  const lens = [[0,'No preference'],[3,'3 years'],[4,'4 years']].map(([v,l])=>`<button class="chip${S.prefs.len===v?' on':''}" type="button" data-act="len" data-v="${v}">${l}</button>`).join('');
  return `<h1 class="step">What matters most to you?</h1>
  <p class="lede">Drag the domains into order of importance. The top one carries the most weight in every program's score. Skip any that don't matter to you.</p>
  <ol class="plist" id="plist">${items}</ol>
  <section class="sec"><h2>Regions you'd like to live in <span class="aside">${S.prefs.regions.length||'None'} picked</span></h2>
    <div class="chips">${regs}</div>
    <p class="fine">Programs in these regions start with a 5 for location, others a 2. You can change any program's score.</p></section>
  <section class="sec"><h2>Preferred program length</h2><div class="chips">${lens}</div></section>
  <div class="toolbar"><button class="btn primary" type="button" data-act="goto" data-t="prog">Add programs</button></div>`;
}

let sortable=null;
function initSort(){
  if(!window.Sortable) return;
  const el=$('#plist'); if(!el) return;
  sortable = Sortable.create(el,{handle:'.handle',animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
    onEnd:()=>{ S.order=[...el.children].map(li=>li.dataset.id); save(); render(); }});
}

function resHTML(){
  if(query.trim().length<2) return '';
  const have = new Set(S.progs.filter(p=>p.src==='sheet').map(p=>p.key));
  const toks=query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=SHEET.filter(p=>{ const h=(p.n+' '+(p.st||'')).toLowerCase(); return toks.every(t=>h.includes(t)); }).slice(0,8);
  return hits.length? `<div class="results">${hits.map(p=>`<div class="res"><div class="rn"><b>${esc(shortName(p.n))}</b><small>${esc([p.st,p.len?p.len+' yr':'',p.pay?money(p.pay):''].filter(Boolean).join(' · '))}</small></div>${have.has(p.n)?'<span class="added">Added</span>':`<button class="btn sm" type="button" data-act="add" data-k="${esc(p.n)}">Add</button>`}</div>`).join('')}</div>`
    : `<p class="fine">No program on the sheet matches “${esc(query)}”. Add it yourself below.</p>`;
}
function viewProg(){
  const r = ranked();
  const cards = r.length? `<div class="pcards">${r.map(({pr,s})=>{ const p=progData(pr); return `<button class="pcard" type="button" data-act="open" data-id="${pr.id}">
      <b>${esc(shortName(p.n))}</b>
      <span class="scorebox">${s.final==null?'<span class="big na">—</span>':`<span class="big">${Math.round(s.final)}</span>`}<span class="cov">${s.n}/${s.of} rated</span></span>
      <span class="meta">${esc(p.st||'')}${statusPill(pr)}${xPill(pr)}${pr.src==='custom'?'<span class="pill cu">Added by you</span>':''}</span></button>`; }).join('')}</div>`
    : `<div class="empty"><b>No programs yet</b>Search the applicant spreadsheet above, or add a program yourself. Each one gets a starting score from the sheet that you refine after the interview.</div>`;
  return `<h1 class="step">Your programs</h1>
  <p class="lede">Add each program as you interview. Data comes from the 2026–2027 EM Applicant Spreadsheet.</p>
  <section class="sec"><h2>Find a program</h2>
    <input type="search" id="q" placeholder="Search by name or state, e.g. Hennepin, Ohio" value="${esc(query)}" autocomplete="off" aria-label="Search programs">
    <div id="resbox">${resHTML()}</div>
    ${adding? addForm() : `<div><button class="btn ghost sm" type="button" data-act="adding">Not on the sheet? Add it yourself</button></div>`}
  </section>
  <section class="sec"><h2>Added <span class="aside">${S.progs.length} program${S.progs.length===1?'':'s'}</span></h2>${cards}</section>
  <p class="note">Program data is a snapshot of the <a href="${SHEET_URL}" target="_blank" rel="noopener">crowd-sourced applicant spreadsheet</a> taken ${SNAP_DATE}. It is self-reported and can be out of date. Fill in or correct anything on a program's page.</p>`;
}

function fieldInput(f, val, idp){
  const id=idp+f.k;
  if(f.t==='state') return `<select id="${id}" data-f="${f.k}"><option value=""></option>${STATES.map(s=>`<option${s===val?' selected':''}>${esc(s)}</option>`).join('')}</select>`;
  if(f.t==='sel') return `<select id="${id}" data-f="${f.k}">${f.o.map(([v,l])=>`<option value="${v}"${String(v)===String(val??'')?' selected':''}>${l}</option>`).join('')}</select>`;
  if(f.t==='yn') return `<select id="${id}" data-f="${f.k}"><option value=""></option><option value="1"${val===1?' selected':''}>Yes</option><option value="0"${val===0?' selected':''}>No</option></select>`;
  return `<input id="${id}" data-f="${f.k}" type="${f.t==='num'?'number':f.t==='url'?'url':'text'}" inputmode="${f.t==='num'?'numeric':'text'}" placeholder="${esc(f.ph||'')}" value="${esc(val??'')}">`;
}
function addForm(){
  return `<form id="addf" class="sec" style="margin:0;background:var(--sunk)">
    <h2>Add a program yourself</h2>
    <label class="f">Program name<input type="text" id="nf_name" required placeholder="e.g. Community Hospital EM Residency"></label>
    <div class="grid">${FIELDS.map(f=>`<label class="f">${esc(f.l)}${fieldInput(f,null,'nf_')}</label>`).join('')}</div>
    <p class="err" id="nf_err" hidden>Enter the program's name.</p>
    <div class="row"><button class="btn primary" type="submit">Add program</button><button class="btn ghost" type="button" data-act="adding">Cancel</button></div>
  </form>`;
}
function readFields(root,idp){ const o={}; FIELDS.forEach(f=>{ const el=root.querySelector('#'+idp+f.k); if(!el) return; const v=el.value.trim(); if(v==='') return;
  if(f.t==='num'||f.t==='sel'||f.t==='yn') { const n=parseFloat(v); if(!isNaN(n)) o[f.k]=n; } else o[f.k]=v; }); return o; }

function viewDetail(){
  const pr=S.progs.find(p=>p.id===openId); if(!pr){ tab='prog'; return viewProg(); }
  const p=progData(pr), s=score(pr), {w,tot}=weights();
  const act=S.order.filter(id=>!S.off.includes(id));
  const doms = S.order.map(id=>{
    const d=DOM[id], off=S.off.includes(id), r=rating(pr,id,p), auto=d.auto(p);
    const btns=[1,2,3,4,5].map(n=>`<button type="button" class="${r.v===n?(r.src==='you'?'on':'auto'):''}" data-act="rate" data-d="${id}" data-v="${n}" aria-pressed="${r.v===n}" aria-label="${esc(d.name)}: ${n}">${n}</button>`).join('');
    const tag = r.src==='you'?'<span class="tag you">Your score</span>':r.src==='sheet'?'<span class="tag">From sheet</span>':'<span class="tag none">Not rated</span>';
    let why='';
    if(r.src==='sheet') why=`<p class="why">${esc(r.why)}</p>`;
    else if(r.src==='you'&&auto) why=`<p class="why">Sheet suggested ${auto.v}. <button type="button" data-act="clr" data-d="${id}">Use sheet value</button></p>`;
    else if(r.src==='you') why=`<p class="why"><button type="button" data-act="clr" data-d="${id}">Clear</button></p>`;
    const facts=d.facts.map(([l,k])=>{ let v=p[k]; if(k==='un'||k==='pslf') v=yesno(v)||''; if(v==null||v==='') return ''; return `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`; }).join('');
    return `<div class="dom${off?' off':''}">
      <div class="domh"><span class="pr">${off?'–':'#'+(act.indexOf(id)+1)}</span><b>${esc(d.name)}</b>${off?'<span class="tag none">Skipped</span>':tag}</div>
      <div class="row"><div class="seg" role="group" aria-label="${esc(d.name)}">${btns}</div></div>
      ${why}
      ${facts?`<details class="facts"><summary>What the sheet says</summary><dl class="kv">${facts}</dl></details>`:''}
    </div>`; }).join('');
  const xs = XF.map(([v,l,c])=>`<button class="chip ${c}${(pr.x||0)===v?' on':''}" type="button" data-act="x" data-v="${v}">${l} <span class="pts">${v>0?'+':''}${v}</span></button>`).join('');
  const st = STATUS.map(([v,l])=>`<button type="button" class="${(pr.status||'con')===v?'on':''}" data-act="status" data-v="${v}">${l}</button>`).join('');
  const math = s.final==null? 'Rate a few domains to get a score.' :
    `Weighted fit <b>${Math.round(s.base)}</b>${s.x?` ${s.x>0?'+':'−'} X factor <b>${Math.abs(s.x)}</b>`:''}. ${s.n} of ${s.of} domains scored, covering ${Math.round(s.cov*100)}% of your priority weight. Unscored domains count as a neutral 3.`;
  const editFields = FIELDS.map(f=>{ const sheetV = pr.src==='sheet'?(SHEET_BY.get(pr.key)||{})[f.k]:undefined; const cur=(pr.ov||{})[f.k]; const was = sheetV!=null&&sheetV!==''?` <span class="was">(sheet: ${esc(f.t==='yn'?yesno(sheetV):f.k==='pay'?money(sheetV):sheetV)})</span>`:'';
    return `<label class="f">${esc(f.l)}${was}${fieldInput(f,cur!=null?cur:sheetV,'ed_')}</label>`; }).join('');
  return `<button class="btn ghost sm back" type="button" data-act="goto" data-t="${fromTab}">← ${fromTab==='rank'?'Rank list':'Programs'}</button>
  <div class="dhead"><div style="flex:1;min-width:0"><h1>${esc(shortName(p.n))}</h1>
    <p class="dsub">${esc([p.st,p.rg,p.len?p.len+'-year':''].filter(Boolean).join(' · '))}${p.up?` · Sheet updated ${esc(p.up)}`:''}</p></div></div>
  <section class="sec"><div class="scorecard"><span class="big">${s.final==null?'—':Math.round(s.final)}<small>/ 100</small></span><p class="math">${math}</p></div></section>
  <section class="sec"><h2>Interview</h2>
    <div class="row"><div class="seg wide" role="group" aria-label="Status">${st}</div></div>
    <label class="f" style="max-width:220px">Interview date<input type="date" id="ivdate" value="${esc(pr.date||'')}"></label></section>
  <section class="sec"><h2>X factor</h2><p class="fine">Your gut feeling after the interview. Adds or subtracts points from the weighted score.</p><div class="chips">${xs}</div></section>
  <section class="sec"><h2>Domain scores <span class="aside">1 poor fit · 5 great fit</span></h2>
    <p class="fine">Shaded scores come from the spreadsheet. Tap a number to set your own; tap it again to clear.</p>
    <div class="doms">${doms}</div></section>
  <section class="sec"><h2>Notes</h2><textarea id="notes" placeholder="Interview day impressions, residents you met, questions to follow up on">${esc(pr.note||'')}</textarea></section>
  <section class="sec"><h2>Program details <span class="aside">${pr.src==='custom'?'Added by you':'Fill in what the sheet is missing'}</span></h2>
    ${editing?`<form id="edf"><div class="grid">${editFields}</div><div class="row" style="margin-top:10px"><button class="btn primary" type="submit">Save details</button><button class="btn ghost" type="button" data-act="edit">Cancel</button></div></form>`
      :`<div class="row"><button class="btn sm" type="button" data-act="edit">Edit details</button>${p.web?`<a class="btn sm ghost" href="${esc(p.web)}" target="_blank" rel="noopener">Program website</a>`:''}</div>`}
  </section>
  <section class="sec">${confirmDel?`<div class="confirm"><p>Remove this program and its scores?</p><button class="btn danger" type="button" data-act="del">Remove</button><button class="btn ghost" type="button" data-act="delc">Keep</button></div>`:`<div><button class="btn danger sm" type="button" data-act="delc">Remove program</button></div>`}</section>`;
}

function viewRank(){
  const r=ranked(); const prev=S.snap||[];
  if(!r.length) return `<h1 class="step">Rank list</h1><div class="empty" style="margin-top:12px"><b>Your rank list builds itself</b>Add programs and score them after each interview. They'll sort here by how well they fit your priorities.</div><div class="toolbar"><button class="btn primary" type="button" data-act="goto" data-t="prog">Add programs</button></div>`;
  const top = S.order.filter(id=>!S.off.includes(id)).slice(0,3).map(id=>DOM[id].name).join(', ');
  const rows=r.map(({pr,s},i)=>{ const p=progData(pr); const was=prev.indexOf(pr.id);
    let mv=''; if(prev.length){ if(was<0) mv='<span class="mv new">New</span>'; else if(was>i) mv=`<span class="mv up">▲${was-i}</span>`; else if(was<i) mv=`<span class="mv dn">▼${i-was}</span>`; }
    const b=s.base==null?0:s.base, f=s.final==null?0:s.final;
    const bar = s.x>0? `<i style="width:${f}%" class="x"></i><i style="width:${b}%"></i>` : s.x<0? `<i style="width:${Math.min(100,b)}%" class="xn"></i><i style="width:${f}%"></i>` : `<i style="width:${f}%"></i>`;
    return `<button class="rk" type="button" data-act="open" data-id="${pr.id}">
      <span class="no">${i+1}${mv}</span>
      <span class="mid"><b>${esc(shortName(p.n))}</b><span class="meta">${esc(p.st||'')}${statusPill(pr)}${xPill(pr)}</span><span class="sbar">${bar}</span></span>
      <span class="sc">${s.final==null?'<span class="big na">—</span>':`<span class="big">${Math.round(s.final)}</span>`}<span class="cov">${s.n}/${s.of}</span></span></button>`; }).join('');
  return `<h1 class="step">Rank list</h1>
  <p class="lede">Sorted by fit with your priorities, led by ${esc(top)}. The order shifts as you add scores and X factors. Arrows show movement since you last looked.</p>
  <div class="rks">${rows}</div>
  <div class="toolbar"><button class="btn" type="button" data-act="copy">Copy list</button><button class="btn ghost" type="button" data-act="goto" data-t="pri">Adjust priorities</button></div>
  <p class="note">Programs start from spreadsheet data, and anything not yet scored counts as neutral, so early scores cluster near the middle. Green on a bar is X factor added; faded red is X factor taken away. Numbers under each score are domains rated out of domains counted. This is a planning tool. Certify your final list in the NRMP R3 system.</p>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='goto') return go(t.dataset.t);
  if(a==='up'||a==='dn'){ const i=S.order.indexOf(id), j=a==='up'?i-1:i+1; if(j<0||j>=S.order.length) return; [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; save(); render(); const btn=document.querySelector(`[data-act="${a}"][data-id="${id}"]`); if(btn&&!btn.disabled) btn.focus(); return; }
  if(a==='off'){ S.off = S.off.includes(id)? S.off.filter(x=>x!==id) : [...S.off,id]; save(); render(); return; }
  if(a==='reg'){ const r=t.dataset.r; S.prefs.regions = S.prefs.regions.includes(r)? S.prefs.regions.filter(x=>x!==r):[...S.prefs.regions,r]; save(); render(); return; }
  if(a==='len'){ S.prefs.len=+t.dataset.v; save(); render(); return; }
  if(a==='add'){ const k=t.dataset.k; if(S.progs.some(p=>p.key===k)) return; S.progs.push({id:'p'+Date.now().toString(36), src:'sheet', key:k, r:{}, x:0, status:'con', addedAt:Date.now()}); save(); render(); toast('Added '+shortName(k)); return; }
  if(a==='adding'){ adding=!adding; render(); if(adding) $('#nf_name')?.focus(); return; }
  if(a==='open') return go('detail', id);
  const pr=S.progs.find(p=>p.id===openId);
  if(!pr) return;
  if(a==='rate'){ const d=t.dataset.d, v=+t.dataset.v; pr.r=pr.r||{}; if(pr.r[d]===v) delete pr.r[d]; else pr.r[d]=v; save(); keepScroll(render); return; }
  if(a==='clr'){ delete pr.r[t.dataset.d]; save(); keepScroll(render); return; }
  if(a==='x'){ pr.x=+t.dataset.v; save(); keepScroll(render); return; }
  if(a==='status'){ pr.status=t.dataset.v; save(); keepScroll(render); return; }
  if(a==='edit'){ editing=!editing; keepScroll(render); return; }
  if(a==='delc'){ confirmDel=!confirmDel; keepScroll(render); return; }
  if(a==='del'){ S.progs=S.progs.filter(p=>p.id!==pr.id); save(); toast('Program removed'); go('prog'); return; }
});
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act="copy"]'); if(!t) return;
  const txt = ranked().map(({pr,s},i)=>`${i+1}. ${shortName(progData(pr).n)}${s.final==null?'':` (${Math.round(s.final)})`}`).join('\n');
  const done=()=>toast('Rank list copied');
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt)); }catch(err){ fallbackCopy(txt); }
});
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Rank list copied'); }catch(e){ toast('Copy not available here'); } ta.remove(); }
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ query=e.target.value; $('#resbox').innerHTML=resHTML(); return; }
  const pr=S.progs.find(p=>p.id===openId); if(!pr) return;
  if(e.target.id==='notes'){ pr.note=e.target.value; save(); }
});
document.addEventListener('change', e=>{
  const pr=S.progs.find(p=>p.id===openId); if(!pr) return;
  if(e.target.id==='ivdate'){ pr.date=e.target.value; if(pr.date&&(pr.status||'con')==='con') pr.status='sch'; save(); keepScroll(render); }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='addf'){ const name=$('#nf_name').value.trim(); if(!name){ $('#nf_err').hidden=false; $('#nf_name').focus(); return; }
    const ov=readFields(e.target,'nf_'); S.progs.push({id:'c'+Date.now().toString(36), src:'custom', name, ov, r:{}, x:0, status:'con', addedAt:Date.now()});
    adding=false; save(); toast('Added '+name); render(); return; }
  if(e.target.id==='edf'){ const pr=S.progs.find(p=>p.id===openId); if(!pr) return; const vals=readFields(e.target,'ed_'); const base=pr.src==='sheet'?(SHEET_BY.get(pr.key)||{}):{};
    const ov={}; for(const k in vals){ if(base[k]!==vals[k]) ov[k]=vals[k]; } pr.ov=ov; editing=false; save(); toast('Details saved'); keepScroll(render); }
});

render();
setSaved(S.at?'Saved on this device':'');
connect();
</script>
