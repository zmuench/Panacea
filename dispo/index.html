<style>
/* Layout: one narrow working column, step rail on top, thumb-reach nav bar on the bottom.
   Palette and type match ICU Rounder: fixed light theme, blue-gray ground, navy ink, royal blue accent. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-ink:#FFFFFF; --accent-soft:#E1E9FB;
  --pos:#A8261C; --pos-soft:#FBE7E5; --neg:#1D6E49; --neg-soft:#E1F2E9;
  --warn:#7A5000; --warn-soft:#FBF0D9; --paper:#FBFCFD;
  --f-display:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-top:3px}
.topin .sp{flex:1}
.iconbtn{width:44px;padding:0;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on svg{stroke:var(--accent)}
.brandrow{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:28px;height:28px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-8deg)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;white-space:nowrap}
.btn.danger{color:var(--pos);border-color:var(--pos)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail{display:flex;gap:6px;overflow-x:auto;padding-inline:16px;padding-block:2px 10px;max-width:720px;margin:0 auto;scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;font:400 .9rem var(--f-body);border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.rail button .n{font-family:var(--f-display);font-size:14px}
.rail button.has{color:var(--ink)}
.rail button.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rail button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.rail button.cur::after{background:var(--bg)}
.banner{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--ink)}
.confirm{margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--pos);background:var(--pos-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1 1 180px;font-weight:600}
h1.step{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:20px 0 4px;letter-spacing:-.01em;text-wrap:balance}
h1.step .k{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.lede{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:60ch}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h2{font:700 1rem var(--f-body);color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
.sec h2 .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:400 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-align:left;line-height:1.2}
.chip.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);font-weight:700}
.chip.on::before{content:"✓";color:var(--accent)}
.chip.sel-on::before{content:none}
.chip.pos{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
.chip.neg{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.chip.ab.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.ab.on::before{color:var(--warn)}
.chips.sel .chip.on::before,.tabs .chip.on::before{content:none}
.tabs .chip.on{background:var(--accent);color:var(--accent-ink)}
.chip .mark{font:700 15px var(--f-mono);width:12px;text-align:center}
.chip.tri:not(.pos):not(.neg) .mark{display:none}
.chip.lik{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .tag{font:700 .72rem var(--f-body);opacity:.85}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.dot.p{background:var(--pos-soft);border-color:var(--pos)} .dot.n{background:var(--neg-soft);border-color:var(--neg)}
.dot.l{background:var(--ink);border-color:var(--ink)} .dot.c{background:var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
input[type=text],input[type=number],input:not([type]),textarea,select{font:400 16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid.v{grid-template-columns:repeat(3,minmax(0,1fr))}
.vin{font-variant-numeric:tabular-nums}
.live{font-size:13px;color:var(--muted);min-height:1em}
.live b{color:var(--ink)}
.flagline{display:flex;flex-wrap:wrap;gap:6px}
.flag{font:600 12px var(--f-body);padding:4px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--sunk)}
.item .hd{display:flex;align-items:center;gap:8px}
.item .hd strong{font-family:var(--f-display);font-size:1.05rem;flex:1}
.x{border:none;background:none;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;padding:6px}
.score{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.score .lbl{font-size:14px}
.score .lbl small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:600 14px var(--f-mono);border:none;background:var(--sunk);color:var(--ink);width:40px;height:36px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.total{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.total small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.cx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cx div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px}
.cx span{display:block;font-size:.8rem;font-weight:700;color:var(--muted)}
.cx b{font-family:var(--f-display);font-size:1.1rem}
.cxall{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cxall .total{color:var(--accent)}
.fine{font-size:12px;color:var(--muted);margin:0}
.out{font:400 1.02rem/1.6 var(--f-mono);min-height:340px;background:var(--paper);white-space:pre-wrap;border-radius:14px}
.tabs{display:flex;gap:6px}
.tabs .chip{flex:1;justify-content:center;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:40}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.barin{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px}
.barin .mid{flex:1;text-align:center;font:600 13px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin .btn{min-width:92px}
.picker{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;padding-right:2px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{font:700 .85rem var(--f-body);color:var(--muted)}
input[type=search]{font:400 16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.chips.sel .chip{padding-right:8px}
.xx{font:600 16px var(--f-body);opacity:.8;margin-left:2px}
.sec.redflags{border-color:var(--pos);border-width:1.5px}
.sec.redflags h2{color:var(--pos)}
.chip.rf:not(.pos):not(.neg){border-style:dashed}
h3.sub{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:24px 0 2px}
.sitems{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;flex-direction:column;gap:6px}
.sitem.row{flex-direction:row;align-items:center}
.sitem .lbl{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.auto{font:700 .72rem var(--f-body);color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.res{border-top:1px solid var(--line);padding-top:10px}
.grow{flex:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.chip.sugg{border-color:var(--accent);color:var(--accent);font-weight:600}
.warnbox{padding:9px 11px;border-radius:9px;background:var(--pos-soft);color:var(--pos);font-size:13px}
.warnbox b,.cautionbox b{color:inherit}
.cautionbox{padding:9px 11px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.preview{border-left:3px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.preview p{margin:0}
.privacy{font-size:12px;color:var(--muted);margin:22px 0 0;max-width:60ch}
@media (max-width:420px){ h1.step{font-size:1.45rem} .grid.v{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="topin">
    <a class="homebtn" href="../" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>
    <div class="brandrow"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.3c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><div class="brand">Dispo<small>MDM and discharge text</small></div></div>

</header>

<div class="wrap">
  <div id="notice"></div>
  <main id="view"></main>
  <p class="privacy">Nothing you enter is saved or sent anywhere. It stays on this screen until you tap New patient or close the page. Leave out names, MRNs, and dates of birth.</p>
</div>

<footer class="bar">
  <div class="barin">
    <button class="btn" id="back" type="button">Back</button>
    <div class="mid" id="where"></div>

  </div>
</footer>

<script>
/* ---------- shared helpers ---------- */
const num = v => { const n=parseFloat(v); return isNaN(n)?null:n; };
function ageY(s){ const a=num(s.age); if(a==null) return null; return s.ageUnit==='y.o.'?a : s.ageUnit==='m.o.'?a/12 : a/365; }
function ageDays(s){ const a=num(s.age); if(a==null) return null; return s.ageUnit==='days old'?a : s.ageUnit==='m.o.'?a*30.4 : a*365; }
const isChild = s => { const y=ageY(s); return s.ageUnit!=='y.o.' || (y!=null && y<18); };
function tempF(s){ const t=num(s.vitals.temp); return t==null?null:(t<50? t*9/5+32 : t); }
const hasPm = (s,x) => s.pmhx.includes(x);
const hxIs = (s,k,v) => s.hx[k]===v;

/* ---------- reference lists ---------- */
const PMHX = ['HTN','HLD','T2DM','T1DM','CAD','Prior MI','CHF','AFib','COPD','Asthma','CKD','ESRD on HD','Cirrhosis','Prior stroke','DVT/PE','Active cancer','Obesity','Tobacco use','Alcohol use disorder','IVDU','Immunocompromise','Chronic anticoagulation','Family hx premature CAD'];
const GENERIC_RP = ['Symptoms get worse or do not improve','New symptoms that worry you'];
const GENERIC_RP_PEDS = ['Gets worse or does not improve','Has any new symptom that worries you'];

const LABS = [
  {g:'CBC', items:[
    {id:'cbc_nl',t:'CBC',label:'Normal',n:'CBC',pt:'blood count was normal'},
    {id:'anemia',t:'CBC',label:'Anemia',ab:'anemia',pt:'red blood cell count was low (anemia)'},
    {id:'leuk',t:'CBC',label:'Leukocytosis',ab:'leukocytosis',pt:'white blood cell count was high, which can happen with infection or stress on the body'},
    {id:'leukopenia',t:'CBC',label:'Leukopenia',ab:'leukopenia',pt:'white blood cell count was low'},
    {id:'anc_hi',t:'CBC',label:'ANC > 4,090',ab:'ANC above 4,090',pt:null},
    {id:'thrombo',t:'CBC',label:'Thrombocytopenia',ab:'thrombocytopenia',pt:'platelet count was low'}]},
  {g:'BMP / CMP', items:[
    {id:'bmp_nl',t:'BMP',label:'Normal',n:'BMP',pt:'blood chemistry tests were normal'},
    {id:'hypok',t:'BMP',label:'Hypokalemia',ab:'hypokalemia',pt:'potassium level was low'},
    {id:'hyperk',t:'BMP',label:'Hyperkalemia',ab:'hyperkalemia',pt:'potassium level was high'},
    {id:'hypona',t:'BMP',label:'Hyponatremia',ab:'hyponatremia',pt:'sodium level was low'},
    {id:'hyperna',t:'BMP',label:'Hypernatremia',ab:'hypernatremia',pt:'sodium level was high'},
    {id:'hyperca',t:'BMP',label:'Hypercalcemia',ab:'hypercalcemia',pt:'calcium level was high'},
    {id:'aki',t:'BMP',label:'AKI',ab:'acute kidney injury',pt:'kidney function test was higher than normal'},
    {id:'cr_base',t:'BMP',label:'Creatinine at baseline',ab:'creatinine at baseline',pt:null},
    {id:'hypergly',t:'BMP',label:'Hyperglycemia',ab:'hyperglycemia',pt:'blood sugar was high'},
    {id:'hypogly',t:'BMP',label:'Hypoglycemia',ab:'hypoglycemia',pt:'blood sugar was low'},
    {id:'agma',t:'BMP',label:'AG metabolic acidosis',ab:'anion gap metabolic acidosis',pt:'blood acid level was abnormal'},
    {id:'nagma',t:'BMP',label:'Low bicarbonate, no gap',ab:'non-gap metabolic acidosis',pt:'blood acid level was abnormal'}]},
  {g:'Glucose / ketones', items:[
    {id:'poc_nl',t:'POC',label:'POC glucose normal',s:'Point-of-care glucose normal.',pt:'blood sugar was normal'},
    {id:'ket_neg',t:'KET',label:'Ketones negative',s:'Serum ketones negative.',pt:null},
    {id:'ket_pos',t:'KET',label:'Ketones elevated',ab:'elevated beta-hydroxybutyrate',pt:'ketones (a sign of diabetic acidosis) were elevated'},
    {id:'dka',t:'VBG',label:'pH and bicarb meet DKA criteria',ab:'metabolic acidosis meeting DKA criteria',pt:'blood tests showed diabetic ketoacidosis (DKA)'},
    {id:'a1c',t:'A1C',label:'A1c elevated',ab:'elevated hemoglobin A1c',pt:'3-month sugar average (A1c) was high'}]},
  {g:'Hepatic / pancreatic', items:[
    {id:'lft_nl',t:'LFT',label:'LFTs normal',n:'LFTs',pt:'liver tests were normal'},
    {id:'transam',t:'LFT',label:'Transaminitis',ab:'transaminitis',pt:'liver tests were elevated'},
    {id:'tbili',t:'LFT',label:'Hyperbilirubinemia',ab:'hyperbilirubinemia',pt:'bilirubin (a liver test) was elevated'},
    {id:'lip_nl',t:'LIP',label:'Lipase normal',n:'lipase',pt:'pancreas test (lipase) was normal'},
    {id:'lip_hi',t:'LIP',label:'Lipase elevated',ab:'elevated lipase',pt:'pancreas test (lipase) was elevated'},
    {id:'nh3_hi',t:'NH3',label:'Ammonia elevated',ab:'elevated ammonia',pt:null}]},
  {g:'Cardiac', items:[
    {id:'trop_neg',t:'TROP',label:'Troponin negative',s:'Troponin negative.',pt:'heart blood test (troponin) was normal'},

    {id:'bnp_nl',t:'BNP',label:'BNP normal',n:'BNP',pt:'heart strain test (BNP) was normal'},
    {id:'bnp_hi',t:'BNP',label:'BNP elevated',ab:'elevated BNP',pt:'heart strain test (BNP) was elevated'},
    {id:'tsh_nl',t:'TSH',label:'TSH normal',n:'TSH',pt:'thyroid test was normal'},

  {g:'Infection / inflammation', items:[
    {id:'lac_nl',t:'LAC',label:'Lactate normal',n:'lactate',pt:'lactate was normal'},

    {id:'pct_nl',t:'PCT',label:'Procalcitonin ≤ 0.5',n:'procalcitonin',pt:null},

/* ---------- text helpers ---------- */
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function joinList(a,conj){a=a.filter(Boolean); if(a.length<=1) return a.join(''); if(a.length===2) return a[0]+' '+conj+' '+a[1]; return a.slice(0,-1).join(', ')+', '+conj+' '+a[a.length-1];}
const andL = a=>joinList(a,'and'), orL = a=>joinList(a,'or');
const cap = t => t ? t.charAt(0).toUpperCase()+t.slice(1) : t;
const lc = t => (!t||/^[A-Z0-9]{2,}|^[A-Z][a-z]*[A-Z]/.test(t)) ? t : t.charAt(0).toLowerCase()+t.slice(1);
const sent = t => { t=(t||'').trim(); if(!t) return ''; t=cap(t); return /[.!?]$/.test(t)?t:t+'.'; };
const noDot = t => (t||'').trim().replace(/\.$/,'');
const lines = t => (t||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean);
const commas = t => (t||'').split(',').map(x=>x.trim()).filter(Boolean);
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k];});a[ks[ks.length-1]]=v;}
const key = it => typeof it==='string'?it:it.k;

/* ---------- complaints (merged when more than one is selected) ---------- */
function cdef(s){
  const list = s.ccs.map(k=>COMPLAINTS[k]).filter(Boolean);
  const uniq = arr => { const seen=new Set(); return arr.filter(it=>{const k=key(it); if(seen.has(k)) return false; seen.add(k); return true;}); };
  const pick = f => uniq(list.flatMap(c=>c[f]||[]));
  return {list, rf:pick('rf'), hx:pick('hx'), ex:pick('ex'), dd:pick('dd'), rp:pick('rp'), care:pick('care'),
    sc:[...new Set(list.flatMap(c=>c.sc||[]))].filter(id=>{const d=SCORES[id]; if(!d.ages) return true; const a=ageY(s); return a==null || (a>=d.ages[0] && a<d.ages[1]);}),
    procs:[...new Set(list.map(c=>c.proc).filter(Boolean))], peds:list.some(c=>c.peds)};
}
function ccNames(s){
  const n = s.ccs.filter(k=>k!=='other').map(k=>COMPLAINTS[k].cc);
  if(s.ccs.includes('other') && s.ccOther.trim()) n.push(s.ccOther.trim());
  return n;
}
function ptNames(s){
  const n = s.ccs.filter(k=>k!=='other').map(k=>COMPLAINTS[k].pt);
  if(s.ccs.includes('other') && s.ccOther.trim()) n.push(s.ccOther.trim());
  return [...new Set(n)];
}
/* tri-state findings: plain items go into lists, {k,p,n} items become their own sentences */
function splitFindings(items,map){
  const pos=[],neg=[],own=[];
  items.forEach(it=>{const k=key(it), st=map[k]; if(!st) return;
    if(typeof it!=='string'){ own.push(st==='+'?it.p:it.n); return; }
    (st==='+'?pos:neg).push(k);});
  return {pos,neg,own};
}

/* ---------- vitals ---------- */
function vitalFlags(v){
  const f=[], hr=num(v.hr), sbp=num(v.sbp), dbp=num(v.dbp), rr=num(v.rr), sp=num(v.spo2), t=num(v.temp);
  const tF = t==null?null:(t<50? t*9/5+32 : t);
  if(hr!=null){ if(hr>100) f.push(`tachycardia (HR ${hr})`); else if(hr<50) f.push(`bradycardia (HR ${hr})`); }
  if(sbp!=null){ const bp = dbp!=null?`${sbp}/${dbp}`:`${sbp}`; if(sbp<90) f.push(`hypotension (BP ${bp})`); else if(sbp>=180||(dbp!=null&&dbp>=110)) f.push(`hypertension (BP ${bp})`); }
  if(rr!=null){ if(rr>20) f.push(`tachypnea (RR ${rr})`); else if(rr<10) f.push(`bradypnea (RR ${rr})`); }
  if(sp!=null && sp<92) f.push(`hypoxia (SpO2 ${sp}% on ${v.o2||'RA'})`);
  if(tF!=null){ const ts = t<50?`${t} C`:`${t} F`; if(tF>=100.4) f.push(`fever (T ${ts})`); else if(tF<95) f.push(`hypothermia (T ${ts})`); }
  return {flags:f, any:[hr,sbp,rr,sp,t].some(x=>x!=null)};
}
/* pediatric vitals: adult HR/RR cutoffs do not apply, so only temperature and SpO2 are flagged automatically */
/* pediatric normal ranges (PALS-style, awake): HR and RR by age, minimum SBP by age */
function pedsRanges(y){
  const hr = y<0.25?[85,205] : y<2?[100,190] : y<10?[60,140] : [60,100];
  const rr = y<1?[30,53] : y<3?[22,37] : y<6?[20,28] : y<12?[18,25] : [12,20];
  const sbpMin = y<28/365?60 : y<1?70 : y<10?Math.round(70+2*y) : 90;
  return {hr,rr,sbpMin};
}
function vitalFlagsFor(s){
  if(!isChild(s)) return vitalFlags(s.vitals);
  const base=vitalFlags(s.vitals), y=ageY(s);
  const keep=base.flags.filter(x=>/^(fever|hypothermia|hypoxia)/.test(x));
  if(y==null) return {flags:keep, any:base.any, noAge:true};
  const R=pedsRanges(y), v=s.vitals, hr=num(v.hr), rr=num(v.rr), sbp=num(v.sbp), dbp=num(v.dbp), f=[];
  if(hr!=null){ if(hr>R.hr[1]) f.push(`tachycardia for age (HR ${hr})`); else if(hr<R.hr[0]) f.push(`bradycardia for age (HR ${hr})`); }
  if(rr!=null){ if(rr>R.rr[1]) f.push(`tachypnea for age (RR ${rr})`); else if(rr<R.rr[0]) f.push(`bradypnea for age (RR ${rr})`); }
  if(sbp!=null && sbp<R.sbpMin) f.push(`hypotension for age (BP ${dbp!=null?sbp+'/'+dbp:sbp})`);
  return {flags:[...f,...keep], any:base.any, ranges:R};
}

/* ---------- scores ---------- */
function scState(s,id){ if(!s.sc[id]) s.sc[id]={use:false,v:{}}; return s.sc[id]; }
function scVal(s,id,it){
  const st=s.sc[id]||{v:{}};
  if(st.v[it.id]!==undefined) return {v:st.v[it.id],auto:false};
  if(it.auto){ const a=it.auto(s); if(a!==null&&a!==undefined) return {v: it.opts? a : !!a, auto:true}; }
  return {v: it.opts?null:false, auto:false, unknown:!!it.auto};
}
function scoreResult(s,id){
  const d=SCORES[id], st=s.sc[id]||{v:{}};
  if(d.type==='num'){ const n=num(st.v.n); if(n==null) return null;
    const ip=d.interp?d.interp(n):''; return {total:n, interp:ip, text: d.text?d.text(n):`${d.name} ${n}${ip?' ('+ip+')':''}.`}; }
  if(d.type==='rule'){
    const pos=d.items.filter(it=>scVal(s,id,it).v===true).map(it=>lc(it.k));
    return {pos, text: pos.length?`${d.pos} (${andL(pos)}).`:`${d.neg}.`, interp: pos.length?'positive':'negative'};
  }
  let total=0, done=true; const vals={};
  d.items.forEach(it=>{ const r=scVal(s,id,it);
    if(it.opts){ if(r.v==null){done=false;return;} total+=it.opts[r.v][1]; vals[it.id]=it.opts[r.v][1]; }
    else if(r.v) total+=it.pts; });
  if(!done) return {total:null, interp:'', text:''};
  total=Math.round(total*10)/10;
  const ip=d.interp?d.interp(total):'';
  return {total, interp:ip, text: d.text?d.text(total,vals):`${d.name} ${total}${ip?' ('+ip+')':''}.`};
}

/* ---------- labs and data ---------- */

/* ---------- admission handoff ---------- */

const SUTURE_DAYS = {'Face':'3 to 5 days','Scalp':'7 to 10 days','Trunk or extremity':'7 to 10 days','Hand or foot':'10 to 14 days','Over a joint':'10 to 14 days'};

      else if(p.clo==='Steri-Strips') out.push('Let the Steri-Strips fall off on their own, usually in 7 to 10 days.');
      else if(/gut|Rapide/.test(p.mat)&&p.clo==='Sutures') out.push('Your stitches will dissolve on their own and do not need to be removed.');
      else { out.push('Put a thin layer of antibiotic ointment on the wound once or twice a day.'); out.push(`Have your ${p.clo==='Staples'?'staples':'stitches'} removed in ${SUTURE_DAYS[p.siteType]||'7 to 10 days'} at your doctor’s office, an urgent care, or here.`); }

}
function buildDC(s){

  s.imaging.filter(i=>!i.nl).forEach(i=>abn.push(`The ${(IMG[i.type]||{pt:'imaging test'}).pt.replace(/^(a|an) /,'')} showed findings that we discussed with ${child?'you':'you'}.`));

  if(rx.length||rxq.length||s.otc.trim()){

    rx.forEach(r=>out.push(`- New prescription: ${r}`));

/* ---------- discharge acetaminophen / ibuprofen dosing ----------

function analgesicNote(s){

  [ap,ib].forEach(p=>{ if(p.warn) warn.push(`<div class="cautionbox">${esc(p.warn)}</div>`); });
  const preview=analgesicDC(S);
  return sec('Pain and fever medicine',`<p class="fine">${m.mode==='adult'?'Adult dosing.':`Weight-based pediatric dosing${m.wt?` for ${m.wt} kg`:''}.`} Doses print on the discharge instructions with safety warnings.</p>
    <div class="chips">${chip('Acetaminophen',S.analg.apap,'data-act="flag" data-path="analg.apap"')}${chip('Ibuprofen',S.analg.ibu,'data-act="flag" data-path="analg.ibu"',nf.length?'ab':'')}</div>
    ${warn.join('')}
    ${nf.length?`<div class="chips">${chip('Document NSAID avoidance in MDM',S.analg.nsaidNote,'data-act="flag" data-path="analg.nsaidNote"')}</div>`:''}
    ${preview.length?`<div class="preview">${preview.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}`);
}
function fieldHTML(p,i,f){
  const path=`procs.${i}.${f.id}`, v=p[f.id];
  if(f.t==='t') return `<label class="f">${esc(f.l)}${inp(path,f.ph||'')}</label>`;
  if(f.t==='n') return `<label class="f">${esc(f.l)}${inp(path,f.ph||'','number')}</label>`;
  if(f.t==='f') return `<div class="chips">${chip(f.l,!!v,`data-act="flag" data-path="${path}"`)}</div>`;
  if(f.t==='c') return `<div class="fld"><div class="fl">${esc(f.l)}</div><div class="chips">${f.o.map(o=>chip(o,v===o,`data-act="set" data-path="${path}" data-v="${esc(o)}" data-keep="1"`)).join('')}</div></div>`;
  if(f.t==='m') return `<div class="fld"><div class="fl">${esc(f.l)}</div><div class="chips">${f.o.map(o=>chip(o,(v||[]).includes(o),`data-act="tog" data-path="${path}" data-v="${esc(o)}"`)).join('')}</div></div>`;
  return '';
}
function procHTML(p,i){
  const d=PROCS[p.type];
  let fields=d.fields.filter(f=>{
    if(p.type==='lac'){ if(['mat','size','tech'].includes(f.id)&&p.clo!=='Sutures') return false; if(f.id==='cnt'&&!['Sutures','Staples'].includes(p.clo)) return false; }
    if(['ind','lac','fb'].includes(p.type)&&f.id==='anMl'&&(p.an==='None'||/block|LET|drops/.test(p.an||''))) return false;
    return true; });
  return `<div class="item"><div class="hd"><strong>${esc(d.name)}</strong><button type="button" class="x" data-act="delproc" data-v="${i}">Remove</button></div>
    ${fields.map(f=>fieldHTML(p,i,f)).join('')}
    ${p.type!=='sutrem'?`<div class="fld"><div class="fl">Consent</div><div class="chips">${['Verbal','Written'].map(o=>chip(o,p.consent===o,`data-act="set" data-path="procs.${i}.consent" data-v="${o}" data-keep="1"`)).join('')}${!['epistaxis'].includes(p.type)?chip('Time-out performed',p.timeout,`data-act="flag" data-path="procs.${i}.timeout"`):''}</div></div>`:''}
    <div class="chips">${chip('Tolerated well, no complications',p.tol,`data-act="flag" data-path="procs.${i}.tol"`)}</div></div>`;
}

];

function renderRail(){
  $('#rail').innerHTML = STEPS.map((st,i)=>`<button type="button" class="${i===cur?'cur':''} ${st.has(S)?'has':''}" data-step="${i}"><span class="n">${i+1<STEPS.length?i+1:'✓'}</span>${st.k}</button>`).join('');
  const b=$('#rail').children[cur]; if(b&&b.scrollIntoView) b.scrollIntoView({block:'nearest',inline:'center'});
}
function renderNotice(){
  let h='';
  if(confirming==='clear') h=`<div class="confirm"><p>Clear everything and start a new patient?</p><button type="button" class="btn danger" data-act="doclear">Clear</button><button type="button" class="btn" data-act="noclear">Cancel</button></div>`;
  else if(confirming==='example') h=`<div class="confirm"><p>Replace what you entered with the example case?</p><button type="button" class="btn danger" data-act="doexample">Load example</button><button type="button" class="btn" data-act="noclear">Cancel</button></div>`;
  else if(isSample && cur!==STEPS.length-1) h=`<div class="banner"><span><b>Example case loaded.</b> A 72-year-old on apixaban with a head injury and forehead laceration. Tap New patient to clear it.</span><button type="button" class="btn" data-act="seenote">See the note</button></div>`;
  $('#notice').innerHTML=h;
  const ex=$('#example'); if(ex) ex.classList.toggle('on',isSample);
}
function render(keepScroll){
  const y=window.scrollY;
  $('#view').innerHTML = STEPS[cur].r();
  renderRail(); renderNotice(); refreshLive();
  $('#back').disabled = cur===0;
  $('#next').textContent = cur===STEPS.length-1 ? 'Copy' : (cur===STEPS.length-2?'See note':'Next');
  $('#where').textContent = `${cur+1} of ${STEPS.length} · ${STEPS[cur].k}`;
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function refreshLive(){
  const v=$('[data-live="vitals"]');
  const rg=$('[data-live="ranges"]');
  if(rg){ const y=ageY(S); if(y==null) rg.textContent='Enter age on the Patient step to compare with normal ranges.'; else { const R=pedsRanges(y); rg.textContent=`Normal for age: HR ${R.hr[0]} to ${R.hr[1]}, RR ${R.rr[0]} to ${R.rr[1]}, SBP at least ${R.sbpMin}.`; } }
  if(v){ const f=vitalFlagsFor(S); v.innerHTML = !f.any?'Nothing entered yet.':(f.flags.length?`<div class="flagline">${f.flags.map(x=>`<span class="flag">${esc(cap(x))}</span>`).join('')}</div>`:'<span class="flag ok">No automatic flags</span>'); }
  document.querySelectorAll('[data-live^="sc_"]').forEach(el=>{ const id=el.dataset.live.slice(3), r=scoreResult(S,id);
    el.innerHTML = r&&r.text?`<b>${esc(r.text)}</b>`:`<span class="fine">${SCORES[id].type==='num'?'Enter a value':'Answer each item'}</span>`; });
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1600); }
function copyOut(){
  const ta=$('#out'); if(!ta) return;
  const val=ta.value;
  const fallback=()=>{ ta.focus(); ta.select(); ta.setSelectionRange(0,val.length); try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Text selected. Tap Copy.'); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(()=>toast('Copied'),fallback); else fallback();
}
function go(i){ cur=Math.max(0,Math.min(STEPS.length-1,i)); render(); }
function touched(){ if(isSample){ isSample=false; renderNotice(); } }

document.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]'); if(st){ go(+st.dataset.step); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v, path=b.dataset.path;
  switch(a){
    case 'tri':{ const g=S[b.dataset.g]; const st=g[v]; if(!st) g[v]='+'; else if(st==='+') g[v]='-'; else delete g[v]; break; }
    case 'rfneg': cdef(S).rf.forEach(k=>{ if(!S.hx[key(k)]) S.hx[key(k)]='-'; }); break;
    case 'set':{ let val=v; if(b.dataset.bool) val = v==='1'; const curV=getPath(S,path); setPath(S,path, (!b.dataset.bool && !b.dataset.keep && curV===val)?'':val); break; }
    case 'tog':{ let arr=getPath(S,path); if(!Array.isArray(arr)){ arr=[]; setPath(S,path,arr); } const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); break; }
    case 'flag': setPath(S,path,!getPath(S,path)); break;
    case 'cc':{ const i=S.ccs.indexOf(v); if(i>=0) S.ccs.splice(i,1); else S.ccs.push(v); break; }
    case 'lab':{ const it=LABMAP[v]; const i=S.labs.indexOf(v);
      if(i>=0) S.labs.splice(i,1);
      else { const normal=!it.ab; S.labs=S.labs.filter(id=>{const o=LABMAP[id]; if(o.t!==it.t) return true; return normal?false:!!o.ab;}); S.labs.push(v); }
      break; }
    case 'sc':{ const st=scState(S,b.dataset.id), d=SCORES[b.dataset.id], it=d.items.find(x=>x.id===b.dataset.item);
      const curV=scVal(S,b.dataset.id,it).v;
      if(v==='b') st.v[it.id]=!curV; else st.v[it.id]= curV===+v ? null : +v;
      st.use=true; break; }
    case 'scuse':{ const st=scState(S,b.dataset.id); st.use=!st.use; break; }
    case 'ddx':{ const st=S.ddx[v]; if(!st) S.ddx[v]='c'; else if(st==='c') S.ddx[v]='w'; else delete S.ddx[v]; break; }
    case 'addimg': S.imaging.push({type:v,nl:true,text:'',indep:!['POCUS','FAST'].includes(v),region:''}); break;
    case 'delimg': S.imaging.splice(+v,1); break;
    case 'addproc': S.procs.push(procDefaults(v)); break;
    case 'delproc': S.procs.splice(+v,1); break;
    case 'addtimed': S.timed.push({t:'',txt:''}); break;
    case 'deltimed': S.timed.splice(+v,1); break;
    case 'addmed': S.medChanges.push({act:'Hold',med:'',detail:'',why:''}); break;
    case 'delmed': S.medChanges.splice(+v,1); break;
    case 'addcall': S.calls.push({who:'',service:'',rec:''}); break;
    case 'delcall': S.calls.splice(+v,1); break;
    case 'prob': S.problemIdx=+v; S.problem=PROBLEM[+v][0]; break;
    case 'tab': outTab=v; render(true); return;
    case 'copy': copyOut(); return;
    case 'seenote': go(STEPS.length-1); return;
    case 'doclear': S=blank(); isSample=false; confirming=false; outTab='mdm'; ccSearch=''; go(0); toast('Cleared'); return;
    case 'noclear': confirming=false; renderNotice(); return;
    case 'doexample': loadExample(); return;
  }
  touched();
  render(true);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.search){ ccSearch=el.value; const pk=$('[data-live="picker"]'); if(pk) pk.innerHTML=pickerHTML(); return; }
  const path=el.dataset&&el.dataset.path; if(!path) return;
  setPath(S,path,el.value);
  if(path.startsWith('sc.')){ const id=path.split('.')[1]; scState(S,id).use=true; }
  touched(); refreshLive();
  const b=$('#rail').children[cur]; if(b) b.classList.toggle('has',!!STEPS[cur].has(S));
});
document.addEventListener('change',e=>{
  // age changes can switch pediatric sections and score eligibility on or off
  const p=e.target.dataset&&e.target.dataset.path;
  if(p==='age' && cur===0) setTimeout(()=>{ if(cur===0) render(true); },350);
});
$('#back').addEventListener('click',()=>go(cur-1));
$('#next').addEventListener('click',()=>{ if(cur===STEPS.length-1) copyOut(); else go(cur+1); });
$('#newpt').addEventListener('click',()=>{ confirming='clear'; renderNotice(); window.scrollTo(0,0); });
function loadExample(){ S=sample(); isSample=true; confirming=false; outTab='mdm'; ccSearch=''; go(0); toast('Example case loaded'); }
$('#example').addEventListener('click',()=>{
  const hasData = !isSample && STEPS.some(st=>st.has(S));
  if(hasData){ confirming='example'; renderNotice(); window.scrollTo(0,0); } else loadExample();
});
/* Keep the patient in progress for this session: survives a trip to the Panacea home page
   and back, cleared when the app or tab is closed. The example case is never saved. */
const SAVE_KEY='dispo-current';
function saveState(){ try{ if(isSample) sessionStorage.removeItem(SAVE_KEY); else sessionStorage.setItem(SAVE_KEY, JSON.stringify({S,cur,outTab})); }catch(e){} }
['input','change','click'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(saveState,0)));
window.addEventListener('pagehide',saveState);
try{ const saved=JSON.parse(sessionStorage.getItem(SAVE_KEY)||'null');
  if(saved&&saved.S){ S=Object.assign(blank(),saved.S); cur=Math.max(0,Math.min(STEPS.length-1,saved.cur|0)); outTab=saved.outTab||'mdm'; } }catch(e){}
render();
}
</script>

</body></html>
