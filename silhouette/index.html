<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Silhouette">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<title>Silhouette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: film check, then A to E one step at a time on the left; the live report pinned on the right; one column on phones.
   Fixed light theme to match the rest of PANACEA. Hover diagrams are drawn as schematic radiographs (dark film, white bone). */
html,body{margin:0}
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-soft:#E1E9FB; --accent-ink:#FFFFFF;
  --neg:#1D6E49; --neg-soft:#E1F2E9; --pos:#A3122B; --pos-soft:#FBE6E9;
  --warn:#8A4300; --warn-soft:#FCEFDF; --alert:#A3122B;
  --film:#06080A;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.01em;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1840AE;color:var(--accent-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.86rem}
.btn:focus-visible,.chip:focus-visible,.info:focus-visible,.stepbtn:focus-visible,input:focus-visible,.homebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.stepbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0;position:relative}
.stepbtn .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:1.05rem;color:var(--muted)}
.stepbtn .n.sm{font-size:.62rem;letter-spacing:.04em;text-transform:uppercase}
.stepbtn .t{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stepbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0}
.stepbtn.done .dot{opacity:1}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.stepbtn[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){.steps{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.stepbtn{flex-direction:column;gap:3px;padding:6px 2px}.stepbtn .t{font-size:.7rem;max-width:100%}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.ph .cue{margin:2px 0 0;color:var(--muted);font-size:.93rem;max-width:64ch}
.ph .act{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pfoot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}

.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.flab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.flab .sub{font-weight:400;color:var(--muted);font-size:.85rem}
.info{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:.78rem;font-style:italic;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.info:hover{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;cursor:pointer;min-height:38px;line-height:1.2;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.num{display:flex;flex-direction:column;gap:4px;min-width:0}
.num label{font-size:.82rem;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.num .box{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.num .box:focus-within{border-color:var(--accent)}
.num input{border:0;outline:0;background:transparent;width:84px;padding:9px 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.num input[type=text]{width:220px;max-width:100%}
.num .u{padding:0 10px 0 0;color:var(--muted);font-size:.85rem}
.hint{margin:0;font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.calcout{margin:0;font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:8px 11px}
.calcout b{font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line)}

/* finding rows: each pertinent finding asks Absent / Present */
.finds{display:flex;flex-direction:column}
.find{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:10px}
.find:first-child{border-top:0;padding-top:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.98rem;min-width:0}
.yn{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:3px}
.yn .chip{border-color:transparent;background:transparent;min-height:34px;padding:5px 14px;font-size:.88rem}
.yn .chip.no[aria-pressed="true"]{background:var(--neg-soft);color:var(--neg);border-color:#B9DCC8}
.yn .chip.yes[aria-pressed="true"]{background:var(--pos-soft);color:var(--pos);border-color:#EDB9C1}
.fkids{display:flex;flex-direction:column;gap:12px;background:var(--sunk);border-radius:12px;padding:12px}
.fkids .chip{background:var(--surface)}
.fkids .chip[aria-pressed="true"]{background:var(--accent)}

.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 92px);overflow:auto}
@media (max-width:900px){.out{position:static;max-height:none}}
.out h3{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.imp{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.imp li::marker{color:var(--accent);font-weight:700}
.imp li.crit{color:var(--alert);font-weight:700}
.empty{margin:0;color:var(--muted);font-size:.92rem}
.dict{white-space:pre-wrap;font-size:.86rem;line-height:1.5;background:var(--bg);border-radius:10px;padding:12px;margin:0;font-family:var(--f-body);overflow-wrap:anywhere}
.outbtns{display:flex;gap:8px;flex-wrap:wrap}
.outbtns .btn{flex:1}
.toast{font-size:.82rem;color:var(--accent);min-height:1.2em;margin:0}

.pop{position:fixed;z-index:50;width:340px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,35,58,.18);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:min(74vh,600px);overflow:auto}
.pop.pinned{width:420px}
.pop .pt{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pop p{margin:0;font-size:.88rem}
.pop .pg{color:var(--muted);font-size:.78rem;font-weight:400}
.pop .close{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.pop .exitem{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.pop .exitem b{font-size:.88rem}
.pop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.film{display:block;width:100%;height:auto;border-radius:8px;background:var(--film)}
.pop .note{font-size:.74rem;color:var(--muted)}
.pop table{border-collapse:collapse;font-size:.84rem;width:100%}
.pop td,.pop th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pop th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){
  .pop,.pop.pinned{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;max-height:72vh;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>Silhouette</h1></div>
      <p>Chest X-ray read, film check then A to E, written up as a report and impression.</p>
    </div>
    <button class="btn" id="reset" type="button">New film</button>
  </header>

  <nav class="steps" id="steps" aria-label="Steps"></nav>

  <div class="grid">
    <main id="panes"></main>
    <aside class="out" aria-live="polite">
      <h3>Impression</h3>
      <div id="impWrap"></div>
      <h3>Full report</h3>
      <pre class="dict" id="dict"></pre>
      <div class="outbtns">
        <button class="btn primary" id="copyImp" type="button">Copy impression</button>
        <button class="btn" id="copyAll" type="button">Copy full report</button>
      </div>
      <p class="toast" id="toast"></p>
    </aside>
  </div>
</div>

<div class="pop" id="pop" hidden role="dialog" aria-live="polite"></div>

<script>
/* ===================== Schematic radiograph engine ===================== */
// Viewer's left is the patient's right. Overlays are drawn on the patient's LEFT and mirrored for the right.
const K={bg:'#06080A',body:'#454A50',lung:'#12161B',lung2:'#1D232A',mark:'#5E656D',soft:'#A3A8AD',bone:'#DADDE0',air:'#05070A',dev:'#F3F3F1',ann:'#FFC24B'};
let UID=0;
const BODY='M22 220 C16 150 16 82 32 42 C44 22 74 12 100 12 L140 12 C166 12 196 22 208 42 C224 82 224 150 218 220 Z';
const lungR=(y,flat)=>flat?`M108 34 C82 30 52 50 44 96 C38 132 40 ${y+14} 44 ${y+22} C62 ${y+21} 88 ${y+20} 108 ${y+19} Z`:`M108 34 C82 30 52 50 44 96 C38 132 40 ${y+14} 44 ${y+22} C58 ${y} 84 ${y-6} 108 ${y+2} Z`;
const lungL=(y,flat)=>flat?`M132 34 C158 30 188 50 196 96 C202 132 200 ${y+14} 196 ${y+22} C178 ${y+21} 152 ${y+20} 132 ${y+19} Z`:`M132 34 C158 30 188 50 196 96 C202 132 200 ${y+14} 196 ${y+22} C182 ${y} 156 ${y-6} 132 ${y+4} Z`;
const HEART={n:'M108 102 C96 110 92 140 98 166 L168 172 C178 160 176 128 158 110 C148 102 138 102 132 98 Z',
  big:'M108 102 C86 112 80 148 86 172 L190 178 C202 158 198 120 168 106 C152 100 140 100 132 98 Z',
  water:'M110 100 C80 108 76 150 84 174 L192 178 C206 150 196 104 132 98 Z',
  narrow:'M110 104 C102 114 100 146 106 178 L156 180 C164 160 160 128 148 112 C142 106 136 104 132 100 Z'};
const MED={n:'M108 28 L132 28 L132 64 L134 100 L108 104 C104 92 104 60 108 28 Z',wide:'M98 28 L142 28 C156 42 158 80 148 94 L134 100 L108 104 C90 92 88 50 98 28 Z'};
const mir=(s,side)=>side==='R'?`<g transform="matrix(-1 0 0 1 240 0)">${s}</g>`:s;
const sides=side=>side==='B'?['L','R']:[side||'L'];
const arrow=(x1,y1,x2,y2,lab,anchor)=>{const a=Math.atan2(y2-y1,x2-x1),h=6;const p1=[x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45)],p2=[x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45)];
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${K.ann}" stroke-width="1.5"/><path d="M${x2} ${y2}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${K.ann}"/>${lab?label(x1,y1-(y1>y2?-10:3),lab,anchor):''}`};
const label=(x,y,t,anchor)=>{const a=`x="${x}" y="${y}" font-size="9" font-weight="700" text-anchor="${anchor||'middle'}" font-family="Atkinson Hyperlegible,sans-serif"`;return `<text ${a} fill="none" stroke="${K.bg}" stroke-width="3" stroke-linejoin="round">${t}</text><text ${a} fill="${K.ann}">${t}</text>`};

function markings(o){
  const ends=[[60,48,1.3],[50,86,1.3],[48,126,1.4],[56,158,1.5],[80,56,1.1],[72,150,1.4],[86,40,1],[64,108,1.2],[84,168,1.3]];
  let s='';const hR=[100,110],hL=[140,110];
  ends.forEach(([x,y,w])=>{const up=y<100,wR=(o.ceph&&up?w*1.9:w)*(o.pen==='over'?.6:1);
    const mx=(hR[0]+x)/2+(up?-4:4),my=(hR[1]+y)/2;
    s+=`<path d="M${hR[0]} ${hR[1]} Q${mx} ${my} ${x} ${y}" stroke="${K.mark}" stroke-width="${wR}" fill="none" stroke-linecap="round" opacity="${o.pen==='over'?.45:.9}"/>`;
    s+=`<path d="M${hL[0]} ${hL[1]} Q${240-mx} ${my} ${240-x} ${y}" stroke="${K.mark}" stroke-width="${wR}" fill="none" stroke-linecap="round" opacity="${o.pen==='over'?.45:.9}"/>`;
  });
  return s;
}
function chest(o={}){
  o=Object.assign({yR:162,yL:168,shift:0,trach:0,mk:true,heart:'n',med:'n'},o);
  const id=++UID, cR='cr'+id, cL='cl'+id, gl='gl'+id, gc='gc'+id;
  const pen=o.pen||'ok';
  const lf=pen==='under'?'#30363C':pen==='over'?'#020304':`url(#${gl})`;
  let s=`<svg class="film" viewBox="0 0 240 220" role="img" aria-label="Schematic chest radiograph"><defs>
    <radialGradient id="${gl}" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="${K.lung2}"/><stop offset="1" stop-color="${K.lung}"/></radialGradient>
    <radialGradient id="${gc}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9BEC3" stop-opacity=".95"/><stop offset=".65" stop-color="#9DA2A7" stop-opacity=".75"/><stop offset="1" stop-color="#9DA2A7" stop-opacity="0"/></radialGradient>
    <clipPath id="${cR}"><path d="${lungR(o.yR,o.flat)}"/></clipPath><clipPath id="${cL}"><path d="${lungL(o.yL,o.flat)}"/></clipPath></defs>
    <rect width="240" height="220" fill="${K.bg}"/><path d="${BODY}" fill="${pen==='under'?'#5E6369':pen==='over'?'#2E3237':K.body}"/>`;
  // stomach bubble
  if(!o.noBubble)s+=`<ellipse cx="170" cy="${o.yL+28}" rx="${o.bigStomach?22:11}" ry="${o.bigStomach?14:7}" fill="${K.air}" opacity=".8"/>`;
  s+=`<path d="${lungR(o.yR,o.flat)}" fill="${lf}"/><path d="${lungL(o.yL,o.flat)}" fill="${lf}"/>`;
  if(o.mk)s+=`<g clip-path="url(#${cR})">${markings(o)}</g><g clip-path="url(#${cL})">${markings(o)}</g>`;
  // ribs
  let ribs='';for(let i=0;i<11;i++){const y=26+i*15;ribs+=`<path d="M116 ${y} C96 ${y-6} 62 ${y-2} 40 ${y+22}" /><path d="M124 ${y} C144 ${y-6} 178 ${y-2} 200 ${y+22}"/>`}
  s+=`<g stroke="${K.bone}" stroke-width="2.4" fill="none" opacity="${pen==='over'?.12:.2}">${ribs}</g>`;
  // whole-lung pre-mediastinum overlays (effusion, collapse fill under heart)
  s+=(o.under||'').replace(/CLIPR/g,cR).replace(/CLIPL/g,cL).replace(/GRADC/g,gc);
  // mediastinum, heart, trachea
  const sp=o.shift;
  s+=`<g transform="translate(${sp} 0)"><path d="${MED[o.med]}" fill="${K.soft}"/><circle cx="142" cy="74" r="${o.knob?14:9}" fill="${K.soft}"/>${o.knobCalc?`<path d="M134 66 A11 11 0 0 1 152 68" stroke="${K.bone}" stroke-width="2" fill="none"/>`:''}<path d="${HEART[o.heart]}" fill="${K.soft}"/>`;
  if(o.hidePen)s+='';
  s+=`<rect x="113" y="12" width="14" height="208" fill="${K.bone}" opacity="${pen==='under'?0:pen==='over'?.32:.2}"/>`;
  let tc=120+o.trach;
  s+=`<path d="M120 10 Q${tc} 50 120 86" stroke="${K.air}" stroke-width="8" fill="none" opacity=".88"/><path d="M120 86 L107 106 M120 86 L135 106" stroke="${K.air}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/></g>`;
  // clavicles
  s+=`<path d="M48 44 Q82 30 ${o.rot?104:110} 42" stroke="${K.bone}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M192 44 Q158 30 ${o.rot?134:130} 42" stroke="${K.bone}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  s+=(o.over||'').replace(/CLIPR/g,cR).replace(/CLIPL/g,cL).replace(/GRADC/g,gc);
  return s+'</svg>';
}
// ---- overlay builders (patient-left geometry; mirrored for right) ----
const OV={
  eff(size,yL){const top={small:yL+12,mod:122,large:84,hemi:10}[size]||122;return `<g clip-path="url(#CLIPL)"><path d="M210 ${top} Q${size==='hemi'?150:180} ${size==='small'?top+6:top+(yL-top)*.55} 128 ${yL+10} L128 230 L210 230 Z" fill="#8F959A"/></g>`},
  ptx(size){const d=size==='tension'?'M150 64 C162 70 168 92 166 116 C164 136 158 146 150 152':size==='large'?'M136 52 C150 54 162 72 164 110 C165 140 160 158 154 172':'M146 40 C172 44 186 70 188 110 C190 140 186 160 182 174';
    return `<g clip-path="url(#CLIPL)"><path d="${d} L230 180 L230 0 L${size==='large'?136:size==='tension'?150:146} 0 Z" fill="${K.air}"/></g><path d="${d}" stroke="#E8EAEC" stroke-width="1" fill="none"/>`},
  lobe:{RUL:[78,70,30,32],RML:[90,140,24,19],RLL:[64,160,24,16],LUL:[162,70,30,32],Lingula:[152,142,24,19],LLL:[178,168,22,16]},
  cons(l,air){const [x,y,rx,ry]=OV.lobe[l];const clip=l[0]==='R'?'CLIPR':'CLIPL';
    let s=`<g clip-path="url(#${clip})"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#GRADC)"/>`;
    if(air)s+=`<path d="M${x+(l[0]==='R'?14:-14)} ${y+8} Q${x} ${y} ${x+(l[0]==='R'?-14:14)} ${y-12} M${x} ${y+1} L${x+(l[0]==='R'?-6:6)} ${y+12} M${x+(l[0]==='R'?-6:6)} ${y-5} L${x+(l[0]==='R'?-16:16)} ${y-2}" stroke="${K.air}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    return s+'</g>'},

// finding rows become Absent/Present chip fields
Object.entries(F).forEach(([k,f])=>{if(f.type==='find'){f.opts=[['no',f.noLabel||'Absent'],['yes',f.yesLabel||'Present',f.tip,f.ex]];f.normal='no';f.kids.forEach(c=>{if(!F[c].when)F[c].when=()=>S[k]==='yes'})}});
const LAYOUT={
 film:['indication','proj','pen','ribs','rot','angle','cmp','priorDate'],
 A:['trach','ett','ettCm','ettCuff','tt'],
 B:['ptx','eff','cons','atel','edema','ild','nod','emph'],
 C:['heart','heartQ','med','medComp','aorta','hila','pmed'],
 D:['dia','cpa','free','abd'],
 E:['dev','bones','soft']
};

/* ===================== State ===================== */
let S={};let cur=0;
const num=k=>{const v=parseFloat(S[k]);return isFinite(v)?v:null};
const has=(k,v)=>(S[k]||[]).includes(v);

/* ===================== Build UI ===================== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasInfo=f=>f.tip||(f.opts&&f.opts.some(o=>o[2]||o[3]));
const infoBtn=k=>`<button class="info" type="button" data-info="${k}" aria-label="Help for ${esc(F[k].label)}">i</button>`;
function chipsHTML(k){const f=F[k];return `<div class="chips">${f.opts.map(o=>`<button type="button" class="chip" data-k="${k}" data-v="${o[0]}" aria-pressed="false"${(o[2]||o[3])?` data-tip="${k}:${o[0]}"`:''}>${esc(o[1])}</button>`).join('')}</div>`}
function numHTML(k){const f=F[k];return `<div class="num" data-f="${k}"><label for="f-${k}">${esc(f.label)} ${f.tip?infoBtn(k):''}</label><div class="box"><input id="f-${k}" data-k="${k}" ${f.text?`type="text" placeholder="${esc(f.ph||'')}"`:'type="number" inputmode="decimal" min="0" step="any"'} autocomplete="off">${f.unit?`<span class="u">${f.unit}</span>`:''}</div></div>`}
function fieldHTML(k){
  const f=F[k];
  if(f.type==='num')return numHTML(k);
  if(f.type==='find')return `<div class="find" data-f="${k}"><div class="frow"><div class="fname">${esc(f.label)} ${infoBtn(k)}</div><div class="yn">
    <button type="button" class="chip no" data-k="${k}" data-v="no" aria-pressed="false">${esc(f.opts[0][1])}</button><button type="button" class="chip yes" data-k="${k}" data-v="yes" aria-pressed="false"${f.ex?` data-tip="${k}:yes"`:''}>${esc(f.opts[1][1])}</button></div></div>
    <div class="fkids" data-kids="${k}" hidden>${f.kids.map(fieldHTML).join('')}</div></div>`;
  return `<div class="field" data-f="${k}"><div class="flab"><span>${esc(f.label)}</span>${hasInfo(f)?infoBtn(k):''}</div>${chipsHTML(k)}<p class="hint" id="hint-${k}" hidden></p></div>`;
}
const PANES={
 film:()=>`${numHTML('indication')}${fieldHTML('proj')}<div class="sep"></div>${fieldHTML('pen')}<div class="field"><div class="row">${numHTML('ribs')}</div><p class="calcout" id="ribsOut" hidden></p></div>${fieldHTML('rot')}${fieldHTML('angle')}<div class="sep"></div>${fieldHTML('cmp')}<div class="row">${numHTML('priorDate')}</div>`,
 A:()=>`${fieldHTML('trach')}<div class="sep"></div>${fieldHTML('ett')}<div class="row">${numHTML('ettCm')}</div><p class="hint" id="hint-ettCm" hidden></p>${fieldHTML('ettCuff')}<div class="sep"></div>${fieldHTML('tt')}`,
 B:()=>`<div class="finds">${LAYOUT.B.map(fieldHTML).join('')}</div><p class="hint" id="hint-B" hidden></p>`,
 C:()=>`${fieldHTML('heart')}<div class="field"><div class="row">${numHTML('heartW')}${numHTML('chestW')}</div><p class="calcout" id="ctrOut" hidden></p></div>${fieldHTML('heartQ')}<div class="sep"></div>${fieldHTML('med')}${fieldHTML('medComp')}<div class="sep"></div><div class="finds">${['aorta','hila','pmed'].map(fieldHTML).join('')}</div>`,
 D:()=>`<div class="finds">${LAYOUT.D.map(fieldHTML).join('')}</div>`,

function build(){
  document.getElementById('steps').innerHTML=STEPS.map((s,i)=>`<button type="button" class="stepbtn" data-step="${i}"><span class="n${s.n.length>1?' sm':''}">${s.n}</span><span class="t">${s.t}</span><span class="dot"></span></button>`).join('');
  document.getElementById('panes').innerHTML=STEPS.map((s,i)=>`<section class="pane" data-pane="${i}" ${i?'hidden':''} aria-labelledby="h-${s.id}">
    <div class="ph"><span class="eb">${s.n.length>1?'Before you start':'Step '+s.n}</span><h2 id="h-${s.id}">${s.n.length>1?s.t:s.n+' · '+s.t}</h2><p class="cue">${s.cue}</p>
    ${s.id!=='film'?`<div class="act"><button type="button" class="btn small" data-normal="${s.id}">Mark the rest normal</button></div>`:`<div class="act"><button type="button" class="btn small" data-normal="film">Good film</button></div>`}</div>
    ${PANES[s.id]()}
    <div class="pfoot"><button type="button" class="btn" data-go="${i-1}" ${i?'':'disabled style="visibility:hidden"'}>Back</button>${i<STEPS.length-1?`<button type="button" class="btn primary" data-go="${i+1}">Next: ${STEPS[i+1].n.length>1?'':STEPS[i+1].n+' · '}${STEPS[i+1].t}</button>`:''}</div>
  </section>`).join('');
}

/* ===================== Report logic ===================== */
const joinW=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const joinOr=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' or '+a[a.length-1];
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const sideAdj=s=>({R:'right',L:'left',B:'bilateral'}[s]||'');
const isYes=k=>S[k]==='yes', isNo=k=>S[k]==='no';
function ctr(){const h=num('heartW'),c=num('chestW');return h&&c?h/c:null}
function ettAuto(){const cm=num('ettCm');if(S.ett&&S.ett!=='none')return S.ett;if(cm===null)return null;return cm<2?'low':cm>7?'high':'ok'}

function compute(){
  const A=[],B=[],C=[],D=[],E=[],imp=[],crit=new Set(),limits=[];
  const P=(arr,txt,impTxt,critical)=>{arr.push(txt);if(impTxt!==false){const t=impTxt||txt;imp.push(t);if(critical)crit.add(t)}};
  const supine=S.proj==='ap_sup', ap=['ap_up','ap_semi','ap_sup'].includes(S.proj);
  // technique
  const projT={pa_lat:'PA and lateral views of the chest',pa:'Single PA view of the chest',ap_up:'Single AP upright portable view of the chest',ap_semi:'Single AP semi-upright portable view of the chest',ap_sup:'Single AP supine view of the chest'}[S.proj];
  const ribs=num('ribs');
  if(S.pen==='under')limits.push('underpenetration');if(S.pen==='over')limits.push('overpenetration');
  if(ribs!==null&&ribs<8)limits.push(`low lung volumes (${ribs} posterior ribs)`);
  if(S.rot==='rot')limits.push('patient rotation');if(S.angle==='lord')limits.push('apical lordotic positioning');
  const tech=[];if(projT)tech.push(projT+'.');

function silTable(){return `<table><tr><th>Border lost</th><th>Lobe</th></tr><tr><td>Ascending aorta</td><td>Right upper lobe</td></tr><tr><td>Right heart border</td><td>Right middle lobe</td></tr><tr><td>Right hemidiaphragm</td><td>Right lower lobe</td></tr><tr><td>Descending aorta</td><td>Left upper or lower lobe</td></tr><tr><td>Left heart border</td><td>Lingula</td></tr><tr><td>Left hemidiaphragm</td><td>Left lower lobe</td></tr></table>`}
function optTip(k,v){const f=F[k];const o=f.opts.find(x=>x[0]===v);const title=f.type==='find'?f.label:o[1];
  return `<div class="pt"><span>${esc(title)}</span>${f.ref?`<span class="pg">${esc(f.ref)}</span>`:''}</div>${film(o[3])}${o[2]?`<p>${esc(o[2])}</p>`:''}${o[3]?NOTE:''}`}
function fieldTip(k){
  const f=F[k];let h=`<div class="pt"><span>${esc(f.label)}</span><button class="close" type="button" aria-label="Close">×</button></div>`;
  if(f.ref)h+=`<span class="pg">${esc(f.ref)}</span>`;
  if(f.ex)h+=film(f.ex);
  if(f.tip)h+=`<p>${esc(f.tip)}</p>`;
  if(k==='consSil'||k==='cons')h+=silTable();
  const kidOpts=(f.type==='find'?f.kids.map(c=>F[c]).filter(c=>c.opts):[f]).flatMap(c=>(c.type==='find'?[]:(c.opts||[])).filter(o=>o[3]&&o[3]!==f.ex).map(o=>({o,c})));
  const seen=new Set();const items=kidOpts.filter(({o})=>!seen.has(o[3])&&seen.add(o[3]));
  if(f.type!=='find'&&f.opts)f.opts.filter(o=>o[2]&&!o[3]).forEach(o=>{h+=`<div class="exitem"><b>${esc(o[1])}</b><p>${esc(o[2])}</p></div>`});
  if(items.length){h+=`<div class="grid2">${items.map(({o})=>`<div class="exitem"><b>${esc(o[1])}</b>${film(o[3])}${o[2]?`<p>${esc(o[2])}</p>`:''}</div>`).join('')}</div>`}
  if(f.ex||items.length)h+=NOTE;
  return h;
}
function place(el){if(innerWidth<=640){pop.style.left='';pop.style.top='';pop.style.maxHeight='';return}
  const r=el.getBoundingClientRect(),pw=pop.offsetWidth,need=pop.scrollHeight;
  const below=innerHeight-r.bottom-20,above=r.top-20,useBelow=below>=Math.min(need,320)||below>=above;
  const room=Math.max(140,useBelow?below:above);pop.style.maxHeight=room+'px';const ph=Math.min(need,room);
  const x=Math.min(Math.max(12,r.left),innerWidth-pw-12),y=useBelow?r.bottom+8:r.top-8-ph;
  pop.style.left=x+'px';pop.style.top=Math.max(8,y)+'px'}
function openPop(html,el,pin){pinned=!!pin;pop.innerHTML=html;pop.classList.toggle('pinned',pinned);pop.hidden=false;place(el)}
function closePop(){pop.hidden=true;pinned=false;pop.dataset.for=''}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||pinned)return;const c=e.target.closest('[data-tip]');if(!c)return;clearTimeout(hoverT);hoverT=setTimeout(()=>{const [k,v]=c.dataset.tip.split(':');openPop(optTip(k,v),c,false)},220)});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse'||pinned)return;const c=e.target.closest('[data-tip]');if(!c)return;if(e.relatedTarget&&c.contains(e.relatedTarget))return;clearTimeout(hoverT);closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

/* ===================== Events ===================== */
function goto(i){cur=Math.max(0,Math.min(STEPS.length-1,i));document.querySelectorAll('.pane').forEach(p=>p.hidden=+p.dataset.pane!==cur);closePop();update();
  const top=document.getElementById('steps').getBoundingClientRect().top+scrollY-8;if(scrollY>top)scrollTo({top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function markNormal(step){
  if(step==='film'){if(!S.pen)S.pen='ok';if(!S.rot)S.rot='none';if(!S.angle)S.angle='ok';update();return}
  const keys=LAYOUT[step];keys.forEach(k=>{const f=F[k];if(f.when&&!f.when())return;if(S[k]===undefined&&f.normal)S[k]=f.normal});
  if(step==='A'){if(!S.ett)S.ett='none';if(!S.tt)S.tt='none'}
  update();
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.close')){closePop();return}
  const info=t.closest('[data-info]');
  if(info){e.preventDefault();if(pinned&&pop.dataset.for===info.dataset.info){closePop();return}openPop(fieldTip(info.dataset.info),info,true);pop.dataset.for=info.dataset.info;return}
  if(pinned&&!t.closest('#pop'))closePop();
  const sb=t.closest('[data-step]');if(sb){goto(+sb.dataset.step);return}
  const go=t.closest('[data-go]');if(go){goto(+go.dataset.go);return}
  const nm=t.closest('[data-normal]');if(nm){markNormal(nm.dataset.normal);toast(nm.dataset.normal==='film'?'Film marked adequate.':'Unanswered items marked normal.');return}
  const ch=t.closest('.chip[data-k]');
  if(ch){const k=ch.dataset.k,v=ch.dataset.v,f=F[k];
    if(f.type==='multi'){const a=new Set(S[k]||[]);a.has(v)?a.delete(v):a.add(v);S[k]=[...a]}
    else S[k]=S[k]===v?undefined:v;
    update();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){S[t.dataset.k]=t.value;update()}});
addEventListener('resize',()=>{if(!pop.hidden&&innerWidth<=640){pop.style.left='';pop.style.top=''}});
document.getElementById('reset').addEventListener('click',()=>{S={};document.querySelectorAll('input').forEach(i=>i.value='');goto(0);toast('Cleared for a new film.')});
function toast(m){const t=document.getElementById('toast');t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',2200)}
async function copy(txt,label){if(!txt){toast('Nothing to copy yet.');return}
  try{await navigator.clipboard.writeText(txt);toast(label+' copied.')}
  catch(_){const d=document.getElementById('dict');const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Copy blocked here. The full report is selected; press Ctrl/⌘ C.')}}
document.getElementById('copyImp').addEventListener('click',()=>copy(window.__out&&window.__out.imp,'Impression'));
document.getElementById('copyAll').addEventListener('click',()=>copy(window.__out&&window.__out.all,'Full report'));


/* ---------- hover help: with a mouse, popovers close once the pointer leaves both the trigger and the popover ---------- */
let lastPT='mouse',anchor=null,closeT=null,infoT=null;
document.addEventListener('pointerdown',e=>{lastPT=e.pointerType||'mouse'},true);
{const _op=openPop;openPop=function(h,el,pin){anchor=el;clearTimeout(closeT);closeT=null;pop.style.pointerEvents=pin?'':'none';_op(h,el,pin)}}
const overPop=t=>!!(t&&t.closest&&(t.closest('#pop')||(anchor&&anchor.contains(t))));
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||pop.hidden||pinned)return;
  if(overPop(e.target)){clearTimeout(closeT);closeT=null}
  else if(!closeT)closeT=setTimeout(()=>{closeT=null;if(!pinned)closePop()},160);
},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{if(!pinned)closePop()});
addEventListener('blur',()=>{if(!pinned)closePop()});
addEventListener('scroll',()=>{if(!pinned&&!pop.hidden&&!pop.matches(':hover'))closePop()},{passive:true});
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||pinned)return;const b=e.target.closest('[data-info]');if(!b)return;clearTimeout(infoT);infoT=setTimeout(()=>{if(b.matches(':hover')&&!pinned){openPop(fieldTip(b.dataset.info),b,false);pop.dataset.for=b.dataset.info}},200)});

build();update();
</script>
</body>
