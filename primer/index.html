<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Primer">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Primer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Primer: a daily ICU curriculum, one lesson a day. Palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;--paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover,.homebtn:active{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hdlink{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;padding:8px 2px}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.syncdot.ok{background:var(--ok)}.syncdot.syncing{background:var(--accent)}.syncdot.error{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;font-weight:700;padding:6px 2px;cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress */
.prog{display:flex;align-items:center;gap:14px}
.ring{flex:none;width:58px;height:58px}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s}
.ring text{font:700 13px "Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
.prog .txt{flex:1;min-width:0}
.prog .big{font-weight:700;font-size:1.05rem}
.prog .sm{color:var(--muted);font-size:.88rem}
.status{display:flex;gap:12px;align-items:flex-start}
.status .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.status .ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.status h2{margin:2px 0 2px;font-size:1.1rem}
.status p{margin:0;color:var(--muted);font-size:.92rem}
.next{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.next .eb{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.next .nt{font-weight:700;margin-top:2px}

/* lesson */
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:18px 0 4px}
h2.lt{font-size:1.6rem;line-height:1.2;margin:0 0 12px;letter-spacing:-.015em;text-wrap:balance}
.reads{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.reads li{display:flex;gap:10px;align-items:baseline;font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.reads .bk{flex:none;font-weight:700;color:var(--accent);min-width:7.6em}
.reads .ch{color:var(--ink)}
.bl{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:1.02rem;line-height:1.55}
.bl b{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
section.sec h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
section.sec h3 svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
section.sec ul{margin:0;padding-left:18px}
section.sec li{margin:6px 0;line-height:1.45}
.ev li{list-style:none;margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.ev ul{padding-left:0}
.ev li:last-child{border-bottom:0;padding-bottom:2px}
.ev li:first-child{padding-top:2px}
.ev .tn{display:block;font-weight:700;font-size:.92rem}
.ev .tf{display:block;color:var(--ink);font-size:.95rem}
.qz .qq{font-weight:700;margin:0 0 8px}
.qz .qa{display:none;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:8px}
.qz.open .qa{display:block}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:80px;resize:vertical;line-height:1.45;display:block}
.complete{margin:18px 0 8px}
.donemsg{text-align:center;color:var(--ok);font-weight:700;margin:8px 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.pager button{flex:1;text-align:left;font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);min-height:56px;min-width:0}
.pager button:last-child{text-align:right}
.pager button[disabled]{visibility:hidden}
.pager small{display:block;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pager span{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* curriculum list */
.search{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);color:var(--ink);margin:4px 0 12px}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.unit>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:56px}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary .un{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
details.unit>summary .nm{flex:1;font-weight:700;min-width:0}
details.unit>summary .ct{font-size:.85rem;color:var(--muted);font-weight:700}
details.unit>summary .ct.all{color:var(--ok)}
details.unit>summary .chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none}
details.unit[open]>summary .chev{transform:rotate(90deg)}
details.unit[open]>summary{border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;min-height:52px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--paper)}
.lrow .dn{flex:none;width:44px;font-size:.78rem;font-weight:700;color:var(--muted)}
.lrow .lt2{flex:1;min-width:0;font-size:.97rem}
.lrow .lt2 small{display:block;color:var(--muted);font-size:.78rem}
.lrow .bx{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center}
.lrow.d .bx{background:var(--ok);border-color:var(--ok)}
.lrow .bx svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.lrow.d .bx svg{opacity:1}
.lrow.today{background:var(--accent-soft)}
.lrow.today .dn{color:var(--accent)}
.foot{color:var(--muted);font-size:.8rem;margin-top:24px;line-height:1.5}
.foot ul{padding-left:18px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.rdh{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.reads li{align-items:center}
.reads button.rck{all:unset;flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;box-sizing:border-box}
.reads button.rck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reads button.rck svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.reads li.rd button.rck{background:var(--ok);border-color:var(--ok)}
.reads li.rd button.rck svg{opacity:1}
.reads li.rd .ch,.reads li.rd .bk{opacity:.55}
.reads .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.reads .tx .bk{min-width:0;font-size:.78rem;letter-spacing:.02em}
.reads li.rd .ch{text-decoration:line-through}
.reads button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;width:100%;cursor:pointer}
.reads li.lk{border-color:var(--accent)}
.reads li.lk:hover{background:var(--accent-soft)}
.reads .op{flex:none;margin-left:auto;font-size:.78rem;font-weight:700;color:var(--accent);white-space:nowrap}
.reads li.nl .op{color:var(--muted)}
.bkrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bkrow:last-child{border-bottom:0}
.bkrow .tx{flex:1;min-width:0}
.bkrow .nm{font-weight:700}
.bkrow .st{font-size:.85rem;color:var(--muted)}
.bkrow .st.ok{color:var(--ok)}.bkrow .st.bad{color:var(--warn)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.reader{display:flex;flex-direction:column;gap:10px;align-items:center}
.pg{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;position:relative;display:block}
.pg canvas{width:100%;height:100%;display:block;border-radius:6px}
.pg .pn{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.pgchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:700;padding:6px 12px;border-radius:999px;z-index:15}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  1:"Vascular Catheters",2:"Central Venous Access",3:"The Indwelling Vascular Catheter",4:"Occupational Exposures",5:"Alimentary Prophylaxis",6:"Venous Thromboembolism",

 {n:1,t:"Foundations & monitoring"},
 {n:2,t:"Shock, fluids & vasoactive drugs"},

 {n:13,t:"Special populations"},

const L=[];

L.push(
{id:"assess",u:1,t:"Assessing the critically ill patient",r:["O9","O16","V0"],
 bl:"Every ICU day starts with the same structured sweep: is the patient getting worse, what is each organ doing, and which of today’s problems will kill them first? Resuscitate first and diagnose in parallel. Organ dysfunction is a moving target, so trend it.",
 ord:["Basic labs every morning while unstable: CBC, BMP, Mg, phos, and lactate if perfusion is in question","Blood gas (arterial if on vent or shocked) with each meaningful change","Daily review of every line, tube and drain: is it still needed?","Medication reconciliation: home meds held or resumed on purpose, renal and hepatic dose adjustments"],

 pr:["Capillary refill time is a fast, repeatable perfusion check that ANDROMEDA-SHOCK used successfully as a resuscitation target.","‘Stable’ means a vital sign trend, not a single number. Look at the last 12 hours, not the last reading.","Ask the bedside nurse what worries them. It is frequently the best early-warning signal you have."],
 q:["What does a SOFA increase of 2 or more mean in a patient with suspected infection?","It meets the Sepsis-3 definition of sepsis (life-threatening organ dysfunction from a dysregulated host response), with roughly 10% in-hospital mortality in the derivation cohorts."]},

{id:"do2",u:1,t:"Oxygen delivery, consumption & lactate",r:["M10","V5","O57"],
 bl:"Shock is a mismatch between oxygen delivery (DO₂) and demand. DO₂ = cardiac output × arterial O₂ content, and content is mostly hemoglobin × saturation; dissolved O₂ is trivial. You raise DO₂ by fixing cardiac output first, then hemoglobin, then saturation.",
 ord:["Lactate at presentation and repeated within 2–4 hours if elevated","Central venous gas (ScvO₂) when a CVC is in the SVC","Hemoglobin; don’t transfuse just to ‘improve DO₂’ unless there is active ischemia or bleeding","Arterial–central venous CO₂ gap (Pcv-aCO₂) if ScvO₂ looks normal but perfusion doesn’t"],
 act:["Calculate CaO₂: (1.34 × Hb × SaO₂) + (0.003 × PaO₂)","Low ScvO₂ (< 70%) points to inadequate delivery: think low output, anemia, hypoxemia, or high demand (fever, shivering, work of breathing)","Normal or high ScvO₂ with high lactate suggests impaired extraction (sepsis, cyanide, mitochondrial toxicity) or shunting","Reduce demand: treat fever, control agitation, take over the work of breathing"],
 ev:[["Jansen lactate-guided therapy (AJRCCM 2010)","Targeting a 20% lactate fall every 2 hours reduced hospital mortality after adjustment."],["ANDROMEDA-SHOCK (JAMA 2019)","Capillary-refill-targeted resuscitation was non-inferior to lactate-targeted, with less organ dysfunction and a trend to lower mortality."],["ProCESS/ARISE/ProMISe (2014–15)","Protocolized ScvO₂ targeting (EGDT) did not beat usual care. ScvO₂ is a diagnostic clue, not a target."]],
 pr:["Lactate rises from beta-2 stimulation (epinephrine, albuterol), liver failure, metformin, and seizures. Not every lactate is hypoperfusion.","A CO₂ gap > 6 mmHg suggests inadequate cardiac output even when ScvO₂ is normal.","Hemoglobin from 7 to 10 raises CaO₂ by ~40%; raising SaO₂ from 90% to 100% adds ~11%."],
 q:["A septic patient has lactate 6 and ScvO₂ 82%. What does that pattern suggest?","Impaired tissue oxygen extraction or microcirculatory shunting, typical of distributive shock. More delivery may not help; focus on source control, MAP, and perfusion markers like capillary refill."]},

{id:"access",u:1,t:"Vascular access & catheter care",r:["M1","M2","M3"],
 bl:"Flow through a catheter scales with radius to the fourth power and inversely with length, so short, wide catheters resuscitate fastest; a triple-lumen CVC is slower than two large peripheral IVs. Use ultrasound for every central and difficult line, and remove lines the day they stop being needed.",
 ord:["CXR after IJ or subclavian line (or ultrasound confirmation with saline flush and lung sliding)","Blood cultures from line and periphery if line infection is suspected","Line days on the daily checklist","Chlorhexidine bathing per unit protocol"],
 act:["Ultrasound-guided, full barrier precautions, 2% chlorhexidine-alcohol skin prep","Confirm venous placement before dilating: manometry, ultrasound of the wire, or a venous blood gas","Prefer internal jugular or subclavian over femoral when practical; subclavian has the lowest infection rate","For pressors: a well-placed, ultrasound-guided peripheral IV is acceptable short-term (see Unit 2)"],
 ev:[["3SITES (NEJM 2015)","Subclavian had fewer bloodstream infections and DVTs than IJ or femoral, but more pneumothoraces."],["Pronovost Keystone (NEJM 2006)","A five-item insertion checklist cut CLABSI rates by about two-thirds across Michigan ICUs."],["Ultrasound guidance (Cochrane)","Real-time ultrasound reduces failed attempts and arterial puncture for IJ cannulation."]],
 pr:["Infuse rapidly through a large-bore peripheral IV or a dedicated introducer (cordis), not a distal lumen of a triple-lumen.","A guidewire left in the patient is a never event; say ‘wire out’ out loud.","Catheter-related thrombosis is common with PICCs; avoid them in patients who may need dialysis access."],
 q:["Why does a 16 g peripheral IV run faster than the 16 g distal lumen of a triple-lumen CVC?","Flow is inversely proportional to length (Poiseuille), and the CVC lumen is about 20 cm long versus about 3 cm for the IV."]},

{id:"hemo",u:1,t:"Arterial lines, preload & fluid responsiveness",r:["M7","M9","O24"],
 bl:"About half of hemodynamically unstable ICU patients are not fluid responsive. Static numbers like CVP poorly predict response; dynamic tests ask the heart a question with a small, reversible preload challenge and watch stroke volume.",
 ord:["Arterial line for vasopressor titration, frequent gases, or unreliable cuff pressures","Cardiac output monitor (pulse contour, echo VTI) if response to fluids is uncertain","Daily fluid balance and weight"],
 act:["Passive leg raise: lift legs 45° from semi-recumbent; a ≥ 10% rise in stroke volume or cardiac output (not BP) predicts responsiveness","Mini-fluid challenge: 100–250 mL over 1–2 min with VTI or SV measurement","Pulse pressure variation > 12% predicts response only if passive on the vent, sinus rhythm, Vt ≥ 8 mL/kg and closed chest","Check the arterial waveform: overdamped (blunted) or underdamped (spiky systolic overshoot); trust MAP over systolic"],
 ev:[["Marik CVP meta-analysis (Chest 2008)","CVP had essentially no ability to predict fluid responsiveness."],["Monnet PLR meta-analysis (ICM 2016)","Passive leg raise with cardiac output measurement had pooled sensitivity and specificity near 85–90%."],["FRESH (Chest 2020)","Stroke-volume-guided fluid management in septic shock reduced fluid balance and need for RRT or ventilation."]],
 pr:["MAP is the most accurate arterial-line number because it is least affected by damping.","A falling pulse pressure in a bleeding patient is an early sign of shrinking stroke volume.","‘Fluid responsive’ doesn’t mean ‘needs fluid’: healthy people are fluid responsive too. Treat a perfusion problem, not the test."],
 q:["Why use stroke volume rather than blood pressure to read a passive leg raise?","Blood pressure depends on vascular tone and may not change even when stroke volume rises; PLR read by BP alone misses many responders."]},

{id:"pocus",u:1,t:"Bedside echo & lung ultrasound",r:["O25","O40"],
 bl:"Focused ultrasound answers yes/no questions that change management in minutes: is there a big effusion with tamponade, is the LV squeezing, is the RV dilated, is the IVC full, are the lungs wet, is there a pneumothorax? It complements, not replaces, the formal study.",
 ord:["Formal echo for valvular disease, quantitative function, or when bedside images are inadequate","CXR or CT when lung ultrasound is inconclusive"],
 act:["RUSH approach in shock: pump (LV, RV, effusion), tank (IVC, lungs, abdomen), pipes (aorta, DVT)","RV:LV ratio > 1 in the apical four-chamber with septal flattening suggests acute RV strain (PE, ARDS, over-ventilation)","LVOT VTI < 18 cm suggests a low stroke volume; trend it after interventions","Lung: B-lines bilaterally suggest interstitial edema; absent sliding without lung point or pulse suggests pneumothorax"],
 ev:[["BLUE protocol (Lichtenstein, Chest 2008)","Lung ultrasound patterns diagnosed the cause of acute respiratory failure with ~90% accuracy."],["SHOC-ED (Atkinson, Ann EM 2018)","Routine early POCUS in undifferentiated hypotension did not change survival; its value is in answering a specific question."],["IVC (various)","IVC size and collapsibility are unreliable in ventilated patients and with high intra-abdominal pressure; use extremes, not the middle."]],
 pr:["A plethoric, non-collapsing IVC with a big pericardial effusion and RA/RV diastolic collapse is tamponade until proven otherwise.","McConnell’s sign (RV free wall akinesis with apical sparing) is specific but not sensitive for PE.","Record clips. Comparing today’s images to yesterday’s is often more informative than either alone."],
 q:["What does an RV:LV end-diastolic ratio above 1 with a D-shaped septum suggest?","Pressure overload of the RV, e.g., massive PE or severe pulmonary hypertension; check for DVT and consider CT or empiric therapy if unstable."]},

{id:"pac",u:1,t:"Pulmonary artery catheter & cardiac output",r:["M8","O24","O28"],
 bl:"The PA catheter measures right- and left-sided filling pressures, cardiac output and mixed venous saturation. It doesn’t improve outcomes when used routinely, but it remains useful for cardiogenic shock phenotyping, mechanical support management, and mixed or refractory shock.",
 ord:["Thermodilution cardiac output and SvO₂ after each major change","Wedge pressure at end-expiration","Calculate cardiac power output, PAPi and SVR"],
 act:["Cardiac index < 2.2 L/min/m² with wedge > 15 mmHg = cardiogenic shock profile","Cardiac power output = MAP × CO / 451; < 0.6 W predicts poor outcome","PAPi = (PA systolic − PA diastolic) / RA pressure; < 0.9 suggests RV failure in inferior MI","SvO₂ normal ≈ 65–75%; low values mean delivery isn’t keeping up with demand"],
 ev:[["PAC-Man (Lancet 2005) and ESCAPE (JAMA 2005)","Routine PA catheters didn’t change mortality in general ICU patients or decompensated heart failure."],["Cardiogenic Shock Working Group registry (Garan, JACC HF 2020)","Complete invasive hemodynamic profiling was associated with lower mortality in cardiogenic shock; observational data."],["Forrester classes","Warm/cold and wet/dry phenotypes still frame therapy: cold–wet needs inotropy or support, warm–wet needs decongestion."]],
 pr:["Measure wedge at end-expiration; with forced expiration, high PEEP or auto-PEEP, wedge overstates true LV filling.","Thermodilution is unreliable with severe tricuspid regurgitation; use Fick in that case.","Large v-waves in the wedge tracing suggest acute mitral regurgitation."],
 q:["A patient has CI 1.8, wedge 24, SVR 1800. Which shock profile and first-line support?","Cardiogenic (cold and wet). Treat with an inotrope such as dobutamine or milrinone, a vasopressor if MAP is low, diuresis, and early evaluation for mechanical support."]}
);

L.push(
{id:"shock",u:2,t:"Shock: types and the first hour",r:["O23","M14"],
 bl:"Shock is circulatory failure that causes inadequate cellular oxygen use. Sort it fast into distributive, hypovolemic, cardiogenic and obstructive (often mixed), because the treatments diverge: fluid fills the tank, pressors squeeze the pipes, inotropes help the pump, and obstruction needs to be relieved.",
 ord:["Lactate, CBC, BMP, LFTs, troponin, coags, type and screen, blood cultures ×2","ECG and CXR","Bedside echo before (or during) the second liter","Arterial line once on a vasopressor"],
 act:["Start a vasopressor early rather than chasing MAP with endless fluid; peripheral norepinephrine is fine","Initial MAP target 65 mmHg in most patients","Look for obstructive causes you can fix now: tension pneumothorax, tamponade, massive PE","Re-assess perfusion every 15–30 min in the first hour: mentation, capillary refill, urine output, lactate"],
 ev:[["De Backer (NEJM 2010, SOAP II)","In about 1,600 patients with shock, about 62% were septic, 16% cardiogenic, 16% hypovolemic, and 2% obstructive."],["CENSER (AJRCCM 2019)","Norepinephrine started early (median 93 min) improved shock control by 6 hours versus placebo."],["65 trial (JAMA 2020)","In patients 65 or older, permissive MAP 60–65 caused no harm with less vasopressor exposure."]],
 pr:["Warm extremities don’t exclude shock: early distributive shock is warm, late shock of any kind is cold.","A normal blood pressure with high lactate and mottling is still shock (cryptic shock).","Bradycardia with shock: think beta-blocker, calcium channel blocker, hyperkalemia, spinal cord injury, inferior MI."],
 q:["What are the four obstructive causes of shock to rule out on the first echo?","Tamponade, tension pneumothorax, massive pulmonary embolism, and (rarely) severe dynamic LVOT obstruction or an intracardiac mass; auto-PEEP in a ventilated patient behaves similarly."]},

{id:"fluids",u:2,t:"Crystalloids, colloids & balanced solutions",r:["M12","O58"],
 bl:"Balanced crystalloids (lactated Ringer’s, Plasma-Lyte) are the default resuscitation fluid; large volumes of 0.9% saline cause hyperchloremic acidosis and probably modest kidney harm. Albumin is reasonable as an add-on in large-volume resuscitation; starches are out.",
 ord:["Balanced crystalloid in 250–500 mL boluses with reassessment after each","Chloride and bicarbonate trend if saline has been used","Albumin 5% or 20–25% selectively (large-volume sepsis, cirrhosis with SBP or large paracentesis)"],
 act:["Default to LR or Plasma-Lyte unless hypochloremic alkalosis or TBI favors saline","Avoid hypotonic fluids (LR is mildly hypotonic) in severe TBI and cerebral edema","Count maintenance and drug-carrier fluids. They are often a liter or more a day","Never use hydroxyethyl starch"],
 ev:[["SMART (NEJM 2018)","Balanced crystalloids reduced the composite of death, new RRT, or persistent renal dysfunction (MAKE30) versus saline in ~15,800 ICU patients."],["BaSICS (2021) and PLUS (2022)","Neither trial found a significant mortality difference between balanced solution and saline; meta-analysis suggests a small probable benefit of balanced."],["SAFE (2004) and ALBIOS (2014)","Albumin was as safe as saline overall but not superior; SAFE-TBI showed harm in traumatic brain injury."],["6S and CHEST (2012)","Hydroxyethyl starch increased RRT (and mortality in 6S)."]],
 pr:["Hyperchloremic acidosis has a normal anion gap; don’t confuse it with ongoing hypoperfusion.","LR contains 4 mEq/L K and is safe in hyperkalemia; saline worsens acidosis-driven K shifts.","Calcium in LR can bind citrate in blood products. Avoid running LR through the same line as transfusions."],
 q:["In which patient group should albumin be avoided as a resuscitation fluid?","Severe traumatic brain injury, where SAFE-TBI found higher mortality with 4% albumin."]},

{id:"deresus",u:2,t:"Fluid stewardship & de-resuscitation",r:["O58","O15"],
 bl:"Fluid has four phases: rescue, optimization, stabilization, evacuation (ROSE). Positive fluid balance after the first day is linked to longer ventilation, AKI, and death. Give fluid only to responsive patients with a perfusion problem, and plan its removal once shock resolves.",
 ord:["Strict ins and outs, daily weights","Diuretic once off vasopressors and perfusing (e.g., furosemide with a target net-negative balance)","BMP twice daily during active diuresis; replete K and Mg"],
 act:["Ask before every bolus: is there a perfusion problem, and is the patient likely to respond?","Concentrate drips and medications to shrink carrier volume","Set a daily net fluid balance goal on rounds","Use RRT ultrafiltration if overload persists despite diuretics"],
 ev:[["CLASSIC (NEJM 2022)","Restrictive IV fluid after initial septic shock resuscitation did not change 90-day mortality versus standard care."],["CLOVERS (NEJM 2023)","Early vasopressor-heavy restrictive strategy versus liberal fluids in sepsis-induced hypotension: no difference in 90-day mortality."],["FACTT (NEJM 2006)","Conservative fluid management in ARDS increased ventilator-free days without more shock or dialysis."]],
 pr:["The trials say restrictive is safe, not that it is better. That justifies stopping fluids when they aren’t clearly helping.","Edema is not a sign of adequate intravascular volume; it’s a sign of fluid in the wrong place.","Venous congestion (VExUS) can mark fluid harm in the kidney before the lungs show it."],
 q:["After initial resuscitation, what did CLASSIC and CLOVERS show about restricting fluids?","Restrictive strategies were not inferior: no mortality difference, supporting avoidance of routine extra fluid once initial resuscitation is complete."]},

{id:"pressbasics",u:2,t:"Vasopressor basics & peripheral administration",r:["P1","P19","O26"],
 bl:"Vasopressors act on α₁ (vasoconstriction), β₁ (rate and contractility), β₂ (vasodilation, lactate), V₁ (vasoconstriction) and AT₁ receptors. Choose the drug by the receptor you need. Starting norepinephrine peripherally is safe and avoids delays waiting for a central line.",
 ord:["Peripheral pressor order set: ≥ 20 g IV in the upper arm or antecubital fossa or above, ultrasound-confirmed, hourly site checks","Arterial line once escalating or on more than one agent","Phentolamine on hand for extravasation"],
 act:["Peripheral norepinephrine is acceptable for up to ~24–72 h at modest doses (typical protocols cap around 0.1–0.2 mcg/kg/min)","Extravasation: stop the infusion, aspirate, leave the catheter, inject phentolamine 5–10 mg in 10 mL saline subcutaneously around the site","Titrate to MAP, not systolic BP","Weight-based (mcg/kg/min) and flat (mcg/min) dosing aren’t interchangeable. Know your unit’s convention"],
 ev:[["Tian (Emerg Med Australas 2020)","Meta-analysis of peripheral vasopressors: extravasation about 3%, rarely with tissue injury when promptly treated."],["Cardenas-Garcia (J Hosp Med 2015)","In 734 patients on peripheral pressors, extravasation occurred in 2% with no tissue injury using a protocol."],["Surviving Sepsis 2021","Suggests starting vasopressors peripherally rather than delaying until a central line is placed."]],
 pr:["β₂ effects of epinephrine raise lactate without worsening perfusion, so don’t chase that lactate with fluid.","A vasopressor can’t fix an empty tank or an obstructed heart; reassess the cause if requirements climb fast.","Tachyphylaxis (needing more and more) is a sign to add a second agent with a different receptor, not to keep escalating one."],
 q:["What is the antidote for norepinephrine extravasation and how is it given?","Phentolamine (α-blocker), typically 5–10 mg diluted in 10 mL saline injected subcutaneously around the affected area."]},

{id:"ne_epi",u:2,t:"Norepinephrine & epinephrine",r:["P2","P3","M53"],
 bl:"Norepinephrine is the first-line pressor for nearly all shock: strong α₁ with modest β₁, raising MAP with little tachycardia. Epinephrine adds strong β₁ and β₂ effects and is the second-line choice in septic shock and first-line in anaphylaxis and many post-cardiac-surgery units.",
 ord:["Norepinephrine 0.01–0.5 mcg/kg/min (roughly 2–40 mcg/min); above ~0.25 mcg/kg/min add vasopressin","Epinephrine 0.01–0.5 mcg/kg/min; push-dose 10–20 mcg for transient hypotension","Lactate, glucose and K trend on epinephrine"],
 act:["Start norepinephrine early, even before fluid resuscitation is ‘complete’","Add epinephrine when there is septic cardiomyopathy or refractory hypotension despite norepinephrine plus vasopressin","Anaphylaxis: IM epinephrine 0.5 mg first; infusion if refractory","Watch for arrhythmias, digital ischemia and mesenteric hypoperfusion at high doses"],
 ev:[["SOAP II (NEJM 2010)","Dopamine vs norepinephrine: no overall mortality difference but more arrhythmias with dopamine and higher mortality in cardiogenic shock."],["CAT (ICM 2008) and CATS (Lancet 2007)","Epinephrine was as effective as norepinephrine (± dobutamine) for MAP and mortality, with more transient lactic acidosis and hyperglycemia."],["OptimaCC (JACC 2018)","In cardiogenic shock from MI, epinephrine caused more refractory shock than norepinephrine (trial stopped early)."]],
 pr:["Norepinephrine-equivalent dose (NEE) helps compare across agents; > 0.5 mcg/kg/min NEE identifies very high mortality risk.","Epinephrine-driven lactate rises are expected and usually fall as it’s weaned.","In cardiogenic shock from MI, prefer norepinephrine over epinephrine as the base pressor."],
 q:["Why might lactate rise after starting epinephrine even though perfusion improves?","β₂ stimulation increases aerobic glycolysis in skeletal muscle (and inhibits pyruvate dehydrogenase flux), producing lactate independent of hypoperfusion."]},

{id:"vaso_phen",u:2,t:"Vasopressin, phenylephrine & terlipressin",r:["P4","P5","P6","P7"],
 bl:"Vasopressin acts on V₁ receptors independent of adrenergic pathways and of acidosis; septic shock causes relative vasopressin deficiency. It’s the standard second pressor, at a fixed dose. Phenylephrine is pure α₁; useful when tachyarrhythmia limits catecholamines or in dynamic LVOT obstruction, but can drop cardiac output.",
 ord:["Vasopressin 0.03 units/min fixed (some use up to 0.04); don’t titrate up as a primary pressor","Phenylephrine infusion (often 40–200 mcg/min, about 0.5–2.5 mcg/kg/min) or push 50–200 mcg","Terlipressin (hepatorenal syndrome) 1 mg IV q4–6h with careful O₂ and volume monitoring"],
 act:["Add vasopressin when norepinephrine reaches ~0.25 mcg/kg/min","When weaning, many units wean norepinephrine first and drop vasopressin last; withdraw vasopressin slowly if hypotension recurs","Use phenylephrine for vasoplegia with tachyarrhythmia (AF with RVR) or HOCM/LVOT obstruction","Hold terlipressin if SpO₂ < 90% or volume overloaded; respiratory failure risk"],
 ev:[["VASST (NEJM 2008)","Adding vasopressin to norepinephrine did not lower overall mortality; possible benefit in less severe shock."],["VANISH (JAMA 2016)","Early vasopressin vs norepinephrine did not improve kidney failure-free days; less RRT use in the vasopressin arm."],["CONFIRM (NEJM 2021)","Terlipressin improved hepatorenal syndrome reversal but caused more respiratory failure."],["SEPSIS-ACT (JAMA 2019)","Selepressin, a selective V₁a agonist, did not improve ventilator- and vasopressor-free days."]],
 pr:["Vasopressin works when acidosis blunts catecholamine responsiveness.","Starting vasopressin may let you spare catecholamine dose and reduce new atrial fibrillation.","Phenylephrine raises afterload; in a weak LV, BP rises while cardiac output falls."],
 q:["Why is phenylephrine useful in hypotension with HOCM?","As a pure α-agonist with no inotropy or tachycardia, it raises afterload and LV cavity size, reducing dynamic outflow obstruction."]},

{id:"rescue_press",u:2,t:"Rescue vasopressors: angiotensin II, dopamine, methylene blue & hydroxocobalamin",r:["P8","P9","P10","P16","P17","P18"],
 bl:"Refractory vasoplegia, high-dose pressors despite norepinephrine, vasopressin and steroids, has a few non-catecholamine options. Angiotensin II acts on AT₁. Methylene blue and hydroxocobalamin block nitric oxide pathways. Dopamine is rarely preferred now. Midodrine is an oral α₁-agonist used to wean IV pressors.",
 ord:["Angiotensin II 20 ng/kg/min, titrate up to 80 in the first 3 h, then ≤ 40","Methylene blue 1–2 mg/kg IV over 20–60 min (avoid with serotonergic drugs; G6PD deficiency)","Hydroxocobalamin 5 g IV over 15 min (expect red urine and interference with co-oximetry and dialysis alarms)","Midodrine 10–20 mg PO q8h to wean low-dose pressors"],
 act:["Before rescue drugs: confirm steroids given, correct acidosis and ionized calcium, reassess for missed source or obstruction","Angiotensin II requires VTE prophylaxis (thrombosis signal)","Methylene blue: watch for serotonin syndrome, false SpO₂ drop, and greenish urine","Dopamine only for bradycardia with hypotension when other options aren’t available"],
 ev:[["ATHOS-3 (NEJM 2017)","Angiotensin II raised MAP in catecholamine-resistant vasodilatory shock (70% vs 23% response); not powered for mortality."],["MIDAS (ICM 2020)","Midodrine did not speed IV vasopressor liberation in ICU patients."],["Methylene blue (Ibarra-Estrada, Crit Care 2023)","Early methylene blue in septic shock shortened vasopressor time in a small RCT."],["Hydroxocobalamin (observational)","Used for post-cardiopulmonary-bypass vasoplegia and cyanide; vasopressor-sparing evidence is limited."]],
 pr:["Patients on ACE inhibitors or with high renin may respond particularly well to angiotensin II.","Methylene blue interferes with pulse oximetry; check an ABG if SpO₂ drops suddenly.","Hydroxocobalamin can trigger dialysis machine ‘blood leak’ alarms for days."],
 q:["Name two drug interactions or contraindications for methylene blue.","Serotonergic drugs (SSRIs, SNRIs, linezolid) due to MAO inhibition and serotonin syndrome risk; G6PD deficiency due to hemolysis."]},

{id:"inotropes",u:2,t:"Inotropes: dobutamine, milrinone, levosimendan & isoproterenol",r:["P11","P12","P13","P14","P15","O26"],
 bl:"Inotropes increase contractility for low-output states: cardiogenic shock, septic cardiomyopathy with persistent hypoperfusion, RV failure. They raise myocardial oxygen demand and cause arrhythmias, so use the lowest dose that restores perfusion and pair with a vasopressor when MAP is low.",
 ord:["Dobutamine 2.5–10 (max 20) mcg/kg/min","Milrinone 0.125–0.5 (max 0.75) mcg/kg/min, no bolus; reduce dose in renal failure","Isoproterenol 1–10 mcg/min for bradycardia or torsades bridging","Echo, SvO₂ or ScvO₂, and lactate to judge response"],
 act:["Dobutamine: β₁ mostly; can drop BP through β₂ vasodilation; faster on/off","Milrinone: PDE-3 inhibitor; more pulmonary vasodilation (good for RV failure), longer half-life, accumulates in AKI; works on β-blocked patients","Treat new atrial arrhythmias; reduce dose if ectopy rises","Wean once perfusion markers and output improve, with a plan for afterload reduction or mechanical support"],
 ev:[["DOREMI (NEJM 2021)","Milrinone vs dobutamine in cardiogenic shock: no difference in the composite outcome or mortality."],["LeoPARDS (NEJM 2016)","Levosimendan in septic shock didn’t reduce organ dysfunction and caused more tachyarrhythmias."],["LEVO-CTS (NEJM 2017)","Levosimendan before cardiac surgery didn’t reduce the composite outcome."]],
 pr:["Patients on chronic β-blockers often respond better to milrinone than dobutamine.","A rising lactate on dobutamine may be inotrope-induced tachycardia or dynamic LVOT obstruction; re-image the heart.","Isoproterenol is a chemical pacemaker: a bridge until transvenous pacing, not a destination."],
 q:["Why prefer milrinone over dobutamine in a patient with RV failure on a beta-blocker?","Milrinone bypasses β-receptors (PDE-3 inhibition), and its pulmonary vasodilation lowers RV afterload."]},

{id:"hemorrhage",u:2,t:"Hemorrhagic shock & massive transfusion",r:["M11","O77","O112"],
 bl:"Bleeding patients need hemostasis, not crystalloid. Activate massive transfusion early, give products in a balanced ratio (or whole blood), give TXA within 3 hours of trauma, treat the lethal diamond (acidosis, hypothermia, coagulopathy, hypocalcemia) and get to definitive control.",
 ord:["Massive transfusion protocol: plasma:platelets:RBC about 1:1:1","Tranexamic acid 1 g IV over 10 min then 1 g over 8 h (within 3 h of injury)","Ionized calcium; give calcium chloride 1 g with every ~4 units of product, more if low","TEG/ROTEM-guided product use once available","Fibrinogen target > 1.5–2 g/L (cryoprecipitate or concentrate)"],
 act:["Permissive hypotension (SBP ~80–90) in penetrating trauma until hemorrhage control; not in TBI","Warm all products and the patient","Reverse anticoagulants (PCC for warfarin and factor Xa inhibitors; idarucizumab for dabigatran)","Limit crystalloid to the minimum"],
 ev:[["PROPPR (JAMA 2015)","1:1:1 vs 1:1:2 did not change 24-h or 30-day mortality, but achieved hemostasis more often with fewer exsanguination deaths."],["CRASH-2 (Lancet 2010)","TXA within 3 h reduced death from bleeding; given after 3 h, it increased bleeding deaths."],["PAMPer (NEJM 2018)","Prehospital plasma reduced 30-day mortality in hypotensive injured patients."],["Bickell (NEJM 1994)","Delayed fluid resuscitation in penetrating torso trauma improved survival."]],
 pr:["Shock index (HR/SBP) > 1 flags significant blood loss before hypotension develops.","Citrate in products chelates calcium; hypocalcemia worsens coagulopathy and contractility.","The hemoglobin is normal early in hemorrhage. It takes time and fluid to dilute."],
 q:["Why does the timing of tranexamic acid matter in trauma?","CRASH-2 showed benefit only within 3 hours of injury; later administration was associated with increased death from bleeding."]}
);

L.push(
{id:"sepsis",u:3,t:"Sepsis & septic shock: the first hours",r:["O15","M14","O16"],
 bl:"Sepsis is organ dysfunction caused by a dysregulated response to infection; septic shock adds vasopressor need for MAP ≥ 65 and lactate > 2 despite fluids. The core is fast: cultures, antibiotics, source control, a measured fluid bolus, early norepinephrine, and repeated reassessment.",
 ord:["Blood cultures ×2 before antibiotics (don’t delay antibiotics > 45 min for them)","Broad-spectrum antibiotics within 1 hour when shock or sepsis is probable","Lactate now and repeat if > 2","Source imaging (CT, ultrasound) and cultures from the likely site","Balanced crystalloid, about 30 mL/kg in the first 3 h if hypoperfused, reassessing as you go"],
 act:["Start norepinephrine early, peripherally if needed, for MAP 65","Identify and control the source within 6–12 h: drain, debride, remove infected devices","Give hydrocortisone if norepinephrine-equivalent ≥ 0.25 mcg/kg/min for ≥ 4 h","Reassess perfusion (capillary refill, lactate, urine output) rather than giving fluid by formula"],
 ev:[["Seymour (NEJM 2017)","Each hour of delay to completing the sepsis bundle and to antibiotics was associated with higher in-hospital mortality."],["ProCESS / ARISE / ProMISe (2014–15)","Protocolized early goal-directed therapy did not improve survival compared to usual care."],["Surviving Sepsis Campaign 2021","Antibiotics within 1 h for probable sepsis or shock; for possible sepsis without shock, rapid assessment and antibiotics within 3 h if concern persists."]],
 pr:["qSOFA is a prognostic tool, not a screening tool. Don’t use a negative qSOFA to rule out sepsis.","Hypothermia in sepsis signals higher mortality than fever.","Source control is the most powerful intervention after antibiotics; ask ‘is there pus somewhere?’ every day."],
 q:["What two criteria define septic shock under Sepsis-3?","Vasopressors needed to keep MAP ≥ 65 and lactate > 2 mmol/L despite adequate fluid resuscitation."]},

{id:"sepsis_adj",u:3,t:"Steroids & adjunct therapies in septic shock",r:["O15","O71","M50"],
 bl:"Hydrocortisone speeds shock reversal in septic shock and may modestly reduce mortality, especially with fludrocortisone. Most other adjuncts, such as vitamin C, thiamine, polymyxin hemoperfusion, and immunomodulators, have not held up in trials.",
 ord:["Hydrocortisone 50 mg IV q6h (or 200 mg/day infusion) for vasopressor-dependent septic shock","± Fludrocortisone 50 mcg enterally daily (APROCCHSS regimen)","Glucose monitoring while on steroids"],
 act:["Start steroids when norepinephrine needs are ≥ 0.25 mcg/kg/min for 4 h or more","Taper or stop when vasopressors are off (no clear benefit to tapering over stopping)","Don’t use random cortisol or ACTH stimulation to decide","Don’t give IV vitamin C for sepsis"],
 ev:[["ADRENAL (NEJM 2018)","Hydrocortisone 200 mg/day did not lower 90-day mortality but shortened shock and ventilation time."],["APROCCHSS (NEJM 2018)","Hydrocortisone plus fludrocortisone lowered 90-day mortality (43% vs 49%)."],["LOVIT (NEJM 2022)","IV vitamin C in sepsis increased the composite of death or persistent organ dysfunction."],["VICTAS (JAMA 2021)","Vitamin C + thiamine + hydrocortisone didn’t improve vasopressor- and ventilator-free days."]],
 pr:["Steroids cause hyperglycemia and may increase neuromuscular weakness; they don’t increase superinfection meaningfully in trials.","Etomidate for intubation does not change the decision about steroids.","If a patient is on chronic steroids, they need stress dosing regardless of the sepsis criteria."],
 q:["What was the key difference between ADRENAL and APROCCHSS?","APROCCHSS added fludrocortisone and enrolled sicker patients, and showed a mortality benefit; ADRENAL (hydrocortisone alone) showed faster shock resolution without a mortality difference."]},

{id:"abx",u:3,t:"Antimicrobial principles in the ICU",r:["O20","M52","O119"],
 bl:"Get the right drug, at the right dose, quickly, then narrow and stop. Critical illness changes pharmacokinetics: bigger volume of distribution, augmented renal clearance, or AKI. So give full loading doses and think about how each class kills (time-dependent vs concentration-dependent).",
 ord:["Empiric regimen based on source, local antibiogram and MRSA/Pseudomonas risk","Full loading doses regardless of kidney function","Vancomycin AUC-guided dosing (target AUC 400–600) or levels","Procalcitonin to support stopping antibiotics","Daily antibiotic ‘time-out’: indication, cultures, de-escalation, stop date"],
 act:["β-lactams are time-dependent: extended or continuous infusions raise time above MIC","Aminoglycosides are concentration-dependent: once-daily high dose","De-escalate at 48–72 h on culture data; stop if infection is unlikely","Use short-course durations that trials support"],
 ev:[["BLING III (JAMA 2024)","Continuous vs intermittent β-lactam infusion: 90-day mortality 24.9% vs 26.8% (not significant); meta-analysis including BLING III suggests a mortality benefit."],["SAPS (Lancet Infect Dis 2016)","Procalcitonin-guided stopping shortened antibiotic duration and lowered mortality."],["BALANCE (NEJM 2024)","7 days of antibiotics was non-inferior to 14 days for bloodstream infection in hospitalized patients."],["STOP-IT (NEJM 2015)","About 4 days of antibiotics after source control of intra-abdominal infection matched longer courses."]],
 pr:["Augmented renal clearance (CrCl > 130) is common in young trauma, burn and TBI patients and leads to underdosing.","Double anti-pseudomonal coverage is for initial empiric coverage in shock with risk factors; narrow it once susceptibilities return.","The most common mistake is not stopping antibiotics when the cultures and story don’t support infection."],
 q:["Why use extended or continuous infusions for piperacillin-tazobactam or meropenem?","β-lactams kill in a time-dependent way: efficacy depends on time free drug stays above the MIC, which longer infusions increase."]},

{id:"pna",u:3,t:"Severe pneumonia (CAP, HAP & VAP)",r:["O48","M29"],
 bl:"Severe community-acquired pneumonia needs a β-lactam plus a macrolide (or a respiratory fluoroquinolone), with MRSA or Pseudomonas coverage only for risk factors. Hydrocortisone helps severe CAP. VAP is overdiagnosed; base treatment on a reasonable clinical picture plus cultures, and keep courses to 7 days.",
 ord:["Ceftriaxone 1–2 g daily + azithromycin 500 mg daily for severe CAP","Add vancomycin or linezolid and anti-pseudomonal β-lactam if prior MRSA/Pseudomonas or recent IV antibiotics and hospitalization","MRSA nasal PCR (high negative predictive value) to stop vancomycin","Sputum culture or endotracheal aspirate, blood cultures, Legionella and pneumococcal urine antigens, respiratory viral panel","Hydrocortisone 200 mg/day for severe CAP (CAPE COD regimen) once influenza is excluded or treated"],
 act:["VAP prevention: head of bed 30–45°, daily SAT/SBT, subglottic suction ETTs, minimize sedation","Treat influenza with oseltamivir regardless of symptom duration in ICU patients","Reassess at 48–72 h: narrow, or stop if an alternative diagnosis emerges","Check for complications: empyema (ultrasound, tap any significant effusion), abscess"],
 ev:[["CAPE COD (NEJM 2023)","Hydrocortisone in severe CAP reduced 28-day mortality (6.2% vs 11.9%) and need for intubation."],["Chastre PneumA (JAMA 2003)","8 vs 15 days of therapy for VAP gave similar outcomes; more resistance with longer courses."],["MRSA nares PCR (Parente, CID 2018)","Negative predictive value about 96–99% for MRSA pneumonia."]],
 pr:["Macrolides add an immunomodulatory benefit in severe CAP even with resistant pneumococcus.","CAPE COD excluded influenza and septic shock; ADRENAL-style dosing applies if shock is present.","A new infiltrate in a ventilated patient is often atelectasis, edema or ARDS; get cultures before calling it VAP."],
 q:["What is the main value of an MRSA nasal swab PCR in pneumonia?","Its high negative predictive value lets you stop empiric MRSA coverage (vancomycin or linezolid) when it is negative."]},

{id:"hai",u:3,t:"Healthcare-associated infections: lines, catheters & C. difficile",r:["O18","M3","M41"],
 bl:"Most ICU infections come from our devices: central lines, urinary catheters, endotracheal tubes. Prevention bundles and removing devices early work better than any antibiotic. C. difficile is the main antibiotic complication to watch for.",
 ord:["Paired blood cultures (line and peripheral) for suspected CLABSI","Urine culture only with symptoms or sepsis without another source (no routine screening)","C. difficile testing only with ≥ 3 unformed stools in 24 h and no laxatives","Oral vancomycin 125 mg q6h or fidaxomicin 200 mg BID × 10 days for C. difficile"],
 act:["Remove the line for S. aureus, Pseudomonas, Candida, persistent bacteremia, or tunnel infection","S. aureus bacteremia: ID consult, echo (TEE often), repeat cultures until clear","Change the urinary catheter before collecting a culture if it’s been in > 2 weeks","Fulminant C. diff: oral vancomycin 500 mg q6h + IV metronidazole ± rectal vancomycin; early surgery consult"],
 ev:[["Climo (NEJM 2013)","Daily chlorhexidine bathing reduced MDRO acquisition and hospital-acquired bloodstream infections."],["IDSA/SHEA C. difficile guideline (2021)","Fidaxomicin preferred over vancomycin for initial episodes due to lower recurrence."],["Infectious diseases consult for S. aureus bacteremia (multiple cohorts)","Associated with lower mortality and better adherence to evidence-based care."]],
 pr:["Asymptomatic bacteriuria in a catheterized patient should not be treated.","Coagulase-negative staph in one of two bottles is usually a contaminant.","Stop PPIs when they aren’t needed; they raise C. difficile risk."],
 q:["Which organisms mandate removal of an infected central line?","S. aureus, Pseudomonas, Candida (and other fungi), mycobacteria, and any line with persistent bacteremia or tunnel/pocket infection."]},

{id:"fungal",u:3,t:"Fungal infections & the immunocompromised host",r:["O19","O85"],
 bl:"Candidemia is the main invasive fungal infection in general ICUs; treat every positive blood culture, pull lines, and look for metastatic foci. In immunocompromised patients (neutropenia, transplant, high-dose steroids, biologics), widen the differential to molds, Pneumocystis, viruses and atypical organisms early.",
 ord:["Echinocandin (micafungin 100 mg daily, caspofungin) for candidemia","Repeat blood cultures daily until negative","Ophthalmology exam (dilated) in candidemia","Echocardiogram if persistent candidemia","β-D-glucan or galactomannan (serum, BAL) when invasive fungal infection is suspected","Pneumocystis: LDH, β-D-glucan, induced sputum or BAL PCR"],
 act:["Treat candidemia for 14 days after the first negative culture and resolution of symptoms","Step down to fluconazole once stable and susceptible","Neutropenic fever: antipseudomonal β-lactam within 1 h; add antifungal if fever persists at 4–7 days","PJP with hypoxemia: high-dose TMP-SMX plus prednisone if PaO₂ < 70 (HIV-related)"],
 ev:[["EMPIRICUS (JAMA 2016)","Empiric micafungin in non-neutropenic ICU patients with Candida colonization and sepsis didn’t improve fungal-free survival."],["IDSA Candida guideline (2016)","Echinocandins preferred as initial therapy for candidemia in most adults."],["EFRAIM (Azoulay, ICM 2017)","In immunocompromised patients with acute respiratory failure, failing to identify the cause was independently linked to higher mortality."]],
 pr:["Candida in sputum is almost always colonization; it doesn’t cause pneumonia.","Candida in urine rarely needs treatment unless neutropenic, having urologic procedures, or with obstruction.","Ask about prophylaxis the patient is supposed to be on (PJP, antifungal, antiviral)."],
 q:["After candidemia is diagnosed, what three things must be done beyond starting an echinocandin?","Remove central lines if possible, repeat blood cultures until clear, and get a dilated eye exam (plus echo if persistent)."]},

{id:"source",u:3,t:"Source control: necrotizing soft-tissue & abdominal infections",r:["O22","M40","O76"],
 bl:"Some infections can only be cured by a knife or a drain. Necrotizing soft-tissue infection is a surgical emergency diagnosed clinically: pain out of proportion, rapid spread, crepitus, skin necrosis, systemic toxicity. Intra-abdominal sepsis needs drainage or resection; antibiotics alone fail.",
 ord:["NSTI: vancomycin + piperacillin-tazobactam (or a carbapenem) + clindamycin 900 mg q8h","Emergent surgical consult; don’t wait for imaging if suspicion is high","CT abdomen/pelvis with IV contrast for suspected intra-abdominal source","Intra-abdominal: piperacillin-tazobactam or a cephalosporin with metronidazole; add antifungals only for high-risk (e.g., recurrent upper GI perforation)"],
 act:["Clindamycin (or linezolid) suppresses toxin production in streptococcal and clostridial infection","Plan re-look surgery within 24 h for NSTI","Short courses (~4 days) after adequate source control","Measure bladder pressure if the abdomen is tense: intra-abdominal hypertension > 12 mmHg, compartment syndrome > 20 with new organ failure"],
 ev:[["Wong LRINEC (CCM 2004)","Lab-based score; later studies showed low sensitivity, so it can’t rule out NSTI."],["INSTINCT (ICM 2017)","IVIG in NSTI didn’t improve physical function at 6 months."],["STOP-IT (NEJM 2015)","Fixed ~4-day antibiotic course after source control was as good as longer courses."]],
 pr:["Hard, wooden induration beyond the visible erythema, and anesthesia over the skin, point to deep necrosis.","Gas on imaging is late and absent in many NSTIs.","‘Ileus’ with rising lactate after abdominal surgery: think anastomotic leak or ischemia."],
 q:["Why add clindamycin in suspected necrotizing fasciitis?","It inhibits bacterial protein synthesis and so suppresses toxin production (streptococcal and clostridial), independent of inoculum size."]},

{id:"fever",u:3,t:"Fever in the ICU",r:["M43","O104"],
 bl:"Not every ICU fever is infection: drugs, VTE, transfusion, pancreatitis, adrenal crisis, alcohol withdrawal, and post-op inflammation all cause it. Investigate thoughtfully rather than with reflex pan-culture, and don’t treat moderate fever by reflex either.",
 ord:["Blood cultures ×2 with new fever (≥ 38.3°C) and a clinical change","Targeted cultures based on the most likely source","Review drug list (β-lactams, anticonvulsants, heparin), lines, recent procedures and transfusions","Doppler ultrasound if VTE possible; CT for occult abscess or sinusitis in prolonged fever"],
 act:["Treat fever when it adds harm: cardiac ischemia, brain injury, very high temperatures (> 39.5–40°C)","Culture before giving antipyretics; fever within 48 h of surgery is usually inflammatory, not infectious","Hyperthermia > 41°C suggests a non-infectious cause: heat stroke, NMS, serotonin syndrome, malignant hyperthermia, thyroid storm","Remove unneeded lines and catheters"],
 ev:[["HEAT (NEJM 2015)","Acetaminophen for fever in suspected infection didn’t change ICU-free days or mortality."],["Schortgen (AJRCCM 2012)","External cooling in febrile septic shock reduced vasopressor needs and early mortality."],["SCCM/IDSA fever guideline (2023)","Recommends targeted rather than routine pan-culture workup for new ICU fever."]],
 pr:["Drug fever is a diagnosis of exclusion but common; eosinophilia and relative bradycardia support it.","Temperatures from bladder or esophageal probes are more reliable than peripheral sites.","Antipyretics on a schedule can hide the first sign of a new infection."],
 q:["Name four non-infectious causes of temperature above 41°C.","Heat stroke, neuroleptic malignant syndrome, serotonin syndrome, malignant hyperthermia (also thyroid storm and sympathomimetic toxicity)."]}
);

L.push(
{id:"arf",u:4,t:"Hypoxemia & hypercapnia: the mechanisms",r:["M20","V4","O36"],
 bl:"Respiratory failure is either an oxygenation problem (hypoxemic, type 1), a ventilation problem (hypercapnic, type 2), or both. Hypoxemia comes from five mechanisms; the A–a gradient and the response to oxygen tell you which. Hypercapnia means alveolar ventilation can’t keep up with CO₂ production, from low drive, weak pump, high load, or dead space.",
 ord:["ABG with documented FiO₂","CXR; CT chest if the cause is unclear","Bedside lung and cardiac ultrasound","Consider NIF and vital capacity if neuromuscular weakness is suspected"],
 act:["A–a gradient = [FiO₂ × (Patm − 47)] − PaCO₂/0.8 − PaO₂; normal ≈ (age/4) + 4","Normal A–a: hypoventilation or low inspired O₂; high A–a: V/Q mismatch, shunt, or diffusion","Shunt barely responds to more FiO₂; it needs alveolar recruitment (PEEP) or fixing the shunt","Hypercapnia: look for sedative drugs, neuromuscular weakness, obstruction (asthma, COPD), obesity, and high dead space (PE, ARDS)"],
 ev:[["Berlin definition (JAMA 2012) and 2023 global definition","ARDS severity is graded by P/F ratio; the 2023 update allows SpO₂/FiO₂ and HFNC ≥ 30 L/min."],["Nuckton (NEJM 2002)","Elevated dead-space fraction early in ARDS independently predicted death."],["Roussos / Tobin respiratory pump framework","Hypercapnic failure is a load–capacity imbalance; fatigue follows when load exceeds capacity for long enough."]],
 pr:["PaO₂/FiO₂ is affected by PEEP; compare P/F on similar settings.","Acute respiratory acidosis: pH falls ~0.08 per 10 mmHg PaCO₂ rise; chronic: ~0.03.","A normal PaCO₂ in a tachypneic asthmatic is a warning sign, not reassurance."],
 q:["A patient has PaO₂ 55 on 100% FiO₂. What mechanism dominates and what helps?","Shunt (blood passing unventilated alveoli). FiO₂ helps little; recruitment with PEEP, proning, or treating the cause (e.g., draining fluid, clearing secretions) is needed."]},

{id:"o2",u:4,t:"Oximetry, capnography & oxygen therapy",r:["M21","M22","O41","O38"],
 bl:"Titrate oxygen to a target, not to 100%. For most ICU patients, SpO₂ 92–96% is reasonable; 88–92% for those at risk of hypercapnia. Pulse oximetry is less accurate in darker skin, low perfusion and carbon monoxide poisoning; capnography is the best real-time check of ventilation and tube position.",
 ord:["SpO₂ target documented in orders (e.g., 92–96%, or 88–92% in COPD or obesity hypoventilation)","Continuous waveform capnography for every intubated patient","ABG to confirm SpO₂ in shock, dark skin pigmentation, or suspected CO or methemoglobin"],
 act:["Escalate from nasal cannula to venturi, non-rebreather, then HFNC or NIV per need","Avoid hyperoxia (PaO₂ > 150 mmHg) except in CO poisoning or pneumothorax","EtCO₂ less than PaCO₂ normally by 2–5 mmHg; a bigger gap means more dead space","Sudden loss of the capnography waveform: dislodged tube, circuit disconnect, or cardiac arrest"],
 ev:[["PILOT (JAMA 2022)","SpO₂ targets of 88–92%, 92–96% and 96–100% gave similar ventilator-free days in ventilated adults."],["HOT-ICU (NEJM 2021)","PaO₂ target 60 vs 90 mmHg in acute hypoxemic failure: no 90-day mortality difference."],["Sjoding (NEJM 2020)","Occult hypoxemia missed by pulse oximetry was about three times more frequent in Black patients."],["Austin (BMJ 2010)","Titrated oxygen (88–92%) in prehospital COPD exacerbation reduced mortality versus high-flow oxygen."]],
 pr:["A ‘normal’ SpO₂ on high FiO₂ can hide worsening gas exchange; track FiO₂ and SpO₂ together.","In CO poisoning, pulse oximetry reads falsely normal; you need co-oximetry.","High oxygen in COPD raises PaCO₂ mainly via worsened V/Q matching and the Haldane effect, not loss of drive."],
 q:["Why might SpO₂ be falsely reassuring in some patients?","Pulse oximeters overestimate saturation in darker skin pigmentation, carbon monoxide poisoning (COHb reads as oxyHb), low perfusion and motion; confirm with arterial co-oximetry."]},

{id:"hfnc_niv",u:4,t:"High-flow nasal cannula & non-invasive ventilation",r:["O43","O41","M24"],
 bl:"HFNC delivers heated, humidified oxygen at up to 60 L/min: precise FiO₂, some PEEP, dead-space washout and comfort. It’s first-line for most hypoxemic failure. NIV (BiPAP) is first-line for COPD exacerbation with acidosis and cardiogenic pulmonary edema. Failure on either should prompt timely intubation, not drift.",
 ord:["HFNC: start 40–60 L/min, FiO₂ to SpO₂ target","BiPAP for COPD: IPAP 10–12, EPAP 4–5, titrate IPAP to pH and work of breathing","CPAP 10 cmH₂O (or BiPAP) for cardiogenic pulmonary edema","ROX index at 2, 6 and 12 h on HFNC"],
 act:["ROX = (SpO₂/FiO₂) / RR; ≥ 4.88 at 12 h predicts HFNC success; < 3.85 predicts failure","Reassess NIV at 1–2 h: improved pH, RR and comfort; if not, intubate","Avoid NIV with inability to protect airway, vomiting, facial trauma, or refractory shock","Large tidal volumes on NIV in hypoxemic patients (> 9.5 mL/kg) signal failure"],
 ev:[["FLORALI (NEJM 2015)","HFNC lowered 90-day mortality versus face-mask NIV or standard oxygen in hypoxemic failure; fewer intubations if P/F ≤ 200."],["Brochard (NEJM 1995)","NIV in COPD exacerbation reduced intubation, complications and mortality."],["RECOVERY-RS (JAMA 2022)","In COVID-19, CPAP reduced intubation or death versus conventional oxygen; HFNC did not."],["HENIVOT (JAMA 2021)","Helmet NIV versus HFNC in COVID didn’t change respiratory-support-free days but reduced intubation."]],
 pr:["Delayed intubation after failed HFNC (> 48 h) was associated with higher mortality in observational data.","Face-mask NIV in de novo hypoxemic failure may harm by allowing injurious tidal volumes.","Watch the patient, not just the saturation: accessory muscle use and paradoxical breathing are failure signs."],
 q:["How is the ROX index calculated and what does it predict?","(SpO₂/FiO₂) ÷ respiratory rate. Values ≥ 4.88 at 2, 6 or 12 h predict HFNC success; low values predict need for intubation."]},

{id:"airway",u:4,t:"Intubating the critically ill patient",r:["O44","V1"],
 bl:"ICU intubation is high risk: hypoxemia, hypotension and cardiac arrest occur in up to 4 in 10 attempts. Resuscitate before you intubate, preoxygenate well, use video laryngoscopy, pick hemodynamically gentle drug doses, and have a plan for failure.",
 ord:["Preoxygenation with NIV (or HFNC) in hypoxemic patients","Induction: ketamine 1–2 mg/kg or etomidate 0.2–0.3 mg/kg (reduce in shock); rocuronium 1.2 mg/kg or succinylcholine 1.5 mg/kg","Norepinephrine running or push-dose ready before induction in shock","Post-intubation analgesia and sedation started immediately"],
 act:["Bag-mask ventilate gently between induction and laryngoscopy in hypoxemic patients","Video laryngoscope first attempt; bougie available","Confirm with waveform capnography; post-intubation CXR for depth","Avoid succinylcholine with hyperkalemia, prolonged immobility, burns > 48 h, neuromuscular disease"],
 ev:[["INTUBE (JAMA 2021)","Major peri-intubation adverse events occurred in 45% of critically ill adults, mostly cardiovascular instability."],["PREVENT (NEJM 2019)","Bag-mask ventilation during induction reduced severe hypoxemia without more aspiration."],["DEVICE (NEJM 2023)","Video laryngoscope improved first-attempt success (85% vs 71%) versus direct laryngoscope."],["PREOXI (NEJM 2024)","NIV preoxygenation reduced peri-intubation hypoxemia compared with an oxygen mask."]],
 pr:["Severe metabolic acidosis: match the patient’s minute ventilation immediately after intubation or pH will crash.","RV failure or massive PE: intubation can trigger arrest. Minimize induction dose, have pressors running, avoid high PEEP.","Rocuronium lasts 45–60+ min; have sugammadex available if a can’t-intubate situation arises."],
 q:["Why is matching pre-intubation minute ventilation critical in severe metabolic acidosis?","These patients compensate with very high minute ventilation; any apnea or a ‘standard’ vent rate lets PaCO₂ rise and pH can fall catastrophically, causing arrest."]},

{id:"pe",u:4,t:"Pulmonary embolism",r:["O45","M6"],
 bl:"Risk-stratify by hemodynamics and RV strain. High-risk (massive) PE with shock needs reperfusion now, usually systemic thrombolysis. Intermediate-high risk patients need anticoagulation and close watching, with rescue reperfusion if they deteriorate. Protect the failing RV: little fluid, norepinephrine, avoid intubation if you can.",
 ord:["CT pulmonary angiogram (or bedside echo and leg ultrasound if too unstable)","Troponin and BNP for risk stratification","Unfractionated heparin infusion if lysis or procedures are possible; LMWH otherwise","Alteplase 100 mg IV over 2 h for high-risk PE (50 mg bolus in arrest)"],
 act:["Activate a PE response team (PERT) for intermediate-high and high-risk PE","Fluid: at most a small bolus (≤ 500 mL); the dilated RV doesn’t need more","Norepinephrine for hypotension; consider inhaled pulmonary vasodilators","Catheter-directed therapy or surgical embolectomy when lysis is contraindicated or fails; VA-ECMO for arrest or refractory shock"],
 ev:[["PEITHO (NEJM 2014)","Tenecteplase in intermediate-risk PE cut hemodynamic decompensation but raised major bleeding and stroke (2% hemorrhagic)."],["ESC PE guideline (2019)","Recommends systemic thrombolysis for high-risk PE and against routine lysis for intermediate-risk."],["PROTECT (NEJM 2011)","Dalteparin vs UFH prophylaxis in ICU patients: similar DVT, fewer PEs and less HIT with dalteparin."]],
 pr:["Hypotension in PE is late: the RV fails before BP falls.","Intubation and positive pressure ventilation can precipitate arrest in massive PE.","Unexplained hypoxemia with a clear CXR in an ICU patient: think PE."],
 q:["What is the main risk of systemic thrombolysis in intermediate-risk PE seen in PEITHO?","Major bleeding including about 2% hemorrhagic stroke, offsetting the reduction in hemodynamic decompensation."]},

{id:"asthmacopd",u:4,t:"Severe asthma & COPD exacerbations",r:["O46","O47","M24","V15"],
 bl:"Both are obstruction problems where the danger is gas trapping (auto-PEEP). Treat bronchospasm hard, give steroids, use NIV in COPD with acidosis, and if you ventilate, use a low rate and long expiratory time, accepting hypercapnia to avoid dynamic hyperinflation.",
 ord:["Albuterol continuous nebulization 10–15 mg/h (asthma) or frequent nebs; ipratropium 0.5 mg q20min × 3","Methylprednisolone 40–125 mg IV or prednisone 40–60 mg (COPD: 40 mg × 5 days)","Magnesium sulfate 2 g IV over 20 min (asthma)","Antibiotics for COPD with purulent sputum or ventilation (e.g., azithromycin, doxycycline, or a β-lactam)","ABG and lactate (albuterol raises lactate)"],
 act:["COPD with pH < 7.35 and PaCO₂ > 45: BiPAP first","Asthma ventilation: VT 6–8 mL/kg, RR 10–14, high inspiratory flow (60–80 L/min), PEEP low, I:E 1:3–1:5","Measure plateau and auto-PEEP (expiratory hold); target Pplat < 30","Sudden hypotension on the vent: disconnect the circuit and let the patient exhale; check for pneumothorax"],
 ev:[["REDUCE (JAMA 2013)","5 days of prednisone 40 mg was non-inferior to 14 days for COPD exacerbation."],["Rowe Cochrane review","IV magnesium reduces admissions in severe acute asthma."],["Darioli (Am Rev Respir Dis 1984)","Controlled hypoventilation (permissive hypercapnia) reduced mortality in mechanically ventilated status asthmaticus."]],
 pr:["Ketamine is a good induction agent in asthma for its bronchodilation.","‘Silent chest’ means almost no airflow: very severe.","Lactic acidosis on high-dose albuterol is usually benign but can drive dyspnea; watch it."],
 q:["What is the first move when a ventilated asthmatic suddenly becomes hypotensive?","Disconnect the ventilator to let trapped air out (relieving auto-PEEP), then check for tension pneumothorax and reduce rate or tidal volume."]},

{id:"covid",u:4,t:"Viral pneumonia, COVID-19 & surge ventilation",r:["O49","V24"],
 bl:"COVID-19 taught the ICU that standard supportive care (lung-protective ventilation, proning, conservative fluids) works for viral pneumonia, and that a few targeted therapies help: dexamethasone, IL-6 or JAK inhibition, and antivirals early in the course. Influenza needs oseltamivir in every critically ill patient.",
 ord:["Dexamethasone 6 mg daily × 10 days for patients on oxygen","Tocilizumab (or baricitinib) for rapidly progressive disease on HFNC, NIV or the vent","VTE prophylaxis (therapeutic heparin in non-critical but not in critical patients)","Oseltamivir 75 mg BID for influenza in critically ill patients regardless of timing"],
 act:["Awake proning on HFNC: ≥ 8 h/day if tolerated","Same ventilator principles as ARDS","Airborne precautions and fit-tested PPE for aerosol-generating procedures","During surges: protocolize, cohort, and use the team model"],
 ev:[["RECOVERY dexamethasone (NEJM 2021)","Reduced 28-day mortality in patients on oxygen or ventilation; no benefit without oxygen."],["RECOVERY tocilizumab (Lancet 2021) and REMAP-CAP (NEJM 2021)","IL-6 blockade reduced mortality in hypoxic patients with inflammation."],["Awake prone meta-trial (Ehrmann, Lancet Respir Med 2021)","Awake proning reduced treatment failure (intubation or death) in COVID on HFNC."],["ATTACC/ACTIV-4a/REMAP-CAP (NEJM 2021)","Therapeutic heparin helped non-critical patients but not those already in the ICU."]],
 pr:["The heparin dosing finding is a good example of how disease severity changes the effect of a therapy.","Many COVID patients had ‘happy hypoxemia’ with low dyspnea. Watch the work of breathing and trajectory.","Superinfection and VAP rates were high in prolonged COVID ventilation."],
 q:["In which COVID patients did dexamethasone not help?","Those not requiring supplemental oxygen; there was a possible signal of harm in that group in RECOVERY."]}
);

L.push(
{id:"modes",u:5,t:"Ventilator modes: volume, pressure & support",r:["V9","V10","V11","M25","M26","O42"],
 bl:"Every breath has a trigger (what starts it), a target (what is controlled: volume or pressure) and a cycle (what ends it). Volume control guarantees tidal volume and lets pressure vary; pressure control fixes pressure and lets volume vary with compliance and effort. Pressure support is patient-triggered and flow-cycled, so the patient sets rate and timing.",
 ord:["Default: volume assist-control, VT 6–8 mL/kg predicted body weight","Pressure control when you want to cap pressures or improve synchrony with variable demand","Pressure support (e.g., PS 5–10, PEEP 5) for awake, spontaneously breathing patients and SBTs","SIMV only with a reason; it adds work of breathing with little benefit"],
 act:["Predicted body weight: men 50 + 2.3 × (height in inches − 60); women 45.5 + 2.3 × (height in inches − 60)","In volume control, alarms watch pressure; in pressure control, alarms watch tidal volume and minute ventilation","Pressure-regulated volume control (PRVC/VC+) adapts pressure to hit a target volume, but can lower support when the patient pulls hard","Document mode, VT, RR (set and total), PEEP, FiO₂, Ppeak, Pplat"],
 ev:[["Rittayamai (Chest 2015)","Pressure and volume modes have no outcome differences when tidal volume and pressure are matched; lung protection is about the numbers, not the mode name."],["Esteban (NEJM 1995)","SIMV was the slowest weaning method compared with daily SBTs or pressure support."],["ARDSNet ARMA (NEJM 2000)","Tidal volume 6 vs 12 mL/kg PBW reduced mortality; the protective target applies across modes."]],
 pr:["Use height, never actual weight, to set tidal volume; obese patients don’t have bigger lungs.","A patient breathing over the set rate in assist-control gets a full set tidal volume each time, which can cause breath stacking and auto-PEEP.","Pressure support doesn’t guarantee anything if the patient stops breathing; check the apnea backup."],
 q:["What is the predicted body weight for a 70-inch (5′10″) man and his 6 mL/kg tidal volume?","PBW = 50 + 2.3 × 10 = 73 kg; 6 mL/kg ≈ 440 mL."]},

{id:"initial_vent",u:5,t:"Initial vent settings & troubleshooting",r:["V1","V2","V3","V6"],
 bl:"Start lung-protective for everyone: VT 6–8 mL/kg PBW, rate to match the patient’s pre-intubation minute ventilation, PEEP 5–8, FiO₂ 100% then wean fast. When the vent alarms or the patient decompensates, use a reproducible sequence: disconnect and bag, then DOPES.",
 ord:["Initial: VC-AC, VT 6–8 mL/kg PBW, RR 16–20 (higher in metabolic acidosis), PEEP 5–8, FiO₂ 1.0 → wean to SpO₂ 92–96%","ABG 30 min after intubation","Plateau pressure check on initial settings","Head of bed 30°, sedation/analgesia orders, OG tube"],
 act:["DOPES: Displacement (tube position), Obstruction (secretions, kinking, biting), Pneumothorax, Equipment failure, Stacked breaths (auto-PEEP)","High peak with normal plateau: airway resistance (bronchospasm, secretions, kinked tube)","High peak and high plateau: low compliance (ARDS, edema, pneumothorax, abdominal distension, mainstem intubation)","Permissive hypercapnia: accept pH ≥ 7.20–7.25 rather than raising tidal volume (not in raised ICP)"],
 ev:[["Neto (JAMA 2012)","Meta-analysis: protective tidal volumes in patients without ARDS were associated with less lung injury and lower mortality."],["PReVENT (JAMA 2018)","In patients without ARDS, 4–6 vs 8–10 mL/kg PBW did not change ventilator-free days; very low VT isn’t needed if not ARDS."],["Hickling (ICM 1990)","Permissive hypercapnia with limited pressures in ARDS was associated with lower mortality than predicted."]],
 pr:["To fix oxygenation, change FiO₂ and PEEP (mean airway pressure); to fix CO₂, change rate and tidal volume.","After intubation of a ‘kussmaul’ breather, set RR 28–30 and recheck the gas quickly.","If in doubt, take the patient off the vent and hand-bag: it eliminates the machine as the problem."],
 q:["Peak pressure jumps from 25 to 45 but plateau is unchanged at 20. What should you look for?","An airway resistance problem: kinked or bitten tube, secretions/mucus plug, or bronchospasm. Suction, check the tube, and give bronchodilators."]},

{id:"vent_monitor",u:5,t:"Monitoring the vent: pressures, waveforms & dyssynchrony",r:["V7","V13","V14","O38","O39"],
 bl:"The vent shows you what the lungs and patient are doing. Plateau and driving pressure measure lung stress; auto-PEEP measures gas trapping; waveforms reveal dyssynchrony that drives sedation, injury and failed weaning. Look at the screen every time you see a ventilated patient.",
 ord:["Daily plateau pressure (inspiratory hold 0.5 s) and auto-PEEP (expiratory hold)","Driving pressure = Pplat − PEEP documented daily","ABG with ventilator changes, or SpO₂ and EtCO₂ trends between gases"],
 act:["Static compliance = VT / (Pplat − PEEP); normal ≈ 50–100 mL/cmH₂O","Flow waveform not returning to zero before the next breath = auto-PEEP","Ineffective triggering: patient efforts with no breath (often from auto-PEEP or weak effort); reduce trapping or lower trigger","Double triggering or ‘flow starvation’ (scooped pressure curve in VC): increase flow or VT, or switch to pressure control; reverse triggering occurs with deep sedation"],
 ev:[["Thille (ICM 2006)","Asynchrony index > 10% was associated with longer ventilation and more tracheostomies."],["Blanch (ICM 2015)","High asynchrony rates were associated with higher ICU mortality."],["Amato (NEJM 2015)","Driving pressure was the ventilation variable most strongly linked to survival in ARDS."]],
 pr:["Measure plateau with the patient passive; an actively breathing patient makes it unreliable.","Double triggering in VC can deliver twice the set tidal volume, quietly defeating lung protection.","Before adding sedation for ‘fighting the vent’, fix the vent: flow, trigger, cycle and auto-PEEP."],
 q:["How do you detect auto-PEEP at the bedside?","Expiratory flow doesn’t return to zero before the next breath on the flow waveform; quantify with an end-expiratory hold maneuver."]},

{id:"lungprotect",u:5,t:"Lung protection, PEEP & driving pressure",r:["V8","V12","M23"],
 bl:"Ventilator-induced lung injury comes from overdistension (volutrauma), cyclic collapse (atelectrauma) and inflammation (biotrauma). Protect the lung with low tidal volumes (6 mL/kg PBW), plateau < 30 cmH₂O, driving pressure ideally < 15, and enough PEEP to keep recruitable lung open without overdistending the rest.",
 ord:["VT 6 mL/kg PBW in ARDS (range 4–8 to stay under the plateau limit)","PEEP by ARDSNet PEEP/FiO₂ table (lower or higher table), or a best-compliance titration","Pplat < 30, driving pressure < 15 targets on rounds"],
 act:["If Pplat > 30, step VT down to 5 then 4 mL/kg","If driving pressure rises with a PEEP increase, you are overdistending; back down","Higher PEEP tends to help moderate-severe ARDS with recruitable lung; watch BP and RV","Accept SpO₂ 88–95% and PaO₂ 55–80 per ARDSNet"],
 ev:[["ARMA (NEJM 2000)","6 vs 12 mL/kg PBW: mortality 31% vs 40%."],["ALVEOLI (2004), LOVS and EXPRESS (2008)","Higher PEEP didn’t lower mortality overall; meta-analysis (Briel, JAMA 2010) suggested benefit in moderate–severe ARDS."],["ART (JAMA 2017)","Aggressive recruitment maneuvers with PEEP titration increased mortality."],["EPVent-2 (JAMA 2019)","Esophageal-pressure-guided PEEP didn’t beat the high-PEEP table."]],
 pr:["Lungs are ‘baby lungs’ in ARDS: the aerated part is small, so normal tidal volumes overdistend it.","A PEEP increase that improves oxygenation but drops BP may be reducing venous return or straining the RV.","Recruitment maneuvers are no longer routine; use them, if at all, gently and with a reason."],
 q:["Pplat 32 on VT 6 mL/kg and PEEP 12. What do you change?","Lower tidal volume toward 5 then 4 mL/kg (accepting hypercapnia), and reassess PEEP: if driving pressure (20) falls with less PEEP, there may be overdistension."]},

{id:"ards",u:5,t:"ARDS: definition & core management",r:["O37","M23","V25"],
