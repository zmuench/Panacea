 bl:"ARDS is acute, bilateral, non-cardiogenic lung injury with hypoxemia. Lung-protective ventilation, conservative fluids, proning in severe disease and treatment of the cause are the backbone. Identify and fix the trigger: pneumonia, aspiration, sepsis, pancreatitis, transfusion, trauma.",
 ord:["ARDSNet protocol orders (VT 6 mL/kg PBW, PEEP/FiO₂ table, Pplat < 30)","Echo to exclude cardiogenic edema when unclear","Conservative fluid strategy once shock resolves (diuresis to CVP/PCWP or by weight)","Infectious workup: cultures, viral panel, urinary antigens; BAL if diagnosis unclear"],
 act:["P/F < 150 on FiO₂ ≥ 0.6 and PEEP ≥ 5 after optimization: prone for ≥ 16 h/day","Consider early neuromuscular blockade for severe dyssynchrony or refractory hypoxemia","Consider steroids (dexamethasone) in moderate–severe ARDS, especially from pneumonia","Refer early for ECMO evaluation if P/F < 80 for > 6 h despite proning"],
 ev:[["ARDS Definition Task Force (JAMA 2012, Berlin) and global update (AJRCCM 2024)","Mild P/F 200–300, moderate 100–200, severe < 100; the global definition adds HFNC and SpO₂/FiO₂ criteria."],["FACTT (NEJM 2006)","Conservative fluid management increased ventilator-free days."],["DEXA-ARDS (Lancet Respir Med 2020)","Dexamethasone 20 mg then 10 mg daily in moderate–severe ARDS reduced mortality and increased ventilator-free days."]],
 pr:["Hydrostatic edema can coexist with ARDS; a normal echo doesn’t exclude volume overload but makes it less likely.","Early ARDS often looks better on CXR than it is clinically; treat the gas exchange, not the film.","Ask every morning: what drove this ARDS, and is it controlled?"],
 q:["List three ARDS therapies with a mortality benefit in RCTs.","Low tidal volume ventilation (ARMA), prone positioning in severe ARDS (PROSEVA), and dexamethasone (DEXA-ARDS); conservative fluids increased ventilator-free days."]},

{id:"prone",u:5,t:"Prone positioning & neuromuscular blockade",r:["V16","V25","O37"],
 bl:"Proning makes lung inflation more homogeneous, improves V/Q matching, and reduces ventilator-induced injury; in severe ARDS it saves lives when done early and long (≥ 16 h). Neuromuscular blockade stops dyssynchrony and high-effort breathing but is now reserved for selected patients.",
 ord:["Prone session ≥ 16 h/day when P/F < 150 on FiO₂ ≥ 0.6, PEEP ≥ 5","Cisatracurium infusion (e.g., 15 mg bolus, 37.5 mg/h as in ACURASYS) when indicated, with deep sedation","Train-of-four and eye care orders; pressure injury prevention"],
 act:["Team-based prone turns with a checklist: tube secured, lines, ECG leads on the back, pads, chest and pelvic supports","Continue proning daily until P/F > 150 on PEEP ≤ 10 and FiO₂ ≤ 0.6 for 4 h supine","Before paralysis, ensure the patient is deeply sedated and doesn’t have awareness","CPR can be performed prone if needed (hands between scapulae)"],
 ev:[["PROSEVA (NEJM 2013)","Prone ≥ 16 h/day in severe ARDS cut 28-day mortality from 33% to 16%."],["ACURASYS (NEJM 2010)","48 h of cisatracurium in early severe ARDS reduced adjusted 90-day mortality."],["ROSE (NEJM 2019)","Early routine NMB versus lighter sedation without NMB showed no mortality difference."]],
 pr:["Proning is cheap and effective but underused. Don’t wait for ECMO consideration to start it.","Improvement in oxygenation with proning doesn’t predict survival benefit; prone anyway.","Facial edema and pressure injuries are common; plan skin care."],
 q:["What oxygenation threshold and session length did PROSEVA use?","P/F < 150 mmHg on FiO₂ ≥ 0.6 and PEEP ≥ 5, with sessions of at least 16 consecutive hours a day."]},

{id:"rescue_vent",u:5,t:"Rescue modes: APRV, inhaled vasodilators & HFOV",r:["V17","V18","V19","M27"],
 bl:"When oxygenation stays dangerous despite proper ventilation and proning, rescue options buy time. None has proven mortality benefit; use them as a bridge to recovery or ECMO, with a clear stopping point.",
 ord:["APRV: P-high ~ prior plateau (≤ 30), P-low 0, T-high 4–6 s, T-low 0.4–0.8 s (terminate expiration at ~50–75% of peak expiratory flow)","Inhaled nitric oxide 5–20 ppm or inhaled epoprostenol 0.05 mcg/kg/min","Methemoglobin levels on nitric oxide"],
 act:["Inhaled vasodilators improve oxygenation by redistributing blood to ventilated lung; trial for 30–60 min, stop if no response","Use inhaled vasodilators for acute RV failure too","APRV works best with spontaneous breathing; watch for large tidal volumes on release","HFOV only in experienced centers; it isn’t recommended as routine"],
 ev:[["OSCILLATE (NEJM 2013)","HFOV in early moderate–severe ARDS increased mortality."],["Inhaled NO meta-analysis (Gebistorf, Cochrane 2016)","Improves oxygenation transiently, no mortality benefit, increases kidney injury risk."],["Zhou (ICM 2017)","Small single-center RCT of early APRV showed more ventilator-free days; not replicated widely."]],
 pr:["Rapid weaning of inhaled nitric oxide can cause rebound pulmonary hypertension; wean slowly.","APRV terminology differs by manufacturer (BiLevel, Bi-Vent); know your machine.","If you reach for a rescue mode, also call the ECMO center."],
 q:["Why does inhaled nitric oxide improve oxygenation?","It vasodilates only the pulmonary vessels of ventilated alveoli, diverting blood flow toward them and reducing shunt."]},

{id:"ecmo",u:5,t:"ECMO: veno-venous & veno-arterial",r:["V20","V21","O50","O28"],
 bl:"VV-ECMO replaces lung function (oxygenation and CO₂ removal) for severe reversible respiratory failure; the heart must work. VA-ECMO adds circulatory support for refractory cardiogenic shock or cardiac arrest. Both are bridges to recovery, transplant or decision, with significant bleeding and thrombotic risk.",
 ord:["Early referral criteria (EOLIA-like): P/F < 50 for 3 h, P/F < 80 for 6 h, or pH < 7.25 with PaCO₂ ≥ 60 for 6 h despite optimal care","Anticoagulation per center protocol (UFH, anti-Xa or aPTT target)","Daily hemolysis labs (LDH, plasma free Hb), fibrinogen, platelets"],
 act:["VV: ultra-protective ‘rest’ ventilation (low VT, PEEP 10–15, RR 10)","VA: watch for LV distension (pulmonary edema, no pulsatility) and differential hypoxemia (North–South syndrome); right radial ABG","Contraindications: irreversible disease without bridge option, very prolonged high-pressure ventilation (> 7 days), contraindication to anticoagulation","Limb ischemia checks with femoral arterial cannulas"],
 ev:[["CESAR (Lancet 2009)","Referral to an ECMO center improved survival without disability."],["EOLIA (NEJM 2018)","Early VV-ECMO: 60-day mortality 35% vs 46% (not significant); Bayesian reanalysis favored ECMO."],["ECLS-SHOCK (NEJM 2023)","VA-ECMO in infarct-related cardiogenic shock didn’t reduce 30-day mortality and increased bleeding."],["ARREST (Lancet 2020)","ECPR for refractory VF out-of-hospital arrest improved survival in a small single-center trial."]],
 pr:["Differential hypoxemia: with femoral VA-ECMO and poor lungs, the upper body gets blood the native lungs oxygenated.","Pulsatile arterial line waveform on VA-ECMO tells you the LV is ejecting.","ECMO is a bridge; decide what you are bridging to before you start."],
 q:["What is North–South (differential) hypoxemia on peripheral VA-ECMO?","Blood ejected from the native heart (oxygenated poorly by sick lungs) supplies the coronaries and brain, while well-oxygenated ECMO blood reaches the lower body; detected by a hypoxemic right radial ABG."]},

{id:"liberation",u:5,t:"Liberation from mechanical ventilation",r:["V22","M30","O42"],
 bl:"Ask every day whether the patient can come off the vent: pair a spontaneous awakening trial (SAT) with a spontaneous breathing trial (SBT). Extubate those who pass and can protect their airway, and support high-risk patients after extubation with HFNC or NIV.",
 ord:["Daily SAT screen then SBT screen (FiO₂ ≤ 0.5, PEEP ≤ 8, hemodynamically stable, some respiratory drive)","SBT: pressure support 5–8, PEEP 0–5, for 30 min (or T-piece up to 2 h)","Cuff-leak test in high-risk patients (prolonged intubation, trauma); methylprednisolone 20 mg q4h × 4 doses before extubation if no leak","Post-extubation HFNC for low-risk patients; NIV alternating with HFNC for high-risk"],
 act:["Failure signs: RR > 35, SpO₂ < 90%, HR > 140 or a 20% change, SBP > 180 or < 90, anxiety, diaphoresis, accessory muscle use","Rapid shallow breathing index (RR/VT in liters) < 105 predicts success","Assess secretions, cough strength and mental status (GCS, ability to follow commands)","High-risk: age > 65, heart failure, COPD, BMI > 30, prolonged ventilation, hypercapnia"],
 ev:[["ABC trial (Girard, Lancet 2008)","Paired SAT and SBT reduced ventilation time, ICU stay and 1-year mortality."],["Subirà (JAMA 2019)","30-min PS SBT led to more successful extubations than 2-h T-piece."],["HIGH-WEAN (Thille, JAMA 2019)","In high-risk patients, NIV alternating with HFNC after extubation reduced reintubation versus HFNC alone."],["Hernández (JAMA 2016)","In low-risk patients, HFNC after extubation reduced reintubation compared with conventional oxygen."]],
 pr:["Failing an SBT is information: find out why (cardiac, secretions, weakness, fluid) and fix it.","Fluid overload is a common reason for SBT failure; a negative balance can turn a failure into a success.","Don’t keep a patient intubated only for a mildly elevated PaCO₂ if they’re otherwise ready."],
 q:["What does a rapid shallow breathing index of 130 suggest?","Likely SBT/extubation failure (threshold 105): the patient is breathing fast with small tidal volumes."]},

{id:"prolonged",u:5,t:"Prolonged ventilation, tracheostomy & VAP prevention",r:["V23","M28","M29"],
 bl:"About 1 in 10 ventilated patients need ventilation beyond 14–21 days. Tracheostomy improves comfort and makes weaning easier but doesn’t lower mortality when done early. Prevent ventilator complications by keeping heads up, sedation light, mouths clean and tubes out as soon as possible.",
 ord:["VAP bundle: HOB 30–45°, daily SAT/SBT, oral care, subglottic suction ETT, VTE and ulcer prophylaxis as indicated","Tracheostomy (percutaneous or surgical) when prolonged ventilation is expected, typically 7–14 days","Speech-language pathology and physical therapy for trach patients"],
 act:["Weaning prolonged patients: progressive trach collar trials (increasing duration daily)","Check the trach daily: cuff pressure 20–30 cmH₂O, bedside obturator and spare trach","Early mobilization, even on the vent","Discuss goals of care and long-term outcomes with family"],
 ev:[["TracMan (JAMA 2013)","Early (day 1–4) vs late (≥ day 10) tracheostomy: no difference in 30-day mortality; many in the late group never needed a trach."],["Jubran (JAMA 2013)","In prolonged weaning, trach collar trials led to faster weaning than pressure support reduction."],["Schweickert (Lancet 2009)","Early physical and occupational therapy during sedation interruption improved functional independence at discharge."]],
 pr:["A fresh trach (< 7 days) that dislodges is an emergency: the tract isn’t mature, so re-intubate from above.","Chlorhexidine oral care was linked to higher mortality in some meta-analyses; many units have moved to toothbrushing.","Ventilator dependence is often weakness plus fluid plus heart; work on all three."],
 q:["What did TracMan show about tracheostomy timing?","No mortality benefit to early (within 4 days) versus late tracheostomy, and many patients assigned late never needed one."]}
);

L.push(
{id:"acs",u:6,t:"Acute coronary syndromes in the ICU",r:["O29","M16"],
 bl:"STEMI and STEMI-equivalents need emergent reperfusion; NSTE-ACS needs antithrombotic therapy and risk-based timing of angiography. In ICU patients, most troponin elevations are type 2 (supply–demand mismatch) or non-ischemic injury, and the treatment is the underlying illness.",
 ord:["12-lead ECG (repeat with changing symptoms; posterior leads V7–V9 if ST depression V1–V3)","High-sensitivity troponin with delta","Aspirin 162–325 mg chewed; P2Y12 inhibitor per cardiology; heparin infusion","Echo for wall motion and mechanical complications"],
 act:["Cath lab activation for STEMI, posterior MI, new LBBB with Sgarbossa criteria, or occlusion MI patterns","Avoid nitrates in RV infarction (inferior STEMI with V4R elevation), hypotension, or PDE-5 inhibitor use","Avoid β-blockers in heart failure, shock, or high risk of cardiogenic shock","Look for mechanical complications in new shock after MI: papillary muscle rupture (new murmur, acute MR), VSD, free wall rupture"],
 ev:[["CULPRIT-SHOCK (NEJM 2017)","In MI with cardiogenic shock and multivessel disease, culprit-only PCI lowered death or RRT at 30 days versus immediate multivessel PCI."],["Fourth Universal Definition of MI (2018)","Distinguishes type 1 (plaque rupture) and type 2 (supply–demand) MI and non-ischemic myocardial injury."],["COMMIT/CCS-2 (Lancet 2005)","Early IV then oral metoprolol in acute MI increased cardiogenic shock, especially in high-risk patients."]],
 pr:["Type 2 MI in sepsis or anemia doesn’t need heparin by default; treat the cause.","Wellens and de Winter patterns are high-risk ECGs even without classic ST elevation.","New hypotension after a cath: think retroperitoneal bleed, tamponade, or vagal reaction."],
 q:["What patterns warrant posterior leads?","Horizontal ST depression in V1–V3 with tall R waves, which may be a posterior STEMI; ST elevation in V7–V9 confirms it."]},

{id:"cshock",u:6,t:"Cardiogenic shock & mechanical circulatory support",r:["O28","O33","M13"],
 bl:"Cardiogenic shock is low cardiac output with hypoperfusion despite adequate filling. Stage it (SCAI A–E), treat the cause (revascularize MI), support perfusion with norepinephrine and an inotrope, and involve a shock team early for mechanical support selection.",
 ord:["Echo, lactate, ScvO₂/SvO₂, creatinine, LFTs","PA catheter to phenotype (LV vs RV vs biventricular) when not responding","Norepinephrine for MAP 65; add dobutamine or milrinone for low output","Cardiology and cardiac surgery (shock team) consult"],
 act:["SCAI stages: A at risk, B beginning (hypotension without hypoperfusion), C classic, D deteriorating, E extremis","Mechanical support options: IABP (modest), Impella (LV unloading), VA-ECMO (full support, raises LV afterload), Tandem/RV devices","Avoid fluid unless clearly preload-dependent (e.g., RV infarct with low CVP)","Watch for LV distension on VA-ECMO; may need venting (Impella, IABP)"],
 ev:[["IABP-SHOCK II (NEJM 2012)","IABP in MI-related cardiogenic shock didn’t reduce 30-day or long-term mortality."],["DanGer Shock (NEJM 2024)","Impella CP in STEMI cardiogenic shock lowered 180-day mortality (46% vs 59%) with more bleeding, limb ischemia, and RRT."],["ECLS-SHOCK (NEJM 2023)","Routine VA-ECMO did not reduce mortality in infarct-related cardiogenic shock."]],
 pr:["Cold and wet: inotrope ± vasopressor ± support; warm and wet: diuretics; cold and dry: careful fluid; warm and dry: compensated.","A falling cardiac power output is often the earliest warning of deterioration.","Mixed shock (cardiogenic plus sepsis) is common; ScvO₂ may be misleadingly normal."],
 q:["Which mechanical support device showed a mortality benefit in STEMI cardiogenic shock and at what cost?","Microaxial flow pump (Impella CP) in DanGer Shock: lower 180-day mortality, but more bleeding, limb ischemia, and renal replacement therapy."]},

{id:"ahf_rv",u:6,t:"Acute heart failure, RV failure & pulmonary hypertension",r:["O33","M13"],
 bl:"Most acute heart failure is congestion, not low output: decongest with IV loop diuretics, use vasodilators for hypertensive pulmonary edema (SCAPE), and support breathing with CPAP/NIV. The failing RV is a different organ: keep it perfused (MAP), unload it (lower PVR), and don’t overfill it.",
 ord:["Furosemide IV at 1–2.5× home oral dose (bolus) with urine sodium check at 2 h (target > 50–70 mEq/L)","Nitroglycerin infusion (high-dose bolus/infusion for SCAPE)","CPAP or BiPAP for pulmonary edema","RV failure: norepinephrine ± vasopressin; dobutamine or milrinone; inhaled NO or epoprostenol"],
 act:["Escalate diuretics if weak response: double the dose, add acetazolamide or thiazide","Avoid hypoxia, hypercapnia and acidosis in RV failure; they raise PVR","Avoid high PEEP and large tidal volumes in RV failure","Intubating a patient with severe pulmonary hypertension is high risk: optimize first, support MAP, consider awake approaches"],
 ev:[["DOSE (NEJM 2011)","Bolus vs continuous and high vs low furosemide doses didn’t differ in symptoms or creatinine; high dose decongested more."],["ADVOR (NEJM 2022)","Adding acetazolamide to loop diuretics improved successful decongestion at 3 days."],["CLOROTIC (Eur Heart J 2023)","Adding hydrochlorothiazide improved weight loss and diuretic response with more hypokalemia and creatinine rise."]],
 pr:["Rising creatinine during effective decongestion is often acceptable; don’t stop diuresis reflexively.","In RV failure, CVP rising with falling MAP means the RV is past its limit; more fluid will worsen it.","Interventricular dependence: a dilated RV shifts the septum and starves the LV."],
 q:["Why avoid hypercapnia and acidosis in acute RV failure?","Both raise pulmonary vascular resistance, increasing RV afterload in a ventricle that already can’t cope."]},

{id:"arrhythmia",u:6,t:"Tachyarrhythmias, bradyarrhythmias & pacing",r:["O31","O32","M15"],
 bl:"Unstable patients with arrhythmia get electricity: synchronized cardioversion for tachycardia, pacing for bradycardia. In the ICU, new AF is usually driven by sepsis, catecholamines, electrolytes and volume shifts. Rate control buys time while you fix the trigger.",
 ord:["K > 4.0 and Mg > 2.0 targets","Amiodarone 150 mg IV over 10 min then 1 mg/min × 6 h, 0.5 mg/min × 18 h","Diltiazem 0.25 mg/kg IV (caution with reduced EF or hypotension); esmolol infusion as an alternative","Magnesium 2 g IV for torsades","Atropine 1 mg IV (repeat to 3 mg); epinephrine or dopamine infusion; transcutaneous then transvenous pacing"],
 act:["Unstable tachycardia: synchronized cardioversion (AF 120–200 J biphasic)","Wide complex tachycardia: treat as VT unless proven otherwise","Reduce catecholamine dose where possible; consider switching to vasopressin","Atropine doesn’t work in heart transplant patients or infranodal block"],
 ev:[["Walkey (JAMA 2011)","New-onset AF in sepsis was associated with higher mortality and stroke risk."],["AFFIRM (NEJM 2002)","Rate control was as effective as rhythm control for chronic AF; the ICU often favors rhythm control for unstable patients."],["AHA ACLS update (2020)","Atropine first dose raised to 1 mg; if it fails, transcutaneous pacing or an epinephrine or dopamine infusion."]],
 pr:["Hyperkalemia, hypothermia, β-blocker and calcium-channel blocker toxicity cause bradycardia that pacing alone won’t fix.","Check capture with a pulse or arterial line, not the monitor alone.","In WPW with AF, avoid AV nodal blockers; use procainamide or cardioversion."],
 q:["Which drugs should be avoided in pre-excited AF (WPW) and why?","AV nodal blockers (adenosine, β-blockers, calcium channel blockers, digoxin) because they can speed conduction down the accessory pathway, causing VF."]},

{id:"arrest",u:6,t:"Cardiac arrest & post-cardiac arrest care",r:["O30","M17","O100"],
 bl:"Survival depends on high-quality CPR, early defibrillation for shockable rhythms, and treating reversible causes (Hs and Ts). After ROSC, prevent secondary brain injury: avoid hypotension, hypoxemia, hyperoxia and fever, find the cause (coronary angiography when indicated), and delay neuroprognostication to at least 72 hours.",
 ord:["Post-ROSC: 12-lead ECG, ABG, lactate, electrolytes, troponin, CT head ± CTPA","MAP ≥ 65 (many target ≥ 70–80), SpO₂ 92–98%, normocapnia","Temperature control: prevent fever > 37.7°C for at least 72 h","Continuous EEG if comatose; treat seizures"],
 act:["Emergent cath for STEMI after ROSC; no routine immediate angiography without ST elevation","Hs and Ts: hypoxia, hypovolemia, H⁺, hypo/hyperkalemia, hypothermia; tension pneumothorax, tamponade, toxins, thrombosis (coronary, pulmonary)","Multimodal prognostication ≥ 72 h after ROSC and off sedation: exam, NSE, EEG, SSEPs, imaging","Pulseless and point-of-care ultrasound: check pulses during pauses ≤ 10 s"],
 ev:[["TTM2 (NEJM 2021)","Hypothermia at 33°C vs normothermia with fever avoidance: no difference in mortality or neurological outcome."],["COACT (NEJM 2019) and TOMAHAWK (NEJM 2021)","Immediate angiography didn’t improve survival in patients without ST elevation after ROSC."],["BOX (NEJM 2022)","MAP 63 vs 77 and restrictive vs liberal oxygen targets didn’t change death or severe disability."],["TAME (NEJM 2023)","Mild hypercapnia after arrest didn’t improve neurological outcomes."]],
 pr:["A single exam finding is never enough to prognosticate; wait, stop sedation, and use several modalities.","Myoclonus early after arrest isn’t always poor prognosis; get EEG.","Families need early and repeated updates that clearly separate hope from certainty."],
 q:["After ROSC without ST elevation, does immediate coronary angiography improve outcomes?","No: COACT and TOMAHAWK found no survival benefit; angiography is guided by clinical suspicion."]},

{id:"htn_aorta",u:6,t:"Hypertensive emergencies & acute aortic syndromes",r:["O27","O35"],
 bl:"A hypertensive emergency is severe hypertension with new end-organ injury. Lower BP in a controlled way, usually ≤ 25% in the first hour, except in aortic dissection (fast and low) and stroke (permissive or targeted to thrombolysis). Aortic dissection needs anti-impulse therapy: heart rate first, then blood pressure.",
 ord:["Arterial line","Esmolol or labetalol first for dissection (HR < 60), then nicardipine or clevidipine to SBP 100–120 within 20 min","Nicardipine 5–15 mg/h or clevidipine 1–21 mg/h for most emergencies","CTA chest/abdomen/pelvis for suspected dissection; type A to surgery emergently"],
 act:["Lower MAP ≤ 25% in hour 1, then to 160/100–110 over 2–6 h, then normal over 24–48 h","Exceptions: ischemic stroke (< 185/110 for lytics, < 220/120 otherwise), ICH (SBP ~140), pre-eclampsia (SBP < 160), dissection (SBP 100–120)","Avoid vasodilators before β-blockade in dissection (reflex tachycardia increases shear)","Look for causes: drugs (cocaine, withdrawal), pheochromocytoma, renal artery disease"],
 ev:[["IRAD registry","Untreated type A dissection mortality rises about 1–2% per hour early."],["INTERACT2 (NEJM 2013)","Intensive BP lowering (< 140) in ICH was safe with a trend toward better function."],["ATACH-2 (NEJM 2016)","Lowering SBP to 110–139 vs 140–179 didn’t improve outcomes and caused more renal adverse events."]],
 pr:["Cocaine-related hypertension: benzodiazepines first, then nitrates or a calcium channel blocker; β-blockers are debated because of unopposed α-stimulation.","A pulse differential, neurological deficit or new aortic regurgitation in chest pain: think dissection.","Normal BP in a dissection patient with high-risk features can mean tamponade or hemorrhage."],
 q:["Why give a β-blocker before a vasodilator in aortic dissection?","To prevent reflex tachycardia and lower dP/dt (shear force) on the aortic wall, which a vasodilator alone would increase."]},

{id:"valves",u:6,t:"Valvular emergencies, endocarditis & tamponade",r:["O34","O25"],
 bl:"Acute valve failure is poorly tolerated: acute MR and AR flood the lungs and drop forward flow, and they need surgery. Endocarditis needs prolonged bactericidal therapy and early surgery for heart failure, uncontrolled infection or large vegetations. Tamponade needs drainage.",
 ord:["Echo (TEE for endocarditis and prosthetic valves)","Blood cultures ×3 before antibiotics in suspected endocarditis","Empiric endocarditis: vancomycin + ceftriaxone (native) or + gentamicin/cefepime (prosthetic, per guideline)","Cardiac surgery consult for acute valve failure or complicated endocarditis"],
 act:["Acute MR: afterload reduction (nitroprusside), IABP, urgent surgery","Acute AR: avoid IABP; faster heart rate helps; urgent surgery","Severe AS: maintain preload, sinus rhythm and SVR; avoid vasodilators and tachycardia","Tamponade: small fluid bolus, avoid intubation and positive pressure if possible, urgent pericardiocentesis"],
 ev:[["EASE (NEJM 2012)","Early surgery for left-sided endocarditis with large vegetations reduced embolic events and death."],["2023 Duke-ISCVID criteria","Updated endocarditis diagnostic criteria including PET/CT and new microbiology."],["POET (NEJM 2019)","Oral step-down therapy for left-sided endocarditis in stable patients was non-inferior to IV."]],
 pr:["Intubation in tamponade can trigger arrest by abolishing negative intrathoracic pressure.","IABP is contraindicated in severe aortic regurgitation.","New heart block in endocarditis suggests an aortic root abscess."],
 q:["Why is IABP contraindicated in acute aortic regurgitation?","Diastolic balloon inflation raises aortic diastolic pressure and increases regurgitant flow into the LV."]}
);

L.push(
{id:"acidbase",u:7,t:"Acid–base analysis, step by step",r:["M31","O57"],
 bl:"Use the same sequence every time: pH (acidemia or alkalemia), primary process (PaCO₂ vs HCO₃⁻), expected compensation, anion gap (corrected for albumin), delta-delta for a hidden second disorder, and osmolar gap when the anion gap is unexplained.",
 ord:["ABG or VBG with BMP drawn together","Albumin, lactate, ketones (β-hydroxybutyrate)","Serum osmolality when an anion gap is unexplained or toxic alcohol is possible","Urine electrolytes for a normal-gap acidosis or metabolic alkalosis"],
 act:["Anion gap = Na − (Cl + HCO₃⁻); add 2.5 for each 1 g/dL albumin below 4","Winter’s formula for metabolic acidosis: expected PaCO₂ = 1.5 × HCO₃⁻ + 8 (±2)","Delta ratio = (AG − 12) / (24 − HCO₃⁻): < 1 suggests added normal-gap acidosis; > 2 suggests added metabolic alkalosis","Osmolar gap = measured − (2 Na + glucose/18 + BUN/2.8); > 10 suggests unmeasured osmoles"],
 ev:[["Figge (CCM 1998)","Hypoalbuminemia lowers the anion gap and can mask an elevated-gap acidosis; correct for albumin."],["Stewart physicochemical approach","Strong ion difference and weak acids explain why saline (high Cl⁻) causes acidosis; complementary to the traditional approach."],["Venous vs arterial gases (meta-analyses)","VBG pH and HCO₃⁻ agree closely with ABG; PaCO₂ and PaO₂ don’t."]],
 pr:["Respiratory compensation never brings pH fully to normal; a ‘normal’ pH with abnormal CO₂ and HCO₃⁻ is a mixed disorder.","Expected PaCO₂ higher than Winter’s means a concomitant respiratory acidosis: the patient is tiring.","Always check glucose and ketones when the gap is up; euglycemic DKA happens with SGLT2 inhibitors."],
 q:["pH 7.10, HCO₃⁻ 8, PaCO₂ 32. Is respiratory compensation adequate?","Expected PaCO₂ = 1.5 × 8 + 8 = 20 (±2). A PaCO₂ of 32 is too high, so there is a concomitant respiratory acidosis (impending respiratory failure)."]},

{id:"metacid",u:7,t:"Metabolic acidosis: lactate, ketones, toxic alcohols & bicarbonate",r:["M32","O57","O68"],
 bl:"High anion gap acidosis in the ICU is usually lactate, ketones, renal failure, or toxins (toxic alcohols, salicylate, metformin). Normal-gap acidosis is usually saline or GI bicarbonate loss. Treat the cause. Bicarbonate has a limited role: severe acidemia with AKI, normal-gap losses, and certain poisonings.",
 ord:["Lactate, β-hydroxybutyrate, salicylate, acetaminophen, serum osmolality, creatinine","Toxic alcohol: osmolar gap, ethanol level, specific levels if available; fomepizole 15 mg/kg if suspected","Sodium bicarbonate infusion for pH < 7.20 with AKI (BICAR-ICU regimen) or for bicarbonate-losing states","Nephrology for dialysis in toxic alcohol, metformin, or salicylate poisoning"],
 act:["Type A lactic acidosis = hypoperfusion; type B = drugs (metformin, linezolid, propofol), liver failure, malignancy, thiamine deficiency","Give thiamine to alcohol-use patients with unexplained lactic acidosis","Bicarbonate generates CO₂: increase ventilation to clear it, or it will worsen intracellular acidosis","Recheck ionized calcium: bicarbonate lowers it"],
 ev:[["BICAR-ICU (Lancet 2018)","In severe metabolic acidemia (pH ≤ 7.20), bicarbonate didn’t lower overall mortality; in the AKI subgroup it lowered mortality and RRT need."],["Cooper (Ann Intern Med 1990)","Bicarbonate in lactic acidosis didn’t improve hemodynamics compared with saline."],["EXTRIP guidelines","Recommend dialysis criteria for toxic alcohols, salicylates and metformin-associated lactic acidosis."]],
 pr:["An osmolar gap early, then an anion gap later: toxic alcohols are metabolized to the acids that cause harm.","D-lactate (short gut, propylene glycol) is not measured by routine lactate assays.","Pyroglutamic acidosis (5-oxoprolinemia) appears with chronic acetaminophen use in malnourished patients."],
 q:["Which subgroup benefited from bicarbonate in BICAR-ICU?","Patients with acute kidney injury (AKIN 2–3), who had lower 28-day mortality and needed less dialysis."]},

{id:"metalk",u:7,t:"Metabolic alkalosis",r:["M33","O58"],
 bl:"Metabolic alkalosis in the ICU is usually from diuretics, NG suction, or post-hypercapnia; it is maintained by chloride and volume depletion and hypokalemia. Fix the chloride, potassium and volume. Severe alkalemia impairs oxygen delivery, causes arrhythmias, and blunts respiratory drive, which can delay weaning.",
 ord:["Urine chloride: < 20 mEq/L suggests chloride-responsive (vomiting, diuretics after effect, post-hypercapnia)","KCl and saline repletion for chloride-responsive alkalosis","Acetazolamide 250–500 mg IV/PO if volume overloaded","Consider hydrochloric acid infusion or dialysis only for severe refractory alkalemia (pH > 7.6)"],
 act:["Replace potassium (often large deficits)","Reduce or stop loop diuretics if possible; switch to acetazolamide","Reduce NG suction or add a PPI to lower gastric acid loss","Avoid rapid correction of chronic hypercapnia in COPD on the vent (post-hypercapnic alkalosis)"],
 ev:[["DIABOLO (JAMA 2016)","Acetazolamide in COPD patients on the vent with metabolic alkalosis didn’t significantly shorten ventilation."],["ADVOR (NEJM 2022)","Acetazolamide added to loop diuretics improved decongestion; it also counteracts diuretic alkalosis."]],
 pr:["Chloride-resistant alkalosis (urine Cl > 40) with hypertension: think mineralocorticoid excess.","Large-volume blood transfusion causes alkalosis as citrate is metabolized to bicarbonate.","An alkalotic patient may hypoventilate and fail SBTs; correct before blaming the lungs."],
 q:["What is the role of urine chloride in metabolic alkalosis?","It separates chloride-responsive (urine Cl < 20, e.g., vomiting, prior diuretics) from chloride-resistant causes (urine Cl > 40, e.g., mineralocorticoid excess, ongoing diuretics)."]},

{id:"aki",u:7,t:"Acute kidney injury",r:["M34","O55"],
 bl:"AKI is common, often multifactorial (sepsis, hypotension, nephrotoxins, contrast, obstruction), and associated with mortality. Rule out obstruction and reversible prerenal causes, stop nephrotoxins, dose drugs for the kidney function you have, and manage complications until it recovers.",
 ord:["KDIGO criteria: creatinine rise ≥ 0.3 mg/dL in 48 h, or ≥ 1.5× baseline in 7 days, or urine output < 0.5 mL/kg/h for 6 h","Urinalysis with microscopy, urine sodium and creatinine (FENa), urine protein","Renal ultrasound (obstruction)","Bladder scan; Foley if retention","Pharmacy review of all doses"],
 act:["Stop or avoid nephrotoxins: NSAIDs, aminoglycosides, vancomycin + piperacillin-tazobactam combination (where possible), contrast unless necessary","Keep MAP ≥ 65 (higher if chronic hypertension); avoid fluid overload","Muddy brown casts = ATN; RBC casts = glomerulonephritis; WBC casts = interstitial nephritis or pyelonephritis","Check CK in trauma, seizures, immobility (rhabdomyolysis)"],
 ev:[["SEPSISPAM (NEJM 2014)","MAP 80–85 vs 65–70: no mortality difference; less RRT in chronic hypertension with higher target but more AF."],["Kidney Disease: Improving Global Outcomes (KDIGO 2012)","Standard staging; urine output criteria detect AKI earlier than creatinine."],["Contrast AKI (McDonald, Radiology 2014 and others)","Propensity-matched studies found little or no excess AKI attributable to IV contrast; don’t withhold indicated contrast scans."]],
 pr:["FENa < 1% suggests prerenal, but is unreliable on diuretics (use FEUrea < 35%).","Creatinine lags injury by 24–48 h, and falls with fluid dilution; trend urine output.","Rhabdomyolysis: aim for urine output 200–300 mL/h with crystalloid; bicarbonate hasn’t shown benefit."],
 q:["Which urine study helps when the patient is on diuretics and FENa is unreliable?","Fractional excretion of urea; < 35% suggests a prerenal state."]},

{id:"rrt",u:7,t:"Renal replacement therapy",r:["O56"],
 bl:"Start RRT for refractory emergencies: hyperkalemia, acidosis, volume overload, uremic complications, or dialyzable toxins (AEIOU). Starting early without an urgent indication doesn’t help. CRRT and intermittent dialysis give similar survival; CRRT suits unstable patients.",
 ord:["Dialysis catheter (right IJ preferred, then femoral; avoid subclavian)","CRRT dose 20–25 mL/kg/h delivered effluent","Regional citrate anticoagulation where available; monitor ionized calcium and total/ionized ratio","Daily review of drug doses for CRRT clearance"],
 act:["AEIOU: Acidosis (refractory), Electrolytes (K), Intoxication (toxic alcohols, lithium, salicylates, metformin), Overload (diuretic-resistant), Uremia (pericarditis, encephalopathy, bleeding)","Ultrafiltration goal: set a daily net removal target","Hypotension during IHD: cool dialysate, slower UF, sodium modelling, or switch to CRRT","Re-assess daily for renal recovery (urine output, creatinine trends)"],
 ev:[["STARRT-AKI (NEJM 2020)","Accelerated RRT didn’t lower 90-day mortality and caused more adverse events and RRT dependence."],["AKIKI (NEJM 2016) and AKIKI2 (Lancet 2021)","Delaying RRT until indicated was safe; extending the delay further beyond established criteria was harmful."],["RENAL (NEJM 2009) and ATN (NEJM 2008)","Higher RRT intensity didn’t improve survival versus standard dose."],["RICH (JAMA 2020)","Regional citrate prolonged filter life with fewer bleeding complications versus heparin; no mortality difference."]],
 pr:["Prescribed and delivered CRRT doses differ; prescribe ~25–30 to deliver ~20–25 mL/kg/h.","Citrate accumulation (rising total/ionized calcium ratio > 2.5, metabolic acidosis) occurs in liver failure.","Antibiotics are often underdosed on CRRT."],
 q:["What do AKIKI and STARRT-AKI suggest about timing of RRT?","No benefit to early or accelerated initiation in the absence of urgent indications; a watchful-waiting strategy avoids RRT in many patients."]},

{id:"sodium",u:7,t:"Sodium & tonicity disorders",r:["M35","O58","O69"],
 bl:"Sodium disorders are water problems. Hyponatremia with severe symptoms (seizures, coma) needs hypertonic saline now; chronic hyponatremia must be corrected slowly to avoid osmotic demyelination. Hypernatremia usually reflects free water loss without access to water, and needs measured free water replacement.",
 ord:["Serum osmolality, urine osmolality and urine sodium","3% saline 100–150 mL IV over 10–20 min for severe symptoms (repeat up to 3 times)","Sodium every 2–4 h during active correction","Desmopressin ‘clamp’ (1–2 mcg IV q6–8h) with 3% saline if overcorrection is likely","Free water deficit = TBW × (Na/140 − 1)"],
 act:["Hyponatremia correction goal: 4–6 mEq/L in first 24 h; limit 8 mEq/L/24 h (or 10 in low-risk patients)","High-risk for demyelination: Na ≤ 105, alcohol use, malnutrition, hypokalemia, liver disease","Re-lower sodium with D5W ± desmopressin if overcorrected","Hypernatremia: correct by ~10–12 mEq/L/day for chronic; faster if acute (hours)"],
 ev:[["SALSA (JAMA Intern Med 2021)","Rapid intermittent bolus 3% saline was as effective as slow continuous infusion, with similar overcorrection and less need for re-lowering."],["Sterns (NEJM 2015 review)","Osmotic demyelination risk concentrated in corrections > 8–10 mEq/L/day in high-risk patients."],["Chauhan (CJASN 2019)","Faster correction of hypernatremia was not associated with cerebral edema or harm in adults."]],
 pr:["Hypokalemia correction raises sodium (KCl is effectively hypertonic); account for it.","A large water diuresis once the cause is removed (e.g., hypovolemia, thiazide, ADH drugs) can rapidly overcorrect.","Think of SIADH only after excluding hypovolemia, adrenal insufficiency and hypothyroidism."],
 q:["Why can potassium repletion worsen overcorrection of hyponatremia?","Potassium exchanges with intracellular sodium and adds effective osmoles, raising serum sodium along with any water diuresis."]},

{id:"k_mg",u:7,t:"Potassium & magnesium",r:["M36","M37"],
 bl:"Potassium disorders kill through arrhythmias. Hyperkalemia with ECG changes is an emergency: stabilize the membrane with calcium, shift potassium into cells, then remove it. Hypokalemia and hypomagnesemia travel together, and potassium won’t correct until magnesium does.",
 ord:["Calcium gluconate 3 g (or calcium chloride 1 g via central line) for ECG changes","Regular insulin 10 units IV (5 units if renal failure) + dextrose 25 g; fingerstick glucose hourly × 4–6","Albuterol 10–20 mg nebulized","Potassium binder (sodium zirconium cyclosilicate 10 g TID or patiromer)","Magnesium sulfate 2 g IV over 1–2 h for Mg < 2 (cardiac patients) or symptomatic"],
 act:["Remove K: loop diuretic if making urine, binders, dialysis if refractory or renal failure","Bicarbonate shifts K mainly in metabolic acidosis; it’s a weak agent alone","Hypokalemia: 10 mEq KCl IV raises K by ~0.1; give ≤ 10–20 mEq/h peripherally (higher via central line with monitoring)","Look for pseudohyperkalemia (hemolysis, very high WBC or platelets)"],
 ev:[["Harel (Am J Med 2013)","Sodium polystyrene sulfonate was linked to serious GI injury including necrosis; newer binders (SZC, patiromer) act within hours."],["Apel (Clin Kidney J 2014)","Hypoglycemia followed insulin treatment for hyperkalemia in about 13% of dialysis patients; reduce the dose and monitor glucose."],["Tzivoni (Circulation 1988)","IV magnesium terminated torsades de pointes regardless of the serum magnesium level."]],
 pr:["Calcium works in minutes and lasts ~30–60 min; repeat if ECG changes persist.","Peaked T waves aren’t reliable; any ECG change with K > 6.5 is an emergency.","Digoxin toxicity with hyperkalemia: give digoxin Fab; calcium is controversial but probably safe."],
 q:["Which treatments for hyperkalemia actually remove potassium from the body?","Loop diuretics (with urine output), GI binders, and dialysis; calcium stabilizes and insulin/albuterol/bicarbonate only shift K into cells."]},

{id:"ca_phos",u:7,t:"Calcium & phosphate",r:["M38","O58"],
 bl:"Measure ionized calcium in the ICU; total calcium misleads with low albumin. Hypocalcemia matters in transfusion, sepsis and pancreatitis; hypercalcemia is mostly malignancy or hyperparathyroidism and is treated with volume, calcitonin and bisphosphonates. Refeeding syndrome drops phosphate, potassium and magnesium.",
 ord:["Ionized calcium (whole blood gas)","Calcium gluconate 1–2 g IV for symptomatic or iCa < 1.0 mmol/L","Hypercalcemia: isotonic saline (200–300 mL/h), calcitonin 4 units/kg q12h × 48 h, zoledronic acid 4 mg IV (or denosumab if renal failure)","Phosphate replacement (sodium or potassium phosphate) for < 1.0 mg/dL or symptomatic"],
 act:["Refeeding: start nutrition slowly in at-risk patients (malnourished, alcohol use, prolonged NPO), check phos, K, Mg daily","Hypophosphatemia causes weakness (diaphragm), hemolysis, failure to wean","Hypercalcemia > 14 mg/dL with neurologic symptoms or renal failure may need dialysis","Avoid giving calcium with bicarbonate or phosphate in the same line (precipitates)"],
 ev:[["Doig refeeding trial (Lancet Respir Med 2015)","Caloric restriction in refeeding hypophosphatemia improved survival."],["Zivin (Am J Kidney Dis 2001)","Total calcium corrected for albumin poorly predicts ionized calcium in ICU patients."],["Bisphosphonates in malignancy hypercalcemia (multiple RCTs)","Zoledronic acid is more effective than pamidronate; calcitonin works within hours but tachyphylaxis develops."]],
 pr:["Low magnesium causes refractory hypocalcemia via impaired PTH; replete Mg first.","Calcium chloride has 3× more elemental calcium than gluconate; use a central line.","Hyperphosphatemia in tumor lysis: avoid calcium unless symptomatic (calcium-phosphate deposition)."],
 q:["Why give magnesium to a patient with refractory hypocalcemia?","Hypomagnesemia impairs PTH secretion and causes PTH resistance; calcium won’t stay up until magnesium is repleted."]}
);

L.push(
{id:"prophylaxis",u:8,t:"Stress ulcer & VTE prophylaxis",r:["M5","M6"],
 bl:"Prophylaxis is given to patients at real risk, not everyone. Stress ulcer prophylaxis is for ventilated patients and those with coagulopathy, shock or prior GI bleeding. VTE prophylaxis is for nearly every ICU patient unless actively bleeding, and pharmacologic beats mechanical.",
 ord:["Pantoprazole 40 mg IV/PO daily for ventilated patients or those with coagulopathy, shock or chronic liver disease","Enoxaparin 40 mg SC daily (30 mg BID in trauma; adjust for obesity and CrCl < 30) or heparin 5,000 units SC q8–12h","Sequential compression devices when anticoagulation is contraindicated","Platelet count every few days on heparin (HIT surveillance)"],
 act:["Stop stress ulcer prophylaxis when the risk factors resolve (extubated, eating)","Don’t hold VTE prophylaxis for minor procedures without a reason","Anti-Xa monitoring for extremes of weight or renal dysfunction on LMWH","Use mechanical prophylaxis only when drugs are contraindicated (no added benefit when combined)"],
 ev:[["REVISE (NEJM 2024)","Pantoprazole in ventilated patients reduced clinically important upper GI bleeding (1.0% vs 3.5%) without changing mortality, pneumonia or C. difficile."],["SUP-ICU (NEJM 2018)","Pantoprazole in at-risk ICU patients didn’t change 90-day mortality; fewer bleeds."],["PREVENT (NEJM 2019)","Adding intermittent pneumatic compression to pharmacologic prophylaxis didn’t reduce proximal DVT."],["PROTECT (NEJM 2011)","Dalteparin and UFH had similar DVT rates; fewer PEs and less HIT with dalteparin."]],
 pr:["Enteral feeding itself lowers stress ulcer risk.","4T score helps estimate pretest probability of HIT before ordering antibody tests.","Patients with TBI or spine injury can usually start chemical prophylaxis within 24–72 h of stable imaging."],
 q:["What did REVISE show about PPI prophylaxis in ventilated patients?","Fewer clinically important upper GI bleeds with pantoprazole, without increases in pneumonia, C. difficile or mortality."]},

{id:"gibleed",u:8,t:"Gastrointestinal bleeding",r:["O52","M18"],
 bl:"Resuscitate, risk-stratify, and get endoscopy within 24 h for upper bleeding (within 12 h for varices). Transfuse to Hb 7 (8 with active cardiac ischemia). Suspected variceal bleeding gets octreotide, ceftriaxone and early endoscopy, with TIPS for high-risk patients.",
 ord:["Two large-bore IVs; type and crossmatch; CBC, INR, BMP, BUN","IV PPI (e.g., pantoprazole 80 mg then 40 mg BID) before endoscopy for suspected upper bleed","Varices: octreotide 50 mcg IV bolus then 50 mcg/h; ceftriaxone 1 g daily × 7 days","Erythromycin 250 mg IV 30–90 min before endoscopy to clear the stomach","Glasgow-Blatchford score for risk"],
 act:["Protect the airway in massive hematemesis or encephalopathy before endoscopy","Restrictive transfusion (Hb 7) and avoid over-transfusion in varices (raises portal pressure)","Reverse anticoagulation when bleeding is life-threatening; don’t give FFP solely for INR in cirrhosis","Massive bleeding not controlled: balloon tamponade as a bridge, IR embolization, TIPS, or surgery"],
 ev:[["Villanueva (NEJM 2013)","Restrictive transfusion (Hb < 7) in upper GI bleeding improved survival, especially in Child A/B cirrhosis."],["HALT-IT (Lancet 2020)","Tranexamic acid didn’t reduce death from GI bleeding and increased venous thromboembolism."],["Lau (NEJM 2020)","Endoscopy within 6 h was no better than 6–24 h for high-risk upper GI bleeding."],["García-Pagán (NEJM 2010)","Pre-emptive TIPS within 72 h in high-risk variceal bleeding improved survival."]],
 pr:["BUN/creatinine ratio > 30 suggests an upper source.","Hematochezia with hemodynamic instability may be a brisk upper bleed; consider EGD first.","Lower GI bleeding: CT angiography helps localize active bleeding before IR."],
 q:["Which adjuncts reduce mortality in cirrhotic variceal bleeding?","Prophylactic antibiotics (e.g., ceftriaxone), vasoactive drugs (octreotide or terlipressin), restrictive transfusion, early endoscopic band ligation, and pre-emptive TIPS in high-risk patients."]},

{id:"pancreatitis",u:8,t:"Acute pancreatitis",r:["O53","M39"],
 bl:"Severe pancreatitis is a sterile inflammatory disease that behaves like sepsis. Use moderate rather than aggressive fluids, feed the gut early, don’t give prophylactic antibiotics, and delay any intervention on necrosis until it walls off, preferring a minimally invasive step-up approach.",
 ord:["Lipase, triglycerides, calcium, LFTs; RUQ ultrasound for gallstones","Lactated Ringer’s: 10 mL/kg bolus if hypovolemic, then ~1.5 mL/kg/h, reassessed often","Early enteral nutrition (oral or NG/NJ) within 24–72 h","CT with contrast after 72 h if not improving or complications suspected"],
 act:["ERCP within 24 h only for cholangitis; not routinely for gallstone pancreatitis without cholangitis","Antibiotics only for infection (cholangitis, infected necrosis, other source)","Measure bladder pressure if abdomen is tense (abdominal compartment syndrome)","Hypertriglyceridemia (TG > 1000): insulin infusion; consider plasmapheresis if severe"],
 ev:[["WATERFALL (NEJM 2022)","Aggressive fluid resuscitation caused more fluid overload without improving outcomes; trial stopped for harm."],["PANTER (NEJM 2010)","Step-up approach (drainage, then minimally invasive necrosectomy) reduced major complications or death vs open necrosectomy."],["POINTER (NEJM 2021)","Immediate drainage of infected necrosis wasn’t better than postponed drainage until walled off."],["PYTHON (NEJM 2014)","Early NG feeding wasn’t better than an oral diet started at 72 h on demand."]],
 pr:["Lipase level doesn’t correlate with severity; organ failure > 48 h defines severe disease.","Infected necrosis: gas in the collection or clinical deterioration after the first week.","Pancreatitis can cause ARDS, AKI, hypocalcemia and splanchnic vein thrombosis."],
 q:["What did WATERFALL show about fluid resuscitation in acute pancreatitis?","Aggressive fluids increased fluid overload without clinical benefit; moderate, goal-directed fluid is preferred."]},

{id:"alf",u:8,t:"Acute liver failure",r:["O54","M39"],
 bl:"Acute liver failure is coagulopathy plus encephalopathy in a patient without chronic liver disease, often acetaminophen in the US. Start N-acetylcysteine for any cause, refer early for transplant, and protect the brain: cerebral edema from ammonia is the major cause of death.",
 ord:["Acetaminophen level, toxicology, viral hepatitis panels, autoimmune markers, ceruloplasmin (if young), pregnancy test","N-acetylcysteine IV (all etiologies, especially acetaminophen)","Ammonia (arterial), lactate, glucose q2–4h, phosphate","Early transplant center referral (King’s College criteria)"],
 act:["Grade 3–4 encephalopathy: intubate for airway protection","Target Na 145–155 with hypertonic saline in high-risk patients (ammonia > 150)","CRRT to lower ammonia in high-grade encephalopathy","Correct coagulopathy only for bleeding or procedures (INR is a prognostic marker)"],
 ev:[["Lee (Gastroenterology 2009)","IV NAC improved transplant-free survival in non-acetaminophen ALF with early (grade I–II) coma."],["King’s College criteria (O’Grady 1989)","Arterial pH < 7.3 after resuscitation in acetaminophen ALF (or INR > 6.5, creatinine > 3.4, and grade 3–4 encephalopathy) predicts death without transplant."],["Bernal (Hepatology 2007)","Arterial ammonia > 200 µmol/L predicted cerebral herniation."]],
 pr:["Hypoglycemia is common; check glucose often.","Lactulose is not helpful and can distend bowel in ALF (unlike chronic liver disease).","Mushroom poisoning: penicillin or silibinin; Wilson’s: plasma exchange as bridge."],
 q:["What two sequelae of acute liver failure most often cause death?","Cerebral edema with herniation (driven by ammonia) and sepsis/multi-organ failure."]},

{id:"cirrhosis",u:8,t:"Cirrhosis in the ICU",r:["O54","O116"],
 bl:"Decompensated cirrhosis brings infections, encephalopathy, kidney injury and bleeding together. Look for infection every time (paracentesis), use albumin for SBP and HRS, terlipressin or norepinephrine for HRS-AKI, and lactulose ± rifaximin for encephalopathy. Discuss goals early when transplant isn’t possible.",
 ord:["Diagnostic paracentesis (PMN ≥ 250 = SBP) in every admitted cirrhotic with ascites","SBP: ceftriaxone 2 g daily + albumin 1.5 g/kg day 1 and 1 g/kg day 3","HRS-AKI: stop diuretics, albumin 1 g/kg (max 100 g) × 2 days, then terlipressin or norepinephrine + albumin","Lactulose to 2–3 soft stools/day; rifaximin 550 mg BID"],
 act:["Large-volume paracentesis (> 5 L): albumin 6–8 g per liter removed","Avoid nephrotoxins and NSAIDs; hold β-blockers in refractory ascites with hypotension or AKI","Precipitants of encephalopathy: infection, GI bleed, hypokalemia, sedatives, constipation","Bleeding risk is driven by portal pressure, not INR; correct only for active bleeding"],
 ev:[["Sort (NEJM 1999)","Albumin with antibiotics in SBP reduced renal failure and mortality."],["CONFIRM (NEJM 2021)","Terlipressin increased HRS reversal but caused more respiratory failure."],["ATTIRE (NEJM 2021)","Targeted albumin to keep albumin ≥ 3 g/dL didn’t reduce infection, renal dysfunction or death."]],
 pr:["MELD and CLIF-C ACLF scores estimate prognosis; organ failures count more than lab values.","Albumin causes pulmonary edema in some; watch oxygenation.","A falling sodium is a sign of worsening portal hypertension."],
 q:["What is the albumin dosing schedule in SBP?","1.5 g/kg on day 1 and 1 g/kg on day 3, with antibiotics."]},

{id:"nutrition",u:8,t:"Nutrition in the critically ill",r:["M47","M48","M49","O51"],
 bl:"Start enteral nutrition within 24–48 h in patients who can’t eat. Early full calories don’t help; moderate calories with adequate (not excessive) protein is reasonable. Parenteral nutrition is a second-line option after a week if EN can’t meet needs, or sooner in malnourished patients.",
 ord:["Enteral feeds at trophic or moderate rate within 24–48 h, advanced over the first week","Target ~20–25 kcal/kg/day and protein 1.2–2.0 g/kg/day after the first days","Phosphate, potassium and magnesium daily in the first 3 days (refeeding)","Parenteral nutrition only if EN fails at day 5–7 (earlier if severely malnourished)"],
 act:["Don’t check gastric residuals routinely; manage intolerance (vomiting, distension) with prokinetics (erythromycin, metoclopramide) or post-pyloric feeding","Patients on stable or decreasing low-dose vasopressors can be fed enterally","Count propofol calories (1.1 kcal/mL)","Thiamine before feeding in at-risk patients"],
 ev:[["EDEN (JAMA 2012)","Trophic vs full feeding in ALI: no difference in ventilator-free days or mortality."],["NUTRIREA-3 (Lancet Respir Med 2023)","Low calorie and protein feeding in shock led to faster recovery and fewer GI complications."],["EFFORT Protein (Lancet 2023)","High protein (≥ 2.2 g/kg) didn’t improve recovery and may harm patients with AKI."],["EPaNIC (NEJM 2011)","Late (day 8) parenteral nutrition reduced infections and ICU stay vs early PN."]],
 pr:["Hyperglycemia, hypertriglyceridemia (propofol) and refeeding are the most common feeding complications.","Indirect calorimetry gives the most accurate energy target if available.","Diarrhea on tube feeds: check for C. difficile and sorbitol-containing medications before stopping feeds."],
 q:["Why not routinely check gastric residual volumes?","Reignier (JAMA 2013) showed no increase in VAP without monitoring residuals, while monitoring led to underfeeding."]}
);

L.push(
{id:"sedation",u:9,t:"Analgesia & sedation",r:["M51","O120"],
 bl:"Treat pain first (analgosedation), then add the least sedation needed for a calm, cooperative patient: usually RASS −2 to 0. Prefer propofol or dexmedetomidine over benzodiazepines. Daily awakening trials and sedation protocols shorten ventilation and ICU stay.",
 ord:["Fentanyl 25–100 mcg/h (or hydromorphone) titrated to a pain scale (CPOT or BPS)","Propofol 5–50 mcg/kg/min, or dexmedetomidine 0.2–1.5 mcg/kg/h","RASS goal documented (e.g., −1 to 0)","Daily SAT unless contraindicated (paralysis, status epilepticus, raised ICP, severe ARDS with dyssynchrony)","Triglycerides and CK every 2–3 days on propofol"],
 act:["Multimodal analgesia: acetaminophen, regional blocks, ketamine (low dose) to spare opioids","Deep sedation only for specific indications (paralysis, refractory hypoxemia, ICP crises, status epilepticus)","Watch propofol infusion syndrome: acidosis, rhabdomyolysis, hypertriglyceridemia, arrhythmias, at high doses > 48 h","Dexmedetomidine causes bradycardia and hypotension and doesn’t produce deep sedation"],
 ev:[["Kress (NEJM 2000)","Daily interruption of sedation shortened ventilation by ~2 days and ICU stay."],["SPICE III (NEJM 2019)","Early dexmedetomidine as primary sedative didn’t reduce 90-day mortality; more bradycardia and hypotension."],["MENDS2 (NEJM 2021)","Dexmedetomidine vs propofol in septic ventilated patients: no difference in brain dysfunction-free days or mortality."],["PADIS guideline (CCM 2018)","Light sedation; propofol or dexmedetomidine over benzodiazepines; assess pain, agitation, delirium and sleep routinely."]],
 pr:["Agitation is a symptom: check for pain, hypoxemia, delirium, full bladder, withdrawal, dyssynchrony before sedating.","Benzodiazepines are still appropriate for alcohol withdrawal and seizures.","Long-term opioid infusions cause tolerance and withdrawal; taper and plan an enteral transition."],
 q:["What sedation depth is usually targeted in ventilated patients?","Light sedation, RASS −2 to 0 (calm and arousable), unless a specific indication requires deeper sedation."]},

{id:"delirium",u:9,t:"Delirium",r:["O65"],
 bl:"Delirium is acute brain dysfunction affecting up to 70% of ventilated patients, linked to mortality and long-term cognitive impairment. Screen twice daily (CAM-ICU or ICDSC), find and fix causes, and rely on non-drug strategies. Antipsychotics don’t prevent or shorten delirium.",
 ord:["CAM-ICU every shift","Medication review: stop or reduce benzodiazepines, anticholinergics, steroids where possible","Sleep protocol: lights, noise, clustered care at night, melatonin","Early mobility and physical therapy"],
 act:["Hunt causes: infection, hypoxemia, metabolic derangements, withdrawal, drugs, urinary retention, constipation, pain","Glasses, hearing aids, clocks, family visits, reorientation","Use dexmedetomidine for agitated delirium preventing extubation","Short-term antipsychotic only for dangerous agitation; stop when resolved"],
 ev:[["MIND-USA (NEJM 2018)","Haloperidol or ziprasidone didn’t shorten delirium or change mortality."],["AID-ICU (NEJM 2022)","Haloperidol didn’t increase days alive and out of hospital."],["DahLIA (JAMA 2016)","Dexmedetomidine increased ventilator-free hours in agitated delirium versus placebo."],["Pandharipande BRAIN-ICU (NEJM 2013)","Longer delirium duration was associated with worse long-term cognitive function."]],
 pr:["Hypoactive delirium is more common and more often missed than the agitated type.","Delirium on admission may be the first sign of sepsis.","Alcohol withdrawal: symptom-triggered benzodiazepines or phenobarbital; avoid treating as simple delirium."],
 q:["What did MIND-USA show about antipsychotics in ICU delirium?","Haloperidol and ziprasidone didn’t reduce delirium duration or improve survival compared with placebo."]},

{id:"coma",u:9,t:"Coma & disorders of consciousness",r:["M44","O59"],
 bl:"Coma is a medical emergency with a short list of rapidly treatable causes: hypoglycemia, opioids, Wernicke’s, hypoxia, hypotension, seizures, and herniation. Secure the airway, treat what you can, and examine systematically: brainstem reflexes, motor responses, and pattern of breathing.",
 ord:["Fingerstick glucose immediately; thiamine 500 mg IV before glucose in at-risk patients","Naloxone 0.04–0.4 mg IV if opioid suspected","CT head; CTA if basilar occlusion possible","Labs: BMP, Ca, Mg, LFTs, ammonia, TSH, tox screen, ABG; LP if infection suspected","EEG to look for nonconvulsive status"],
 act:["GCS and FOUR score (adds brainstem and breathing)","Pupils: pinpoint (opioid, pontine), fixed dilated (herniation, anticholinergic), unequal (CN III compression)","Signs of herniation: give hypertonic saline or mannitol, elevate head, brief hyperventilation as a bridge, neurosurgery","Avoid overtreating early prognostication; reversible causes can look terrible"],
 ev:[["Towne (Neurology 2000)","Nonconvulsive status epilepticus was found in 8% of comatose ICU patients without clinical seizures."],["Wijdicks FOUR score (Ann Neurol 2005)","Adds brainstem and respiration assessment and works in intubated patients."],["Basilar artery thrombectomy (ATTENTION, BAOCHE, NEJM 2022)","Thrombectomy improved function in basilar artery occlusion; it can present as coma."]],
 pr:["Eyes deviated away from the hemiparesis: cortical lesion (or seizure toward); toward the hemiparesis: brainstem.","Locked-in syndrome can look like coma; ask for vertical eye movements.","Cushing response (hypertension, bradycardia, irregular breathing) is a late herniation sign."],
 q:["What are the first two bedside treatments for undifferentiated coma?","Check glucose and correct hypoglycemia (with thiamine), and give naloxone if opioid toxicity is possible."]},

{id:"status",u:9,t:"Status epilepticus",r:["O61","M45"],
 bl:"Status epilepticus is ≥ 5 minutes of continuous seizure or repeated seizures without recovery. Time is brain: give an adequate benzodiazepine dose fast, then a second-line agent, and move to anesthetic infusions with continuous EEG for refractory status.",
 ord:["Lorazepam 4 mg IV (0.1 mg/kg), repeat once; or midazolam 10 mg IM; or diazepam","Second line (choose one): levetiracetam 60 mg/kg (max 4.5 g), fosphenytoin 20 mg PE/kg, or valproate 40 mg/kg","Refractory: intubate and start midazolam or propofol infusion (± ketamine)","Continuous EEG; glucose, electrolytes, tox screen, AED levels, CT head ± LP"],
 act:["Don’t underdose benzodiazepines; under-dosing is the most common error","Thiamine with glucose in at-risk patients","Look for and treat causes: AED withdrawal, alcohol, infection, structural lesion, autoimmune encephalitis, toxins (isoniazid → pyridoxine)","After convulsions stop, unexplained coma requires EEG for nonconvulsive status"],
 ev:[["RAMPART (NEJM 2012)","IM midazolam was at least as effective as IV lorazepam prehospital."],["ESETT (NEJM 2019)","Levetiracetam, fosphenytoin and valproate were equally effective (~ 50% response) for benzodiazepine-refractory status."],["Alldredge (NEJM 2001)","Prehospital benzodiazepines were superior to placebo."]],
 pr:["Valproate is avoided in pregnancy, liver disease, mitochondrial disorders.","Fosphenytoin causes hypotension and arrhythmias; give it with monitoring.","Super-refractory status (≥ 24 h on anesthetics): consider ketamine, immunotherapy, and specialist input."],
 q:["What was the response rate to each second-line agent in ESETT?","About 50% for levetiracetam, fosphenytoin and valproate, without significant differences."]},

{id:"stroke",u:9,t:"Acute ischemic stroke",r:["O62","M46"],
 bl:"For ischemic stroke, reperfusion is everything: thrombolysis within 4.5 h for eligible patients and thrombectomy for large-vessel occlusion up to 24 h with favorable imaging. ICU care focuses on blood pressure targets, swallow safety, glucose, temperature and watching for edema and hemorrhagic transformation.",
 ord:["CT head and CTA head/neck (± perfusion)","Alteplase 0.9 mg/kg (max 90 mg) or tenecteplase 0.25 mg/kg (max 25 mg) if eligible","BP < 185/110 before lysis and < 180/105 for 24 h after","Neuro checks q15min × 2 h after lysis, then q30min × 6 h, then hourly","Glucose 140–180, normothermia, swallow screen before oral intake"],
 act:["Malignant MCA infarction: early neurosurgery consult for hemicraniectomy (under 60 years has strongest evidence)","Post-lysis bleed: stop the infusion, CT, give cryoprecipitate and TXA","Permissive hypertension (< 220/120) if no lysis","Antiplatelet within 24–48 h if no lysis (24 h after lysis, post-CT)"],
 ev:[["DAWN (NEJM 2018) and DEFUSE 3 (NEJM 2018)","Thrombectomy up to 24 h with favorable imaging improved functional outcomes."],["Large core trials (SELECT2, ANGEL-ASPECT, NEJM 2023)","Thrombectomy benefited patients with large ischemic cores too."],["Pooled DECIMAL/DESTINY/HAMLET (Lancet Neurol 2007)","Decompressive hemicraniectomy within 48 h in malignant MCA infarction reduced mortality and improved function."]],
 pr:["Tenecteplase is given as a single bolus, which makes transfers easier.","Posterior circulation strokes can present with vertigo and vomiting; examine gait and eye movements.","Swallowing dysfunction is common; aspiration pneumonia is a major complication."],
 q:["What BP targets apply before and after thrombolysis?","Below 185/110 before lysis and below 180/105 for the following 24 hours."]},

{id:"ich_sah",u:9,t:"Intracerebral & subarachnoid hemorrhage",r:["O62","O75"],
 bl:"In ICH, stop the bleed growing: reverse anticoagulation fast, lower SBP to ~140, normalize glucose and temperature, and watch for hydrocephalus. In aneurysmal SAH, secure the aneurysm early, give nimodipine, keep euvolemic, and watch for delayed cerebral ischemia from days 3 to 14.",
 ord:["CT head; CTA if a vascular cause is possible","Warfarin: 4-factor PCC + vitamin K 10 mg IV; factor Xa inhibitor: andexanet or 4-factor PCC; dabigatran: idarucizumab","SBP target ~140, avoiding drops below 130 (ICH); < 160 before aneurysm securing (SAH)","SAH: nimodipine 60 mg PO q4h × 21 days; EVD for hydrocephalus","Sodium twice daily in SAH"],
 act:["Don’t transfuse platelets for antiplatelet-associated ICH unless going to surgery","Cerebellar hemorrhage > 3 cm or brainstem compression: surgical evacuation","Delayed cerebral ischemia: new deficit → induced hypertension, transcranial Doppler, angiography for intra-arterial therapy","SAH hyponatremia: often cerebral salt wasting; don’t fluid-restrict (use saline, fludrocortisone)"],
 ev:[["INTERACT3 (Lancet 2023)","A care bundle (BP, glucose, fever, anticoagulation reversal) improved functional outcomes after ICH."],["ANNEXA-I (NEJM 2024)","Andexanet improved hemostatic efficacy versus usual care in factor Xa ICH, with more thrombotic events."],["PATCH (Lancet 2016)","Platelet transfusion in antiplatelet-associated ICH worsened outcomes."],["Pickard nimodipine (BMJ 1989)","Oral nimodipine reduced cerebral infarction and poor outcomes after SAH."]],
 pr:["Thunderclap headache with normal CT after 6 h still needs LP or CTA.","Nimodipine can cause hypotension; give smaller, more frequent doses rather than stopping it.","ICH score estimates mortality; don’t use it alone to limit care."],
 q:["Why is fluid restriction avoided in SAH hyponatremia?","It is usually cerebral salt wasting (volume depletion), and hypovolemia raises the risk of delayed cerebral ischemia."]},

{id:"tbi",u:9,t:"Traumatic brain injury & intracranial pressure",r:["O60","O64","O78"],
 bl:"Secondary brain injury from hypotension, hypoxemia, fever, seizures and raised ICP drives outcome after TBI. Avoid hypotension and hypoxemia, treat ICP > 22 mmHg with a tiered approach, and keep CPP around 60–70 mmHg.",
 ord:["CT head; neurosurgery consult","SBP ≥ 100 (age 50–69) or ≥ 110 (15–49 or > 70); SpO₂ > 94%","Seizure prophylaxis for 7 days (levetiracetam or phenytoin) in severe TBI","Hypertonic saline (3% or 23.4% bolus) or mannitol 1 g/kg for raised ICP","Tranexamic acid within 3 h for mild-moderate TBI (CRASH-3)"],
 act:["Tier 0–1: HOB 30°, neck neutral, sedation, analgesia, normothermia, normocapnia (PaCO₂ 35–40), osmotherapy, CSF drainage","Tier 2: neuromuscular blockade, mild hyperventilation (PaCO₂ 32–35), MAP challenge","Tier 3: barbiturate coma, decompressive craniectomy, mild hypothermia","Treat coagulopathy; platelets > 75–100 if surgery planned"],
 ev:[["CRASH-3 (Lancet 2019)","TXA within 3 h reduced head-injury death in mild–moderate TBI."],["RESCUEicp (NEJM 2016)","Decompressive craniectomy for refractory ICP lowered mortality but increased vegetative state and severe disability."],["DECRA (NEJM 2011)","Early bifrontal craniectomy for moderate ICP elevation worsened functional outcomes."],["Eurotherm3235 (NEJM 2015)","Therapeutic hypothermia for raised ICP worsened outcomes."]],
 pr:["One episode of hypotension doubles mortality after severe TBI.","Avoid hypotonic fluids and albumin; use saline or balanced solutions cautiously.","Prolonged hyperventilation worsens ischemia; use it only as a short bridge to definitive therapy."],
 q:["What did RESCUEicp show about decompressive craniectomy?","It reduced mortality in refractory raised ICP, but more survivors were left in a vegetative state or with severe disability."]},

{id:"meningitis",u:9,t:"Meningitis & encephalitis",r:["O63"],
 bl:"Bacterial meningitis kills quickly: give antibiotics and dexamethasone immediately, and don’t delay them for CT or LP. Add acyclovir until HSV encephalitis is excluded. Think of autoimmune encephalitis with subacute psychiatric changes, seizures and movement disorders.",
 ord:["Blood cultures, then dexamethasone 0.15 mg/kg (10 mg) IV q6h × 4 days with or before the first antibiotic dose","Ceftriaxone 2 g q12h + vancomycin; add ampicillin 2 g q4h if > 50, immunocompromised, pregnant or alcohol use","Acyclovir 10 mg/kg IV q8h (adjust for renal function)","CT before LP only if immunocompromised, new seizures, papilledema, focal deficit, or reduced consciousness","CSF: cell count, glucose, protein, Gram stain, culture, HSV PCR, meningitis panel"],
 act:["Droplet precautions for suspected meningococcus; prophylaxis for close contacts","Continue dexamethasone only if pneumococcal or if the pathogen is unknown","MRI and EEG for encephalitis; autoimmune antibody panel (serum and CSF)","Monitor for complications: raised ICP, seizures, hyponatremia, venous sinus thrombosis"],
 ev:[["de Gans (NEJM 2002)","Dexamethasone in adult bacterial meningitis reduced unfavorable outcomes and death, especially pneumococcal."],["Proulx (QJM 2005)","Delays in antibiotics beyond 6 h increased mortality in bacterial meningitis."],["Glimåker (CID 2015)","Lumbar puncture without CT in most patients reduced delays and improved outcomes."]],
 pr:["A normal CSF Gram stain doesn’t exclude bacterial meningitis.","HSV PCR can be negative in the first 72 h; repeat if suspicion is high.","Neutropenic or transplant patients: consider Listeria, fungi (Cryptococcus) and viruses."],
 q:["When should dexamethasone be given in suspected bacterial meningitis?","With or just before the first antibiotic dose (not later), 0.15 mg/kg q6h for 4 days."]},

{id:"nm_weak",u:9,t:"Neuromuscular weakness: GBS, myasthenia & ICU-acquired weakness",r:["O66","O67","M45"],
 bl:"Neuromuscular respiratory failure creeps up: SpO₂ stays normal until late. Track vital capacity and NIF, intubate electively before crisis. GBS and myasthenic crisis respond to IVIG or plasma exchange. ICU-acquired weakness is the most common cause of weakness in long ICU stays.",
 ord:["Bedside FVC and NIF q4–6h","IVIG 0.4 g/kg/day × 5 days or plasma exchange (5 sessions) for GBS or myasthenic crisis","Telemetry (dysautonomia in GBS)","Medication review in myasthenia (avoid aminoglycosides, fluoroquinolones, magnesium, β-blockers, neuromuscular blockers)"],
 act:["20/30/40 rule: intubate if FVC < 20 mL/kg, NIF weaker than −30 cmH₂O, or MEP < 40 cmH₂O","Bulbar weakness and weak cough are reasons for early intubation","Hold pyridostigmine while intubated for myasthenic crisis","ICU-acquired weakness: MRC sum score < 48; minimize steroids, NMBs and hyperglycemia; early mobilization"],
 ev:[["Hughes Cochrane reviews","IVIG and plasma exchange are equally effective for GBS; combining them adds nothing."],["Lawn (Arch Neurol 2001)","FVC < 20 mL/kg and rapid progression predicted need for ventilation in GBS."],["Hermans (Cochrane 2014)","Intensive insulin therapy reduced critical illness polyneuropathy; early rehab helps function."]],
 pr:["Steroids aren’t effective in GBS.","Myasthenia can worsen briefly after starting steroids.","Single breath count < 20 is a quick bedside proxy for poor vital capacity."],
 q:["Why is SpO₂ a poor monitor in neuromuscular respiratory failure?","Oxygenation stays normal until late; hypoventilation and fatigue are better detected with FVC, NIF and clinical signs."]}
);

L.push(
{id:"dka",u:10,t:"DKA, HHS & glucose control",r:["O68"],
 bl:"DKA is insulin deficiency with ketoacidosis; HHS is extreme hyperglycemia and hyperosmolality with profound dehydration. Both need fluids, insulin and potassium management, with careful attention to K before insulin and to osmolality falling too fast. For other ICU patients, target glucose 140–180 mg/dL; tighter control harms.",
 ord:["Balanced crystalloid 1–1.5 L in the first hour, then 250–500 mL/h guided by volume status","Regular insulin 0.1 units/kg/h (or 0.14 without bolus), only once K ≥ 3.5","Add dextrose when glucose < 250 (DKA) or < 300 (HHS) and keep insulin running until the gap closes","Potassium: replace to keep 4–5 (add 20–40 mEq/L to fluids when K < 5.0)","BMP and venous gas q2–4h; β-hydroxybutyrate"],
 act:["Transition to SC basal insulin with 1–2 h overlap before stopping the drip","Bicarbonate only if pH < 7.0","HHS: reduce osmolality by no more than ~3–8 mOsm/kg/h; watch sodium (corrected Na rises as glucose falls)","Look for the trigger: infection, MI, missed insulin, SGLT2 inhibitor (euglycemic DKA), pancreatitis"],
 ev:[["NICE-SUGAR (NEJM 2009)","Tight glucose control (81–108 mg/dL) increased mortality versus 144–180."],["ADA/EASD hyperglycemic crisis consensus (Diabetes Care 2024)","Defines DKA and HHS criteria, recommends balanced crystalloids and starting basal insulin early."],["SMART subgroup (Self, JAMA Netw Open 2020)","Balanced crystalloids resolved DKA faster than saline."]],
 pr:["Total body K is depleted in DKA even when serum K is high; insulin will drop it fast.","Euglycemic DKA (glucose < 250) with SGLT2 inhibitors is easily missed; check ketones.","Cerebral edema is mostly a pediatric DKA complication but can occur in young adults."],
 q:["What potassium level must be reached before starting an insulin infusion in DKA?","At least 3.5 mEq/L; insulin shifts potassium into cells and can cause life-threatening hypokalemia."]},

{id:"adrenal_thyroid",u:10,t:"Adrenal, thyroid & pituitary emergencies",r:["O70","O71","O69","M50"],
 bl:"Adrenal crisis presents as shock unresponsive to fluids and pressors; give hydrocortisone first and test later. Thyroid storm and myxedema coma are clinical diagnoses that need treatment before confirmatory labs. Diabetes insipidus causes large volumes of dilute urine and rapid hypernatremia.",
 ord:["Adrenal crisis: hydrocortisone 100 mg IV then 50 mg q6h (or 200 mg/day infusion); random cortisol and ACTH before if possible but don’t delay","Thyroid storm: propranolol 60–80 mg q4h (or esmolol), PTU 200 mg q4h (or methimazole 20 mg q4–6h), iodine 1 h after thionamide, hydrocortisone 100 mg q8h","Myxedema coma: hydrocortisone first, then levothyroxine 200–400 mcg IV load (lower in elderly or cardiac disease)","Diabetes insipidus: urine osmolality, serum sodium q2–4h; desmopressin 1–2 mcg IV for central DI"],
 act:["Burch-Wartofsky score > 45 supports thyroid storm","Myxedema coma: passive rewarming, ventilatory support, avoid hypotonic fluids (hyponatremia)","Post-pituitary surgery: watch for the triphasic response (DI → SIADH → DI)","Replace free water losses in DI with D5W or enteral water"],
 ev:[["Endocrine Society adrenal insufficiency guideline (2016)","Recommends immediate parenteral hydrocortisone for suspected adrenal crisis without waiting for tests."],["Akamizu thyroid storm (Thyroid 2012)","Thyroid storm mortality remains > 10% even with treatment."],["Annane CIRCI guideline (CCM 2017)","Critical illness-related corticosteroid insufficiency is diagnosed clinically; random cortisol is not recommended to select patients."]],
 pr:["Iodine given before a thionamide can fuel hormone synthesis; sequence matters.","Hyperkalemia with hyponatremia and shock suggests primary adrenal failure.","Etomidate suppresses cortisol transiently; it doesn’t cause adrenal crisis in most patients."],
 q:["Why is iodine given at least an hour after PTU or methimazole in thyroid storm?","Thionamides block new hormone synthesis first; giving iodine before could provide substrate for more thyroid hormone (Jod-Basedow effect)."]},

{id:"rbc",u:10,t:"Anemia & red cell transfusion",r:["M18","O112"],
 bl:"For most ICU patients, transfuse at hemoglobin < 7 g/dL. Higher thresholds are reasonable in acute coronary syndrome and possibly brain injury. Reduce blood loss from phlebotomy and treat iron deficiency; every unit carries risks (TACO, TRALI, infection, immunomodulation).",
 ord:["Type and screen; single-unit transfusions with reassessment","Hb threshold 7 (8 in cardiac surgery, consider 8–10 in active ACS)","Small-volume blood tubes and fewer routine labs","Watch for TACO (hypertension, edema) and TRALI (hypoxemia within 6 h, no overload)"],
 act:["Transfuse for symptoms or hemodynamic compromise from anemia, not numbers alone","Treat iron deficiency (IV iron if appropriate) and B12/folate deficits","Jehovah’s Witness patients: discuss accepted products early; minimize phlebotomy; consider erythropoietin and iron","Massive transfusion follows its own ratio-based protocol (see hemorrhagic shock)"],
 ev:[["TRICC (NEJM 1999)","Hb 7 vs 10 threshold: no mortality difference; possibly better in less sick and younger patients."],["TRISS (NEJM 2014)","Hb 7 vs 9 in septic shock: no difference in 90-day mortality with half the transfusions."],["MINT (NEJM 2023)","In acute MI with anemia, restrictive (7–8) vs liberal (10) didn’t reach significance, but trends favored liberal; many now transfuse to ~10 in ACS."],["TRAIN (JAMA 2024)","In acute brain injury, a liberal threshold (9) reduced unfavorable neurological outcomes."]],
 pr:["Each unit of RBCs raises Hb ~1 g/dL in a non-bleeding adult.","Phlebotomy causes ~40–70 mL of blood loss per day in the ICU.","Fever and hypotension during transfusion: stop it, send transfusion reaction workup."],
 q:["Which ICU populations may warrant a transfusion threshold above 7?","Acute coronary syndrome (MINT trends) and acute brain injury (TRAIN); also active hemorrhage, which follows ratio-based transfusion."]},

{id:"coag",u:10,t:"Platelets, coagulopathy, DIC, HIT & TTP",r:["M19","O113"],
 bl:"Thrombocytopenia is common in the ICU and the cause matters: sepsis/DIC, drugs, HIT, TTP, liver disease, dilution. Transfuse platelets and plasma for bleeding or high-risk procedures, not numbers. HIT and TTP are thrombotic disorders where platelets can worsen the problem.",
 ord:["Peripheral smear (schistocytes), fibrinogen, PT/INR, aPTT, D-dimer, LDH, haptoglobin","4T score before HIT antibody testing; PLASMIC score for TTP","HIT: stop all heparin (including flushes), start argatroban or bivalirudin","TTP: urgent plasma exchange, methylprednisolone, caplacizumab; ADAMTS13 before plasma","DIC: treat the cause; replace if bleeding (platelets > 50, fibrinogen > 1.5 g/L)"],
 act:["Prophylactic platelet transfusion at < 10 × 10⁹/L in non-bleeding patients","Procedural thresholds commonly 20–50 depending on procedure and site","Don’t give FFP for an isolated high INR without bleeding","Avoid warfarin in acute HIT until platelets recover"],
 ev:[["PLOT-ICU (NEJM 2023)","Withholding prophylactic platelets (counts 10–50) before ultrasound-guided CVC placement increased bleeding; non-inferiority not shown."],["HERCULES (NEJM 2019)","Caplacizumab in TTP shortened time to platelet normalization and reduced recurrence."],["Lo 4T score (J Thromb Haemost 2006)","Low 4T score has high negative predictive value for HIT."]],
 pr:["HIT typically occurs 5–10 days after heparin starts (sooner with recent exposure).","Thrombocytopenia with schistocytes and neurologic or renal signs: TTP until proven otherwise.","Liver disease is ‘rebalanced’ hemostasis; INR doesn’t predict bleeding."],
 q:["Why should platelets usually be avoided in HIT and TTP?","Both are thrombotic disorders; transfusion may fuel thrombosis, so platelets are reserved for life-threatening bleeding."]},

{id:"onc_emerg",u:10,t:"Hematologic malignancy & oncologic emergencies",r:["O114","O86","O85"],
 bl:"Patients with cancer increasingly survive the ICU. Recognize oncologic emergencies quickly: tumor lysis syndrome, leukostasis, hypercalcemia, spinal cord compression, SVC syndrome, neutropenic sepsis, and CAR-T toxicities. Give full support early; time-limited trials beat early limits.",
 ord:["TLS: aggressive IV fluids, rasburicase 0.2 mg/kg (check G6PD), K/Ca/phos/uric acid q6–8h","Leukostasis (blasts > 100k with symptoms): hydroxyurea, urgent induction or leukapheresis","Cord compression: dexamethasone 10 mg IV, MRI whole spine, neurosurgery or radiation oncology","CAR-T cytokine release syndrome: tocilizumab ± dexamethasone; ICANS: dexamethasone"],
 act:["Avoid transfusing RBCs in leukostasis (raises viscosity) unless critical","Avoid calcium for asymptomatic hypocalcemia in TLS (calcium phosphate precipitation)","Neutropenic fever: antipseudomonal β-lactam within 1 h","Hold nephrotoxins; dialysis for TLS with severe hyperkalemia, hyperphosphatemia or oliguria"],
 ev:[["Azoulay (JCO 2013)","ICU survival of patients with hematologic malignancy has improved substantially over two decades."],["Shrime time-limited trials (JAMA Oncol 2016)","A time-limited ICU trial (several days) maximized survival benefit in cancer patients with poor prognosis."],["Cairo-Bishop TLS classification","Defines laboratory and clinical TLS for diagnosis and risk stratification."]],
 pr:["Hyperleukocytosis with ‘hypoxemia’ may be pseudohypoxemia from leukocyte O₂ consumption in the tube; trust SpO₂.","APL (acute promyelocytic leukemia) presents with DIC; start ATRA immediately when suspected.","Ask the oncologist about prognosis and goals before crises happen."],
 q:["Why is rasburicase contraindicated in G6PD deficiency?","It generates hydrogen peroxide while degrading uric acid, which causes hemolysis and methemoglobinemia in G6PD deficiency."]},

{id:"anaphylaxis",u:10,t:"Anaphylaxis & plasma exchange",r:["O109","O110","O111"],
 bl:"Anaphylaxis is a rapidly progressive, potentially fatal reaction affecting skin, airway, breathing and circulation. IM epinephrine is the first and most important drug; antihistamines and steroids are adjuncts. Plasma exchange and IVIG treat a defined set of antibody-mediated ICU emergencies.",
 ord:["Epinephrine 0.5 mg IM (0.01 mg/kg) in the thigh, repeat every 5–15 min","Epinephrine infusion 0.05–0.5 mcg/kg/min for refractory anaphylaxis","Crystalloid boluses for hypotension (large volumes may be needed)","Glucagon 1–5 mg IV for patients on β-blockers","Tryptase within 1–2 h of onset"],
