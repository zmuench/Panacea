 act:["Airway: early intubation by the most experienced operator if stridor or edema is progressing","Observe ≥ 4–6 h (biphasic reactions occur in up to 5%)","ACE inhibitor angioedema is bradykinin-mediated: epinephrine and antihistamines don’t help; consider icatibant or FFP","Plasma exchange indications: TTP, GBS, myasthenic crisis, hyperviscosity, anti-GBM disease, some vasculitides"],
 ev:[["World Allergy Organization guidance (2020)","IM epinephrine is first-line; delays are associated with death."],["Lee (JACI Pract 2015) biphasic reactions","Biphasic reactions occur in ~5% of cases, mostly within 12 h."],["ASFA guidelines (J Clin Apher 2023)","Category I indications for plasma exchange include TTP, GBS and myasthenic crisis."]],
 pr:["IM in the thigh achieves faster peak levels than subcutaneous.","IV epinephrine bolus of 1 mg (cardiac arrest dose) in an anaphylactic patient with a pulse can cause arrhythmias or MI.","Antihistamines only help skin symptoms."],
 q:["Why give glucagon in anaphylaxis?","Patients on β-blockers may be refractory to epinephrine; glucagon raises cAMP independently of β-receptors."]}
);

L.push(
{id:"tox_approach",u:11,t:"The poisoned patient: acetaminophen & salicylates",r:["O101","M54"],
 bl:"Support the ABCs, identify the toxidrome, check for co-ingestants, and use specific antidotes and enhanced elimination where they help. Acetaminophen and salicylate levels belong in every intentional overdose because both are common, initially quiet, and treatable.",
 ord:["Acetaminophen and salicylate levels (repeat salicylate q2h until falling), ethanol, BMP, VBG, osm gap, ECG, CK, pregnancy test","Acetaminophen: N-acetylcysteine if level is above the treatment line (150 mcg/mL at 4 h) or with liver injury; 21-h IV regimen","Salicylates: sodium bicarbonate infusion to urine pH 7.5–8.0; keep K normal","Poison Control (US 1-800-222-1222) and toxicology consult"],
 act:["Activated charcoal 1 g/kg if within 1–2 h, airway protected and no contraindication","Salicylate dialysis (EXTRIP): level > 100 mg/dL (> 90 with impaired kidney function), altered mental status, hypoxemia, or pH ≤ 7.20","If a salicylate patient must be intubated, match their very high minute ventilation","Massive acetaminophen ingestion: consider fomepizole and dialysis per toxicology"],
 ev:[["Rumack-Matthew nomogram","Predicts hepatotoxicity risk from a single acute ingestion with a known time; not valid for staggered or unknown-time ingestions."],["SNAP (Lancet 2014)","A shorter 12-h NAC regimen caused fewer adverse reactions than the standard 21-h regimen."],["EXTRIP salicylate recommendations (Ann Emerg Med 2015)","Define criteria for extracorporeal removal in salicylate poisoning."]],
 pr:["Respiratory alkalosis plus anion gap acidosis in an adult: think salicylates.","Normal acetaminophen level at 4 h doesn’t exclude toxicity with ER formulations or co-ingestion of anticholinergics or opioids (delayed absorption).","Treat with NAC when in doubt: it’s safe and effective even late."],
 q:["Why match minute ventilation when intubating a salicylate-poisoned patient?","Their respiratory alkalosis keeps salicylate ionized and out of the brain; any rise in PaCO₂ worsens acidemia, pushing salicylate into the CNS and causing collapse."]},

{id:"cardiotox",u:11,t:"Cardiotoxic overdoses: β-blockers, calcium channel blockers, TCAs & digoxin",r:["M54","O101"],
 bl:"Cardiotoxic drugs cause bradycardia, conduction delays and shock. Each has a rescue: high-dose insulin and calcium for CCB/BB, sodium bicarbonate for sodium channel blockade (TCAs), and digoxin-specific Fab. Escalate to lipid emulsion and VA-ECMO when standard therapy fails.",
 ord:["ECG every 1–2 h (QRS, QTc, rhythm)","Calcium gluconate 3–6 g IV (or CaCl 1–2 g) for CCB/BB","High-dose insulin: 1 unit/kg bolus then 1–10 units/kg/h with dextrose and K replacement; glucose q30–60 min","Sodium bicarbonate 1–2 mEq/kg bolus for QRS > 100 ms (TCA, other Na-channel blockers); target serum pH 7.45–7.55","Digoxin Fab for life-threatening dysrhythmia, K > 5–5.5, or end-organ dysfunction"],
 act:["Vasopressors and pacing alongside high-dose insulin","Glucagon 3–10 mg IV for β-blocker toxicity (often vomit-inducing)","Lipid emulsion 20% 1.5 mL/kg for refractory lipophilic drug toxicity (bupivacaine, some CCBs)","Early ECMO referral for refractory cardiogenic shock from poisoning"],
 ev:[["Engebretsen (Clin Toxicol 2011)","Systematic review supporting high-dose insulin for CCB and β-blocker toxicity."],["St-Onge CCB consensus (Crit Care Med 2017)","Recommended calcium, high-dose insulin and vasopressors as first-line, with ECMO for refractory shock."],["Chan (Clin Toxicol 2014)","Digoxin Fab effectively reverses digoxin toxicity in acute and chronic poisoning."]],
 pr:["CCB toxicity causes hyperglycemia (blocked insulin release); β-blockers often cause hypoglycemia.","Terminal R wave in aVR > 3 mm suggests TCA toxicity and seizure/arrhythmia risk.","Digoxin toxicity with hyperkalemia: Fab, insulin/dextrose; calcium is probably safe but not first-line."],
 q:["What ECG findings indicate sodium channel blockade from TCA overdose and what treats them?","QRS > 100 ms and a terminal R wave > 3 mm in aVR; treat with sodium bicarbonate boluses."]},

{id:"toxidromes",u:11,t:"Toxidromes, withdrawal & toxic gases",r:["M55","O101"],
 bl:"Recognize the pattern: sympathomimetic (hot, sweaty, wide pupils), anticholinergic (hot, dry, wide pupils), cholinergic (wet), opioid (pinpoint, hypoventilation), serotonin syndrome (clonus, hyperreflexia), NMS (rigidity, slow onset), alcohol withdrawal (tremor, hallucinosis, seizures, delirium tremens). Carbon monoxide and cyanide cause lactic acidosis and coma with normal SpO₂.",
 ord:["Serotonin syndrome: stop serotonergic drugs, benzodiazepines, cyproheptadine 12 mg then 2 mg q2h, cooling","NMS: stop the dopamine antagonist, bromocriptine, dantrolene for severe rigidity","Alcohol withdrawal: symptom-triggered benzodiazepines (CIWA), phenobarbital for refractory, thiamine","Organophosphates: atropine (titrate to dry secretions), pralidoxime","CO: 100% O₂ via non-rebreather; hyperbaric O₂ for severe cases; cyanide: hydroxocobalamin 5 g IV"],
 act:["Hyperthermia > 41°C in serotonin syndrome or sympathomimetic toxicity: sedate, cool, intubate and paralyze if needed (non-depolarizing)","Avoid physostigmine if TCA ingestion is possible","Smoke inhalation with lactate > 8: suspect cyanide","Check COHb with co-oximetry; pulse oximetry is falsely normal"],
 ev:[["Hunter criteria (QJM 2003)","More sensitive and specific than Sternbach criteria for serotonin syndrome."],["Weaver (NEJM 2002)","Hyperbaric O₂ in acute CO poisoning reduced cognitive sequelae at 6 weeks and 12 months."],["Rosenson (J Emerg Med 2013)","Single-dose phenobarbital added to standard care reduced ICU admission in alcohol withdrawal."]],
 pr:["Clonus (especially lower limbs) distinguishes serotonin syndrome from NMS (lead-pipe rigidity).","Don’t use succinylcholine in hyperthermic patients with rhabdomyolysis (hyperkalemia).","Dexmedetomidine helps agitation in withdrawal but doesn’t prevent seizures."],
 q:["How do you distinguish serotonin syndrome from NMS clinically?","Serotonin syndrome: rapid onset (hours), clonus and hyperreflexia, mydriasis, diarrhea. NMS: slower onset (days), lead-pipe rigidity, bradyreflexia, after a dopamine antagonist."]},

{id:"thermal",u:11,t:"Heat stroke, hypothermia & other thermal disorders",r:["M42","O104","O102","O105"],
 bl:"Heat stroke is a race against time: core temperature > 40°C with CNS dysfunction needs immediate rapid cooling, ideally cold water immersion. Severe hypothermia needs gentle handling, active rewarming, and ECMO for cardiac arrest or instability. ‘Not dead until warm and dead.’",
 ord:["Core temperature probe (esophageal, bladder, rectal)","Heat stroke: cold water immersion (or evaporative cooling with ice packs) to < 39°C within 30 min","CK, LFTs, coags (DIC), creatinine, glucose","Hypothermia: forced air warming, warmed IV fluids; ECMO for arrest or instability (Swiss stage III–IV)"],
 act:["Stop active cooling at ~38.5–39°C to avoid overshoot","Antipyretics don’t work for heat stroke","Hypothermic cardiac arrest: CPR, defibrillation attempt (repeat once > 30°C), continue resuscitation until rewarmed","Drowning: hypoxia is the problem; early PEEP and lung-protective ventilation"],
 ev:[["Casa (Exerc Sport Sci Rev 2007)","Cooling at > 0.15°C/min is associated with near-100% survival in exertional heat stroke."],["Walpoth (NEJM 1997)","ECMO rewarming of hypothermic arrest led to good long-term neurological outcomes in many survivors."],["HOPE score (Pasquier, Resuscitation 2018)","Predicts survival after ECMO rewarming for hypothermic arrest."]],
 pr:["Elderly and those on anticholinergics, diuretics and β-blockers are at higher risk for classic heat stroke.","Hypothermia causes an Osborn (J) wave on ECG.","Avoid rough handling of severely hypothermic patients; it can trigger VF."],
 q:["What cooling method is fastest for exertional heat stroke?","Cold water immersion (ice water bath), achieving cooling rates of ~0.15–0.35°C/min."]},

{id:"burns",u:11,t:"Burns & inhalation injury",r:["O103"],
 bl:"Major burns cause massive capillary leak, so give fluid in proportion to burn size and titrate to urine output, avoiding ‘fluid creep’. Assess the airway early because inhalation injury swells over hours. Watch for CO and cyanide toxicity, compartment syndromes, and later sepsis.",
 ord:["Total body surface area (TBSA) estimate (rule of nines or Lund–Browder) for partial- and full-thickness burns","Lactated Ringer’s 2–4 mL/kg/%TBSA over 24 h (half in first 8 h from time of burn) for TBSA > 20%","Urine output target 0.5 mL/kg/h (adults); adjust fluid hourly","COHb, lactate, CK; bronchoscopy for suspected inhalation injury"],
 act:["Early intubation for stridor, hoarseness, full-thickness facial burns, extensive burns, or significant airway edema","Escharotomy for circumferential full-thickness burns of chest or limbs","Bladder pressure in large burns (abdominal compartment syndrome)","Early excision and grafting; high-protein nutrition; tetanus"],
 ev:[["Parkland formula (Baxter)","Original 4 mL/kg/%TBSA; many burn centers now start at 2 mL/kg/%TBSA to limit over-resuscitation."],["Saffle ‘fluid creep’ (J Burn Care Res 2007)","Resuscitation volumes have drifted above formula predictions with associated complications."],["ABA guidelines","Refer to a burn center for > 10–20% TBSA, face/hands/feet/genitals, inhalation injury, electrical or chemical burns."]],
 pr:["Don’t count superficial (first-degree) burns in TBSA.","Hypotension in the first hours of a burn is usually from another injury.","Succinylcholine is unsafe after ~24–48 h post-burn (hyperkalemia)."],
 q:["What urine output target guides burn resuscitation in adults?","About 0.5 mL/kg/h (30–50 mL/h); adjust fluid rates hourly to avoid over- and under-resuscitation."]}
);

L.push(
{id:"trauma_icu",u:12,t:"Major trauma: the ICU phase",r:["O77","O107"],
 bl:"After the trauma bay, the ICU finishes the resuscitation: reverse the lethal triad (acidosis, hypothermia, coagulopathy) plus hypocalcemia, find missed injuries with a tertiary survey, and coordinate staged (damage control) surgery. Most preventable deaths happen when bleeding is under-recognized.",
 ord:["Serial lactate, Hb, coags/TEG, ionized calcium, base deficit","Tertiary survey within 24 h (full exam, review all imaging)","VTE prophylaxis (enoxaparin 30 mg BID or weight-adjusted) as soon as bleeding is controlled, usually within 24–48 h","Tetanus; antibiotics for open fractures within 1 h"],
 act:["Damage control: abbreviated surgery, ICU correction, return to OR within 24–48 h","Re-warm actively; correct calcium and fibrinogen","Watch compartments (limbs, abdomen) after big resuscitations","Fat embolism (petechiae, hypoxemia, confusion 24–72 h after long bone fractures)"],
 ev:[["Rotondo damage control (J Trauma 1993)","Staged laparotomy improved survival in exsanguinating penetrating abdominal injury."],["Enderson tertiary survey (J Trauma 1990)","Systematic re-examination found missed injuries in about 9% of trauma patients."],["CRASH-2 and PROPPR (see Unit 2)","Early TXA and balanced transfusion are the core of hemorrhage control resuscitation."]],
 pr:["Base deficit and lactate clearance track resuscitation better than BP.","Elderly patients on anticoagulants or β-blockers can hide shock.","Abdominal compartment syndrome after resuscitation: high peak pressures, oliguria, tense abdomen."],
 q:["What is the purpose of the tertiary survey?","A complete repeat examination and imaging review within 24 h to detect injuries missed in the initial evaluation."]},

{id:"chest_trauma",u:12,t:"Chest trauma: ribs, contusion & hemothorax",r:["O80"],
 bl:"Rib fractures are a pulmonary problem: pain causes splinting, atelectasis and pneumonia, especially in the elderly. Aggressive multimodal analgesia (including regional blocks), pulmonary hygiene, and selective rib fixation reduce complications. Pulmonary contusions blossom over 24–48 h.",
 ord:["Multimodal analgesia: scheduled acetaminophen, NSAIDs if safe, lidocaine patches, low-dose ketamine; epidural or serratus/erector spinae block","Incentive spirometry hourly while awake; track vital capacity","Chest tube for hemothorax or pneumothorax (> small, or on positive pressure)","CT chest for occult injuries; CT angiography if mediastinal widening"],
 act:["Massive hemothorax (> 1500 mL initially or > 200 mL/h for 2–4 h) → thoracotomy","Retained hemothorax: early VATS (within ~5 days)","Flail chest with failed analgesia or ventilation: surgical stabilization (SSRF)","Blunt cardiac injury: ECG and troponin; echo if abnormal"],
 ev:[["Pieracci (J Trauma Acute Care Surg 2020)","Rib fixation for multiple displaced fractures reduced pain and pleural complications."],["Bulger (Surgery 2004)","Epidural analgesia for rib fractures reduced nosocomial pneumonia and ventilator days."],["Bulger (J Trauma 2000)","Elderly patients with rib fractures had twice the mortality of younger patients; each additional fracture increased risk."]],
 pr:["Each rib fracture increases mortality in the elderly; admit liberally to monitored beds.","Pulmonary contusion: avoid fluid overload; worsens 24–48 h after injury.","Persistent air leak or a large pneumothorax despite a tube: tracheobronchial injury."],
 q:["When does a hemothorax need thoracotomy?","Initial chest tube output > 1500 mL, or ongoing drainage > 200 mL/h for 2–4 h, or persistent hemodynamic instability."]},

{id:"abd_spine",u:12,t:"Abdominal, pelvic & spinal cord injury",r:["O82","O81","O76"],
 bl:"Nonoperative management of solid organ injury needs serial exams, Hb, and a low threshold for angioembolization or surgery. Pelvic fractures bleed from veins and arteries: binder, angiography, or preperitoneal packing. Spinal cord injury causes neurogenic shock and respiratory failure; protect the cord with perfusion and immobilization.",
 ord:["Solid organ injury: Hb q6h, bed rest per protocol, IR on standby","Pelvic binder at the greater trochanters for unstable pelvic fractures","Bladder pressure monitoring in high-risk patients (IAP > 12 = hypertension; > 20 with organ failure = compartment syndrome)","SCI: MAP 85–90 mmHg for 3–7 days (vasopressors, norepinephrine preferred); spine precautions; neurosurgery/ortho spine"],
 act:["Abdominal compartment syndrome: sedation, NG/rectal decompression, avoid over-resuscitation, decompressive laparotomy if refractory","High cervical SCI (above C5): early intubation; watch for bradycardia with suctioning (atropine available)","Don’t give methylprednisolone for acute SCI","DVT prophylaxis within 72 h in SCI (LMWH)"],
 ev:[["WSACS consensus (ICM 2013)","Defines intra-abdominal hypertension and abdominal compartment syndrome, and recommends against routine fluid loading."],["AANS/CNS SCI guidelines","MAP augmentation to 85–90 for 7 days (low-level evidence); methylprednisolone not recommended."],["NASCIS trials","Methylprednisolone benefits were marginal and post-hoc, with infection and GI bleeding risk; no longer standard."]],
 pr:["Neurogenic shock: hypotension with bradycardia and warm extremities.","Ventral hernia and enteroatmospheric fistula are long-term costs of open abdomen management.","The spinal cord injury level can rise in the first days (edema); re-examine respiratory function."],
 q:["What intra-abdominal pressure threshold defines abdominal compartment syndrome?","Sustained IAP > 20 mmHg with new organ dysfunction or failure."]},

{id:"cardsurg",u:12,t:"After cardiac surgery",r:["O73"],
 bl:"The first 24 h after cardiac surgery are about bleeding, low output, vasoplegia, tamponade, and arrhythmias. Most patients are extubated within hours. Recognize post-op tamponade, which can be focal and atypical, and treat bleeding with targeted products and reoperation when needed.",
 ord:["Chest tube output hourly; CBC, coags, fibrinogen, TEG","Pacing wires connected and tested; backup pacing settings","K > 4, Mg > 2 targets; amiodarone or β-blocker for AF prophylaxis per protocol","Early extubation pathway (fast-track) when warm, awake, and not bleeding"],
 act:["Bleeding > 200 mL/h × 2 h or > 400 mL in an hour: correct coagulopathy, warm, consider re-exploration","Sudden drop in chest tube output with rising filling pressures and falling output: tamponade (TEE may be needed)","Vasoplegia: norepinephrine, vasopressin, then methylene blue or hydroxocobalamin","Low cardiac output: optimize preload, inotrope, pacing (AV sequential), IABP or MCS"],
 ev:[["TRICS-III (NEJM 2017)","Restrictive transfusion (Hb < 7.5) was non-inferior to liberal in cardiac surgery."],["LEVO-CTS (NEJM 2017)","Prophylactic levosimendan didn’t reduce complications."],["Post-op AF (Gillinov, NEJM 2016)","Rate control and rhythm control (amiodarone) produced similar days in hospital for post-op AF."]],
 pr:["Post-op tamponade can compress only one chamber (e.g., RA), so TTE may miss it.","Hypothermia after bypass causes shivering, vasoconstriction and coagulopathy.","A patient who doesn’t wake up may have had a stroke; image early."],
 q:["What clinical clues suggest tamponade after cardiac surgery?","Sudden drop in chest tube drainage, rising and equalizing filling pressures, falling cardiac output and BP, and increasing pressor needs."]},

{id:"postop",u:12,t:"The high-risk surgical patient: thoracic, neuro & abdominal",r:["O72","O74","O75","O76"],
 bl:"Post-operative ICU care is about anticipating the complications specific to each operation. Thoracic: fluid-sensitive lungs, air leaks, arrhythmias. Neurosurgical: BP control, bleeding, seizures, sodium. Abdominal: anastomotic leak, ileus, intra-abdominal hypertension. Pre-op frailty and functional status predict outcomes.",
 ord:["Thoracic: conservative fluids, multimodal analgesia (epidural/paravertebral), chest drains on suction or water seal per surgeon","Neurosurgery: SBP target per surgeon (often < 140–160), Na q6–12h, neuro checks q1h","Abdominal: early mobilization, early oral feeding (ERAS), VTE prophylaxis","Post-op delirium screening in older patients"],
 act:["Post-pneumonectomy: avoid fluid overload; mediastinal shift and bronchopleural fistula are emergencies","Post-craniotomy decline: CT head first (hematoma, edema, hydrocephalus)","Abdominal: new tachycardia, fever, ileus or rising lactate after POD 3 → think leak","Restart chronic medications intentionally: β-blockers, anticoagulants, steroids"],
 ev:[["POISE (Lancet 2008)","Starting high-dose metoprolol before surgery reduced MI but increased stroke and death."],["ERAS meta-analyses","Enhanced recovery pathways reduce complications and length of stay after major abdominal surgery."],["VISION (JAMA 2012 and 2017)","Post-operative troponin elevation (myocardial injury after noncardiac surgery) predicts 30-day mortality."]],
 pr:["Frailty is one of the strongest predictors of post-op ICU outcome.","Unexplained post-op tachycardia may be PE, AF, bleeding, pain, or a leak.","Check the operative note: you need to know what the surgeon worried about."],
 q:["What does POISE teach about perioperative β-blockade?","Starting high-dose β-blockers just before surgery lowered MI rates but increased stroke and death; chronic β-blockers should be continued, not initiated acutely."]}
);

L.push(
{id:"obstetric",u:13,t:"Obstetric critical care",r:["O88","O89"],
 bl:"Pregnancy changes the physiology you resuscitate: higher cardiac output, lower PaCO₂ (normal ~30), smaller functional residual capacity, aortocaval compression after 20 weeks. Leading ICU causes are hemorrhage, hypertensive disorders, sepsis and cardiomyopathy. Two patients, but stabilizing the mother is the best care for the fetus.",
 ord:["Severe preeclampsia: magnesium sulfate 4–6 g IV load then 1–2 g/h; reflexes, RR, urine output, Mg levels in renal impairment","Severe BP (≥ 160/110) within 30–60 min: labetalol 20 mg IV (escalating), hydralazine 5–10 mg IV, or nifedipine IR 10–20 mg PO","PPH: oxytocin, then other uterotonics, TXA 1 g IV within 3 h, massive transfusion protocol, fibrinogen > 2 g/L","Obstetrics, anesthesia and neonatology involvement early"],
 act:["Left uterine displacement (manual or 15–30° tilt) when > 20 weeks","Cardiac arrest > 20 weeks: perimortem cesarean delivery within ~5 min if no ROSC","Difficult airway risk: smaller ETT, best operator, preoxygenate well","HELLP, acute fatty liver of pregnancy and TTP overlap; delivery treats the first two"],
 ev:[["Magpie (Lancet 2002)","Magnesium sulfate halved the risk of eclampsia in preeclampsia."],["WOMAN (Lancet 2017)","TXA reduced death from bleeding in postpartum hemorrhage when given within 3 h."],["ACOG severe hypertension guidance","Treat sustained SBP ≥ 160 or DBP ≥ 110 urgently to reduce maternal stroke."]],
 pr:["PaCO₂ of 40 in a pregnant patient is relative hypercapnia.","Magnesium toxicity: loss of reflexes, then respiratory depression; give calcium gluconate.","Peripartum cardiomyopathy may present up to 5 months postpartum."],
 q:["What is the normal PaCO₂ in late pregnancy and why?","About 28–32 mmHg, due to progesterone-driven increased minute ventilation."]},

{id:"elderly_obese",u:13,t:"The older patient & the patient with obesity",r:["O83","O84"],
 bl:"Age alone doesn’t predict ICU outcome; frailty, function and goals do. Older patients have more delirium and slower recovery, so prioritize mobility and cognitive protection. Obesity changes airway management, ventilation (set VT by height), drug dosing and positioning.",
 ord:["Clinical Frailty Scale on admission","Delirium prevention bundle; avoid Beers list drugs where possible","Obesity: set VT by predicted body weight; higher PEEP to counter chest wall load","Weight-based drug dosing: ideal vs adjusted vs total weight per drug (e.g., succinylcholine total, rocuronium ideal; enoxaparin adjusted or anti-Xa)"],
 act:["Discuss goals and likely trajectory with older patients and families early","Obesity: preoxygenate in ramped or reverse Trendelenburg position; NIV or HFNC preoxygenation","Watch pressure injuries and rhabdomyolysis in obese patients","Use bariatric equipment and enough staff for safe turns and proning"],
 ev:[["VIP1 (ICM 2017)","In ICU patients ≥ 80, frailty independently predicted 30-day mortality."],["Obesity paradox (multiple cohorts)","Mildly elevated BMI is associated with lower ICU mortality; severe obesity increases complications."],["Pelosi (Anesth Analg 1998)","Obesity reduces respiratory system compliance and FRC; PEEP restores lung volume."]],
 pr:["‘The patient is 85’ is not a reason to withhold ICU care; ‘the patient is frail and would not want this’ might be.","Obese patients desaturate quickly during apnea.","Lipophilic drugs (e.g., propofol, midazolam) accumulate in obesity."],
 q:["Why set tidal volume by predicted body weight in obese patients?","Lung size is determined by height and sex, not body mass; using actual weight causes overdistension."]},

{id:"transplant",u:13,t:"The transplant recipient in the ICU",r:["O116","O117","O118","O85"],
 bl:"Transplant recipients come to the ICU with infection, rejection, drug toxicity or surgical complications, often more than one. Immunosuppression blunts the signs of infection and changes the organisms; drug interactions with calcineurin inhibitors are common. Always call the transplant team early.",
 ord:["Tacrolimus or cyclosporine levels; check interactions (azoles, macrolides, rifampin, some antiepileptics)","Stress-dose steroids for patients on chronic prednisone in shock","Broad infectious workup: blood cultures, CMV PCR, respiratory viral panel, fungal markers, PJP testing","Doppler ultrasound of the graft (e.g., hepatic artery thrombosis after liver transplant)"],
 act:["Heart transplant: denervated heart, atropine ineffective, use isoproterenol or pacing for bradycardia","Lung transplant: primary graft dysfunction in the first 72 h; avoid fluid overload","Kidney transplant: avoid nephrotoxins; graft dysfunction workup","Reduce immunosuppression in severe infection after discussing with the transplant team"],
 ev:[["Fishman timeline (NEJM 2007)","Infections after transplant follow a predictable timeline: surgical/nosocomial in month 1, opportunistic in months 1–6, community later."],["Calcineurin inhibitor toxicity","Causes AKI, hyperkalemia, hypomagnesemia, PRES and neurotoxicity; levels and interactions guide management."],["ISHLT PGD consensus (2017)","Grades primary graft dysfunction by P/F ratio and imaging at 0–72 h after lung transplant."]],
 pr:["Posterior reversible encephalopathy syndrome (PRES) presents with seizures, headache and vision changes on tacrolimus.","Fever may be absent; any clinical change deserves an infection workup.","Don’t stop immunosuppression without the transplant team."],
 q:["Why doesn’t atropine work in a heart transplant recipient?","The transplanted heart is denervated, so vagally mediated effects (and their blockade) don’t occur."]},

{id:"peds1",u:13,t:"The critically ill child I: recognition, airway & breathing",r:["O90","O91","O92"],
 bl:"Children compensate well and then crash; tachycardia, prolonged capillary refill and altered mental status come before hypotension. Their airways are small and easily obstructed. Respiratory failure is the most common path to pediatric arrest.",
 ord:["Weight in kg (or length-based tape) for every dose","Croup: dexamethasone 0.6 mg/kg (max 16 mg), nebulized racemic epinephrine for stridor at rest","Bronchiolitis: supportive care, suction, HFNC (1–2 L/kg/min) for increased work of breathing","Asthma: albuterol, ipratropium, steroids, IV magnesium 50 mg/kg (max 2 g)"],
 act:["Upper airway obstruction: keep the child calm with the parent, avoid agitating procedures","ETT size (cuffed): (age/4) + 3.5; depth (cm) ≈ 3 × ETT size","Hypotension is a late, pre-arrest sign in children","Bacterial tracheitis or epiglottitis: airway in the OR with ENT and anesthesia"],
 ev:[["PARIS (NEJM 2018)","HFNC in infants with bronchiolitis reduced escalation of care compared with standard oxygen."],["Bjornson (NEJM 2004)","A single dose of oral dexamethasone reduced return visits in mild croup."],["PALICC-2 (Pediatr Crit Care Med 2023)","Pediatric ARDS guidance: lung-protective ventilation, oxygenation index-based severity, conservative fluids."]],
 pr:["Head bobbing, grunting and retractions mean high work of breathing in infants.","Infants are obligate nasal breathers; suction the nose first.","A quiet, drowsy child with asthma may be in respiratory failure."],
 q:["What is the formula for cuffed ETT size in a child?","(Age in years ÷ 4) + 3.5 mm internal diameter; depth at the lips ≈ 3 × tube size."]},

{id:"peds2",u:13,t:"The critically ill child II: shock, fluids, seizures & resuscitation",r:["O93","O95","O96","O97","O99","O100"],
 bl:"Pediatric septic shock still needs fluid, but in measured 10–20 mL/kg boluses with reassessment; then epinephrine or norepinephrine early. Use isotonic maintenance fluids. Status epilepticus and DKA follow adult principles with weight-based doses. PALS emphasizes airway, breathing and high-quality CPR.",
 ord:["Septic shock: 10–20 mL/kg balanced crystalloid boluses, up to 40–60 mL/kg in the first hour if no overload; antibiotics within 1 h","Epinephrine or norepinephrine infusion 0.05–0.1 mcg/kg/min, peripheral if needed","Maintenance: isotonic fluid (e.g., balanced crystalloid with dextrose) at 4-2-1 mL/kg/h","Status epilepticus: lorazepam 0.1 mg/kg (max 4 mg), then levetiracetam 60 mg/kg","PALS: epinephrine 0.01 mg/kg q3–5 min; defibrillation 2 J/kg, then 4 J/kg"],
 act:["Check glucose in every sick child (hypoglycemia is common)","Pediatric DKA: avoid boluses beyond what shock requires; watch for cerebral edema","Non-accidental trauma: look for patterned bruising, retinal hemorrhages, inconsistent histories","Poisoning: small doses of some drugs can kill a toddler (one pill: CCBs, TCAs, sulfonylureas, opioids)"],
 ev:[["FEAST (NEJM 2011)","Fluid boluses increased mortality in febrile African children without hypotension in a resource-limited setting."],["Surviving Sepsis Campaign Pediatric (2020)","In settings with intensive care, up to 40–60 mL/kg in the first hour, titrated to perfusion and overload."],["PECARN FLUID (NEJM 2018)","In pediatric DKA, fluid rate and saline concentration didn’t affect neurological outcomes."],["McNab (Lancet 2015)","Isotonic maintenance fluids reduced hyponatremia versus hypotonic fluids in hospitalized children."]],
 pr:["Normal pediatric BP lower limit: 70 + (2 × age in years) mmHg for ages 1–10.","Bradycardia in a sick child usually means hypoxemia; ventilate first.","Ask about family’s wishes and involve child life and social work early."],
 q:["What is the lower limit of normal systolic BP in a 6-year-old?","70 + (2 × 6) = 82 mmHg."]}
);

L.push(
{id:"goc",u:14,t:"Goals of care, ethics & palliative care",r:["O12","O13"],
 bl:"About 1 in 5 Americans dies in or after an ICU stay. Good critical care includes honest prognosis, shared decision-making, and excellent symptom management when the goal shifts to comfort. Withdrawal of life-sustaining treatment is ethically equivalent to withholding it.",
 ord:["Family meeting within 72 h of admission (and with any major change)","Code status and surrogate decision-maker documented","Palliative care consult for refractory symptoms, conflict, or complex decisions","Comfort-focused order set when transitioning: opioids and benzodiazepines titrated to symptoms, stop non-beneficial tests and treatments"],
 act:["Structure meetings: find out what they know, share information in plain language, acknowledge emotion, recommend a plan based on the patient’s values","Offer time-limited trials with explicit goals and a review date","Treat dyspnea and pain proportionally during withdrawal; double effect applies","Support the bedside nurse and family; spiritual care"],
 ev:[["Lautrette (NEJM 2007)","A proactive family conference with a bereavement brochure reduced PTSD, anxiety and depression symptoms in family members."],["Curtis VALUE mnemonic","Value, Acknowledge, Listen, Understand, Elicit questions: improves family meetings."],["Quill time-limited trials (JAMA 2011)","Time-limited trials align intensive treatment with patient values under uncertainty."]],
 pr:["Ask ‘What would your father say if he could see himself now?’ rather than ‘What do you want us to do?’","Recommendations from clinicians are welcome by most families; don’t present a menu.","Moral distress in the team is real; debrief after hard cases."],
 q:["What is a time-limited trial?","An agreement between clinicians and the patient/family to use specific treatments for a defined period, with predefined markers of improvement or deterioration, then reassess goals."]},

{id:"braindeath",u:14,t:"Brain death & organ donation",r:["O14","O115"],
 bl:"Brain death (death by neurologic criteria) requires a known catastrophic cause, absence of confounders, coma, absent brainstem reflexes, and apnea. Determination follows a strict protocol. Donation conversations are led by the organ procurement organization; your job is to recognize, refer and support the donor’s physiology.",
 ord:["Prerequisites: core temperature ≥ 36°C, SBP ≥ 100 or MAP ≥ 60, no confounding drugs or metabolic derangements","Apnea test: PaCO₂ ≥ 60 and ≥ 20 above baseline without respiratory effort","Ancillary test (nuclear flow scan, angiography) if the exam or apnea test can’t be completed","Early referral to the organ procurement organization for patients with devastating brain injury"],
 act:["Donor management: MAP ≥ 60–65, vasopressin for DI and hypotension, levothyroxine and hydrocortisone if unstable, lung-protective ventilation","Keep Na within 135–155 and glucose 140–180","Separate the family’s conversation about death from the conversation about donation","Donation after circulatory death (DCD) applies to patients not meeting brain death criteria when withdrawal is planned"],
 ev:[["AAN/AAP/CNS/SCCM consensus (Neurology 2023)","Unified adult and pediatric criteria for brain death/death by neurologic criteria."],["Kotloff donor management (CCM 2015)","Consensus on hemodynamic, endocrine and ventilatory management of the potential donor."],["Organ donor lung-protective ventilation (Mascia, JAMA 2010)","Lung-protective strategy increased the number of eligible and harvested lungs."]],
 pr:["Spinal reflexes can persist after brain death; prepare the family.","Hypothermia and sedatives are the most common confounders.","Never use ‘life support’ language after brain death declaration; the patient has died."],

/* ---------- state: completions and notes, per device, optionally synced ---------- */
const KEY='panacea.primer.v1';
let S={done:{},notes:{},read:{}};   // done[id]={on:bool,day:'YYYY-MM-DD',ts}; notes[id]={t,ts}
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){S.done=r.done||{};S.notes=r.notes||{};S.read=r.read||{}}}catch(e){}
let saveT=null;function writeNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}scheduleSync()}
function save(){clearTimeout(saveT);saveT=setTimeout(writeNow,250)}
window.addEventListener('pagehide',()=>{if(saveT)writeNow()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)writeNow()});

const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDay=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDone=id=>!!(S.done[id]&&S.done[id].on);
const isRead=(l,c)=>!!(S.read[l+':'+c]&&S.read[l+':'+c].on);
const IDX=Object.fromEntries(L.map((l,i)=>[l.id,i]));
const unitOf=u=>UNITS.find(x=>x.n===u);

function current(){return L.find(l=>!isDone(l.id))||null}
function doneToday(){const t=today();return L.filter(l=>isDone(l.id)&&S.done[l.id].day===t)}
function streak(){
  const days=new Set(Object.values(S.done).filter(d=>d.on).map(d=>d.day));
  let n=0;const d=new Date();if(!days.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n}
function readLabel(code){const b=BOOKS[code[0]],c=+code.slice(1);return{bk:b.short,ch:(c===0?'':'Ch. '+c+': ')+(b.ch[c]||'')}}

/* ---------- optional sync: reuses ICU Rounder's private GitHub repo setup on this device ---------- */
const SYNC_FILE='primer.json';
let SY=null;try{SY=JSON.parse(localStorage.getItem('icu-rounds-sync')||'null')}catch(e){}
let syncState=SY?'idle':'off',syncing=false,syncAgain=false,syncT=null;
const b64enc=str=>{const b=new TextEncoder().encode(str);let s2='';for(const x of b)s2+=String.fromCharCode(x);return btoa(s2)};
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${SY.owner}/${SY.repo}${path}`,{cache:'no-store',...opts,
    headers:{Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return (opts.headers&&opts.headers.Accept||'').includes('raw')?r.text():r.json()}
async function remoteGet(){
  try{const m=await gh('/contents/'+SYNC_FILE);const txt=m.content?b64dec(m.content):await gh('/contents/'+SYNC_FILE,{headers:{Accept:'application/vnd.github.raw+json'}});
    let doc=null;try{doc=JSON.parse(txt)}catch(e){}return{doc,sha:m.sha}}
  catch(e){if(e.status===404||e.status===409)return{doc:null,sha:null};throw e}}
function mergeMap(a,b){const out={...b};for(const[k,v]of Object.entries(a||{}))if(!out[k]||(v.ts||0)>=(out[k].ts||0))out[k]=v;return out}
function setSync(s){syncState=s;const d=document.getElementById('syncdot');if(d){d.className='syncdot '+s;d.title=syncTitle()}}
function syncTitle(){return{off:'Saved on this device',idle:'Sync ready',syncing:'Syncing…',ok:'Synced across devices',error:'Not synced right now; saved on this device'}[syncState]}
function scheduleSync(ms=1200){if(!SY)return;clearTimeout(syncT);syncT=setTimeout(syncNow,ms)}
async function syncNow(){if(!SY)return;clearTimeout(syncT);if(syncing){syncAgain=true;return}syncing=true;setSync('syncing');
  try{for(let attempt=0;;attempt++){
      const rem=await remoteGet();
      if(rem.doc){const nd=mergeMap(S.done,rem.doc.done),nn=mergeMap(S.notes,rem.doc.notes),nr=mergeMap(S.read,rem.doc.read);
        const changed=JSON.stringify(nd)!==JSON.stringify(S.done)||JSON.stringify(nn)!==JSON.stringify(S.notes)||JSON.stringify(nr)!==JSON.stringify(S.read);
        S.done=nd;S.notes=nn;S.read=nr;if(changed){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}softRender()}}
      const out={app:'primer',version:1,updated:new Date().toISOString(),done:S.done,notes:S.notes,read:S.read};
      if(rem.doc&&JSON.stringify(rem.doc.done)===JSON.stringify(out.done)&&JSON.stringify(rem.doc.notes||{})===JSON.stringify(out.notes)&&JSON.stringify(rem.doc.read||{})===JSON.stringify(out.read))break;
      try{await gh('/contents/'+SYNC_FILE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Primer sync',content:b64enc(JSON.stringify(out)),...(rem.sha?{sha:rem.sha}:{})})});break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}}
    setSync('ok')}
  catch(e){setSync('error')}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(300)}}}
function softRender(){const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA')return;render(true)}
if(SY){syncNow();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});window.addEventListener('online',syncNow)}

function route(){const h=location.hash.slice(1);if(h==='all')return{v:'all'};if(h==='books')return{v:'books'};
  const rm=h.match(/^read\/([OMVP])(\d+)$/);if(rm&&PAGES[rm[1]]&&PAGES[rm[1]].ch[rm[2]])return{v:'read',b:rm[1],c:rm[2]};if(h.startsWith('l/')&&IDX[h.slice(2)]!==undefined)return{v:'lesson',id:h.slice(2)};return{v:'today'}}

function ring(n,t){const r=24,c=2*Math.PI*r,off=c*(1-(t?n/t:0));
  return `<svg class="ring" viewBox="0 0 58 58" aria-hidden="true"><circle class="tr" cx="29" cy="29" r="${r}"/><circle class="pr" cx="29" cy="29" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text x="29" y="33.5" text-anchor="middle">${Math.round(t?n/t*100:0)}%</text></svg>`}
function progressCard(){const n=L.filter(l=>isDone(l.id)).length,st=streak();
  return `<div class="card prog">${ring(n,L.length)}<div class="txt"><div class="big">${n} of ${L.length} lessons</div><div class="sm">${st?`${st}-day streak · `:''}${UNITS.length} units, one lesson a day</div></div></div>`}

function renderToday(){
  document.title='Primer';header('Primer');
  const cur=current(),dt=doneToday();

  if(dt.length){
    const last=dt[dt.length-1];
    h+=`<div class="card"><div class="status"><span class="ck">${CK}</span><div><h2>Today’s lesson is done</h2><p>${esc(last.t)}</p></div></div>

    app.innerHTML=h;return}
  app.innerHTML=h+lessonBody(cur,true);

function lessonBody(l,isToday){

}

function renderLesson(l){document.title=l.t+' · Primer';header('Day '+(IDX[l.id]+1),'#');app.innerHTML=lessonBody(l,current()===l&&!doneToday().length)}

function renderAll(){
  document.title='All lessons · Primer';header('All lessons','#today');
  const f=filter.toLowerCase(),cur=current();

  for(const u of UNITS){
    const ls=L.filter(l=>l.u===u.n&&(!f||(l.t+' '+l.bl+' '+l.ev.map(e=>e[0]).join(' ')).toLowerCase().includes(f)));
    if(!ls.length)continue;
    const all=L.filter(l=>l.u===u.n),nd=all.filter(l=>isDone(l.id)).length;
    const open=f||(cur&&cur.u===u.n);
    h+=`<details class="unit"${open?' open':''}><summary><span class="un">${u.n}</span><span class="nm">${esc(u.t)}</span><span class="ct${nd===all.length?' all':''}">${nd}/${all.length}</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>`;
    for(const l of ls){const d=isDone(l.id);
      h+=`<button class="lrow${d?' d':''}${cur===l?' today':''}" data-go="#l/${l.id}"><span class="dn">Day ${IDX[l.id]+1}</span><span class="lt2">${esc(l.t)}${d?`<small>Done ${fmtDay(S.done[l.id].day)}</small>`:cur===l?'<small>Up next</small>':''}</span><span class="bx">${CK}</span></button>`}
    h+=`</details>`}
  const nl=Object.keys(BOOKS).filter(k=>BM[k]).length;
  h+=`<button class="btn block" data-go="#books" style="margin-top:6px">Your PDFs · ${nl} of ${Object.keys(BOOKS).length} linked on this device</button>`;
  h+=`<div class="foot">Readings point to chapters in:<ul>${Object.values(BOOKS).map(b=>`<li>${esc(b.full)}</li>`).join('')}</ul>Lessons are summaries for learning, not orders for a specific patient; check doses against your institution’s references.${SY?'':' Progress is saved on this device; if ICU Rounder sync is turned on here, Primer syncs through the same private repo.'}</div>`;
  app.innerHTML=h;
}

/* ---------- your PDFs: kept only in this browser (IndexedDB), never uploaded ---------- */
const BMKEY='panacea.primer.books';
let BM={};try{BM=JSON.parse(localStorage.getItem(BMKEY)||'{}')||{}}catch(e){}
const saveBM=()=>{try{localStorage.setItem(BMKEY,JSON.stringify(BM))}catch(e){}};
let dbP=null;
function db(){return dbP||(dbP=new Promise((res,rej)=>{const r=indexedDB.open('primer-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files',mode);const st=tx.objectStore('files');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
let pdfjsP=null;
function loadPdfjs(){return pdfjsP||(pdfjsP=new Promise((res,rej)=>{if(window.pdfjsLib){res();return}const sc=document.createElement('script');sc.src=PDFJS;
  sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');res()};sc.onerror=()=>{pdfjsP=null;rej(new Error('Couldn’t load the PDF reader. Check your connection.'))};document.head.appendChild(sc)}))}
const DOCS={};
async function getDoc(code){if(DOCS[code])return DOCS[code];
  const blob=await idb('readonly',st=>st.get(code));if(!blob)throw new Error('That PDF isn’t on this device anymore. Link it again.');
  await loadPdfjs();const data=new Uint8Array(await blob.arrayBuffer());
  DOCS[code]=await pdfjsLib.getDocument({data}).promise;return DOCS[code]}
let linking='';
async function linkBook(code,file){linking=code;render(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    await idb('readwrite',st=>st.put(file,code));delete DOCS[code];
    let pages=null;try{pages=(await getDoc(code)).numPages}catch(e){}
    BM[code]={name:file.name,size:file.size,pages,at:Date.now()};saveBM();
    const exp=PAGES[code].pages;
    toast(pages===exp?BOOKS[code].short+' linked.':pages?'Linked, but this file has '+pages+' pages (expected '+exp+'). Chapter pages may be off.':'Linked, but the file couldn’t be read as a PDF.')}
  catch(e){toast(e&&e.name==='QuotaExceededError'?'Not enough storage on this device for that file.':'Couldn’t save that file on this device.')}
  linking='';render(true)}
async function unlinkBook(code){try{await idb('readwrite',st=>st.delete(code))}catch(e){}delete BM[code];delete DOCS[code];saveBM();render(true)}
const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+' MB';
function renderBooks(){
  document.title='Your PDFs · Primer';header('Your PDFs','#bback');
  let h=`<div class="card"><p style="margin:0 0 4px">Pick your copy of each book once on this device. Readings in every lesson then open straight to the chapter.</p>
   <p class="note" style="margin-top:6px">Files stay in this browser only. They aren’t uploaded, synced, or added to PANACEA, so link them again on each phone or computer.</p></div><div class="card">`;
  for(const[k,b]of Object.entries(BOOKS)){const m=BM[k],exp=PAGES[k].pages;
    const st=linking===k?'<span class="st">Saving…</span>':m?(m.pages&&m.pages!==exp?`<span class="st bad">Linked · ${m.pages} pages, expected ${exp}; pages may be off</span>`:`<span class="st ok">Linked · ${esc(m.name)} · ${mb(m.size)}</span>`):'<span class="st">Not linked</span>';
    h+=`<div class="bkrow"><div class="tx"><div class="nm">${esc(b.short)}</div><div class="st" style="margin-bottom:2px">${esc(b.full)}</div>${st}</div>
      <div class="btnrow" style="flex:none;flex-direction:column;align-items:stretch">
      <label class="btn sm filebtn">${m?'Replace':'Choose PDF'}<input type="file" accept="application/pdf,.pdf" data-file="${k}"></label>
      ${m?`<button class="linkbtn" data-a="unlink" data-b="${k}">Remove</button>`:''}</div></div>`}
  h+=`</div>`;app.innerHTML=h}

let RD=null;
function closeReader(){if(RD){RD.obs&&RD.obs.disconnect();RD.vis&&RD.vis.disconnect();RD.dead=true;RD=null}const c=document.getElementById('pgchip');if(c)c.remove()}
async function renderReader(code,ch){
  closeReader();const b=BOOKS[code],[s0,e0]=PAGES[code].ch[ch];
  document.title=b.short+' Ch. '+ch+' · Primer';header(b.short+(+ch?' · Ch. '+ch:''),'#rback');
  app.innerHTML=`<div class="eyebrow" style="margin-top:6px">${esc(b.short)}${+ch?' · Chapter '+ch:''}</div><h2 class="lt" style="font-size:1.3rem">${esc(b.ch[ch]||'')}</h2><div class="reader" id="rdr"><div class="loading">Opening…</div></div>`;
  const me=RD={dead:false};
  let doc;try{doc=await getDoc(code)}catch(e){if(!me.dead)document.getElementById('rdr').innerHTML=`<div class="card" style="width:100%"><p style="margin:0 0 10px">${esc(e.message)}</p><button class="btn sm" data-go="#books">Your PDFs</button></div>`;return}
  if(me.dead)return;
  const s=Math.min(s0,doc.numPages),e=Math.min(e0,doc.numPages);
  const first=await doc.getPage(s);const vp1=first.getViewport({scale:1});const ratio=vp1.height/vp1.width;
  const box=document.getElementById('rdr');box.innerHTML='';
  for(let p=s;p<=e;p++){const d=document.createElement('div');d.className='pg';d.dataset.p=p;d.style.aspectRatio=(1/ratio).toFixed(4);d.innerHTML=`<span class="pn">${p-s+1} / ${e-s+1}</span>`;box.appendChild(d)}
  const end=document.createElement('div');end.className='btnrow';end.style.margin='14px 0';end.innerHTML=`<button class="btn" data-go="#rback">Back to the lesson</button>`;box.appendChild(end);
  const chip=document.createElement('div');chip.className='pgchip';chip.id='pgchip';chip.textContent=`Page 1 of ${e-s+1}`;document.body.appendChild(chip);
  const rendered=new Map();
  async function draw(el){const p=+el.dataset.p;if(rendered.has(p)||me.dead)return;rendered.set(p,'busy');
    try{const pg=await doc.getPage(p);if(me.dead)return;const w=el.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(me.dead||!rendered.has(p))return;el.prepend(cv);rendered.set(p,cv)}
    catch(err){rendered.delete(p)}}
  function drop(el){const p=+el.dataset.p,cv=rendered.get(p);if(cv&&cv!=='busy'){cv.width=cv.height=0;cv.remove()}rendered.delete(p)}
  me.obs=new IntersectionObserver(es=>{for(const x of es){if(x.isIntersecting)draw(x.target);else drop(x.target)}},{rootMargin:'1200px 0px'});
  me.vis=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){chip.textContent=`Page ${+x.target.dataset.p-s+1} of ${e-s+1}`}},{rootMargin:'-45% 0px -45% 0px'});
  box.querySelectorAll('.pg').forEach(el=>{me.obs.observe(el);me.vis.observe(el)});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const to=g.dataset.go;if(to==='#l/')return;
    if(to==='#today'){location.hash='';return}
    if(to==='#rback'){location.hash=sessionStorage.getItem('primer.readBack')||'';return}
    if(to==='#bback'){location.hash=sessionStorage.getItem('primer.booksBack')||'all';sessionStorage.removeItem('primer.booksBack');return}
    if(to==='#'){location.hash=sessionStorage.getItem('primer.back')||'';return}
    const v=route().v;if(to.startsWith('#l/')&&v!=='lesson')sessionStorage.setItem('primer.back',v==='all'?'all':'');
    location.hash=to.slice(1);return}
  const rd=e.target.closest('[data-read]');
  if(rd){const c=rd.dataset.read;sessionStorage.setItem('primer.readBack','l/'+rd.dataset.from);
    if(BM[c[0]])location.hash='read/'+c;else{sessionStorage.setItem('primer.booksBack','l/'+rd.dataset.from);location.hash='books'}return}
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='unlink'){unlinkBook(b.dataset.b);return}
  if(b.dataset.a==='rtick'){const key=b.dataset.l+':'+b.dataset.c,on=!isRead(b.dataset.l,b.dataset.c);S.read[key]={on,ts:Date.now()};save();
    const li=b.closest('li');li.classList.toggle('rd',on);b.setAttribute('aria-checked',on);
    const l=L[IDX[b.dataset.l]],n=l.r.filter(c=>isRead(l.id,c)).length,ct=document.getElementById('rdct');if(ct)ct.textContent=`${n} of ${l.r.length} read`;
    if(on&&n===l.r.length&&!isDone(l.id))toast('All readings done. Complete the lesson when you’re ready.');return}
  if(b.dataset.a==='reveal'){const q=document.getElementById('qz');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Hide answer':'Show answer'}
  else if(b.dataset.a==='done'){const id=b.dataset.id;const wasToday=route().v==='today';S.done[id]={on:true,day:today(),ts:Date.now()};save();
    toast('Lesson complete.');if(wasToday){location.hash='';render()}else render(true)}
  else if(b.dataset.a==='undo'){S.done[b.dataset.id]={on:false,day:'',ts:Date.now()};save();render(true)}
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.file&&t.files&&t.files[0])linkBook(t.dataset.file,t.files[0])});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filter=t.value;const p=t.selectionStart;renderAll();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.note){S.notes[t.dataset.note]={t:t.value,ts:Date.now()};save()}
});
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
window.addEventListener('hashchange',()=>render());
/* Always open on All lessons, not the last screen. */
if(location.hash!=='#all')history.replaceState(null,'',location.pathname+location.search+'#all');
window.addEventListener('pageshow',e=>{if(e.persisted&&location.hash!=='#all'){history.replaceState(null,'',location.pathname+location.search+'#all');render()}});
render();
</script>
