<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A/P">
<link rel="apple-touch-icon" href="../admit/icon.png">

<meta name="theme-color" content="#EBEFF2">
<title>A/P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
[hidden]{display:none!important}
/* Layout: seven tabs on the left (patient → note), the live H&P pinned on the right; one column on phones.
   Fixed light theme to match the rest of PANACEA. */
html,body{margin:0}
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-soft:#E1E9FB; --accent-ink:#FFFFFF;
  --ok:#1D6E49; --ok-soft:#E1F2E9; --warn:#8A4300; --warn-soft:#FCEFDF; --alert:#A3122B; --alert-soft:#FBE6E9;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.01em;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1840AE;color:var(--accent-ink)}
.btn.small{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--alert)}
.btn:focus-visible,.chip:focus-visible,.info:focus-visible,.stepbtn:focus-visible,input:focus-visible,textarea:focus-visible,.homebtn:focus-visible,.pi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0;position:relative}
.stepbtn .n{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0}
.stepbtn.done .dot{opacity:1}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.stepbtn[aria-current="step"] .n{color:var(--accent)}
@media (max-width:760px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.stepbtn{padding:6px 8px}.stepbtn .t{font-size:.8rem}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.ph .cue{margin:2px 0 0;color:var(--muted);font-size:.93rem;max-width:66ch}
.pfoot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.flab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.93rem}
.flab .sub{font-weight:400;color:var(--muted);font-size:.84rem}
.info{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:.74rem;font-style:italic;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;min-height:36px;line-height:1.2;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>.in{flex:1 1 140px}
.in{display:flex;flex-direction:column;gap:4px;min-width:0}
.in>span{font-size:.8rem;color:var(--muted);font-weight:700}
.in input,.in textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 10px;width:100%;font-size:.95rem;outline:0}
.in textarea{resize:vertical;min-height:64px;line-height:1.4}
.in input:focus,.in textarea:focus{border-color:var(--accent)}
.in.s{flex:0 1 110px}
.hint{margin:0;font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.calcout{margin:0;font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:8px 11px}
.sep{height:1px;background:var(--line)}
.gt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* problem library & cards */
.lib{display:flex;flex-direction:column;gap:12px}
.lib .sys{display:flex;flex-direction:column;gap:6px}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pch{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--sunk);border-bottom:1px solid var(--line)}
.pch .hash{font-weight:700;color:var(--accent)}
.pch input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:1rem;outline:0;padding:4px 2px}
.pch input:focus{background:var(--surface);border-radius:6px}
.pcb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.pcb .in textarea{min-height:48px}
.items{display:flex;flex-direction:column;gap:2px}
.pi{display:flex;align-items:flex-start;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:.9rem;line-height:1.35}
.pi:hover{background:var(--sunk)}
.dest{font-weight:400;color:var(--muted);font-size:.78rem}
.pdata{margin:0 6px;font-size:.84rem;color:var(--muted)}
.comb{display:block;width:100%;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-size:.8rem;font-weight:700;padding:5px 10px;text-align:left;cursor:pointer}
.comb:hover{background:var(--accent-soft)}
.pcard.grouped{border-color:var(--accent)}
.pcard.grouped .pch+.pch{border-top:0}
.pi.merged .tx{text-decoration:line-through;text-decoration-color:#9AA7B4}
.pi .why{text-decoration:none;display:inline;font-size:.78rem;color:var(--muted);font-style:italic}
.conf{margin:0 6px;font-size:.84rem;color:#9A3412;font-weight:700}
.btn.sug{margin:0 0 8px 0;text-align:left}
.medgrp{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.mlab{margin:0 0 2px 6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pi .bx{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #9AA7B4;margin-top:1px;display:grid;place-items:center}
.pi[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.pi[aria-pressed="true"] .bx::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.pi[aria-pressed="false"] .tx{color:var(--muted)}
.mv{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:1rem}
.mv:hover{background:var(--surface);color:var(--ink)}
.empty{margin:0;color:var(--muted);font-size:.92rem}
.rec{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rec h3{margin:0;font-size:1rem}
.rec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.rec .note{font-size:.82rem;color:var(--muted);margin:0}
.rec .tag{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 92px);overflow:auto}
@media (max-width:980px){.out{position:static;max-height:none}}
.out h3{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dict{white-space:pre-wrap;font-size:.84rem;line-height:1.5;background:var(--bg);border-radius:10px;padding:12px;margin:0;font-family:var(--f-body);overflow-wrap:anywhere}
.outbtns{display:flex;gap:8px;flex-wrap:wrap}
.outbtns .btn{flex:1}
.toast{font-size:.84rem;color:var(--accent);min-height:1.2em;margin:0}
.toast a{color:var(--accent);font-weight:700}
.pop{position:fixed;z-index:50;width:380px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,35,58,.18);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:min(74vh,600px);overflow:auto}
.pop .pt{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pop p,.pop li{margin:0;font-size:.88rem}
.pop ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pop .close{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
@media (max-width:640px){.pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;max-height:72vh;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.privacy{font-size:.82rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* A/P writer */
.wrap{max-width:1240px}
.grid{grid-template-columns:minmax(0,1fr) 460px}
#panes{display:flex;flex-direction:column;gap:18px;min-width:0}
.flab .sub,.in .sub{font-weight:400;color:var(--muted);font-size:.8rem}
.libd summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--accent);padding:4px 0}
.libd .lib{margin-top:10px}
.sect{margin:4px 0 0;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gf{display:flex;flex-direction:column;gap:6px;padding:8px 0 10px;border-bottom:1px dashed var(--line)}
.gfl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gfl .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.74rem;display:grid;place-items:center;align-self:center}
.gfl .gft{font-weight:700;font-size:.92rem}
.gfl .gfc{color:var(--muted);font-size:.82rem}
.gf textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;width:100%;font-size:.93rem;outline:0;resize:vertical;line-height:1.4;font-family:var(--f-body)}
.gf textarea:focus{border-color:var(--accent)}
.chips.sm{gap:5px}
.chip.sm{min-height:30px;padding:4px 10px;font-size:.8rem;background:var(--sunk)}
.chip.sm[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pvw{margin:4px 0 2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:.9rem;line-height:1.5}
.muted{color:var(--muted)}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--accent);font:inherit;font-size:.84rem;font-weight:700;padding:2px 0;cursor:pointer}
mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 1px}
.dict{white-space:normal;font-family:Arial,var(--f-body);font-size:.88rem;line-height:1.45;background:var(--surface);border:1px solid var(--line)}
.dict p{margin:0}
.dict .sumout{margin-bottom:12px}
.dict .blk{margin-bottom:14px}
.dict .blk:last-child{margin-bottom:0}
.dict .ba.empty{color:var(--muted);font-style:italic}
.dict ul{margin:2px 0 0;padding-left:20px}
.dict li{margin:1px 0}
.outh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.privacy{font-size:.8rem;color:var(--muted);margin:0}
.out{top:16px;max-height:calc(100vh - 32px)}
@media (max-width:980px){.out{max-height:none}}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>A/P</h1></div>
      <p>Assessment and plan writer: each problem as a header, an italic assessment built from what matters, and a bulleted plan.</p>
    </div>
    <button class="btn" id="reset" type="button">New patient</button>
  </header>
  <div class="grid">
    <main id="panes"></main>
    <aside class="out" aria-live="polite">
      <div class="outh"><h3>Assessment and plan</h3><button type="button" class="tog" id="tc" aria-pressed="true" title="Capitalize problem headers">Title Case</button></div>
      <div class="dict" id="dict"></div>
      <div class="outbtns">
        <button class="btn primary" id="copyRich" type="button">Copy A/P</button>
        <button class="btn" id="copyPlain" type="button">Copy plain text</button>
      </div>
      <p class="toast" id="toast"></p>
      <p class="privacy">Copy A/P keeps the italics and bullets when pasted into Epic or Word. Nothing is saved or sent anywhere. Do not enter names, MRNs or dates of birth.</p>
    </aside>
  </div>
</div>
<div class="pop" id="pop" hidden role="dialog"></div>
<script>
/* =========================================================
   Content (problem library, data prompts and home-med templates copied from Admit)
   ========================================================= */
const PMH=[['htn','HTN'],['hld','HLD'],['dm2','DM2',['a1c','insulin']],['dm1','DM1',['a1c','insulin']],['cad','CAD / prior MI',['cath','echo']],['hfref','HFrEF',['echo','dryWt']],['hfpef','HFpEF',['echo','dryWt']],['afib','Atrial fibrillation',['anticoag']],['copd','COPD',['homeO2','pft']],['asthma','Asthma',['pft']],['osa','OSA',['cpap']],['ckd','CKD',['baseCr']],['esrd','ESRD on HD',['dialysis']],['cirrhosis','Cirrhosis',['liver']],['cva','Prior CVA',['baseFx']],['vte','Prior DVT/PE',['anticoag']],['cancer','Active cancer',['onc']],['immuno','Immunosuppressed',['immuno']],['etoh','Alcohol use disorder',['etohHx']],['dementia','Dementia',['baseFx']],['hypothyroid','Hypothyroidism'],['gerd','GERD'],['depression','Depression/anxiety'],['bph','BPH']];
// Pertinent data prompts
const DATA={
 echo:['Last echo','date ***, EF ***%, RV ***, valves ***, PASP ***'],

 ekg:['EKG today','rhythm ***, QTc ***, ischemic changes ***'],

};
const SYS=[['neuro','Neuro'],['pulm','Pulmonary'],['cv','Cardiovascular'],['renal','Renal & lytes'],['gi','GI & liver'],['id','Infectious'],['heme','Heme'],['endo','Endocrine'],['other','Other'],['chronic','Chronic, stable']];
// Problem library: key -> {sys, name, a: assessment template, items: plan bullets ('?' prefix = off by default), data: prompt keys, tip}
const LIB={
 // Neuro

/* =========================================================
   State
   ========================================================= */
let S;
const SETTINGS=[['ED','ED','In the ED, '],['OSH','Outside hospital','At the outside hospital, '],['Floor','Floor (RRT / transfer)','On the floor, '],['Direct','Direct admit','On arrival, ']];
function blank(){return {set:'ED',cx:[],tc:true,sum:'',probs:[]}}
S=blank();
let q='';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dirty=()=>!!(S.probs.length||S.sum.trim());
const isChronic=k=>(LIB[k]&&LIB[k].sys==='chronic')||k==='ckd'||k==='esrd';
const clean=n=>n.replace(/ \*\*\*$/,'').replace(', source','');
const fixAbx=t=>t.replace(/ \(see antibiotic plan[^)]*\)/,': ***');

/* ---------- the paragraph's five parts ---------- */
const FIELDS=[
 {k:'p',t:'Presentation',cue:'What brought them in: the symptoms, onset and course.',lead:'Presented with ',skip:/^(present|brought|found|transferred|was |were |admitted|sent|came|called|patient|pt )/i,sep:', ',ph:'e.g. 3 days of progressive dyspnea and productive cough'},
 {k:'h',t:'Pertinent history',cue:'Only the history that bears on this problem.',lead:'History notable for ',skip:/^(history|hx|pmh|known|with |has |he |she |they |on |baseline|no )/i,sep:', ',ph:'e.g. COPD on 2 L home O2, 40 pack-years'},
 {k:'e',t:'Findings',cue:'Vitals, exam, labs and imaging that define the problem.',lead:null,skip:/^(in the|at the|on the|on arrival|upon|initial|initially|here)/i,sep:'; ',ph:'e.g. SpO2 84% on RA, RR 30; CXR with RLL consolidation'},
 {k:'t',t:'Treatment so far',cue:'What was given and how they responded.',lead:'Treated with ',skip:/^(treated|received|given|started|was |were |placed|underwent|intubated|s\/p|no )/i,sep:', ',ph:'e.g. DuoNebs, methylprednisolone and BiPAP, with improvement'},
 {k:'i',t:'Assessment',cue:'Your read: likely cause, severity, where they are now.',lead:'',skip:null,sep:'; ',ph:'e.g. Likely 2/2 CAP; now on 4 L NC'}
];
const CHRONIC_FIELDS=['h','i'];
function setLead(){return (SETTINGS.find(s=>s[0]===S.set)||SETTINGS[0])[2]}
function fieldTitle(f){if(f.k==='e')return {ED:'Findings in the ED',OSH:'Findings at the outside hospital',Floor:'Findings on the floor',Direct:'Findings on arrival'}[S.set];if(f.k==='t')return S.set==='ED'?'Treatment in the ED':f.t;return f.t}
function fieldsFor(p){const ch=isChronic(p.key);return FIELDS.filter(f=>!ch||CHRONIC_FIELDS.includes(f.k)||(p.f[f.k]||'').trim()||p.more)}

function chipsFor(p,k){
  const pr=PERT[p.key]||{},ch=isChronic(p.key);
  let list=(pr[k]||[]).slice();
  if(k==='e'&&!pr.e){const L=LIB[p.key]||{};(L.data||[]).forEach(d=>{if(DATA[d])list.push(DATA[d][0]+'|'+DATA[d][0].replace(/^([A-Z][a-z])/,m=>m.toLowerCase())+' '+DATA[d][1])})}
  const g=(ch?GEN_CHRONIC:GEN)[k]||[];
  const seen=new Set(list.map(x=>x.split('|')[0].toLowerCase()));
  g.forEach(x=>{if(!seen.has(x.split('|')[0].toLowerCase()))list.push(x)});
  return list.map(x=>{const i=x.indexOf('|');return i<0?{l:x.replace(/ ?\*\*\*/g,''),v:x}:{l:x.slice(0,i),v:x.slice(i+1)}});
}

// a prompt shows as used once its longest fixed wording appears in the field
function chipOn(c,val){const k=c.v.split('***').map(x=>x.replace(/^[\s,;:()\/%-]+|[\s,;:()\/%-]+$/g,'')).sort((a,b)=>b.length-a.length)[0].toLowerCase();return !!val&&k.length>1&&String(val).toLowerCase().includes(k)}
/* ---------- writing ---------- */
const upFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lowFirst=s=>/^[A-Z][a-z]/.test(s)&&!/^(I |I'|[A-Z][a-z]+[A-Z])/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;
function sentence(txt,f){
  let t=String(txt||'').replace(/\s+/g,' ').trim().replace(/[;,]$/,'').trim();
  if(!t)return '';
  const lead=f.k==='e'?setLead():f.lead;
  if(lead&&!(f.skip&&f.skip.test(t)))t=lead+lowFirst(t);
  t=upFirst(t);
  if(!/[.!?]$/.test(t))t+='.';
  return t;
}
function para(p){return fieldsFor(p).map(f=>sentence(p.f[f.k],f)).filter(Boolean).join(' ')}
const SMALL=new Set(['a','an','and','as','at','by','for','in','of','on','or','the','to','with','vs','from','per','via']);
function title(n){if(!S.tc)return n;return n.split(/(\s+|\/|-|\()/).map((w,i,a)=>{if(!/^[a-z]/.test(w))return w;if(i>0&&SMALL.has(w))return w;return upFirst(w)}).join('')}
function plan(p){return p.items.filter(i=>i.on).map(i=>i.t).concat((p.extra||'').split('\n').map(s=>s.trim()).filter(Boolean))}
function blocks(){return S.probs.map(p=>({h:'# '+title(p.name.trim()||'***'),a:para(p),pl:plan(p)}))}
function plainText(){
  const out=[];if(S.sum.trim())out.push(S.sum.trim());
  blocks().forEach(b=>out.push([b.h,b.a,...b.pl.map(x=>'- '+x)].filter(Boolean).join('\n')));
  return out.join('\n\n');
}
function richHTML(){
  const f='font-family:Arial,sans-serif;font-size:11pt;';
  const out=[];if(S.sum.trim())out.push(`<p style="${f}margin:0 0 10pt">${esc(S.sum.trim())}</p>`);
  blocks().forEach(b=>out.push(`<p style="${f}margin:0">${esc(b.h)}</p>${b.a?`<p style="${f}margin:0"><i>${esc(b.a)}</i></p>`:''}${b.pl.length?`<ul style="${f}margin:0 0 10pt;padding-left:20pt">${b.pl.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p style="margin:0 0 10pt"></p>'}`));
  return out.join('');
}
function previewHTML(){
  const out=[];if(S.sum.trim())out.push(`<p class="sumout">${esc(S.sum.trim())}</p>`);
  blocks().forEach(b=>out.push(`<div class="blk"><p class="bh">${esc(b.h)}</p>${b.a?`<p class="ba"><i>${hl(b.a)}</i></p>`:'<p class="ba empty">Assessment paragraph goes here.</p>'}${b.pl.length?`<ul>${b.pl.map(x=>`<li>${hl(x)}</li>`).join('')}</ul>`:''}</div>`));
  return out.join('');
}
const hl=s=>esc(s).replace(/\*\*\*/g,'<mark>***</mark>');

/* ---------- problems ---------- */
function addProb(key){const L=LIB[key];if(!L||S.probs.some(p=>p.key===key))return;
  const np={id:uid(),key,name:L.name,f:{p:'',h:'',e:'',t:'',i:L.a||''},
    items:L.items.map(t=>({t:fixAbx(t.replace(/^\?/,'')),on:!t.startsWith('?')})).concat((MEDS[key]||[]).map(medItem)),extra:''};
  if(isChronic(key))S.probs.push(np);else{const i=S.probs.findIndex(p=>isChronic(p.key));if(i<0)S.probs.push(np);else S.probs.splice(i,0,np)}
  recalcMeds();return np}

/* =========================================================
   UI
   ========================================================= */
const seg=(name,opts,cur)=>`<div class="chips">${opts.map(([v,l])=>`<button type="button" class="chip" data-${name}="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`;
function libPane(){
  const chosen=new Set(S.probs.map(p=>p.key));
  const chip=k=>`<button type="button" class="chip" data-prob="${k}" data-name="${esc(clean(LIB[k].name).toLowerCase())}" aria-pressed="${chosen.has(k)}">${esc(clean(LIB[k].name))}</button>`;
  const sug=[...new Set(S.cx.flatMap(c=>(COMPLAINTS.find(x=>x[0]===c)||[,,[]])[2]))].filter(k=>LIB[k]);
  return `<section class="pane">
    <div class="ph"><span class="eb">1</span><h2>Presentation</h2><p class="cue">Where they came from sets how findings are introduced. Presenting complaints suggest problems.</p></div>
    <div class="field"><div class="flab">Presenting from</div>${seg('set',SETTINGS.map(s=>[s[0],s[1]]),S.set)}</div>
    <div class="field"><div class="flab">Presenting complaint <span class="sub">optional</span></div><div class="chips">${COMPLAINTS.map(([k,l])=>`<button type="button" class="chip" data-cx="${k}" aria-pressed="${S.cx.includes(k)}">${esc(l)}</button>`).join('')}</div></div>
    <label class="in"><span>Summary statement <span class="sub">optional; prints above the first problem</span></span><textarea data-sum rows="2" placeholder="e.g. 68 y/o M with COPD (2 L home O2) and HFrEF (EF 30%) presenting with 3 days of dyspnea, admitted for acute hypoxemic respiratory failure.">${esc(S.sum)}</textarea></label>
  </section>
  <section class="pane">
    <div class="ph"><span class="eb">2</span><h2>Problems</h2><p class="cue">Pick each problem, most acute first. Each comes with the plan from Admit, which you can trim.</p></div>
    ${sug.length?`<div class="field"><p class="gt" style="color:var(--accent)">Suggested for ${esc(S.cx.map(c=>COMPLAINTS.find(x=>x[0]===c)[1].toLowerCase()).join(', '))}</p><div class="chips">${sug.map(chip).join('')}</div></div>`:''}
    <label class="in"><span>Find a problem</span><input id="q" type="search" value="${esc(q)}" placeholder="e.g. hypoxemic, AKI, sepsis" autocomplete="off"></label>
    <details class="libd"${S.probs.length&&!q?'':' open'}><summary>All problems by system</summary>
      <div class="lib">${SYS.map(([s,l])=>{const ks=Object.keys(LIB).filter(k=>LIB[k].sys===s);return ks.length?`<div class="sys" data-sys><p class="gt">${l}</p><div class="chips">${ks.map(chip).join('')}</div></div>`:''}).join('')}</div>
    </details>
    <div class="row"><label class="in"><span>Custom problem</span><input id="custom" placeholder="e.g. Hypomagnesemia" autocomplete="off"></label><div style="align-self:flex-end"><button type="button" class="btn" data-act="addCustom">Add</button></div></div>
  </section>`;
}
function card(p,i){
  const L=LIB[p.key]||{},n=S.probs.length,ch=isChronic(p.key);
  const fs=fieldsFor(p);
  const fieldHTML=fs.map((f,j)=>{const cs=chipsFor(p,f.k),val=p.f[f.k]||'';
    return `<div class="gf"><div class="gfl"><span class="num">${j+1}</span><span class="gft">${esc(fieldTitle(f))}</span><span class="gfc">${esc(f.cue)}</span></div>
      ${cs.length?`<div class="chips sm">${cs.map((c,ci)=>`<button type="button" class="chip sm" data-ins="${p.id}" data-f="${f.k}" data-ci="${ci}" aria-pressed="${chipOn(c,val)}" title="${esc(c.v)}">${esc(c.l)}</button>`).join('')}</div>`:''}
      <textarea data-pf="${p.id}.${f.k}" rows="${f.k==='e'?3:2}" placeholder="${esc(f.ph)}">${esc(val)}</textarea></div>`}).join('');
  const plans=p.items.map((it,j)=>[it,j]),gen=plans.filter(([it])=>!it.med),meds=plans.filter(([it])=>it.med);
  const btn=([it,j])=>`<button type="button" class="pi" data-item="${p.id}" data-j="${j}" aria-pressed="${it.on}"><span class="bx"></span><span class="tx">${esc(it.t)}</span></button>`;
  const pv=para(p);
  return `<div class="pcard" id="c-${p.id}">
    <div class="pch"><span class="hash">#</span><input data-pn="${p.id}" value="${esc(p.name)}" aria-label="Problem name">
      <button type="button" class="mv" data-move="${p.id}" data-d="-1" aria-label="Move up" ${i?'':'disabled'}>↑</button><button type="button" class="mv" data-move="${p.id}" data-d="1" aria-label="Move down" ${i<n-1?'':'disabled'}>↓</button>
      ${L.tip||L.ref?`<button type="button" class="info" data-tipk="${p.key}" aria-label="Key points and reference">i</button>`:''}<button type="button" class="mv" data-del="${p.id}" aria-label="Remove problem">×</button></div>
    <div class="pcb">
      <p class="sect">Assessment paragraph</p>
      ${fieldHTML}
      ${ch?`<button type="button" class="linkbtn" data-more="${p.id}">${p.more?'Fewer fields':'Add presentation, findings, treatment'}</button>`:''}
      <p class="pvw" data-pv="${p.id}">${pv?`<i>${hl(pv)}</i>`:'<span class="muted">The paragraph builds here as you fill the parts above. Leave *** where you still need to look something up.</span>'}</p>
      <p class="sect">Plan</p>
      ${gen.length?`<div class="items">${gen.map(btn).join('')}</div>`:''}
      ${meds.length?`<div class="medgrp"><p class="mlab">Home meds (PTA)</p><div class="items">${meds.map(btn).join('')}</div></div>`:''}
      <label class="in"><span>More plan</span><textarea data-pp="${p.id}" rows="2" placeholder="One item per line">${esc(p.extra)}</textarea></label>
    </div></div>`;
}
function render(keep){
  const y=scrollY,a=document.activeElement,af=a&&(a.dataset.pf||a.dataset.pp||a.dataset.pn||(a.id==='q'?'#q':null)),sel=af&&[a.selectionStart,a.selectionEnd];
  document.getElementById('panes').innerHTML=libPane()+`<section class="pane"><div class="ph"><span class="eb">3</span><h2>Assessment and plan</h2><p class="cue">For each problem, build the paragraph in order: presentation, pertinent history, findings, treatment so far, then your assessment. Tap a prompt to drop in its wording with *** blanks; the first blank is selected so you can type straight over it.</p></div>
    <div class="pcards">${S.probs.length?S.probs.map(card).join(''):'<p class="empty">No problems yet. Pick one above.</p>'}</div></section>`;
  if(keep)scrollTo(0,y);
  if(af){const el=af==='#q'?document.getElementById('q'):document.querySelector(`[data-pf="${af}"],[data-pp="${af}"],[data-pn="${af}"]`);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  applyQ();update();
}
function applyQ(){const v=q.trim().toLowerCase();document.querySelectorAll('.libd [data-prob]').forEach(b=>b.hidden=!!v&&!b.dataset.name.includes(v));document.querySelectorAll('.libd [data-sys]').forEach(s=>s.hidden=!!v&&!s.querySelector('[data-prob]:not([hidden])'));const d=document.querySelector('.libd');if(d&&v)d.open=true}
function update(){
  const d=document.getElementById('dict');
  d.innerHTML=dirty()?previewHTML():'<p class="muted">Pick a problem to start. The A/P prints here as you write: the problem as a header, the assessment in italics, and the plan as bullets.</p>';
  document.getElementById('tc').setAttribute('aria-pressed',S.tc);
}
function updateCard(p){const el=document.querySelector(`[data-pv="${p.id}"]`);if(el){const pv=para(p);el.innerHTML=pv?`<i>${hl(pv)}</i>`:'<span class="muted">The paragraph builds here as you fill the parts above.</span>'}
  document.querySelectorAll(`[data-ins="${p.id}"]`).forEach(b=>{const c=chipsFor(p,b.dataset.f)[+b.dataset.ci];b.setAttribute('aria-pressed',chipOn(c,p.f[b.dataset.f]))})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',2600)}
function insert(p,k,v){
  const f=FIELDS.find(x=>x.k===k);let cur=(p.f[k]||'').replace(/\s+$/,'').replace(/[.;,]$/,'');
  const start=cur?cur.length+f.sep.length:0;p.f[k]=cur?cur+f.sep+v:v;
  render(true);
  const ta=document.querySelector(`[data-pf="${p.id}.${k}"]`);if(!ta)return;
  ta.focus({preventScroll:true});const at=p.f[k].indexOf('***',start);
  if(at>=0)ta.setSelectionRange(at,at+3);else ta.setSelectionRange(p.f[k].length,p.f[k].length);
}

/* ---------- popovers (problem key points) ---------- */
const pop=document.getElementById('pop');let pinned=false,anchor=null;
function closePop(){pop.hidden=true;pinned=false;anchor=null}
function openPop(html,el){pop.innerHTML=html;pop.hidden=false;anchor=el;pinned=true;
  if(innerWidth<=640){pop.style.left='';pop.style.top='';return}
  const r=el.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  const x=Math.min(Math.max(12,r.left-200),innerWidth-pw-12),below=innerHeight-r.bottom>ph+20;
  pop.style.left=x+'px';pop.style.top=Math.max(8,below?r.bottom+8:r.top-8-ph)+'px'}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.close')){closePop();return}
  if(!pop.hidden&&!t.closest('#pop')&&!t.closest('[data-tipk]'))closePop();
  const st=t.closest('[data-set]');if(st){S.set=st.dataset.set;render(true);return}
  const cx=t.closest('[data-cx]');if(cx){const k=cx.dataset.cx;S.cx=S.cx.includes(k)?S.cx.filter(x=>x!==k):S.cx.concat(k);render(true);return}
  const pr=t.closest('[data-prob]');if(pr){const k=pr.dataset.prob;if(S.probs.some(p=>p.key===k)){S.probs=S.probs.filter(p=>p.key!==k);recalcMeds()}else addProb(k);render(true);return}
  const ins=t.closest('[data-ins]');if(ins){const p=S.probs.find(x=>x.id===ins.dataset.ins);if(p){const c=chipsFor(p,ins.dataset.f)[+ins.dataset.ci];insert(p,ins.dataset.f,c.v)}return}
  const it=t.closest('[data-item]');if(it){const p=S.probs.find(x=>x.id===it.dataset.item);const x=p.items[+it.dataset.j];x.on=!x.on;x.touched=true;it.setAttribute('aria-pressed',x.on);update();return}
  const mv=t.closest('[data-move]');if(mv){const i=S.probs.findIndex(x=>x.id===mv.dataset.move),j=i+(+mv.dataset.d);if(i>=0&&j>=0&&j<S.probs.length){[S.probs[i],S.probs[j]]=[S.probs[j],S.probs[i]]}render(true);return}
  const dl=t.closest('[data-del]');if(dl){S.probs=S.probs.filter(x=>x.id!==dl.dataset.del);recalcMeds();render(true);return}
  const mo=t.closest('[data-more]');if(mo){const p=S.probs.find(x=>x.id===mo.dataset.more);if(p){p.more=!p.more;render(true)}return}
  const tk=t.closest('[data-tipk]');if(tk){if(anchor===tk&&!pop.hidden){closePop();return}const L=LIB[tk.dataset.tipk];openPop(`<div class="pt"><span>${esc(L.name)}</span><button class="close" type="button" aria-label="Close">×</button></div>${L.tip?`<p>${esc(L.tip)}</p>`:''}${L.ref?`<p style="color:var(--muted);font-size:.8rem">${esc(L.ref)}</p>`:''}`,tk);return}
  const act=t.closest('[data-act]');if(act){const a=act.dataset.act;
    if(a==='addCustom'){const el=document.getElementById('custom'),v=el.value.trim();if(v){S.probs.splice(Math.max(0,S.probs.findIndex(p=>isChronic(p.key)))>=0&&S.probs.some(p=>isChronic(p.key))?S.probs.findIndex(p=>isChronic(p.key)):S.probs.length,0,{id:uid(),key:'custom',name:v,f:{p:'',h:'',e:'',t:'',i:''},items:[],extra:''});render(true)}}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)closePop();if(e.key==='Enter'&&e.target.id==='custom'){e.preventDefault();document.querySelector('[data-act="addCustom"]').click()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){q=t.value;applyQ();return}
  if('sum' in t.dataset){S.sum=t.value;update();return}
  if(t.dataset.pf){const [id,k]=t.dataset.pf.split('.');const p=S.probs.find(x=>x.id===id);if(p){p.f[k]=t.value;updateCard(p);update()}return}
  if(t.dataset.pp){const p=S.probs.find(x=>x.id===t.dataset.pp);if(p){p.extra=t.value;update()}return}
  if(t.dataset.pn){const p=S.probs.find(x=>x.id===t.dataset.pn);if(p){p.name=t.value;update()}return}
});
document.getElementById('tc').addEventListener('click',()=>{S.tc=!S.tc;update()});
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
document.getElementById('reset').addEventListener('click',function(){if(dirty()&&!this.dataset.armed){this.dataset.armed='1';this.textContent='Tap again to clear';setTimeout(()=>{delete this.dataset.armed;this.textContent='New patient'},3000);return}
  delete this.dataset.armed;this.textContent='New patient';S=blank();q='';render();scrollTo(0,0);toast('Cleared.')});
function selectPreview(){const d=document.getElementById('dict');const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r)}
async function copyRich(){
  if(!dirty()){toast('Nothing to copy yet.');return}
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([richHTML()],{type:'text/html'}),'text/plain':new Blob([plainText()],{type:'text/plain'})})]);
      toast('A/P copied with italics and bullets.');return}
    throw 0;
  }catch(_){selectPreview();try{if(document.execCommand('copy')){getSelection().removeAllRanges();toast('A/P copied with italics and bullets.');return}}catch(__){}toast('Copy blocked here; the A/P is selected. Press Ctrl/⌘ C.')}
}
async function copyPlain(){
  if(!dirty()){toast('Nothing to copy yet.');return}
  try{await navigator.clipboard.writeText(plainText());toast('Plain text copied (no italics; plan lines start with "- ").')}
  catch(_){selectPreview();toast('Copy blocked here; the A/P is selected. Press Ctrl/⌘ C.')}
}
document.getElementById('copyRich').addEventListener('click',copyRich);
document.getElementById('copyPlain').addEventListener('click',copyPlain);
render();
</script>
</body>
