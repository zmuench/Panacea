<style>
/* Layout: one narrow working column, step rail on top, thumb-reach nav bar on the bottom.
   Palette and type match ICU Rounder, Dispo and Nenya: fixed light theme, blue-gray ground, navy ink, royal blue accent. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-ink:#FFFFFF; --accent-soft:#E1E9FB;
  --pos:#A8261C; --pos-soft:#FBE7E5; --neg:#1D6E49; --neg-soft:#E1F2E9;
  --warn:#7A5000; --warn-soft:#FBF0D9; --paper:#FBFCFD;
  --f-display:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-note:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.brandrow{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:28px;height:28px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:3px}
.sp{flex:1}
.iconbtn{width:44px;padding:0;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on svg{stroke:var(--accent)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;white-space:nowrap}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.rail button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail{display:flex;gap:6px;overflow-x:auto;padding-inline:16px;padding-block:2px 10px;max-width:720px;margin:0 auto;scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;font:400 .9rem var(--f-body);border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.rail button.has{color:var(--ink)}
.rail button.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rail button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.rail button.cur::after{background:var(--bg)}
.banner{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 200px}
h1.step{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:20px 0 4px;letter-spacing:-.01em;text-wrap:balance}
h1.step .k{color:var(--accent);margin-right:8px}
.lede{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:60ch}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h2{font:700 1rem var(--f-body);margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h2 .aside{margin-left:auto;font:600 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.sec h2 .aside.done{color:var(--neg)}
.kind{font:700 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:400 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-align:left;line-height:1.2}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.pos{background:var(--pos-soft);border-color:var(--pos);color:var(--pos);font-weight:700}
.chip.neg{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.chip .mark{font:700 15px var(--f-note);width:12px;text-align:center}
.chip.rf{border-style:dashed;border-color:var(--pos)}
.chip.rf::after{content:"red flag";font:700 .66rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--pos)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.dot.p{background:var(--pos-soft);border-color:var(--pos)} .dot.n{background:var(--neg-soft);border-color:var(--neg)} .dot.r{border-style:dashed;border-color:var(--pos)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
input[type=text],input[type=number],input[type=search],textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ol{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;margin-right:6px}
.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:max-content;max-width:100%}
.seg button{font:600 14px var(--f-note);border:none;background:var(--sunk);color:var(--ink);min-width:36px;height:38px;cursor:pointer;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.picker{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{font:700 .85rem var(--f-body);color:var(--muted)}
.out{font:400 1.02rem/1.6 var(--f-note);min-height:300px;background:var(--paper);border-radius:12px}
.coach{border-color:var(--pos);border-width:1.5px}
.coach h2{color:var(--pos)}
.coach .sub{font:700 .82rem var(--f-body);color:var(--muted);margin-top:4px}
.ask{padding:8px 10px;border-left:3px solid var(--pos);background:var(--pos-soft);border-radius:0 8px 8px 0;color:var(--pos)}
.ask input{background:var(--surface)}
.exam li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.exam li:first-child{border-top:none}
.exam{list-style:none;margin:0;padding:0}
.exam .box{flex:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font:700 13px var(--f-body);color:var(--accent-ink);margin-top:1px}
.exam li.done .box{background:var(--neg);border-color:var(--neg)}
.exam li.done span.t{color:var(--muted);text-decoration:line-through}
.exam .must{font:700 .66rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--pos);margin-left:6px}
.fine{font-size:12px;color:var(--muted);margin:0}
.ok{padding:9px 11px;border-radius:9px;background:var(--neg-soft);color:var(--neg);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:40}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.barin{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px}
.barin .mid{flex:1;text-align:center;font:600 13px var(--f-body);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin .mid b{color:var(--pos)}
.barin .btn{min-width:92px}
.privacy{font-size:12px;color:var(--muted);margin:22px 0 0;max-width:60ch}
@media (max-width:420px){h1.step{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="topin">
    <a class="homebtn" href="../" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>
    <div class="brandrow"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8 8.5h8M8 12h5"/></svg><div class="brand">Hx<small>HPI builder</small></div></div>
    <div class="sp"></div>
    <button class="btn ghost iconbtn" id="example" type="button" aria-label="Load example case" title="Load example case"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 3v4h4M10 12h6M10 16h6"/><path d="M4 7v13a1 1 0 0 0 1 1"/></svg></button>
    <button class="btn ghost" id="newpt" type="button">New patient</button>
  </div>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
</header>

<div class="wrap">
  <div id="notice"></div>
  <main id="view"></main>
  <p class="privacy">Nothing you enter is saved or sent anywhere. It stays on this screen until you tap New patient or close the page. Leave out names, MRNs, and dates of birth.</p>
</div>

<footer class="bar">
  <div class="barin">
    <button class="btn" id="back" type="button">Back</button>
    <div class="mid" id="where"></div>
    <button class="btn primary" id="next" type="button">Next</button>
  </div>
</footer>

<script>
/* ---------- complaint library ----------
   Item prefixes: "!" red flag, "F:" female only, "M:" male only, "P:" pediatric only, "A:" adult only.
   "item|question" asks for a detail when the item is marked positive; the answer is added in parentheses.
   Section kinds: sx = symptoms (reports/denies), pmh = history (opening line / "no known history of"),
   rf = risk factors and exposures, med = current medications, tx = tried before arrival, pick = choose one.
   ex = exam findings to document; "!" marks findings that must not be missed. */
const sx=(t,i)=>({k:'sx',t,i}), pmh=(t,i)=>({k:'pmh',t,i}), rf=(t,i,l,n)=>({k:'rf',t,i,l,n}),
      med=i=>({k:'med',t:'Medications',i}), tx=i=>({k:'tx',t:'Tried before arrival',i}),
      pick=(t,pre,i)=>({k:'pick',t,pre,i});
const AC="an anticoagulant|Which one, and when was the last dose?";
const AP="an antiplatelet agent|Which one?";
const BLEED=[AC,AP];
const CANCER="active cancer|What type, and current treatment?";
const TOB="tobacco use|How much, and for how long?";
const ETOH="alcohol use|How much, and when was the last drink?";
const IVDU="IV drug use|When was the last use?";
const TRAVEL="recent travel|Where, and when?";
const NEWMED="new medications|Which ones?";
const IMMUNO="immunocompromise|What is the cause?";
const SURG="prior abdominal surgery|Which surgery, and when?";
const PE=["prior DVT/PE|When, and how was it treated?","surgery or major trauma in the last 4 weeks|What, and when?","recent immobilization or long travel",CANCER,"estrogen use|Which product?","F:pregnancy or delivery in the last 6 weeks","known clotting disorder"];
const TET=pick("Tetanus","Tetanus status is ",["up to date","not up to date","unknown"]);
const HAND=pick("Hand dominance","The patient is ",["right-handed","left-handed"]);
const IMM=pick("Immunizations","Immunizations are ",["up to date","not up to date","unknown"]);
const NV=["!strength in each extremity","!sensation in each extremity"];
const NVL=["!distal pulses","!capillary refill","!distal sensation","!motor function distal to the injury"];

const C={
/* ---- Cardiopulmonary ---- */
chest_pain:{g:"Cardiopulmonary",name:"Chest pain",cc:"chest pain",f:"lqrs",preg:1,
  loc:["substernal chest","left chest","right chest","epigastrium","whole chest"],
  qual:["pressure","tightness","sharp","burning","tearing","aching"],
  rad:["left arm","right arm","jaw","neck","back","area between the shoulder blades"],
  agg:["exertion","deep breathing","palpation","movement","lying flat","eating","swallowing"],rel:["rest","sitting forward","antacids","nitroglycerin"],
  sec:[sx("Associated symptoms",["shortness of breath","diaphoresis","nausea","vomiting","lightheadedness","!syncope","palpitations","cough","fever","!hemoptysis","!unilateral leg swelling or pain","!focal weakness or numbness","!abrupt pain maximal at onset","!pain in the back or abdomen"]),
    pmh("Cardiac history",["CAD","prior MI|When?","prior stents or CABG|When, and where?","HTN","HLD","diabetes","CHF","AFib","aortic aneurysm","bicuspid aortic valve","connective tissue disease"]),
    rf("Cardiac risk factors",[TOB,"family history of premature CAD","cocaine or stimulant use|What, and when was the last use?","obesity"],"Cardiac risk factors include","No"),
    rf("PE risk factors",PE,"PE risk factors include","No"),
    rf("Prior cardiac workup",["a stress test|When, and what was the result?","a cardiac catheterization|When, and what was found?","an echocardiogram|When, and what was the result?"],"Prior workup includes","No prior"),
    med([AC,"daily aspirin","another antiplatelet agent|Which one?","a PDE-5 inhibitor|Which one, and when was the last dose?"]),
    tx(["aspirin|What dose?","nitroglycerin|How many doses?","antacids"])],
  ex:["general appearance and diaphoresis","!blood pressure in both arms","!radial and femoral pulses for asymmetry","!heart sounds, murmur, rub, or gallop","!lung sounds bilaterally","chest wall tenderness and whether it reproduces the pain","!JVD","abdominal tenderness","!calf tenderness or unilateral leg swelling","peripheral edema","focal neurologic deficit"]},
sob:{g:"Cardiopulmonary",name:"Shortness of breath",cc:"shortness of breath",f:"",preg:1,
  agg:["exertion","lying flat","cold air","allergens"],rel:["rest","sitting up","an inhaler"],
  sec:[sx("Associated symptoms",["cough","sputum production","fever","wheezing","chest pain","!hemoptysis","orthopnea","paroxysmal nocturnal dyspnea","bilateral leg swelling","weight gain","!unilateral leg swelling or pain","!syncope","!inability to speak in full sentences"]),
    pmh("Relevant history",["asthma","COPD","CHF","CAD","prior DVT/PE","OSA","interstitial lung disease"]),
    rf("Severity markers",["home oxygen use|How many liters?","prior intubation|When, and for what?","prior ICU admission for breathing","a recent steroid course","a recent hospitalization|When, and for what?"],"Notable for","No"),
    rf("PE risk factors",PE,"PE risk factors include","No"),
    rf("Triggers and exposures",["missed medication doses|Which medication, and for how long?","a high-salt diet","a recent viral illness","allergen or smoke exposure","sick contacts",TOB],"Possible triggers include","No"),
    med(["a home inhaler|Which one, and how often this week?","a diuretic|Which one, and what dose?",AC]),
    tx(["albuterol|How many treatments?","a home nebulizer","an extra diuretic dose"])],
  ex:["!work of breathing and accessory muscle use","!ability to speak in full sentences","!oxygen saturation and room air or oxygen","!lung sounds: wheezes, crackles, or decreased breath sounds","!tracheal position","!JVD","heart sounds and rhythm","peripheral edema","!calf tenderness or unilateral leg swelling","mental status","cyanosis"]},
palpitations:{g:"Cardiopulmonary",name:"Palpitations",cc:"palpitations",f:"",preg:1,
  agg:["exertion","caffeine","lying down"],rel:["rest","vagal maneuvers"],
  sec:[sx("Associated symptoms",["!chest pain","!shortness of breath","lightheadedness","!syncope","diaphoresis","anxiety","heat intolerance","weight loss","tremor"]),
    pmh("Relevant history",["AFib or flutter","SVT","structural heart disease","CHF","thyroid disease","prior ablation|When?","a pacemaker or ICD|Any recent shocks?"]),
    rf("Triggers",["caffeine","alcohol","cocaine or stimulant use|What, and when was the last use?","decongestant use",NEWMED,"missed medication doses|Which medication?","sleep deprivation"],"Possible triggers include","No"),
    rf("Family history",["!sudden cardiac death","arrhythmia or cardiomyopathy"],"Family history is notable for","No family history of"),
    med(["a rate or rhythm control agent|Which one, and last dose?",AC,"thyroid medication|What dose?"]),
    tx(["vagal maneuvers","an extra dose of rate control medication"])],
  ex:["!heart rate and rhythm","heart sounds and murmur","!blood pressure","lung sounds","thyroid enlargement or tenderness","tremor","signs of volume depletion","peripheral edema"]},
cough:{g:"Cardiopulmonary",name:"Cough / URI",cc:"cough and URI symptoms",f:"",
  sec:[sx("Associated symptoms",["fever","chills","sore throat","congestion or rhinorrhea","sputum production","wheezing","shortness of breath","chest pain","!hemoptysis","myalgias","loss of taste or smell","ear pain","night sweats","weight loss"]),
    pmh("Relevant history",["asthma","COPD","CHF","immunocompromise|What is the cause?"]),
    rf("Exposures",["sick contacts",TRAVEL,TOB,"TB exposure","a recent hospitalization"],"Notable for","No"),
    rf("Vaccines",["influenza vaccine","COVID vaccine"],"Up to date on","Not up to date on"),
    med(["an ACE inhibitor","a home inhaler","an immunosuppressant|Which one?"]),
    tx(["OTC cough or cold medication","acetaminophen or ibuprofen","a home inhaler"])],
  ex:["!oxygen saturation","!work of breathing","!lung sounds: crackles, wheezes, or focal findings","tympanic membranes","pharynx","nasal mucosa and sinus tenderness","cervical lymphadenopathy","heart sounds"]},
htn:{g:"Cardiopulmonary",name:"Elevated blood pressure",cc:"elevated blood pressure",f:"",
  sec:[pick("Context","The elevated reading was ",["found at a clinic visit","found on a home check","found at a pharmacy","noted while symptomatic"]),
    sx("Associated symptoms",["!headache","!chest pain","!shortness of breath","!vision changes","!focal weakness or numbness","!confusion","nausea or vomiting","epistaxis","leg swelling","!decreased urine output"]),
    pmh("Relevant history",["HTN","CKD","prior stroke","CAD","CHF","F:preeclampsia"]),
    rf("Contributors",["missed antihypertensive doses|Which medication, and for how long?","cocaine or stimulant use","NSAID or decongestant use","high-salt intake","recent alcohol cessation","F:pregnancy or delivery in the last 6 weeks"],"Possible contributors include","No"),
    med(["antihypertensive medication|Which ones, and last doses?"]),
    tx(["an extra dose of home blood pressure medication"])],
  ex:["!repeat blood pressure, in both arms if elevated","!mental status","!focal neurologic deficit","!fundoscopic findings if able (papilledema, hemorrhages)","!heart sounds and new murmur","!lung sounds for crackles","JVD","peripheral edema","pulses"]},
syncope:{g:"Cardiopulmonary",name:"Syncope",cc:"a syncopal episode",f:"",preg:1,
  sec:[pick("Position at onset","The episode occurred while ",["standing","sitting","lying down","exerting","urinating or defecating","coughing"]),
    pick("Witnessed","The episode was ",["witnessed","unwitnessed"]),
    sx("Before the event",["lightheadedness","warmth or nausea","tunnel vision","warning symptoms before losing consciousness","!palpitations","!chest pain"]),
    sx("During and after",["!head injury","tongue biting","incontinence","confusion after the event","!focal weakness after the event","!headache"]),
    sx("Other symptoms",["!shortness of breath","!abdominal or back pain","!melena or hematochezia","vomiting or diarrhea","decreased oral intake"]),
    pmh("Relevant history",["CHF","structural heart disease","aortic stenosis","arrhythmia","CAD","prior syncope|How many episodes, and any workup?","seizure disorder","diabetes"]),
    rf("Family history",["!sudden cardiac death before age 50","inherited arrhythmia"],"Family history is notable for","No family history of"),
    med(["an antihypertensive|Which one, any recent changes?","a diuretic","a QT-prolonging medication|Which one?",AC,"a new medication|Which one, and when started?"])],
  ex:["!orthostatic vital signs","!heart sounds and murmur (especially aortic stenosis)","!heart rhythm","!head and face for trauma","!tongue for laceration","!focal neurologic deficit","abdominal tenderness or pulsatile mass","!stool guaiac if bleeding is suspected","lung sounds","peripheral edema"]},

  if(s.extra)out.push(sent(s.extra));
  // fixed closing lines
  out.push(`The patient's chief concern is ${(s.concern||'').trim().replace(/\.$/,'')||ccp}.`);
  out.push(`${He} denies any further complaints today.`);
  return out.join(' ');}
/* turn whatever was typed about how it started into a phrase that fits after "began ... ago" */
function ctxPhrase(raw,obj){
  let t=String(raw||'').trim().replace(/[.]+$/,'');if(!t)return'';
  const low=t.toLowerCase();
  if(/^(none|nothing|n\/a|na|unknown|unprovoked|spontaneous(ly)?|no (clear |obvious |known |specific )?(inciting event|trigger|cause|precipitant|reason))$/.test(low))return' without an inciting event';
  if(/^(denies|no) /.test(low))return' without '+t.replace(/^(denies|no) /i,'').replace(/^any /i,'');
  if(/^(while|after|during|at|upon|on|when|in|following|since|before|with|without|from|shortly|immediately|right|just)\b/.test(low))return' '+t;
  if(/^(woke|waking|awoke)( (up|him|her|the patient))? from sleep$/.test(low))return' and woke '+(obj||'the patient')+' from sleep';
  if(/^\w+ing\b/.test(low))return' while '+t;
  return' in the setting of '+t;}
function pregOn(){const c=cc();if(!c||!c.preg||s.sex!=='female')return false;const y=ageY();return y==null||(y>=10&&y<=55);}

/* ---------- views ---------- */
const STEPS=['Patient','Complaint','Story','Pertinents','HPI'];
const chip=(a,v,on,label,extra='')=>`<button type="button" class="chip${on?' on':''}" data-a="${a}" data-v="${esc(v)}" ${extra}>${esc(label)}</button>`;
const multi=(a,arr,list,labels)=>`<div class="chips">${list.map((v,i)=>chip(a,v,arr.includes(v),labels?labels[i]:shown(v))).join('')}</div>`;
const one=(a,cur,list,labels)=>`<div class="chips">${list.map((v,i)=>chip(a,v,cur===v,labels?labels[i]:shown(v))).join('')}</div>`;

function vPatient(){
  return `<h1 class="step"><span class="k">1</span>Patient</h1><p class="lede">Who the story is about and where it came from. Age and sex also decide which questions show up later, like pregnancy and prostate items.</p>
  <div class="sec"><div class="grid">
    <label class="f">Age<input id="age" type="number" inputmode="decimal" data-t="age" value="${esc(s.age)}" placeholder="45"></label>
    <div class="fld"><span class="fl">Unit</span>${one('unit',s.unit,['y.o.','m.o.','days old'],['Years','Months','Days'])}</div></div>
    <div class="fld"><span class="fl">Sex</span>${one('sex',s.sex,['female','male'],['Female','Male'])}</div>
    <label class="f">Other PMHx, separated by commas<input id="opmh" type="text" data-t="opmh" value="${esc(s.opmh)}" placeholder="asthma, hypothyroidism"></label>
    <p class="fine">Added to the opening line along with any history you mark positive on the Pertinents screen.</p>
    <div class="fld"><span class="fl">Arrival</span>${one('arr',s.arr,['walkin','ems','family','referral','transfer'],['Walk-in','EMS','With family','Clinic referral','Transfer'])}</div></div>
  <div class="sec"><h2>Source of history</h2>${multi('src',s.src,['patient','family','caregiver','ems','chart','facility'],['Patient','Family','Caregiver','EMS','Chart review','Facility staff'])}
    <label class="f">Interpreter language<input id="interp" type="text" data-t="interp" value="${esc(s.interp)}" placeholder="Spanish"></label>
    <div class="fld"><span class="fl">History limited by</span>${multi('lim',s.lim,['altered mental status','clinical acuity','intoxication','patient age','language barrier'],['Altered mental status','Acuity','Intoxication','Patient age','Language barrier'])}</div></div>`;}

function vComplaint(){
  const q=s.q.trim().toLowerCase();
  const groups=GROUPS.map(g=>{const ks=Object.keys(C).filter(k=>C[k].g===g&&(!q||C[k].name.toLowerCase().includes(q)));if(!ks.length)return'';
    return `<div class="grp"><div class="grp-h">${esc(g)}</div><div class="chips">${ks.map(k=>chip('cc',k,s.cc===k,C[k].name)).join('')}</div></div>`;}).join('');
  return `<h1 class="step"><span class="k">2</span>Chief complaint</h1><p class="lede">Pick the complaint. Each one loads its own checklist of pertinent positives, negatives, and red flags.</p>
  <div class="sec"><input type="search" id="q" data-t="q" value="${esc(s.q)}" placeholder="Search complaints" aria-label="Search complaints">
    <div class="picker">${groups||'<p class="fine">No complaint matches that search. Try a shorter word, or pick Other.</p>'}</div>
    ${s.cc==='other'?`<label class="f">Chief complaint, as it should read in the note<input id="ccText" type="text" data-t="ccText" value="${esc(s.ccText)}" placeholder="right hand numbness"></label>`:''}</div>`;}

function vStory(){
  const c=cc();if(!c)return needCC();
  const f=c.f||'',m=c.main||{},ap=!!m.ap;const L=(k,t)=>`<span class="fl"><b class="ol">${k}</b>${t}</span>`;
  const mainName=m.n?m.n.replace(/^The /,'').toLowerCase():'symptoms';const ev=m.v==='occurred';
  let h=`<h1 class="step"><span class="k">3</span>Story</h1><p class="lede">Laid out in OLDCARTS order: onset, location, duration, character, aggravating and alleviating factors, radiation, timing, and severity.</p>
  <div class="sec"><h2>Chief concern</h2>
    <label class="f">What worries the patient most, in their words<input id="concern" type="text" data-t="concern" value="${esc(s.concern)}" placeholder="${esc(s.cc==='other'?'***':c.cc)}"></label>
    <p class="fine">Closes the HPI. Leave blank to use the chief complaint.</p></div>
  <div class="sec"><h2>Onset of the ${esc(mainName)}</h2>
    ${ev?'':`<div class="fld">${L('O','How it started')}${one('onset',s.onset,['sudden','gradual'])}</div>`}
    <div class="grid"><label class="f">How long ago<input id="ago" type="number" inputmode="decimal" data-t="ago" value="${esc(s.ago)}" placeholder="2"></label>
      <div class="fld"><span class="fl">Unit</span>${one('agoU',s.agoU,['minutes','hours','days','weeks','months'])}</div></div>
    <label class="f">What were they doing when it started?<input id="ctx" type="text" data-t="ctx" value="${esc(s.ctx)}" placeholder="carrying groceries up stairs"></label>
    <div class="chips">${['no inciting event','at rest','during exertion','woke from sleep','after eating'].map(x=>chip('ctxq',x,s.ctx===x,cap(x))).join('')}</div>
    ${c.lkw?`<label class="f">Last known well<input id="lkw" type="text" data-t="lkw" value="${esc(s.lkw)}" placeholder="21:30 per spouse"></label>`:''}</div>`;
  const locF=()=>(f.includes('l')&&c.loc)?`<div class="fld">${L('L','Location')}${multi('loc',s.loc,c.loc)}</div>`:'';
  const sideF=()=>c.side?`<div class="fld">${L('L','Side')}${one('side',s.side,['left','right','bilateral'])}</div>`:'';
  const painF=()=>{let x='';
    if(f.includes('q')&&c.qual)x+=`<div class="fld">${L('C','Character')}${multi('qual',s.qual,c.qual)}</div>`;
    if(c.agg)x+=`<div class="fld">${L('A','Aggravated by')}${multi('agg',s.agg,c.agg)}</div>`;
    if(c.rel)x+=`<div class="fld">${L('A','Alleviated by')}${multi('rel',s.rel,c.rel)}</div>`;
    if(f.includes('r'))x+=`<div class="fld">${L('R','Radiation')}${multi('rad',s.rad,['none'].concat(c.rad||[]),['No radiation'].concat((c.rad||[]).map(shown)))}</div>`;
    if(f.includes('s'))x+=`<div class="fld">${L('S','Severity (0 to 10)')}<div class="seg">${[...Array(11).keys()].map(n=>`<button type="button" class="${s.sev===n?'on':''}" data-a="sev" data-v="${n}">${n}</button>`).join('')}</div></div>`;
    return x;};
  const timeF=`<div class="fld">${L('D','Duration')}${one('dur',s.dur,['constant','seconds','minutes','hours'],['Constant since onset','Episodes last seconds','Episodes last minutes','Episodes last hours'])}</div>
    <div class="fld">${L('T','Timing')}${one('course',s.course,COURSE,['Worsening','Improving','Unchanged','Resolved'])}</div>
    <div class="fld"><span class="fl">Prior episodes</span>${one('prior',s.prior,['first','similar'],['First episode','Similar before'])}</div>`;
  if(ap){
    const mainBody=sideF()+(m.locPain?'':locF())+(ev?'':timeF);
    if(mainBody)h+=`<div class="sec"><h2>The ${esc(mainName)}</h2>${mainBody}</div>`;
    h+=`<div class="sec"><h2>Associated pain</h2>
      <div class="fld"><span class="fl">Is there pain with it?</span>${one('apain',s.apain,['yes','no'],['Yes','No'])}</div>
      ${s.apain==='yes'?(m.locPain?locF():'')+painF()+(ev?timeF:''):''}</div>`;
  } else {
    h+=`<div class="sec"><h2>Character and timing</h2>${sideF()}${locF()}${timeF}${painF()}</div>`;
  }
  c.sec.forEach((sec,si)=>{if(sec.k!=='pick')return;
    h+=`<div class="sec"><h2>${esc(sec.t)}</h2><div class="chips">${sec.i.map((raw,ii)=>{const it=P(raw);return chip('pick',si+'.'+ii,s.picks[si]===ii,shown(it.t));}).join('')}</div></div>`;});
  return h;}
function triChip(x){const v=s.marks[x.key];const cls=v==='p'?' pos':v==='n'?' neg':(x.it.red?' rf':'');
  return `<button type="button" class="chip${cls}" data-a="tri" data-v="${x.key}" aria-label="${esc(shown(x.it.t))}${v==='p'?', yes':v==='n'?', no':', not asked'}"><span class="mark">${v==='p'?'+':v==='n'?'−':''}</span>${esc(shown(x.it.t))}</button>`;}
const KIND={sx:'Ask about',pmh:'Past history',rf:'Risk factors',med:'Medications',tx:'Tried at home'};

function vPert(){
  const c=cc();if(!c)return needCC();const all=items();
  let h=`<h1 class="step"><span class="k">4</span>Pertinents</h1><p class="lede">Tap once for yes, twice for no, a third time to clear. Anything left blank stays out of the note and shows up on the HPI screen as still to ask.</p>
  <div class="legend"><span><i class="dot p"></i>Positive</span><span><i class="dot n"></i>Negative</span><span><i class="dot r"></i>Red flag not yet asked</span></div>`;
  if(pregOn())h+=`<div class="sec"><h2>Pregnancy<span class="kind">${esc(KIND.rf)}</span></h2>
    <div class="grid"><label class="f">LMP<input id="lmp" type="text" data-t="lmp" value="${esc(s.lmp)}" placeholder="about 3 weeks ago"></label></div>
    ${one('preg',s.preg,['possible','not','unsure','pregnant'],['Possible','Not possible','Unsure','Currently pregnant'])}
    ${s.preg==='pregnant'?`<label class="f">Gestational age<input id="ga" type="text" data-t="ga" value="${esc(s.ga)}" placeholder="8 weeks by LMP"></label>`:''}</div>`;
  c.sec.forEach((sec,si)=>{if(!TRI.includes(sec.k))return;
    const mine=all.filter(x=>x.si===si);if(!mine.length)return;
    const done=mine.filter(x=>s.marks[x.key]).length;
    h+=`<div class="sec"><h2>${esc(sec.t)}<span class="kind">${KIND[sec.k]}</span><span class="aside${done===mine.length?' done':''}">${done} of ${mine.length}</span></h2>
      <div class="chips">${mine.map(triChip).join('')}</div>
      ${mine.filter(x=>s.marks[x.key]==='p'&&x.it.ask).map(x=>`<label class="f ask">${esc(shown(x.it.t))}: ${esc(x.it.ask)}<input type="text" id="i-${x.key}" data-i="${x.key}" value="${esc(s.idet[x.key]||'')}"></label>`).join('')}
      ${sec.k==='tx'&&mine.some(x=>s.marks[x.key]==='p')?`<div class="fld"><span class="fl">Response</span>${one('resp',s.resp,['full','partial','none'],['Relief','Partial relief','No relief'])}</div>`:''}
      <div class="row"><button type="button" class="btn sm" data-a="restneg" data-v="${si}">Mark the rest negative</button></div>
      <input type="text" id="det-${si}" data-d="${si}" value="${esc(s.det[si]||'')}" placeholder="${esc(detHint(sec))}" aria-label="Details for ${esc(sec.t)}"></div>`;});
  return h;}
function detHint(sec){return{sx:'Details, such as timing or severity',pmh:'Details, such as dates or prior workup',rf:'Details',med:'Details, such as drug name, dose, last dose',tx:'Details, such as dose and time'}[sec.k]||'Details';}

function vHPI(){
  const c=cc();if(!c)return needCC();
  if(!s.dirty)s.out=build();
  const t=tally();
  let coach='';
  if(t.left){const red=t.leftList.filter(x=>x.it.red),rest=t.leftList.filter(x=>!x.it.red);
    const grp={};rest.forEach(x=>{(grp[x.sec.t]=grp[x.sec.t]||[]).push(x);});
    coach=`<div class="sec coach"><h2>Still to ask<span class="aside">${t.left} of ${t.all}</span></h2>
      <p class="fine">Tap to answer here. Unanswered items stay out of the note.</p>
      ${red.length?`<div class="sub">Red flags</div><div class="chips">${red.map(triChip).join('')}</div>`:''}
      ${Object.keys(grp).map(g=>`<div class="sub">${esc(g)}</div><div class="chips">${grp[g].map(triChip).join('')}</div>`).join('')}</div>`;}
  else coach=`<div class="ok">Every pertinent item for ${esc(c.name.toLowerCase())} has an answer.</div>`;
  return `<h1 class="step"><span class="k">5</span>HPI</h1><p class="lede">Edit freely before copying. If you change answers after editing, tap Rebuild to start from the new answers.</p>
  ${s.dirty?`<div class="banner"><span>You edited this text, so new answers are not added until you rebuild.</span><button class="btn sm" type="button" data-a="rebuild">Rebuild</button></div>`:''}
  <div class="sec"><textarea id="out" class="out" aria-label="HPI text">${esc(s.out)}</textarea>
    <div class="row"><button class="btn primary" type="button" data-a="copy">Copy HPI</button>
    <label class="f" style="flex:1 1 220px">Add a closing line<input id="extra" type="text" data-t="extra" value="${esc(s.extra)}" placeholder="Seen at urgent care yesterday, told to come here"></label></div></div>
  ${coach}
  ${examCard(c)}`;}
function examItems(c){return (c.ex||[]).map((raw,i)=>({i,it:P(raw)})).filter(x=>visible(x.it));}
function examCard(c){
  const xs=examItems(c);if(!xs.length)return'';
  const done=xs.filter(x=>s.exDone[x.i]).length;
  return `<div class="sec"><h2>Next steps: exam to document<span class="aside${done===xs.length?' done':''}">${done} of ${xs.length}</span></h2>
    <p class="fine">Findings to examine and document for ${esc(c.name.toLowerCase())}. Items marked Must are the ones that change management. Tap to check off.</p>
    <ul class="exam">${xs.map(x=>`<li class="${s.exDone[x.i]?'done':''}" data-a="exck" data-v="${x.i}" role="checkbox" aria-checked="${!!s.exDone[x.i]}" tabindex="0"><span class="box">${s.exDone[x.i]?'✓':''}</span><span class="t">${esc(cap(x.it.t))}${x.it.red?'<span class="must">Must</span>':''}</span></li>`).join('')}</ul>
    <div class="row"><button class="btn sm" type="button" data-a="copyex">Copy as exam template</button></div></div>`;}
function needCC(){return `<h1 class="step">Pick a complaint first</h1><p class="lede">The questions here depend on the chief complaint.</p><button class="btn primary" type="button" data-a="go" data-v="1">Choose a complaint</button>`;}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function render(){
  $('rail').innerHTML=STEPS.map((n,i)=>`<button type="button" class="${i===s.step?'cur':''} ${hasStep(i)?'has':''}" data-a="go" data-v="${i}">${n}</button>`).join('');
  $('view').innerHTML=[vPatient,vComplaint,vStory,vPert,vHPI][s.step]();
  $('notice').innerHTML=s.example?`<div class="banner"><span>This is an example chest pain case. Tap New patient to start your own.</span></div>`:'';
  $('example').classList.toggle('on',s.example);
  footer();}
function footer(){
  $('back').disabled=s.step===0;$('back').style.visibility=s.step===0?'hidden':'visible';
  $('next').textContent=s.step===4?'Copy':'Next';
  const c=cc();if(!c){$('where').textContent='No complaint chosen';return;}
  const t=tally();
  $('where').innerHTML=esc(c.name)+' · '+(t.left?`${t.left} to ask${t.red?` · <b>${t.red} red flag${t.red>1?'s':''}</b>`:''}`:'all asked');}
function hasStep(i){const c=cc();
  if(i===0)return !!(s.age||s.sex);if(i===1)return !!s.cc;
  if(i===2)return !!(s.onset||s.dur||s.ago||s.loc.length||Object.keys(s.picks).length);
  if(i===3)return Object.keys(s.marks).length>0;return false;}

function toggle(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}
function resetCC(){Object.assign(s,{apain:'',idet:{},exDone:{},side:'',loc:[],qual:[],rad:[],sev:null,agg:[],rel:[],picks:{},marks:{},det:{},resp:'',lkw:'',dirty:false});}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1600);}
function copyText(text,msg){const done=()=>toast(msg);const fall=()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed. Select the text and copy it manually.');}t.remove();};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fall);else fall();}
function copy(){
  const ta=$('out');const text=ta?ta.value:build();
  const done=()=>toast('HPI copied');
  const fall=()=>{if(ta){ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){toast('Text selected. Copy it from the menu.');}}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fall);else fall();}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  const singles=['unit','sex','arr','onset','dur','apain','agoU','course','prior','side','preg','resp'];
  if(singles.includes(a)){s[a]=s[a]===v?(a==='unit'||a==='agoU'?s[a]:''):v;}
  else if(['src','lim','loc','qual','agg','rel'].includes(a))toggle(s[a],v);
  else if(a==='rad'){if(v==='none')s.rad=s.rad.includes('none')?[]:['none'];else{s.rad=s.rad.filter(x=>x!=='none');toggle(s.rad,v);}}
  else if(a==='ctxq'){s.ctx=s.ctx===v?'':v;}
  else if(a==='sev'){const n=+v;s.sev=s.sev===n?null:n;}
  else if(a==='cc'){if(s.cc!==v){s.cc=v;resetCC();}s.example=false;render();s.step=2;window.scrollTo(0,0);}
  else if(a==='pick'){const[si,ii]=v.split('.').map(Number);s.picks[si]=s.picks[si]===ii?null:ii;if(s.picks[si]==null)delete s.picks[si];}
  else if(a==='tri'){const m=s.marks[v];if(!m)s.marks[v]='p';else if(m==='p')s.marks[v]='n';else delete s.marks[v];}
  else if(a==='restneg'){items().filter(x=>x.si===+v&&!s.marks[x.key]).forEach(x=>s.marks[x.key]='n');}
  else if(a==='go'){s.step=+v;window.scrollTo(0,0);}
  else if(a==='rebuild'){s.dirty=false;}
  else if(a==='copy'){copy();return;}
  else if(a==='exck'){if(s.exDone[v])delete s.exDone[v];else s.exDone[v]=true;}
  else if(a==='copyex'){const c=cc();copyText('Exam findings to document:\n'+examItems(c).map(x=>'- '+cap(x.it.t)+': ***').join('\n'),'Exam template copied');return;}
  else if(a==='clear'){newPatient();return;}
  else return;
  render();});
document.addEventListener('keydown',e=>{const li=e.target.closest&&e.target.closest('li[data-a]');if(li&&(e.key==='Enter'||e.key===' ')){e.preventDefault();li.click();}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.t){s[el.dataset.t]=el.value;
    if(el.dataset.t==='q'){const pos=el.selectionStart;render();const q=$('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}
    else if(el.dataset.t==='age'){footer();}
    else if(el.dataset.t==='extra'&&!s.dirty){s.out=build();const o=$('out');if(o)o.value=s.out;}
    else footer();}
  else if(el.dataset.d!=null){s.det[el.dataset.d]=el.value;}
  else if(el.dataset.i!=null){s.idet[el.dataset.i]=el.value;}
  else if(el.id==='out'){s.out=el.value;if(!s.dirty){s.dirty=true;const n=document.createElement('div');n.className='banner';n.innerHTML='<span>You edited this text, so new answers are not added until you rebuild.</span><button class="btn sm" type="button" data-a="rebuild">Rebuild</button>';el.closest('.sec').before(n);}}});
document.addEventListener('change',e=>{if(e.target.dataset.t==='age')render();});
$('back').onclick=()=>{if(s.step>0){s.step--;render();window.scrollTo(0,0);}};
$('next').onclick=()=>{if(s.step===4){copy();return;}if(s.step===1&&!s.cc){toast('Pick a complaint first');return;}s.step++;render();window.scrollTo(0,0);};
function newPatient(){s=blank();render();window.scrollTo(0,0);}
$('newpt').onclick=newPatient;
$('example').onclick=()=>{example();window.scrollTo(0,0);};

/* ---------- example case ---------- */
function example(){
  s=blank();Object.assign(s,{age:'58',sex:'male',arr:'ems',src:['patient','ems'],cc:'chest_pain',onset:'sudden',ago:'2',agoU:'hours',prior:'first',ctx:'carrying groceries up stairs',dur:'constant',concern:'that this could be a heart attack',
    loc:['substernal chest'],qual:['pressure'],rad:['left arm','jaw'],sev:7,agg:['exertion'],rel:['rest'],resp:'partial',step:4,example:true});
  const set={p:['shortness of breath','diaphoresis','nausea','HTN','HLD','tobacco use','aspirin','nitroglycerin'],
    n:['vomiting','syncope','hemoptysis','unilateral leg swelling or pain','focal weakness or numbness','abrupt pain maximal at onset','fever','CAD','prior MI','prior stents or CABG','prior DVT/PE','surgery or major trauma in the last 4 weeks','recent immobilization or long travel','active cancer','an anticoagulant','a PDE-5 inhibitor']};
  C.chest_pain.sec.forEach((sec,si)=>sec.i.forEach((raw,ii)=>{const t=P(raw).t;if(set.p.includes(t))s.marks[si+'.'+ii]='p';else if(set.n.includes(t))s.marks[si+'.'+ii]='n';}));
  const dt={'tobacco use':'1 pack per day for 30 years','aspirin':'324 mg','nitroglycerin':'1 sublingual dose'};
  C.chest_pain.sec.forEach((sec,si)=>sec.i.forEach((raw,ii)=>{const t=P(raw).t;if(dt[t]&&s.marks[si+'.'+ii]==='p')s.idet[si+'.'+ii]=dt[t];}));
  s.opmh='GERD';
  render();}
newPatient();   // open on a blank patient; the example case is still one tap away
</script>

</body></html>
