<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Px">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<title>Px</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Px: physical exam builder. Companion to Hx; palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --ab:#A8261C;--ab-soft:#FBE7E5;--nl:#1D6E49;--nl-soft:#E1F2E9;--paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:130px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.9rem;font-weight:700;padding:6px 2px;cursor:pointer}
.linkbtn.danger{color:var(--ab)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--muted);font-size:.9rem;margin:0}
input[type=search],input[type=text]{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);color:var(--ink)}
select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--paper);color:var(--ink)}

/* home */
h2.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:58px;text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile .txt{flex:1;min-width:0}.tile .nm{font-weight:700}.tile .ds{display:block;color:var(--muted);font-size:.86rem}
.tile .dr{flex:none;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.go{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid2 .tile{margin:0;flex-direction:column;align-items:flex-start;gap:4px;min-height:84px}
.cl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cl .tile{margin:0;padding:10px 12px;min-height:48px;font-size:.95rem}
@media (max-width:420px){.cl{grid-template-columns:1fr}}

/* exam */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.seg{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:.88rem;font-weight:700;border:0;background:none;color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prog{font-size:.85rem;color:var(--muted);font-weight:700}
.prog b{color:var(--ab)}
.sys{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sysh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper)}
.sysh h3{margin:0;flex:1;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.it{padding:10px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ir{display:flex;gap:10px;align-items:flex-start}
.ir .lb{flex:1;min-width:0}
.ir .lb .t{font-weight:700;font-size:.97rem}
.ir .lb .t i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ab);margin:0 0 1px 6px;vertical-align:middle}
.ir .lb .pv{font-size:.88rem;color:var(--muted);margin-top:2px}
.it[data-m="n"] .pv{color:var(--nl)}
.it[data-m="a"] .pv{color:var(--ab)}
.na{flex:none;display:flex;gap:4px}
.na button{font:inherit;font-size:.82rem;font-weight:700;width:46px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.it[data-m="n"] .na .n{background:var(--nl);border-color:var(--nl);color:#fff}
.it[data-m="a"] .na .a{background:var(--ab);border-color:var(--ab);color:#fff}
.abp{display:none;margin-top:8px}
.it[data-m="a"] .abp{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ab-soft);border-color:var(--ab);color:var(--ab);font-weight:700}
.chip.dv[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input.loc{margin-top:8px;padding:7px 10px;font-size:.92rem;background:var(--paper)}
.abp .row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.abp input[type=text]{flex:1;min-width:160px;padding:8px 10px;background:var(--paper)}
/* widgets */
.wg{margin-top:8px}
.gcs{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem}
.gcs select{width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:4px}
.tbl th:first-child{text-align:left}
.tbl td{padding:3px 4px;border-top:1px solid var(--line)}
.tbl td:not(:first-child){text-align:center}
.tbl select{min-width:58px}
.tbl select.dev{background:var(--ab-soft);border-color:var(--ab);color:var(--ab);font-weight:700}
.nih{display:flex;flex-direction:column;gap:10px}
.nih .q{font-weight:700;font-size:.92rem}
.nih .q span{color:var(--muted);font-weight:400}
.nih .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.nih .opts .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.score{font-size:1.3rem;font-weight:700}
/* add & output */
.addp .grp{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.addp .chips .chip:hover{border-color:var(--accent)}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:.93rem;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px;margin:0 0 10px;min-height:44px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(235,239,242,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:12}
.bar .wrap{display:flex;gap:10px;align-items:center;padding:0}
.bar .btn.primary{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:20px}
</style>
</head>
<body>
<header class="top"><div class="wrap hd" id="hd"></div></header>
<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden><div class="wrap"><span class="prog" id="barprog"></span><button class="btn primary" data-a="copy">Copy exam</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- finding library ----------
   F(id, system, label, normal sentence, abnormal options "a|b|c", side?)
   side = 1 lets an abnormal finding be tagged right / left / bilateral. */
const SYS=[
 ["gen","General"],["vit","Vitals"],["heent","HEENT"],["neck","Neck"],["cv","Cardiovascular"],["resp","Respiratory"],
 ["abd","Abdomen"],["back","Back"],["gu","Genitourinary"],["pel","Pelvic"],["rec","Rectal"],["msk","Musculoskeletal"],
 ["skin","Skin"],["neuro","Neurologic"],["psych","Psychiatric"],["dev","Lines, tubes, and drains"]];
const I={};
function F(id,sys,label,nl,ab,side){I[id]={id,sys,label,nl,ab:ab?ab.split('|'):[],side:!!side}}

/* General & vitals */
F("gen_app","gen","Appearance","Well-appearing, in no acute distress.","Ill-appearing|Toxic-appearing|In moderate distress|In severe distress|Diaphoretic|Uncomfortable, unable to find a position of comfort|Cachectic|Lethargic|Levine sign (clenched fist over the chest)");
F("gen_peds","gen","Appearance (child)","Well-appearing, interactive, and consolable.","Ill-appearing|Lethargic|Irritable and inconsolable|Poor eye contact|Weak cry|Hypotonic");
F("gen_hyd","gen","Hydration","Moist mucous membranes; capillary refill under 2 seconds.","Dry mucous membranes|Capillary refill 3–4 seconds|Capillary refill over 4 seconds|Decreased skin turgor|Sunken eyes|No tears");
F("gen_rass","gen","Sedation (RASS)","RASS 0, alert and calm.","RASS +1, restless|RASS +2, agitated|RASS +3, very agitated|RASS +4, combative|RASS −1, drowsy|RASS −2, light sedation|RASS −3, moderate sedation|RASS −4, deep sedation|RASS −5, unarousable");
F("gen_cam","gen","Delirium (CAM-ICU)","CAM-ICU negative.","CAM-ICU positive|Unable to assess (RASS −4 or −5)");
F("vit_ortho","vit","Orthostatic vital signs","Orthostatic vital signs negative.","Orthostatic by heart rate (rise ≥ 30)|Orthostatic by blood pressure (SBP drop ≥ 20)|Symptomatic on standing|Unable to stand");
F("vit_bparms","vit","BP in both arms","Blood pressure symmetric in both arms.","Systolic difference over 20 mmHg between arms");
F("vit_spo2","vit","Oxygen saturation","SpO₂ normal on room air.","Hypoxemic on room air|On supplemental oxygen|On high-flow oxygen");
F("vit_temp","vit","Temperature","Afebrile.","Febrile|Hypothermic|Hyperthermic (core)");
F("vit_hrbp","vit","Heart rate and blood pressure","Heart rate and blood pressure within normal limits.","Tachycardic|Bradycardic|Hypotensive|Hypertensive|Cushing triad (hypertension, bradycardia, irregular respirations)|Shock index over 1");
F("vit_glu","vit","Point-of-care glucose","Point-of-care glucose normal.","Hypoglycemic|Hyperglycemic");

/* HEENT */
F("head_atr","heent","Head","Normocephalic and atraumatic.","Scalp hematoma|Scalp laceration|Palpable step-off|Scalp tenderness",1);
F("head_bsf","heent","Basilar skull fracture signs","No Battle sign, raccoon eyes, hemotympanum, or CSF rhinorrhea or otorrhea.","Battle sign|Raccoon eyes|Hemotympanum|CSF rhinorrhea|CSF otorrhea",1);
F("head_face","heent","Facial bones","Facial bones stable and non-tender; normal occlusion.","Midface instability|Maxillary tenderness|Zygomatic tenderness|Mandibular tenderness|Malocclusion|Orbital rim step-off",1);
F("head_font","heent","Fontanelle (infant)","Anterior fontanelle open, soft, and flat.","Bulging fontanelle|Sunken fontanelle|Fontanelle closed");
F("head_ta","heent","Temporal arteries","Temporal arteries non-tender with normal pulses.","Temporal artery tenderness|Diminished temporal pulse|Nodular temporal artery",1);
F("head_sinus","heent","Sinuses","No sinus tenderness.","Maxillary sinus tenderness|Frontal sinus tenderness",1);
F("eye_pupils","heent","Pupils","Pupils equal, round, and reactive to light.","Anisocoria|Sluggishly reactive|Nonreactive|Pinpoint|Dilated|Afferent pupillary defect (Marcus Gunn pupil)|Horner syndrome (ptosis, miosis, anhidrosis)|Teardrop pupil",1);
F("eye_eom","heent","Extraocular movements","Extraocular movements intact without pain or diplopia.","Restricted upgaze|Restricted lateral gaze|Pain with eye movement|Diplopia|Gaze deviation",1);
F("eye_va","heent","Visual acuity","Visual acuity at baseline in each eye.","Decreased acuity|Counts fingers only|Hand motion only|Light perception only|No light perception",1);
F("eye_vf","heent","Visual fields","Visual fields full to confrontation.","Homonymous hemianopia|Quadrantanopia|Monocular field cut",1);
F("eye_conj","heent","Conjunctiva and sclera","Conjunctivae clear; sclerae anicteric.","Conjunctival injection|Ciliary flush|Purulent discharge|Watery discharge|Subconjunctival hemorrhage|Scleral icterus|Conjunctival pallor",1);
F("eye_fluor","heent","Fluorescein","No fluorescein uptake.","Corneal abrasion|Dendritic uptake|Linear vertical abrasions|Positive Seidel sign",1);
F("eye_iop","heent","Intraocular pressure","Intraocular pressure normal bilaterally.","Elevated intraocular pressure|Deferred (possible open globe)",1);
F("eye_ant","heent","Anterior chamber","Anterior chambers deep and quiet; no hyphema or hypopyon.","Hyphema|Hypopyon|Shallow anterior chamber|Cell and flare",1);
F("eye_lid","heent","Lids and orbit","No periorbital swelling or erythema; no foreign body on lid eversion.","Periorbital erythema|Periorbital swelling|Proptosis|Foreign body under the lid|Chalazion or hordeolum|Lid lag|Lid retraction",1);
F("eye_fundus","heent","Fundi","No papilledema.","Papilledema|Retinal hemorrhages|Unable to visualize the fundi");
F("ent_tm","heent","Tympanic membranes","Tympanic membranes clear with normal landmarks.","Erythematous TM|Bulging TM|Middle ear effusion|TM perforation|Hemotympanum",1);
F("ent_canal","heent","External canals","External canals clear without swelling or discharge; no tragal tenderness.","Canal edema|Otorrhea|Cerumen impaction|Foreign body in the canal|Tragal tenderness",1);
F("ent_mast","heent","Mastoid","No mastoid tenderness or swelling.","Mastoid tenderness|Mastoid swelling|Protruding auricle",1);
F("ent_hear","heent","Hearing","Hearing grossly intact.","Decreased hearing",1);
F("ent_nose","heent","Nose","Nares patent; no septal hematoma or active bleeding.","Anterior bleeding site seen|Active bleeding, source not seen|Septal hematoma|Septal deviation|Mucosal edema|Purulent discharge|Clear rhinorrhea|Vesicles on the nasal tip (Hutchinson sign)",1);
F("ent_post","heent","Posterior pharynx (blood)","No blood in the posterior pharynx.","Blood in the posterior pharynx|Active posterior bleeding");
F("ent_phar","heent","Oropharynx","Oropharynx clear; tonsils symmetric without exudate; uvula midline.","Pharyngeal erythema|Tonsillar exudate|Tonsillar enlargement|Tonsillar asymmetry|Uvular deviation|Soft palate bulging|Oral vesicles or ulcers|Palatal petechiae|Koplik spots|Strawberry tongue");
F("ent_mm","heent","Mucous membranes","Moist mucous membranes.","Dry mucous membranes");
F("ent_voice","heent","Voice and airway","Normal voice; no stridor; handling secretions.","Muffled (hot potato) voice|Hoarseness|Stridor|Drooling|Tripod or sniffing position");
F("ent_trismus","heent","Trismus","No trismus.","Trismus|Limited mouth opening");
F("ent_fom","heent","Floor of mouth","Floor of mouth soft and non-tender.","Floor of mouth elevation|Floor of mouth firmness|Sublingual swelling");
F("ent_tongue","heent","Lips and tongue","No lip or tongue swelling; no tongue laceration.","Lip swelling|Tongue swelling|Uvular swelling|Lateral tongue laceration");
F("ent_dent","heent","Dentition","Dentition intact without tenderness or gingival swelling.","Tooth tender to percussion|Loose tooth|Gingival swelling|Gingival fluctuance|Fractured tooth|Dental caries");
F("ent_face_sw","heent","Facial swelling","No facial swelling or erythema.","Facial swelling|Facial erythema|Facial induration",1);

/* Neck */
F("neck_supple","neck","Meningismus","Neck supple without meningismus.","Nuchal rigidity|Pain with neck flexion|Positive Kernig sign|Positive Brudzinski sign|Jolt accentuation of headache");
F("neck_cspine","neck","Cervical spine","No midline cervical spine tenderness or step-off.","Midline tenderness|Step-off|Paraspinal tenderness|Paraspinal spasm");
F("neck_rom","neck","Neck range of motion","Full active range of motion, rotating 45° each way without pain.","Limited rotation|Pain with range of motion|Not tested (immobilized)|Positive Lhermitte sign");
F("neck_ln","neck","Lymph nodes","No cervical lymphadenopathy.","Anterior cervical lymphadenopathy|Posterior cervical lymphadenopathy|Tender lymphadenopathy|Left supraclavicular node (Virchow node)|Right supraclavicular node",1);
F("neck_jvd","neck","JVD","No jugular venous distension.","JVD present|Elevated JVP|Hepatojugular reflux|Kussmaul sign (JVP rises with inspiration)");
F("neck_trachea","neck","Trachea","Trachea midline.","Tracheal deviation",1);
F("neck_thyroid","neck","Thyroid","Thyroid non-enlarged and non-tender.","Goiter|Thyroid nodule|Thyroid tenderness");
F("neck_swell","neck","Neck soft tissue","No neck swelling, crepitus, or tenderness.","Neck swelling|Subcutaneous crepitus|Submandibular swelling|Neck tenderness|Expanding hematoma|Positive Pemberton sign",1);
F("neck_bruit","neck","Carotids","No carotid bruits.","Carotid bruit",1);

/* Cardiovascular */
F("cv_rr","cv","Rate and rhythm","Regular rate and rhythm.","Irregularly irregular rhythm|Regularly irregular rhythm|Irregular rhythm|Occasional ectopic beats|Tachycardic|Bradycardic|Rate controlled|Rapid ventricular rate|Paced rhythm");
F("cv_hs","cv","Heart sounds","Normal S1 and S2; no murmurs, rubs, or gallops.","Systolic murmur|Diastolic murmur|Harsh crescendo-decrescendo systolic murmur|Friction rub|S3|S4|Muffled heart sounds|Mechanical valve click|Hamman crunch|Pericardial knock");
F("cv_pulses","cv","Pulses","Radial and dorsalis pedis pulses 2+ and symmetric.","Diminished pulse|Absent pulse|Dopplerable pulse only|Radial pulse asymmetry|Femoral pulse asymmetry|Pulse deficit|Water-hammer (Corrigan) pulse|Pulsus parvus et tardus|Pulsus alternans",1);
F("cv_cr","cv","Perfusion","Capillary refill under 2 seconds; extremities warm.","Delayed capillary refill|Mottling|Cool extremities",1);
F("cv_edema","cv","Edema","No peripheral edema.","Trace pitting edema|1+ pitting edema|2+ pitting edema|3+ pitting edema|Non-pitting edema|Edema to the knees|Edema to the thighs",1);
F("cv_calf","cv","Calves","Calves soft and non-tender without asymmetric swelling or palpable cord.","Calf tenderness|Unilateral calf swelling|Palpable venous cord|Calf circumference difference over 3 cm|Erythema and warmth|Positive Homans sign (low specificity)",1);
F("cv_aorta","cv","Abdominal aorta","No pulsatile abdominal mass.","Pulsatile abdominal mass|Abdominal bruit");
F("cv_access","cv","Dialysis access","Access with palpable thrill and audible bruit; site clean.","Absent thrill|Absent bruit|Erythema at the access|Drainage at the access|Bleeding from the access|Aneurysmal dilation",1);

/* Respiratory */
F("resp_o2","resp","Oxygen support","On room air.","Nasal cannula|Simple face mask|Venturi mask|Non-rebreather mask|High-flow nasal cannula|CPAP|BiPAP|Mechanical ventilation|Trach collar");
I.resp_o2.pre="On ";I.resp_o2.ph="Settings: 4 L, 50 L/min FiO₂ 0.6, 14/6, AC 450 × 18 PEEP 8 FiO₂ 0.5";
F("resp_wob","resp","Work of breathing","Breathing comfortably without accessory muscle use.","Tachypneic|Accessory muscle use|Retractions|Nasal flaring|Grunting|Head bobbing|Speaking in short phrases|Unable to speak in full sentences|Kussmaul respirations|Paradoxical breathing|Hoover sign (inward lower rib motion on inspiration)|Tracheal tug");
F("resp_bs","resp","Breath sounds","Clear to auscultation bilaterally; no wheezes, rales, or rhonchi.","Expiratory wheezes|Diffuse wheezes|Rales at the bases|Diffuse rales|Rhonchi|Decreased breath sounds|Absent breath sounds|Prolonged expiratory phase|Poor air movement|Focal wheeze",1);
F("resp_cw","resp","Chest wall","Chest wall non-tender and stable without crepitus.","Chest wall tenderness reproducing the pain|Rib point tenderness|Crepitus|Flail segment|Seat belt sign|Chest wall ecchymosis",1);
F("resp_vent","resp","Ventilator","Synchronous with the ventilator.","Ventilator dyssynchrony|Breath stacking|High peak pressures|Circuit air leak|Copious secretions");

/* Abdomen */
F("abd_soft","abd","Abdomen","Soft and non-distended.","Distended|Tympanitic|Firm|Rigid|Fluid wave (ascites)|Surgical scars|Visible peristalsis");
F("abd_tender","abd","Tenderness","Non-tender to palpation.","RLQ tenderness|LLQ tenderness|RUQ tenderness|LUQ tenderness|Epigastric tenderness|Suprapubic tenderness|Periumbilical tenderness|Diffuse tenderness|Pain out of proportion to exam");
F("abd_perit","abd","Peritoneal signs","No guarding, rebound, or rigidity.","Voluntary guarding|Involuntary guarding|Rebound tenderness (Blumberg sign)|Rigidity|Pain with heel tap (Markle sign)");
F("abd_bs","abd","Bowel sounds","Normal bowel sounds.","Hypoactive bowel sounds|Hyperactive bowel sounds|High-pitched bowel sounds|Absent bowel sounds");
F("abd_murphy","abd","Murphy sign","Negative Murphy sign.","Positive Murphy sign|Positive sonographic Murphy sign");
F("abd_mcb","abd","Appendiceal signs","No McBurney point tenderness; negative Rovsing, psoas, and obturator signs.","McBurney point tenderness|Positive Rovsing sign|Positive psoas sign|Positive obturator sign");
F("abd_hernia","abd","Hernias","No palpable hernias.","Reducible umbilical hernia|Incarcerated hernia|Inguinal hernia|Femoral hernia|Incisional hernia|Tender hernia",1);

    const def=set.filter(([,x])=>x!=='2+').map(([kk,x])=>{const[sd,m]=kk.split(':');return `${sd} ${m.toLowerCase()} ${x}`});
    const all=set.length===REFL.length*2;let s='';
    if(set.length)s=!def.length?(all?'Reflexes 2+ and symmetric throughout':'Reflexes 2+ where tested'):(all?'Reflexes 2+ except ':'Reflexes: ')+def.join(', ');
    const tR=v['toe:R'],tL=v['toe:L'];
    if(tR||tL){const t=tR&&tR===tL?`toes ${tR} bilaterally`:[tR?`right toe ${tR}`:'',tL?`left toe ${tL}`:''].filter(Boolean).join(', ');s+=(s?'; ':'')+t}
    return s?cap(s)+'.':''}
  if(id==='nihss'){const n=w.nih,done=NIH.filter(q=>n[q[0]]!==undefined&&n[q[0]]!=='');if(!done.length)return'';
    const tot=done.reduce((a,q)=>a+(n[q[0]]==='UN'?0:+n[q[0]]),0);
    const pos=done.filter(q=>n[q[0]]==='UN'||+n[q[0]]>0).map(q=>`${q[0]} ${q[1].toLowerCase()} ${n[q[0]]==='UN'?'UN':n[q[0]]}`);
    return `NIHSS ${tot}${done.length<NIH.length?` (incomplete: ${done.length} of ${NIH.length} items)`:''}${pos.length?`: ${pos.join(', ')}`:' (all items 0)'}.`}
  return''}
function itemText(k,id){if(WIDGET[id])return widgetText(k,id);const d=D(k),m=d.m[id];let t=m==='n'?I[id].nl:m==='a'?abText(k,id)||'':'';
  if(I[id].loc){const where=(d.loc&&d.loc[id]||'').trim();if(!t&&!where)return'';return `${I[id].label}${where?` (${where})`:''}${t?': '+t:'.'}`}
  return t}
function isDoneLoc(k,id){return I[id].loc&&(D(k).loc||{})[id]}
function isDone(k,id){if(WIDGET[id])return !!widgetText(k,id);return !!D(k).m[id]}
function note(k){const its=items(k),lines=[];
  if(k==='neuro'){const subs={};for(const x of its){let t=itemText(k,x.id);if(!t)continue;if(CNPRE[x.id])t=`CN ${CNPRE[x.id]}: ${t}`;const s=NC_SUB[x.id]||SYSNAME[I[x.id].sys];(subs[s]=subs[s]||[]).push(t)}
    for(const[s,a]of Object.entries(subs))lines.push(`${s}: ${a.join(' ')}`);return lines.join('\n')}
  for(const[sid,name]of SYS){const a=its.filter(x=>I[x.id].sys===sid).map(x=>itemText(k,x.id)).filter(Boolean);if(!a.length)continue;
    if(sid==='dev')lines.push(`${name}:\n${a.map(x=>'• '+x).join('\n')}`);else lines.push(`${name}: ${a.join(' ')}`)}
  return lines.join('\n')}

/* ---------- rendering ---------- */
const HOME=`<a class="homebtn" href="../" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>`;
const GO=`<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
const hd=document.getElementById('hd'),app=document.getElementById('app'),bar=document.getElementById('bar');
let filter='',addOpen=false,addQ='';
function route(){const h=location.hash.slice(1);if(h.startsWith('t/')&&TPL[h.slice(2)])return h.slice(2);return null}
function render(keep){const y=window.scrollY,k=route();if(k)renderExam(k);else renderHome();if(keep)window.scrollTo(0,y);else window.scrollTo(0,0)}

function renderHome(){
  document.title='Px';bar.hidden=true;hd.innerHTML=`${HOME}<h1>Px</h1>`;
  const f=filter.toLowerCase();
  let h=`<p class="sub" style="margin:6px 0 10px">Pick a template, mark what you examined as normal or abnormal, and copy the exam into your note.</p>
  <input type="search" id="q" placeholder="Search complaints" value="${esc(filter)}" autocomplete="off">`;
  const comp=ORDER.filter(k=>TPL[k].g==='Comprehensive');
  if(!f){h+=`<h2 class="sec">Comprehensive</h2><div class="grid2">${comp.map(k=>`<a class="tile" href="#t/${k}"><span class="nm">${esc(TPL[k].name)}</span><span class="ds">${esc(TPL[k].desc)}</span>${started(k)?'<span class="dr">Draft</span>':''}</a>`).join('')}</div>`}
  let last='',open=false;
  for(const k of ORDER){const t=TPL[k];if(t.g==='Comprehensive'&&!f)continue;
    if(f&&!(t.name+' '+t.g).toLowerCase().includes(f))continue;
    if(t.g!==last){if(open)h+='</div>';h+=`<h2 class="sec">${esc(t.g)}</h2><div class="cl">`;open=true;last=t.g}
    h+=`<a class="tile" href="#t/${k}"><span class="txt"><span class="nm">${esc(t.name)}</span></span>${started(k)?'<span class="dr">Draft</span>':''}${GO}</a>`}
  if(open)h+='</div>';else if(f)h+=`<p class="sub" style="text-align:center;padding:24px 0">Nothing matches “${esc(filter)}”.</p>`;
  h+=`<p class="foot">Saved only on this device. Mark only what you examined.</p>`;
  app.innerHTML=h}

function itemHTML(k,x){const it=I[x.id],d=D(k),m=d.m[x.id]||'';
  const t=`<div class="t">${esc(it.label)}${x.flag?'<i title="Key finding"></i>':''}</div>`;
  if(WIDGET[x.id]){const pv=widgetText(k,x.id);return `<div class="it" data-id="${x.id}" data-m="${pv?'n':''}"><div class="ir"><div class="lb">${t}<div class="pv">${esc(pv||'Not documented')}</div></div>
    <div class="na"><button class="linkbtn" data-a="wnl" data-id="${x.id}">${{neu_gcs:'Set 15',nc_str:'All 5/5',nc_refl:'All 2+',nihss:'All 0'}[x.id]}</button></div></div><div class="wg">${widgetHTML(k,x.id)}</div></div>`}
  const pv=m==='n'?it.nl:m==='a'?(abText(k,x.id)||'Abnormal: choose findings or describe'):it.nl;
  const ch=d.ch[x.id]||[];
  return `<div class="it" data-id="${x.id}" data-m="${m}"><div class="ir"><div class="lb">${t}<div class="pv">${esc(pv)}</div></div>
   <div class="na"><button class="n" data-a="mark" data-v="n" aria-pressed="${m==='n'}">Nl</button><button class="a" data-a="mark" data-v="a" aria-pressed="${m==='a'}">Abn</button></div></div>
   ${it.loc?`<input type="text" class="loc" data-loc="${x.id}" value="${esc((d.loc||{})[x.id]||'')}" placeholder="${esc(it.loc)}">`:''}
   <div class="abp">${it.ab.length?`<div class="chips">${it.ab.map(c=>`<button class="chip" data-a="chip" data-c="${esc(c)}" aria-pressed="${ch.includes(c)}">${esc(c)}</button>`).join('')}</div>`:''}
   <div class="row2">${it.side?`<div class="seg">${Object.entries({R:'Right',L:'Left',B:'Both'}).map(([v,l])=>`<button data-a="side" data-v="${v}" aria-pressed="${d.sd[x.id]===v}">${l}</button>`).join('')}</div>`:''}
   <input type="text" data-tx="${x.id}" value="${esc(d.tx[x.id]||'')}" placeholder="${esc(it.ph||'Details (size, location, value)')}"></div></div></div>`}

function widgetHTML(k,id){const w=D(k).w;
  if(id==='neu_gcs'){return `<div class="gcs">${['E','V','M'].map(c=>`<label for="g${c}">${{E:'Eyes',V:'Verbal',M:'Motor'}[c]}</label><select id="g${c}" data-w="gcs" data-c="${c}"><option value="">—</option>${GCS[c].map(([v,l])=>`<option value="${v}"${String(w.gcs[c])===String(v)?' selected':''}>${v} · ${l}</option>`).join('')}</select>`).join('')}</div>`}
  if(id==='nc_str'){return `<table class="tbl"><tr><th>Muscle</th><th>Right</th><th>Left</th></tr>${MUSC.map(m=>`<tr><td>${m}</td>${['R','L'].map(sd=>{const v=w.str[sd+':'+m]||'';return `<td><select data-w="str" data-c="${sd}:${m}" class="${v&&v!=='5'?'dev':''}"><option value="">—</option>${MRC.map(g=>`<option${v===g?' selected':''}>${g}</option>`).join('')}</select></td>`}).join('')}</tr>`).join('')}</table>`}
  if(id==='nc_refl'){return `<table class="tbl"><tr><th>Reflex</th><th>Right</th><th>Left</th></tr>${REFL.map(m=>`<tr><td>${m}</td>${['R','L'].map(sd=>{const v=w.refl[sd+':'+m]||'';return `<td><select data-w="refl" data-c="${sd}:${m}" class="${v&&v!=='2+'?'dev':''}"><option value="">—</option>${RGR.map(g=>`<option${v===g?' selected':''}>${g}</option>`).join('')}</select></td>`}).join('')}</tr>`).join('')}
    <tr><td>Plantar</td>${['R','L'].map(sd=>{const v=w.refl['toe:'+sd]||'';return `<td><select data-w="refl" data-c="toe:${sd}" class="${v&&v!=='downgoing'?'dev':''}"><option value="">—</option>${['downgoing','upgoing','mute'].map(g=>`<option${v===g?' selected':''}>${g}</option>`).join('')}</select></td>`}).join('')}</tr></table>`}
  if(id==='nihss'){const n=w.nih,tot=NIH.reduce((a,q)=>a+(n[q[0]]!==undefined&&n[q[0]]!==''&&n[q[0]]!=='UN'?+n[q[0]]:0),0);
    return `<div class="score" id="nihtot">Total ${tot}</div><div class="nih">${NIH.map(([c,l,opts,un])=>`<div><div class="q">${c} <span>${l}</span></div><div class="opts">${opts.map((o,i)=>`<button class="chip" data-a="nih" data-c="${c}" data-v="${i}" aria-pressed="${String(n[c])===String(i)}">${i} · ${o}</button>`).join('')}${un?`<button class="chip" data-a="nih" data-c="${c}" data-v="UN" aria-pressed="${n[c]==='UN'}">UN · Untestable</button>`:''}</div></div>`).join('')}</div>`}
  return''}

function renderExam(k){const t=TPL[k],d=D(k),its=items(k);
  document.title=t.name+' · Px';bar.hidden=false;
  hd.innerHTML=`${HOME}<button class="back" data-a="home" aria-label="All templates">‹</button><h1>${esc(t.name)}</h1>`;
  let h=`<div class="toolbar">${hasSexItems(k)?`<div class="seg" aria-label="Sex">${['M','F'].map(v=>`<button data-a="sex" data-v="${v}" aria-pressed="${d.sex===v}">${v}</button>`).join('')}</div>`:''}<span class="prog" id="prog"></span></div>`;
  if(k==='neuro'||k==='nihss'){const subs=[];for(const x of its){const s=k==='neuro'?(NC_SUB[x.id]||SYSNAME[I[x.id].sys]):'NIH Stroke Scale';let g=subs.find(z=>z.s===s);if(!g)subs.push(g={s,a:[]});g.a.push(x)}
    for(const g of subs)h+=sysHTML(k,g.s,g.a)}
  else for(const[sid,name]of SYS){const a=its.filter(x=>I[x.id].sys===sid);if(sid==='dev'&&t.devpick)h+=devHTML(k,name,a);else if(a.length)h+=sysHTML(k,name,a,sid)}
  h+=`<div class="card addp"><div class="btnrow" style="justify-content:space-between"><b>Add findings</b><button class="linkbtn" data-a="addtog">${addOpen?'Done':'Show'}</button></div>${addOpen?addHTML(k):'<p class="sub">Pull in any other finding from the library.</p>'}</div>`;
  h+=`<h2 class="sec">Exam text</h2><pre class="out" id="out"></pre>
   <div class="btnrow"><button class="btn sm" data-a="restall">Mark unmarked as normal</button><button class="linkbtn danger" data-a="clear">Clear this exam</button></div>
   <p class="foot">Saved only on this device. Mark only what you examined.</p>`;
  app.innerHTML=h;refresh(k)}
function devHTML(k,name,a){const d=D(k);
  return `<section class="sys"><div class="sysh"><h3>${esc(name)}</h3>${a.length?`<button class="linkbtn" data-a="restsys" data-ids="${a.map(x=>x.id).join(',')}">Rest normal</button>`:''}</div>
   <div class="it"><div class="t" style="font-weight:700;font-size:.97rem">Present</div><div class="pv" style="font-size:.88rem;color:var(--muted);margin:2px 0 8px">Tap each line, tube, or drain the patient has.</div>
   <div class="chips">${DEVICES.map(id=>`<button class="chip dv" data-a="devpick" data-id="${id}" aria-pressed="${d.dev.includes(id)}">${esc(DEVSHORT[id])}</button>`).join('')}</div></div>${a.map(x=>itemHTML(k,x)).join('')}</section>`}
function sysHTML(k,name,a,sid){return `<section class="sys"><div class="sysh"><h3>${esc(name)}</h3>${a.some(x=>!WIDGET[x.id])?`<button class="linkbtn" data-a="restsys" data-ids="${a.map(x=>x.id).join(',')}">Rest normal</button>`:''}</div>${a.map(x=>itemHTML(k,x)).join('')}</section>`}
function addHTML(k){const have=new Set(items(k).map(x=>x.id)),q=addQ.toLowerCase();let h=`<input type="search" id="addq" placeholder="Search findings" value="${esc(addQ)}" style="margin-top:8px">`;
  for(const[sid,name]of SYS){if(sid==='dev'&&TPL[k].devpick)continue;const a=Object.values(I).filter(it=>it.sys===sid&&!have.has(it.id)&&!it.id.startsWith('nc_')&&(!q||(it.label+' '+it.nl+' '+it.ab.join(' ')).toLowerCase().includes(q)));
    if(a.length)h+=`<div class="grp">${esc(name)}</div><div class="chips">${a.map(it=>`<button class="chip" data-a="add" data-id="${it.id}">+ ${esc(it.label)}</button>`).join('')}</div>`}
  return h}
function refresh(k){const its=items(k),done=its.filter(x=>isDone(k,x.id)).length,keyLeft=its.filter(x=>x.flag&&!isDone(k,x.id)).length;
  const p=`${done} of ${its.length} documented${keyLeft?` · <b>${keyLeft} key left</b>`:''}`;
  const pe=document.getElementById('prog');if(pe)pe.innerHTML=p;document.getElementById('barprog').innerHTML=`${done}/${its.length}`;
  const o=document.getElementById('out');if(o)o.textContent=note(k)||'Nothing documented yet.'}
function refreshItem(k,id){const el=app.querySelector(`.it[data-id="${id}"]`);if(!el)return;const x=items(k).find(z=>z.id===id);if(!x)return;
  const tmp=document.createElement('div');tmp.innerHTML=itemHTML(k,x);const nw=tmp.firstElementChild;
  const ae=document.activeElement,keepTx=ae&&el.contains(ae)&&ae.dataset.tx;
  if(keepTx||(ae&&el.contains(ae)&&ae.tagName==='SELECT')){el.dataset.m=nw.dataset.m;el.querySelector('.pv').textContent=nw.querySelector('.pv').textContent;
    if(id==='nihss'){const t=document.getElementById('nihtot');if(t)t.textContent=nw.querySelector('#nihtot').textContent}}
  else el.replaceWith(nw);refresh(k)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=route();
  if(a==='home'){location.hash='';return}
  if(a==='copy'){if(!k)return;const t=note(k);if(!t){toast('Nothing documented yet.');return}copyText(t).then(ok=>toast(ok?'Exam copied.':'Couldn’t copy on this device.'));return}
  if(!k)return;const d=D(k),el=b.closest('.it'),id=el&&el.dataset.id;
  if(a==='mark'){const v=b.dataset.v;d.m[id]=d.m[id]===v?undefined:v;if(!d.m[id])delete d.m[id];save();refreshItem(k,id);
}
  else if(a==='chip'){const c=b.dataset.c,arr=d.ch[id]||(d.ch[id]=[]);const i=arr.indexOf(c);i<0?arr.push(c):arr.splice(i,1);d.m[id]='a';save();refreshItem(k,id)}
  else if(a==='side'){d.sd[id]=d.sd[id]===b.dataset.v?undefined:b.dataset.v;if(!d.sd[id])delete d.sd[id];d.m[id]='a';save();refreshItem(k,id)}
  else if(a==='restsys'){for(const i of b.dataset.ids.split(','))if(!WIDGET[i]&&!d.m[i])d.m[i]='n';save();render(true)}
  else if(a==='restall'){const n=items(k).filter(x=>!WIDGET[x.id]&&!d.m[x.id]);if(!n.length){toast('Everything is already marked.');return}
    if(!confirm(`Mark ${n.length} unmarked finding${n.length>1?'s':''} as normal? Only do this for what you actually examined.`))return;for(const x of n)d.m[x.id]='n';save();render(true)}
  else if(a==='clear'){if(confirm('Clear everything in this exam?')){delete S.d[k];save();render()}}
  else if(a==='sex'){d.sex=d.sex===b.dataset.v?'':b.dataset.v;save();render(true)}
  else if(a==='wnl'){if(id==='neu_gcs')d.w.gcs={E:4,V:5,M:6};else if(id==='nc_str'){for(const m of MUSC)for(const sd of['R','L'])d.w.str[sd+':'+m]='5'}
    else if(id==='nc_refl'){for(const m of REFL)for(const sd of['R','L'])d.w.refl[sd+':'+m]='2+';d.w.refl['toe:R']=d.w.refl['toe:L']='downgoing'}
    else if(id==='nihss'){for(const q of NIH)d.w.nih[q[0]]=0}save();refreshItem(k,id)}
  else if(a==='nih'){const c=b.dataset.c,v=b.dataset.v==='UN'?'UN':+b.dataset.v;d.w.nih[c]=String(d.w.nih[c])===String(v)?'':v;save();refreshItem(k,'nihss')}
  else if(a==='devpick'){const id=b.dataset.id,i=d.dev.indexOf(id);if(i<0)d.dev.push(id);else{d.dev.splice(i,1);delete d.m[id];if(d.loc)delete d.loc[id]}
    d.dev.sort((x,y)=>DEVICES.indexOf(x)-DEVICES.indexOf(y));save();render(true)}
  else if(a==='addtog'){addOpen=!addOpen;addQ='';render(true)}
  else if(a==='add'){d.extra.push(b.dataset.id);save();render(true);toast(I[b.dataset.id].label+' added.')}
});
app.addEventListener('input',e=>{const t=e.target,k=route();
  if(t.id==='q'){filter=t.value;const p=t.selectionStart;renderHome();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(!k)return;const d=D(k);
  if(t.id==='addq'){addQ=t.value;const p=t.selectionStart;render(true);const q=document.getElementById('addq');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.loc){(d.loc=d.loc||{})[t.dataset.loc]=t.value;save();refresh(k);return}
  if(t.dataset.tx){const id=t.dataset.tx;d.tx[id]=t.value;if(t.value.trim())d.m[id]='a';save();refreshItem(k,id)}});
app.addEventListener('change',e=>{const t=e.target,k=route();if(!k||!t.dataset.w)return;const d=D(k),w=t.dataset.w;
  if(t.value)d.w[w][t.dataset.c]=t.value;else delete d.w[w][t.dataset.c];
  if(w!=='gcs')t.className=t.value&&!['5','2+','downgoing'].includes(t.value)?'dev':'';
  save();refreshItem(k,{gcs:'neu_gcs',str:'nc_str',refl:'nc_refl'}[w])});
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
window.addEventListener('hashchange',()=>{addOpen=false;render()});
render();
</script>
</body>
</html>
