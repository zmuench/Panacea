  sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');res()};sc.onerror=()=>{pdfjsP=null;rej(new Error('Couldn’t load the PDF reader. Check your connection.'))};document.head.appendChild(sc)}))}
const DOCS={};
async function getDoc(code){if(DOCS[code])return DOCS[code];
  let blob=await idb('readonly',st=>st.get(code));if(!blob)blob=await cloudFetch(code);if(!blob)throw new Error('That PDF isn’t on this device anymore. Link it again.');
  await loadPdfjs();const data=new Uint8Array(await blob.arrayBuffer());
  DOCS[code]=await pdfjsLib.getDocument({data}).promise;return DOCS[code]}
/* Which linked file shows a printed page, and at which PDF page. */
function srcFor(p){
  if(BM.D){const pp=p+(BM.D.off||0);if(!BM.D.pages||(pp>=1&&pp<=BM.D.pages))return{code:'D',off:BM.D.off||0}}
  return null}
/* Read printed page numbers from the PDF's text to line printed pages up with PDF pages. */
async function detectOffset(doc){
  const N=doc.numPages,idx=[];const want=Math.min(N,40);
  for(let k=0;k<want;k++){const i=N<=40?k+1:Math.round(1+(N-1)*(k+.5)/want);if(!idx.includes(i))idx.push(i)}
  const votes={};let used=0;
  for(const i of idx){let tc;try{tc=await(await doc.getPage(i)).getTextContent()}catch(e){continue}
    const seen=new Set();let any=false;
    for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;any=true;if(!/^\d{1,3}$/.test(s))continue;const n=+s;if(n<1||n>400)continue;seen.add(i-n)}
    if(any)used++;for(const o of seen)votes[o]=(votes[o]||0)+1}
  let best=null,bv=0;for(const[o,v]of Object.entries(votes))if(v>bv){bv=v;best=+o}
  return bv>=Math.max(2,Math.ceil(used*.3))?best:null}
let linking='';
async function linkBook(code,file){linking=code;render(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    let doc=null,pages=null,off=null;
    try{await loadPdfjs();doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;pages=doc.numPages;off=await detectOffset(doc)}catch(e){}
    await idb('readwrite',st=>st.put(file,code));DOCS[code]=doc;
    if(off===null)off=0;
    BM[code]={name:file.name,size:file.size,pages,off,auto:off!==null,at:Date.now()};saveBM();cloudUpload(code,file);
    toast(!pages?'Linked, but the file couldn’t be read as a PDF.':'Chizner linked. If pages look off, use the shift buttons in the reader.')}
  catch(e){toast(e&&e.name==='QuotaExceededError'?'Not enough storage on this device for that file.':'Couldn’t save that file on this device.')}
  linking='';render(true)}
async function unlinkBook(code){cloudRemove(code);try{await idb('readwrite',st=>st.delete(code))}catch(e){}delete BM[code];delete DOCS[code];saveBM();render(true)}

/* ---------- PDFs across devices ----------
   With sync turned on (the private repo set up in ICU Rounder), a linked PDF is also saved to that repo in
   10 MB parts under pdfs/systole/<book>/. Other devices see it there and download it the first time a reading
   is opened, then keep it in this browser. The repo must be private: nothing is uploaded to a public repo. */
const CLOUD_APP='systole',CLOUD_CODES=Object.keys(BOOKS),CLOUD_CHUNK=10*1048576;
const CL={};let cloudPriv=null;const FETCHING={};
const cloudPath=(code,f)=>`pdfs/${CLOUD_APP}/${code}/${f}`;
const partName=i=>'part-'+String(i).padStart(3,'0');
function cloudForget(code){delete DOCS[code]}
async function ghFile(path){const r=await fetch(`https://api.github.com/repos/${SY.owner}/${SY.repo}/contents/${path}`,{cache:'no-store',
  headers:{Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return r}
async function isPrivate(){if(cloudPriv===null)cloudPriv=!!(await gh('')).private;return cloudPriv}
function blobB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
async function cloudShas(code){try{const l=await gh('/contents/'+cloudPath(code,'').replace(/\/$/,''));return Object.fromEntries((Array.isArray(l)?l:[]).map(x=>[x.name,x.sha]))}catch(e){if(e.status===404)return{};throw e}}
async function shaOf(path){try{return(await gh('/contents/'+path)).sha}catch(e){if(e.status===404)return null;throw e}}
async function putFile(path,content,sha,message){
  for(let a=0;;a++){try{return await gh('/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,content,...(sha?{sha}:{})})})}
    catch(e){if(a>=3||(e.status&&e.status<500&&e.status!==409&&e.status!==422))throw e;await new Promise(r=>setTimeout(r,1500*(a+1)));sha=await shaOf(path)}}}
function clRender(){if(route().v==='books')render(true)}
function clProgress(code){const c=CL[code]||{};const el=document.querySelector('#rdr .loading');if(el&&c.down!=null)el.textContent=`Downloading your PDF from sync… ${c.down}%`;clRender()}
async function cloudUpload(code,file){
  if(!SY||!BM[code])return;CL[code]={up:0};clRender();
  try{if(!await isPrivate()){CL[code]={err:'Your sync repo is public, so this PDF stays on this device only.'};clRender();return}
    const old=await cloudShas(code),n=Math.ceil(file.size/CLOUD_CHUNK);
    for(let i=0;i<n;i++){const c=await blobB64(file.slice(i*CLOUD_CHUNK,(i+1)*CLOUD_CHUNK));
      await putFile(cloudPath(code,partName(i)),c,old[partName(i)],`PDF ${CLOUD_APP}/${code}: part ${i+1} of ${n}`);
      CL[code]={up:Math.round((i+1)/n*100)};clRender()}
    const {cloud,remote,...meta}=BM[code];
    await putFile(cloudPath(code,'meta.json'),b64enc(JSON.stringify({...meta,parts:n})),old['meta.json'],`PDF ${CLOUD_APP}/${code}: done`);
    for(const[k,sha]of Object.entries(old))if(/^part-\d+$/.test(k)&&+k.slice(5)>=n){try{await gh('/contents/'+cloudPath(code,k),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`PDF ${CLOUD_APP}/${code}: tidy`,sha})})}catch(e){}}
    if(BM[code]){BM[code].cloud=true;saveBM()}CL[code]={};toast('Saved to sync. Your other devices will download it the first time you open a reading.')}
  catch(e){CL[code]={err:'Couldn’t save to sync right now. It’s still on this device.'}}
  clRender()}
async function cloudRetry(code){const blob=await idb('readonly',st=>st.get(code));if(blob)cloudUpload(code,blob)}
function cloudFetch(code){
  if(!SY||!BM[code]||!BM[code].cloud)return Promise.resolve(null);
  return FETCHING[code]||(FETCHING[code]=(async()=>{
    try{const meta=JSON.parse(await(await ghFile(cloudPath(code,'meta.json'))).text()),bufs=[];
      for(let i=0;i<meta.parts;i++){CL[code]={down:Math.round(i/meta.parts*100)};clProgress(code);bufs.push(await(await ghFile(cloudPath(code,partName(i)))).arrayBuffer())}
      const blob=new Blob(bufs,{type:'application/pdf'});
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});await idb('readwrite',st=>st.put(blob,code))}catch(e){}
      if(BM[code]){BM[code].remote=false;saveBM()}CL[code]={};clRender();return blob}
    catch(e){CL[code]={err:'Couldn’t download from sync. Check your connection and try again.'};clRender();return null}
    finally{delete FETCHING[code]}})())}
async function cloudRemove(code){if(!SY)return;try{const old=await cloudShas(code);const ks=Object.keys(old).sort((a,b)=>a==='meta.json'?-1:b==='meta.json'?1:0);
  for(const k of ks)await gh('/contents/'+cloudPath(code,k),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`PDF ${CLOUD_APP}/${code}: removed`,sha:old[k]})})}catch(e){}}
/* On open: pick up PDFs linked (or replaced, or removed) on another device. */
async function cloudBoot(){if(!SY)return;let changed=false;
  for(const code of CLOUD_CODES){let meta=null;
    try{meta=JSON.parse(await(await ghFile(cloudPath(code,'meta.json'))).text())}catch(e){if(e.status!==404)return}
    const loc=BM[code];
    if(meta&&(!loc||(meta.at||0)>(loc.at||0))){if(loc){try{await idb('readwrite',st=>st.delete(code))}catch(e){}cloudForget(code)}
      const {parts,...m}=meta;BM[code]={...m,cloud:true,remote:true};changed=true}
    else if(meta&&loc&&!loc.cloud&&(meta.at||0)===(loc.at||0)){loc.cloud=true;changed=true}
    else if(!meta&&loc&&loc.cloud&&!CL[code]){try{await idb('readwrite',st=>st.delete(code))}catch(e){}cloudForget(code);delete BM[code];changed=true}}
  if(changed){saveBM();render(true)}}
function cloudNote(k){const c=CL[k]||{},m=BM[k];
  if(c.up!=null)return `<div class="st">Saving to sync… ${c.up}%. Keep this page open.</div>`;
  if(c.down!=null)return `<div class="st">Downloading from sync… ${c.down}%</div>`;
  if(c.err)return `<div class="st bad">${esc(c.err)}</div>${m&&!m.cloud&&SY?`<button class="linkbtn" data-a="cloudup" data-b="${k}">Try again</button>`:''}`;
  if(!m)return '';
  if(!SY)return `<div class="st">On this device only. Turn on sync in ICU Rounder to share it with your other devices.</div>`;
  if(m.cloud)return `<div class="st ok">Synced to all your devices${m.remote?' · downloads here the first time you open a reading':''}</div>`;
  return `<div class="st">On this device only.</div><button class="linkbtn" data-a="cloudup" data-b="${k}">Save to sync</button>`}
if(SY)cloudBoot();
const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+' MB';
function renderBooks(){
  document.title='Your PDF · Systole';header('Your PDF','#bback');
  let h=`<div class="card"><p style="margin:0 0 4px">Pick your copy of Chizner once. Every reading then opens straight to its pages.</p>
   <p class="note" style="margin-top:6px">With sync turned on (set up in ICU Rounder), the file is also saved to your private sync repo, and your other devices download it automatically the first time you open a reading. Without sync, it stays on this device. Remove takes it off every device.</p></div><div class="card">`;
  for(const[k,b]of Object.entries(BOOKS)){const m=BM[k];
    const st=linking===k?'<span class="st">Saving…</span>':m?`<span class="st ok">Linked · ${esc(m.name)} · ${m.pages?m.pages+' pages · ':''}${mb(m.size)}</span>`:'<span class="st">Not linked</span>';
    h+=`<div class="bkrow"><div class="tx"><div class="nm">The book</div><div class="st" style="margin-bottom:2px">${esc(b.full)}</div>${st}${cloudNote(k)}</div>
      <div class="btnrow" style="flex:none;flex-direction:column;align-items:stretch">
      <label class="btn sm filebtn">${m?'Replace':'Choose PDF'}<input type="file" accept="application/pdf,.pdf" data-file="${k}"></label>
      ${m?`<button class="linkbtn" data-a="unlink" data-b="${k}">Remove</button>`:''}</div></div>`}
  h+=`</div>`;
  
  app.innerHTML=h}

let RD=null;
function closeReader(){if(RD){RD.obs&&RD.obs.disconnect();RD.vis&&RD.vis.disconnect();RD.dead=true;RD=null}const c=document.getElementById('pgchip');if(c)c.remove()}
async function renderReader(a,b){
  closeReader();
  const lab=a===b?'p. '+a:'pp. '+a+'–'+b;
  document.title='Chizner '+lab+' · Systole';header('Chizner · '+lab,'#rback');
  const src=srcFor(a);
  if(!src){app.innerHTML=`<div class="card" style="margin-top:12px"><p style="margin:0 0 10px">Link your PDF on this device to read here.</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  app.innerHTML=`<div class="reader" id="rdr" style="margin-top:12px"><div class="loading">Opening…</div></div>`;
  const me=RD={dead:false};
  let doc;try{doc=await getDoc(src.code)}catch(e){if(!me.dead)document.getElementById('rdr').innerHTML=`<div class="card" style="width:100%"><p style="margin:0 0 10px">${esc(e.message)}</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  if(me.dead)return;
  const off=src.off,first=await doc.getPage(Math.min(Math.max(a+off,1),doc.numPages));const vp1=first.getViewport({scale:1});const ratio=vp1.height/vp1.width;
  if(me.dead)return;
  const box=document.getElementById('rdr');box.innerHTML='';
  const cal=document.createElement('div');cal.className='cal';
  cal.innerHTML=`<span class="tx">Printed p. ${a} is PDF page ${a+off}. Pages off?</span><button class="btn sm" data-a="shift" data-c="${src.code}" data-d="-1" aria-label="Shift back one page">−1</button><button class="btn sm" data-a="shift" data-c="${src.code}" data-d="1" aria-label="Shift forward one page">+1</button>`;
  box.appendChild(cal);
  for(let p=a;p<=b;p++){const pp=p+off,w=document.createElement('div');w.className='pgw';
    const ok=pp>=1&&pp<=doc.numPages;
    w.innerHTML=`<div class="pg${ok?'':' miss'}" data-p="${pp}" style="aspect-ratio:${(1/ratio).toFixed(4)}"><span class="pn">p. ${p}</span>${ok?'':'Not in this PDF'}</div>`;
    box.appendChild(w)}
  const end=document.createElement('div');end.className='btnrow';end.style.margin='14px 0 64px';end.innerHTML=`<button class="btn" data-go="#rback">Back to the lesson</button>`;box.appendChild(end);
  const chip=document.createElement('div');chip.className='pgchip';chip.id='pgchip';chip.textContent=a===b?'p. '+a:`p. ${a} · 1 of ${b-a+1}`;document.body.appendChild(chip);
  const rendered=new Map();
  async function draw(el){const p=+el.dataset.p;if(rendered.has(p)||me.dead||el.classList.contains('miss'))return;rendered.set(p,'busy');
    try{const pg=await doc.getPage(p);if(me.dead)return;const w=el.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(me.dead||!rendered.has(p))return;el.prepend(cv);rendered.set(p,cv)}
    catch(err){rendered.delete(p)}}
  function drop(el){const p=+el.dataset.p,cv=rendered.get(p);if(cv&&cv!=='busy'){cv.width=cv.height=0;cv.remove()}rendered.delete(p)}
  me.obs=new IntersectionObserver(es=>{for(const x of es){if(x.isIntersecting)draw(x.target);else drop(x.target)}},{rootMargin:'1200px 0px'});
  me.vis=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){const p=+x.target.dataset.p-off;chip.textContent=a===b?'p. '+p:`p. ${p} · ${p-a+1} of ${b-a+1}`}},{rootMargin:'-45% 0px -45% 0px'});
  box.querySelectorAll('.pg').forEach(el=>{me.obs.observe(el);me.vis.observe(el)});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const to=g.dataset.go;if(to==='#l/')return;
    if(to==='#today'){location.hash='';return}
    if(to==='#rback'){location.hash=sessionStorage.getItem('systole.readBack')||'';return}
    if(to==='#bback'){const v=sessionStorage.getItem('systole.booksBack');location.hash=v===null?'all':v;sessionStorage.removeItem('systole.booksBack');return}
    if(to==='#'){location.hash=sessionStorage.getItem('systole.back')||'';return}
    const v=route().v;if(to.startsWith('#l/')&&v!=='lesson')sessionStorage.setItem('systole.back',v==='all'?'all':'');
    if(to==='#books'&&v!=='books')sessionStorage.setItem('systole.booksBack',location.hash.slice(1)||'');
    location.hash=to.slice(1);return}
  const rd=e.target.closest('[data-read]');
  if(rd){const c=rd.dataset.read,[a,b]=itemPages(c),back=route().v==='today'?'':'l/'+rd.dataset.from;
    sessionStorage.setItem('systole.readBack',back);
    if(srcFor(a))location.hash='read/'+a+'-'+b;else{sessionStorage.setItem('systole.booksBack',back);location.hash='books'}return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const A=b.dataset.a;
  if(A==='cloudup'){cloudRetry(b.dataset.b);return}
  if(A==='unlink'){unlinkBook(b.dataset.b);return}
  if(A==='shift'){const m=BM[b.dataset.c];if(!m)return;m.off=(m.off??0)+(+b.dataset.d);m.auto=false;saveBM();const r=route();if(r.v==='read')renderReader(r.a,r.b);return}
  if(A==='rtick'){const key=b.dataset.l+':'+b.dataset.c,on=!isRead(b.dataset.l,b.dataset.c);S.read[key]={on,ts:Date.now()};save();
    const li=b.closest('li');li.classList.toggle('rd',on);b.setAttribute('aria-checked',on);
    const l=L[IDX[b.dataset.l]],its=items(l),n=its.filter(c=>isRead(l.id,c)).length,ct=document.getElementById('rdct');if(ct)ct.textContent=`${n} of ${its.length} read`;
    if(on&&n===its.length&&!isDone(l.id))toast('All readings done. Complete the lesson when you’re ready.');return}
  if(A==='reveal'){const q=document.getElementById('qz');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Hide answer':'Show answer'}
  else if(A==='done'){const id=b.dataset.id;const wasToday=route().v==='today';S.done[id]={on:true,day:today(),ts:Date.now()};save();
    toast('Lesson complete.');if(wasToday){location.hash='';render()}else render(true)}
  else if(A==='undo'){S.done[b.dataset.id]={on:false,day:'',ts:Date.now()};save();render(true)}
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.file&&t.files&&t.files[0])linkBook(t.dataset.file,t.files[0])});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filter=t.value;const p=t.selectionStart;renderAll();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.note){S.notes[t.dataset.note]={t:t.value,ts:Date.now()};save();return}
});
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
window.addEventListener('hashchange',()=>render());
/* Always open on All lessons, not the last screen. */
if(location.hash!=='#all')history.replaceState(null,'',location.pathname+location.search+'#all');
window.addEventListener('pageshow',e=>{if(e.persisted&&location.hash!=='#all'){history.replaceState(null,'',location.pathname+location.search+'#all');render()}});
render();
</script>
