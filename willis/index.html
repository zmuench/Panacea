<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Willis">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<title>Willis</title>
<style>
/* Willis: stroke localization. Deficits marked by side are matched against vascular syndromes (hemispheric, lacunar, brainstem, cerebellar, retinal, cord), lesion side computed, with structure-by-finding explanations.
   Base palette matches PANACEA; ehr.css (loaded last) applies the shared EHR look. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--amber:#8A5A00;--amber-soft:#FCF0D6;--ok:#1D6E49;--ok-soft:#E1F2E9;--paper:#FBFCFD;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:1.5rem}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);text-decoration:none}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:38px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;margin-top:10px}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.stepbtn .n{font-size:.7rem;font-weight:700;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .sh{display:none}
.mbar{display:none}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:6px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;flex-direction:column;gap:3px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.3rem}
.ph .cue{margin:0;color:var(--muted);font-size:.9rem}
.sec h3{margin:0 0 8px;font-size:.98rem}
.sec{display:flex;flex-direction:column;gap:8px}
.flab{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:.88rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip small{display:block;font-size:.72rem;opacity:.8;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.in{display:flex;flex-direction:column;gap:3px;min-width:92px;flex:1 1 92px;max-width:150px}
.in>span{font-size:.74rem;font-weight:700;color:var(--muted)}
.in input,.in select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);font-size:16px;width:100%;min-height:38px}
.in input:focus,.in select:focus{outline:2px solid var(--accent);outline-offset:0}
.in.wide{max-width:none;flex:2 1 180px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpi{background:#F4F6F8;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.kpi.bad{background:var(--warn-soft)}.kpi.bad b{color:var(--warn)}
.kpi.mid{background:var(--amber-soft)}.kpi.mid b{color:var(--amber)}
.kpi.good{background:var(--ok-soft)}.kpi.good b{color:var(--ok)}
table.set{width:100%;border-collapse:collapse;font-size:.92rem}
table.set th,table.set td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.set th{width:34%;color:var(--muted);font-weight:700;font-size:.8rem}
table.set td b{font-size:1.02rem}
table.set td small{display:block;color:var(--muted)}
.cite{font-size:.72rem;color:var(--muted);font-style:italic}
.note-box{background:#F4F6F8;border-radius:10px;padding:10px 12px;font-size:.9rem}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tcard{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;text-align:left;cursor:pointer}
.tcard b{display:block}.tcard span{font-size:.8rem;color:var(--muted)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.flow h4{margin:6px 0 0;font-size:.9rem}
.out{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 90px);overflow:auto}
.out h3{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rec{border-radius:10px;padding:9px 11px;border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.rec .h{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.rec .h b{font-size:.95rem}
.rec p{margin:0;font-size:.86rem}
.pri{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.rec.now{border-color:#E5A69F;background:#FFF7F6}.rec.now .pri{background:var(--warn-soft);color:var(--warn)}
.rec.next{border-color:#EBCB86;background:#FFFCF4}.rec.next .pri{background:var(--amber-soft);color:var(--amber)}
.rec.con .pri{background:var(--accent-soft);color:var(--accent)}
.rec.ok{border-color:#A9D6BE;background:#F6FBF8}.rec.ok .pri{background:var(--ok-soft);color:var(--ok)}
.miss{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.miss li{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;cursor:pointer}
.miss .bx{flex:none;width:18px;height:18px;border:1.5px solid #9AA9B8;border-radius:4px;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700}
.miss li.done .bx{background:var(--ok);border-color:var(--ok)}
.miss li.done .tx{color:var(--muted);text-decoration:line-through}
.miss .tx small{display:block;color:var(--muted);font-size:.74rem}
pre.dict{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#F4F6F8;border-radius:10px;padding:10px;margin:0}
.empty{color:var(--muted);font-size:.9rem;background:#F4F6F8;border-radius:10px;padding:10px 12px}
.pfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fine{font-size:.76rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:40}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .out{position:static;max-height:none}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stepbtn{padding:6px}
  .stepbtn .t{font-size:.8rem}
  .stepbtn .lg{display:none}.stepbtn .sh{display:inline}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));gap:10px;align-items:center}
  .mbar .mid{flex:1;font-size:.85rem;font-weight:700;color:var(--muted)}
  .mbar .mid b{color:var(--warn)}
  .wrap{padding-bottom:80px}
  .out{scroll-margin-top:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.steps{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip.known[aria-pressed="true"]{background:#8A2B1F;border-color:#8A2B1F}
.ddx{display:flex;flex-direction:column;gap:6px}
.dx{border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.dx.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dx .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dx .h b{font-size:.92rem}
.dx .h small{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:#E4E9EE;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.why{margin:5px 0 0;padding:0;list-style:none;font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px}
.why li{border-radius:4px;padding:1px 6px;background:var(--ok-soft);color:var(--ok)}
.why li.neg{background:#EEF1F4;color:var(--muted);text-decoration:line-through}
.tx h4{margin:6px 0 2px;font-size:.88rem}
.tx p{margin:0;font-size:.88rem}
.dose{background:#F4F6F8;border-radius:8px;padding:6px 9px;font-size:.88rem;margin:3px 0}
.dose b{color:var(--ink)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pc{font-weight:700;font-size:1.05rem;color:var(--warn)}

/* Willis */
.lrs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lr{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--paper);border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr.set{background:#F2F6FD}
.lrl{flex:1;min-width:0}
.lrl b{display:block;font-size:.9rem}
.lrl small{display:block;font-size:.74rem;color:var(--muted)}
.seg3{display:flex;flex:none;border:1px solid #AEBCCA;border-radius:6px;overflow:hidden}
.seg3 button{border:0;border-left:1px solid #AEBCCA;background:#fff;min-width:44px;min-height:34px;padding:0 8px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink)}
.seg3 button:first-child{border-left:0}
.seg3 button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);margin-bottom:6px}
.seg .sl{flex:0 0 120px;padding:0 10px;font-size:.8rem;font-weight:700;color:var(--muted)}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:transparent;min-height:36px;cursor:pointer;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--accent);color:#fff}
.aphout{min-height:30px;display:flex;align-items:center;gap:8px}
.aphout b{color:var(--accent)}
.hero{border-left:4px solid var(--accent);padding:2px 0 2px 12px}
.hero h3{margin:2px 0 0;font-size:1.2rem}
.hero p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.hero p.side{color:var(--ink);font-weight:700}
.eb2{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;margin:6px 6px 0 0;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--accent-soft);color:var(--accent)}
.tag.lvo,.lvoi{background:var(--warn-soft);color:var(--warn)}
.lvoi{font-weight:700;font-size:.7rem;border-radius:3px;padding:0 4px}
table.cls{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:4px}
table.cls th{text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:5px 6px;border-bottom:1px solid var(--line)}
table.cls td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cls tr.hit td{background:var(--ok-soft)}
table.cls tr.hit td:first-child{color:var(--ok);font-weight:700}
table.cls td:first-child{width:18px;color:var(--muted)}
.refb table.cls td:first-child{width:auto;color:var(--ink)}
.clues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.clues li{font-size:.86rem;background:#F4F6F8;border-radius:8px;padding:7px 9px}
.clues li b{display:block;font-size:.84rem}
.dx .sub{font-size:.78rem;color:var(--muted);margin-top:1px}
.dx .sub b{color:var(--ink)}
.refc{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.refh{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--paper);padding:9px 12px;font-weight:700;cursor:pointer;text-align:left}
.refh span{color:var(--muted);font-size:1.1rem}
.refb{padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px}
p.tx{margin:0;font-size:.92rem}
@media (max-width:520px){.seg .sl{flex-basis:96px}.seg3 button{min-width:40px;padding:0 6px}}
@media (max-width:340px){.lr{flex-wrap:wrap}.seg3{width:100%}.seg3 button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>Willis</h1></div>
      <p>Stroke localization: mark the deficits by side, and see the lesion, the vessel and the syndrome, from the lacunes to Wallenberg.</p>
    </div>
    <button class="btn" id="reset" type="button">New patient</button>
  </header>
  <nav class="steps" aria-label="Steps" id="steps"></nav>
  <div class="grid">
    <section class="pane" id="pane"></section>
    <aside class="out" id="out" aria-label="Localization"></aside>
  </div>
</div>
<div class="mbar" id="mbar"><span class="mid" id="mbarmid"></span><button class="btn primary" type="button" id="seeRecs">Localization ↓</button></div>
<script>
const STEPS=[['body','Motor & sensory','Body'],['cn','Eyes & cranial nerves','CNs'],['cort','Cortex & cerebellum','Cortex'],['loc','Localize','Localize']];
const blank=()=>({step:'body',dom:'L',f:{},aph:{flu:'',comp:'',rep:''},focus:'',done:{},ref:''});
let S=blank();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opp=x=>x==='L'?'R':'L';
const SW={L:'left',R:'right',B:'bilateral'};
const cap=t=>t?t[0].toUpperCase()+t.slice(1):t;

/* ---------- Findings ----------
   lr: marked Left / Right / Both. The side always means where the finding is on the patient
   (the side of the weak limb, the side of the field that is lost, the eye that cannot adduct, the way the eyes look).
   u: penalty when a syndrome leaves this finding unexplained. */
const FX={
 fw:{l:'Face weakness, lower face only',h:'Central (UMN): forehead spared',lr:1,n:'{s} lower facial weakness (forehead spared)',st:'body'},
 aw:{l:'Arm weakness',lr:1,n:'{s} arm weakness',st:'body'},
 lw:{l:'Leg weakness',lr:1,n:'{s} leg weakness',st:'body'},
 fal:{l:'Face and arm worse than leg',g:'pat',n:'face and arm worse than leg',st:'body',u:.3},
 lga:{l:'Leg worse than arm',g:'pat',n:'leg worse than arm',st:'body',u:.3},
 eq:{l:'Face, arm and leg equally',g:'pat',n:'face, arm and leg equally affected',st:'body',u:.3},
 prox:{l:'Proximal worse than distal',h:'Shoulder and hip; hands and feet spared',n:'proximal more than distal weakness',st:'body',u:.4},
 ch:{l:'Clumsy hand',h:'Poor dexterity with little weakness',lr:1,n:'{s} hand clumsiness',st:'body'},
 hb:{l:'Hemiballismus',h:'Flinging, large-amplitude movements',lr:1,n:'{s} hemiballismus',st:'body'},
 sf:{l:'Face numbness',h:'All modalities',lr:1,n:'{s} facial numbness',st:'body'},
 sfpt:{l:'Face pain and temperature loss',h:'Light touch spared (spinal trigeminal)',lr:1,n:'{s} facial pain and temperature loss',st:'body'},
 sb:{l:'Arm and leg numbness',h:'All modalities',lr:1,n:'{s} arm and leg numbness',st:'body'},
 sbpt:{l:'Body pain and temperature loss',h:'Pinprick and cold lost; vibration intact',lr:1,n:'{s} body pain and temperature loss',st:'body'},
 sbdc:{l:'Body vibration and position loss',h:'Pinprick intact (medial lemniscus or dorsal columns)',lr:1,n:'{s} body vibration and proprioception loss',st:'body'},
 scort:{l:'Cortical sensory loss',h:'Astereognosis, agraphesthesia, extinction',lr:1,n:'{s} cortical sensory loss (astereognosis, agraphesthesia)',st:'body'},

 hh:{l:'Homonymous hemianopia',h:'Mark the side of the field that is lost',lr:1,n:'{s} homonymous hemianopia',st:'cn'},
 sq:{l:'Superior quadrantanopia',h:'“Pie in the sky”: temporal (Meyer’s loop) or lower occipital bank',lr:1,n:'{s} superior quadrantanopia',st:'cn'},
 iq:{l:'Inferior quadrantanopia',h:'“Pie on the floor”: parietal radiations or upper occipital bank',lr:1,n:'{s} inferior quadrantanopia',st:'cn'},
 ms:{l:'Macular sparing',h:'Central vision kept within the cut',n:'macular sparing',st:'cn',u:.3},
 cb:{l:'Cortical blindness',h:'Both fields lost, pupils still react',n:'cortical blindness with reactive pupils',st:'cn'},
 mono:{l:'Monocular vision loss',h:'Mark the eye; transient (amaurosis) or fixed',lr:1,n:'{s} monocular vision loss',st:'cn'},
 gp:{l:'Eyes deviate toward',h:'Mark the side the eyes look to',lr:1,n:'gaze deviation to the {s}',st:'cn'},
 hgb:{l:'Horizontal gaze lost both ways',h:'Vertical movements and blink preserved',n:'bilateral horizontal gaze palsy with vertical movements preserved',st:'cn'},
 vgp:{l:'Vertical gaze palsy',h:'Upgaze most often',n:'vertical gaze palsy',st:'cn'},
 cn3:{l:'CN III palsy',h:'Ptosis, down and out, ± dilated pupil',lr:1,n:'{s} third nerve palsy',st:'cn'},
 cn6:{l:'CN VI palsy',h:'Cannot abduct that eye',lr:1,n:'{s} sixth nerve palsy',st:'cn'},
 ino:{l:'INO',h:'Mark the eye that cannot adduct; abducting eye nystagmus',lr:1,n:'{s} internuclear ophthalmoplegia',st:'cn'},
 skew:{l:'Skew deviation',h:'Vertical misalignment on cover test',n:'skew deviation',st:'cn'},
 nys:{l:'Nystagmus',h:'Direction-changing or vertical is central',n:'nystagmus',st:'cn',u:.4},
 horner:{l:'Horner syndrome',h:'Ptosis and miosis',lr:1,n:'{s} Horner syndrome',st:'cn'},
 flmn:{l:'Face weakness, whole face',h:'Peripheral (LMN): forehead involved',lr:1,n:'{s} peripheral facial weakness (forehead involved)',st:'cn'},
 hear:{l:'Hearing loss',h:'Sudden, unilateral',lr:1,n:'{s} hearing loss',st:'cn'},
 bulb:{l:'Dysphagia or hoarseness',h:'Weak palate, uvula pulled away, poor gag',n:'dysphagia and hoarseness',st:'cn'},
 cn12:{l:'Tongue deviates toward',h:'Mark the side the tongue points to',lr:1,n:'tongue deviation to the {s}',st:'cn'},

 neg:{l:'Hemineglect',h:'Mark the side that is ignored',lr:1,n:'{s} hemispatial neglect',st:'cort'},
 anos:{l:'Anosognosia',h:'Unaware of the deficit',n:'anosognosia',st:'cort'},
 aprax:{l:'Apraxia',h:'Cannot perform learned movements on command',n:'apraxia',st:'cort',u:.4},
 gerst:{l:'Gerstmann syndrome',h:'Acalculia, agraphia, finger agnosia, left–right confusion',n:'Gerstmann syndrome',st:'cort'},
 alex:{l:'Alexia without agraphia',h:'Can write but cannot read it back',n:'alexia without agraphia',st:'cort'},

/* Aphasia: fluency, comprehension, repetition → type */
function aphType(){const {flu,comp,rep}=S.aph;if(!flu||!comp||!rep)return null;
  return {nii:'aph_b',nip:'aph_tm',nmi:'aph_g',nmp:'aph_mt',fmi:'aph_w',fmp:'aph_ts',fii:'aph_c',fip:'aph_a'}[flu+comp+rep]||null}
/* Effective findings: chips plus the aphasia type */
function E(){const f={};for(const k in S.f)if(S.f[k])f[k]=S.f[k];const a=aphType();if(a)f[a]=true;return f}

/* ---------- Conditions ----------
   c:x  finding x contralateral to the lesion (or both sides)
   i:x  finding x ipsilateral to the lesion (or both sides)
   b:x  finding x on both sides
   n:x  finding x present (non-lateral, or any side)
   suffix @D / @N: counts only if the lesion side is the dominant / nondominant hemisphere
   | any of, & all of */
function atom(a,x,f){let m=a.match(/^([cibn]):(\w+)(@[DN])?$/);if(!m)return false;const [,p,id,h]=m;
  if(h==='@D'&&x!==S.dom)return false;if(h==='@N'&&x===S.dom)return false;
  const v=f[id];if(!v)return false;
  if(p==='n')return true;if(p==='b')return v==='B';
  if(x==='M')return v==='B'||v===true;
  if(p==='c')return v==='B'||v===opp(x);if(p==='i')return v==='B'||v===x;return false}
const test=(cond,x,f)=>cond.split('|').some(alt=>alt.split('&').every(a=>atom(a,x,f)));
const ids=cond=>[...new Set(cond.split(/[|&]/).map(a=>a.replace(/^[cibn]:/,'').replace(/@[DN]$/,'')))];
/* Which present findings a matched condition explains */
const explains=(cond,x,f)=>cond.split('|').filter(alt=>alt.split('&').every(a=>atom(a,x,f))).flatMap(ids);

/* ---------- Scoring ---------- */
function scoreSy(s,x,f){
  const present=Object.keys(f);const exp=new Set();let sc=0;const why=[];const miss=[];
  for(const [c,w,role] of s.core){if(test(c,x,f)){sc+=w;explains(c,x,f).forEach(i=>exp.add(i));why.push([c,role,1])}else miss.push([c,w,role])}
  for(const [c,w,role] of s.sup){if(test(c,x,f)){sc+=w;explains(c,x,f).forEach(i=>exp.add(i));why.push([c,role,0])}}
  const against=[];
  for(const [c,w] of s.ag){if(test(c,x,f)){sc+=w;against.push(c)}}
  /* Findings the syndrome cannot account for */
  const un=present.filter(id=>!exp.has(id));
  for(const id of un)sc-=(FX[id].u??.7);
  /* Aphasia on the nondominant side, for hemispheric syndromes */
  if(s.hemi&&x!==S.dom&&present.some(id=>FX[id].aph&&id!=='aph_a'))sc-=2;
  /* A unilateral syndrome cannot explain a bilateral motor or sensory deficit */
  if(!s.bilat&&!s.allowB)for(const id of present)if(f[id]==='B'&&['aw','lw','fw','sb','sbpt','sbdc','hh'].includes(id))sc-=1.2;
  return {s,x,sc,why,miss,un,against}}
function results(){const f=E();if(!Object.keys(f).length)return[];
  const out=[];
  for(const s of SY){const sides=s.bilat?['M']:['L','R'];let best=null;
    for(const x of sides){if(!s.gate.some(g=>test(g,x,f)))continue;const r=scoreSy(s,x,f);if(!best||r.sc>best.sc)best=r}
    if(best&&best.sc>0){
      /* No lateralized finding explained: the side is not yet known */
      const lat=new Set(best.why.flatMap(([c])=>explains(c,best.x,f)).filter(id=>FX[id].lr&&f[id]!==true));
      if(!s.bilat&&!lat.size)best.xu=1;if(!s.bilat&&lat.size&&[...lat].every(id=>f[id]==='B'))best.xb=1;out.push(best)}}
  return out.sort((a,b)=>b.sc-a.sc)}
const sideL=r=>r.x==='M'?'Bilateral or midline':r.xb?'Bilateral':r.xu?'Side not yet lateralized':`${cap(SW[r.x])} lesion`;

/* Text for a finding as marked */
function fText(id,v){const t=FX[id].n;if(!FX[id].lr)return t;
  if(id==='gp')return v==='B'?'gaze deviation in both directions':t.replace('{s}',SW[v]);
  if(id==='cn12')return v==='B'?'bilateral tongue weakness':t.replace('{s}',SW[v]);
  return t.replace('{s}',SW[v])}
/* What a condition looks like on this patient for this lesion side, for “look for” prompts */
function condText(c,x,xu){const alt=c.split('|')[0];return alt.split('&').map(a=>{const m=a.match(/^([cibn]):(\w+)(@[DN])?$/);if(!m)return a;const [,p,id]=m;
  if(!FX[id].lr||p==='n')return FX[id].n.replace('{s} ','').replace(' to the {s}','');
  const v=p==='b'||x==='M'?'B':p==='c'?opp(x):x;
  if(xu&&v!=='B')return FX[id].n.replace('{s}',p==='c'?'contralateral':'ipsilateral').replace('to the contralateral','away from the lesion').replace('to the ipsilateral','toward the lesion');
  return fText(id,v)}).join(' with ')}

/* Clues that do not depend on any one syndrome */
function clues(f){const C=[];const L=id=>f[id]&&f[id]!==true?f[id]:null;
  const crn=['flmn','cn3','cn6','cn12','horner','hear','sfpt','ino'],body=['aw','lw','sb','sbpt','sbdc'];
  const bs=body.map(L).filter(v=>v==='L'||v==='R');const cs=crn.map(id=>[id,L(id)]).filter(([,v])=>v==='L'||v==='R');
  let crossed=null;for(const [id,v] of cs){const sd=id==='cn12'?v:v;if(bs.length&&bs.every(b=>b===opp(sd)))crossed=sd}
  if(crossed)C.push(['Crossed signs',`Cranial nerve signs on the ${SW[crossed]}, body signs on the ${SW[opp(crossed)]}: a brainstem lesion on the ${SW[crossed]}. The cranial nerve involved gives the level.`]);
  const cort=CORT.filter(id=>f[id]).concat(FIELD.filter(id=>f[id]));if(f.gp)cort.push('gp');
  if(cort.length)C.push(['Cortical signs',`${cap(cort.map(id=>FX[id].l.toLowerCase()).slice(0,4).join(', '))}: the lesion reaches cortex or the visual pathway, not a lacune.`]);
  else if(body.some(id=>f[id])&&!crossed)C.push(['No cortical signs','Weakness or numbness without aphasia, neglect, field cut or gaze deviation: deep (lacunar) or brainstem.']);
  const faceBody=(f.fw||f.sf)&&bs.length&&[f.fw,f.sf].filter(v=>v==='L'||v==='R').every(v=>bs.includes(v));
  if(faceBody&&!crossed)C.push(['Face and body together','Face on the same side as the body: above the mid-pons (hemisphere, capsule, thalamus or upper brainstem).']);
  if(['aw','lw','sb','sbpt'].some(id=>f[id]==='B'))C.push(['Bilateral signs','Both sides of the body: brainstem (basilar), bilateral hemispheres, or the spinal cord. Look for a sensory level and for cranial nerve signs.']);
  const aph=APH.some(id=>f[id]&&id!=='aph_a');
  if(aph){const wk=['aw','fw','lw'].map(L).filter(v=>v==='L'||v==='R');
    if(wk.length&&wk.every(v=>v===S.dom))C.push(['Aphasia with weakness on the same side as the dominant hemisphere',`Aphasia and ${SW[S.dom]}-sided weakness do not fit one hemispheric lesion: crossed dominance, two lesions, or a seizure.`]);
    else C.push(['Aphasia',`Localizes to the dominant (${SW[S.dom]}) hemisphere.`])}
  if(f.neg&&f.neg!=='B'&&f.neg===S.dom)C.push(['Neglect',`${cap(SW[f.neg])} neglect points to the ${SW[opp(f.neg)]} (nondominant) parietal lobe.`]);
  if(f.gp&&f.gp!=='B'){const wk=['aw','lw','fw'].map(L).filter(v=>v==='L'||v==='R');
    if(wk.length&&wk.every(v=>v===opp(f.gp)))C.push(['Eyes look away from the weak side',`Typical of a ${SW[f.gp]} hemispheric lesion (frontal eye field).`]);
    else if(wk.length&&wk.every(v=>v===f.gp))C.push(['Eyes look toward the weak side',`“Wrong-way eyes”: a ${SW[opp(f.gp)]} pontine lesion, a seizure focus, or a thalamic hemorrhage.`])}
  if(['ax','gait','vert','nys'].some(id=>f[id])&&!body.some(id=>f[id])&&!crossed)C.push(['Cerebellar or vestibular only','Vertigo, nystagmus or ataxia without long-tract signs: cerebellum or vestibular system. Gait matters: inability to walk unaided is central.']);
  return C}

/* ---------- Don’t miss ---------- */
function misses(R,f){const M=[['glu','Fingerstick glucose','Hypoglycemia mimics any focal deficit.'],['lkw','Last known well and NIHSS','NIHSS is in Px. Posterior strokes score low on NIHSS.'],['ct','Noncontrast CT head','Hemorrhage first; it does not localize by syndrome.']];
  const top=R[0];const post=R.slice(0,3).some(r=>['Posterior circulation','Brainstem: midbrain','Brainstem: pons','Brainstem: medulla','Cerebellum'].includes(r.s.grp));
  if(R.slice(0,3).some(r=>r.s.lvo)||(CORT.some(id=>f[id])&&(f.aw||f.fw||f.lw)))M.push(['lvo','CTA head and neck for large-vessel occlusion','Cortical signs with weakness. Thrombectomy windows extend to 24 h in selected patients.']);
  if(post)M.push(['mri','MRI DWI for the posterior fossa','CT misses most posterior fossa strokes; DWI can still be falsely negative in the first 24–48 h.']);
  if(f.vert||f.nys)M.push(['hints','HINTS by someone trained in it','Only for continuous vertigo with nystagmus. Normal head impulse, direction-changing nystagmus or skew means central.']);
  if(f.gait)M.push(['walk','Watch him try to walk','Inability to sit or stand unaided is central until proven otherwise.']);
  if(f.cn3)M.push(['pcom','Pupil-involving CN III: CTA for a PCOM aneurysm','A dilated pupil with ptosis is compressive until proven otherwise; a headache makes it more urgent.']);
  if(f.horner)M.push(['dis','Horner with neck pain or headache: dissection','Carotid (with hemispheric signs) or vertebral (with posterior signs); CTA neck.']);
  if(f.flmn&&!['cn6','hear','ax','aw','lw','sfpt','sf','horner'].some(id=>f[id]))M.push(['bell','Isolated peripheral facial palsy','Bell’s palsy is likely, but look for CN VI, hearing loss, ataxia or limb signs that make it pontine.']);
  if(f.mono)M.push(['gca','Over 50 with monocular loss: ESR and CRP','Giant cell arteritis; and ophthalmology now for CRAO.']);
  if(f.hb)M.push(['hyp','Hemiballismus: check glucose','Nonketotic hyperglycemia causes it in older diabetics.']);
  if(R.slice(0,3).some(r=>['pica','sca','aica'].includes(r.s.id)))M.push(['edema','Cerebellar infarct: watch for swelling','Edema peaks at 24–96 h; falling consciousness or hydrocephalus needs neurosurgery.']);
  if(f.loc)M.push(['bao','Decreased consciousness with any brainstem sign','Basilar occlusion until the CTA says otherwise.']);
  if(R.some(r=>r.s.id==='asa'))M.push(['aorta','Cord infarct: aortic dissection','Back or chest pain, pulse deficits; CTA chest.']);
  M.push(['mim','Mimics: seizure (Todd), migraine aura, hypertensive encephalopathy, conversion','Sudden onset, negative symptoms and a vascular pattern favor stroke.']);
  return M}

/* ---------- Note ---------- */
function examText(f){const parts=[];const used=new Set();
  /* combine weakness on one side */
  const wk=['fw','aw','lw'].filter(id=>f[id]&&f[id]!==true);
  for(const v of ['L','R','B']){const ws=wk.filter(id=>f[id]===v);if(ws.length>1){const nm={fw:'lower face',aw:'arm',lw:'leg'};const l=ws.map(id=>nm[id]);
    parts.push(`${SW[v]} ${l.length===3?`${l[0]}, ${l[1]} and ${l[2]}`:l.join(' and ')} weakness${f.fw===v?' (forehead spared)':''}`);ws.forEach(id=>used.add(id))}}
  const sx=['sf','sb'].filter(id=>f[id]&&f[id]!==true);
  for(const v of ['L','R','B']){const ss=sx.filter(id=>f[id]===v);if(ss.length===2){parts.push(`${SW[v]} face, arm and leg numbness`);ss.forEach(id=>used.add(id))}}
  for(const id in f){if(used.has(id))continue;if(PAT.includes(id)||id==='prox'||id==='ms')continue;parts.push(fText(id,f[id]))}
  const mod=[];PAT.concat('prox').forEach(id=>{if(f[id])mod.push(FX[id].n)});
  if(mod.length){const wi=parts.findIndex(t=>/weakness/.test(t));if(wi>=0)parts[wi]+=`, ${mod.join(', ')}`;else parts.push(mod.join(', '))}
  let s=parts.join('; ');if(f.ms)s=s.replace(/homonymous hemianopia/,'homonymous hemianopia with macular sparing');
  return cap(s)}
function noteText(R){const f=E();if(!Object.keys(f).length||!R.length)return'';const t=R[0];
  let s=`Neuro exam: ${examText(f)}.\n`;
  s+=`Localization: most consistent with ${t.s.n} (${t.x==='M'?'bilateral or midline lesion':t.xu?'side not lateralized':SW[t.x]+'-sided lesion'}): ${lcFirst(t.s.lvl)}. Vessel: ${t.s.v}.`;
  if(t.s.lac)s+=' No cortical signs, consistent with a lacunar (small-vessel) syndrome.';
  if(t.s.lvo)s+=' Concerning for large-vessel occlusion.';
  const alt=R.slice(1,3).filter(r=>r.sc>=t.sc*.5);if(alt.length)s+=`\nAlso considered: ${alt.map(r=>`${r.s.n} (${r.x==='M'?'bilateral':r.xu?'side unclear':SW[r.x]})`).join('; ')}.`;
  s+=`\nPlan: ${t.s.next}`;return s}
const lcFirst=t=>t.replace(/^([A-Z])([a-z]+\b)/,(m,a,b)=>a.toLowerCase()+b);

/* ---------- Rendering ---------- */
const ph=(n,t,cue)=>`<div class="ph"><span class="eb">${n}</span><h2>${t}</h2><p class="cue">${cue}</p></div>`;
const foot=(prev,next)=>`<div class="pfoot">${prev?`<button class="btn" data-step="${prev[0]}" type="button">← ${prev[1]}</button>`:'<span></span>'}${next?`<button class="btn primary" data-step="${next[0]}" type="button">${next[1]} →</button>`:'<span></span>'}</div>`;
function lrRow(id){const v=S.f[id]||'';const x=FX[id];
  return `<div class="lr${v?' set':''}"><div class="lrl"><b>${esc(x.l)}</b>${x.h?`<small>${esc(x.h)}</small>`:''}</div><div class="seg3" role="group" aria-label="${esc(x.l)}">${['L','R','B'].map(s=>`<button type="button" data-lr="${id}" data-v="${s}" aria-pressed="${v===s}">${s==='B'?'Both':s}</button>`).join('')}</div></div>`}
const chipF=id=>`<button type="button" class="chip" data-f="${id}" aria-pressed="${!!S.f[id]}">${esc(FX[id].l)}${FX[id].h?`<small>${esc(FX[id].h)}</small>`:''}</button>`;
function group([t,list]){const lr=list.filter(id=>FX[id].lr),nl=list.filter(id=>!FX[id].lr);
  return `<div class="sec"><h3>${t}</h3>${lr.length?`<div class="lrs">${lr.map(lrRow).join('')}</div>`:''}${nl.length?`<div class="chips">${nl.map(chipF).join('')}</div>`:''}</div>`}
function countStep(k){const f=E();return Object.keys(f).filter(id=>FX[id].st===k||(k==='cort'&&FX[id].aph)).length}
function renderSteps(){$('steps').innerHTML=STEPS.map(([k,t,sh],i)=>{const n=k==='loc'?0:countStep(k);return `<button type="button" class="stepbtn" data-step="${k}" ${S.step===k?'aria-current="step"':''}><span class="n">${i+1}${n?` · ${n}`:''}</span><span class="t"><span class="lg">${t}</span><span class="sh">${sh}</span></span></button>`}).join('')}
function paneBody(){return ph(1,'Motor and sensory','Mark each deficit on the side of the patient where you find it. Leave anything normal blank. Whether the forehead is spared splits a central face from a peripheral one (the peripheral face is on the next step).')+
  `<div class="sec"><h3>Dominant hemisphere</h3><div class="chips">${[['L','Left','Most right-handers and most left-handers'],['R','Right','Some left-handers']].map(([v,l,h])=>`<button type="button" class="chip" data-dom="${v}" aria-pressed="${S.dom===v}">${l}<small>${h}</small></button>`).join('')}</div></div>`+
  GROUPS.body.map(group).join('')+foot(null,['cn','Eyes & cranial nerves'])}
function paneCn(){return ph(2,'Eyes and cranial nerves','The cranial nerve on one side and the body on the other is a brainstem lesion, at the level of that nerve. Mark gaze by where the eyes look, fields by the side that is lost.')+
  GROUPS.cn.map(group).join('')+foot(['body','Motor & sensory'],['cort','Cortex & cerebellum'])}
function paneCort(){const a=S.aph,t=aphType();const seg=(k,opts)=>`<div class="seg"><span class="sl">${{flu:'Fluency',comp:'Comprehension',rep:'Repetition'}[k]}</span>${opts.map(([v,l])=>`<button type="button" data-aph="${k}" data-v="${v}" class="${a[k]===v?'on':''}">${l}</button>`).join('')}</div>`;
  return ph(3,'Cortex and cerebellum','Language, neglect and field cuts mean cortex. Ataxia out of proportion to weakness means cerebellum or its pathways.')+
  `<div class="sec"><h3>Language</h3><p class="fine">Classify the aphasia from three bedside tests. Clear these if speech is normal.</p>
  ${seg('flu',[['n','Nonfluent'],['f','Fluent']])}${seg('comp',[['i','Intact'],['m','Impaired']])}${seg('rep',[['i','Impaired'],['p','Preserved']])}
  <div class="aphout">${t?`<b>${esc(FX[t].l)}</b> <button type="button" class="btn sm ghost" id="aphclr">Clear</button>`:(a.flu||a.comp||a.rep)?'<span class="fine">Choose all three.</span>':'<span class="fine">No aphasia marked.</span>'}</div></div>`+
  GROUPS.cort.map(group).join('')+foot(['cn','Eyes & cranial nerves'],['loc','Localize'])}
function whyChips(r,f){const pos=[];const seen=new Set();for(const [c] of r.why){for(const id of explains(c,r.x,f)){if(seen.has(id))continue;seen.add(id);pos.push(`<li>${esc(cap(fText(id,f[id])))}</li>`)}}
  const neg=[...new Set([...r.un,...r.against.flatMap(ids).filter(id=>f[id])])].filter(id=>!seen.has(id)).map(id=>`<li class="neg">${esc(cap(fText(id,f[id])))}</li>`);
  return `<ul class="why">${pos.join('')}${neg.join('')}</ul>`}
function strength(r,top){return r.sc>=Math.max(6,top*.85)?'Best fit':r.sc>=top*.6?'Fits':'Possible'}
function paneLoc(){const R=results(),f=E();
  if(!R.length)return ph(4,'Localize','Mark findings on the first three steps.')+`<p class="empty">Nothing marked yet, or nothing fits a vascular syndrome. A single nonspecific finding (dizziness alone, nausea) does not localize.</p>`+refCards()+foot(['cort','Cortex & cerebellum'],null);
  const focus=R.find(r=>r.s.id===S.focus)||R[0];const s=focus.s;
  const classic=s.core.map(([c,w,role])=>{const hit=test(c,focus.x,f);return `<tr class="${hit?'hit':''}"><td>${hit?'✓':'–'}</td><td>${esc(cap(condText(c,focus.x,focus.xu)))}</td><td>${esc(role)}</td></tr>`}).join('');
  const others=R.filter(r=>r!==focus).slice(0,5);
  const diff=R[0]===focus?R[1]:R[0];
  let dtx='';if(diff){const want=diff.miss.filter(([c])=>!test(c,diff.x,f)).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c])=>condText(c,diff.x,diff.xu));
    const mine=focus.miss.sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c])=>condText(c,focus.x,focus.xu));
    dtx=`<div class="note-box"><b>Versus ${esc(diff.s.n)} (${esc(diff.x==='M'?'bilateral':diff.xu?'side unclear':SW[diff.x])}):</b> ${mine.length?`look for ${esc(mine.join(' or '))} to support this one`:'this one already has its classic findings'}${want.length?`; ${esc(want.join(' or '))} would favor the alternative`:''}.</div>`}
  return ph(4,'Localize','The best fit and what each finding tells you. Tap another syndrome on the right to see it here.')+
  `<div class="sec"><div class="hero"><span class="eb2">${esc(s.grp)}</span><h3>${esc(s.n)}</h3><p class="side">${esc(sideL(focus))}</p><p>${esc(s.v)}</p>${s.lvo?'<span class="tag lvo">LVO</span>':''}${s.lac?'<span class="tag">Lacunar</span>':''}</div>
   <table class="set"><tr><th>Lesion</th><td><b>${esc(focus.x==='M'?'Bilateral or midline':focus.xu?'Side not yet lateralized:':cap(SW[focus.x]))}</b> ${esc(lcFirst(s.lvl))}<small>${esc(s.where)}</small></td></tr></table></div>
  <div class="sec"><h3>Classic findings</h3><table class="cls"><thead><tr><th></th><th>Finding</th><th>Structure</th></tr></thead><tbody>${classic}</tbody></table></div>
  ${focus.why.filter(w=>!w[2]).length?`<div class="sec"><h3>Also explained</h3><ul class="list">${focus.why.filter(w=>!w[2]).map(([c,role])=>`<li>${esc(cap(condText(c,focus.x,focus.xu)))}: ${esc(lcFirst(role))}</li>`).join('')}</ul></div>`:''}
  ${focus.un.length?`<div class="sec"><h3>Not explained by this syndrome</h3><ul class="list">${focus.un.map(id=>`<li>${esc(cap(fText(id,f[id])))}</li>`).join('')}</ul></div>`:''}
  <div class="sec"><h3>Pearl</h3><p class="tx">${esc(s.pearl)}</p></div>
  ${dtx?`<div class="sec"><h3>Telling it apart</h3>${dtx}</div>`:''}
  <div class="sec"><h3>Next</h3><p class="tx">${esc(s.next)}</p></div>`+refCards()+foot(['cort','Cortex & cerebellum'],null)}
function refCards(){const r=S.ref;
  const card=(k,t,body)=>`<div class="refc"><button type="button" class="refh" data-ref="${k}" aria-expanded="${r===k}">${t}<span>${r===k?'−':'+'}</span></button>${r===k?`<div class="refb">${body}</div>`:''}</div>`;
  return `<div class="sec"><h3>Reference</h3>`+
  card('rules','Five questions that localize',`<ol class="list"><li><b>Cortical signs?</b> Aphasia, neglect, field cut, gaze deviation, cortical sensory loss: cortex, usually a branch or stem occlusion. None: deep or brainstem.</li><li><b>Crossed?</b> Cranial nerve on one side, body on the other: brainstem, on the cranial nerve side.</li><li><b>Face with the body?</b> Same side: above the mid-pons. Face spared: medulla, cord, or medial cortex (ACA).</li><li><b>Pattern of weakness?</b> Face and arm more than leg: MCA. Leg more than arm: ACA. All equal: internal capsule or pons. Proximal only: watershed.</li><li><b>Bilateral?</b> Basilar, bilateral hemispheres, or cord (look for a level).</li></ol>`)+
  card('r4','Rule of 4 (brainstem)',`<p class="fine">Gates, Pract Neurol 2005. Four medial structures start with M, four lateral with S; four cranial nerves in each level below the midbrain.</p><table class="cls"><thead><tr><th>Medial “M”</th><th>Deficit</th></tr></thead><tbody><tr><td>Motor pathway</td><td>Contralateral weakness</td></tr><tr><td>Medial lemniscus</td><td>Contralateral vibration, position</td></tr><tr><td>MLF</td><td>Ipsilateral INO</td></tr><tr><td>Motor nucleus (III, IV, VI, XII)</td><td>Ipsilateral loss of that nerve</td></tr></tbody></table><table class="cls"><thead><tr><th>Lateral “S”</th><th>Deficit</th></tr></thead><tbody><tr><td>Spinocerebellar</td><td>Ipsilateral ataxia</td></tr><tr><td>Spinothalamic</td><td>Contralateral pain, temperature</td></tr><tr><td>Sensory nucleus of V</td><td>Ipsilateral face pain, temperature</td></tr><tr><td>Sympathetic</td><td>Ipsilateral Horner</td></tr></tbody></table><table class="cls"><thead><tr><th>Level</th><th>Cranial nerves</th></tr></thead><tbody><tr><td>Above pons</td><td>I–IV (III, IV in midbrain, medial)</td></tr><tr><td>Pons</td><td>V–VIII (VI medial; V, VII, VIII lateral)</td></tr><tr><td>Medulla</td><td>IX–XII (XII medial; IX, X, XI lateral)</td></tr></tbody></table>`)+
  card('lac','Fisher’s lacunar syndromes',`<table class="cls"><thead><tr><th>Syndrome</th><th>Usual site</th></tr></thead><tbody><tr><td>Pure motor</td><td>Posterior limb internal capsule, corona radiata, basis pontis</td></tr><tr><td>Pure sensory</td><td>VPL/VPM thalamus</td></tr><tr><td>Sensorimotor</td><td>Thalamus and adjacent internal capsule</td></tr><tr><td>Ataxic hemiparesis</td><td>Basis pontis, internal capsule, corona radiata</td></tr><tr><td>Dysarthria–clumsy hand</td><td>Basis pontis, genu internal capsule</td></tr></tbody></table><p class="fine">No cortical signs, no field cut, consciousness preserved. A field cut or aphasia excludes a lacune.</p>`)+
  card('aph','Aphasia by three tests',`<table class="cls"><thead><tr><th>Type</th><th>Fluent</th><th>Comprehends</th><th>Repeats</th><th>Where</th></tr></thead><tbody><tr><td>Broca</td><td>No</td><td>Yes</td><td>No</td><td>Inferior frontal</td></tr><tr><td>Wernicke</td><td>Yes</td><td>No</td><td>No</td><td>Posterior superior temporal</td></tr><tr><td>Global</td><td>No</td><td>No</td><td>No</td><td>Whole perisylvian (M1, ICA)</td></tr><tr><td>Conduction</td><td>Yes</td><td>Yes</td><td>No</td><td>Arcuate, supramarginal</td></tr><tr><td>Transcortical motor</td><td>No</td><td>Yes</td><td>Yes</td><td>SMA, ACA–MCA watershed</td></tr><tr><td>Transcortical sensory</td><td>Yes</td><td>No</td><td>Yes</td><td>MCA–PCA watershed</td></tr><tr><td>Mixed transcortical</td><td>No</td><td>No</td><td>Yes</td><td>Both watersheds</td></tr><tr><td>Anomic</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Nonspecific</td></tr></tbody></table>`)+
  `<p class="cite">After Blumenfeld, Neuroanatomy through Clinical Cases; Adams and Victor’s Principles of Neurology; Fisher, Neurology 1982; Gates, Pract Neurol 2005; Tintinalli’s Emergency Medicine, 9th ed.</p></div>`}
function renderOut(){const R=results(),f=E();let h='';
  const C=clues(f);
  h+=`<h3>Clues</h3>`+(C.length?`<ul class="clues">${C.map(([t,d])=>`<li><b>${esc(t)}</b> ${esc(d)}</li>`).join('')}</ul>`:`<p class="empty">Mark deficits by side. The pattern localizes before the syndrome does.</p>`);
  if(R.length){const top=R[0].sc,max=Math.max(8,top);const foc=(R.find(r=>r.s.id===S.focus)||R[0]).s.id;
    h+=`<h3>Localization</h3><div class="ddx">${R.slice(0,6).map(r=>`<button type="button" class="dx${foc===r.s.id?' on':''}" data-focus="${r.s.id}"><div class="h"><b>${esc(r.s.n)}</b><small>${strength(r,top)}</small></div><div class="sub"><b>${esc(sideL(r))}</b> · ${esc(r.s.lvl)}${r.s.lvo?' · <span class="lvoi">LVO</span>':''}</div><div class="bar"><i style="width:${Math.min(100,r.sc/max*100)}%"></i></div>${whyChips(r,f)}</button>`).join('')}</div>`;
    if(R[0].s.lvo||R.slice(0,2).some(r=>r.s.lvo&&r.sc>=top*.8))h+=`<p class="warnbox">Pattern fits a large-vessel occlusion: CTA head and neck now, and call the stroke team.</p>`}
  else if(Object.keys(f).length)h+=`<h3>Localization</h3><p class="empty">These findings don’t yet fit a vascular syndrome. Add the rest of the exam, or consider a mimic.</p>`;
  if(Object.keys(f).length){const M=misses(R,f);h+=`<h3>Don’t miss</h3><ul class="miss">${M.map(([id,t,s])=>`<li data-done="${id}" class="${S.done[id]?'done':''}"><span class="bx">${S.done[id]?'✓':''}</span><span class="tx">${esc(t)}<small>${esc(s)}</small></span></li>`).join('')}</ul>`}
  const n=noteText(R);if(n)h+=`<h3>Note</h3><pre class="dict">${esc(n)}</pre><button class="btn primary" id="copy" type="button">Copy note</button>`;
  h+=`<p class="fine">Classic syndromes are teaching patterns; real infarcts overlap and are often incomplete. Localization does not replace imaging, and time matters more than precision: activate the stroke pathway first.</p>`;
  $('out').innerHTML=h;
  $('mbarmid').innerHTML=R.length?`<b>${esc(R[0].s.n)}</b> · ${esc(sideL(R[0]))}`:'Mark deficits by side';
}
function renderPane(){$('pane').innerHTML={body:paneBody,cn:paneCn,cort:paneCort,loc:paneLoc}[S.step]()}
function render(keep){const y=window.scrollY;renderSteps();renderPane();renderOut();if(keep)window.scrollTo(0,y)}

document.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');if(st){S.step=st.dataset.step;render();window.scrollTo(0,0);return}
  const lr=e.target.closest('[data-lr]');if(lr){const id=lr.dataset.lr,v=lr.dataset.v;S.f[id]=S.f[id]===v?'':v;if(!S.f[id])delete S.f[id];render(true);return}
  const fc=e.target.closest('[data-f]');if(fc){const id=fc.dataset.f;if(S.f[id])delete S.f[id];else{S.f[id]=true;if(PAT.includes(id))PAT.forEach(p=>{if(p!==id)delete S.f[p]})}render(true);return}
  const dm=e.target.closest('[data-dom]');if(dm){S.dom=dm.dataset.dom;render(true);return}
  const ap=e.target.closest('[data-aph]');if(ap){const k=ap.dataset.aph;S.aph[k]=S.aph[k]===ap.dataset.v?'':ap.dataset.v;render(true);return}
  if(e.target.closest('#aphclr')){S.aph={flu:'',comp:'',rep:''};render(true);return}
  const fo=e.target.closest('[data-focus]');if(fo){S.focus=fo.dataset.focus;if(S.step!=='loc'){S.step='loc';render();window.scrollTo(0,0)}else render(true);return}
  const rf=e.target.closest('[data-ref]');if(rf){S.ref=S.ref===rf.dataset.ref?'':rf.dataset.ref;renderPane();return}
  const dn=e.target.closest('[data-done]');if(dn){S.done[dn.dataset.done]=!S.done[dn.dataset.done];renderOut();return}
  if(e.target.closest('#copy')){copy(noteText(results()));return}
  if(e.target.closest('#seeRecs')){$('out').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(e.target.closest('#reset')){const b=$('reset');if(b.dataset.armed){S=blank();render();window.scrollTo(0,0)}else{b.dataset.armed='1';b.textContent='Tap again to clear';setTimeout(()=>{delete b.dataset.armed;b.textContent='New patient'},2500)}return}
});
async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  const el=document.createElement('div');el.className='toast';el.textContent=ok?'Note copied.':'Couldn’t copy on this device.';document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
render();
</script>
