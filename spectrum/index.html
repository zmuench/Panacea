<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spectrum">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Spectrum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Spectrum: bugs and drugs reference (organisms, antimicrobials, Gram stain, coverage grid).
   Palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;--amb:#7A5000;--amb-soft:#FBF0D9;
  --pos:#A8261C;--pos-soft:#FBE7E5;--neg:#1D6E49;--neg-soft:#E1F2E9;
  --paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover,.homebtn:active{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.refbtn{font:inherit;font-size:.88rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tabs a{flex:1;text-align:center;font-size:.9rem;font-weight:700;color:var(--muted);text-decoration:none;padding:8px 4px;border-radius:10px;border:1px solid transparent}
.tabs .ts{display:none}@media (max-width:540px){.tabs .tl{display:none}.tabs .ts{display:inline}}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--accent);border-color:var(--line)}
h2{font-size:1.05rem;margin:22px 0 8px;letter-spacing:.01em}
h2.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card>h3{margin:0 0 8px;font-size:1rem}
.card h3 .x{font-weight:400;color:var(--muted);font-size:.85rem}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{min-height:44px}
textarea{resize:vertical;line-height:1.4;min-height:44px;display:block;max-width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld>span{font-size:.85rem;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.fld{flex:1;min-width:120px}
.row>.fld.s{flex:.6;min-width:80px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;font-weight:700;padding:6px 2px;cursor:pointer;text-decoration:none}
.linkbtn.danger{color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:38px;text-align:left}
.seg button[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip:hover,.seg button:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.p{background:var(--pos-soft);border-color:var(--pos);color:var(--pos);font-weight:700}
.chip.n{background:var(--neg-soft);border-color:var(--neg);color:var(--neg);font-weight:700}
.chip.p::before{content:"+ "}.chip.n::before{content:"− "}
.legend{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.rgl{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 0}.rgl:first-of-type{margin-top:4px}
.legend b.p{color:var(--pos)}.legend b.n{color:var(--neg)}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.pearls{margin:0 0 10px;padding:9px 11px 9px 28px;border-radius:10px;background:var(--amb-soft);color:var(--amb);font-size:.9rem;line-height:1.4}
.pearls li+li{margin-top:4px}
.tgt textarea{min-height:44px}
.recrow{border-bottom:1px solid var(--line)}.recrow:last-child{border-bottom:0}.recrow .chk{border:0}
.recrow input{margin:0 0 10px 34px;width:calc(100% - 34px)}
.draft{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem;line-height:1.45;margin:0 0 8px}
.abxr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:8px 0;border-bottom:1px solid var(--line)}.abxr:last-child{border-bottom:0}
.pcx{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0 8px}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:.95rem;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details.dd{border-top:1px solid var(--line);margin-top:10px}
details.dd>summary{list-style:none;cursor:pointer;font-weight:700;font-size:.92rem;padding:10px 0 4px;color:var(--accent);display:flex;gap:6px;align-items:center}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:1.1rem;line-height:1}
details.dd[open]>summary::before{transform:rotate(90deg)}

/* lists */
.pt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:64px;text-decoration:none}
.pt:hover{border-color:var(--accent)}
.pt .ab{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.pt .txt{flex:1;min-width:0}
.pt .nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.pt .ds{display:block;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;margin:2px 4px 0 0;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.amb{background:var(--amb-soft);color:var(--amb)}
.tag.mut{background:var(--bg);color:var(--muted)}

/* micro + abx */
.ab-h{display:flex;align-items:flex-start;gap:10px}
.ab-h .nm{flex:1;min-width:0;font-weight:700;font-size:1.02rem}
.ab-h .nm a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.ab-h .nm small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.day{flex:none;text-align:center;background:var(--accent);color:#fff;border-radius:12px;padding:4px 10px;font-weight:700;line-height:1.1}
.day small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.day.off{background:var(--line);color:var(--muted)}
.cardsub{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.flag{border-radius:10px;padding:9px 11px;font-size:.92rem;margin:8px 0 0;line-height:1.4}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.amb{background:var(--amb-soft);color:var(--amb)}
.flag b{font-weight:700}
.bug{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.bug .st{font-weight:700;color:var(--accent)}
.bug dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.bug dt{color:var(--muted);font-weight:700;font-size:.82rem;padding-top:1px}
.bug dd{margin:0}
.bug ul{margin:6px 0 0;padding-left:18px}
.bug li{margin:2px 0}
.sus{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.sus:last-child{border-bottom:0}
.sus span{flex:1;font-size:.92rem;min-width:0}
.sus .seg button{min-height:32px;padding:4px 11px;font-size:.85rem}
.sus .seg button[data-v="S"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.sus .seg button[data-v="I"][aria-pressed="true"]{background:var(--amb);border-color:var(--amb)}
.sus .seg button[data-v="R"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.picklist{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.picklist button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:.95rem}
.picklist button small{color:var(--muted);margin-left:6px;font-size:.82rem}
.picklist button:hover{border-color:var(--accent)}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:.95rem;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;cursor:pointer;min-height:44px}
.chk:last-child{border-bottom:0}
.bx{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center}
.bx svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .bx{background:var(--ok);border-color:var(--ok)}
.chk.on .bx svg{opacity:1}
.trend{font-size:.85rem;color:var(--muted);margin-top:2px}

/* reference */
.lv{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.lvrow{display:flex;gap:10px;align-items:baseline;font-size:.93rem}
.lvrow .k{flex:none;width:94px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lvrow .k.y{color:var(--ok)}.lvrow .k.p{color:var(--amb)}.lvrow .k.v{color:var(--amb)}.lvrow .k.n{color:var(--warn)}
.lvrow .vals{flex:1;min-width:0}
.lvrow .vals a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.stainhd{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.refitem{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;text-decoration:none}
.refitem:hover{border-color:var(--accent)}
.refitem b{display:block;font-size:.98rem}
.refitem span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tips{margin:0;padding-left:18px;font-size:.92rem}.tips li{margin:4px 0}
.mtx{width:100%;border-collapse:collapse;font-size:.85rem}
.mtx td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mtx td:first-child{font-weight:700;width:46%}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-left:8px;vertical-align:middle}
.syncdot.ok{background:var(--ok)}.syncdot.syncing{background:var(--accent);animation:syncpulse 1s ease-in-out infinite}.syncdot.error{background:var(--warn)}
@keyframes syncpulse{50%{opacity:.35}}
code{font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:5px}
#print{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="hd" id="hd"></div><div id="tabs"></div></div></header>
<main class="wrap" id="app"></main>
<script>
/* ================= BUGS & DRUGS DATA ================= */
/* Coverage groups: organisms map to one group; drugs list a level for each group they act on.
   y = reliable coverage, p = active but not preferred, v = variable (check susceptibilities), missing = no. */
const GROUPS={
 MSSA:'MSSA',MRSA:'MRSA and CoNS',STREP:'Streptococci',PNEUMO:'S. pneumoniae',EFAE:'E. faecalis',VRE:'VRE and E. faecium',
 LIST:'Listeria',DIPH:'Corynebacterium',CLOST:'Clostridium',CDIFF:'C. difficile',
 ENT:'Enterobacterales (wild type)',AMPC:'AmpC Enterobacterales',ESBL:'ESBL Enterobacterales',CRE:'CRE',
 PSA:'Pseudomonas',ACB:'Acinetobacter',STENO:'Stenotrophomonas',HFLU:'H. influenzae and Moraxella',NMEN:'N. meningitidis',GC:'N. gonorrhoeae',
 ANA:'Anaerobes (B. fragilis)',ATYP:'Atypicals',CAND:'Candida albicans',CGLAB:'Non-albicans Candida',CRYPT:'Cryptococcus',
 ASPER:'Aspergillus',MUC:'Mucorales',HSV:'HSV and VZV',CMV:'CMV',TB:'M. tuberculosis'
};
const LV={y:'Covers',p:'Active, not preferred',v:'Variable, check susceptibilities',n:'Does not cover'};

/* Gram stain categories, with what to think and what to start while waiting */
const STAINS=[
 {id:'gpc_cl',n:'GPC in clusters',think:'S. aureus versus coagulase-negative staph.',start:'Vancomycin until identified. If rapid PCR shows MSSA (mecA negative), switch to cefazolin or nafcillin. CoNS in 1 of 2 sets is usually a contaminant.'},
 {id:'gpc_ch',n:'GPC in pairs or chains',think:'Streptococci or enterococci. Lancet-shaped pairs suggest pneumococcus.',start:'Vancomycin (covers enterococcus) while speciating; narrow to penicillin or ceftriaxone for strep, ampicillin for E. faecalis.'},
 {id:'gpr',n:'Gram-positive rods',think:'Small: Corynebacterium or Cutibacterium (often contaminants), Listeria. Large: Bacillus, Clostridium.',start:'Vancomycin; add ampicillin if Listeria is possible (pregnancy, age > 50, immunosuppressed). Clostridium in blood: look for GI malignancy or necrotizing infection.'},
 {id:'gnr',n:'Gram-negative rods',think:'Enterobacterales, Pseudomonas, anaerobes (B. fragilis).',start:'Cefepime or piperacillin-tazobactam; meropenem if prior ESBL or septic shock with ESBL risk. Rapid PCR (CTX-M, KPC, NDM) guides early changes.'},
 {id:'gndc',n:'Gram-negative diplococci',think:'N. meningitidis, N. gonorrhoeae, Moraxella.',start:'Ceftriaxone. Droplet precautions if meningococcus is possible.'},
 {id:'gncb',n:'Gram-negative coccobacilli',think:'H. influenzae, Acinetobacter; rarely Brucella or Francisella (warn the lab).',start:'Ceftriaxone for Haemophilus; Acinetobacter per susceptibilities.'},
 {id:'yeast',n:'Yeast',think:'Candida, Cryptococcus. Never a contaminant in blood.',start:'Echinocandin for Candida. Remove central lines, dilated eye exam. Cryptococcus: amphotericin plus flucytosine, check CSF.'},
 {id:'mold',n:'Hyphae (mold)',think:'Septate, acute-angle branching: Aspergillus. Broad, pauci-septate, right-angle: Mucorales.',start:'Voriconazole or isavuconazole for Aspergillus; liposomal amphotericin for Mucorales (voriconazole does not cover). Call ID now.'},
 {id:'afb',n:'Acid-fast bacilli',think:'M. tuberculosis versus nontuberculous mycobacteria; Nocardia is modified acid-fast.',start:'Airborne isolation. NAAT on the specimen. Avoid empiric single agents (fluoroquinolones mask TB).'},
 {id:'none',n:'Not seen on Gram stain',think:'Atypicals (Legionella, Mycoplasma, Chlamydia), viruses, spirochetes, partially treated infection.',start:'Targeted testing: Legionella urine antigen, respiratory PCR panels, serologies.'}
];

/* Organisms. g = coverage group, s = stain category, ov = organism-specific coverage overrides, b = bundle, bo = bundle only for blood */
const BUGS=[
 {id:'mssa',n:'Staphylococcus aureus (MSSA)',g:'MSSA',s:'gpc_cl',stain:'Gram-positive cocci in grape-like clusters',lab:'Catalase +, coagulase +, golden colonies, beta-hemolytic',dz:'Bacteremia, endocarditis, SSTI, osteomyelitis, septic arthritis, PJI, pneumonia',first:'Cefazolin or nafcillin/oxacillin',b:'sab',bo:1,
  p:['Never call S. aureus in blood a contaminant.','Beta-lactams beat vancomycin for MSSA bacteremia; switch once susceptibilities return.','ID consultation lowers mortality in S. aureus bacteremia.']},
 {id:'mrsa',n:'Staphylococcus aureus (MRSA)',g:'MRSA',s:'gpc_cl',stain:'Gram-positive cocci in grape-like clusters',lab:'Catalase +, coagulase +, mecA/PBP2a +',dz:'Bacteremia, endocarditis, SSTI, osteomyelitis, pneumonia',first:'Vancomycin (AUC-guided) or daptomycin',b:'sab',bo:1,
  p:['Persistent bacteremia > 5–7 days on vancomycin: think undrained source, then consider switching to daptomycin ± ceftaroline.','Daptomycin is inactivated by surfactant: do not use for pneumonia.','Doxycycline and TMP-SMX are reasonable oral options for MRSA SSTI.']},
 {id:'cons',n:'Coagulase-negative staphylococci',g:'MRSA',s:'gpc_cl',stain:'Gram-positive cocci in clusters',lab:'Catalase +, coagulase −; most S. epidermidis are methicillin-resistant',dz:'Line infection, prosthetic valve or joint infection, shunt infection',first:'Vancomycin (if real); oxacillin if susceptible',
  p:['1 of 2 blood culture sets is usually a contaminant; 2 of 2, or growth with a line or prosthetic, is more likely real.','Time to positivity > 24 h favors contamination.']},
 {id:'slug',n:'Staphylococcus lugdunensis',g:'MSSA',s:'gpc_cl',stain:'Gram-positive cocci in clusters',lab:'Coagulase-negative but behaves like S. aureus; usually oxacillin-susceptible',dz:'Native valve endocarditis, SSTI, bacteremia',first:'Nafcillin/oxacillin or cefazolin',b:'sab',bo:1,
  p:['Treat a positive blood culture like S. aureus bacteremia, including an echocardiogram.']},
 {id:'spn',n:'Streptococcus pneumoniae',g:'PNEUMO',s:'gpc_ch',stain:'Lancet-shaped gram-positive diplococci',lab:'Alpha-hemolytic, optochin-sensitive, bile-soluble; urine antigen available',dz:'Pneumonia, meningitis, bacteremia, otitis, sinusitis',first:'Ceftriaxone (non-meningitis); add vancomycin for meningitis until susceptibilities',
  p:['Meningitis: dexamethasone with or before the first antibiotic dose.','Penicillin breakpoints differ for meningitis and non-meningitis isolates.']},
 {id:'gas',n:'Streptococcus pyogenes (Group A)',g:'STREP',s:'gpc_ch',stain:'Gram-positive cocci in chains',lab:'Beta-hemolytic, bacitracin-sensitive, PYR +',dz:'Cellulitis, necrotizing fasciitis, pharyngitis, toxic shock, bacteremia',first:'Penicillin; add clindamycin for toxic shock or necrotizing infection',

 {id:'fos',n:'Fosfomycin (PO)',c:'Phosphonic acid',r:'PO',cov:'EFAE:v VRE:v ENT:v ESBL:v',p:['Single-dose cystitis treatment; multi-dose for resistant organisms.']},
 {id:'rif',n:'Rifampin',c:'Rifamycin',r:'IV/PO',cov:'MSSA:p MRSA:p',mon:['Drug interactions (strong CYP inducer)','LFTs'],p:['Never monotherapy for staph: resistance emerges fast.','Added for staph with retained hardware (PJI with DAIR, prosthetic valve).','Turns secretions orange.']},
 {id:'fdx',n:'Fidaxomicin',c:'Macrocyclic',r:'PO',cov:'CDIFF:y',p:['Lower recurrence than oral vancomycin.']},
 {id:'flu',n:'Fluconazole',c:'Azole antifungal',r:'IV/PO',cov:'CAND:y CRYPT:y',mon:['LFTs','QTc','Drug interactions (CYP inhibitor)'],p:['No mold coverage.','Step-down for candidemia once cleared and susceptible.']},
 {id:'mfg',n:'Micafungin (echinocandin)',c:'Echinocandin',r:'IV',cov:'CAND:y CGLAB:y ASPER:p',p:['First line for candidemia.','Poor urine and CNS penetration.']},
 {id:'vor',n:'Voriconazole',c:'Azole antifungal',r:'IV/PO',cov:'CAND:y CGLAB:v ASPER:y CRYPT:v',mon:['Trough after ~5 days','LFTs, QTc, visual changes, hallucinations','Drug interactions'],p:['First line for invasive aspergillosis.','No Mucorales activity.']},
 {id:'isa',n:'Isavuconazole',c:'Azole antifungal',r:'IV/PO',cov:'CAND:y CGLAB:v ASPER:y MUC:y',mon:['LFTs','Drug interactions'],p:['Shortens the QTc (unlike other azoles).']},
 {id:'lamb',n:'Liposomal amphotericin B',c:'Polyene',r:'IV',cov:'CAND:y CGLAB:y CRYPT:y ASPER:y MUC:y',mon:['Creatinine','Potassium and magnesium (wasting)','Infusion reactions'],p:['Mucorales and cryptococcal meningitis induction.']},
 {id:'acv',n:'Acyclovir',c:'Antiviral',r:'IV/PO',cov:'HSV:y',mon:['Creatinine (crystal nephropathy): hydrate','Neurotoxicity in kidney disease'],p:['Use ideal body weight for dosing in obesity.']},
 {id:'gcv',n:'Ganciclovir / valganciclovir',c:'Antiviral',r:'IV/PO',cov:'HSV:y CMV:y',mon:['CBC (myelosuppression)','Creatinine'],p:['Valganciclovir is the oral prodrug.']}
];

/* Bundles triggered by an organism. */
const BUNDLES={
 sab:{n:'S. aureus bacteremia',i:['Repeat blood cultures every 24–48 h until negative','Echocardiogram (TTE; TEE if high risk or TTE nondiagnostic)','Source identified and controlled (lines out, abscess drained, hardware assessed)','Narrowed to cefazolin or nafcillin/oxacillin if MSSA','Evaluated for metastatic foci (spine, joints, lungs)','Duration set from first negative culture (≥ 14 days uncomplicated; 4–6 weeks complicated)']},
 efae:{n:'Enterococcal bacteremia',i:['Repeat blood cultures until negative','Echocardiogram considered (DENOVA/NOVA score)','Source evaluated (urine, biliary, abdomen, lines)','Narrowed to ampicillin if susceptible']},
 gnb:{n:'Gram-negative bacteremia',i:['Source identified and controlled','Narrowed to susceptibilities','Oral step-down considered once afebrile and stable','Duration set (7 days often enough when uncomplicated with source control)']},
 cand:{n:'Candidemia',i:['Central venous catheters removed when feasible','Repeat blood cultures daily or every other day until negative','Dilated ophthalmologic exam','Step-down to fluconazole once stable, cleared, and susceptible','Duration set: 14 days after first negative blood culture (uncomplicated)','Echocardiogram if candidemia persists']},
 cdiff:{n:'C. difficile',i:['Unnecessary antibiotics and PPIs stopped','Contact precautions; soap-and-water hand hygiene','Severity assessed (WBC ≥ 15k or Cr > 1.5 = severe)','Fidaxomicin or oral vancomycin × 10 days','Fulminant: IV metronidazole added, surgery consulted']},
 nmen:{n:'Meningococcal infection',i:['Droplet precautions until 24 h of effective therapy','Chemoprophylaxis arranged for close contacts','Public health notified']},
 tb:{n:'Tuberculosis',i:['Airborne isolation','Three sputum AFB smears and NAAT','HIV test','Public health notified','Baseline LFTs and visual acuity before RIPE']}
};

/* ================= LOOKUPS ================= */
/* ================= LOOKUPS ================= */
DRUGS.forEach(d=>{d.cm=Object.fromEntries(d.cov.split(' ').filter(Boolean).map(x=>x.split(':')))});
const DR=Object.fromEntries(DRUGS.map(d=>[d.id,d]));
const BG=Object.fromEntries(BUGS.map(b=>[b.id,b]));
const ST=Object.fromEntries(STAINS.map(s=>[s.id,s]));
const RANK={y:3,p:2,v:1,n:0};
const KEYMISS=['MRSA','EFAE','PSA','ESBL','ANA','ATYP'];
const COMMON=['van','cfz','cro','fep','tzp','mem','mtz','dap','naf','amp'];

/* ================= HELPERS ================= */
/* ================= HELPERS ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOME=`<a class="homebtn" href="../#clinical" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>`;

function lvl(did,bug,susc){
  const s=susc&&susc[did];if(s==='S')return'y';if(s==='R')return'n';if(s==='I')return'v';
  if(!bug||!DR[did])return'n';
  if(bug.ov&&bug.ov[did])return bug.ov[did];
  return DR[did].cm[bug.g]||'n';
}

/* ================= VIEW ================= */
const hd=document.getElementById('hd'),tabsEl=document.getElementById('tabs'),app=document.getElementById('app');
let refTab='bugs',refQ='';
function parseHash(){return location.hash.slice(1).split('/')}
function render(keep){
  const h=parseHash();const y=window.scrollY;
  if(h[0]==='ref'&&(h[1]==='bug'||h[1]==='drug'))renderRef(h[1],h[2]);else renderRef();
  window.scrollTo(0,keep?y:0);
}

/* ---------- reference ---------- */
function lvRows(map,linkFn){
  return `<div class="lv">${['y','p','v'].filter(k=>map[k]&&map[k].length).map(k=>`<div class="lvrow"><span class="k ${k}">${{y:'Covers',p:'Not preferred',v:'Variable'}[k]}</span><span class="vals">${map[k].map(linkFn).join(', ')}</span></div>`).join('')}</div>`;
}
function renderRef(kind,id){
  hd.innerHTML=kind?`${HOME}<button class="back" data-a="refback" aria-label="Back">‹</button><h1>Bugs &amp; drugs</h1>`:`${HOME}<h1>Spectrum</h1>`;
  if(kind==='bug'&&BG[id]){tabsEl.innerHTML='';const b=BG[id];document.title=b.n+' · Spectrum';
    const map={y:[],p:[],v:[]};DRUGS.forEach(d=>{const l=lvl(d.id,b);if(map[l])map[l].push(d)});
    app.innerHTML=`<div class="card"><span class="stainhd">${esc(ST[b.s].n)}</span><h2 style="margin:8px 0 4px;font-size:1.2rem">${esc(b.n)}</h2>
      <div class="bug" style="border:0;padding:0;background:none"><dl><dt>Gram stain</dt><dd>${esc(b.stain)}</dd><dt>Lab</dt><dd>${esc(b.lab)}</dd><dt>Causes</dt><dd>${esc(b.dz)}</dd><dt>First line</dt><dd><b>${esc(b.first)}</b></dd></dl></div>
      ${b.p&&b.p.length?`<ul class="tips" style="padding-left:18px;margin:10px 0 0">${b.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>
      <div class="card"><h3>Drugs with activity <span class="x">(${esc(GROUPS[b.g])})</span></h3>${map.y.length+map.p.length+map.v.length?lvRows(map,d=>`<a href="#ref/drug/${d.id}">${esc(d.n)}</a>`):'<p class="sub">None of the listed drugs: see first-line therapy above.</p>'}
      <p class="hint">Variable means it depends on the isolate: go by susceptibilities.</p></div>
      ${b.b?`<div class="card"><h3>${esc(BUNDLES[b.b].n)} checklist${b.bo?' <span class="x">(blood isolates)</span>':''}</h3><ul class="tips" style="padding-left:18px;margin:0">${BUNDLES[b.b].i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      <p class="foot">Study aid. Confirm against susceptibilities, your local antibiogram, and pharmacy.</p>`;return}
  if(kind==='drug'&&DR[id]){tabsEl.innerHTML='';const d=DR[id];document.title=d.n+' · Spectrum';
    const map={y:[],p:[],v:[]};Object.entries(d.cm).forEach(([g,l])=>{if(map[l])map[l].push(g)});
    const miss=Object.keys(GROUPS).filter(g=>!d.cm[g]&&KEYMISS.includes(g));
    const bugs=BUGS.filter(b=>lvl(d.id,b)==='y');
    app.innerHTML=`<div class="card"><span class="stainhd">${esc(d.c)}</span><h2 style="margin:8px 0 4px;font-size:1.2rem">${esc(d.n)}</h2><p class="sub">Route: ${d.r}</p>
      ${lvRows(map,g=>esc(GROUPS[g]))}${miss.length?`<div class="lvrow" style="margin-top:6px"><span class="k n">Misses</span><span class="vals">${esc(miss.map(g=>GROUPS[g]).join(', '))}</span></div>`:''}</div>
      ${d.mon&&d.mon.length?`<div class="card"><h3>Monitor</h3><ul class="tips" style="padding-left:18px;margin:0">${d.mon.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${d.p&&d.p.length?`<div class="card"><h3>Pearls</h3><ul class="tips" style="padding-left:18px;margin:0">${d.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${bugs.length?`<div class="card"><h3>Reliable for</h3>${bugs.map(b=>`<a class="refitem" href="#ref/bug/${b.id}"><b>${esc(b.n)}</b><span>${esc(ST[b.s].n)}</span></a>`).join('')}</div>`:''}
      <p class="foot">No doses here on purpose: dose with pharmacy for weight, renal function, and site of infection.</p>`;return}
  document.title='Spectrum';
  tabsEl.innerHTML=`<nav class="tabs">${[['bugs','Bugs'],['drugs','Drugs'],['stain','Gram stain'],['grid','Coverage grid']].map(([k,n])=>`<a href="#" data-a="reftab" data-v="${k}" ${refTab===k?'aria-current="page"':''}>${n}</a>`).join('')}</nav>`;
  const q=refQ.toLowerCase();let h='';
  if(refTab!=='stain'&&refTab!=='grid')h+=`<input id="refq" type="search" placeholder="Search ${refTab==='bugs'?'organisms':'drugs or classes'}" value="${esc(refQ)}" autocomplete="off" style="margin:4px 0 8px">`;
  if(refTab==='bugs'){
    STAINS.forEach(s=>{const L=BUGS.filter(b=>b.s===s.id&&(!q||(b.n+' '+b.dz+' '+GROUPS[b.g]).toLowerCase().includes(q)));if(!L.length)return;
      h+=`<h2 class="sec">${esc(s.n)}</h2>`+L.map(b=>`<a class="refitem" href="#ref/bug/${b.id}"><b>${esc(b.n)}</b><span>${esc(b.first)}</span></a>`).join('')});
  }else if(refTab==='drugs'){
    const cls=[...new Set(DRUGS.map(d=>d.c))];
    cls.forEach(c=>{const L=DRUGS.filter(d=>d.c===c&&(!q||(d.n+' '+d.c).toLowerCase().includes(q)));if(!L.length)return;
      h+=`<h2 class="sec">${esc(c)}</h2>`+L.map(d=>`<a class="refitem" href="#ref/drug/${d.id}"><b>${esc(d.n)}</b><span>${esc(Object.entries(d.cm).filter(([g,l])=>l==='y').map(([g])=>GROUPS[g]).join(', '))}</span></a>`).join('')});
  }else if(refTab==='stain'){
    h+=`<p class="sub" style="margin:6px 0 10px">What a Gram stain or early culture report usually means, and what to start while you wait.</p>`;
    STAINS.forEach(s=>{const L=BUGS.filter(b=>b.s===s.id);h+=`<div class="card"><h3>${esc(s.n)}</h3><div class="bug" style="margin-top:0"><dl><dt>Think</dt><dd>${esc(s.think)}</dd><dt>Start</dt><dd>${esc(s.start)}</dd></dl></div>
      <div class="chips">${L.map(b=>`<a class="chip" style="text-decoration:none" href="#ref/bug/${b.id}">${esc(b.n)}</a>`).join('')}</div></div>`});
  }else{
    const gsel=refQ&&GROUPS[refQ]?refQ:'MRSA';
    h+=`<p class="sub" style="margin:6px 0 10px">Pick a target to see what covers it.</p><div class="chips">${Object.entries(GROUPS).map(([g,n])=>`<button type="button" class="chip${g===gsel?' on':''}" data-a="grid" data-v="${g}">${esc(n)}</button>`).join('')}</div>`;
    const rows=DRUGS.map(d=>[d,d.cm[gsel]||'n']).filter(([d,l])=>l!=='n').sort((a,b)=>RANK[b[1]]-RANK[a[1]]);
    h+=`<div class="card" style="margin-top:12px"><h3>${esc(GROUPS[gsel])}</h3>${rows.length?`<table class="mtx">${rows.map(([d,l])=>`<tr><td><a href="#ref/drug/${d.id}" style="color:inherit">${esc(d.n)}</a></td><td><span class="tag ${l==='y'?'ok':'amb'}">${LV[l]}</span></td></tr>`).join('')}</table>`:'<p class="sub">No listed drug covers this: see the organism card for first-line therapy.</p>'}</div>`;
  }
  if(!h.includes('refitem')&&refTab!=='stain'&&refTab!=='grid')h+=`<div class="empty">Nothing matches “${esc(refQ)}”.</div>`;
  h+=`<p class="foot">Study aid. Confirm against susceptibilities, your local antibiogram, and pharmacy.</p>`;
  app.innerHTML=h;
}

/* ================= EVENTS ================= */
app.addEventListener('input',e=>{const t=e.target;
  if(t.id==='refq'){refQ=t.value;const pos=t.selectionStart;render(true);const q=document.getElementById('refq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='grid'){refQ=b.dataset.v;render(true)}});
hd.addEventListener('click',e=>{const b=e.target.closest('[data-a="refback"]');if(!b)return;
  let nav=false;try{nav=!!sessionStorage.getItem('sp.nav')}catch(_){}if(nav)history.back();else location.hash=''});
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-a="reftab"]');if(!b)return;e.preventDefault();refTab=b.dataset.v;refQ='';if(location.hash)location.hash='';else render()});
window.addEventListener('hashchange',()=>{try{sessionStorage.setItem('sp.nav','1')}catch(_){}render()});
/* Always open on the main reference page. */
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
try{sessionStorage.removeItem('sp.nav')}catch(_){}
window.addEventListener('pageshow',e=>{if(e.persisted&&location.hash){history.replaceState(null,'',location.pathname+location.search);render()}});
render();
</script>
