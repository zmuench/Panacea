<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spectrum">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Spectrum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Spectrum: ID consult HPI, micro and antimicrobial tracking, ID progress notes, bugs and drugs reference.
   Palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;--amb:#7A5000;--amb-soft:#FBF0D9;
  --pos:#A8261C;--pos-soft:#FBE7E5;--neg:#1D6E49;--neg-soft:#E1F2E9;
  --paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1 small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover,.homebtn:active{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.refbtn{font:inherit;font-size:.88rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tabs a{flex:1;text-align:center;font-size:.9rem;font-weight:700;color:var(--muted);text-decoration:none;padding:8px 4px;border-radius:10px;border:1px solid transparent}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--accent);border-color:var(--line)}
h2{font-size:1.05rem;margin:22px 0 8px;letter-spacing:.01em}
h2.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card>h3{margin:0 0 8px;font-size:1rem}
.card h3 .x{font-weight:400;color:var(--muted);font-size:.85rem}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{min-height:44px}
textarea{resize:vertical;line-height:1.4;min-height:44px;display:block;max-width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld>span{font-size:.85rem;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.fld{flex:1;min-width:120px}
.row>.fld.s{flex:.6;min-width:80px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;font-weight:700;padding:6px 2px;cursor:pointer;text-decoration:none}
.linkbtn.danger{color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:38px;text-align:left}
.seg button[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip:hover,.seg button:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.p{background:var(--pos-soft);border-color:var(--pos);color:var(--pos);font-weight:700}
.chip.n{background:var(--neg-soft);border-color:var(--neg);color:var(--neg);font-weight:700}
.chip.p::before{content:"+ "}.chip.n::before{content:"− "}
.legend{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.legend b.p{color:var(--pos)}.legend b.n{color:var(--neg)}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:.95rem;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details.dd{border-top:1px solid var(--line);margin-top:10px}
details.dd>summary{list-style:none;cursor:pointer;font-weight:700;font-size:.92rem;padding:10px 0 4px;color:var(--accent);display:flex;gap:6px;align-items:center}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:1.1rem;line-height:1}
details.dd[open]>summary::before{transform:rotate(90deg)}

/* lists */
.pt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:64px;text-decoration:none}
.pt:hover{border-color:var(--accent)}
.pt .ab{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.pt .txt{flex:1;min-width:0}
.pt .nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.pt .ds{display:block;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;margin:2px 4px 0 0;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.amb{background:var(--amb-soft);color:var(--amb)}
.tag.mut{background:var(--bg);color:var(--muted)}

/* micro + abx */
.ab-h{display:flex;align-items:flex-start;gap:10px}
.ab-h .nm{flex:1;min-width:0;font-weight:700;font-size:1.02rem}
.ab-h .nm a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.ab-h .nm small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.day{flex:none;text-align:center;background:var(--accent);color:#fff;border-radius:12px;padding:4px 10px;font-weight:700;line-height:1.1}
.day small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.day.off{background:var(--line);color:var(--muted)}
.cardsub{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.flag{border-radius:10px;padding:9px 11px;font-size:.92rem;margin:8px 0 0;line-height:1.4}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.amb{background:var(--amb-soft);color:var(--amb)}
.flag b{font-weight:700}
.bug{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.bug .st{font-weight:700;color:var(--accent)}
.bug dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.bug dt{color:var(--muted);font-weight:700;font-size:.82rem;padding-top:1px}
.bug dd{margin:0}
.bug ul{margin:6px 0 0;padding-left:18px}
.bug li{margin:2px 0}
.sus{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.sus:last-child{border-bottom:0}
.sus span{flex:1;font-size:.92rem;min-width:0}
.sus .seg button{min-height:32px;padding:4px 11px;font-size:.85rem}
.sus .seg button[data-v="S"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.sus .seg button[data-v="I"][aria-pressed="true"]{background:var(--amb);border-color:var(--amb)}
.sus .seg button[data-v="R"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.picklist{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.picklist button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:.95rem}
.picklist button small{color:var(--muted);margin-left:6px;font-size:.82rem}
.picklist button:hover{border-color:var(--accent)}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:.95rem;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;cursor:pointer;min-height:44px}
.chk:last-child{border-bottom:0}
.bx{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center}
.bx svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .bx{background:var(--ok);border-color:var(--ok)}
.chk.on .bx svg{opacity:1}
.trend{font-size:.85rem;color:var(--muted);margin-top:2px}

/* reference */
.lv{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.lvrow{display:flex;gap:10px;align-items:baseline;font-size:.93rem}
.lvrow .k{flex:none;width:94px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lvrow .k.y{color:var(--ok)}.lvrow .k.p{color:var(--amb)}.lvrow .k.v{color:var(--amb)}.lvrow .k.n{color:var(--warn)}
.lvrow .vals{flex:1;min-width:0}
.lvrow .vals a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.stainhd{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.refitem{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;text-decoration:none}
.refitem:hover{border-color:var(--accent)}
.refitem b{display:block;font-size:.98rem}
.refitem span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tips{margin:0;padding-left:18px;font-size:.92rem}.tips li{margin:4px 0}
.mtx{width:100%;border-collapse:collapse;font-size:.85rem}
.mtx td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mtx td:first-child{font-weight:700;width:46%}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-left:8px;vertical-align:middle}
.syncdot.ok{background:var(--ok)}.syncdot.syncing{background:var(--accent);animation:syncpulse 1s ease-in-out infinite}.syncdot.error{background:var(--warn)}
@keyframes syncpulse{50%{opacity:.35}}
code{font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:5px}
#print{display:none}
@media print{
  @page{size:letter;margin:.45in}
  html,body{background:#fff!important}
  body.printing header.top,body.printing main,body.printing .toast{display:none!important}
  body.printing #print{display:block}
  #print{color:#000;font-size:10.5pt;line-height:1.3}
  .sheet{break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;gap:12px}
  .pb{font-size:18pt;font-weight:700;line-height:1}
  .pm{font-size:10pt;margin-top:3px}
  .pr{text-align:right;font-size:9.5pt}
  .one{margin:6px 0;font-size:10.5pt}
  .al{border:1.5px solid #000;border-radius:4px;padding:4px 7px;margin:6px 0;font-weight:700;font-size:9.5pt}
  #print h4{font-size:9pt;text-transform:uppercase;letter-spacing:.06em;margin:9px 0 3px;border-bottom:1px solid #999}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #print th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.04em;color:#333;border-bottom:1px solid #000;padding:2px 4px}
  #print td{border-bottom:1px solid #ccc;padding:3px 4px;vertical-align:top}
  #print td.c{text-align:center}
  #print tr.off td{color:#666}
  #print table.tr td,#print table.tr th{text-align:center}#print table.tr td:first-child{text-align:left;width:14%}
  .kd{margin:4px 0;font-size:9.5pt}
  .mut{color:#555;margin:2px 0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  ul.ck{list-style:none;margin:0;padding:0;font-size:9.5pt}ul.ck li{margin:2px 0;padding-left:1.2em;text-indent:-1.2em}
  dl.bg{margin:0;font-size:9.5pt;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}dl.bg dt{font-weight:700}dl.bg dd{margin:0}
  .notes{min-height:1.6in}
  .ft{float:right;margin-top:10px;font-size:7.5pt;color:#555}
  #print section,#print table,#print tr,.al,.cols>div{break-inside:avoid}
  #print .sheet{break-inside:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="hd" id="hd"></div><div id="tabs"></div></div></header>
<main class="wrap" id="app"></main>
<div id="print"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= BUGS & DRUGS DATA ================= */
/* Coverage groups: organisms map to one group; drugs list a level for each group they act on.
   y = reliable coverage, p = active but not preferred, v = variable (check susceptibilities), missing = no. */
const GROUPS={
 MSSA:'MSSA',MRSA:'MRSA and CoNS',STREP:'Streptococci',PNEUMO:'S. pneumoniae',EFAE:'E. faecalis',VRE:'VRE and E. faecium',
 LIST:'Listeria',DIPH:'Corynebacterium',CLOST:'Clostridium',CDIFF:'C. difficile',
 ENT:'Enterobacterales (wild type)',AMPC:'AmpC Enterobacterales',ESBL:'ESBL Enterobacterales',CRE:'CRE',
 PSA:'Pseudomonas',ACB:'Acinetobacter',STENO:'Stenotrophomonas',HFLU:'H. influenzae and Moraxella',NMEN:'N. meningitidis',GC:'N. gonorrhoeae',
 ANA:'Anaerobes (B. fragilis)',ATYP:'Atypicals',CAND:'Candida albicans',CGLAB:'Non-albicans Candida',CRYPT:'Cryptococcus',
 ASPER:'Aspergillus',MUC:'Mucorales',HSV:'HSV and VZV',CMV:'CMV',TB:'M. tuberculosis'
};
const LV={y:'Covers',p:'Active, not preferred',v:'Variable, check susceptibilities',n:'Does not cover'};

/* Gram stain categories, with what to think and what to start while waiting */
const STAINS=[
 {id:'gpc_cl',n:'GPC in clusters',think:'S. aureus versus coagulase-negative staph.',start:'Vancomycin until identified. If rapid PCR shows MSSA (mecA negative), switch to cefazolin or nafcillin. CoNS in 1 of 2 sets is usually a contaminant.'},
 {id:'gpc_ch',n:'GPC in pairs or chains',think:'Streptococci or enterococci. Lancet-shaped pairs suggest pneumococcus.',start:'Vancomycin (covers enterococcus) while speciating; narrow to penicillin or ceftriaxone for strep, ampicillin for E. faecalis.'},
 {id:'gpr',n:'Gram-positive rods',think:'Small: Corynebacterium or Cutibacterium (often contaminants), Listeria. Large: Bacillus, Clostridium.',start:'Vancomycin; add ampicillin if Listeria is possible (pregnancy, age > 50, immunosuppressed). Clostridium in blood: look for GI malignancy or necrotizing infection.'},
 {id:'gnr',n:'Gram-negative rods',think:'Enterobacterales, Pseudomonas, anaerobes (B. fragilis).',start:'Cefepime or piperacillin-tazobactam; meropenem if prior ESBL or septic shock with ESBL risk. Rapid PCR (CTX-M, KPC, NDM) guides early changes.'},
 {id:'gndc',n:'Gram-negative diplococci',think:'N. meningitidis, N. gonorrhoeae, Moraxella.',start:'Ceftriaxone. Droplet precautions if meningococcus is possible.'},
 {id:'gncb',n:'Gram-negative coccobacilli',think:'H. influenzae, Acinetobacter; rarely Brucella or Francisella (warn the lab).',start:'Ceftriaxone for Haemophilus; Acinetobacter per susceptibilities.'},
 {id:'yeast',n:'Yeast',think:'Candida, Cryptococcus. Never a contaminant in blood.',start:'Echinocandin for Candida. Remove central lines, dilated eye exam. Cryptococcus: amphotericin plus flucytosine, check CSF.'},
 {id:'mold',n:'Hyphae (mold)',think:'Septate, acute-angle branching: Aspergillus. Broad, pauci-septate, right-angle: Mucorales.',start:'Voriconazole or isavuconazole for Aspergillus; liposomal amphotericin for Mucorales (voriconazole does not cover). Call ID now.'},
 {id:'afb',n:'Acid-fast bacilli',think:'M. tuberculosis versus nontuberculous mycobacteria; Nocardia is modified acid-fast.',start:'Airborne isolation. NAAT on the specimen. Avoid empiric single agents (fluoroquinolones mask TB).'},
 {id:'none',n:'Not seen on Gram stain',think:'Atypicals (Legionella, Mycoplasma, Chlamydia), viruses, spirochetes, partially treated infection.',start:'Targeted testing: Legionella urine antigen, respiratory PCR panels, serologies.'}
];

/* Organisms. g = coverage group, s = stain category, ov = organism-specific coverage overrides, b = bundle, bo = bundle only for blood */
const BUGS=[
 {id:'mssa',n:'Staphylococcus aureus (MSSA)',g:'MSSA',s:'gpc_cl',stain:'Gram-positive cocci in grape-like clusters',lab:'Catalase +, coagulase +, golden colonies, beta-hemolytic',dz:'Bacteremia, endocarditis, SSTI, osteomyelitis, septic arthritis, PJI, pneumonia',first:'Cefazolin or nafcillin/oxacillin',b:'sab',bo:1,
  p:['Never call S. aureus in blood a contaminant.','Beta-lactams beat vancomycin for MSSA bacteremia; switch once susceptibilities return.','ID consultation lowers mortality in S. aureus bacteremia.']},
 {id:'mrsa',n:'Staphylococcus aureus (MRSA)',g:'MRSA',s:'gpc_cl',stain:'Gram-positive cocci in grape-like clusters',lab:'Catalase +, coagulase +, mecA/PBP2a +',dz:'Bacteremia, endocarditis, SSTI, osteomyelitis, pneumonia',first:'Vancomycin (AUC-guided) or daptomycin',b:'sab',bo:1,
  p:['Persistent bacteremia > 5–7 days on vancomycin: think undrained source, then consider switching to daptomycin ± ceftaroline.','Daptomycin is inactivated by surfactant: do not use for pneumonia.','Doxycycline and TMP-SMX are reasonable oral options for MRSA SSTI.']},
 {id:'cons',n:'Coagulase-negative staphylococci',g:'MRSA',s:'gpc_cl',stain:'Gram-positive cocci in clusters',lab:'Catalase +, coagulase −; most S. epidermidis are methicillin-resistant',dz:'Line infection, prosthetic valve or joint infection, shunt infection',first:'Vancomycin (if real); oxacillin if susceptible',
  p:['1 of 2 blood culture sets is usually a contaminant; 2 of 2, or growth with a line or prosthetic, is more likely real.','Time to positivity > 24 h favors contamination.']},

/* ---------- sync across devices (optional: same private GitHub repo as ICU Rounder) ----------
   Each patient carries _mod (last-changed time); deleted patients leave a dated tombstone in S._deleted.
   Merging keeps the newer copy of each patient, so two devices can both edit without losing changes. */
const SYNC_KEY='panacea.spectrum.sync',SYNC_FILE='spectrum.json',ROUNDER_SYNC='icu-rounds-sync';
let SY=null;try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'null')}catch(e){}
let syncInfo={status:SY?'idle':'off',msg:'',at:null},syncErr='';
let snap={},syncing=false,syncAgain=false,syncT=null,renderPending=false;
const strip=p=>{const{_mod,...r}=p;return JSON.stringify(r)};
function initSnap(){snap={};for(const p of S.pts)snap[p.id]=strip(p)}
function stampChanges(){const now=Date.now(),seen={};S._deleted=S._deleted||{};
  for(const p of S.pts){const j=strip(p);if(snap[p.id]===undefined?!p._mod:snap[p.id]!==j)p._mod=now;snap[p.id]=j;seen[p.id]=1}
  for(const id in snap)if(!seen[id]){S._deleted[id]=now;delete snap[id]}}
function mergeState(L,R){
  const del=Object.assign({},R._deleted||{});for(const[k,v]of Object.entries(L._deleted||{}))del[k]=Math.max(del[k]||0,v);
  const cutoff=Date.now()-30*864e5;for(const k in del)if(del[k]<cutoff)delete del[k];
  const by=new Map(),order=[];
  for(const p of R.pts||[]){by.set(p.id,p);order.push(p.id)}
  for(const p of L.pts){const r=by.get(p.id);if(!r){by.set(p.id,p);order.push(p.id)}else if((p._mod||0)>=(r._mod||0))by.set(p.id,p)}
  return Object.assign({},L,{pts:order.map(id=>by.get(id)).filter(p=>!(del[p.id]&&del[p.id]>=(p._mod||0))),_deleted:del})}
const b64enc=str=>{const b=new TextEncoder().encode(str);let s2='';for(const x of b)s2+=String.fromCharCode(x);return btoa(s2)};
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opts={},auth=SY){
  const r=await fetch(`https://api.github.com/repos/${auth.owner}/${auth.repo}${path}`,{cache:'no-store',...opts,
    headers:{Authorization:`Bearer ${auth.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return(opts.headers&&opts.headers.Accept||'').includes('raw')?r.text():r.json()}
async function remoteGet(){
  try{const m=await gh('/contents/'+SYNC_FILE);
    const txt=m.content?b64dec(m.content):await gh('/contents/'+SYNC_FILE,{headers:{Accept:'application/vnd.github.raw+json'}});
    let doc=null;try{doc=JSON.parse(txt)}catch(e){}return{doc,sha:m.sha}}
  catch(e){if(e.status===404||e.status===409)return{doc:null,sha:null};throw e}}
function remotePut(doc,sha){return gh('/contents/'+SYNC_FILE,{method:'PUT',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:'Spectrum sync',content:b64enc(JSON.stringify(doc)),...(sha?{sha}:{})})})}
function syncLabel(){const i=syncInfo;
  if(i.status==='off')return'Not syncing';if(i.status==='syncing')return'Syncing…';
  if(i.status==='error')return'Not synced: '+i.msg+'. Changes are saved on this device and will sync once this is fixed.';
  return i.at?'Synced '+i.at.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Ready'}
function setSync(status,msg=''){syncInfo={status,msg,at:status==='ok'?new Date():syncInfo.at};
  const d=document.getElementById('syncdot');if(d){d.className='syncdot '+status;d.title=syncLabel()}
  const l=document.getElementById('syncline');if(l)l.textContent=syncLabel()}
function softRender(){const ae=document.activeElement;
  if(ae&&ae.closest&&(ae.closest('#app'))&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){renderPending=true;return}
  renderPending=false;render(true)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending)softRender()},0));
function scheduleSync(ms=1500){if(!SY)return;clearTimeout(syncT);syncT=setTimeout(syncNow,ms)}
async function syncNow(){if(!SY)return;clearTimeout(syncT);syncT=null;if(syncing){syncAgain=true;return}
  syncing=true;setSync('syncing');
  try{
    for(let attempt=0;;attempt++){
      if(saveT)writeNow();
      const rem=await remoteGet();
      if(rem.doc&&Array.isArray(rem.doc.pts)){
        const merged=mergeState(S,rem.doc);
        if(JSON.stringify(merged.pts)!==JSON.stringify(S.pts)){
          if(curPtId()&&!merged.pts.some(p=>p.id===curPtId()))location.hash='';
          S=merged;initSnap();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}softRender()}
        else S._deleted=merged._deleted}
      const out={app:'spectrum',version:1,updated:new Date().toISOString(),pts:S.pts,_deleted:S._deleted||{}};
      if(rem.doc&&JSON.stringify(rem.doc.pts)===JSON.stringify(out.pts)&&JSON.stringify(rem.doc._deleted||{})===JSON.stringify(out._deleted))break;
      try{await remotePut(out,rem.sha);break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}}
    setSync('ok')}
  catch(e){setSync('error',e.status===401?'GitHub no longer accepts this token':e.status===403||e.status===404?'this device can’t reach '+SY.owner+'/'+SY.repo:navigator.onLine===false?'offline':'couldn’t reach GitHub')}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(300)}}}
function rounderSync(){try{const r=JSON.parse(localStorage.getItem(ROUNDER_SYNC)||'null');return r&&r.token&&r.owner&&r.repo?r:null}catch(e){return null}}
async function connectSync(useRounder){
  let auth;
  if(useRounder)auth=rounderSync();
  else{const token=((document.getElementById('syncToken')||{}).value||'').trim(),repoFull=((document.getElementById('syncRepo')||{}).value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
    const[owner,repo]=repoFull.split('/');auth={token,owner,repo}}
  syncErr='';
  if(!auth||!auth.token||!auth.owner||!auth.repo){syncErr='Add your token and the repo as owner/name.';render(true);return}
  try{const info=await gh('',{},auth);
    if(!info.private){syncErr=`${auth.owner}/${auth.repo} is public. Make it private (its Settings → General → Danger Zone) so patient data isn’t visible to anyone.`;render(true);return}
    if(info.permissions&&!info.permissions.push){syncErr='That token can read the repo but not save to it. Give it “Contents: Read and write”.';render(true);return}
    SY={token:auth.token,owner:info.owner&&info.owner.login||auth.owner,repo:info.name||auth.repo};localStorage.setItem(SYNC_KEY,JSON.stringify(SY));

function newPt(){return{id:uid(),bed:'',age:'',sex:'',team:'',pmh:'',created:today(),off:false,
  reason:'',q:'',story:'',pert:{},exp:{},expD:'',imm:[],prior:[],recent:'',allergy:'',devices:'',vacc:'',concern:'',inclMicro:true,
  abx:[],cx:[],clear:'',sc:'',scTxt:'',bnd:{},days:{},oneliner:'',opat:{on:false,line:'',labs:'',fu:'',stop:''}}}
const P=id=>S.pts.find(p=>p.id===id);

/* ================= CLINICAL LOGIC ================= */
function lvl(did,bug,susc){
  const s=susc&&susc[did];if(s==='S')return'y';if(s==='R')return'n';if(s==='I')return'v';
  if(!bug||!DR[did])return'n';
  if(bug.ov&&bug.ov[did])return bug.ov[did];
  return DR[did].cm[bug.g]||'n';
}
const active=pt=>pt.abx.filter(a=>!a.end);
function anchorDate(pt,a){return a.anch==='clear'?pt.clear:a.anch==='sc'?pt.sc:a.start}
const ANCH={start:'start of therapy',clear:'first negative blood culture',sc:'source control'};
function abxInfo(pt,a,ref){
  ref=ref||today();
  const last=a.end&&a.end<ref?a.end:ref;
  const day=a.start?diff(a.start,last)+1:null;
  const an=anchorDate(pt,a);const dur=+a.dur||0;
  const endD=an&&dur?addDays(an,dur-1):'';
  const dOf=an&&dur?diff(an,ref)+1:null;
  return{day,endD,dOf,dur,an};
}
function coverage(pt,c){
  const bug=BG[c.org];if(!bug)return null;
  const act=active(pt);const by={y:[],p:[],v:[],n:[]};
  act.forEach(a=>by[lvl(a.d,bug,c.susc)].push(DR[a.d].n));
  const best=act.length?['y','p','v','n'].find(k=>by[k].length):null;
  return{bug,by,best};
}
function posCultures(pt){return pt.cx.filter(c=>c.st==='pos')}
function bundles(pt){
  const out=[];const seen={};
  posCultures(pt).forEach(c=>{const b=BG[c.org];if(!b||!b.b)return;if(b.bo&&c.site!=='Blood')return;if(seen[b.b])return;seen[b.b]=1;out.push(b.b)});
  return out;
}
function clearSuggest(pt){
  const bl=pt.cx.filter(c=>c.site==='Blood'&&c.date).sort((a,b)=>a.date<b.date?-1:1);
  const pos=bl.filter(c=>c.st==='pos');if(!pos.length)return'';
  const lastPos=pos[pos.length-1].date;
  const neg=bl.find(c=>(c.st==='neg'||c.st==='ngtd')&&c.date>lastPos);
  return neg?neg.date:'';
}
const stainText=id=>ST[id]?ST[id].n.replace(/^GPC/,'gram-positive cocci').replace(/^Gram/,'gram'):'';
function orgLabel(c){if(c.org&&BG[c.org])return BG[c.org].n;return(c.orgTxt||'').trim()}
function cxLine(c){
  const head=`${c.site||'Culture'}${c.date?' ('+md(c.date)+')':''}${c.sets?' ['+c.sets+']':''}`;
  let body='';
  if(c.st==='pend')body=c.stain?`${stainText(c.stain)} on Gram stain; identification pending`:'pending';
  else if(c.st==='ngtd')body='no growth to date';
  else if(c.st==='neg')body='no growth (final)';
  else if(c.st==='con')body=(orgLabel(c)||'growth')+', likely contaminant';
  else if(c.st==='pos'){
    const o=orgLabel(c)||(c.stain?stainText(c.stain)+' on Gram stain, identification pending':'positive');
    const s=c.susc||{};const grp={S:[],I:[],R:[]};
    Object.entries(s).forEach(([k,v])=>{if(DR[k]&&grp[v])grp[v].push(lc1(DR[k].n))});
    const parts=[];if(grp.S.length)parts.push('S: '+grp.S.join(', '));if(grp.I.length)parts.push('I: '+grp.I.join(', '));if(grp.R.length)parts.push('R: '+grp.R.join(', '));
    body=o+(parts.length?' ('+parts.join('; ')+')':'');
  }
  else body='pending';
  return head+': '+body;
}
function abxLine(pt,a,ref){
  const d=DR[a.d];const i=abxInfo(pt,a,ref);
  if(a.end)return `${d.n}${a.dose?' '+a.dose:''}: ${md(a.start)}–${md(a.end)} (${i.day} day${i.day===1?'':'s'})`;
  let t=`${d.n}${a.dose?' '+a.dose:''}: day ${i.day??'?'}${a.start?' (started '+md(a.start)+')':''}`;
  if(i.dur){t+=a.anch&&a.anch!=='start'&&i.an?`; ${i.dur} days from ${ANCH[a.anch]} on ${md(i.an)}, through ${md(i.endD)}`:i.an?`; planned ${i.dur} days, through ${md(i.endD)}`:`; planned ${i.dur} days from ${ANCH[a.anch]} (date not set)`;}
  return t;
}
function monitoring(pt){
  const L=[];active(pt).forEach(a=>{const d=DR[a.d];(d.mon||[]).forEach(m=>L.push(`${d.n}: ${lc1(m)}`))});return L;
}
function opatLabs(pt){
  const s=new Set(['CBC with differential and BMP weekly']);
  active(pt).forEach(a=>{const id=a.d;
    if(id==='van')s.add('Vancomycin level weekly');if(id==='dap')s.add('CK weekly');if(id==='naf')s.add('LFTs weekly');
    if(id==='gen')s.add('Aminoglycoside levels weekly');if(id==='vor')s.add('Voriconazole trough and LFTs');
    if(['cro','fep','cfz','etp','mem','tzp','dap','van'].includes(id))s.add('ESR and CRP weekly (bone/joint or endovascular infection)');});
  return[...s].join('; ');
}

/* ================= TEXT OUTPUTS ================= */
function pron(pt){return pt.sex==='male'?['He','his']:pt.sex==='female'?['She','her']:['The patient','their']}
function hpiText(pt){
  const[He]=pron(pt);const r=RS[pt.reason];const out=[];
  const age=String(pt.age||'').trim();const art=/^(8|11|18)/.test(age)?'an':'a';
  const pmh=[...pt.imm,...String(pt.pmh||'').split(',').map(s=>s.trim()).filter(Boolean)];
  const rfPos=r?r.rf.filter(x=>(pt.pert[r.id]||{})[x]==='p'):[];
  const pmhAll=[...new Set(pmh)];
  out.push(`The patient is ${age?art+' '+age:'a ***'} y/o ${pt.sex||'***'} with a PMHx of ${pmhAll.length?andL(pmhAll):'***'} presenting today for evaluation of ${r?r.pf:'***'}.`);
  out.push(`Infectious Diseases is consulted by the ${pt.team.trim()||'***'} team regarding ${(pt.q.trim()||(r?r.q:'***')).replace(/\.$/,'')}.`);
  if(pt.story.trim())out.push(sent(pt.story));
  if(r){
    const m=pt.pert[r.id]||{};
    const sp=r.sx.filter(x=>m[x]==='p'),sn=r.sx.filter(x=>m[x]==='n');
    if(sp.length)out.push(`${He} reports ${andL(sp)}.`);
    if(sn.length)out.push(`${He} denies ${orL(sn)}.`);
    const rn=r.rf.filter(x=>m[x]==='n');
    if(rfPos.length)out.push(`History is notable for ${andL(rfPos)}.`);
    if(rn.length)out.push(`${He} has no history of ${orL(rn.map(noArt))}.`);
  }
  const ep=EXPOSURES.filter(x=>pt.exp[x]==='p'),en=EXPOSURES.filter(x=>pt.exp[x]==='n');
  if(ep.length)out.push(`Exposure history is notable for ${andL(ep)}.`);
  if(en.length)out.push(`${He} denies ${orL(en)}.`);
  if(pt.expD.trim())out.push(sent(pt.expD));
  if(pt.prior.length)out.push(`Prior cultures have grown ${andL(pt.prior)}.`);
  if(pt.recent.trim())out.push(sent(`Antibiotics in the last 90 days: ${pt.recent.trim()}`));
  if(pt.allergy.trim())out.push(/^(none|nkda|no known)/i.test(pt.allergy.trim())?`${He} has no known antimicrobial allergies.`:sent(`Antimicrobial allergies: ${pt.allergy.trim()}`));
  if(pt.devices.trim())out.push(sent(`Indwelling devices and hardware: ${pt.devices.trim()}`));
  if(pt.vacc.trim())out.push(sent(`Vaccinations: ${pt.vacc.trim()}`));
  if(pt.inclMicro){
    const cx=pt.cx.filter(c=>c.st&&c.st!=='');
    if(cx.length)out.push(sent('Microbiology to date: '+cx.map(c=>lc1(cxLine(c))).join('; ')));
    if(pt.abx.length)out.push(sent('Antimicrobials to date: '+pt.abx.map(a=>{const d=DR[a.d];return a.end?`${lc1(d.n)} ${md(a.start)}–${md(a.end)}`:`${lc1(d.n)} since ${md(a.start)||'***'}`}).join('; ')));
  }
  out.push(`The patient's chief concern is ${(pt.concern||'').trim().replace(/\.$/,'')||'***'}.`);
  out.push(`${He} denies any further complaints today.`);
  return out.join(' ');
}
function trend(pt,k,ref){
  const ds=Object.keys(pt.days).filter(d=>d<=ref&&String(pt.days[d][k]||'').trim()).sort().slice(-3);
  return ds.map(d=>pt.days[d][k].trim()).join(' → ');
}
function noteText(pt,ref){
  const d=pt.days[ref]||{};const L=[];const r=RS[pt.reason];
  L.push(`ID PROGRESS NOTE (${md(ref)})`);
  const act=active(pt);
  if(act.length)L.push('Antimicrobial day: '+act.map(a=>`${DR[a.d].n} D${abxInfo(pt,a,ref).day??'?'}`).join(', '));
  L.push('');
  L.push('Subjective: '+(String(d.s||'').trim()||'***'));
  L.push('');L.push('Objective:');
  const obs=[['tmax','Tmax'],['wbc','WBC'],['cr','Cr'],['crp','CRP'],['esr','ESR']].map(([k,n])=>{const t=trend(pt,k,ref);return t?`${n} ${t}`:''}).filter(Boolean);
  L.push(obs.length?obs.join(' | '):'Vitals and labs: ***');
  if(String(d.exam||'').trim())L.push('Exam: '+d.exam.trim());
  if(pt.devices.trim())L.push('Lines/devices: '+pt.devices.trim());
  L.push('');L.push('Microbiology:');
  if(pt.cx.length)pt.cx.slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:1).forEach(c=>L.push('• '+cxLine(c)));else L.push('• None sent');
  if(pt.clear)L.push(`First negative blood culture: ${md(pt.clear)} (day ${diff(pt.clear,ref)+1} of clearance).`);
  L.push('');L.push('Antimicrobials:');
  if(pt.abx.length)pt.abx.forEach(a=>L.push('• '+abxLine(pt,a,ref)));else L.push('• None');
  L.push('');L.push('Assessment and plan:');
  L.push(pt.oneliner.trim()?sent(pt.oneliner):`${pt.age||'***'} y/o ${pt.sex||'***'} with ${r?r.pf:'***'}.`);
  act.forEach(a=>{const i=abxInfo(pt,a,ref);L.push(`• Continue ${lc1(DR[a.d].n)}${i.dur&&i.an?` (day ${i.dOf} of ${i.dur}${a.anch&&a.anch!=='start'?' from '+ANCH[a.anch]:''}; projected last dose ${md(i.endD)})`:''}.`)});
  posCultures(pt).forEach(c=>{const v=coverage(pt,c);if(!v||!act.length)return;
    if(v.best==='n')L.push(`• ${v.bug.n} is not covered by the current regimen. First line: ${v.bug.first}.`);
    else if(v.best==='v')L.push(`• ${v.bug.n}: coverage depends on susceptibilities (${v.by.v.join(', ')}).`);});
  bundles(pt).forEach(k=>{const b=BUNDLES[k];const done=b.i.filter((x,i)=>pt.bnd[k+'|'+i]),open=b.i.filter((x,i)=>!pt.bnd[k+'|'+i]);
    L.push(`• ${b.n} checklist. `+[done.length?'Done: '+done.map(lc1).join('; ')+'.':'',open.length?'Pending: '+open.map(lc1).join('; ')+'.':''].filter(Boolean).join(' '));});
  if(pt.sc||pt.scTxt.trim())L.push(`• Source control: ${pt.scTxt.trim()||'achieved'}${pt.sc?' ('+md(pt.sc)+')':''}.`);
  const mon=monitoring(pt);if(mon.length)L.push('• Monitoring: '+mon.join('; ')+'.');
  if(pt.opat.on){const o=pt.opat;L.push(`• OPAT: ${[o.line?'access: '+o.line:'',o.labs?'labs: '+o.labs:'',o.stop?'stop date '+md(o.stop):'',o.fu?'follow-up: '+o.fu:''].filter(Boolean).join('; ')||'planning in progress'}.`)}
  if(String(d.plan||'').trim())String(d.plan).trim().split('\n').filter(x=>x.trim()).forEach(x=>L.push('• '+x.trim().replace(/^[•\-]\s*/,'')));
  L.push('');L.push('ID will continue to follow. Please call with questions.');
  return L.join('\n');
}

function ptFooter(pt){return`<div class="btnrow" style="justify-content:center;margin-top:22px"><button class="btn" data-a="print">Print for rounds</button></div><div class="btnrow" style="justify-content:center;margin-top:22px;gap:18px"><button class="linkbtn" data-a="signoff">${pt.off?'Move back to active':'Sign off'}</button><button class="linkbtn danger" data-a="delpt">Delete patient</button></div>

function covTags(d){
  const y=Object.entries(d.cm).filter(([g,l])=>l==='y').map(([g])=>GROUPS[g]);
  const miss=KEYMISS.filter(g=>!d.cm[g]||d.cm[g]==='n').map(g=>GROUPS[g]);
  return `<div class="cardsub"><b style="color:var(--ok)">Covers:</b> ${esc(y.join(', ')||'see reference')}${miss.length?`<br><b style="color:var(--warn)">Misses:</b> ${esc(miss.join(', '))}`:''}</div>`;
}

function cxCard(pt,c,i){

    <div class="row"><label class="fld"><span>Site</span><select data-p="cx.${i}.site" data-rr="1">${SITES.map(s=>`<option ${c.site===s?'selected':''}>${s}</option>`).join('')}</select></label>
    ${fld('Collected',`cx.${i}.date`,c.date,'type="date" data-rr="1"')}<label class="fld s"><span>Sets</span><input data-p="cx.${i}.sets" value="${esc(c.sets||'')}" placeholder="2/2"></label></div>
    <div class="fld"><span>Status</span><div class="seg" data-seg="cx.${i}.st">${[['pend','Pending'],['ngtd','NGTD'],['pos','Positive'],['neg','No growth'],['con','Contaminant']].map(([k,n])=>`<button type="button" data-v="${k}" aria-pressed="${c.st===k}">${n}</button>`).join('')}</div></div>`;
  if(c.st==='pos'||c.st==='con'||c.st==='pend'){
    h+=`<div class="fld"><span>Gram stain</span><div class="seg" data-seg="cx.${i}.stain">${STAINS.map(s=>`<button type="button" data-v="${s.id}" aria-pressed="${c.stain===s.id}">${esc(s.n)}</button>`).join('')}</div></div>`;
    if(c.st!=='pend')h+=`<label class="fld"><span>Organism</span><select data-p="cx.${i}.org" data-rr="1"><option value="">${c.stain?'Not yet identified':'Pick an organism'}</option>${STAINS.filter(s=>orgs.some(b=>b.s===s.id)).map(s=>`<optgroup label="${esc(s.n)}">${orgs.filter(b=>b.s===s.id).map(b=>`<option value="${b.id}" ${c.org===b.id?'selected':''}>${esc(b.n)}</option>`).join('')}</optgroup>`).join('')}<option value="other" ${c.org==='other'?'selected':''}>Other (type it)</option></select></label>`;
    if(c.org==='other')h+=fld('Organism name',`cx.${i}.orgTxt`,c.orgTxt||'','placeholder="Pasteurella multocida"');
  }
  // stain card when no organism yet
  if(c.stain&&!bug&&(c.st==='pos'||c.st==='pend')){const s=ST[c.stain];
    h+=`<div class="bug"><span class="st">${esc(s.n)}</span><dl><dt>Think</dt><dd>${esc(s.think)}</dd><dt>While waiting</dt><dd>${esc(s.start)}</dd></dl></div>`}
  if(bug){
    h+=`<div class="bug"><span class="stainhd">${esc(ST[bug.s].n)}</span>
      <dl><dt>Gram stain</dt><dd>${esc(bug.stain)}</dd><dt>Lab</dt><dd>${esc(bug.lab)}</dd><dt>First line</dt><dd><b>${esc(bug.first)}</b></dd></dl>
      ${bug.p&&bug.p.length?`<ul>${bug.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      <a class="linkbtn" href="#ref/bug/${bug.id}">Full bug card ›</a></div>`;
    if(c.st==='pos'){const v=coverage(pt,c);
      if(!pt.abx.some(a=>!a.end))h+=`<p class="flag amb">No active antimicrobials. First line: ${esc(bug.first)}.</p>`;
      else if(v.best==='y')h+=`<p class="flag ok"><b>Covered</b> by ${esc(v.by.y.join(', '))}.${v.by.p.length?' '+esc(v.by.p.join(', '))+' active but not preferred.':''}</p>`;
      else if(v.best==='p')h+=`<p class="flag amb"><b>Active but not preferred:</b> ${esc(v.by.p.join(', '))}. Preferred: ${esc(bug.first)}.</p>`;
      else if(v.best==='v')h+=`<p class="flag amb"><b>Depends on susceptibilities:</b> ${esc(v.by.v.join(', '))}. Enter results below.</p>`;
      else h+=`<p class="flag warn"><b>Not covered</b> by the current regimen. First line: ${esc(bug.first)}.</p>`;}
    const panel=[...new Set([...(PANEL[bug.s]||[]),...active(pt).map(a=>a.d),...Object.keys(c.susc||{})])].filter(id=>DR[id]);

  }
  h+=`<div class="btnrow" style="margin-top:8px;justify-content:flex-end"><button class="linkbtn danger" data-a="rmcx" data-i="${i}">Remove culture</button></div></div>`;
  return h;
}

  }else{
    const gsel=refQ&&GROUPS[refQ]?refQ:'MRSA';
    h+=`<p class="sub" style="margin:6px 0 10px">Pick a target to see what covers it.</p><div class="chips">${Object.entries(GROUPS).map(([g,n])=>`<button type="button" class="chip${g===gsel?' on':''}" data-a="grid" data-v="${g}">${esc(n)}</button>`).join('')}</div>`;
    const rows=DRUGS.map(d=>[d,d.cm[gsel]||'n']).filter(([d,l])=>l!=='n').sort((a,b)=>RANK[b[1]]-RANK[a[1]]);
    h+=`<div class="card" style="margin-top:12px"><h3>${esc(GROUPS[gsel])}</h3>${rows.length?`<table class="mtx">${rows.map(([d,l])=>`<tr><td><a href="#ref/drug/${d.id}" style="color:inherit">${esc(d.n)}</a></td><td><span class="tag ${l==='y'?'ok':'amb'}">${LV[l]}</span></td></tr>`).join('')}</table>`:'<p class="sub">No listed drug covers this: see the organism card for first-line therapy.</p>'}</div>`;
  }
  if(!h.includes('refitem')&&refTab!=='stain'&&refTab!=='grid')h+=`<div class="empty">Nothing matches “${esc(refQ)}”.</div>`;
  h+=`<p class="foot">Study aid. Confirm against susceptibilities, your local antibiogram, and pharmacy.</p>`;
  app.innerHTML=h;
}


/* ================= PRINT FOR ROUNDS ================= */
function sheet(pt,T){
  const r=RS[pt.reason];const act=active(pt);const e=esc;
  const longDate=pd(T).toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric',year:'numeric'});
  let h=`<section class="sheet"><div class="ph"><div><div class="pb">${e(pt.bed?'Bed '+pt.bed:'Bed ___')}</div>
    <div class="pm">${e([pt.age?pt.age+' y/o':'',pt.sex,pt.team?pt.team+' team':''].filter(Boolean).join(' · '))}</div></div>
    <div class="pr"><b>${e(r?r.n:'ID consult')}</b><br>${e(longDate)}${pt.created?` · consulted ${md(pt.created)} (day ${diff(pt.created,T)+1})`:''}</div></div>`;
  h+=`<p class="one">${e(pt.oneliner.trim()||(pt.q.trim()?'Question: '+pt.q.trim():(r?r.q:'')))}</p>`;
  // alerts
  const al=[];
  posCultures(pt).forEach(c=>{const v=coverage(pt,c);if(!v)return;if(!act.length)al.push(`${v.bug.n}: no active antimicrobial`);else if(v.best==='n')al.push(`${v.bug.n} NOT covered by current regimen (first line: ${v.bug.first})`);else if(v.best==='v')al.push(`${v.bug.n}: coverage depends on susceptibilities`);else if(v.best==='p')al.push(`${v.bug.n}: ${v.by.p.join(', ')} active but not preferred (${v.bug.first})`)});
  bundles(pt).forEach(k=>{const b=BUNDLES[k];const n=b.i.filter((x,i)=>!pt.bnd[k+'|'+i]).length;if(n)al.push(`${b.n}: ${n} checklist item${n>1?'s':''} open`)});
  if(al.length)h+=`<div class="al">${al.map(x=>`<div>▲ ${e(x)}</div>`).join('')}</div>`;
  // antimicrobials
  h+=`<h4>Antimicrobials</h4>`;
  if(pt.abx.length){h+=`<table><tr><th>Drug</th><th>Dose</th><th>Start</th><th>Day</th><th>Plan</th><th>Last dose</th></tr>`+
    pt.abx.slice().sort((x,y)=>(!!x.end)-(!!y.end)).map(a=>{const d=DR[a.d],i=abxInfo(pt,a,T);
      return`<tr class="${a.end?'off':''}"><td><b>${e(d.n)}</b></td><td>${e(a.dose||'')}</td><td>${md(a.start)}</td><td class="c"><b>${a.end?md(a.start)+'–'+md(a.end):(i.day??'')}</b></td><td>${a.end?'stopped':i.dur?`${i.dur} d from ${ANCH[a.anch||'start']}${i.an?'':' (date ?)'}`:''}</td><td>${a.end?'':md(i.endD)}</td></tr>`}).join('')+`</table>`}
  else h+=`<p class="mut">None.</p>`;
  // micro
  h+=`<h4>Microbiology</h4>`;
  if(pt.cx.length){h+=`<table><tr><th>Site</th><th>Date</th><th>Result</th><th>Susceptibilities</th></tr>`+
    pt.cx.slice().sort((x,y)=>(x.date||'')<(y.date||'')?-1:1).map(c=>{const full=cxLine(c);const res=full.slice(full.indexOf(': ')+2).replace(/ \((S|I|R): .*\)$/,'');
      const g={S:[],I:[],R:[]};Object.entries(c.susc||{}).forEach(([k,v])=>{if(DR[k]&&g[v])g[v].push(DR[k].n)});
      const sus=['S','I','R'].filter(k=>g[k].length).map(k=>`<b>${k}:</b> ${e(g[k].join(', '))}`).join('<br>');
      return`<tr><td>${e(c.site)}${c.sets?' '+e(c.sets):''}</td><td>${md(c.date)}</td><td>${e(res)}</td><td>${sus}</td></tr>`}).join('')+`</table>`}
  else h+=`<p class="mut">None sent.</p>`;
  const kd=[];if(pt.clear)kd.push(`First negative blood culture ${md(pt.clear)} (day ${diff(pt.clear,T)+1})`);if(pt.sc||pt.scTxt.trim())kd.push(`Source control: ${pt.scTxt.trim()||'done'}${pt.sc?' ('+md(pt.sc)+')':''}`);
  if(kd.length)h+=`<p class="kd">${kd.map(e).join(' · ')}</p>`;
  // trends
  const ds=Object.keys(pt.days).filter(d=>d<=T&&['tmax','wbc','cr','crp','esr'].some(k=>String(pt.days[d][k]||'').trim())).sort().slice(-5);
  if(ds.length){h+=`<h4>Trends</h4><table class="tr"><tr><th></th>${ds.map(d=>`<th>${md(d)}</th>`).join('')}</tr>`+[['tmax','Tmax'],['wbc','WBC'],['cr','Cr'],['crp','CRP'],['esr','ESR']].filter(([k])=>ds.some(d=>String(pt.days[d][k]||'').trim())).map(([k,n])=>`<tr><td><b>${n}</b></td>${ds.map(d=>`<td>${e(pt.days[d][k]||'')}</td>`).join('')}</tr>`).join('')+`</table>`}
  // two columns: checklists + monitoring | history
  let L='',R='';
  bundles(pt).forEach(k=>{const b=BUNDLES[k];L+=`<h4>${e(b.n)}</h4><ul class="ck">${b.i.map((x,i)=>`<li>${pt.bnd[k+'|'+i]?'☑':'☐'} ${e(x)}</li>`).join('')}</ul>`});
  const mon=monitoring(pt);if(mon.length)L+=`<h4>Monitoring</h4><ul class="ck">${mon.map(x=>`<li>☐ ${e(x)}</li>`).join('')}</ul>`;
  const hi=[];
  if(pt.allergy.trim())hi.push(['Allergies',pt.allergy.trim()]);
  if(pt.devices.trim())hi.push(['Lines/devices',pt.devices.trim()]);
  const pmh=[...pt.imm,...String(pt.pmh||'').split(',').map(s=>s.trim()).filter(Boolean)];if(pmh.length)hi.push(['PMHx',[...new Set(pmh)].join(', ')]);
  if(pt.prior.length)hi.push(['Prior organisms',pt.prior.join(', ')]);
  const ep=EXPOSURES.filter(x=>pt.exp[x]==='p');if(ep.length||pt.expD.trim())hi.push(['Exposures',[ep.join(', '),pt.expD.trim()].filter(Boolean).join('. ')]);
  if(pt.recent.trim())hi.push(['Recent abx',pt.recent.trim()]);
  if(pt.opat.on){const o=pt.opat;hi.push(['OPAT',[o.line,o.labs,o.stop?'stop '+md(o.stop):'',o.fu].filter(Boolean).join(' · ')||'planning'])}
  if(hi.length)R+=`<h4>Background</h4><dl class="bg">${hi.map(([k,v])=>`<dt>${e(k)}</dt><dd>${e(v)}</dd>`).join('')}</dl>`;
  const plan=String((pt.days[T]||{}).plan||'').trim();
  if(plan)R+=`<h4>Plan items</h4><ul class="ck">${plan.split('\n').filter(x=>x.trim()).map(x=>`<li>☐ ${e(x.replace(/^[•\-]\s*/,''))}</li>`).join('')}</ul>`;
  if(L||R)h+=`<div class="cols"><div>${L}</div><div>${R}</div></div>`;
  h+=`<div class="ft">Spectrum · Contains patient information: shred after use.</div><h4>Rounds notes</h4><div class="notes"></div></section>`;
  return h;
}
function printPts(list){
  if(!list.length){toast('No active patients to print.');return}
  const T=today();const el=document.getElementById('print');
  el.innerHTML=list.map(p=>sheet(p,T)).join('');
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');el.innerHTML='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}

/* ================= EVENTS ================= */
function curPtId(){const h=parseHash();return h[0]==='p'?h[1]:null}
function curPt(){const h=parseHash();return h[0]==='p'?P(h[1]):null}
function setPath(o,path,v){const k=path.split('.');let x=o;for(let i=0;i<k.length-1;i++){if(x[k[i]]==null)x[k[i]]={};x=x[k[i]]}x[k[k.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((x,k)=>x==null?x:x[k],o)}
function refreshOut(){const pt=curPt();if(!pt)return;const o=document.getElementById('out');if(!o)return;const tab=parseHash()[2]||'hpi';o.textContent=tab==='note'?noteText(pt,noteDate[pt.id]||today()):hpiText(pt)}

app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='refq'){refQ=t.value;const pos=t.selectionStart;render(true);const q=document.getElementById('refq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
  const pt=curPt();if(!pt)return;
  if(t.id==='abxq'){abxQ[pt.id]=t.value;const pos=t.selectionStart;render(true);const q=document.getElementById('abxq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
  if(t.id==='ndate'){if(t.value){noteDate[pt.id]=t.value;render(true)}return}
  if(t.dataset.p){
    if(t.dataset.p.startsWith('days.')){const ref=t.dataset.p.split('.')[1];if(!pt.days[ref])pt.days[ref]={}}
    setPath(pt,t.dataset.p,t.value);save();
    if(t.dataset.rr){if(e.type==='input'&&(t.tagName==='INPUT'&&t.type!=='date'))return refreshOut();render(true);return}
    if(['bed'].includes(t.dataset.p)){const h1=hd.querySelector('h1');if(h1)h1.firstChild.textContent=t.value?'Bed '+t.value:'New consult'}
    refreshOut();
  }
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.rr&&curPt())render(true)});

app.addEventListener('click',async e=>{
  const pt=curPt();
  const segb=e.target.closest('.seg button');
  if(segb&&pt){const k=segb.parentElement.dataset.seg,v=segb.dataset.v;
    if(k.startsWith('sus.')){const[,i,id]=k.split('.');const c=pt.cx[+i];c.susc=c.susc||{};if(c.susc[id]===v)delete c.susc[id];else c.susc[id]=v}
    else{const cur=getPath(pt,k);setPath(pt,k,cur===v?'':v);
      if(/^cx\.\d+\.stain$/.test(k)){const c=pt.cx[+k.split('.')[1]];if(c.org&&BG[c.org]&&BG[c.org].s!==c.stain)c.org=''}}
    save();render(true);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='new'){const p=newPt();S.pts.unshift(p);save();location.hash='p/'+p.id+'/hpi';return}
  if(a==='reftab'){e.preventDefault();refTab=v;refQ='';if(location.hash!=='#ref')location.hash='ref';else render();return}
  if(a==='grid'){refQ=v;render(true);return}
  if(a==='syncrounder'){connectSync(true);return}
  if(a==='syncconnect'){connectSync(false);return}
  if(a==='syncnow'){syncNow();return}
  if(a==='syncoff'){localStorage.removeItem(SYNC_KEY);SY=null;setSync('off');render(true);toast('Sync turned off on this device. Patients stay here.');return}
  if(a==='printall'){printPts(S.pts.filter(p=>!p.off));return}
  if(!pt)return;
  if(a==='tri'){const set=b.dataset.s,k=b.dataset.k;const m=set==='exp'?pt.exp:(pt.pert[set]=pt.pert[set]||{});m[k]=m[k]==='p'?'n':m[k]==='n'?undefined:'p';if(!m[k])delete m[k];b.className='chip'+(m[k]?' '+m[k]:'');save();refreshOut();return}
  if(a==='multi'){const arr=getPath(pt,b.dataset.p);const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);b.classList.toggle('on');save();refreshOut();return}
  if(a==='reason'){pt.reason=pt.reason===v?'':v;save();render(true);return}
  if(a==='allergy'){const cur=pt.allergy.trim();pt.allergy=v==='None known'?'none known':cur&&!/^none/i.test(cur)?cur+', '+v.toLowerCase()+' ()':v.toLowerCase()+' ()';save();render(true);const inp=app.querySelector('[data-p="allergy"]');if(inp&&v!=='None known'){inp.focus();const p=inp.value.length-1;inp.setSelectionRange(p,p)}return}
  if(a==='incl'){pt.inclMicro=!pt.inclMicro;b.classList.toggle('on',pt.inclMicro);save();refreshOut();return}
  if(a==='addabx'){pt.abx.push({id:uid(),d:v,start:today(),end:'',dur:'',anch:'start',dose:''});abxQ[pt.id]='';save();render(true);toast(DR[v].n+' added.');return}
  if(a==='stop'){pt.abx[+b.dataset.i].end=today();save();render(true);return}
  if(a==='resume'){pt.abx[+b.dataset.i].end='';save();render(true);return}
  if(a==='rmabx'){if(confirm('Remove '+DR[pt.abx[+b.dataset.i].d].n+'? (Use “Stop today” to keep it in the history.)')){pt.abx.splice(+b.dataset.i,1);save();render(true)}return}
  if(a==='addcx'){pt.cx.push({id:uid(),site:'Blood',date:today(),sets:'',st:'pend',stain:'',org:'',orgTxt:'',susc:{}});save();render(true);return}
  if(a==='rmcx'){if(confirm('Remove this culture?')){pt.cx.splice(+b.dataset.i,1);save();render(true)}return}
  if(a==='useclear'){pt.clear=v;save();render(true);return}
  if(a==='bnd'){pt.bnd[v]=!pt.bnd[v];if(!pt.bnd[v])delete pt.bnd[v];save();render(true);return}
  if(a==='nday'){noteDate[pt.id]=addDays(noteDate[pt.id]||today(),+v);render(true);return}
  if(a==='ntoday'){delete noteDate[pt.id];render(true);return}
  if(a==='opat'){pt.opat.on=!pt.opat.on;save();render(true);return}
  if(a==='opatlabs'){pt.opat.labs=opatLabs(pt);save();render(true);return}
  if(a==='opatstop'){pt.opat.stop=v;save();render(true);return}
  if(a==='copy'){const t=v==='note'?noteText(pt,noteDate[pt.id]||today()):hpiText(pt);const ok=await copyText(t);toast(ok?(v==='note'?'Note copied.':'HPI copied.'):'Couldn’t copy on this device.');return}
  if(a==='signoff'){pt.off=!pt.off;save();toast(pt.off?'Signed off.':'Moved back to active.');location.hash='';return}
  if(a==='print'){printPts([pt]);return}
  if(a==='delpt'){if(confirm('Delete this patient and everything entered for them?')){S.pts=S.pts.filter(p=>p.id!==pt.id);save();location.hash=''}return}
});
hd.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='home'){location.hash=''}
  if(b.dataset.a==='refback'){let nav=false;try{nav=!!sessionStorage.getItem('sp.nav')}catch(_){}if(nav)history.back();else location.hash=''}});
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-a="reftab"]');if(!b)return;e.preventDefault();refTab=b.dataset.v;refQ='';render()});
app.addEventListener('toggle',e=>{if(e.target.id==='offd')showOff=e.target.open},true);
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='search')e.target.blur()});

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
window.addEventListener('hashchange',()=>{try{sessionStorage.setItem('sp.nav','1')}catch(_){}render()});
/* Always open on the patient list, not the last screen. */
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
try{sessionStorage.removeItem('sp.nav')}catch(_){}
window.addEventListener('pageshow',e=>{if(e.persisted&&location.hash){history.replaceState(null,'',location.pathname+location.search);render()}});
initSnap();render();syncBoot();
</script>
