    <div class="barin dictbtns"><button class="btn" data-act="dictClear" ${d.dict?'':'disabled'}>Clear</button><button class="btn primary" data-act="dictParse">Review what I said</button></div>
    ${V.dictUndo&&V.dictUndo.pid===p.id?`<button class="btn block" data-act="dictUndo">Undo last dictation</button>`:''}
    <details class="card"><summary>What can it understand?</summary>${DHELP.map(([a,b])=>`<p><strong>${a}.</strong> ${b}</p>`).join('')}<p class="calc">Say numbers plainly. Ranges work with “to.” When a lab is said with two values, like “creatinine 1.4 to 1.8,” the last one is used.</p></details>`}
  else{const its=R0.items,lf=R0.left;
    h+=`<p class="calc">Check each value before filling it in. Values that look out of range are unchecked.</p>`;
    if(its.length)h+=`<div class="card"><h3>Values found</h3><ul class="ditems">${its.map((it,i)=>{const old=dShowOld(d,it);return `<li><button type="button" class="check ${it.on?'on':''}" data-act="dictTog" data-i="${i}" aria-pressed="${it.on}" aria-label="Include ${esc(it.label)}"></button><div><strong>${esc(it.label)}</strong> ${esc(it.show)}${old&&old!==it.show?`<span class="prev"> replaces ${esc(old)}</span>`:''}${it.warn?`<span class="dwarn">Check this value</span>`:''}</div></li>`}).join('')}</ul></div>`;
    if(lf.length)h+=`<div class="card"><h3>Notes</h3><p class="calc">Choose where each sentence goes.</p>${lf.map((l,i)=>`<div class="dleft"><p>${esc(l.text)}</p><select data-act-sel="dictRoute" data-i="${i}" aria-label="Where this goes">${DROUTES.map(([k,lab])=>`<option value="${k}" ${l.route===k?'selected':''}>${lab}</option>`).join('')}</select></div>`).join('')}</div>`;
    if(!its.length&&!lf.length)h+=`<p class="muted">Nothing to fill in. Go back and add some dictation.</p>`;
    const n=its.filter(x=>x.on).length+lf.filter(x=>x.route!=='skip').length;
    h+=`<div class="barin dictbtns"><button class="btn" data-act="dictEdit">Edit dictation</button><button class="btn primary" data-act="dictApply" ${n?'':'disabled'}>Fill in ${n} item${n===1?'':'s'}</button></div>`}
  return h+`</main>`}

/* ---------- bed changes ---------- */
function bedEditor(p){return V.bedEdit===p.id?`<div class="card bedcard"><label class="fld"><span>New bed number</span><input id="newBed" value="${esc(p.bed)}" autocomplete="off" inputmode="text"></label>${(p.bedHistory||[]).length?`<p class="calc">Previous: ${p.bedHistory.slice().reverse().map(h=>`bed ${esc(h.from)} until ${fmtDate(h.date)}`).join(', ')}</p>`:''}<div class="row gap"><button class="btn primary sm" data-act="saveBed">Save bed</button><button class="btn sm" data-act="cancelBed">Cancel</button></div></div>`:''}
function changeBed(p,v,date){v=String(v||'').trim();if(!v||v===String(p.bed))return false;(p.bedHistory=p.bedHistory||[]).push({from:p.bed,to:v,date});p.bed=v;return true}
function bedMove(p,d){const h=(p.bedHistory||[]).filter(x=>x.date<=d.date&&daysBetween(x.date,d.date)<=1).pop();return h?` (moved from bed ${h.from} on ${fmtDate(h.date)})`:''}

/* ---------- render ---------- */
function render(){const a=document.getElementById('app');
  if(!['census','edit','handoff'].includes(V.screen)&&!P())V.screen='census';
  let added=[];if(V.screen==='round'){const p=P();stampDates(p,p.draft);added=syncAuto(p,p.draft)}
  const fn={census,edit:editPt,patient:patientView,round:roundView,day:dayView,trends:trendsView,handoff:handoffView,dict:dictView}[V.screen];
  a.innerHTML=fn();updateCalcs();
  if(added.length)toast('Added to problem list: '+added.join('; '));
  if(V.screen==='round'){const s=document.querySelector('.steps'),t=s&&s.querySelector('.cur');if(t)s.scrollLeft=t.offsetLeft-s.clientWidth/2+t.clientWidth/2}}
function go(screen){V.screen=screen;V.err='';V.sheet=false;V.bedEdit=null;render();window.scrollTo(0,0)}

let toastT;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'Copied':'Select the text and copy it manually.')}

/* ---------- events ---------- */
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.b;if(!b)return;const {o,path}=ref(b);setPath(o,path,e.target.value);if(b[0]!=='n')save();updateCalcs()});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.actSel==='mergeProb'&&e.target.value){const p=P(),d=p.draft;const A=p.problems.find(x=>x.id===e.target.dataset.pr),B=p.problems.find(x=>x.id===e.target.value);if(A&&B){mergeProblems(p,d,A,B);V.openEdit=A.id;save();render();toast('Combined into one problem. Rename it if you like.')}return}
  if(e.target.tagName==='SELECT'&&e.target.dataset&&e.target.dataset.b&&V.screen==='round'){render();return}if(e.target.dataset&&e.target.dataset.actSel==='dictRoute'&&V.dictRes){V.dictRes.left[+e.target.dataset.i].route=e.target.value;render();return}if(e.target.id==='importFile'&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>parseImport(String(r.result));r.readAsText(e.target.files[0]);e.target.value='';return}if(e.target.dataset&&e.target.dataset.b&&e.target.type==='date'&&V.screen==='round')render()});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-set],[data-tog],[data-act]');if(!t)return;
  if(t.dataset.confirm&&!t.dataset.armed){const orig=t.textContent;t.dataset.armed='1';t.classList.add('armed');t.textContent=t.dataset.confirm;setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.classList.remove('armed');t.textContent=orig}},3000);return}
  if(t.dataset.set){const {o,path}=ref(t.dataset.set);const cur=getPath(o,path);setPath(o,path,cur===t.dataset.v?'':t.dataset.v);if(t.dataset.set[0]!=='n')save();render();return}
  if(t.dataset.tog){const {o,path}=ref(t.dataset.tog);let arr=getPath(o,path);if(!Array.isArray(arr)){arr=[];setPath(o,path,arr)}const i=arr.indexOf(t.dataset.v);if(i>=0)arr.splice(i,1);else arr.push(t.dataset.v);save();render();return}
  const a=t.dataset.act,p=V.pid?P():null,d=p&&p.draft;
  switch(a){
    case 'go':go(t.dataset.to);break;
    case 'syncConnect':connectSync();break;
    case 'syncNow':syncNow();break;
    case 'syncOff':localStorage.removeItem(SYNC_KEY);SY=null;setSync('off');render();toast('Sync turned off on this device. Patients stay here.');break;
    case 'addPt':V.newPt={bed:'',age:'',sex:'',height:'',hUnit:'in',admit:today(),oneLiner:'',pmh:'',code:'Full code',allergies:'',probs:''};go('edit');break;
    case 'editPt':V.newPt=Object.assign({},{id:p.id,bed:p.bed,age:p.age,sex:p.sex,height:p.height,hUnit:p.hUnit||'in',admit:p.admit,oneLiner:p.oneLiner,pmh:p.pmh,code:p.code,allergies:p.allergies});go('edit');break;
    case 'savePt':{const n=V.newPt;if(!String(n.bed||'').trim()){V.err='Add a bed number to save.';render();return}
      const fields=['bed','age','sex','height','hUnit','admit','oneLiner','pmh','code','allergies'];
      if(!n.id){const np={id:uid(),status:'active',days:[],draft:null,problems:String(n.probs||'').split('\n').map(s=>s.trim()).filter(Boolean).map(name=>({id:uid(),name,plan:[]}))};fields.forEach(k=>np[k]=String(n[k]??'').trim());S.patients.push(np);V.pid=np.id}
      else{const tp=S.patients.find(x=>x.id===n.id);changeBed(tp,n.bed,curDate());fields.filter(k=>k!=='bed').forEach(k=>tp[k]=String(n[k]??'').trim())}
      save();go('patient');break}
    case 'openPt':V.pid=t.dataset.id;go('patient');break;
    case 'toggleArchive':V.showArchive=!V.showArchive;render();break;
    case 'readmit':S.patients.find(x=>x.id===t.dataset.id).status='active';save();render();break;
    case 'delPt':S.patients=S.patients.filter(x=>x.id!==t.dataset.id);save();render();break;
    case 'discharge':p.status='discharged';save();go('census');break;
    case 'discardDraft':p.draft=null;save();render();break;
    case 'addProbPt':{const el=document.getElementById('newProb');const v=el.value.trim();if(v){p.problems.push({id:uid(),name:v,plan:[]});save();render()}break}
    case 'delPlanItem':{const pr=p.problems.find(x=>x.id===t.dataset.pr);pr.plan.splice(+t.dataset.i,1);save();render();break}
    case 'unresolve':{const pr=p.problems.find(x=>x.id===t.dataset.id);pr.resolved=false;save();render();break}
    case 'startRounds':if(!p.draft)p.draft=newDraft(p);V.step=0;save();go('round');break;
    case 'step':V.step=+t.dataset.i;render();window.scrollTo(0,0);break;
    case 'prev':if(V.step>0){V.step--;render();window.scrollTo(0,0)}break;
    case 'next':if(V.step<STEPS.length-1){V.step++;render();window.scrollTo(0,0)}break;
    case 'dripToggle':{const k=t.dataset.k;const o=d.drips[k]||{};o.on=!o.on;if(o.on){o.since=d.date;o.unit=o.unit||t.dataset.u;o.trend=o.trend&&o.trend!=='Stopped'?o.trend:'New'}d.drips[k]=o;save();render();break}
    case 'add':{const {o,path}=ref(t.dataset.b);let arr=getPath(o,path);if(!Array.isArray(arr)){arr=[];setPath(o,path,arr)}arr.push(Object.assign({id:uid()},JSON.parse(t.dataset.t)));save();render();break}
    case 'del':{const {o,path}=ref(t.dataset.b);const arr=getPath(o,path);if(Array.isArray(arr))arr.splice(+t.dataset.i,1);save();render();break}
    case 'itemCont':case 'itemStop':{const pl=d.plan[t.dataset.pr]=d.plan[t.dataset.pr]||{};pl.stops=(pl.stops||[]).filter(x=>x!==t.dataset.id);if(a==='itemStop')pl.stops.push(t.dataset.id);save();render();break}
    case 'addStart':{const pl=d.plan[t.dataset.pr]=d.plan[t.dataset.pr]||{};(pl.starts=pl.starts||[]).push({id:uid(),text:''});save();render();const ins=document.querySelectorAll(`[data-b^="d:plan.${t.dataset.pr}.starts."]`);if(ins.length)ins[ins.length-1].focus();break}
    case 'delStart':{const pl=d.plan[t.dataset.pr];pl.starts.splice(+t.dataset.i,1);save();render();break}
    case 'resolveToggle':{const pl=d.plan[t.dataset.pr]=d.plan[t.dataset.pr]||{};pl.resolved=!pl.resolved;save();render();break}
    case 'addProbR':{const el=document.getElementById('newProbR');const v=el.value.trim();if(v){const id=uid();p.problems.push({id,name:v,plan:[]});d.plan[id]={status:'New'};save();render()}break}
    case 'dismissAuto':{const pr=p.problems.find(x=>x.id===t.dataset.pr);p.dismissed=p.dismissed||[];if(pr.auto&&!p.dismissed.includes(pr.auto))p.dismissed.push(pr.auto);p.problems=p.problems.filter(x=>x!==pr);delete d.plan[pr.id];save();render();break}
    case 'labTog':{const pr=p.problems.find(x=>x.id===t.dataset.pr);const cur=prLabs(pr).slice();const k=t.dataset.k;const i=cur.indexOf(k);if(i>=0)cur.splice(i,1);else cur.push(k);pr.labs=TORDER.filter(x=>cur.includes(x));V.openLabPick=pr.id;save();render();break}
    case 'openSheet':V.sheet=true;render();break;
    case 'bedOpen':V.bedEdit=p.id;render();window.scrollTo(0,0);{const el=document.getElementById('newBed');if(el){el.focus();el.select()}}break;
    case 'cancelBed':V.bedEdit=null;render();break;
    case 'saveBed':{const el=document.getElementById('newBed');const v=el?el.value.trim():'';if(!v){toast('Enter a bed number.');break}
      const clash=S.patients.find(x=>x!==p&&x.status!=='discharged'&&String(x.bed).trim().toLowerCase()===v.toLowerCase());
      const ch=changeBed(p,v,curDate());V.bedEdit=null;save();render();toast(ch?(clash?`Moved to bed ${v}. Bed ${v} is also assigned to another patient; update that one too.`:`Moved to bed ${v}`):'Bed unchanged');break}
    case 'clearAssess':{const pl=d.plan[t.dataset.pr]||{};pl.note='';pl.status='';delete pl.carried;d.plan[t.dataset.pr]=pl;save();render();break}
    case 'splitProb':{const A=p.problems.find(x=>x.id===t.dataset.pr);if(A){splitProblem(p,d,A,t.dataset.id);V.openEdit=A.id;save();render()}break}
    case 'dictOpen':if(!p.draft)p.draft=newDraft(p);V.dictBack=t.dataset.back||'round';V.dictRes=null;save();go('dict');break;
    case 'dictBack':V.dictRes=null;go(V.dictBack||'round');break;
    case 'dictClear':d.dict='';save();render();break;
    case 'dictParse':{const el=document.querySelector('.dictbox');const tx=el?el.value:(d.dict||'');d.dict=tx;save();if(!tx.trim()){toast('Dictate or type something first.');break}V.dictRes=parseDictation(p,d,tx);render();window.scrollTo(0,0);break}
    case 'dictTog':{const it=V.dictRes.items[+t.dataset.i];it.on=!it.on;render();break}
    case 'dictEdit':V.dictRes=null;render();break;
    case 'dictApply':{V.dictUndo={pid:p.id,date:d.date,draft:clone(d),problems:clone(p.problems),actions:clone(p.actions||[]),dismissed:clone(p.dismissed||[])};const n=applyDictation(p,d,V.dictRes);d.dict='';V.dictRes=null;save();toast('Filled in '+n+' item'+(n===1?'':'s')+'. You can undo from the Dictate screen.');go(V.dictBack||'round');break}
    case 'dictUndo':{const u=V.dictUndo;if(u&&u.pid===p.id&&p.draft){p.draft=u.draft;p.problems=u.problems;p.actions=u.actions;p.dismissed=u.dismissed;V.dictUndo=null;save();toast('Dictation undone');render()}break}
    case 'closeSheet':V.sheet=false;render();break;
    case 'actKind':V.actKind=t.dataset.k;render();{const el=document.getElementById('newAction');el&&el.focus()}break;
    case 'addAction':{const el=document.getElementById('newAction');const v=el&&el.value.trim();if(v){(p.actions=p.actions||[]).push({id:uid(),kind:V.actKind||'todo',text:v,created:curDate(),done:false});save();render();const n=document.getElementById('newAction');n&&n.focus()}break}
    case 'actDone':{const a=p.actions.find(x=>x.id===t.dataset.id);a.done=!a.done;a.doneDate=a.done?curDate():null;save();render();break}
    case 'actDel':p.actions=p.actions.filter(x=>x.id!==t.dataset.id);save();render();break;
    case 'trends':V.trendsBack=t.dataset.back;go('trends');break;
    case 'copy':copyText(V.screen==='handoff'?sortedActive().map(handoffText).join('\n\n'):(V.lastSummary||''));break;
    case 'fmt':V.fmt=t.dataset.k;render();break;
    case 'noChange':{d.reviewed=d.reviewed||{};d.reviewed[t.dataset.k]=true;save();if(V.step<STEPS.length-1)V.step++;render();window.scrollTo(0,0);break}
    case 'copyExam':{const ly=lastData(p,d);if(ly&&ly.exam){if(t.dataset.k==='all')d.exam=clone(ly.exam);else d.exam[t.dataset.k]=clone(ly.exam[t.dataset.k]||{});save();render();toast('Copied from yesterday. Edit anything that changed.')}break}
    case 'addLine':{(d.lines=d.lines||[]).push({id:uid(),type:t.dataset.t,site:'',date:d.date,why:[],ready:''});save();render();const cards=document.querySelectorAll('main .card');cards.length&&cards[cards.length-1].scrollIntoView({block:'center'});break}
    case 'exportBackup':exportBackup();break;
    case 'importPaste':{const el=document.getElementById('importText');if(el&&el.value.trim())parseImport(el.value.trim());break}
    case 'confirmImport':S.patients=V.pendingImport.patients;V.pendingImport=null;save();toast('Backup restored');render();break;
    case 'cancelImport':V.pendingImport=null;render();break;
    case 'openDay':V.dayDate=t.dataset.date;go('day');break;
    case 'finish':{const text=buildSummary(p,d,'rounds'),note=buildSummary(p,d,'note');
      p.problems.forEach(pr=>{const pl=d.plan[pr.id]||{};const stops=pl.stops||[];
        pr.plan=pr.plan.filter(it=>!stops.includes(it.id)).concat((pl.starts||[]).map(s=>({id:s.id,text:String(s.text||'').trim(),started:d.date})).filter(s=>s.text));
        if(pl.resolved)pr.resolved=true});
      p.days=p.days.filter(x=>x.date!==d.date);p.days.push({date:d.date,summary:text,note,data:d});p.days.sort((x,y)=>x.date.localeCompare(y.date));
      p.draft=null;V.dictUndo=null;save();V.dayDate=d.date;toast('Rounds saved');go('day');break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newBed'){e.preventDefault();document.querySelector('[data-act="saveBed"]').click();return}if(e.key==='Enter'&&(e.target.id==='newProb'||e.target.id==='newProbR'||e.target.id==='newAction')){e.preventDefault();const btn=e.target.parentElement.querySelector('button');btn&&btn.click()}});

load();initSnap();render();syncBoot();
</script>
