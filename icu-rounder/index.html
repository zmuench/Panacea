<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted,#6b7280);flex:none;text-decoration:none;-webkit-tap-highlight-color:transparent}.homebtn:hover,.homebtn:active{color:var(--ink,var(--text,#111));background:rgba(127,127,127,.12)}.homebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.syncdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line);margin-left:8px}

.steps{padding-left:20px;margin:8px 0}.steps li{margin:4px 0}

<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ICU Rounder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;
  --prog:#7A5000;--prog-soft:#FBF0D9;--paper:#FBFCFD;
  color-scheme:light only;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:150px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.9rem}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer}
.datein{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 8px;width:auto;max-width:170px}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.9rem;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.steps button.cur{background:var(--ink);color:var(--bg);font-weight:700}
h2{font-size:1.35rem;margin:16px 0 10px;letter-spacing:-.01em}
h3{font-size:1rem;margin:20px 0 8px}
.card h3:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0;flex:1 1 200px;min-width:0}
.fld.s{flex:1 1 92px;max-width:160px}
.fld.m{flex:1 1 130px}
.fld>span{font-size:.85rem;color:var(--muted);font-weight:700}
.fld em{font-style:normal;font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pair{display:flex;align-items:center;gap:6px}
.pair>span{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.seg button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg.sm{flex-wrap:nowrap;flex:none}
.seg.sm button{padding:5px 10px;min-height:34px;font-size:.88rem}
.seg button.on.stopb{background:var(--warn);border-color:var(--warn);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.chip{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;min-height:38px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip.on::before{content:"✓ ";color:var(--accent)}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.btn.block{display:block;width:100%;margin:14px 0}
.btn.danger,.linkbtn.danger{color:var(--warn)}
.btn:disabled{opacity:.4}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.armed{color:var(--warn);font-weight:700}
.muted{color:var(--muted)}
.calc{margin:6px 0;color:var(--muted);font-size:.92rem}
.calc output{color:var(--ink);font-weight:700}
.calc.inline{margin:8px 0 18px}
.carry{background:var(--prog-soft);color:var(--prog);padding:8px 12px;border-radius:10px;font-size:.92rem;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.carry .btn{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.barin{display:flex;gap:10px}
.barin .btn{flex:1}
.barin .btn.primary{flex:2}
.census{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.bed{font-size:2.5rem;font-weight:700;line-height:1;min-width:2.4ch;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pl1{font-weight:700}
.pl2{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{align-self:flex-start;font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:5px}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.badge.prog{background:var(--prog-soft);color:var(--prog)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.arch li{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.acts{display:flex;gap:8px}
.empty{text-align:center;padding:36px 10px 10px}
.empty p{margin:4px 0}
.privacy{font-size:.85rem;color:var(--muted);margin-top:28px;border-left:3px solid var(--line);padding-left:10px}
.oneliner{font-size:1.05rem;margin:0 0 10px}
dl.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 14px;margin:0 0 8px}
dl.meta dt{font-size:.8rem;color:var(--muted);font-weight:700}
dl.meta dd{margin:0}
dl.meta .wide{grid-column:1/-1}
.probs{padding-left:1.4em;margin:0 0 8px}
.probs>li{margin-bottom:10px}
.probs ul{margin:4px 0 0;padding-left:1.1em;color:var(--muted)}
.probs ul li{display:flex;justify-content:space-between;gap:8px}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:2px 6px}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1}
details{margin:10px 0}
summary{cursor:pointer;color:var(--muted);font-weight:700}
.days{list-style:none;padding:0;margin:0}
.dayrow{display:flex;justify-content:space-between;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left}
.dayrow span{color:var(--muted)}
.danger-zone{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.drip{border-bottom:1px solid var(--line)}
.drip:last-of-type{border-bottom:0}
.dripname{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;font:inherit;color:inherit;padding:10px 0;cursor:pointer;text-align:left}
.box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;position:relative}
.drip.on .box{background:var(--accent);border-color:var(--accent)}
.drip.on .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.drip.on .dripname{font-weight:700}
.dripbody{padding:0 0 10px 34px}
.unit{padding:10px 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:0 10px}
.grid .fld{margin:4px 0}
.litem{border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px}
.fhrow{display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ltr{font-size:1.7rem;font-weight:700;color:var(--accent);line-height:1}
.fhrow h3{margin:2px 0 6px}
.probhd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.probhd h3{margin:0;font-size:1.1rem}
.pnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.prob.resolved{opacity:.6}
.autonote{background:var(--accent-soft);border-radius:10px;padding:4px 12px 2px;margin:4px 0 8px}
.autonote .fld{margin-top:2px}
.items{list-style:none;padding:0;margin:10px 0}
.items li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.items li.stop .itxt{text-decoration:line-through;color:var(--muted)}
.startrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.tag{flex:none;font-size:.78rem;font-weight:700;background:var(--ok-soft);color:var(--ok);padding:3px 7px;border-radius:6px}
.note-paper{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 4px;overflow-wrap:anywhere}
.note-paper p{margin:0 0 1em}
.note-paper strong{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;z-index:20;max-width:90vw;text-align:center}
.labcell{display:flex;flex-direction:column}
.labcell .fld{margin:4px 0 0;flex:none}
.prev{font-size:.78rem;color:var(--muted);margin:2px 0 6px}
.since{display:block;font-size:.8rem;color:var(--muted)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.trend{border-collapse:collapse;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.trend th,.trend td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.trend thead th{font-size:.85rem;color:var(--muted);vertical-align:bottom}
.trend th[scope=row],.trend thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.trend td.sp{color:var(--accent);padding-top:4px;padding-bottom:4px}
.trend tbody tr:last-child>*{border-bottom:0}
.spark{display:block}
.labpick summary{font-weight:400;font-size:.9rem;color:var(--accent);margin:2px 0 6px}
.todo-btn{flex:none;font:inherit;font-size:.9rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}

<body>
<div id="app"></div>
<script>
/* ---------- storage ---------- */
const KEY='icu-rounds-v1';
let S={patients:[]};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}if(!S||!Array.isArray(S.patients))S={patients:[]}}
let saveT;
function writeNow(){clearTimeout(saveT);saveT=null;stampChanges();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}scheduleSync()}
function save(){clearTimeout(saveT);saveT=setTimeout(writeNow,200)}
['pagehide','beforeunload'].forEach(ev=>window.addEventListener&&window.addEventListener(ev,()=>{if(saveT)writeNow()}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)writeNow()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- sync across devices (optional: a private GitHub repo) ----------
   Each patient carries _mod (last-changed time). Deleted patients leave a dated
   tombstone in S._deleted. Merging keeps the newer copy of each patient, so a
   laptop and a desktop can both edit without losing each other's changes. */
const SYNC_KEY='icu-rounds-sync', SYNC_FILE='icu-rounder.json';
let SY=null;try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'null')}catch(e){}
let syncInfo={status:SY?'idle':'off',msg:'',at:null};
let snap={}, syncing=false, syncAgain=false, syncT=null, renderPending=false;
const strip=p=>{const {_mod,...r}=p;return JSON.stringify(r)};
function initSnap(){snap={};for(const p of S.patients)snap[p.id]=strip(p)}
function stampChanges(){const now=Date.now(),seen={};S._deleted=S._deleted||{};
  for(const p of S.patients){const j=strip(p);if(snap[p.id]===undefined?!p._mod:snap[p.id]!==j)p._mod=now;snap[p.id]=j;seen[p.id]=1}
  for(const id in snap)if(!seen[id]){S._deleted[id]=now;delete snap[id]}}
function mergeState(L,R){
  const del=Object.assign({},R._deleted||{});for(const [k,v] of Object.entries(L._deleted||{}))del[k]=Math.max(del[k]||0,v);
  const cutoff=Date.now()-30*864e5;for(const k in del)if(del[k]<cutoff)delete del[k];
  const by=new Map(),order=[];
  for(const p of R.patients||[]){by.set(p.id,p);order.push(p.id)}
  for(const p of L.patients){const r=by.get(p.id);if(!r){by.set(p.id,p);order.push(p.id)}else if((p._mod||0)>=(r._mod||0))by.set(p.id,p)}
  return Object.assign({},L,{patients:order.map(id=>by.get(id)).filter(p=>!(del[p.id]&&del[p.id]>=(p._mod||0))),_deleted:del})}
const b64enc=str=>{const b=new TextEncoder().encode(str);let s2='';for(const x of b)s2+=String.fromCharCode(x);return btoa(s2)};
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opts={},auth=SY){
  const r=await fetch(`https://api.github.com/repos/${auth.owner}/${auth.repo}${path}`,{cache:'no-store',...opts,
    headers:{Authorization:`Bearer ${auth.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return (opts.headers&&opts.headers.Accept||'').includes('raw')?r.text():r.json()}
async function remoteGet(){
  try{const m=await gh('/contents/'+SYNC_FILE);
    const txt=m.content?b64dec(m.content):await gh('/contents/'+SYNC_FILE,{headers:{Accept:'application/vnd.github.raw+json'}});
    let doc=null;try{doc=JSON.parse(txt)}catch(e){}return {doc,sha:m.sha}}
  catch(e){if(e.status===404||e.status===409)return {doc:null,sha:null};throw e}}   // 409 = repo still empty
function remotePut(doc,sha){return gh('/contents/'+SYNC_FILE,{method:'PUT',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:'ICU Rounder sync',content:b64enc(JSON.stringify(doc)),...(sha?{sha}:{})})})}
function setSync(status,msg=''){syncInfo={status,msg,at:status==='ok'?new Date():syncInfo.at};
  const d=document.getElementById('syncdot');if(d){d.className='syncdot '+status;d.title=syncLabel()}
  const l=document.getElementById('syncline');if(l)l.textContent=syncLabel()}
function syncLabel(){const i=syncInfo;
  if(i.status==='off')return 'Not syncing';
  if(i.status==='syncing')return 'Syncing…';
  if(i.status==='error')return 'Not synced: '+i.msg+'. Changes are saved on this device and will sync once this is fixed.';
  return i.at?'Synced '+i.at.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'Ready'}
function softRender(){const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){renderPending=true;return}
  renderPending=false;render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending)softRender()},0));
function scheduleSync(ms=1500){if(!SY)return;clearTimeout(syncT);syncT=setTimeout(syncNow,ms)}
async function syncNow(){if(!SY)return;clearTimeout(syncT);syncT=null;if(syncing){syncAgain=true;return}
  syncing=true;setSync('syncing');
  try{
    for(let attempt=0;;attempt++){
      if(saveT)writeNow();                                  // fold in any pending local edits first
      const rem=await remoteGet();
      if(rem.doc&&Array.isArray(rem.doc.patients)){
        const merged=mergeState(S,rem.doc);
        if(JSON.stringify(merged.patients)!==JSON.stringify(S.patients)){
          S=merged;initSnap();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}softRender()}
        else S._deleted=merged._deleted}
      const out={app:'icu-rounds',version:1,updated:new Date().toISOString(),patients:S.patients,_deleted:S._deleted||{}};
      if(rem.doc&&JSON.stringify(rem.doc.patients)===JSON.stringify(out.patients)&&JSON.stringify(rem.doc._deleted||{})===JSON.stringify(out._deleted))break;
      try{await remotePut(out,rem.sha);break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}}
    setSync('ok')}
  catch(e){setSync('error',e.status===401?'GitHub no longer accepts this token':e.status===403||e.status===404?'this device can’t reach '+SY.owner+'/'+SY.repo:navigator.onLine===false?'offline':'couldn’t reach GitHub')}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(300)}}}
async function connectSync(){
  const token=((document.getElementById('syncToken')||{}).value||'').trim(),repoFull=((document.getElementById('syncRepo')||{}).value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
  const [owner,repo]=repoFull.split('/');V.syncErr='';
  if(!token||!owner||!repo){V.syncErr='Add your token and the repo as owner/name.';render();return}
  const auth={token,owner,repo};
  try{const info=await gh('',{},auth);
    if(!info.private){V.syncErr=`${owner}/${repo} is public. Make it private (its Settings → General → Danger Zone) so patient data isn’t visible to anyone.`;render();return}
    if(info.permissions&&!info.permissions.push){V.syncErr='That token can read the repo but not save to it. Give it “Contents: Read and write”.';render();return}
    SY={token,owner:info.owner&&info.owner.login||owner,repo:info.name||repo};localStorage.setItem(SYNC_KEY,JSON.stringify(SY));
    initSnap();render();await syncNow();syncBoot(true);toast(syncInfo.status==='ok'?'Sync is on for this device':'Connected, but the first sync didn\u2019t finish. It will keep trying.')}
  catch(e){V.syncErr=e.status===401?'GitHub didn’t accept that token.':e.status===404?`This token can’t see ${owner}/${repo}. Check the name and that the token includes that repo.`:'Couldn’t reach GitHub. Check your connection.';render()}}
let syncBooted=false;
function syncBoot(skipFirst){if(!SY||syncBooted)return;syncBooted=true;if(!skipFirst)syncNow();
  document.addEventListener('visibilitychange',()=>{if(!SY)return;if(document.visibilityState==='visible')syncNow();else if(syncT||saveT)syncNow()});
  window.addEventListener('online',()=>{if(SY)syncNow()});
  setInterval(()=>{if(SY&&document.visibilityState==='visible'&&!syncing)syncNow()},60000)}
const ghOwnerGuess=()=>location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fmtDate=s=>{if(!s)return'';const p=s.split('-');return (+p[1])+'/'+(+p[2])};
const fmtLong=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n};
const sent=s=>{s=String(s||'').trim();return s&&!/[.!?]$/.test(s)?s+'.':s};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const signed=n=>(n>0?'+':'')+n;
const clone=o=>JSON.parse(JSON.stringify(o));
const addDays=(s,n)=>{const t=new Date(s+'T12:00');t.setDate(t.getDate()+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
function course(start,cur,days){if(!start)return '';const dd=daysBetween(start,cur)+1;const n=num(days);let s='started '+fmtDate(start);
  if(n&&dd>n)return s+', day '+dd+'; planned '+n+'-day course ended '+fmtDate(addDays(start,n-1));
  if(dd>0)s+=', day '+dd+(n?' of '+n:'');if(n)s+=', final day '+fmtDate(addDays(start,n-1));return s}
function sinceStr(start,cur){if(!start)return '';const dd=daysBetween(start,cur)+1;return 'since '+fmtDate(start)+(dd>0?', day '+dd:'')}
function prevLab(p,d,k){for(let i=p.days.length-1;i>=0;i--){const x=p.days[i];if(x.date<d.date&&x.data&&x.data.labs&&String(x.data.labs[k]??'').trim())return {date:x.date,v:x.data.labs[k]}}return null}

let V={screen:'census',pid:null,step:0,showArchive:false,newPt:null,dayDate:null};
const P=()=>S.patients.find(p=>p.id===V.pid);
function rootOf(r){if(r.length>1&&r[0]==='P')return S.patients.find(x=>x.id===r.slice(1));return r==='d'?P().draft:r==='p'?P():r==='n'?V.newPt:null}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setPath(o,path,v){const ks=path.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function ref(b){const i=b.indexOf(':');return {o:rootOf(b.slice(0,i)),path:b.slice(i+1)}}
function val(b){const {o,path}=ref(b);return getPath(o,path)}

/* ---------- catalogs ---------- */
const STEPS=[['overnight','Overnight'],['vitals','Vitals'],['exam','Exam'],['resp','Respiratory'],['drips','Infusions'],['labs','Labs'],['micro','Micro'],['imaging','Imaging & EKG'],['consults','Consults & blood'],['renal','Renal'],['lines','Lines & tubes'],['fh','FAST HUGS BID'],['plan','Plan'],['summary','Summary']];
const OVN=['No acute events','Rapid response','Code / ROSC','Desaturation','Hypotension','New or increased pressor','Fever','Arrhythmia','Agitation','Unplanned extubation','Transfusion','Procedure','Fall'];
const EXAM=[
 ['gen','General',['Sedated','Intubated','Comfortable','Ill-appearing','Diaphoretic','Agitated']],
 ['neuro','Neuro',['Follows commands','Moves all extremities','Withdraws to pain','Not following commands','Pupils equal & reactive','Focal deficit','Seizure activity']],
 ['heent','HEENT',['ETT in place','Trach in place','OG/NG tube','Oral lesions','Scleral icterus']],
 ['cv','Cardiovascular',['RRR','Tachycardic','Irregularly irregular','Murmur','JVD','Cool extremities','Delayed cap refill']],
 ['pulm','Pulmonary',['Clear bilaterally','Crackles','Wheezes','Diminished bases','Coarse breath sounds','Synchronous with vent','Vent dyssynchrony','Increased work of breathing']],
 ['abd','Abdomen',['Soft','Non-distended','Distended','Tender','Firm','Bowel sounds present','Hypoactive bowel sounds']],
 ['ext','Extremities',['No edema','Pitting edema','Anasarca','Warm & well perfused','Mottling']],
 ['skin','Skin',['Intact','Pressure injury','Rash','Jaundice','Wound']]];
const PRESSORS=[['norepi','Norepinephrine',['mcg/kg/min','mcg/min']],['epi','Epinephrine',['mcg/kg/min','mcg/min']],['vaso','Vasopressin',['units/min']],['phenyl','Phenylephrine',['mcg/kg/min','mcg/min']],['dopa','Dopamine',['mcg/kg/min']],['angio','Angiotensin II',['ng/kg/min']],['dobut','Dobutamine',['mcg/kg/min']],['milri','Milrinone',['mcg/kg/min']]];
const SEDATION=[['propofol','Propofol',['mcg/kg/min']],['dex','Dexmedetomidine',['mcg/kg/hr']],['midaz','Midazolam',['mg/hr']],['loraz','Lorazepam',['mg/hr']],['ketamine','Ketamine',['mg/kg/hr']]];
const ANALGESIA=[['fentanyl','Fentanyl',['mcg/hr']],['hydromorphone','Hydromorphone',['mg/hr']],['morphine','Morphine',['mg/hr']]];
const PARALYTICS=[['cis','Cisatracurium',['mcg/kg/min','mg/hr']],['roc','Rocuronium',['mcg/kg/min','mg/hr']],['vec','Vecuronium',['mcg/kg/min','mg/hr']]];
const TREND={New:'new',Up:'increasing',Stable:'stable',Weaning:'weaning',Stopped:'discontinued'};
const LABS=[['na','Na'],['k','K'],['cl','Cl'],['hco3','HCO3'],['bun','BUN'],['cr','Cr'],['glu','Glucose'],['ca','Ca'],['mg','Mg'],['phos','Phos'],['wbc','WBC'],['hgb','Hgb'],['plt','Plt'],['lactate','Lactate'],['inr','INR'],['tbili','T bili'],['pct','Procalcitonin'],['trop','Troponin'],['hct','Hct'],['alb','Albumin'],['ast','AST'],['alt','ALT'],['alp','Alk phos']];
const LGROUPS=[['Chemistry',['na','k','cl','hco3','bun','cr','glu','ca','mg','phos']],['CBC',['wbc','hgb','hct','plt']],['Liver',['alb','tbili','ast','alt','alp']],['Other',['lactate','inr','pct','trop']]];
const CXSRC=['Blood','Urine','Sputum','BAL','Wound','CSF','C. diff','MRSA nares','Resp viral panel','Other'];
const CXR=['Unchanged','Improved','Worsened','New infiltrate','Effusion','Pulmonary edema','Atelectasis','Pneumothorax','ETT in good position','Lines in good position'];
const RHY=['Sinus rhythm','Sinus tachycardia','Sinus bradycardia','Atrial fibrillation','AF with RVR','Atrial flutter','Paced','Other'];
const EKGF=['No acute ST changes','ST elevation','ST depression','T wave inversions','New bundle branch block','Peaked T waves','Low voltage'];
const pressOn=d=>PRESSORS.some(([k])=>d.drips&&d.drips[k]&&d.drips[k].on&&d.drips[k].trend!=='Stopped');
const parOn=d=>PARALYTICS.some(([k])=>d.drips&&d.drips[k]&&d.drips[k].on&&d.drips[k].trend!=='Stopped');
const rrtOn=d=>!!(d.renal&&['CRRT','iHD','PD'].includes(d.renal.mod));
const CVC={ind:['Vasopressors','Vesicant or irritant meds','TPN','No peripheral access','CVP or ScvO2 monitoring','Frequent blood draws'],
  hint:d=>!pressOn(d)&&(d.fh||{}).feed!=='TPN'?'No vasopressors or TPN today. Could this line come out or be replaced with peripheral access?':''};
const LINEDEF={
 'Central line':CVC,'PICC':CVC,
 'Arterial line':{ind:['Titrating vasoactives','Frequent ABGs','Continuous BP monitoring','Frequent blood draws'],hint:d=>!pressOn(d)&&(d.resp||{}).type!=='Ventilator'?'Off vasopressors and not ventilated. Is the arterial line still needed?':''},
 'Dialysis catheter':{ind:['Ongoing RRT','Plasmapheresis','RRT expected soon'],hint:d=>!rrtOn(d)?'Not on renal replacement therapy today. Is the catheter still needed?':''},
 'Foley':{ind:['Acute retention or obstruction','Strict I/O in critical illness','Perioperative','Sacral or perineal wound','Prolonged immobilization','Comfort care'],hint:d=>!pressOn(d)&&!parOn(d)?'Off vasopressors and paralytics. Does the Foley still meet an indication?':''},
 'ETT':{ind:['Hypoxemia','Hypercapnia','Airway protection','Secretions','Planned procedure'],hint:d=>(d.fh||{}).sbt==='Passed'?'Passed an SBT today. Ready for extubation?':''},
 'Chest tube':{ind:['Air leak','Ongoing drainage','Pneumothorax','Effusion or empyema','Hemothorax'],hint:(d,it)=>it.leak==='No'&&num(it.output)!=null&&num(it.output)<200?'No air leak and under 200 mL in 24 hours. Consider water seal or removal.':''},
 'NG/OG tube':{ind:['Enteral feeding','Medications','Decompression'],hint:d=>(d.fh||{}).feed==='PO'?'Taking PO. Can the tube come out?':''},
 'Rectal tube':{ind:['High-volume liquid stool','Skin protection'],hint:()=>''},
 'Other':{ind:[],hint:()=>''}};
const LINES=Object.keys(LINEDEF);

/* ---------- form builders ---------- */
function inp(b,label,o={}){const v=val(b)??'';return `<label class="fld ${o.w||''}"><span>${label}${o.unit?` <em>${o.unit}</em>`:''}</span><input data-b="${b}" type="${o.type||'text'}" ${o.num?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(o.ph||'')}" autocomplete="off"></label>`}
function ta(b,ph,rows=3){return `<textarea data-b="${b}" rows="${rows}" placeholder="${esc(ph)}">${esc(val(b)??'')}</textarea>`}
function rng(b,label,unit=''){return `<div class="fld"><span>${label}${unit?` <em>${unit}</em>`:''}</span><div class="pair"><input data-b="${b}.lo" inputmode="decimal" value="${esc(val(b+'.lo')??'')}" placeholder="low" aria-label="${label} low" autocomplete="off"><span>–</span><input data-b="${b}.hi" inputmode="decimal" value="${esc(val(b+'.hi')??'')}" placeholder="high" aria-label="${label} high" autocomplete="off"></div></div>`}
function seg(b,opts){const v=val(b);return `<div class="seg" role="group">${opts.map(k=>`<button type="button" class="${v===k?'on':''}" data-set="${b}" data-v="${esc(k)}" aria-pressed="${v===k}">${esc(k)}</button>`).join('')}</div>`}
function chips(b,opts){const v=val(b)||[];return `<div class="chips">${opts.map(k=>`<button type="button" class="chip ${v.includes(k)?'on':''}" data-tog="${b}" data-v="${esc(k)}" aria-pressed="${v.includes(k)}">${esc(k)}</button>`).join('')}</div>`}
function sel(b,label,opts){const v=val(b)??'';return `<label class="fld m"><span>${label}</span><select data-b="${b}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
function listEditor(b,rowFn,addLabel,tmpl){const arr=val(b)||[];return `${arr.map((it,i)=>`<div class="litem">${rowFn(b+'.'+i,it)}<button type="button" class="linkbtn danger" data-act="del" data-b="${b}" data-i="${i}">Remove</button></div>`).join('')}<button type="button" class="btn sm" data-act="add" data-b="${b}" data-t="${esc(JSON.stringify(tmpl))}">${addLabel}</button>`}
const carry=d=>{if(!d.carried)return '';const k=STEPS[V.step][0];const r=d.reviewed&&d.reviewed[k];
  return `<div class="carry"><span>${r?'Marked unchanged from the last rounds.':'Carried forward from the last rounds. Update what changed.'}</span>${r?'':`<button type="button" class="btn sm" data-act="noChange" data-k="${k}">No changes today</button>`}</div>`};

/* ---------- calculations ---------- */
function PBW(p){const h=num(p.height);if(!h||!p.sex)return null;const cm=p.hUnit==='cm'?h:h*2.54;return (p.sex==='M'?50:45.5)+0.91*(cm-152.4)}
const VOLMODES=['AC/VC','PRVC','SIMV'];
function calcs(p,d){const r=d.resp||{},v=d.vitals||{},o={};
  const i=num(v.in),out=num(v.out);if(i!=null&&out!=null)o.net=signed(i-out)+' mL';
  const cf=cumFluid(p,d);if(cf)o.cum=fmtL(cf.tot)+' since '+fmtDate(cf.first);const fw=firstWeight(p,d);if(fw)o.wt0=fw.wt+' kg on '+fmtDate(fw.date);
  const pp=num(r.pplat),pe=num(r.peep);if(r.type==='Ventilator'&&pp!=null&&pe!=null)o.dp=pp-pe;
  const pbw=PBW(p);const vt=VOLMODES.includes(r.mode)?(num(r.vt)??num(r.vte)):num(r.vte);
  if(r.type==='Ventilator'&&pbw&&vt)o.vtk=(vt/pbw).toFixed(1)+' mL/kg';
  const po2=num(r.abg&&r.abg.po2);let fi=num(r.fio2);if(fi==null&&r.type==='Room air')fi=21;
  if(po2&&fi)o.pf=Math.round(po2/(fi>1?fi/100:fi));
  return o}
function updateCalcs(){if(V.screen!=='round')return;const p=P(),d=p.draft;const c=calcs(p,d);document.querySelectorAll('[data-calc]').forEach(el=>{el.textContent=c[el.dataset.calc]??'—'});
  const dia=document.querySelector('[data-dia]');if(dia)dia.innerHTML=labDiagrams(d.labs||{});
  const ac=document.querySelector('[data-acid]');if(ac)ac.textContent=acidText(acidBase(p,d))||'Enter Na, Cl, and HCO3 to calculate the anion gap.';
  const fw=document.querySelector('[data-fwd]');if(fw)fw.textContent=fwdText(p,d)}

function cumFluid(p,d){let tot=0,n=0,first=null;const add=(x,date)=>{const i=num(x&&x.in),o=num(x&&x.out);if(i!=null&&o!=null){tot+=i-o;n++;if(!first||date<first)first=date}};
  p.days.forEach(x=>{if(x.date<d.date&&x.data)add(x.data.vitals,x.date)});add(d.vitals,d.date);return n?{tot,first,n}:null}
const fmtL=ml=>(ml>0?'+':ml<0?'−':'')+(Math.abs(ml)/1000).toFixed(1)+' L';
function firstWeight(p,d){for(const x of p.days){if(x.date<d.date&&x.data&&x.data.vitals&&num(x.data.vitals.wt)!=null)return {date:x.date,wt:x.data.vitals.wt}}return null}
function lastData(p,d){for(let i=p.days.length-1;i>=0;i--){if(p.days[i].date<d.date)return p.days[i].data}return null}

/* ---------- new draft ---------- */
function newDraft(p){
  const d={date:today(),carried:false,overnight:{f:[],note:''},vitals:{},exam:{},resp:{},drips:{},labs:{},abx:[],cx:[],img:{cxr:{},other:[],ekg:{}},renal:{},lines:[],consults:[],tx:[],reviewed:{},fh:{},plan:{},dispo:'',goc:''};
  const last=p.days.length?p.days[p.days.length-1].data:null;
  if(last){const c=clone(last);d.carried=true;
    d.resp=c.resp||{};d.resp.abg={};
    d.drips=c.drips||{};
    Object.keys(d.drips).forEach(k=>{const o=d.drips[k];if(k==='other'){d.drips.other=(o||[]).filter(x=>x.name)}else if(k==='prn'||k==='tof'){d.drips[k]=''}else if(o&&o.on){if(o.trend==='Stopped')d.drips[k]={on:false};else o.trend='Stable'}});
    d.abx=c.abx||[];d.cx=c.cx||[];d.renal=c.renal||{};
    d.lines=(c.lines||[]).filter(x=>x.ready!=='Remove today'&&x.need!=='Remove today').map(x=>{delete x.ready;delete x.output;delete x.need;return x});
    d.consults=(c.consults||[]).filter(x=>x.status!=='Signed off');d.tx=c.tx||[];
    if(d.renal){d.renal.issues=[];}
    d.fh=c.fh||{};['sat','sbt','sbtNote','cam','deesc','deescNote','hypo','hypoNote'].forEach(k=>delete d.fh[k]);
    d.dispo=c.dispo||'';
    if(c.vitals&&c.vitals.mapGoal)d.vitals.mapGoal=c.vitals.mapGoal;
    p.problems.filter(x=>!x.resolved).forEach(pr=>{const lp=c.plan&&c.plan[pr.id];if(lp&&!lp.resolved&&(String(lp.note||'').trim()||lp.status))d.plan[pr.id]={note:lp.note||'',status:lp.status==='New'?'':(lp.status||''),carried:true}});}
  return d}

/* ---------- screens ---------- */
function topbar(title,back,right=''){return `<header class="top"><div class="wrap hd">${back?`<button class="back" data-act="go" data-to="${back}" aria-label="Back">‹</button>`:`<a class="homebtn" href="../" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>`}<h1>${esc(title)}</h1>${right}</div></header>`}

function census(){
  const act=S.patients.filter(p=>p.status!=='discharged').sort((a,b)=>String(a.bed).localeCompare(String(b.bed),undefined,{numeric:true}));
  const dis=S.patients.filter(p=>p.status==='discharged');
  return `${topbar('ICU Rounder','',`<span class="sub">${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span>${SY?`<span id="syncdot" class="syncdot ${syncInfo.status}" title="${esc(syncLabel())}"></span>`:''}`)}
  <main class="wrap">
  ${!SY&&act.length&&(!S.lastBackup||daysBetween(S.lastBackup,today())>=7)?`<div class="carry"><span>${S.lastBackup?'No backup in over a week.':'You haven’t backed up yet.'}</span><button type="button" class="btn sm" data-act="exportBackup">Export backup</button></div>`:''}
  ${act.length?`<ul class="census">${act.map(ptCard).join('')}</ul>`:`<div class="empty"><p><strong>No patients on the list.</strong></p><p class="muted">Add a patient to start a profile that follows them until discharge from the service.</p></div>`}
  <button class="btn primary block" data-act="addPt">Add patient</button>
  ${act.length?`<button class="btn block" data-act="go" data-to="handoff">Handoff view</button>`:''}
  ${dis.length?`<button class="linkbtn" data-act="toggleArchive">${V.showArchive?'Hide':'Show'} discharged patients (${dis.length})</button>
  ${V.showArchive?`<ul class="census arch">${dis.map(p=>`<li><div><strong>Bed ${esc(p.bed)}</strong> <span class="muted">${esc(p.oneLiner||'')}</span></div><div class="acts"><button class="btn sm" data-act="readmit" data-id="${p.id}">Return to list</button><button class="btn sm danger" data-act="delPt" data-id="${p.id}" data-confirm="Tap again to delete">Delete</button></div></li>`).join('')}</ul>`:''}`:''}
  <h2>Backup</h2><div class="card">
  <p class="calc">${S.lastBackup?'Last backup '+fmtLong(S.lastBackup)+'.':'No backup yet.'} Data lives only in this browser, so export a backup regularly.</p>
  <div class="row gap"><button class="btn" data-act="exportBackup">Export backup</button><label class="btn filebtn">Import backup<input type="file" accept=".json,application/json,text/plain" id="importFile" class="vh"></label></div>
  ${V.showBackupText?`<p class="calc">Saving a file isn’t available here. Copy this text and keep it somewhere safe:</p><textarea readonly rows="4" onclick="this.select()">${esc(V.showBackupText)}</textarea>`:''}
  <details><summary>Paste a backup instead</summary><textarea id="importText" rows="4" placeholder="Paste backup text here"></textarea><button class="btn sm" data-act="importPaste">Load pasted backup</button></details>
  ${V.pendingImport?`<p class="flag">This replaces all current patients with ${V.pendingImport.patients.length} patient${V.pendingImport.patients.length===1?'':'s'} from the backup${V.pendingImport.exported?' exported '+fmtLong(V.pendingImport.exported.slice(0,10)):''}.</p><div class="row gap"><button class="btn danger" data-act="confirmImport" data-confirm="Tap again to replace">Replace with backup</button><button class="btn" data-act="cancelImport">Cancel</button></div>`:''}
  </div>
  <h2>Sync across devices</h2><div class="card">
  ${SY?`<p class="calc"><span id="syncline">${esc(syncLabel())}</span></p>
  <p class="calc">Patients sync through your private repo <strong>${esc(SY.owner)}/${esc(SY.repo)}</strong>. Open ICU Rounder on another computer that’s set up the same way and the list follows you.</p>
  <div class="row gap"><button class="btn" data-act="syncNow">Sync now</button><button class="btn" data-act="syncOff" data-confirm="Tap again to stop">Stop syncing on this device</button></div>`
  :`<p class="calc">Keep the same patient list on your laptop and desktop. Patients are saved to a <strong>private</strong> GitHub repo using a token you paste once on each device.</p>
  <div class="row"><label class="fld"><span>GitHub token</span><input type="password" id="syncToken" placeholder="github_pat_…" autocomplete="off"></label>
  <label class="fld"><span>Private repo</span><input type="text" id="syncRepo" value="${esc((ghOwnerGuess()||'your-username')+'/panacea-data')}" autocapitalize="off" spellcheck="false"></label></div>
  ${V.syncErr?`<p class="flag">${esc(V.syncErr)}</p>`:''}
  <div class="row gap"><button class="btn primary" data-act="syncConnect">Turn on sync</button></div>
  <details><summary>How to set this up</summary><ol class="calc steps">
  <li>On github.com, create a new <strong>private</strong> repository named <code>panacea-data</code>.</li>
  <li>Profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
  <li>Repository access: <em>Only select repositories</em> → <code>panacea-data</code>. Permissions → Contents: <em>Read and write</em>.</li>
  <li>Paste the token here and tap <strong>Turn on sync</strong>. Repeat on each computer.</li></ol></details>`}
  </div>
  <p class="privacy">${SY?'Patients are saved in this browser and synced to your private GitHub repo.':'Everything entered here stays in this browser on this device.'} Identify patients by bed number only: no names, MRNs, or birth dates.</p>
  </main>`}

function ptCard(p){const t=today();
  const st=p.draft?['prog','Rounds in progress']:p.days.some(x=>x.date===t)?['done','Rounded today']:['todo','Not yet rounded'];
  const day=p.admit?daysBetween(p.admit,t)+1:null;
  const l1=[(p.age||'')+(p.sex||''),day>0&&'ICU day '+day,p.severity&&p.severity!=='Stable'&&p.severity].filter(Boolean).join(', ');
  return `<li><button class="pcard" data-act="openPt" data-id="${p.id}"><span class="bed">${esc(p.bed)}</span><span class="pinfo">${l1?`<span class="pl1">${esc(l1)}</span>`:''}<span class="pl2">${esc(p.oneLiner||'No one-liner yet')}</span><span class="badge ${st[0]}">${st[1]}</span></span></button></li>`}

  return `${topbar(isNew?'New patient':'Edit details',isNew?'census':'patient')}
  <main class="wrap"><div class="card">
  <div class="row">${inp('n:bed','Bed',{w:'s',ph:'e.g. 12'})}${inp('n:age','Age',{num:1,w:'s'})}<div class="fld s"><span>Sex</span>${seg('n:sex',['M','F'])}</div></div>
  ${V.err?`<p class="req">${V.err}</p>`:''}
  <div class="row">${inp('n:height','Height',{num:1,w:'s'})}<div class="fld s"><span>Unit</span>${seg('n:hUnit',['in','cm'])}</div>${inp('n:admit','ICU admit date',{type:'date',w:'m'})}</div>
  <p class="calc">Height and sex are used to calculate tidal volume per kg of predicted body weight.</p>
  <label class="fld"><span>One-liner</span>${ta('n:oneLiner','e.g. 67M with COPD admitted with septic shock from RLL pneumonia, intubated for hypoxemic respiratory failure',3)}</label>
  <label class="fld"><span>Past medical history</span>${ta('n:pmh','e.g. COPD, HFrEF (EF 30%), CKD 3',2)}</label>
  <div class="fld"><span>Code status</span>${seg('n:code',['Full code','DNR','DNR/DNI','Comfort care'])}</div>
  ${inp('n:allergies','Allergies',{ph:'e.g. NKDA'})}
  ${isNew?`<label class="fld"><span>Problem list <em>one per line</em></span>${ta('n:probs','Septic shock\nAcute hypoxemic respiratory failure\nAKI',4)}</label>`:''}
  </div>
  <p class="privacy">Use a bed number, not a name, MRN, or date of birth.</p>
  <button class="btn primary block" data-act="savePt">${isNew?'Add patient':'Save details'}</button>
  </main>`}

function patientView(){const p=P();const t=today();const day=p.admit?daysBetween(p.admit,t)+1:null;
  const act=p.problems.filter(x=>!x.resolved),res=p.problems.filter(x=>x.resolved);
  const meta=[['Age/sex',(p.age||'')+(p.sex||'')],['ICU day',day>0?day:''],['Code status',p.code],['Allergies',p.allergies]].filter(x=>x[1]);
  return `${topbar('Bed '+p.bed,'census')}
  <main class="wrap">
  <section class="card"><p class="oneliner">${esc(p.oneLiner||'No one-liner yet.')}</p>
  <dl class="meta">${meta.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}${p.pmh?`<div class="wide"><dt>PMH</dt><dd>${esc(p.pmh)}</dd></div>`:''}</dl>
  <div class="row gap"><button class="btn sm" data-act="editPt">Edit details</button><button class="btn sm" data-act="bedOpen">Change bed</button></div></section>${bedEditor(p)}
  <button class="btn primary block" data-act="startRounds">${p.draft?'Continue rounds':'Start rounds'}</button><button class="btn block iconbtn" data-act="dictOpen" data-back="patient"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg> Dictate while chart reviewing</button><button class="btn block" data-act="trends" data-back="patient">Lab trends</button>
  <h2>Problem list</h2>
  ${act.length?`<ol class="probs">${act.map(pr=>`<li><strong>${esc(pr.name)}</strong>${pr.plan.length?`<ul>${pr.plan.map((it,i)=>`<li><span>${esc(it.text)}${it.started?`<span class="since">since ${fmtDate(it.started)}</span>`:''}</span><button class="x" data-act="delPlanItem" data-pr="${pr.id}" data-i="${i}" aria-label="Remove plan item">×</button></li>`).join('')}</ul>`:''}</li>`).join('')}</ol>`:'<p class="muted">No active problems. Add them here or during rounds.</p>'}
  <div class="addrow"><input id="newProb" placeholder="Add a problem" autocomplete="off"><button class="btn sm" data-act="addProbPt">Add</button></div>
  ${res.length?`<details><summary>Resolved problems (${res.length})</summary><ul>${res.map(r=>`<li>${esc(r.name)} <button class="linkbtn" data-act="unresolve" data-id="${r.id}">Reactivate</button></li>`).join('')}</ul></details>`:''}
  <h2>Action list</h2><div class="card">${actionEditor(p)}</div>
  <h2>Past rounds</h2>
  ${p.days.length?`<ul class="days">${[...p.days].reverse().map(x=>`<li><button class="dayrow" data-act="openDay" data-date="${x.date}">${fmtLong(x.date)}<span>›</span></button></li>`).join('')}</ul>`:'<p class="muted">Finished rounds will appear here.</p>'}
  <div class="danger-zone"><button class="btn" data-act="discharge" data-confirm="Tap again to discharge">Discharge from service</button>${p.draft?`<button class="btn danger" data-act="discardDraft" data-confirm="Tap again to discard">Discard today's draft</button>`:''}</div>
  </main>`}

function roundView(){const p=P(),d=p.draft,st=STEPS[V.step];const flagged=new Set(safetyFlags(p,d).map(x=>x.step));const last=V.step===STEPS.length-1;
  return `<header class="top"><div class="wrap hd"><button class="back" data-act="go" data-to="patient" aria-label="Back to patient">‹</button><h1><button type="button" class="bedbtn" data-act="bedOpen" aria-label="Change bed number">Bed ${esc(p.bed)}</button></h1><button class="todo-btn mic" data-act="dictOpen" data-back="round" aria-label="Dictate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></button><button class="todo-btn" data-act="openSheet">To-do${(()=>{const n=(p.actions||[]).filter(a=>a.kind==='todo'&&!a.done).length;return n?` <span class="cnt">${n}</span>`:''})()}</button><input class="datein" type="date" data-b="d:date" value="${esc(d.date)}" aria-label="Rounding date"></div>
  <nav class="steps wrap" aria-label="Rounding sections">${STEPS.map((s,i)=>`<button class="${i===V.step?'cur':''} ${flagged.has(s[0])?'hasflag':''}" data-act="step" data-i="${i}" ${i===V.step?'aria-current="step"':''}>${d.reviewed&&d.reviewed[s[0]]?'✓ ':''}${s[1]}${flagged.has(s[0])?'<span class="sr"> (has flags)</span>':''}</button>`).join('')}</nav></header>
  <main class="wrap">${bedEditor(p)}${STEPFN[st[0]](p,d).replace('</h2>','</h2>'+flagBox(p,d,st[0]))}</main>
  <div class="bar"><div class="wrap barin"><button class="btn" data-act="prev" ${V.step===0?'disabled':''}>Back</button>${last?`<button class="btn primary" data-act="finish">Finish rounds</button>`:`<button class="btn primary" data-act="next">Next: ${STEPS[V.step+1][1]}</button>`}</div></div>
  ${V.sheet?`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Action list"><div class="sheethd"><h2>Action list</h2><button class="btn sm" data-act="closeSheet">Done</button></div>${actionEditor(p)}</div>`:''}`}

function drip([k,name,units]){const b='d:drips.'+k;const o=val(b)||{};const on=!!o.on;
  return `<div class="drip ${on?'on':''}"><button type="button" class="dripname" data-act="dripToggle" data-k="${k}" data-u="${units[0]}" aria-pressed="${on}"><span class="box"></span>${name}</button>
  ${on?`<div class="dripbody"><div class="row">${inp(b+'.dose','Dose',{num:1,w:'s'})}<div class="fld m"><span>Units</span>${units.length>1?seg(b+'.unit',units):`<div class="unit">${units[0]}</div>`}</div></div><div class="fld"><span>Trend</span>${seg(b+'.trend',['New','Up','Stable','Weaning','Stopped'])}</div><div class="row">${inp(b+'.since','Started',{type:'date',w:'m'})}${o.since?`<p class="calc inline">Day <output>${daysBetween(o.since,P().draft.date)+1}</output></p>`:''}</div>${probSel(P(),b+'.pr',dripFor(P(),k,o))}</div>`:''}</div>`}

function lineCard(p,d,it,i){const b='d:lines.'+i;const def=LINEDEF[it.type]||LINEDEF.Other;const dd=it.date?daysBetween(it.date,d.date)+1:null;const hint=def.hint(d,it);
  return `<div class="card"><div class="cardhd"><h3>${esc(it.type||'Device')}${it.site?' '+esc(it.site):''}${dd>0?` <span class="muted">day ${dd}</span>`:''}</h3><button type="button" class="linkbtn danger" data-act="del" data-b="d:lines" data-i="${i}">Remove from list</button></div>
  <div class="row">${sel(b+'.type','Type',LINES)}${inp(b+'.site','Site',{ph:'e.g. R IJ',w:'m'})}${inp(b+'.date','Placed',{type:'date',w:'m'})}</div>
  ${it.type==='Chest tube'?`<div class="row">${inp(b+'.output','Output, 24 h',{num:1,unit:'mL',w:'s'})}<div class="fld m"><span>Air leak</span>${seg(b+'.leak',['Yes','No'])}</div><div class="fld m"><span>Setting</span>${seg(b+'.suction',['Suction','Water seal'])}</div></div>`:''}
  ${def.ind.length?`<div class="fld"><span>Still needed for</span>${chips(b+'.why',def.ind)}</div>`:''}
  ${hint?`<p class="flag soft">${esc(hint)}</p>`:''}
  <div class="fld"><span>Ready to come out?</span>${seg(b+'.ready',['Keep','Remove today','Reassess tomorrow'])}</div></div>`}
function txTotals(d){const t={};(d.tx||[]).forEach(x=>{if(x.product)t[x.product]=(t[x.product]||0)+(num(x.units)||0)});return Object.entries(t).map(([k,v])=>`${k} ${v} unit${v===1?'':'s'}`).join(', ')}
function linesText(d){return (d.lines||[]).filter(x=>x.type).map(x=>{const dd=x.date?daysBetween(x.date,d.date)+1:null;const bits=[x.date&&'placed '+fmtDate(x.date)+(dd>0?', day '+dd:'')];
  if(x.type==='Chest tube'){if(x.output)bits.push(x.output+' mL/24 h');if(x.leak)bits.push(x.leak==='Yes'?'air leak':'no air leak');if(x.suction)bits.push(x.suction.toLowerCase())}
  const w=(x.why||[]).map(lc1);let s=x.type+(x.site?' '+x.site:'');const bb=bits.filter(Boolean);if(bb.length)s+=` (${bb.join(', ')})`;if(w.length)s+=', needed for '+w.join(', ');if(x.ready)s+='; '+x.ready.toLowerCase();return s}).join('; ')}

exam:(p,d)=>{const ly=lastData(p,d),le=(ly&&ly.exam)||{};const has=k=>{const e=le[k];return !!(e&&((e.f&&e.f.length)||e.note||e.gcs))};const any=EXAM.some(([k])=>has(k));

resp:(p,d)=>{const r=d.resp;const t=r.type;const F=(k,l,u)=>inp('d:resp.'+k,l,{num:1,unit:u,w:'s'});

    <h3>Mode and settings</h3><div class="card">${seg('d:resp.mode',['AC/VC','AC/PC','PRVC','SIMV','PSV/CPAP','APRV'])}<div class="row">`;
    if(VOLMODES.includes(m))h+=F('vt','Set VT','mL')+F('rr','Set RR','')+F('peep','PEEP','cmH₂O')+F('fio2','FiO₂','%')+(m==='SIMV'?F('ps','PS','cmH₂O'):'');
    else if(m==='AC/PC')h+=F('pinsp','Pinsp','above PEEP')+F('ti','Ti','sec')+F('rr','Set RR','')+F('peep','PEEP','cmH₂O')+F('fio2','FiO₂','%');
    else if(m==='PSV/CPAP')h+=F('ps','PS','cmH₂O')+F('peep','PEEP','cmH₂O')+F('fio2','FiO₂','%');
    else if(m==='APRV')h+=F('phigh','P high','cmH₂O')+F('plow','P low','cmH₂O')+F('thigh','T high','sec')+F('tlow','T low','sec')+F('fio2','FiO₂','%');
    else h+='<p class="muted">Choose a mode to see its settings.</p>';
    h+=`</div></div><h3>Measured</h3><div class="card"><div class="row">${F('rrTotal','Total RR','')}${!VOLMODES.includes(m)?F('vte','Exhaled VT','mL'):''}${F('ppeak','Ppeak','cmH₂O')}${F('pplat','Pplat','cmH₂O')}</div>
    <p class="calc">Driving pressure: <output data-calc="dp">—</output></p><p class="calc">VT per kg PBW: <output data-calc="vtk">—</output></p>

  h+=`<h3>ABG, if obtained</h3><div class="card"><div class="grid">${F('abg.ph','pH','')}${F('abg.pco2','PaCO₂','')}${F('abg.po2','PaO₂','')}${F('abg.hco3','HCO₃','')}</div><p class="calc">P/F ratio: <output data-calc="pf">—</output></p></div>`;

micro:(p,d)=>`<h2>Antimicrobials and cultures</h2>${carry(d)}<h3>Antimicrobials</h3><div class="card">${listEditor('d:abx',(b,it)=>`${inp(b+'.drug','Drug',{ph:'e.g. cefepime 2 g q8h'})}<div class="row">${inp(b+'.start','Start date',{type:'date',w:'m'})}${inp(b+'.days','Planned days',{num:1,w:'s'})}</div>${it.start?`<p class="calc">${esc(cap(course(it.start,d.date,it.days)))}</p>`:''}${inp(b+'.ind','Indication',{ph:'e.g. HAP'})}${it.drug&&!String(it.ind||'').trim()?'<p class="calc">Add an indication to put this on the problem list.</p>':''}`,'Add antimicrobial',{drug:'',start:d.date,days:'',ind:''})}</div>

    <button type="button" class="linkbtn" data-act="resolveToggle" data-pr="${pr.id}">${pl.resolved?'Undo resolve':'Mark problem resolved'}</button></div>`}).join('')}
  <div class="card"><div class="addrow"><input id="newProbR" placeholder="Add a problem, e.g. AKI" autocomplete="off"><button class="btn sm" data-act="addProbR">Add</button></div></div>
  <h3>Disposition and goals of care</h3><div class="card"><div class="fld"><span>Disposition</span>${seg('d:dispo',['Remain in ICU','Step-down','Transfer to floor','Comfort care'])}</div><label class="fld"><span>Family and goals of care</span>${ta('d:goc','e.g. Updated daughter at bedside; family meeting tomorrow',2)}</label></div>`},

summary:(p,d)=>{const fmt=V.fmt||'rounds';const t=buildSummary(p,d,fmt);V.lastSummary=t;const F=safetyFlags(p,d);
  return `<h2>Rounding summary</h2>${F.length?`<div class="card flagcard"><h3>Review before finishing</h3>${F.map(x=>`<button type="button" class="flagrow" data-act="step" data-i="${STEPS.findIndex(s=>s[0]===x.step)}"><span>${esc(x.text)}</span><span class="flagstep">${STEPS.find(s=>s[0]===x.step)[1]} ›</span></button>`).join('')}</div>`:''}
  ${fmtToggle(fmt)}<p class="muted">${fmt==='note'?'Plain-text layout for pasting into a progress note.':'Read this on rounds.'} Finishing saves the day and updates the problem list.</p><article class="note-paper">${fmtSummary(t)}</article><button class="btn" data-act="copy">Copy text</button>`}
};

const fmtToggle=fmt=>`<div class="seg">${[['rounds','Read on rounds'],['note','Progress note']].map(([k,l])=>`<button type="button" class="${fmt===k?'on':''}" data-act="fmt" data-k="${k}" aria-pressed="${fmt===k}">${l}</button>`).join('')}</div>`;
function dayView(){const p=P();const day=p.days.find(x=>x.date===V.dayDate);const fmt=V.fmt||'rounds';
  const t=!day?'':fmt==='note'?(day.note||buildSummary(p,day.data,'note')):day.summary;V.lastSummary=t;
  return `${topbar(fmtLong(V.dayDate),'patient')}<main class="wrap">${fmtToggle(fmt)}<article class="note-paper">${fmtSummary(t)}</article><p><button class="btn" data-act="copy">Copy text</button></p></main>`}

const TORDER=['wbc','hgb','hct','plt','cr','bun','na','k','cl','hco3','glu','lactate','ca','mg','phos','alb','tbili','ast','alt','alp','inr','pct','trop'];
function spark(vals){const pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);if(pts.length<2)return '';
  const W=84,H=26,mn=Math.min(...pts.map(x=>x[1])),mx=Math.max(...pts.map(x=>x[1])),n=vals.length-1||1;
  const xy=pts.map(([i,v])=>[(i/n)*(W-6)+3,mx===mn?H/2:H-3-((v-mn)/(mx-mn))*(H-6)]);const last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="currentColor"/></svg>`}
const PLABS=[
 [/sepsis|septic|pneumonia|infect|bacteremia|\bUTI\b|pyelo|cellulitis|abscess|cholangitis|colitis|empyema|meningitis|endocarditis/i,['wbc','pct','lactate']],
 [/shock|hypotension|hypoperfusion/i,['lactate']],
 [/\bAKI\b|kidney|renal|ESRD|ESKD|\bATN\b|oligur/i,['cr','bun','k','hco3']],
 [/glyc|diabet|\bDKA\b|\bHHS\b|\bDM\b/i,['glu','k','hco3']],
 [/anemia|bleed|hemorrhage|\bGIB\b|hematoma|transfus/i,['hgb','plt','inr']],
 [/thrombocytopenia|\bHIT\b|\bDIC\b|coagulopathy/i,['plt','inr']],
 [/liver|hepat|cirrho|cholestasis|biliary/i,['tbili','inr','plt']],
 [/acidosis/i,['hco3','lactate']],[/kalemia/i,['k']],[/natremia/i,['na']],[/magnes/i,['mg']],[/phosphat/i,['phos']],[/calcemia/i,['ca']],
 [/\bACS\b|NSTEMI|STEMI|myocard|troponin|demand ischemia/i,['trop']]];
function defaultLabs(pr){const s=new Set();pAutos(pr).forEach(a=>{
  if(a.startsWith('abx:'))['wbc','pct'].forEach(k=>s.add(k));if(a==='shock')s.add('lactate');if(a==='rrt')['cr','bun','k','hco3'].forEach(k=>s.add(k));if(a==='insulin')s.add('glu');if(a==='hyperna')s.add('na')});
  PLABS.forEach(([re,ks])=>{if(re.test(pr.name||''))ks.forEach(k=>s.add(k))});return TORDER.filter(k=>s.has(k))}
const prLabs=pr=>Array.isArray(pr.labs)?pr.labs:defaultLabs(pr);
function labSeries(p,d,k,max=4){const s=[];
  p.days.forEach(x=>{if(x.date<d.date&&x.data&&x.data.labs&&String(x.data.labs[k]??'').trim())s.push({date:x.date,v:String(x.data.labs[k]).trim()})});
  if(d.labs&&String(d.labs[k]??'').trim())s.push({date:d.date,v:String(d.labs[k]).trim()});return s.slice(-max)}
function labTrendText(p,d,ks){return ks.map(k=>{const s=labSeries(p,d,k);if(!s.length)return null;const l=LABS.find(x=>x[0]===k)[1];
  return `${l} ${s.map(x=>x.v).join(' → ')} (${fmtDate(s[0].date)}${s.length>1?'–'+fmtDate(s[s.length-1].date):''})`}).filter(Boolean).join('; ')}

function trendsView(){const p=P();
  let cols=p.days.filter(x=>x.data&&x.data.labs).map(x=>({date:x.date,labs:x.data.labs}));
  if(p.draft&&p.draft.labs){cols=cols.filter(c=>c.date!==p.draft.date);cols.push({date:p.draft.date,labs:p.draft.labs,draft:true})}
  cols.sort((a,b)=>a.date.localeCompare(b.date));
  const rows=TORDER.map(k=>[k,LABS.find(x=>x[0]===k)[1]]).filter(([k])=>cols.some(c=>String(c.labs[k]??'').trim()));
  const shown=[...cols].reverse();
  return `${topbar('Bed '+p.bed+' lab trends',V.trendsBack||'patient')}<main class="wrap">
  ${rows.length?`<p class="muted">Newest on the left. Scroll sideways for older days.</p><div class="tscroll"><table class="trend"><thead><tr><th scope="col">Lab</th><th scope="col">Trend</th>${shown.map(c=>`<th scope="col">${fmtDate(c.date)}${c.draft?'<br><span class="muted">in progress</span>':''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(([k,l])=>`<tr><th scope="row">${l}</th><td class="sp">${spark(cols.map(c=>num(c.labs[k])))}</td>${shown.map(c=>`<td>${esc(c.labs[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  :`<div class="empty"><p><strong>No labs entered yet.</strong></p><p class="muted">Labs entered during rounds will be trended here day by day.</p></div>`}
  </main>`}

function aItem(a){return `<li class="${a.done?'done':''}">${a.kind==='todo'?`<button type="button" class="check ${a.done?'on':''}" data-act="actDone" data-id="${a.id}" aria-label="${a.done?'Mark not done':'Mark done'}" aria-pressed="${!!a.done}"></button>`:'<span class="notemark" aria-hidden="true">Note</span>'}<span class="atext">${esc(a.text)}<span class="since">${a.done?'Done '+fmtDate(a.doneDate):'Added '+fmtDate(a.created)}</span></span><button type="button" class="x" data-act="actDel" data-id="${a.id}" aria-label="Delete">×</button></li>`}
function actionEditor(p){const A=p.actions||[];const kind=V.actKind||'todo';
  const todos=A.filter(a=>a.kind==='todo'&&!a.done),notes=A.filter(a=>a.kind==='note'),done=A.filter(a=>a.kind==='todo'&&a.done);

  <div class="addrow"><input id="newAction" placeholder="${kind==='note'?'Add a note':'Add a to-do, e.g. call nephrology'}" autocomplete="off"><button type="button" class="btn sm primary" data-act="addAction">Add</button></div>

  ${done.length?`<details><summary>Completed (${done.length})</summary><ul class="alist">${done.slice().reverse().map(aItem).join('')}</ul></details>`:''}`}
const curDate=()=>{const p=P();return p&&p.draft?p.draft.date:today()};

/* ---------- thromboprophylaxis ---------- */
const lc1=s=>s&&/^[A-Z][a-z]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;
const DVTAG={
 'Heparin SQ':{doses:['5,000 units q8h','5,000 units q12h','7,500 units q8h'],tip:'Usual dose 5,000 units every 8–12 hours. Some protocols use 7,500 units every 8 hours for severe obesity. A reasonable choice with severe renal impairment or when quick reversal may be needed.'},
 'Enoxaparin':{doses:['40 mg daily','30 mg daily','30 mg q12h','40 mg q12h'],tip:'Usual dose 40 mg daily. Reduce to 30 mg daily if CrCl is below 30. Trauma or BMI ≥40 often uses 30–40 mg every 12 hours per protocol.'},
 'Dalteparin':{doses:['5,000 units daily'],tip:'Usual dose 5,000 units daily. Use caution with severe renal impairment.'},
 'Fondaparinux':{doses:['2.5 mg daily'],tip:'Usual dose 2.5 mg daily. An option with a history of HIT. Avoid if CrCl is below 30 or weight is under 50 kg.'}};
function dvtFlags(d){const f=d.fh||{},L=d.labs||{},out=[];const cr=num(L.cr),plt=num(L.plt);const pharm=f.dvtMode==='Pharmacologic';
  if(pharm&&plt!=null&&plt<50)out.push(`Platelets ${L.plt} today. Many protocols hold pharmacologic prophylaxis below 50.`);
  if(pharm&&['Enoxaparin','Dalteparin','Fondaparinux'].includes(f.dvtAgent)){
    if(d.renal&&['CRRT','iHD','PD'].includes(d.renal.mod))out.push(`On ${d.renal.mod}. Consider heparin SQ instead of ${f.dvtAgent.toLowerCase()}, or confirm dosing with pharmacy.`);
    else if(cr!=null&&cr>=2)out.push(`Cr ${L.cr} today. Check CrCl and adjust ${f.dvtAgent.toLowerCase()} dosing.`)}
  if(f.dvtMode==='Held'&&f.scd!=='In place'&&f.scd!=='Contraindicated')out.push('Prophylaxis is held. Use SCDs unless contraindicated.');
  if(f.dvtMode==='Mechanical only'&&!String(f.dvtMechWhy||'').trim())out.push('Add the reason pharmacologic prophylaxis isn’t being used.');
  return out}
function dvtSection(p,d){const f=d.fh;const m=f.dvtMode;
  let h=`<p class="tip">Most ICU patients should receive pharmacologic prophylaxis with LMWH or SQ heparin unless contraindicated. Confirm agent and dose with your institution’s protocol.</p>${seg('d:fh.dvtMode',['Pharmacologic','Mechanical only','Therapeutic anticoagulation','Held'])}`;
  if(m==='Pharmacologic'){h+=`<div class="fld"><span>Agent</span>${seg('d:fh.dvtAgent',Object.keys(DVTAG))}</div>`;const a=DVTAG[f.dvtAgent];
    if(a)h+=`<p class="tip">${a.tip}</p><div class="fld"><span>Dose</span>${seg('d:fh.dvtDose',[...a.doses,'Other'])}</div>${f.dvtDose==='Other'?inp('d:fh.dvtDoseOther','Dose'):''}`}
  if(m==='Therapeutic anticoagulation')h+=`<div class="fld"><span>Agent</span>${seg('d:fh.acAgent',['Heparin infusion','Enoxaparin','Apixaban','Warfarin','Argatroban','Bivalirudin','Other'])}</div><div class="row">${inp('d:fh.acDose','Dose or goal',{ph:'e.g. anti-Xa goal 0.3–0.7'})}${inp('d:fh.acInd','Indication',{ph:'e.g. PE'})}</div>`;
  if(m==='Mechanical only')h+=`<p class="tip">Use intermittent pneumatic compression when pharmacologic prophylaxis is contraindicated, and reassess daily so it can be started once the contraindication resolves.</p>${inp('d:fh.dvtMechWhy','Why no pharmacologic prophylaxis',{ph:'e.g. active GI bleed'})}`;
  if(m==='Held'){const w=f.heldWhy||[];
    h+=`<div class="fld"><span>Held for</span>${chips('d:fh.heldWhy',['Procedure','Active bleeding','Thrombocytopenia','Coagulopathy','Recent ICH or neurosurgery','Neuraxial catheter','Other'])}</div>`;
    if(w.includes('Procedure'))h+=`<div class="row">${inp('d:fh.heldProc','Procedure',{ph:'e.g. tracheostomy'})}${inp('d:fh.heldProcDate','Procedure date',{type:'date',w:'m'})}</div><p class="tip">Hold timing depends on the procedure’s bleeding risk. Before neuraxial procedures, ASRA guidance is to hold prophylactic SQ heparin 4–6 hours and prophylactic LMWH 12 hours.</p>`;
    h+=`<div class="row">${inp('d:fh.dvtHeldSince','Held since',{type:'date',w:'m'})}${inp('d:fh.heldResume','Plan to resume',{ph:'e.g. 24 h after procedure if hemostasis'})}</div><p class="tip">Reassess daily, use SCDs while held, and document when prophylaxis will restart.</p>`}
  if(m&&m!=='Therapeutic anticoagulation')h+=`<div class="fld"><span>SCDs</span>${seg('d:fh.scd',['In place','Not in place','Contraindicated'])}</div>`;
  h+=dvtFlags(d).map(x=>`<p class="flag">${esc(x)}</p>`).join('');
  return h+inp('d:fh.dvtNote','Other details')}
function dvtText(d){const f=d.fh||{};const m=f.dvtMode;
  const scd={'In place':'SCDs in place','Not in place':'SCDs not in place','Contraindicated':'SCDs contraindicated'}[f.scd]||'';let s='';
  if(m==='Pharmacologic'){const dose=f.dvtDose==='Other'?f.dvtDoseOther:f.dvtDose;s=[f.dvtAgent?(f.dvtAgent==='Heparin SQ'?'heparin SQ':lc1(f.dvtAgent))+(dose?' '+dose:''):'pharmacologic',scd].filter(Boolean).join(', ')}
  else if(m==='Mechanical only')s='mechanical only'+(f.dvtMechWhy?' ('+f.dvtMechWhy+')':'')+(scd?', '+scd:'');
  else if(m==='Therapeutic anticoagulation')s='on therapeutic anticoagulation'+(f.acAgent?' with '+lc1(f.acAgent):'')+(f.acDose?' ('+f.acDose+')':'')+(f.acInd?' for '+f.acInd:'');
  else if(m==='Held'){const w=(f.heldWhy||[]).map(x=>x==='Procedure'&&f.heldProc?f.heldProc+(f.heldProcDate?' on '+fmtDate(f.heldProcDate):''):lc1(x));
    s='held'+(f.dvtHeldSince?' since '+fmtDate(f.dvtHeldSince):'')+(w.length?' for '+w.join(', '):'')+(scd?'; '+scd:'')+(f.heldResume?'; plan to resume '+f.heldResume:'')}
  if(f.dvtNote)s=s?sent(s)+' '+f.dvtNote:f.dvtNote;return s?sent(s):''}

/* ---------- safety flags ---------- */
function safetyFlags(p,d){const F=[];const add=(step,text,inline)=>F.push({step,text,inline});const r=d.resp||{},c=calcs(p,d),f=d.fh||{};
  if(r.type==='Ventilator'){const vk=c.vtk?parseFloat(c.vtk):null;
    if(vk&&vk>8)add('resp',`Tidal volume is ${c.vtk} PBW. The lung-protective target is 6–8 mL/kg.`);
    if(num(r.pplat)!=null&&num(r.pplat)>30)add('resp',`Plateau pressure is ${r.pplat}. The goal is 30 or less.`);
    if(c.dp!=null&&c.dp>15)add('resp',`Driving pressure is ${c.dp}. The goal is 15 or less.`);
    let fi=num(r.fio2);if(fi!=null&&fi<=1)fi*=100;const pe=num(r.peep);
    const pressHigh=PRESSORS.some(([k])=>{const o=d.drips[k];if(!o||!o.on||o.trend==='Stopped')return false;return !(k==='norepi'&&o.unit==='mcg/kg/min'&&num(o.dose)!=null&&num(o.dose)<=0.1)});
    if(fi!=null&&fi<=40&&pe!=null&&pe<=8&&!pressHigh&&!parOn(d)&&!['Passed','Failed'].includes(f.sbt))add('fh','FiO2 40% or less, PEEP 8 or less, and minimal vasopressor support. Consider an SBT today.')}
  const gl=num(f.gluc&&f.gluc.lo),gh=num(f.gluc&&f.gluc.hi);
  if(gl!=null&&gl<70)add('fh',`Glucose as low as ${gl}. Review hypoglycemia treatment and insulin dosing.`);
  if(gh!=null&&gh>180)add('fh',`Glucose up to ${gh}, above the usual 140–180 target.`);
  if(INS[f.insulin]&&f.hypoProto!=='Ordered')add('fh','On insulin without a hypoglycemia protocol documented as ordered.');
  if(f.bmDate){const n=daysBetween(f.bmDate,d.date);if(n>=3)add('fh',`No BM in ${n} days. Review the bowel regimen.`)}
  const q=num(d.img&&d.img.ekg&&d.img.ekg.qtc);if(q!=null&&q>500)add('imaging',`QTc is ${q}. Review QT-prolonging medications, K, and Mg.`);
  (d.abx||[]).forEach(a=>{const n=num(a.days);if(a.drug&&a.start&&n){const dd=daysBetween(a.start,d.date)+1;if(dd>n)add('micro',`${a.drug} is on day ${dd} of a planned ${n}-day course. Stop it or document a new end date.`)}});
  (d.lines||[]).forEach(x=>{if(!x.type)return;const def=LINEDEF[x.type]||LINEDEF.Other;const nm=x.type+(x.site?' '+x.site:'');
    if(!x.ready)add('lines',`${nm}: decide whether it is ready to come out.`);
    else if(x.ready==='Keep'&&def.ind.length&&!(x.why||[]).length)add('lines',`${nm}: document what it is still needed for.`)});
  {const v=d.vitals||{},g=num(v.mapGoal),lo=num(v.map&&v.map.lo);if(g!=null&&lo!=null&&lo<g)add('vitals',`MAP as low as ${lo}, below the goal of ≥${g}.`)}
  {const na=num((d.labs||{}).na),pv=prevLab(p,d,'na');const pn=pv?num(pv.v):null;if(na!=null&&pn!=null&&daysBetween(pv.date,d.date)<=1){
    if(pn>145&&pn-na>12)add('labs',`Na fell ${pn-na} (from ${pn} to ${na}). Correction faster than 10–12 mEq/L per day risks cerebral edema.`);
    if(pn<135&&na-pn>10)add('labs',`Na rose ${na-pn} (from ${pn} to ${na}). Correction above 8–10 mEq/L per day risks osmotic demyelination.`)}}
  dvtFlags(d).forEach(t=>add('fh',t,true));
  return F}
function flagBox(p,d,step){const f=safetyFlags(p,d).filter(x=>x.step===step&&!x.inline);return f.length?`<div class="flags">${f.map(x=>`<p class="flag">${esc(x.text)}</p>`).join('')}</div>`:''}

/* ---------- handoff ---------- */
const sortedActive=()=>S.patients.filter(p=>p.status!=='discharged').sort((a,b)=>String(a.bed).localeCompare(String(b.bed),undefined,{numeric:true}));
const curData=p=>p.draft||(p.days.length?p.days[p.days.length-1].data:null);
function supportText(p,d){if(!d)return '';const bits=[];const r=d.resp||{};
  if(r.type==='Ventilator')bits.push([r.mode||'Ventilator',r.fio2&&'FiO2 '+r.fio2+'%',r.peep&&'PEEP '+r.peep].filter(Boolean).join(', '));
  else if(r.type&&r.type!=='Room air')bits.push(r.type+(r.fio2?', FiO2 '+r.fio2+'%':r.flow?' '+r.flow+' L/min':''));
  const pr=dripList(PRESSORS,d).filter(x=>!/discontinued/.test(x)).map(x=>x.replace(/ \(.*\)$/,''));if(pr.length)bits.push(pr.join(', ')+(d.vitals&&d.vitals.mapGoal?', MAP goal ≥'+d.vitals.mapGoal:''));
  if(rrtOn(d))bits.push(d.renal.mod);if(parOn(d))bits.push('neuromuscular blockade');return bits.join('; ')}
const openTodos=p=>(p.actions||[]).filter(a=>a.kind==='todo'&&!a.done).map(a=>String(a.text).trim().replace(/[.\s]+$/,''));
function handoffText(p){const sup=supportText(p,curData(p)),td=openTodos(p);
  return [`Bed ${p.bed}${p.severity?' — '+p.severity:''}`,[p.oneLiner&&sent(p.oneLiner),p.code&&'Code status: '+p.code+'.'].filter(Boolean).join(' '),sup&&'Support: '+sent(sup),td.length&&'To do: '+td.join('; ')+'.',p.contingency&&'If/then: '+sent(p.contingency)].filter(Boolean).join('\n')}
function handoffView(){const act=sortedActive();
  return `${topbar('Handoff','census',`<button class="btn sm" data-act="copy">Copy all</button>`)}<main class="wrap"><p class="muted">Organized by I-PASS. Illness severity and if/then plans are saved with each patient.</p>
  ${act.length?act.map(p=>{const sup=supportText(p,curData(p)),td=openTodos(p);
    return `<section class="card ho"><div class="cardhd"><h3>Bed ${esc(p.bed)}</h3><button class="linkbtn" data-act="openPt" data-id="${p.id}">Open patient</button></div>
    <div class="fld"><span>Illness severity</span>${seg('P'+p.id+':severity',['Stable','Watcher','Unstable'])}</div>
    <p><strong>Patient summary.</strong> ${esc(p.oneLiner||'No one-liner yet.')}${p.code?' Code status: '+esc(p.code)+'.':''}</p>
    ${sup?`<p><strong>Support.</strong> ${esc(sup)}.</p>`:''}
    <p><strong>Action list.</strong> ${td.length?esc(td.join('; '))+'.':'No open to-dos.'}</p>
    <label class="fld"><span>Situation awareness and contingency</span>${ta('P'+p.id+':contingency','e.g. If MAP below 65 on norepinephrine 0.2, add vasopressin and call the fellow',2)}</label></section>`}).join(''):'<div class="empty"><p class="muted">No active patients.</p></div>'}</main>`}

/* ---------- backup ---------- */
let DL=null;(async()=>{try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads')}catch(e){}})();
async function exportBackup(){const data=JSON.stringify({app:'icu-rounds',version:1,exported:new Date().toISOString(),patients:S.patients});const name='icu-rounds-backup-'+today()+'.json';
  const done=msg=>{S.lastBackup=today();save();render();toast(msg)};
  if(DL){try{await DL.save({filename:name,data});done('Backup saved');return}catch(e){if(e&&e.code==='declined'){toast('Backup not saved');return}}}

  V.showBackupText=data;render()}

function respText(p,d){const r=d.resp||{};let s='';const fi=r.fio2?`FiO2 ${r.fio2}%`:'';const c=calcs(p,d);
  switch(r.type){
    case 'Room air':s='Room air.';break;
    case 'Nasal cannula':s=`Nasal cannula${r.flow?' '+r.flow+' L/min':''}.`;break;
    case 'HFNC':s=`HFNC${[r.flow&&r.flow+' L/min',fi].filter(Boolean).length?' '+[r.flow&&r.flow+' L/min',fi].filter(Boolean).join(', '):''}.`;break;
    case 'NIV':s=r.niv==='CPAP'?`CPAP${r.epap?' '+r.epap:''}${fi?', '+fi:''}.`:`BiPAP${r.ipap||r.epap?` ${r.ipap||'?'}/${r.epap||'?'}`:''}${fi?', '+fi:''}.`;break;
    case 'Ventilator':{const trach=r.airway==='Trach';const dd=r.intDate?daysBetween(r.intDate,d.date)+1:null;
      s=`${trach?'Tracheostomy':'Intubated'}${r.intDate?(trach?' placed ':' ')+fmtDate(r.intDate):''}${dd>0?` (${trach?'trach':'vent'} day ${dd})`:''}${!trach&&r.ett?`, ${r.ett} ETT${r.depth?' at '+r.depth+' cm':''}`:''}.`;
      const m=r.mode,st=[];const rrs=r.rr?`RR ${r.rr}${r.rrTotal?' (total '+r.rrTotal+')':''}`:'';
      if(VOLMODES.includes(m)){if(r.vt)st.push(`VT ${r.vt} mL${c.vtk?' ('+c.vtk+' PBW)':''}`);if(rrs)st.push(rrs);if(m==='SIMV'&&r.ps)st.push('PS '+r.ps)}
      else if(m==='AC/PC'){if(r.pinsp)st.push(`Pinsp ${r.pinsp} above PEEP`);if(r.ti)st.push(`Ti ${r.ti} s`);if(rrs)st.push(rrs)}
      else if(m==='PSV/CPAP'){if(r.ps)st.push('PS '+r.ps)}
      else if(m==='APRV'){if(r.phigh||r.plow)st.push(`P high/low ${r.phigh||'?'}/${r.plow||'?'}`);if(r.thigh||r.tlow)st.push(`T high/low ${r.thigh||'?'}/${r.tlow||'?'} s`)}
      if(m!=='APRV'&&r.peep)st.push('PEEP '+r.peep);if(fi)st.push(fi);
      if(m)s+=` ${m}${st.length?': '+st.join(', '):''}.`;
      const ms=[];if(!VOLMODES.includes(m)&&r.vte)ms.push(`exhaled VT ${r.vte} mL${c.vtk?' ('+c.vtk+' PBW)':''}`);
      if(r.rrTotal&&(m==='PSV/CPAP'||m==='APRV'))ms.push('total RR '+r.rrTotal);
      if(r.ppeak)ms.push('Ppeak '+r.ppeak);if(r.pplat)ms.push('Pplat '+r.pplat);if(c.dp!=null)ms.push('driving pressure '+c.dp);
      if(ms.length)s+=' '+cap(ms.join(', '))+'.';break}}
  if(['Nasal cannula','HFNC','NIV'].includes(r.type)&&r.since)s=s.replace(/\.$/,', '+sinceStr(r.since,d.date)+'.');
  const g=r.abg||{};if(g.ph||g.pco2||g.po2||g.hco3)s+=` ABG ${[g.ph,g.pco2,g.po2,g.hco3].map(x=>x||'—').join('/')}${c.pf?', P/F '+c.pf:''}.`;
  return s.trim()}

function fmtSummary(t){if(!t)return'<p class="muted">Nothing entered yet.</p>';
  return t.split('\n\n').map(par=>isDia(par)?'<pre class="labdia">'+esc(par)+'</pre>':'<p>'+par.split('\n').map(l=>{let e=esc(l);
    if(/^(# |ICU PROGRESS NOTE)/.test(l))return '<strong>'+e+'</strong>';
    e=e.replace(/^(\d+\.\s)(.+?)(\s—|\.(?:\s|$))/,'<strong>$1$2</strong>$3');
    e=e.replace(/^(\s*)([A-Z][A-Za-z0-9\/&;() \-]{0,34}):/,'$1<strong>$2:</strong>');
    return e.replace(/^(\s+)/,m=>'&nbsp;'.repeat(m.length*2))}).join('<br>')+'</p>').join('')}

const isDia=par=>/-{2,}\+-{2,}|>-{3,}</.test(par);
function acidBase(p,d){const L=d.labs||{};const na=num(L.na),cl=num(L.cl),h=num(L.hco3),alb=num(L.alb);if(na==null||cl==null||h==null)return null;
  const ag=na-cl-h;const cag=alb!=null?+(ag+2.5*(4-alb)).toFixed(1):null;const eff=cag??ag;const o={ag,cag,eff,h};
  if(eff>12){if(h<24){o.dd=+((eff-12)/(24-h)).toFixed(1);o.ddi=o.dd<0.4?'suggests a predominantly non–anion gap (hyperchloremic) metabolic acidosis':o.dd<0.8?'suggests a combined anion gap and non–anion gap metabolic acidosis':o.dd<=2?'consistent with a pure anion gap metabolic acidosis':'suggests a concurrent metabolic alkalosis or a preexisting compensated respiratory acidosis'}
    else o.ddi='Anion gap is elevated without a low HCO3, suggesting a concurrent metabolic alkalosis'}

  const pc=num(d.resp&&d.resp.abg&&d.resp.abg.pco2);
