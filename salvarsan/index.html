<title>Salvarsan</title>
<style>
/* Salvarsan: empiric antibiotics by source (region or complaint), adjusted for setting, a four-level beta-lactam allergy, risk factors and weight; coverage check against the likely organisms, pre-antibiotic workup, source control, duration, and a note line. Sources cited per syndrome.
   Base palette matches PANACEA; ehr.css (loaded last) applies the shared EHR look. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--amber:#8A5A00;--amber-soft:#FCF0D6;--ok:#1D6E49;--ok-soft:#E1F2E9;--paper:#FBFCFD;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:1.5rem}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);text-decoration:none}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:38px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;margin-top:10px}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.stepbtn .n{font-size:.7rem;font-weight:700;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .sh{display:none}
.mbar{display:none}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:6px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;flex-direction:column;gap:3px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.3rem}
.ph .cue{margin:0;color:var(--muted);font-size:.9rem}
.sec h3{margin:0 0 8px;font-size:.98rem}
.sec{display:flex;flex-direction:column;gap:8px}
.flab{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:.88rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip small{display:block;font-size:.72rem;opacity:.8;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.in{display:flex;flex-direction:column;gap:3px;min-width:92px;flex:1 1 92px;max-width:150px}
.in>span{font-size:.74rem;font-weight:700;color:var(--muted)}
.in input,.in select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);font-size:16px;width:100%;min-height:38px}
.in input:focus,.in select:focus{outline:2px solid var(--accent);outline-offset:0}
.in.wide{max-width:none;flex:2 1 180px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpi{background:#F4F6F8;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.kpi.bad{background:var(--warn-soft)}.kpi.bad b{color:var(--warn)}
.kpi.mid{background:var(--amber-soft)}.kpi.mid b{color:var(--amber)}
.kpi.good{background:var(--ok-soft)}.kpi.good b{color:var(--ok)}
table.set{width:100%;border-collapse:collapse;font-size:.92rem}
table.set th,table.set td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.set th{width:34%;color:var(--muted);font-weight:700;font-size:.8rem}
table.set td b{font-size:1.02rem}
table.set td small{display:block;color:var(--muted)}
.cite{font-size:.72rem;color:var(--muted);font-style:italic}
.note-box{background:#F4F6F8;border-radius:10px;padding:10px 12px;font-size:.9rem}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tcard{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;text-align:left;cursor:pointer}
.tcard b{display:block}.tcard span{font-size:.8rem;color:var(--muted)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.flow h4{margin:6px 0 0;font-size:.9rem}
.out{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 90px);overflow:auto}
.out h3{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rec{border-radius:10px;padding:9px 11px;border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.rec .h{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.rec .h b{font-size:.95rem}
.rec p{margin:0;font-size:.86rem}
.pri{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.rec.now{border-color:#E5A69F;background:#FFF7F6}.rec.now .pri{background:var(--warn-soft);color:var(--warn)}
.rec.next{border-color:#EBCB86;background:#FFFCF4}.rec.next .pri{background:var(--amber-soft);color:var(--amber)}
.rec.con .pri{background:var(--accent-soft);color:var(--accent)}
.rec.ok{border-color:#A9D6BE;background:#F6FBF8}.rec.ok .pri{background:var(--ok-soft);color:var(--ok)}
.miss{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.miss li{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;cursor:pointer}
.miss .bx{flex:none;width:18px;height:18px;border:1.5px solid #9AA9B8;border-radius:4px;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700}
.miss li.done .bx{background:var(--ok);border-color:var(--ok)}
.miss li.done .tx{color:var(--muted);text-decoration:line-through}
.miss .tx small{display:block;color:var(--muted);font-size:.74rem}
pre.dict{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#F4F6F8;border-radius:10px;padding:10px;margin:0}
.empty{color:var(--muted);font-size:.9rem;background:#F4F6F8;border-radius:10px;padding:10px 12px}
.pfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fine{font-size:.76rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:40}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .out{position:static;max-height:none}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stepbtn{padding:6px}
  .stepbtn .t{font-size:.8rem}
  .stepbtn .lg{display:none}.stepbtn .sh{display:inline}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));gap:10px;align-items:center}
  .mbar .mid{flex:1;font-size:.85rem;font-weight:700;color:var(--muted)}
  .mbar .mid b{color:var(--warn)}
  .wrap{padding-bottom:80px}
  .out{scroll-margin-top:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.steps{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--paper);padding:7px 14px;min-height:36px;cursor:pointer;font-weight:700;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.srch{display:flex;flex-direction:column;gap:3px}
.srch input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:16px;width:100%;min-height:40px}
.tcard small{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.tcard .rg{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chip.chg{border-color:#8FA9D6}
.chip.al[aria-pressed="true"]{background:#8A2B1F;border-color:#8A2B1F}
.rx{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rx li{background:#F4F6F8;border-radius:8px;padding:7px 10px;font-size:.9rem}
.rx li small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px}
.rx.opt li{background:#fff;border:1px dashed var(--line)}
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.cov span{border-radius:6px;padding:4px 8px;font-size:.8rem;font-weight:700}
.cov .y{background:var(--ok-soft);color:var(--ok)}
.cov .n{background:var(--amber-soft);color:var(--amber)}
.also{font-size:.78rem;color:var(--muted);margin:0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:600}
.ambox{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:.84rem;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:600}
.pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--accent-soft);color:var(--accent)}
.oh{display:flex;flex-direction:column;gap:4px}
.oh b{font-size:1.02rem}
.kv{margin:0;font-size:.9rem}
.kv b{color:var(--muted);font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>Salvarsan</h1></div>
      <p>Empiric antibiotics: pick the source by region or complaint, set the allergy, risks and setting, and get the regimen, what it covers, and what to send first.</p>
    </div>
    <button class="btn" id="reset" type="button">New patient</button>
  </header>
  <nav class="steps" aria-label="Steps" id="steps"></nav>
  <div class="grid">
    <section class="pane" id="pane"></section>
    <aside class="out" id="out" aria-label="Regimen"></aside>
  </div>
</div>
<div class="mbar" id="mbar"><span class="mid" id="mbarmid"></span><button class="btn primary" type="button" id="seeRecs">Regimen ↓</button></div>
<script>
/* ---------- State and helpers ---------- */
const STEPS=[['src','Source','Source'],['pt','Patient','Patient'],['rx','Regimen','Regimen']];
const blank=()=>({step:'src',view:'region',q:'',cc:'',syn:'',opt:'',optManual:false,set:'',A:0,r:{},wt:'',done:{}});
let S=blank();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:null};
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const W=()=>num(S.wt);
const r250=n=>Math.round(n/250)*250;
/* weight-based doses: shown for this patient once weight is entered */
function kg(lo,hi,unit,cap,round){const w=W();const lab=hi?`${lo}–${hi} ${unit}/kg`:`${lo} ${unit}/kg`;if(!w)return lab+(cap?` (max ${cap} ${unit})`:'');
  const rd=n=>{n=round?Math.round(n/round)*round:Math.round(n);return cap?Math.min(cap,n):n};const a=rd(lo*w),b=hi?rd(hi*w):null;
  return `${lab} = <b>${b&&b!==a?a+'–'+b:a} ${unit}</b>`}
function vancT(){const w=W();let s='Vancomycin IV, load 20–25 mg/kg';if(w){const a=Math.min(3000,r250(20*w)),b=Math.min(3000,r250(25*w));s+=` = <b>${a===b?a:a+'–'+b} mg</b>`}return s+' (max 3 g), then AUC-guided dosing per pharmacy'}
const L=(t,...d)=>({t,d});
const VANC=why=>L(vancT()+(why?`<small>${why}</small>`:''),'vanc');
const ADDV=why=>L('+ '+vancT()+(why?`<small>${why}</small>`:''),'vanc');
const PTZ='Piperacillin-tazobactam 4.5 g IV q6h (extended infusion after the first dose)';
/* Anti-pseudomonal beta-lactam by allergy and ESBL; an = needs anaerobes */
function apBL(c,an,plus){const p=plus?'+ ':'';
  if(c.A===3)return L(p+'Aztreonam 2 g IV q8h'+(an?' + metronidazole 500 mg IV q8h':'')+'<small>No beta-lactams: aztreonam has no gram-positive activity, so a gram-positive agent is needed alongside.</small>','azt',...(an?['mtz']:[]));

  if(c.A>=1)return an?L(p+'Cefepime 2 g IV q8h + metronidazole 500 mg IV q8h (or meropenem 1 g IV q8h)','cfp','mtz'):L(p+'Cefepime 2 g IV q8h','cfp');

const flex=(c,base,ks=['mrsa','pseudo','esbl'])=>[...new Set(base.concat(ks.filter(k=>c.r[k])))];
const R=o=>Object.assign({rx:[],alt:[],opt:[],adj:[],work:[],ctl:[],dur:'',dispo:'',pearl:[],ref:'',need:[],time:''},o);

/* ---------- What each drug covers (for the coverage check) ---------- */
const COV={
 vanc:['strep','drsp','mssa','mrsa','entero'],
 cro:['strep','hflu','mssa','gnr','gc','past','vibrio','borr','enteric'],
 cfp:['strep','hflu','mssa','gnr','pseudo','aero'],
 ptz:['strep','hflu','mssa','gnr','pseudo','anaer','entero','past','aero'],
 mero:['strep','hflu','mssa','gnr','pseudo','esbl','anaer','listeria','past','aero'],
 erta:['strep','hflu','mssa','gnr','esbl','anaer','past'],
 azt:['hflu','gnr','pseudo','aero'],
 mtz:['anaer','cdiff','trich'],
 azi:['atyp','ct','enteric','borr'],

 levo:['strep','drsp','hflu','mssa','gnr','pseudo','atyp','ct','enteric','aero'],
 moxi:['strep','drsp','hflu','mssa','gnr','atyp','anaer','past'],
 cipro:['hflu','gnr','pseudo','enteric','aero'],
 lzd:['strep','drsp','mssa','mrsa','entero','toxin'],
 clinda:['strep','mssa','anaer','toxin'],
 tmp:['mssa','mrsa','gnr','aero'],
 tmpL:['mssa','mrsa','gnr','listeria'],
 cex:['strep','mssa'],cfz:['strep','mssa'],
 cefur:['strep','hflu','mssa','borr'],
 cefpo:['strep','hflu','gnr'],
 amx:['strep','hflu','entero','listeria','borr'],
 amc:['strep','hflu','mssa','gnr','anaer','entero','past'],
 ams:['strep','hflu','mssa','gnr','anaer','entero','past'],
 amp:['strep','entero','listeria'],
 pcng:['strep','anaer'],
 gent:['gnr','pseudo','gc'],
 nitro:['gnr','entero','esbl'],fos:['gnr','entero','esbl'],
 acv:['hsv'],osel:['flu'],mica:['candida'],fidax:['cdiff'],vancpo:['cdiff']
};
const BUG={strep:'Streptococci',drsp:'Resistant pneumococcus',hflu:'H. influenzae / Neisseria',mssa:'MSSA',mrsa:'MRSA',gnr:'Enteric gram-negatives',pseudo:'Pseudomonas',esbl:'ESBL producers',anaer:'Anaerobes',atyp:'Atypicals',entero:'Enterococcus',listeria:'Listeria',hsv:'HSV',flu:'Influenza',gc:'N. gonorrhoeae',ct:'Chlamydia',rick:'Rickettsia / Ehrlichia',borr:'Borrelia (Lyme)',candida:'Candida',toxin:'Toxin suppression',cdiff:'C. difficile',trich:'Trichomonas',vibrio:'Vibrio',aero:'Aeromonas',past:'Pasteurella / Eikenella',enteric:'Shigella / Campylobacter / Salmonella'};

/* ---------- Patient factors ---------- */
const SETL={out:'Discharge (oral)',ward:'Admit, ward',icu:'ICU / septic shock'};
const ALG=[[0,'No beta-lactam allergy',''],[1,'Penicillin, low-risk','Rash, GI upset, remote or unknown'],[2,'Penicillin anaphylaxis','Hives, angioedema, bronchospasm, hypotension'],[3,'No beta-lactams','SJS/TEN, DRESS, or cephalosporin anaphylaxis']];
const ALGNOTE={1:'Low-risk penicillin history: penicillins avoided; any cephalosporin or carbapenem can be given without testing (AAAAI/ACAAI 2022). Most such labels are wrong; PEN-FAST <3 supports delabeling.',
 2:'Penicillin anaphylaxis: penicillins avoided, and so are cephalosporins sharing amoxicillin’s side chain (cephalexin, cefadroxil, cefaclor). Cefazolin, ceftriaxone, cefepime, cefuroxime, cefpodoxime and carbapenems are fine (<1% cross-reactivity; AAAAI/ACAAI 2022).',
 3:'No beta-lactams: aztreonam is safe unless the reaction was to ceftazidime (shared side chain).'};
const RISK=[['mrsa','MRSA risk','Prior MRSA isolate or colonization, injection drug use, dialysis, recent hospitalization with IV antibiotics, incarceration, contact sports, or purulence.'],
 ['pseudo','Pseudomonas risk','Prior Pseudomonas isolate, structural lung disease (bronchiectasis, CF, FEV1 <30%), neutropenia, recent IV antibiotics, chronic wounds.'],
 ['esbl','ESBL history','Prior ESBL-producing isolate, or recent travel or healthcare in a high-prevalence region.'],
 ['recent','Hospitalized or IV antibiotics in 90 days','Healthcare exposure that shifts the flora toward resistant gram-negatives and MRSA.'],
 ['immuno','Immunocompromised','Transplant, chemotherapy, prednisone ≥20 mg/day for ≥3 weeks or other immunosuppressants, HIV with CD4 <200.'],
 ['idu','Injection drug use',''],['hw','Prosthetic valve, joint, shunt or hardware',''],['old','Age ≥50','Listeria in meningitis; enteric organisms in epididymitis.'],
 ['sti','STI risk','Sexually active with new or multiple partners, or a partner with an STI.'],['asplenia','Asplenia',''],['preg','Pregnant',''],
 ['qt','Prolonged QTc','QTc >470 ms (men) or >480 ms (women), or on other QT-prolonging drugs.'],['renal','CrCl <30 or dialysis','']];

/* ---------- Sources ---------- */
const RG=[['cns','Head, neck & CNS'],['resp','Chest'],['card','Heart & lines'],['abd','Abdomen'],['gu','GU & pelvis'],['skin','Skin & soft tissue'],['bone','Bone & joint'],['sys','Systemic']];
const SY={
/* Head, neck & CNS */
mening:{g:'cns',n:'Bacterial meningitis',sh:'Pneumococcus, meningococcus, H. influenzae, Listeria',kw:'headache neck stiffness fever altered mental status encephalitis',set:['ward','icu'],def:'icu',f:c=>{
  const lis=c.r.old||c.r.immuno||c.r.preg,hc=c.r.recent||c.r.hw,rx=[];

/* ---------- Compute ---------- */
function optDefault(s,r){const d=s.optDef;return typeof d==='function'?d({r}):d||''}
function ctx(syn,over){const s=SY[syn],r=Object.assign({},S.r,over||{});return {set:S.set,A:S.A,r,opt:s&&s.opts&&(!s.optSet||s.optSet.includes(S.set))?(S.optManual?S.opt:optDefault(s,r)):'',w:W()}}
function warns(Rx,c){const ds=new Set(Rx.rx.flatMap(l=>l.d)),w=[],fq=['levo','moxi','cipro'].some(d=>ds.has(d));
  if(c.r.preg){if(ds.has('doxy')&&!Rx.doxyOK)w.push('Pregnancy: doxycycline is avoided except for suspected rickettsial disease.');if(fq)w.push('Pregnancy: fluoroquinolones are generally avoided; use only without a safer option.');if(ds.has('tmp')||ds.has('tmpL'))w.push('Pregnancy: avoid TMP-SMX in the first trimester and near term.');if(ds.has('gent'))w.push('Pregnancy: aminoglycosides carry fetal ototoxicity risk; use when the benefit is clear.');if(ds.has('nitro'))w.push('Pregnancy: avoid nitrofurantoin at term and, when alternatives exist, in the first trimester.')}
  if(c.r.qt){if(fq)w.push('QTc: fluoroquinolones prolong the QT; replete K and Mg and repeat the ECG, or choose another agent.');if(ds.has('azi'))w.push('QTc: azithromycin prolongs the QT; replete K and Mg and repeat the ECG.')}
  if(c.r.renal){w.push('CrCl <30 or dialysis: doses shown are for normal renal function; pharmacy to adjust (cefepime accumulates and causes neurotoxicity).');if(ds.has('nitro'))w.push('Nitrofurantoin: avoid with CrCl <30.');if(ds.has('tmp'))w.push('TMP-SMX: watch for hyperkalemia.')}
  if(ds.has('lzd'))w.push('Linezolid: serotonin toxicity with SSRIs and other serotonergic drugs.');
  return w}
function calc(syn,over){const s=SY[syn];if(!s)return null;const c=ctx(syn,over);const Rx=s.f(c);Rx.warn=warns(Rx,c);Rx.c=c;
  const cov=new Set(Rx.rx.flatMap(l=>l.d.flatMap(d=>COV[d]||[])));Rx.cov=cov;Rx.gaps=Rx.need.filter(k=>!cov.has(k));Rx.extra=BROAD.filter(k=>cov.has(k)&&!Rx.need.includes(k));return Rx}
const sig=x=>JSON.stringify([x.rx,x.opt,x.adj,x.need,x.warn,x.time,x.alt,x.dur,x.dispo,x.pearl,x.ctl]);

/* ---------- Render ---------- */
const ph=(n,t,cue)=>`<div class="ph"><span class="eb">${n}</span><h2>${t}</h2><p class="cue">${cue}</p></div>`;
const foot=(prev,next)=>`<div class="pfoot">${prev?`<button class="btn" data-step="${prev[0]}" type="button">← ${prev[1]}</button>`:'<span></span>'}${next?`<button class="btn primary" data-step="${next[0]}" type="button">${next[1]} →</button>`:'<span></span>'}</div>`;
const setLab=(s,k)=>(s.setL&&s.setL[k])||SETL[k];
const rgLab=g=>(RG.find(x=>x[0]===g)||[])[1]||'';
function renderSteps(){const n={src:S.syn?1:0,pt:Object.keys(S.r).filter(k=>S.r[k]).length+(S.A?1:0),rx:0};
  $('steps').innerHTML=STEPS.map(([k,t,sh],i)=>`<button type="button" class="stepbtn" data-step="${k}" ${S.step===k?'aria-current="step"':''}><span class="n">${i+1}${n[k]?` · ${n[k]}`:''}</span><span class="t"><span class="lg">${t}</span><span class="sh">${sh}</span></span></button>`).join('')}
const tcard=(k,showRg)=>{const s=SY[k];return `<button type="button" class="tcard" data-syn="${k}" aria-pressed="${S.syn===k}">${showRg?`<span class="rg">${esc(rgLab(s.g))}</span>`:''}<b>${esc(s.n)}</b><span>${esc(s.sh)}</span></button>`};
function matches(){const w=S.q.toLowerCase().split(/\s+/).filter(Boolean);return Object.keys(SY).filter(k=>{const s=SY[k],h=(s.n+' '+s.sh+' '+s.kw+' '+rgLab(s.g)).toLowerCase();return w.every(x=>h.includes(x))})}
function paneSrc(){let h=ph(1,'Source','Pick the presumed source by body region, or start from the complaint. Search covers names, organisms and common terms.')+
  `<div class="sec"><div class="seg" role="group" aria-label="Browse by"><button type="button" data-view="region" class="${S.view==='region'?'on':''}">By region</button><button type="button" data-view="cc" class="${S.view==='cc'?'on':''}">By complaint</button></div>
  <label class="srch"><span class="flab">Search</span><input id="q" type="search" value="${esc(S.q)}" placeholder="e.g. cellulitis, dysuria, tick, ESBL" autocomplete="off"></label></div>`;
  if(S.q.trim()){const m=matches();h+=`<div class="sec"><h3>${m.length} match${m.length===1?'':'es'}</h3>${m.length?`<div class="tcards">${m.map(k=>tcard(k,true)).join('')}</div>`:'<p class="empty">Nothing matches. Try a body region or organism.</p>'}</div>`}
  else if(S.view==='region')h+=RG.map(([g,l])=>`<div class="sec"><h3>${l}</h3><div class="tcards">${Object.keys(SY).filter(k=>SY[k].g===g).map(k=>tcard(k)).join('')}</div></div>`).join('');
  else{h+=`<div class="sec"><h3>Complaint</h3><div class="chips">${CC.map(([l],i)=>`<button type="button" class="chip" data-cc="${i}" aria-pressed="${S.cc===String(i)}">${esc(l)}</button>`).join('')}</div></div>`;
    if(S.cc!=='')h+=`<div class="sec"><h3>Likely sources</h3><div class="tcards">${CC[+S.cc][1].map(k=>tcard(k,true)).join('')}</div></div>`}
  return h+foot(null,S.syn?['pt','Patient']:null)}
function panePt(){const s=SY[S.syn];if(!s)return ph(2,'Patient','Pick a source first.')+`<p class="empty">Choose the presumed source on step 1.</p>`+foot(['src','Source'],null);
  const base=calc(S.syn),chg=[],oth=[];
  RISK.forEach(([k,l,t])=>{const alt=calc(S.syn,{[k]:!S.r[k]});(sig(alt)!==sig(base)?chg:oth).push(`<button type="button" class="chip${sig(alt)!==sig(base)?' chg':''}" data-risk="${k}" aria-pressed="${!!S.r[k]}"${t?` title="${esc(t)}"`:''}>${esc(l)}</button>`)});

  ${oth.length?`<div class="sec"><h3>Other risks</h3><div class="chips">${oth.join('')}</div></div>`:''}
  <div class="sec"><div class="row"><label class="in"><span>Weight (kg)</span><input inputmode="decimal" data-k="wt" value="${esc(S.wt)}" placeholder="kg"></label></div></div>`+foot(['src','Source'],['rx','Regimen'])}
const lis=a=>a.length?`<ul class="list">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
const rxl=(a,cls)=>a.length?`<ul class="rx${cls?' '+cls:''}">${a.map(l=>`<li>${typeof l==='string'?l:l.t}</li>`).join('')}</ul>`:'';

  (x.time?`<div class="${S.set==='icu'?'warnbox':'ambox'}">${esc(x.time)}</div>`:'')+
  blk('First line',rxl(x.rx))+blk('Alternatives',lis(x.alt))+blk('Consider adding',rxl(x.opt,'opt'))+blk('Alongside the antibiotics',lis(x.adj))+
  blk('Before the first dose',lis(x.work))+blk('Source control',lis(x.ctl))+(x.dur?blk('Duration',`<p class="kv">${x.dur}</p>`):'')+(x.dispo?blk('Disposition',`<p class="kv">${x.dispo}</p>`):'')+
  blk('Pearls',lis(x.pearl))+(x.ref?`<p class="cite">${esc(x.ref)}</p>`:'')+foot(['pt','Patient'],null)}
function noteText(x){const s=SY[S.syn],o=x.c.opt&&s.opts?s.opts.find(q=>q[0]===x.c.opt)[1].toLowerCase():'';
  let t=`Empiric antibiotics for presumed ${s.n.charAt(0).toLowerCase()+s.n.slice(1)}${o?` (${o})`:''}; ${setLab(s,S.set).toLowerCase()}.\n`;
  t+=x.rx.map(l=>'- '+strip(l.t.replace(/<small>.*?<\/small>/g,''))).join('\n')+'\n';
  const cov=x.need.filter(k=>x.cov.has(k)).map(k=>BUG[k]);if(cov.length)t+=`Covers: ${cov.join(', ')}.\n`;
  const dn=x.work.filter((w,i)=>S.done[i]).map(strip);if(dn.length)t+=`Obtained before antibiotics: ${dn.join('; ')}.\n`;
  if(S.A)t+=`Allergy: ${ALG[S.A][1].toLowerCase()}; regimen chosen accordingly.\n`;
  if(x.dur)t+=`Planned duration: ${strip(x.dur)}.${S.set==='out'?'':' Reassess with cultures at 48–72 h and narrow.'}`;return t.trim()}
function renderOut(){const s=SY[S.syn];
  if(!s){$('out').innerHTML=`<h3>Regimen</h3><p class="empty">Pick a source to see the empiric regimen, what it covers, and what to send first.</p><p class="fine">Adult doses, normal renal function. Use your local antibiogram and the patient’s prior cultures.</p>`;$('mbarmid').textContent='Pick a source';return}
  const x=calc(S.syn);let h=`<div class="oh"><span class="pill">${esc(setLab(s,S.set))}</span><b>${esc(s.n)}</b></div>`;
  if(x.time)h+=`<div class="${S.set==='icu'?'warnbox':'ambox'}">${esc(x.time)}</div>`;
  h+=`<h3>Empiric regimen</h3>${rxl(x.rx)}`;
  x.warn.forEach(w=>h+=`<div class="ambox">${esc(w)}</div>`);
  if(S.A)h+=`<p class="fine">${esc(ALGNOTE[S.A])}</p>`;
  h+=`<h3>Coverage</h3><div class="cov">${x.need.map(k=>`<span class="${x.cov.has(k)?'y':'n'}">${x.cov.has(k)?'✓':'Gap:'} ${esc(BUG[k])}</span>`).join('')}</div>`;
  if(x.gaps.length)h+=`<p class="also">Gaps are expected when a guideline accepts them (e.g. amoxicillin for healthy outpatients with CAP); otherwise, check the alternatives.</p>`;
  if(x.extra.length)h+=`<p class="also">Broader than this source needs: ${x.extra.map(k=>esc(BUG[k])).join(', ')}. Narrow with cultures.</p>`;
  if(x.work.length)h+=`<h3>Before the first dose</h3><ul class="miss">${x.work.map((w,i)=>`<li data-done="${i}" class="${S.done[i]?'done':''}"><span class="bx">${S.done[i]?'✓':''}</span><span class="tx">${w}</span></li>`).join('')}</ul>`;
  h+=`<h3>Note</h3><pre class="dict">${esc(noteText(x))}</pre><button class="btn primary" id="copy" type="button">Copy note</button>`;
  h+=`<p class="fine">Adult doses, normal renal function. Empiric starting points from the cited guidelines: use your local antibiogram and prior cultures, and narrow at 48–72 h.</p>`;
  $('out').innerHTML=h;$('mbarmid').innerHTML=`<b style="color:var(--ink)">${esc(s.n)}</b>`}
function renderPane(){$('pane').innerHTML={src:paneSrc,pt:panePt,rx:paneRx}[S.step]()}
function render(keep){const y=window.scrollY;renderSteps();renderPane();renderOut();if(keep)window.scrollTo(0,y)}

/* ---------- Events ---------- */
function pick(k){const s=SY[k];S.syn=k;if(!s.set.includes(S.set))S.set=s.def;S.optManual=false;S.opt=optDefault(s,S.r);S.done={};S.step='pt';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');if(st){S.step=st.dataset.step;render();window.scrollTo(0,0);return}
  const vw=e.target.closest('[data-view]');if(vw){S.view=vw.dataset.view;render(true);return}
  const cc=e.target.closest('[data-cc]');if(cc){S.cc=S.cc===cc.dataset.cc?'':cc.dataset.cc;render(true);return}
  const sy=e.target.closest('[data-syn]');if(sy){pick(sy.dataset.syn);return}
  const se=e.target.closest('[data-set]');if(se){S.set=se.dataset.set;S.done={};render(true);return}
  const op=e.target.closest('[data-opt]');if(op){S.opt=op.dataset.opt;S.optManual=true;S.done={};render(true);return}
  const al=e.target.closest('[data-al]');if(al){S.A=+al.dataset.al;render(true);return}
  const rk=e.target.closest('[data-risk]');if(rk){const k=rk.dataset.risk;S.r[k]=!S.r[k];render(true);return}
  const dn=e.target.closest('[data-done]');if(dn){S.done[dn.dataset.done]=!S.done[dn.dataset.done];renderOut();return}
  if(e.target.closest('#copy')){copy(noteText(calc(S.syn)));return}
  if(e.target.closest('#seeRecs')){$('out').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(e.target.closest('#reset')){const b=$('reset');if(b.dataset.armed){S=blank();render();window.scrollTo(0,0)}else{b.dataset.armed='1';b.textContent='Tap again to clear';setTimeout(()=>{delete b.dataset.armed;b.textContent='New patient'},2500)}return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;renderPane();const n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}return}
  if(t.dataset.k==='wt'){S.wt=t.value;renderOut()}});
async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  const el=document.createElement('div');el.className='toast';el.textContent=ok?'Note copied.':'Couldn’t copy on this device.';document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
render();
</script>
