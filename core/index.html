<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Core">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Core: a daily emergency medicine curriculum through Tintinalli's, 9th ed. Palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;--paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover,.homebtn:active{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hdlink{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;padding:8px 2px}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.syncdot.ok{background:var(--ok)}.syncdot.syncing{background:var(--accent)}.syncdot.error{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;font-weight:700;padding:6px 2px;cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress */
.prog{display:flex;align-items:center;gap:14px}
.ring{flex:none;width:58px;height:58px}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s}
.ring text{font:700 13px "Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
.prog .txt{flex:1;min-width:0}
.prog .big{font-weight:700;font-size:1.05rem}
.prog .sm{color:var(--muted);font-size:.88rem}
.status{display:flex;gap:12px;align-items:flex-start}
.status .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.status .ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.status h2{margin:2px 0 2px;font-size:1.1rem}
.status p{margin:0;color:var(--muted);font-size:.92rem}
.next{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.next .eb{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.next .nt{font-weight:700;margin-top:2px}

/* lesson */
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:18px 0 4px}
h2.lt{font-size:1.6rem;line-height:1.2;margin:0 0 12px;letter-spacing:-.015em;text-wrap:balance}
.reads{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.reads li{display:flex;gap:10px;align-items:baseline;font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.reads .bk{flex:none;font-weight:700;color:var(--accent);min-width:7.6em}
.reads .ch{color:var(--ink)}
.bl{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:1.02rem;line-height:1.55}
.bl b{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
section.sec h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
section.sec h3 svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
section.sec ul{margin:0;padding-left:18px}
section.sec li{margin:6px 0;line-height:1.45}
.ev li{list-style:none;margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.ev ul{padding-left:0}
.ev li:last-child{border-bottom:0;padding-bottom:2px}
.ev li:first-child{padding-top:2px}
.ev .tn{display:block;font-weight:700;font-size:.92rem}
.ev .tf{display:block;color:var(--ink);font-size:.95rem}
.qz .qq{font-weight:700;margin:0 0 8px}
.qz .qa{display:none;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:8px}
.qz.open .qa{display:block}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:80px;resize:vertical;line-height:1.45;display:block}
.complete{margin:18px 0 8px}
.donemsg{text-align:center;color:var(--ok);font-weight:700;margin:8px 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.pager button{flex:1;text-align:left;font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);min-height:56px;min-width:0}
.pager button:last-child{text-align:right}
.pager button[disabled]{visibility:hidden}
.pager small{display:block;color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pager span{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* curriculum list */
.search{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);color:var(--ink);margin:4px 0 12px}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.unit>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:56px}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary .un{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
details.unit>summary .nm{flex:1;font-weight:700;min-width:0}
details.unit>summary .ct{font-size:.85rem;color:var(--muted);font-weight:700}
details.unit>summary .ct.all{color:var(--ok)}
details.unit>summary .chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none}
details.unit[open]>summary .chev{transform:rotate(90deg)}
details.unit[open]>summary{border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;min-height:52px}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--paper)}
.lrow .dn{flex:none;width:44px;font-size:.78rem;font-weight:700;color:var(--muted)}
.lrow .lt2{flex:1;min-width:0;font-size:.97rem}
.lrow .lt2 small{display:block;color:var(--muted);font-size:.78rem}
.lrow .bx{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center}
.lrow.d .bx{background:var(--ok);border-color:var(--ok)}
.lrow .bx svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.lrow.d .bx svg{opacity:1}
.lrow.today{background:var(--accent-soft)}
.lrow.today .dn{color:var(--accent)}
.foot{color:var(--muted);font-size:.8rem;margin-top:24px;line-height:1.5}
.foot ul{padding-left:18px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.rdh{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.reads li{align-items:center}
.reads button.rck{all:unset;flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;box-sizing:border-box}
.reads button.rck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reads button.rck svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.reads li.rd button.rck{background:var(--ok);border-color:var(--ok)}
.reads li.rd button.rck svg{opacity:1}
.reads li.rd .ch,.reads li.rd .bk{opacity:.55}
.reads .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.reads .tx .bk{min-width:0;font-size:.78rem;letter-spacing:.02em}
.reads li.rd .ch{text-decoration:line-through}
.reads button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;width:100%;cursor:pointer}
.reads li.lk{border-color:var(--accent)}
.reads li.lk:hover{background:var(--accent-soft)}
.reads .op{flex:none;margin-left:auto;font-size:.78rem;font-weight:700;color:var(--accent);white-space:nowrap}
.reads li.nl .op{color:var(--muted)}
.bkrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bkrow:last-child{border-bottom:0}
.bkrow .tx{flex:1;min-width:0}
.bkrow .nm{font-weight:700}
.bkrow .st{font-size:.85rem;color:var(--muted)}
.bkrow .st.ok{color:var(--ok)}.bkrow .st.bad{color:var(--warn)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.reader{display:flex;flex-direction:column;gap:10px;align-items:center}
.pg{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;position:relative;display:block}
.pg canvas{width:100%;height:100%;display:block;border-radius:6px}
.pg .pn{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.pgchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:700;padding:6px 12px;border-radius:999px;z-index:15}
.loading{color:var(--muted);text-align:center;padding:40px 0}
/* Core additions */
.reads .op{min-width:3.6em;text-align:right}
.cal{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cal .tx{flex:1;min-width:12em}
.cal .btn{min-height:36px;padding:6px 12px}
.pg.miss{display:grid;place-items:center;color:var(--muted);font-size:.9rem;background:var(--paper)}
</style>
</head>

/* ---------- Unit 1: Resuscitation & shock ---------- */
{id:"arrest1",u:1,t:"Sudden cardiac death, CPR and defibrillation",r:["11","22","23"],
 bl:"Survival from cardiac arrest depends on minutes: early recognition, high-quality compressions with minimal pauses, and early defibrillation of VF/pulseless VT. Everything else in the code is secondary to those three.",
 wk:["Confirm pulselessness in under 10 seconds; check rhythm on pads, not the monitor leads, if in doubt","Bedside ultrasound during pulse checks only (keep the pause under 10 s) for tamponade, massive PE signs, or cardiac standstill","Point-of-care K⁺, glucose and gas once access is in"],
 tx:["Compressions 100–120/min, depth 5–6 cm, full recoil, swap compressors every 2 minutes","Defibrillate VF/pVT immediately: biphasic 120–200 J (device-specific), then resume CPR without a rhythm check","Synchronized cardioversion for unstable tachycardia with a pulse; unsynchronized for VF, pulseless VT and polymorphic VT"],
 dz:["Any ROSC goes to an ICU or cath lab pathway; out-of-hospital arrest with ST elevation goes to the cath lab"],
 ev:[["Hands-only bystander CPR","Dispatcher-assisted compression-only CPR has outcomes similar to standard CPR for adult out-of-hospital arrest and is easier to teach."],["DOSE-VF (NEJM 2022)","For refractory VF, double sequential and vector-change defibrillation both improved survival to discharge over standard pad position."]],
 pr:["Etco₂ under 10 mmHg after 20 minutes of good CPR predicts death; a sudden rise above 35–40 mmHg suggests ROSC.","Most adult sudden cardiac death is from coronary disease; in the young think HCM, channelopathies, myocarditis, commotio cordis and drugs."],
 q:["After a shock for VF, what comes next?","Immediately resume compressions for 2 minutes before checking rhythm or pulse."]},

{id:"arrest2",u:1,t:"Cardiac resuscitation: ACLS in practice",r:["24"],
 bl:"ACLS is a framework, not a script. Run shockable and non-shockable arms, give epinephrine on time, and hunt the reversible causes (the Hs and Ts) out loud with the team.",
 wk:["Hs: hypovolemia, hypoxia, hydrogen ion, hypo/hyperkalemia, hypothermia","Ts: tension pneumothorax, tamponade, toxins, thrombosis (coronary or pulmonary)","Ultrasound to separate true PEA from pseudo-PEA (organized activity without a palpable pulse)"],
 tx:["Epinephrine 1 mg IV/IO every 3–5 min; give early in non-shockable rhythms","Amiodarone 300 mg then 150 mg, or lidocaine 1–1.5 mg/kg, for shock-refractory VF/pVT","Advanced airway when it doesn’t interrupt compressions; ventilate 1 breath every 6 s and avoid hyperventilation","Targeted treatment: calcium and bicarbonate for hyperkalemia, needle or finger thoracostomy, pericardiocentesis, lytics for suspected massive PE"],
 dz:["Termination of resuscitation: consider after prolonged asystole with no reversible cause, using Etco₂ and ultrasound as supporting data"],
 ev:[["PARAMEDIC2 (NEJM 2018)","Epinephrine improved 30-day survival but not survival with good neurologic outcome."],["ALPS (NEJM 2016)","Neither amiodarone nor lidocaine improved survival to discharge over placebo overall; both trended better in witnessed arrests."]],
 pr:["Assign a timer and a recorder; most code errors are timing errors.","Calcium is not routine in arrest; give it for hyperkalemia, calcium channel blocker overdose or hypocalcemia."],
 q:["Why give epinephrine early in asystole but after the second shock in VF?","In non-shockable rhythms there is no electrical therapy, and earlier vasopressor improves ROSC; in VF, early defibrillation is the priority."]},

{id:"arrest3",u:1,t:"Arrest in pregnancy, post-arrest care and ethics",r:["25","26","27"],
 bl:"In pregnancy, displace the uterus left and plan resuscitative hysterotomy at 4 minutes if no ROSC. After any ROSC, the job becomes preventing the second hit: hypotension, hypoxia, hyperoxia, fever and seizures.",
 wk:["Post-ROSC: 12-lead EKG, chest film, gas, lactate, electrolytes, glucose, troponin","CT head (and often chest) when the cause is unclear","Continuous EEG if comatose, when available"],
 tx:["Pregnancy: manual left uterine displacement, standard ACLS drugs and doses, IV access above the diaphragm, delivery by 5 minutes if fundus is at or above the umbilicus","Post-ROSC targets: MAP at least 65, SpO₂ 92–98%, normocapnia, glucose 140–180","Temperature control: actively prevent fever (above 37.5°C) for at least 72 hours"],
 dz:["Neuroprognostication waits at least 72 hours after normothermia; don’t make it in the ED"],
 ev:[["TTM2 (NEJM 2021)","Hypothermia at 33°C did not improve survival or function versus normothermia with fever prevention."],["COACT (NEJM 2019)","Immediate angiography didn’t improve 90-day survival in arrest survivors without ST elevation."]],
 pr:["Resuscitative hysterotomy is for the mother first; it improves maternal venous return.","Family presence during resuscitation is reasonable and doesn’t worsen team performance; assign someone to support them."],
 q:["When should resuscitative hysterotomy begin in a pregnant patient in arrest?","By about 4 minutes of arrest without ROSC, aiming for delivery by 5 minutes, when the uterus reaches the umbilicus (about 20 weeks or more)."]},

{id:"shock1",u:1,t:"Nontraumatic shock and anaphylaxis",r:["12","14"],
 bl:"Shock is inadequate tissue perfusion. Sort it fast into hypovolemic, distributive, cardiogenic and obstructive using exam and bedside ultrasound, and treat while you sort. Anaphylaxis is distributive shock where epinephrine IM is the first and most important drug.",
 wk:["Lactate, CBC, BMP, LFTs, troponin, cultures if infection possible, type and screen","RUSH-style ultrasound: pump (EF, tamponade, RV size), tank (IVC, free fluid, lung), pipes (aorta, DVT)","Anaphylaxis is clinical; tryptase may help confirm later but shouldn’t delay treatment"],
 tx:["Fluid in 500–1000 mL boluses with reassessment; norepinephrine early for distributive shock","Anaphylaxis: epinephrine 0.3–0.5 mg IM in the thigh (0.01 mg/kg in children), repeat every 5–15 min; epinephrine infusion for refractory shock","Adjuncts in anaphylaxis: fluids, H1/H2 blockers, steroids; glucagon 1–5 mg IV for patients on β-blockers"],
 dz:["Anaphylaxis: observe after symptoms resolve (roughly 4–6 hours, longer if severe or needing more than one dose); discharge with two epinephrine autoinjectors and an action plan"],
 ev:[["Shock index","HR/SBP above about 1.0 flags occult shock even with a normal blood pressure."],["Biphasic anaphylaxis","Occurs in about 5% of cases; risk rises with severe initial reactions and with more than one epinephrine dose."]],
 pr:["Antihistamines and steroids don’t treat airway swelling or hypotension; epinephrine does.","ACE-inhibitor angioedema is bradykinin-mediated; epinephrine and antihistamines often fail, and the airway is the priority."],
 q:["A patient on metoprolol has anaphylaxis refractory to two doses of epinephrine. What drug helps?","Glucagon IV (1–5 mg over 5 minutes, then infusion), which raises cAMP independent of β-receptors."]},

{id:"pressor",u:1,t:"Vasopressors, inotropes and antiarrhythmics",r:["19","20"],
 bl:"Pick the drug for the physiology: norepinephrine for vasodilatory shock, epinephrine when you also need inotropy or have anaphylaxis, dobutamine or milrinone for low output, phenylephrine for pure vasodilation with tachycardia. Antiarrhythmics are chosen by mechanism and by the heart they’re going into.",
 tx:["Norepinephrine start 0.05–0.1 mcg/kg/min (about 5–10 mcg/min), titrate to MAP 65","Vasopressin 0.03 units/min as a catecholamine-sparing second agent in septic shock","Push-dose phenylephrine (50–200 mcg) or epinephrine (10–20 mcg) for transient hypotension (peri-intubation)","Antihypertensive infusions: nicardipine or clevidipine for titratable BP control; esmolol when rate control is needed"],
 key:["Peripheral norepinephrine through a good, proximal IV is reasonably safe for short periods with site checks.","Amiodarone causes hypotension and bradycardia; procainamide widens QRS and QT and is avoided in heart failure.","Adenosine is contraindicated in pre-excited AF; diltiazem worsens decompensated HFrEF."],
 ev:[["SOAP II (NEJM 2010)","Dopamine caused more arrhythmias than norepinephrine and higher mortality in cardiogenic shock."],["VASST (NEJM 2008)","Adding low-dose vasopressin to norepinephrine didn’t reduce mortality overall."]],
 pr:["Extravasation of a vasopressor: stop infusion, aspirate, inject phentolamine locally.","Treat hypotension before intubation if you can; induction drugs and positive pressure unmask it."],
 q:["Which vasopressor is first-line in septic shock?","Norepinephrine."]},

/* ---------- Unit 2: Airway & critical procedures ---------- */
{id:"air1",u:2,t:"Oxygenation, noninvasive airway and gas monitoring",r:["16","28"],
 bl:"Most airways are managed without a tube: positioning, oxygen, bag-mask ventilation with good technique, noninvasive ventilation, and supraglottic devices. Capnography is the vital sign of ventilation and the gold standard for tube placement.",
 wk:["Pulse oximetry lags and fails with poor perfusion, CO poisoning and methemoglobinemia","Venous gas pH and Pco₂ trend reliably; arterial is needed for Po₂","Waveform capnography: confirms tube placement, tracks CPR quality and detects hypoventilation during sedation"],
 tx:["Bag-mask: two-person, two-hand thenar grip, oral and nasal airways, PEEP valve","High-flow nasal cannula up to 60 L/min for hypoxemic failure; BiPAP for COPD exacerbation and cardiogenic pulmonary edema","Supraglottic airway (LMA, i-gel, King) as rescue when BVM fails and intubation is delayed or impossible"],
 dz:["NIV failure signs within 1–2 hours (worsening gas, mental status, fatigue) mean intubation"],
 ev:[["NIV in COPD","Reduces intubation and mortality in hypercapnic COPD exacerbation; one of the strongest evidence bases in acute care."],["Capnography","Absence of exhaled CO₂ after intubation means esophageal placement until proven otherwise (or no pulmonary blood flow)."]],
 pr:["Ear-to-sternal-notch positioning and head-up 20–30° improve both mask ventilation and laryngoscopy.","SpO₂ under 90% sits on the steep part of the curve: small drops in Po₂ mean big drops in saturation."],
 q:["What is the most reliable confirmation of endotracheal tube placement?","Sustained waveform capnography (a consistent CO₂ waveform over several breaths)."]},

{id:"air2",u:2,t:"Tracheal intubation",r:["29A"],
 bl:"Rapid sequence intubation is a procedure of preparation: preoxygenate, resuscitate the physiology, plan the backup, then give induction and paralytic together. First-pass success without desaturation is the goal.",
 wk:["Predict difficulty: LEMON for laryngoscopy, MOANS for BVM, RODS for supraglottic, SMART for cric","Identify the physiologically difficult airway: hypotension, hypoxemia, severe acidosis, RV failure"],
 tx:["Preoxygenate 3–5 min with NRB plus nasal cannula at 15 L/min (apneic oxygenation), or NIV if shunting","Induction: etomidate 0.3 mg/kg or ketamine 1–2 mg/kg (lower doses in shock)","Paralysis: rocuronium 1.2–1.6 mg/kg or succinylcholine 1.5 mg/kg (avoid sux with hyperkalemia risk, burns or crush after 24–72 h, neuromuscular disease)","Video laryngoscopy and a bougie by default; post-intubation sedation and analgesia immediately"],
 dz:["Post-intubation: confirm with capnography, chest film for depth, start sedation, set lung-protective ventilation"],
 ev:[["DEVICE (NEJM 2023)","Video laryngoscopy improved first-attempt success over direct laryngoscopy in critically ill adults."],["BOUGIE (JAMA 2021)","Routine bougie on the first attempt did not improve first-pass success in critically ill adults, in contrast to earlier ED data."]],
 pr:["Hypotension after intubation is common; have a pressor drawn up before you push drugs.","Severe metabolic acidosis: match the patient’s minute ventilation on the vent or they can arrest from worsening acidemia."],
 q:["Name three contraindications to succinylcholine.","Known or suspected hyperkalemia, history of malignant hyperthermia, and denervation or crush/burn injury beyond 24–72 hours (also some neuromuscular diseases)."]},

{id:"air3",u:2,t:"Ventilator, surgical airway and airway-device complications",r:["29B","30","247"],
 bl:"Initial vent settings protect the lungs: tidal volume 6–8 mL/kg ideal body weight, PEEP 5 or more, and plateau under 30. When you can’t intubate and can’t oxygenate, the answer is a cricothyrotomy, not more attempts.",
 tx:["Volume assist-control, Vt 6–8 mL/kg IBW, rate 14–18 (higher in acidosis), FiO₂ to SpO₂ 92–96%, PEEP 5–10","Obstructive disease (asthma/COPD): low rate, short inspiratory time, accept hypercapnia, watch for auto-PEEP","Scalpel–bougie–tube cric: horizontal stab through the cricothyroid membrane, bougie, 6.0 cuffed tube","Tracheostomy bleeding: hyperinflate the cuff; consider tracheoinnominate fistula if brisk"],
 wk:["DOPE for the crashing ventilated patient: dislodgement, obstruction, pneumothorax, equipment (and stacked breaths)"],
 dz:["Displaced fresh tracheostomy (under 7–10 days): oral intubation is safer than blind reinsertion"],
 ev:[["ARDSNet (NEJM 2000)","6 mL/kg versus 12 mL/kg tidal volume reduced mortality in ARDS."]],
 pr:["Disconnect the vent and bag the patient when pressures spike; if the problem resolves, it was the vent or auto-PEEP.","Laryngeal handshake to find the membrane before you need it."],
 q:["A ventilated asthmatic becomes hypotensive. What’s the first bedside move?","Disconnect from the ventilator to let trapped air out (auto-PEEP), then look for pneumothorax."]},

{id:"proc1",u:2,t:"Vascular access and hemodynamic monitoring",r:["31","32"],
 bl:"Flow depends on catheter radius and length: two large short peripheral IVs beat a triple-lumen for volume. Intraosseous access is fast and reliable in arrest; ultrasound guidance is standard for central and difficult lines.",
 tx:["IO sites: proximal humerus (higher flows), proximal tibia, distal tibia","Central line preference in the ED: internal jugular under ultrasound; subclavian has the lowest infection rate; femoral is fastest during CPR","Arterial line for titrating pressors or frequent gases"],
 wk:["Confirm venous placement before dilation (ultrasound of wire in vessel, manometry, or gas)","Post-line chest film for IJ/subclavian: pneumothorax and tip position"],
 ev:[["3SITES (NEJM 2015)","Subclavian had the fewest bloodstream infections and DVTs but the most pneumothoraces."]],
 pr:["Never let go of the wire.","Passive leg raise with a change in stroke volume or pulse pressure predicts fluid responsiveness better than a CVP number."],
 q:["Which site gives the lowest catheter-related bloodstream infection rate?","Subclavian."]},

{id:"proc2",u:2,t:"Pacing, implanted devices and pericardiocentesis",r:["33","34"],
 bl:"Transcutaneous pacing buys time for unstable bradycardia; transvenous pacing is the bridge. Tamponade is a clinical and ultrasound diagnosis, and pericardiocentesis under ultrasound is lifesaving when the patient is crashing.",
 tx:["Transcutaneous: pads anterior-posterior, rate 60–80, raise current until capture, then about 10 mA above threshold; sedate","Confirm mechanical capture with a femoral pulse or ultrasound, not the monitor","Pericardiocentesis: ultrasound-guided, often parasternal or apical; subxiphoid is the blind approach"],
 wk:["Device interrogation for any ICD shock or suspected malfunction","Tamponade on echo: effusion with RA systolic collapse, RV diastolic collapse, plethoric IVC"],
 dz:["Single ICD shock with full recovery may go home after interrogation; multiple shocks (electrical storm) need admission"],
 pr:["Magnet on an ICD stops shocks but not pacing; magnet on a pacemaker forces asynchronous pacing.","Traumatic tamponade needs thoracotomy or the OR; pericardiocentesis is a temporizing step."],
 q:["How do you confirm mechanical capture during transcutaneous pacing?","A palpable femoral pulse (or ultrasound showing ventricular contraction) at the paced rate."]},

/* ---------- Unit 3: Fluids, electrolytes & acid–base ---------- */
{id:"lytes1",u:3,t:"Acid–base, water and sodium",r:["15","17@126-132"],
 bl:"Read a gas in order: pH, primary process, compensation, anion gap, delta. Sodium disorders are water disorders; the speed of correction kills more than the number.",
 wk:["Anion gap = Na − (Cl + HCO₃); correct for albumin (add about 2.5 per 1 g/dL below 4)","Winters’ formula for expected Pco₂ in metabolic acidosis: 1.5 × HCO₃ + 8 ± 2","Hyponatremia workup: serum osmolality, volume status, urine Na and osm, glucose (correct Na for hyperglycemia)"],
 tx:["Severe symptomatic hyponatremia (seizure, coma): 3% saline 100–150 mL bolus over 10 min, repeat up to 3 times","Limit correction to 8–10 mEq/L in 24 hours (6–8 in high-risk patients) to avoid osmotic demyelination","Hypernatremia: replace free water slowly, about 10–12 mEq/L per day in chronic cases"],
 ev:[["GOLDMARK for high-gap acidosis","Glycols, oxoproline, L-lactate, D-lactate, methanol, aspirin, renal failure, ketoacidosis."]],
 pr:["A ‘normal’ Pco₂ in a patient with metabolic acidosis is respiratory failure.","Beer potomania, tea-and-toast and post-marathon hyponatremia correct fast once solute returns; watch urine output."],
 q:["pH 7.20, HCO₃ 10. What Pco₂ do you expect if compensation is appropriate?","About 23 (1.5 × 10 + 8 = 23, range 21–25)."]},

{id:"lytes2",u:3,t:"Potassium, magnesium, calcium and phosphorus",r:["17@133-144"],
 bl:"Potassium kills through the heart. Calcium kills through the heart and the brain. Fix magnesium before potassium will stick.",
 wk:["Hyperkalemia: EKG first; repeat a hemolyzed sample; check renal function, CK, digoxin","Hypercalcemia: ionized Ca, PTH, PTHrP, vitamin D, malignancy workup","Hypocalcemia: correct for albumin or use ionized; check Mg"],
 tx:["Hyperkalemia with EKG changes: calcium gluconate 3 g or calcium chloride 1 g IV; insulin 10 units IV with dextrose (consider 5 units in renal failure); albuterol 10–20 mg nebulized; dialysis for refractory cases","Hypokalemia: oral when possible; IV 10 mEq/h peripherally (up to 20 centrally, monitored); replete Mg","Hypercalcemia: NS 1–2 L, then calcitonin and bisphosphonate (zoledronic acid); avoid early furosemide"],
 ev:[["Sodium zirconium cyclosilicate and patiromer","Newer binders lower potassium over hours; they don’t replace shifting agents in emergencies."]],
 pr:["Peaked T waves → long PR, flat P → wide QRS → sine wave. A wide QRS at any K⁺ is an emergency.","Hypermagnesemia (after magnesium infusion for preeclampsia) loses reflexes first, then breathing; treat with calcium."],
 q:["Why give calcium first in hyperkalemia with EKG changes?","It stabilizes the cardiac membrane within minutes, buying time while you shift and remove potassium; it doesn’t lower K⁺."]}
);
L.push(
/* ---------- Unit 4: Cardiovascular ---------- */
{id:"cp1",u:4,t:"Chest pain and the low-risk patient",r:["48","51"],
 bl:"Chest pain in the ED is a search for six killers: ACS, PE, aortic dissection, tension pneumothorax, tamponade and esophageal rupture. Once they’re reasonably excluded, structured risk tools let you send low-risk patients home safely.",
 wk:["EKG within 10 minutes of arrival, repeat with ongoing or changing symptoms","High-sensitivity troponin with a 0/1-hour or 0/2-hour pathway","Chest film; targeted ultrasound; CTA when PE or dissection is suspected"],
 tx:["Aspirin 162–325 mg chewed when ACS is possible","Treat the specific cause; avoid anchoring on ‘musculoskeletal’ before the killers are addressed"],
 dz:["HEART score 0–3 with negative serial troponins: discharge with outpatient follow-up; no routine stress test needed before discharge"],
 ev:[["HEART Pathway (2015)","Using HEART plus serial troponins reduced objective testing and length of stay without missing MACE."],["High-sensitivity troponin","A single very low troponin with symptoms over 3 hours old can rule out MI with a negative predictive value over 99%."]],
 pr:["Reproducible chest wall tenderness doesn’t exclude ACS.","Women, diabetics and the elderly more often present with dyspnea, fatigue or epigastric discomfort."],
 q:["What does HEART stand for?","History, EKG, Age, Risk factors, Troponin."]},

{id:"acs1",u:4,t:"Acute coronary syndromes: diagnosis",r:["49@379-387"],
 bl:"ACS spans unstable angina, NSTEMI and STEMI. The EKG decides who goes to the cath lab now; troponin decides who has had an infarction. Learn the STEMI equivalents, because they miss the millimeter criteria.",
 wk:["STEMI: new ST elevation at the J point in 2 contiguous leads (≥1 mm; V2–V3 ≥2 mm in men 40+, ≥2.5 mm in men under 40, ≥1.5 mm in women)","Posterior MI: ST depression V1–V3; get V7–V9","Right-sided leads (V4R) in inferior MI","Equivalents: Sgarbossa-positive LBBB or paced rhythm, de Winter T waves, hyperacute T waves; Wellens is a warning, not an equivalent"],
 key:["Type 2 MI (supply–demand) is common with sepsis, tachyarrhythmia, anemia; treat the cause.","Myocardial injury (troponin rise without ischemia) has many causes: renal failure, PE, myocarditis, sepsis."],
 ev:[["4th Universal Definition of MI (2018)","MI requires rise and/or fall of troponin above the 99th percentile plus evidence of ischemia."]],
 pr:["Serial EKGs every 15–30 minutes catch evolving occlusion.","Compare with old EKGs; it’s the cheapest test you have."],
 q:["Inferior ST elevation with ST depression in V1–V3. What else is going on?","Posterior involvement (inferoposterior MI), usually RCA or circumflex."]},

{id:"acs2",u:4,t:"ACS treatment, complications and cardiogenic shock",r:["49@388-397","50"],
 bl:"For STEMI: PCI within 90 minutes of first medical contact (120 if transferring), otherwise fibrinolysis within 30 minutes. For NSTEMI: antiplatelets, anticoagulation and risk-based timing of angiography. Cardiogenic shock needs early revascularization and a team.",
 tx:["Aspirin 162–325 mg; P2Y12 inhibitor per cardiology (ticagrelor or clopidogrel; prasugrel in the lab)","Heparin 60 units/kg bolus (max 4000) then 12 units/kg/h (max 1000)","Nitroglycerin for pain unless hypotensive, RV infarct, or recent PDE5 inhibitor","Fibrinolysis (tenecteplase, weight-based) when PCI isn’t available in time; contraindications include prior ICH, recent stroke, active bleeding, dissection","Cardiogenic shock: norepinephrine for MAP, dobutamine for low output, emergent PCI, mechanical support per center"],
 wk:["Complications: arrhythmias, heart block, free wall or septal rupture, papillary muscle rupture (new murmur, flash edema), RV infarct, LV thrombus"],
 dz:["STEMI → cath lab; NSTEMI with refractory pain, instability or arrhythmia → urgent invasive strategy"],
 ev:[["SHOCK (NEJM 1999)","Early revascularization improved 6- and 12-month survival in cardiogenic shock from MI."],["AVOID (2015)","Routine oxygen in non-hypoxemic STEMI increased infarct size; give O₂ only for SpO₂ under 90%."]],
 pr:["Hypotension after nitroglycerin in inferior MI: think RV infarct; fluid bolus.","Cocaine-associated chest pain: benzodiazepines first; avoid β-blockers acutely."],
 q:["What is the target door-to-balloon time for a STEMI presenting to a PCI-capable center?","90 minutes or less."]},

{id:"rhythm1",u:4,t:"Dysrhythmias: approach, ectopy, brady, AF and SVT",r:["18@144-155"],
 bl:"Unstable (hypotension, altered mental status, ischemic pain, acute heart failure) means electricity: cardioversion for tachycardia, pacing for bradycardia. Stable patients get a 12-lead and a rhythm diagnosis first.",
 tx:["Stable SVT: modified Valsalva, adenosine 6 mg then 12 mg rapid push","AF/flutter rate control: diltiazem 0.25 mg/kg IV (then 0.35 mg/kg), or metoprolol 5 mg IV repeated; amiodarone or digoxin if hypotensive or HFrEF","Symptomatic bradycardia: atropine 1 mg every 3–5 min (max 3 mg); pacing or epinephrine/dopamine infusion if refractory","MAT: treat the lung disease, replete Mg and K"],
 wk:["New AF: TSH, electrolytes, troponin if ischemic, look for sepsis, PE, alcohol, thyrotoxicosis","Bradycardia: K⁺, drug list (β-blockers, CCBs, digoxin, clonidine), inferior MI, hypothyroidism, hypothermia"],
 dz:["Recent-onset AF (under 48 hours, low stroke risk) can be cardioverted in the ED and discharged; anticoagulation decisions use CHA₂DS₂-VASc"],
 ev:[["Ottawa AF/AFL Action Plan","ED cardioversion and discharge for recent-onset AF is safe in selected patients."],["RACE 7 ACWAS (NEJM 2019)","Wait-and-see (rate control, delayed cardioversion if needed) was noninferior to early cardioversion for recent-onset AF."]],
 pr:["Narrow regular rate of 150: flutter until proven otherwise.","AF with RVR in sepsis is often compensatory; treat the sepsis first."],
 q:["Unstable AF with RVR at 170, BP 70/40. Treatment?","Synchronized cardioversion (start around 120–200 J biphasic)."]},

{id:"rhythm2",u:4,t:"AV blocks, wide-complex tachycardia and channelopathies",r:["18@156-168"],
 bl:"Mobitz II and complete heart block are infranodal until proven otherwise and usually need pacing. A regular wide-complex tachycardia is VT until proven otherwise. Syncope with WPW, Brugada, long QT or ARVC on the EKG is high risk.",
 tx:["Stable VT: procainamide 20–50 mg/min (max 17 mg/kg) or amiodarone 150 mg over 10 min; synchronized cardioversion if unstable","Torsades: magnesium 2 g IV, correct K, stop QT drugs; overdrive pacing or isoproterenol if recurrent","Pre-excited AF: procainamide or cardioversion; avoid AV nodal blockers","Mobitz II / complete block: pads on, transcutaneous pacing if unstable, transvenous pacing, cardiology"],
 wk:["WCT clues for VT: AV dissociation, fusion and capture beats, concordance, northwest axis, age over 35 with structural heart disease","Brugada type 1: coved ST elevation ≥2 mm in V1–V2"],
 dz:["New Mobitz II or complete block: admit to a monitored bed for pacemaker"],
 ev:[["PROCAMIO (2017)","Procainamide had fewer major adverse cardiac events than amiodarone for stable wide-complex tachycardia."]],
 pr:["Brugada is unmasked by fever and sodium-channel blockers; treat fever aggressively.","Lyme carditis can cause high-grade AV block that reverses with antibiotics."],
 q:["Why avoid diltiazem in a wide-complex tachycardia of unclear origin?","If it’s VT (or pre-excited AF), calcium channel blockade can cause hemodynamic collapse or VF."]},

{id:"syncope",u:4,t:"Syncope and acute heart failure",r:["52","53"],
 bl:"Syncope workup rests on history, exam and EKG; most expensive testing adds little. Acute heart failure in the ED is mostly a pressure and volume problem: sympathetic crashing pulmonary edema needs nitrates and noninvasive ventilation fast.",
 wk:["Syncope: orthostatics, EKG, glucose, pregnancy test, Hb if bleeding possible; troponin and BNP by context","High-risk syncope: exertional, supine, palpitations, chest pain, family history of sudden death, structural heart disease, abnormal EKG","Heart failure: BNP, troponin, chest film, lung ultrasound (B-lines), echo"],
 tx:["SCAPE: high-dose nitroglycerin (bolus 400–1000 mcg, then infusion 100+ mcg/min) plus BiPAP","Volume overload: IV loop diuretic at 1–2.5× the home dose","Cardiogenic shock with pulmonary edema: inotrope or vasopressor, not nitrates"],
 dz:["Canadian Syncope Risk Score guides disposition; many intermediate-risk patients can go home with monitoring"],
 ev:[["Canadian Syncope Risk Score (2016)","Validated tool combining clinical, EKG, troponin and diagnosis features to stratify 30-day serious outcomes."],["DOSE (NEJM 2011)","High-dose versus low-dose and bolus versus infusion furosemide gave similar symptom relief in acute HF."]],
 pr:["Syncope while lying down or during exertion is cardiac until proven otherwise.","Lung ultrasound beats chest film for detecting pulmonary edema."],
 q:["What’s the core treatment for sympathetic crashing acute pulmonary edema?","High-dose nitroglycerin and noninvasive positive-pressure ventilation."]},

{id:"valve",u:4,t:"Valvular disease, cardiomyopathy and pericardial disease",r:["54","55"],
 bl:"Acute valve failure (papillary muscle rupture, endocarditis, prosthetic dysfunction) presents as sudden shock or flash pulmonary edema. Aortic stenosis and HCM are preload- and afterload-sensitive: avoid vasodilators. Pericarditis is common; tamponade is the danger.",
 wk:["Echo for new murmurs with heart failure or fever","Pericarditis: diffuse concave ST elevation, PR depression, pleuritic positional pain, rub","Myocarditis: troponin, EKG changes, echo; MRI later"],
 tx:["Pericarditis: high-dose NSAID (ibuprofen 600–800 mg TID) plus colchicine 0.5 mg BID for 3 months","Severe AS with hypotension: phenylephrine, cautious fluids; avoid nitrates","HCM with obstruction: fluids, β-blockers, phenylephrine; avoid inotropes and diuretics"],
 dz:["Pericarditis with high-risk features (fever, large effusion, tamponade, troponin elevation, immunosuppression, anticoagulation, NSAID failure) → admit"],
 ev:[["ICAP (NEJM 2013)","Colchicine added to anti-inflammatory therapy halved recurrent pericarditis."]],
 pr:["Prosthetic valve plus new heart failure or embolic event: think valve thrombosis or endocarditis.","Peripartum cardiomyopathy can appear up to 5 months after delivery."],
 q:["Why avoid nitroglycerin in severe aortic stenosis?","Cardiac output is fixed by the valve; dropping preload can collapse the blood pressure."]},

{id:"pe",u:4,t:"Venous thromboembolism and pulmonary hypertension",r:["56","58"],
 bl:"Use pretest probability to decide testing: PERC to stop, D-dimer to rule out in low and moderate risk, CTPA when needed. Massive PE (hypotension) gets systemic thrombolysis; submassive gets anticoagulation and close watching. Pulmonary hypertension patients decompensate from RV failure and crash with intubation.",
 wk:["Wells or clinical gestalt, then PERC (if low), then age-adjusted D-dimer (age × 10 above 50), then CTPA","Bedside echo for RV strain; troponin and BNP for risk stratification","DVT: compression ultrasound"],
 tx:["Anticoagulation: DOAC (apixaban, rivaroxaban) for most; LMWH or heparin if intervention may be needed","Massive PE: alteplase 100 mg over 2 hours (or 0.6 mg/kg over 15 min in arrest)","PH with RV failure: careful small fluid boluses, norepinephrine early, inhaled pulmonary vasodilators, avoid intubation if possible"],
 dz:["Low-risk PE (sPESI 0, no RV strain, reliable follow-up) can be treated as outpatient"],
 ev:[["PEITHO (NEJM 2014)","Lytics in intermediate-risk PE prevented decompensation but increased major bleeding and stroke."],["YEARS and age-adjusted D-dimer","Both safely reduce CT use compared with a fixed 500 ng/mL cutoff."]],
 pr:["Syncope, hypotension or hypoxia with a normal chest film: think PE.","Never continue a home pulmonary vasodilator infusion pause; interruption of IV epoprostenol can be fatal."],
 q:["Which PE patients get systemic thrombolysis?","Those with high-risk (massive) PE: sustained hypotension or shock, or cardiac arrest from PE, without absolute contraindications."]},

{id:"htn",u:4,t:"Hypertension and aortic dissection",r:["57","59"],
 bl:"Asymptomatic hypertension needs no rapid lowering in the ED. Hypertensive emergency (target-organ damage) needs controlled reduction tailored to the organ. Aortic dissection needs heart rate control first, then blood pressure, and a surgeon for type A.",
 wk:["End-organ look: mental status, fundi, EKG and troponin, creatinine, urinalysis, chest film","Dissection: CTA chest/abdomen/pelvis; bedside echo for flap, effusion, root dilation; ADD-RS to guide pretest probability"],
 tx:["Dissection: esmolol or labetalol to HR under 60, then nicardipine or clevidipine to SBP 100–120 within 20 minutes; opioid analgesia","Hypertensive emergency (most): lower MAP by no more than 25% in the first hour","Exceptions: dissection (fast, to target), preeclampsia (SBP under 160), ischemic stroke for lytics (under 185/110)"],
 dz:["Type A dissection → cardiothoracic surgery emergently; type B uncomplicated → medical management in ICU"],
 ev:[["ADD-RS with D-dimer","Low ADD-RS plus negative D-dimer has been studied as a rule-out strategy for dissection."]],
 pr:["Vasodilators before β-blockade in dissection cause reflex tachycardia and increase shear.","Pulse deficit, neuro deficit, or new aortic regurgitation murmur plus chest pain = dissection until proven otherwise."],
 q:["In aortic dissection, why give the β-blocker before the vasodilator?","To prevent reflex tachycardia, which increases shear stress on the aortic wall."]},

{id:"vasc",u:4,t:"Aneurysms and arterial occlusion",r:["60","61"],
 bl:"Ruptured AAA classically shows pain, hypotension and a pulsatile mass, but often mimics renal colic. Acute limb ischemia is a time-critical emergency: the six Ps, heparin, and vascular surgery.",
 wk:["Bedside ultrasound for AAA (aorta over 3 cm abnormal; rupture risk rises sharply above 5.5 cm)","CTA if stable and diagnosis unclear","Limb ischemia: Doppler signals, ABI, CTA; check for AF as an embolic source"],
 tx:["Ruptured AAA: permissive hypotension (SBP about 70–90 if mentating), massive transfusion, immediate vascular surgery","Acute limb ischemia: unfractionated heparin bolus and infusion, emergent revascularization"],
 dz:["Symptomatic AAA without rupture still goes to vascular surgery urgently"],
 pr:["Elderly patient with first-time ‘renal colic’ and no hematuria: ultrasound the aorta.","Aortoenteric fistula: GI bleeding in anyone with a prior aortic graft."],
 q:["Name the six Ps of acute limb ischemia.","Pain, pallor, pulselessness, paresthesias, paralysis, poikilothermia."]},

/* ---------- Unit 5: Pulmonary ---------- */
{id:"pulm1",u:5,t:"Respiratory distress and hemoptysis",r:["62","63"],
 bl:"Respiratory distress is airway, breathing, or circulation masquerading as breathing. Find the cause with exam, gas, film and ultrasound while supporting oxygenation and ventilation. Massive hemoptysis kills by asphyxiation, not exsanguination.",
 wk:["ABG/VBG, chest film, EKG, lung ultrasound, BNP or D-dimer by context","Hemoptysis: CBC, coags, type and cross, CTA chest"],
 tx:["Massive hemoptysis: bleeding side down, intubate with a large tube (8.0+), consider selective mainstem intubation of the good lung, IR bronchial artery embolization","Nebulized or IV tranexamic acid is used in some protocols"],
 dz:["Massive hemoptysis → ICU, IR and pulmonology/thoracic surgery"],
 pr:["Silent chest in asthma is pre-arrest.","Hemoptysis in a patient with a tracheostomy: tracheoinnominate fistula until proven otherwise."],
 q:["In massive hemoptysis from the left lung, which side goes down?","The left (bleeding) side down, to protect the good right lung."]},

{id:"pulm2",u:5,t:"URIs, bronchitis and pneumonia",r:["64","65"],
 bl:"Most cough is viral and needs no antibiotics. Pneumonia treatment depends on severity and setting; scoring tools help decide who can go home.",
 wk:["Chest film for suspected pneumonia; lung ultrasound is a reasonable alternative","Severe CAP: cultures, lactate, procalcitonin optional, viral testing, Legionella and pneumococcal urinary antigens"],
 tx:["Outpatient healthy adult: amoxicillin 1 g TID, or doxycycline","Outpatient with comorbidities: amoxicillin-clavulanate or cefpodoxime plus a macrolide or doxycycline, or a respiratory fluoroquinolone","Inpatient: ceftriaxone plus azithromycin; add MRSA or Pseudomonas coverage only with risk factors"],
 dz:["CURB-65 0–1 or PSI class I–II: outpatient if no hypoxia and reliable"],
 ev:[["CAPE COD (NEJM 2023)","Hydrocortisone reduced mortality in severe CAP requiring ICU care."]],
 pr:["Acute bronchitis cough lasts about 3 weeks; antibiotics don’t shorten it.","Aspiration pneumonitis (chemical) differs from aspiration pneumonia (infection); the first doesn’t need antibiotics early."],
 q:["What does CURB-65 stand for?","Confusion, urea over 7 mmol/L (BUN over 19), respiratory rate 30 or more, BP under 90 systolic or 60 diastolic, age 65 or older."]},

{id:"pulm3",u:5,t:"Empyema, tuberculosis and pneumothorax",r:["66","67","68"],
 bl:"Empyema and lung abscess need drainage and long antibiotics. TB lives in the differential of every cavitary lesion and immunocompromised cough; isolate first. Pneumothorax management has shifted toward smaller tubes and more conservative care.",
 wk:["Pleural fluid: pH under 7.2, glucose under 60 or frank pus means drainage","TB: airborne isolation, chest film (upper lobe, cavitation), sputum AFB and NAAT"],
 tx:["Primary spontaneous pneumothorax, stable: observation or needle aspiration, or small-bore catheter","Secondary or large symptomatic: small-bore chest tube","Tension: needle decompression (4th–5th ICS anterior axillary line or 2nd ICS MCL) then tube"],
 ev:[["PSP trial (NEJM 2020)","Conservative management of moderate-to-large primary spontaneous pneumothorax was noninferior to intervention."]],
 pr:["Tension pneumothorax is a clinical diagnosis; don’t wait for imaging.","Recommend smoking cessation and no air travel until resolved after pneumothorax."],
 q:["What pleural fluid findings require drainage in parapneumonic effusion?","Pus, positive Gram stain or culture, pH under 7.2, or glucose under 60 mg/dL."]},

{id:"pulm4",u:5,t:"Asthma and COPD",r:["69","70"],
 bl:"Treat bronchospasm early and in parallel: inhaled β-agonists, anticholinergics, systemic steroids. Magnesium and NIV for severe asthma; intubation is a last resort that needs a careful ventilator strategy.",
 tx:["Albuterol 2.5–5 mg nebulized every 20 min or continuous; ipratropium 0.5 mg with the first three doses","Prednisone 40–50 mg (or dexamethasone) for asthma and COPD exacerbations","Magnesium 2 g IV over 20 min for severe asthma","COPD exacerbation: antibiotics if increased sputum purulence; BiPAP for hypercapnic acidosis","Epinephrine 0.3–0.5 mg IM for near-fatal asthma"],
 wk:["Peak flow before and after treatment; gas if severe or drowsy","Chest film for pneumothorax or pneumonia when severe or atypical"],
 dz:["Peak flow over 70% predicted after treatment with good response: discharge on steroids and controller"],
 ev:[["Dexamethasone in asthma","One or two doses of dexamethasone are about as effective as 5 days of prednisone for mild–moderate exacerbations."]],
 pr:["Target SpO₂ 88–92% in COPD to avoid worsening hypercapnia.","An exhausted, quiet, drowsy asthmatic is in respiratory failure."],
 q:["What’s the key ventilator principle for an intubated asthmatic?","Allow time to exhale: low rate, small tidal volume, short inspiratory time, accept hypercapnia, watch for auto-PEEP."]}
);
L.push(
/* ---------- Unit 6: Neurology ---------- */
{id:"neuro1",u:6,t:"Neuro exam, altered mental status and coma",r:["164","168"],
 bl:"Altered mental status is a symptom with a long differential: check glucose, think toxic-metabolic first, look for focal signs and meningismus, and protect the airway. A focused, reproducible neuro exam lets you track change.",
 wk:["Fingerstick glucose immediately; then CBC, BMP, Ca, LFTs, ammonia if liver disease, tox screen and levels, VBG, CK, TSH, cultures","CT head if focal deficit, trauma, anticoagulation, or no clear cause; LP if infection or SAH possible","EEG for nonconvulsive status when mental status doesn’t improve"],
 tx:["Dextrose for hypoglycemia; thiamine 100–500 mg IV for malnourished or alcohol-use patients","Naloxone 0.04–0.4 mg titrated for suspected opioid toxicity with hypoventilation","Treat fever, hypoxia, hypercapnia and hypotension"],
 key:["GCS: eye 4, verbal 5, motor 6; motor score carries most prognostic weight.","Delirium is acute, fluctuating inattention; dementia is chronic. Delirium in the elderly is a medical emergency."],
 pr:["Pupils: pinpoint (opioids, pontine lesion), dilated fixed unilateral (uncal herniation), dilated reactive (sympathomimetic or anticholinergic).","Psychogenic unresponsiveness is a diagnosis of exclusion."],
 q:["What bedside test comes first in every patient with altered mental status?","Fingerstick glucose."]},

{id:"neuro2",u:6,t:"Headache, SAH and intracerebral hemorrhage",r:["165","166"],
 bl:"Most headaches are primary. Red flags (thunderclap onset, worst ever, focal deficits, fever and meningismus, immunosuppression, pregnancy, age over 50 with new headache) drive imaging. SAH and ICH are reversed and pressure-controlled early.",
 wk:["Thunderclap headache: CT within 6 hours of onset is highly sensitive for SAH in neurologically intact patients; after 6 hours add LP or CTA","Ottawa SAH rule for alert patients with acute nontraumatic headache peaking within an hour","ICH: CT, coags, platelet count"],
 tx:["Migraine: IV fluids, prochlorperazine or metoclopramide with or without diphenhydramine, ketorolac, dexamethasone to reduce recurrence; avoid opioids","ICH: SBP target about 140 (avoid under 110), reverse anticoagulation (4-factor PCC for warfarin, andexanet or PCC for Xa inhibitors, idarucizumab for dabigatran)","SAH: SBP under about 160, nimodipine 60 mg every 4 hours, neurosurgery, seizure precautions"],
 dz:["SAH and ICH → neuro ICU and neurosurgery"],
 ev:[["Perry (BMJ 2011)","CT within 6 hours of headache onset in alert patients was nearly 100% sensitive for SAH on modern scanners."],["INTERACT2 (NEJM 2013)","Intensive BP lowering in ICH was safe; it didn’t significantly reduce death or major disability, but an ordinal analysis suggested better function."]],
 pr:["Sentinel headache precedes aneurysmal SAH in many patients.","Carbon monoxide headache clusters in households in winter."],
 q:["An alert patient with thunderclap headache gets a normal CT 3 hours after onset. Next step?","On a modern scanner read by a qualified radiologist, SAH is effectively excluded; LP isn’t routinely needed within 6 hours."]},

{id:"stroke",u:6,t:"Stroke syndromes",r:["167"],
 bl:"Time is brain. Establish last known well, check glucose, get noncontrast CT (and CTA for large vessel occlusion), and decide on thrombolysis within 4.5 hours and thrombectomy up to 24 hours in selected patients.",
 wk:["NIHSS; glucose; CT/CTA head and neck; CT perfusion or MRI for late windows","Labs shouldn’t delay lytics except glucose (and coags if on anticoagulants)"],
 tx:["Alteplase 0.9 mg/kg (max 90 mg; 10% bolus, rest over 60 min) or tenecteplase 0.25 mg/kg within 4.5 hours","BP under 185/110 before lytics and under 180/105 for 24 hours after","Thrombectomy for LVO up to 24 hours with favorable imaging"],
 dz:["Stroke unit or neuro ICU; TIA with high ABCD² or abnormal imaging: admit or rapid TIA clinic"],
 ev:[["NINDS (NEJM 1995)","Alteplase within 3 hours improved 90-day functional outcome."],["DAWN and DEFUSE 3 (NEJM 2018)","Thrombectomy 6–24 hours after onset improved outcomes in patients with salvageable tissue."],["AcT (Lancet 2022)","Tenecteplase was noninferior to alteplase."]],
 pr:["Posterior circulation strokes are missed more often: dizziness, ataxia, diplopia, dysarthria. Do HINTS when appropriate.","Hypoglycemia can mimic stroke; Todd’s paralysis follows seizures."],
 q:["What’s the BP threshold before giving IV thrombolysis for stroke?","Below 185/110 mmHg."]},

{id:"vertigo",u:6,t:"Vertigo, ataxia and gait disturbances",r:["169","170"],
 bl:"Sort dizziness by timing and triggers: episodic triggered (BPPV), acute continuous (vestibular neuritis vs posterior stroke), spontaneous episodic (vestibular migraine, Ménière’s, TIA). HINTS in trained hands outperforms early MRI for stroke in acute vestibular syndrome.",
 wk:["Dix–Hallpike for positional vertigo; supine roll for horizontal canal","HINTS (head impulse, nystagmus, test of skew) only in continuous vertigo with nystagmus","Ataxia: check gait; truncal ataxia without limb ataxia suggests midline cerebellar lesion"],
 tx:["BPPV: Epley maneuver","Vestibular neuritis: short course of antiemetic or meclizine, early mobilization; steroids are debated"],
 dz:["Any central sign (abnormal HINTS, new headache, neuro deficits, inability to walk) → MRI and neurology"],
 ev:[["HINTS (Kattah, Stroke 2009)","A benign HINTS exam excluded stroke better than early diffusion MRI in acute vestibular syndrome."]],
 pr:["A normal head impulse in continuous vertigo is worrisome: suggests central cause.","Inability to walk unassisted is a red flag even with an otherwise benign exam."],
 q:["What does ‘INFARCT’ stand for in HINTS?","Impulse normal, fast-phase alternating nystagmus, refixation on cover test (skew deviation): any one suggests stroke."]},

{id:"seize",u:6,t:"Seizures and peripheral neurologic disorders",r:["171","172"],
 bl:"Stop status epilepticus fast with adequate benzodiazepine doses, then a second-line agent. For weakness, localize: Guillain–Barré, myasthenia, botulism, spinal cord and peripheral nerve lesions each have their own patterns and airway risks.",
 tx:["Status: lorazepam 4 mg IV (0.1 mg/kg), midazolam 10 mg IM, or diazepam; repeat once","Second line: levetiracetam 60 mg/kg (max 4500 mg), fosphenytoin 20 PE/kg, or valproate 40 mg/kg","Refractory: intubate, propofol or midazolam infusion, continuous EEG","Myasthenic crisis: intubate on FVC under 20 mL/kg or NIF worse than −30; avoid succinylcholine dosing errors and aminoglycosides, fluoroquinolones, magnesium"],
 wk:["First seizure: glucose, Na, pregnancy test, tox, CT head; LP if infection suspected","Weakness: FVC and NIF, reflexes, sensory level, bulbar signs"],
 dz:["First unprovoked seizure with normal exam and back to baseline: discharge with neurology follow-up and driving counseling"],
 ev:[["ESETT (NEJM 2019)","Levetiracetam, fosphenytoin and valproate were equally effective for benzodiazepine-refractory status."],["RAMPART (NEJM 2012)","IM midazolam by paramedics was at least as effective as IV lorazepam."]],
 pr:["Underdosing benzodiazepines is the most common error in status epilepticus.","Peripheral facial palsy (Bell’s) involves the forehead; a central lesion (stroke) spares it."],
 q:["What is the first-line treatment for status epilepticus without IV access?","IM midazolam 10 mg (adults over 40 kg)."]},

{id:"neuro3",u:6,t:"Chronic neurologic disorders and CNS devices",r:["173","175"],
 bl:"Patients with MS, Parkinson’s, ALS and myasthenia often present with infection, medication problems or decompensation of their disease. Shunts, stimulators and pumps fail in predictable ways.",
 wk:["VP shunt malfunction: CT head, shunt series; consider neurosurgical tap","Baclofen pump: withdrawal (itching, spasticity, hyperthermia, seizures) or overdose (sedation, bradycardia, hypotonia)"],
 tx:["Baclofen withdrawal: oral baclofen, benzodiazepines, neurosurgery to restore intrathecal delivery","Parkinson’s: don’t stop dopaminergic drugs (risk of parkinsonism-hyperpyrexia); avoid haloperidol and metoclopramide","MS flare: high-dose steroids after excluding infection"],
 pr:["Infection (often UTI) is the most common trigger of pseudo-relapse in MS.","Shunt malfunction can look like gastroenteritis in children: vomiting and lethargy."],
 q:["Name two drugs to avoid in a Parkinson’s patient with nausea or agitation.","Metoclopramide and haloperidol (dopamine antagonists); ondansetron or quetiapine are safer choices."]},

{id:"cnsinf",u:6,t:"CNS and spinal infections",r:["174"],
 bl:"Suspected bacterial meningitis gets antibiotics and dexamethasone immediately; don’t delay for CT or LP. Spinal epidural abscess presents as back pain with fever or risk factors before deficits appear.",
 wk:["CT before LP only if immunocompromised, focal deficits, papilledema, altered mental status, or new seizure","CSF: cell count, glucose, protein, Gram stain, culture, multiplex PCR, HSV PCR","Epidural abscess: MRI of the whole spine, ESR/CRP, blood cultures"],
 tx:["Adult bacterial meningitis: ceftriaxone 2 g + vancomycin; add ampicillin if over 50 or immunocompromised; dexamethasone 10 mg before or with the first antibiotic dose","HSV encephalitis: acyclovir 10 mg/kg IV every 8 hours","Epidural abscess: vancomycin plus anti-pseudomonal β-lactam; spine surgery"],
 ev:[["de Gans (NEJM 2002)","Dexamethasone reduced mortality and poor outcome in adult pneumococcal meningitis."]],
 pr:["Classic triad (fever, neck stiffness, altered mental status) is present in fewer than half; nearly all have at least one.","Injection drug use, diabetes, recent spine procedure plus back pain: think epidural abscess."],
 q:["When is CT needed before LP in suspected meningitis?","Immunocompromise, history of CNS disease, new seizure, papilledema, altered mental status or focal deficits."]},

/* ---------- Unit 7: Toxicology ---------- */
{id:"tox1",u:7,t:"Poisoned patient principles and cyclic antidepressants",r:["176","177"],
 bl:"Supportive care first, then toxidrome recognition, targeted antidotes, and decontamination only when it helps. Tricyclics kill through sodium-channel blockade: widened QRS, seizures and hypotension; bicarbonate is the antidote.",
 wk:["EKG (QRS, QTc, terminal R in aVR), acetaminophen and salicylate levels in every intentional ingestion","Anion and osmolar gaps, CK, glucose, pregnancy test","Call poison control (1-800-222-1222)"],
 tx:["Activated charcoal 1 g/kg within about 1–2 hours for dangerous ingestions with a protected airway","TCA: sodium bicarbonate 1–2 mEq/kg boluses for QRS over 100 ms, target serum pH 7.45–7.55","TCA seizures: benzodiazepines; avoid physostigmine and flumazenil","Lipid emulsion for refractory cardiotoxicity from lipophilic drugs"],
 dz:["Asymptomatic TCA ingestion with normal EKG after 6 hours of observation can be medically cleared"],
 pr:["Toxidromes: sympathomimetic, anticholinergic, cholinergic, opioid, sedative-hypnotic, serotonin syndrome.","Whole bowel irrigation for sustained-release drugs, iron, lithium and body packers."],
 q:["TCA overdose with QRS 130 ms. Treatment?","Sodium bicarbonate boluses (1–2 mEq/kg) until the QRS narrows, then an infusion."]},

{id:"tox2",u:7,t:"Antidepressants, MAOIs and antipsychotics",r:["178","179","180"],
 bl:"Serotonin syndrome is clonus, hyperreflexia and agitation after serotonergic drugs; neuroleptic malignant syndrome is lead-pipe rigidity, hyperthermia and altered mental status over days. Bupropion causes seizures; citalopram and antipsychotics prolong QT.",
 wk:["Hunter criteria for serotonin syndrome (clonus is key)","NMS: CK, creatinine, temperature, rigidity","EKG for QTc and QRS"],
 tx:["Serotonin syndrome: stop agents, benzodiazepines, cyproheptadine 12 mg then 2 mg q2h; cool; intubate and paralyze with nondepolarizer for severe hyperthermia","NMS: stop antipsychotic, cooling, benzodiazepines, consider dantrolene or bromocriptine","Acute dystonia: diphenhydramine or benztropine"],
 pr:["MAOI hypertensive crisis from tyramine or interacting drugs: phentolamine or nicardipine.","Don’t give meperidine, dextromethorphan, linezolid or tramadol with serotonergic drugs."],
 q:["Which exam finding best distinguishes serotonin syndrome from NMS?","Inducible or spontaneous clonus and hyperreflexia (serotonin syndrome) vs lead-pipe rigidity with bradyreflexia (NMS)."]},

{id:"tox3",u:7,t:"Lithium and sedative-hypnotics",r:["181","182","183","184"],
 bl:"Lithium toxicity is neurologic: tremor, ataxia, confusion, seizures; chronic toxicity is more dangerous at lower levels. Benzodiazepine overdose alone rarely kills; co-ingestions do.",
 wk:["Lithium level (repeat for sustained-release), creatinine, sodium","Sedative overdose: look for co-ingestants and aspiration"],
 tx:["Lithium: IV fluids (NS), stop nephrotoxins; hemodialysis for severe neurotoxicity or poor renal function (EXTRIP)","Benzodiazepines: supportive; flumazenil rarely (risk of seizures in chronic users or co-ingested TCA)","Barbiturates: supportive, urinary alkalinization for phenobarbital, multidose charcoal"],
 pr:["Activated charcoal doesn’t bind lithium.","GHB: deep coma with abrupt awakening within hours."],
 q:["Why is flumazenil usually avoided in unknown overdoses?","It can precipitate refractory seizures in benzodiazepine-dependent patients or those with proconvulsant co-ingestants (e.g., TCAs)."]},

{id:"alcohols",u:7,t:"Alcohols",r:["185"],
 bl:"Ethanol causes most intoxication but toxic alcohols kill. Methanol (vision loss) and ethylene glycol (renal failure, calcium oxalate crystals) cause high anion gap acidosis after their osmolar gap fades; fomepizole blocks metabolism. Alcohol withdrawal is treated with symptom-triggered benzodiazepines or phenobarbital.",
 wk:["Osmolar gap (measured − calculated, with ethanol ÷ 3.7 term), anion gap, VBG, lactate, ethylene glycol and methanol levels","Withdrawal: CIWA-Ar; electrolytes including Mg and phosphate"],
 tx:["Fomepizole 15 mg/kg load, then 10 mg/kg q12h; hemodialysis for severe acidosis, end-organ damage, or high levels","Folate (methanol) and thiamine/pyridoxine (ethylene glycol) cofactors","Withdrawal: benzodiazepines front-loaded; phenobarbital as adjunct or alternative; thiamine before glucose"],
 dz:["Delirium tremens, seizures or rising benzodiazepine needs → ICU"],
 pr:["Isopropanol: ketosis without acidosis.","Elevated osmolar gap with normal anion gap early; reversed late."],
 q:["What’s the mechanism of fomepizole?","Inhibits alcohol dehydrogenase, preventing metabolism of methanol and ethylene glycol into toxic acids."]},

{id:"tox4",u:7,t:"Opioids and sympathomimetics",r:["186","187"],
 bl:"Opioid toxicity: miosis, hypoventilation, sedation; naloxone titrated to breathing, not wakefulness. Cocaine and amphetamines cause agitation, hyperthermia, hypertension and ischemia; benzodiazepines are the core therapy.",
 tx:["Naloxone 0.04–0.4 mg IV titrated (higher doses for fentanyl analogues); infusion of two-thirds the effective dose per hour for long-acting opioids","Offer buprenorphine initiation for opioid use disorder from the ED","Sympathomimetic toxicity: benzodiazepines, active cooling for hyperthermia, phentolamine or nitrates for hypertension, avoid β-blockers acutely in cocaine chest pain"],
 dz:["Observe after naloxone (1 hour is commonly used for heroin reversal) and discharge with naloxone kit"],
 ev:[["D’Onofrio (JAMA 2015)","ED-initiated buprenorphine increased engagement in addiction treatment at 30 days."],["St. Paul’s Early Discharge rule","Patients meeting criteria 1 hour after naloxone can be safely discharged."]],
 pr:["Hyperthermia is the main killer in sympathomimetic toxicity; cool aggressively.","Tramadol causes seizures and serotonin syndrome; methadone prolongs QT."],
 q:["Why is ED-initiated buprenorphine valuable?","It reduces withdrawal and overdose risk and increases engagement in addiction treatment."]},

{id:"tox5",u:7,t:"Hallucinogens and salicylates",r:["188","189"],
 bl:"Most hallucinogen toxicity resolves with a calm environment and benzodiazepines. Salicylate poisoning causes respiratory alkalosis with high anion gap metabolic acidosis; it kills through CNS and pulmonary toxicity, and intubation can be fatal without matching hyperventilation.",
 wk:["Serial salicylate levels every 2 hours until falling; VBG; glucose (CNS hypoglycemia may occur with normal serum glucose)"],
 tx:["Sodium bicarbonate infusion to urine pH 7.5–8; keep K⁺ normal so urine can alkalinize","Hemodialysis: altered mental status, pulmonary edema, renal failure, severe acidosis, levels over about 90–100 mg/dL","If intubation unavoidable, set high minute ventilation to match prior compensation"],
 pr:["Tinnitus, vomiting, tachypnea in an older adult with ‘sepsis’: check a salicylate level.","Synthetic cannabinoids cause agitation, seizures and kidney injury; standard screens miss them."],
 q:["Why is intubating a salicylate-poisoned patient dangerous?","Loss of compensatory hyperventilation worsens acidemia, driving more salicylate into the CNS; can cause rapid deterioration and death."]},

{id:"tox6",u:7,t:"Acetaminophen and NSAIDs",r:["190","191"],
 bl:"Acetaminophen is the most common cause of acute liver failure. Use the Rumack–Matthew nomogram for single acute ingestions with known time; give N-acetylcysteine for any possibly toxic ingestion with uncertain timing or elevated AST.",
 wk:["4-hour (or later) APAP level, AST/ALT, INR, creatinine, glucose","Repeated supratherapeutic ingestion: treat if level detectable or AST elevated"],
 tx:["NAC IV: 150 mg/kg over 1 hour, then 50 mg/kg over 4 hours, then 100 mg/kg over 16 hours (or newer two-bag regimens)","Massive ingestions: higher-dose NAC and consider hemodialysis or fomepizole per toxicology","NSAID overdose: supportive; massive ibuprofen can cause metabolic acidosis, seizures, coma"],
 dz:["King’s College criteria for liver transplant referral"],
 pr:["NAC is nearly 100% hepatoprotective if started within 8 hours.","Anaphylactoid reactions to IV NAC: slow or pause, antihistamine, then resume."],
 q:["An APAP level drawn 2 hours after ingestion is above the treatment line. What next?","Levels before 4 hours can’t be plotted; repeat at 4 hours (start NAC if large ingestion or delay expected)."]},

{id:"tox7",u:7,t:"Methylxanthines, digoxin and β-blockers",r:["192","193","194"],
 bl:"Theophylline toxicity: vomiting, tachyarrhythmias, seizures. Digoxin toxicity: GI and visual symptoms with any arrhythmia (bidirectional VT is classic); digoxin Fab is the antidote. β-blocker toxicity: bradycardia, hypotension, hypoglycemia; high-dose insulin is the backbone.",
 tx:["Digoxin Fab: acute toxicity empiric 10 vials; chronic 3–6 vials; indications include life-threatening dysrhythmia, K⁺ over 5–5.5 in acute ingestion, end-organ dysfunction","β-blocker: atropine, calcium, glucagon 5 mg IV, high-dose insulin 1 unit/kg bolus then 1–10 units/kg/h with dextrose and K⁺ monitoring, vasopressors, pacing, ECMO","Theophylline: multidose charcoal, benzodiazepines for seizures, hemodialysis for severe toxicity"],
 pr:["Hyperkalemia in acute digoxin toxicity predicts mortality; don’t withhold calcium if needed (modern data suggest it’s safe), but Fab is definitive.","Propranolol is sodium-channel blocking (wide QRS, seizures); sotalol prolongs QT."],
 q:["What is the main ED antidote therapy for severe β-blocker or CCB toxicity?","High-dose insulin euglycemic therapy (with dextrose and potassium)."]},

{id:"tox8",u:7,t:"CCBs, antihypertensives and anticonvulsants",r:["195","196","197"],
 bl:"Calcium channel blocker toxicity causes bradycardia and hypotension with hyperglycemia (unlike β-blockers). Clonidine looks like opioid toxicity. Anticonvulsant overdoses each have signature effects.",
 tx:["CCB: calcium chloride 1–2 g (or gluconate 3–6 g), high-dose insulin, vasopressors, lipid emulsion for refractory, ECMO","Clonidine: supportive; naloxone sometimes helps","Valproate: L-carnitine for hyperammonemia or hepatotoxicity; carbamazepine: QRS widening (bicarbonate), multidose charcoal","Phenytoin: nystagmus and ataxia; supportive"],
 pr:["Sustained-release CCB ingestions can deteriorate 12–24 hours later; admit to ICU.","Hyperglycemia degree correlates with CCB toxicity severity."],
 q:["Which lab finding helps distinguish CCB from β-blocker toxicity?","Hyperglycemia (CCBs) versus hypoglycemia (β-blockers, especially in children)."]},

{id:"tox9",u:7,t:"Iron, hydrocarbons and caustics",r:["198","199","200"],
 bl:"Iron: GI phase, latent phase, then shock and liver failure; deferoxamine for severe toxicity. Hydrocarbon aspiration causes pneumonitis; inhalant abuse causes sudden sniffing death. Caustic ingestion: alkalis burn deep; endoscopy within 12–24 hours for symptomatic patients.",
 wk:["Iron level 4–6 hours post ingestion, abdominal film for pills, VBG","Hydrocarbons: chest film at 6 hours","Caustics: airway exam; endoscopy if symptomatic or intentional"],
 tx:["Deferoxamine infusion 15 mg/kg/h for systemic toxicity or level over 500 mcg/dL","Inhalant-induced arrhythmia: β-blocker (esmolol); avoid catecholamines","Caustics: no emesis, no charcoal, no neutralization; airway first"],
 pr:["Children who swallow button batteries need emergent removal if lodged in the esophagus; give honey en route (age over 1 year).","Charcoal doesn’t bind iron, lithium, alcohols, hydrocarbons, or caustics."],
 q:["Why are inhalants associated with sudden death?","Myocardial sensitization to catecholamines leads to ventricular dysrhythmias when startled or exerting."]},

{id:"tox10",u:7,t:"Pesticides and anticholinergics",r:["201","202"],
 bl:"Organophosphates cause cholinergic crisis: SLUDGE/DUMBELS plus killer B’s (bradycardia, bronchorrhea, bronchospasm). Atropine to dry secretions, pralidoxime early. Anticholinergic toxicity is the opposite: hot, dry, red, blind, mad, full.",
 tx:["Organophosphates: atropine 1–2 mg IV, double every 5 minutes until secretions dry; pralidoxime 30 mg/kg load then infusion; benzodiazepines for seizures; decontaminate","Anticholinergic delirium: benzodiazepines; physostigmine 0.5–2 mg slowly IV for pure anticholinergic syndrome without conduction delay"],
 pr:["Endpoint for atropine is drying of respiratory secretions, not heart rate or pupils.","Avoid succinylcholine after organophosphate exposure (prolonged paralysis)."],
 q:["What’s the endpoint of atropine dosing in organophosphate poisoning?","Clear lungs and dry respiratory secretions."]},

{id:"tox11",u:7,t:"Metals and industrial toxins",r:["203","204"],
 bl:"Metals cause chronic multisystem toxicity; lead causes encephalopathy in children. Cyanide and hydrogen sulfide shut down cellular respiration, causing sudden collapse with lactic acidosis.",
 tx:["Cyanide (smoke inhalation with shock or high lactate): hydroxocobalamin 5 g IV","Lead encephalopathy: chelation (dimercaprol plus CaNa₂EDTA) with toxicology","Hydrofluoric acid: calcium gluconate gel topically, local injection or intra-arterial calcium; monitor for hypocalcemia and hyperkalemia"],
 pr:["Lactate over 8 in a fire victim suggests cyanide toxicity.","Arsenic: GI symptoms, QT prolongation, later neuropathy."],
 q:["Antidote for cyanide toxicity from smoke inhalation?","Hydroxocobalamin."]},

{id:"tox12",u:7,t:"Vitamins, herbals, antimicrobials and dyshemoglobinemias",r:["205","206","207"],
 bl:"Most supplements are low risk, but vitamin A, iron, and some herbals (ephedra, aconite, kava) aren’t. Methemoglobinemia gives cyanosis unresponsive to oxygen and ‘chocolate brown’ blood; treat with methylene blue.",
 wk:["Co-oximetry for methemoglobin and carboxyhemoglobin; saturation gap"],
 tx:["Methylene blue 1–2 mg/kg IV for symptomatic methemoglobinemia or level over 20–30%","Avoid methylene blue in G6PD deficiency (use ascorbic acid, exchange transfusion); avoid with serotonergic drugs"],
 pr:["Common oxidizers: dapsone, benzocaine, nitrites, phenazopyridine.","Isoniazid overdose: refractory seizures, give pyridoxine gram-for-gram."],
 q:["A patient on dapsone has SpO₂ 85% unresponsive to oxygen. Diagnosis and treatment?","Methemoglobinemia; methylene blue (if not G6PD deficient)."]},

{id:"tox13",u:7,t:"Carbon monoxide, mushrooms and poisonous plants",r:["222","220","221"],
 bl:"CO poisoning: headache, nausea, confusion; normal pulse oximetry. Treat with 100% oxygen and consider hyperbaric for severe cases. Late-onset GI symptoms (6+ hours) after mushrooms suggest amatoxin and liver failure.",
 wk:["Carboxyhemoglobin by co-oximetry; EKG and troponin; pregnancy test","Mushrooms: LFTs, coags; timing of symptoms"],
 tx:["CO: 100% oxygen by NRB or intubation; hyperbaric oxygen for loss of consciousness, neurologic deficits, pregnancy, very high COHb, or cardiac involvement","Amatoxin: aggressive fluids, NAC, silibinin where available, liver transplant evaluation","Plant cardiac glycosides (oleander, foxglove): digoxin Fab"],
 ev:[["Weaver (NEJM 2002)","Hyperbaric oxygen reduced cognitive sequelae at 6 weeks and 12 months after acute CO poisoning."]],
 pr:["Multiple family members with flu-like symptoms in winter: think CO.","Jimsonweed is anticholinergic; water hemlock causes seizures."],
 q:["Why doesn’t pulse oximetry detect CO poisoning?","Standard 2-wavelength oximeters read carboxyhemoglobin as oxyhemoglobin, showing falsely normal saturation."]}
);
L.push(
/* ---------- Unit 8: Trauma ---------- */
{id:"tr1",u:8,t:"Trauma in adults and traumatic shock",r:["254","13"],
 bl:"Primary survey (ABCDE) finds and treats immediate threats; the secondary survey finds everything else. Hemorrhagic shock is treated with hemorrhage control and blood, not crystalloid.",
 wk:["eFAST, chest and pelvis films in the bay; CT for stable patients","Labs: type and cross, CBC, coags or viscoelastic testing, lactate or base deficit, pregnancy test, ethanol"],
 tx:["Direct pressure and tourniquets for extremity hemorrhage","Balanced transfusion (1:1:1) via massive transfusion protocol; minimize crystalloid","TXA 1 g over 10 min then 1 g over 8 hours within 3 hours of injury","Permissive hypotension (SBP about 80–90) in penetrating trauma without head injury"],
 dz:["Unstable with positive FAST → OR; unstable with negative FAST → look for pelvis, chest, long bones, external loss"],
 ev:[["CRASH-2 (Lancet 2010)","TXA within 3 hours reduced bleeding deaths; after 3 hours it increased them."],["PROPPR (JAMA 2015)","1:1:1 achieved hemostasis more often and reduced early exsanguination deaths compared with 1:1:2."]],
 pr:["Tachycardia may be absent in the elderly, athletes and β-blocked patients.","The lethal triad: hypothermia, acidosis, coagulopathy; keep the patient warm."],
 q:["Within what time window should TXA be given after injury?","Within 3 hours (ideally within 1 hour)."]},

{id:"tr2",u:8,t:"Trauma in the elderly and in pregnancy",r:["255","256"],
 bl:"Older adults get badly hurt by low-energy mechanisms and decompensate late; lower your threshold to image and admit. In pregnancy, resuscitate the mother first; the fetus depends on maternal perfusion.",
 wk:["Elderly: CT head liberally (anticoagulants), lactate, consider occult shock","Pregnancy: fetal heart rate, cardiotocographic monitoring for 4–6 hours after trauma over 20 weeks, Kleihauer–Betke for Rh-negative mothers"],
 tx:["Reverse anticoagulation early in elderly with significant bleeding","Pregnancy: left lateral tilt or manual uterine displacement, Rh immune globulin for Rh-negative mothers with abdominal trauma"],
 pr:["Placental abruption can occur with minor trauma; contractions or vaginal bleeding warrant monitoring.","Rib fractures in elderly carry substantial mortality; aggressive analgesia (nerve blocks) and incentive spirometry."],
 q:["How long should a pregnant trauma patient over 20 weeks be monitored?","At least 4–6 hours of cardiotocographic monitoring, longer if contractions, bleeding or abnormal tracing."]},

{id:"tr3",u:8,t:"Head trauma",r:["257"],
 bl:"Prevent secondary brain injury: avoid hypotension and hypoxia. Use decision rules to image mild head injury; manage severe TBI with oxygenation, normocapnia, BP support, and treatment of herniation.",
