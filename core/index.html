 pr:["Teardrop pupil suggests globe rupture.","Orbital floor fracture with entrapment in children (white-eyed blowout) needs urgent surgery."],
 q:["First step in a chemical eye injury?","Immediate copious irrigation, before history or exam."]},

{id:"eye4",u:19,t:"Acute vision loss, neuro-ophthalmology and ear disorders",r:["241@1598-1605","242"],
 bl:"Acute painful vision loss: angle-closure glaucoma, optic neuritis, giant cell arteritis. Painless: CRAO, CRVO, retinal detachment, vitreous hemorrhage. Ear: otitis externa vs media, mastoiditis, sudden sensorineural hearing loss.",
 tx:["Angle closure: timolol, apraclonidine, pilocarpine (once IOP decreased), acetazolamide 500 mg IV/PO, mannitol for refractory","GCA: prednisone 60 mg or IV methylprednisolone if vision loss","CRAO: stroke pathway; ophthalmology","Sudden sensorineural hearing loss: oral steroids and urgent ENT"],
 pr:["Ocular ultrasound diagnoses retinal detachment and vitreous hemorrhage at the bedside.","Malignant otitis externa: diabetic, severe pain, granulation tissue; IV antipseudomonal antibiotics."],
 q:["Which drug classes lower IOP in acute angle-closure?","Topical β-blocker, α-agonist, miotic (pilocarpine), and carbonic anhydrase inhibitor; osmotic agents if refractory."]},

{id:"ent1",u:19,t:"Face, jaw, nose and sinuses",r:["243","244"],
 bl:"Epistaxis is mostly anterior and responds to pressure and vasoconstrictors. Posterior epistaxis needs packing and ENT. Facial infections can spread to dangerous spaces.",
 tx:["Epistaxis: 15 min of firm pressure, oxymetazoline, cautery, nasal packing; topical TXA","Posterior bleed: balloon device, admission","TMJ dislocation: reduce with downward and backward pressure"],
 ev:[["Topical TXA for epistaxis","Several RCTs showed faster bleeding control and fewer packings, though the NoPAC trial found no benefit over placebo."]],
 pr:["Septal hematoma must be drained to prevent saddle nose deformity.","Sinusitis is usually viral; antibiotics only for persistent (10 days), severe or double-worsening symptoms."],
 q:["What complication follows an undrained nasal septal hematoma?","Septal necrosis, abscess and saddle-nose deformity."]},

{id:"ent2",u:19,t:"Oral and dental emergencies",r:["245"],
 bl:"Dental infections can spread to deep neck spaces (Ludwig’s angina). Avulsed permanent teeth need immediate reimplantation. Dental fractures are classified by Ellis.",
 tx:["Avulsed permanent tooth: reimplant within 60 min or store in milk or saline; splint and dental","Dental abscess: drainage, penicillin or amoxicillin (clindamycin for allergy)","Ludwig’s angina: airway, IV antibiotics (ampicillin-sulbactam), ENT"],
 pr:["Never reimplant primary teeth.","Ellis III (pulp exposure) needs dental evaluation within 24 hours."],
 q:["Best transport medium for an avulsed tooth?","Hank’s solution, or cold milk; saline or saliva if nothing else."]},

{id:"ent3",u:19,t:"Neck, upper airway and airway-device problems",r:["246"],
 bl:"Sore throat killers: epiglottitis, peritonsillar abscess, retropharyngeal abscess, Ludwig’s angina, Lemierre syndrome. Red flags: drooling, trismus, muffled voice, stridor, neck swelling.",
 tx:["Peritonsillar abscess: needle aspiration or I&D, antibiotics (amoxicillin-clavulanate or clindamycin)","Epiglottitis: airway in a controlled setting, ceftriaxone, ENT","Strep pharyngitis (Centor/McIsaac): penicillin or amoxicillin"],
 pr:["Trismus suggests peritonsillar or parapharyngeal abscess.","Lemierre’s: pharyngitis followed by septic jugular thrombophlebitis and lung emboli."],
 q:["What signs suggest a deep neck space infection?","Trismus, drooling, muffled voice, neck swelling or stiffness, stridor."]},

/* ---------- Unit 20: Dermatology ---------- */
{id:"derm1",u:20,t:"Approach to skin disorders",r:["248"],
 bl:"Describe the primary lesion, distribution and systemic signs. Dangerous rashes: SJS/TEN, DRESS, meningococcemia, RMSF, toxic shock, necrotizing fasciitis, pemphigus.",
 wk:["Nikolsky sign, mucosal involvement, fever, eosinophilia, organ involvement"],
 tx:["SJS/TEN: stop culprit drug, burn unit, supportive care","DRESS: stop drug, systemic steroids"],
 pr:["Mucosal involvement plus skin detachment: think SJS/TEN.","Petechiae with fever: meningococcemia until proven otherwise."],
 q:["What sign distinguishes SJS/TEN from many other rashes?","Mucosal involvement with epidermal detachment (positive Nikolsky sign)."]},

{id:"derm2",u:20,t:"Generalized, face and scalp skin disorders",r:["249","250"],
 bl:"Generalized rashes include urticaria, drug eruptions, erythroderma and viral exanthems. Face and scalp: zoster, impetigo, rosacea, seborrheic dermatitis, contact dermatitis.",
 tx:["Urticaria: H1 antihistamines (second-generation), short steroid course for severe","Zoster: valacyclovir 1 g TID 7 days within 72 hours","Impetigo: mupirocin topical or cephalexin for extensive"],
 pr:["Erythroderma can cause high-output heart failure and hypothermia.","Disseminated zoster in immunocompromised: IV acyclovir."],
 q:["Treatment window for antivirals in zoster?","Ideally within 72 hours of rash onset."]},

{id:"derm3",u:20,t:"Skin disorders of the trunk",r:["251"],
 bl:"Trunk rashes include pityriasis rosea, tinea, scabies, psoriasis and secondary syphilis. Blistering diseases (bullous pemphigoid, pemphigus vulgaris) need dermatology.",
 tx:["Scabies: permethrin 5% head to toe, repeat in 1 week; treat contacts","Tinea corporis: topical azoles or terbinafine"],
 pr:["Pityriasis rosea: herald patch, ‘Christmas tree’ distribution.","Secondary syphilis involves palms and soles."],
 q:["What rash classically involves the palms and soles?","Secondary syphilis (also RMSF, hand-foot-mouth disease, erythema multiforme)."]},

{id:"derm4",u:20,t:"Groin, skinfolds and extremities",r:["252","253"],
 bl:"Groin and skinfold rashes: intertrigo, candida, tinea cruris, erythrasma. Extremity rashes: erythema nodosum, vasculitis, cellulitis mimics like stasis dermatitis.",
 tx:["Candida intertrigo: topical azole, keep dry","Stasis dermatitis: compression, emollients; not antibiotics"],
 pr:["Bilateral ‘cellulitis’ is rarely cellulitis.","Palpable purpura suggests vasculitis."],
 q:["Bilateral red legs in a patient with venous insufficiency, no fever. Likely diagnosis?","Stasis dermatitis rather than cellulitis."]}
);
L.push(
/* ---------- Unit 21: Pediatrics ---------- */
{id:"peds1",u:21,t:"Pediatric emergency care and neonatal resuscitation",r:["106","107","108"],
 bl:"Neonatal resuscitation is about ventilation: most newborns who need help need effective breaths. Heart rate is the key indicator of response.",
 tx:["Warm, dry, stimulate; position airway; PPV at 40–60 breaths/min if apneic or HR under 100","Compressions if HR under 60 despite 30 s of effective ventilation; 3:1 ratio","Epinephrine 0.01–0.03 mg/kg IV if HR remains under 60"],
 key:["Use length-based tape (Broselow) or weight-based dosing for every pediatric drug","Target preductal SpO₂ rises gradually over the first 10 minutes"],
 pr:["Ventilation corrective steps: MR SOPA (mask, reposition, suction, open mouth, pressure up, alternative airway).","Most neonatal bradycardia responds to effective ventilation."],
 q:["What’s the first priority in a newborn who isn’t breathing?","Effective positive-pressure ventilation."]},

{id:"peds2",u:21,t:"Resuscitation of children",r:["109"],
 bl:"Pediatric arrest is usually hypoxic or from shock, not cardiac. Recognize compensated shock (tachycardia, poor perfusion) before hypotension appears.",
 tx:["CPR 15:2 with two rescuers; depth one-third AP diameter","Epinephrine 0.01 mg/kg (0.1 mL/kg of 0.1 mg/mL) IV/IO every 3–5 min","Defibrillation 2 J/kg, then 4 J/kg, up to 10 J/kg","Fluid boluses 10–20 mL/kg with reassessment"],
 pr:["Hypotension is a late sign in children.","Minimum SBP: 70 + 2 × age (years) for ages 1–10."],
 q:["What is the initial defibrillation dose for pediatric VF?","2 J/kg, then 4 J/kg."]},

{id:"peds3",u:21,t:"Pediatric trauma",r:["110"],
 bl:"Children have smaller blood volumes, pliable ribs (internal injury without fractures), and different injury patterns. Use PECARN rules to limit CT.",
 tx:["Blood products 10–20 mL/kg for hemorrhagic shock","Solid organ injuries managed nonoperatively when stable"],
 ev:[["PECARN abdominal trauma rule","Identifies children at very low risk of intra-abdominal injury needing intervention."]],
 pr:["Seatbelt sign raises suspicion for bowel and lumbar spine injury (Chance fracture).","Consider abuse when the mechanism doesn’t match the injury."],
 q:["Why can children have lung contusions without rib fractures?","Their chest walls are more compliant and transmit energy to the lungs."]},

{id:"peds4",u:21,t:"Pediatric head and C-spine injuries",r:["111","112"],
 bl:"PECARN head rules identify children at very low risk of clinically important brain injury who don’t need CT. C-spine injuries in young children are often upper cervical.",
 ev:[["PECARN head injury rule (Lancet 2009)","High sensitivity for clinically important TBI with separate rules for under 2 and 2 years and older."],["PECARN C-spine (2024)","A new rule using clinical factors reduced imaging while identifying cervical spine injuries."]],
 tx:["Concussion: brief relative rest then gradual return to activity and school"],
 pr:["SCIWORA: spinal cord injury without radiographic abnormality; MRI if symptoms.","Pseudosubluxation of C2 on C3 is normal in young children."],
 q:["What are the PECARN high-risk findings for children 2 and older?","Altered mental status (GCS under 15 or other signs) or signs of basilar skull fracture."]},

{id:"peds5",u:21,t:"Pediatric airway and vascular access",r:["113","114"],
 bl:"Children desaturate faster; preoxygenate well. Use cuffed tubes sized by age. IO access is fast and reliable in critically ill children.",
 tx:["Cuffed ETT size: (age/4) + 3.5; depth about 3 × tube size","RSI: ketamine 1–2 mg/kg or etomidate 0.3 mg/kg; rocuronium 1 mg/kg","IO: proximal tibia below the tibial tuberosity"],
 pr:["Large occiput: place a roll under the shoulders in infants.","Atropine premedication isn’t routine except in bradycardic infants."],
 q:["Cuffed ETT size for a 4-year-old?","About 4.5 mm ID."]},

{id:"peds6",u:21,t:"Pediatric pain, sedation and SIDS",r:["115","118"],
 bl:"Children need analgesia as much as adults: intranasal fentanyl, topical anesthetics, and ketamine sedation. SIDS is a diagnosis of exclusion after death investigation; support families and follow child death protocols.",
 tx:["Intranasal fentanyl 1.5–2 mcg/kg","Ketamine sedation 1.5 mg/kg IV or 4 mg/kg IM","Topical LET for lacerations, EMLA or LMX for IV starts"],
 pr:["Safe sleep counseling: back to sleep, own crib, no soft bedding.","Distraction and child life specialists reduce distress."],
 q:["Intranasal fentanyl dose for children?","1.5–2 mcg/kg."]},

{id:"peds7",u:21,t:"Neonatal problems and BRUE",r:["116","117"],
 bl:"Neonates present with jaundice, feeding problems, sepsis and congenital disease. BRUE is a brief resolved event; low-risk infants can go home with minimal testing.",
 wk:["Jaundice: total and direct bilirubin; direct hyperbilirubinemia is always pathologic","BRUE low-risk criteria: over 60 days, born at 32+ weeks, first event, under 1 minute, no CPR by trained provider, normal exam"],
 tx:["Phototherapy by bilirubin nomograms","Neonatal sepsis: ampicillin plus gentamicin or cefotaxime/ceftazidime, acyclovir if HSV possible"],
 pr:["Bilious vomiting in a neonate is malrotation with volvulus until proven otherwise.","Ductal-dependent heart lesions present in the first 2 weeks with shock or cyanosis: PGE1."],
 q:["What does bilious emesis in a neonate require?","Emergent evaluation for malrotation with volvulus (upper GI series, surgery consult)."]},

{id:"peds8",u:21,t:"Fever in infants and meningitis",r:["119","120"],
 bl:"Febrile infants under 90 days need structured risk assessment for serious bacterial infection. Use validated rules (AAP 2021, PECARN) with procalcitonin when available.",
 wk:["8–21 days: full workup (UA, blood culture, LP), admit, antibiotics","22–28 days: UA, blood culture, inflammatory markers; LP often","29–60 days: UA and inflammatory markers guide LP"],
 tx:["Under 28 days: ampicillin plus ceftazidime or gentamicin; acyclovir for HSV risk","Over 28 days with meningitis: ceftriaxone plus vancomycin"],
 ev:[["AAP febrile infant guideline (2021)","Age-stratified approach using inflammatory markers and UA for well-appearing infants 8–60 days."]],
 pr:["Hypothermia in neonates can indicate sepsis.","HSV can present without vesicles in neonates."],
 q:["What’s the approach to a febrile 2-week-old?","Full sepsis evaluation including LP, empiric antibiotics (and acyclovir if indicated), and admission."]},

{id:"peds9",u:21,t:"Pediatric ear and eye emergencies",r:["121","122"],
 bl:"Otitis media is overdiagnosed; use strict criteria. Mastoiditis and periorbital/orbital cellulitis are complications to recognize.",
 tx:["AOM: amoxicillin 80–90 mg/kg/day divided BID; watchful waiting in selected children over 6 months","Mastoiditis: IV antibiotics, CT, ENT","Periorbital cellulitis: oral antibiotics if mild; orbital needs IV and CT"],
 pr:["Bulging TM is the most specific sign of AOM.","Leukocoria in a child: retinoblastoma."],
 q:["First-line antibiotic for AOM?","High-dose amoxicillin (80–90 mg/kg/day)."]},

{id:"peds10",u:21,t:"Nose, mouth, throat and neck masses in children",r:["123","124","125"],
 bl:"Most pediatric neck masses are reactive lymph nodes; congenital cysts and infection are common. Pharyngitis is mostly viral; strep testing when appropriate.",
 tx:["Strep pharyngitis: amoxicillin 50 mg/kg once daily (max 1 g) for 10 days","Nasal foreign body: positive pressure (mother’s kiss)","Lymphadenitis: cephalexin or clindamycin"],
 pr:["Unilateral foul-smelling nasal discharge: foreign body.","Kawasaki disease includes cervical lymphadenopathy."],
 q:["What’s the ‘mother’s kiss’ technique?","Parent occludes the unaffected nostril and blows into the child’s mouth to expel a nasal foreign body."]},

{id:"peds11",u:21,t:"Stridor and drooling",r:["126"],
 bl:"Croup is the most common cause of stridor; steroids work. Epiglottitis, bacterial tracheitis, retropharyngeal abscess and foreign body are the dangerous mimics.",
 tx:["Croup: dexamethasone 0.15–0.6 mg/kg PO; nebulized epinephrine for stridor at rest","Foreign body: rigid bronchoscopy","Bacterial tracheitis: airway management, antibiotics"],
 ev:[["Bjornson (NEJM 2004)","Single-dose dexamethasone reduced return visits in mild croup."]],
 pr:["Observe at least 2–4 hours after nebulized epinephrine.","Keep a child with suspected epiglottitis calm and with the parent."],
 q:["Treatment for croup with stridor at rest?","Dexamethasone plus nebulized epinephrine."]},

{id:"peds12",u:21,t:"Wheezing in infants and children",r:["127"],
 bl:"Bronchiolitis is supportive care; asthma responds to bronchodilators and steroids. Know the difference and avoid unnecessary treatments.",
 tx:["Bronchiolitis: suction, hydration, oxygen if SpO₂ under 90%, HFNC for distress; no routine albuterol or steroids","Pediatric asthma: albuterol, ipratropium, dexamethasone 0.6 mg/kg, magnesium for severe"],
 pr:["Bronchiolitis peaks on days 3–5.","Apnea is a risk in young infants with RSV."],
 q:["Is albuterol routinely recommended for bronchiolitis?","No; AAP recommends against routine bronchodilators."]},

{id:"peds13",u:21,t:"Pediatric pneumonia, syncope and dysrhythmias",r:["128","130"],
 bl:"Pediatric pneumonia: amoxicillin for most. Syncope in children is usually vasovagal; exertional syncope needs cardiac workup. SVT is the most common pediatric tachyarrhythmia.",
 tx:["CAP outpatient: amoxicillin 90 mg/kg/day","SVT: vagal maneuvers (ice to face in infants), adenosine 0.1 mg/kg then 0.2 mg/kg"],
 pr:["Infant SVT rates often exceed 220.","Exertional syncope, family history of sudden death, abnormal EKG: cardiology."],
 q:["Adenosine dose for pediatric SVT?","0.1 mg/kg (max 6 mg), then 0.2 mg/kg (max 12 mg)."]},

{id:"peds14",u:21,t:"Congenital and acquired heart disease",r:["129"],
 bl:"Cyanotic or shocked neonate in the first weeks: ductal-dependent lesion; give prostaglandin E1. Myocarditis and Kawasaki disease are acquired heart emergencies.",
 tx:["PGE1 0.05–0.1 mcg/kg/min; watch for apnea","Kawasaki: IVIG 2 g/kg and aspirin","Tet spell: knee-to-chest, oxygen, morphine, phenylephrine"],
 pr:["Hyperoxia test separates cardiac from pulmonary cyanosis.","Myocarditis mimics viral illness with tachycardia out of proportion."],
 q:["Main side effect of PGE1 to watch for?","Apnea."]},

{id:"peds15",u:21,t:"Vomiting, diarrhea, dehydration and fluids",r:["131","132"],
 bl:"Most pediatric gastroenteritis is managed with oral rehydration and ondansetron. Severe dehydration needs IV boluses. Know maintenance fluid calculations.",
 tx:["Ondansetron 0.15 mg/kg PO","ORS 50–100 mL/kg over 4 hours","IV: 20 mL/kg isotonic bolus; maintenance by 4-2-1 rule with isotonic fluids"],
 ev:[["Freedman (NEJM 2006)","Ondansetron improved oral rehydration success in pediatric gastroenteritis."]],
 pr:["Capillary refill over 2 s, abnormal skin turgor and abnormal respirations are the best signs of dehydration.","Pyloric stenosis: projectile non-bilious vomiting, 2–8 weeks old, hypochloremic alkalosis."],
 q:["What’s the 4-2-1 rule?","Maintenance fluid: 4 mL/kg/h for the first 10 kg, 2 for the next 10, 1 for each kg above 20."]},

{id:"peds16",u:21,t:"Pediatric abdominal pain and GI bleeding",r:["133","134"],
 bl:"Age guides the differential: intussusception (6 months–3 years), appendicitis (school age), malrotation (neonates). GI bleeding in children: fissure, Meckel’s, intussusception.",
 tx:["Intussusception: ultrasound, air or contrast enema reduction","Meckel’s: technetium scan, surgery"],
 pr:["Intussusception presents with intermittent colicky pain and lethargy; currant jelly stool is late.","Painless rectal bleeding in a toddler: Meckel’s diverticulum."],
 q:["Imaging test of choice for intussusception?","Ultrasound."]},

{id:"peds17",u:21,t:"Pediatric UTI and urologic/gynecologic disorders",r:["135","136"],
 bl:"UTI in young children causes fever without source; catheter specimens are standard in non-toilet-trained children. Testicular torsion and ovarian torsion occur in children.",
 tx:["UTI: cephalexin or cefdinir; IV for ill-appearing or under 2 months","Labial adhesions: topical estrogen if symptomatic","Phimosis/paraphimosis: reduction, urology"],
 pr:["Bag urine samples are for screening only.","Testicular torsion peaks in adolescents; also in neonates."],
 q:["Preferred urine collection in a febrile non-toilet-trained child?","Catheterization (or suprapubic aspiration)."]},

{id:"peds18",u:21,t:"Pediatric renal emergencies and diabetes",r:["137","147"],
 bl:"HUS: anemia, thrombocytopenia, AKI after bloody diarrhea. Nephrotic syndrome: edema, proteinuria, infection and clot risk. Pediatric DKA: cerebral edema is the major risk.",
 tx:["DKA: 10–20 mL/kg bolus, insulin 0.05–0.1 units/kg/h without bolus","Cerebral edema: mannitol 0.5–1 g/kg or 3% saline","HUS: supportive, dialysis; avoid antibiotics and antimotility drugs"],
 ev:[["PECARN FLUID (NEJM 2018)","Fluid rate and sodium content didn’t affect neurologic outcomes in pediatric DKA."]],
 pr:["Headache, bradycardia or altered mental status in DKA: cerebral edema.","Peritonitis in nephrotic syndrome: pneumococcus."],
 q:["Classic triad of HUS?","Microangiopathic hemolytic anemia, thrombocytopenia, and AKI."]},

{id:"peds19",u:21,t:"Pediatric seizures and altered mental status",r:["138","140"],
 bl:"Simple febrile seizures (6 months–5 years, generalized, under 15 minutes, once in 24 h) need no workup beyond finding the fever source. Status in children: benzodiazepines then second-line agents.",
 tx:["Midazolam 0.2 mg/kg intranasal or buccal, 0.2 mg/kg IM, or lorazepam 0.1 mg/kg IV","Second line: levetiracetam 60 mg/kg, fosphenytoin 20 PE/kg, valproate 40 mg/kg"],
 pr:["Complex febrile seizures need more evaluation.","AMS in children: ingestion, abuse, infection, metabolic."],
 q:["Define simple febrile seizure.","Generalized, under 15 minutes, not recurring within 24 hours, age 6 months–5 years, with fever."]},

{id:"peds20",u:21,t:"Headache and children with special healthcare needs",r:["139","148"],
 bl:"Headache red flags in children: occipital location, awakening from sleep, vomiting, neuro findings, age under 6. Children with special needs: devices (trachs, G-tubes, shunts, central lines) and complex care plans.",
 tx:["Pediatric migraine: ibuprofen, prochlorperazine, fluids","Trach obstruction: suction, change the tube"],
 pr:["Ask parents what’s ‘baseline’; they know.","Central line fever: blood cultures and empiric antibiotics."],
 q:["What’s the first step for a child with an obstructed trach tube?","Suction; if that fails, change the tube."]},

{id:"peds21",u:21,t:"Pediatric orthopedics: principles and upper extremity",r:["141@949-961"],
 bl:"Children’s bones bend, buckle and fracture through growth plates. Supracondylar fractures threaten the brachial artery and median nerve.",
 tx:["Supracondylar: assess anterior humeral line and neurovascular status; ortho for displaced","Nursemaid’s elbow: hyperpronation or supination-flexion reduction","Torus fractures: removable splint"],
 pr:["Posterior fat pad in a child: occult supracondylar fracture.","Fractures in non-ambulatory infants: consider abuse."],
 q:["Best reduction for nursemaid’s elbow?","Hyperpronation (more successful than supination-flexion)."]},

{id:"peds22",u:21,t:"Pediatric orthopedics: lower extremity and nontraumatic",r:["141@962-970"],
 bl:"Limping child: transient synovitis vs septic arthritis (Kocher criteria). SCFE in overweight adolescents. Toddler’s fracture.",
 ev:[["Kocher criteria","Non-weight bearing, fever over 38.5, ESR over 40, WBC over 12,000; risk of septic arthritis rises with each."]],
 tx:["Septic hip: aspiration and washout","SCFE: non-weight bearing, ortho"],
 pr:["Knee pain in adolescent: check the hip (SCFE).","Osgood-Schlatter: tibial tuberosity pain in active adolescents."],
 q:["Name the four Kocher criteria.","Non-weight bearing, fever over 38.5°C, ESR over 40, WBC over 12,000."]},

{id:"peds23",u:21,t:"Rashes in children: infections",r:["142@970-981"],
 bl:"Viral exanthems (measles, varicella, roseola, fifth disease, hand-foot-mouth) are usually benign; recognize meningococcemia and scarlet fever.",
 tx:["Scarlet fever: penicillin or amoxicillin","Meningococcemia: ceftriaxone immediately; prophylaxis for close contacts"],
 pr:["Petechiae and fever: meningococcemia until proven otherwise.","Roseola: rash appears after fever resolves."],
 q:["When does the rash of roseola appear?","After the fever breaks."]},

{id:"peds24",u:21,t:"Rashes in children: infestations, neonatal and drug reactions",r:["142@982-989"],
 bl:"Neonatal rashes are mostly benign. Kawasaki: fever 5 days plus 4 of 5 criteria. Drug reactions range from urticaria to SJS.",
 tx:["Kawasaki: IVIG 2 g/kg and aspirin","Scabies: permethrin"],
 pr:["Erythema toxicum is benign; neonatal pustules with fever need workup.","Incomplete Kawasaki in infants is common."],
 q:["Name the five Kawasaki criteria.","Conjunctivitis, oral changes, cervical lymphadenopathy, extremity changes, polymorphous rash (with fever for 5+ days)."]},

{id:"peds25",u:21,t:"Pediatric sickle cell and hematologic emergencies",r:["143","144"],
 bl:"Febrile children with sickle cell need blood culture and ceftriaxone. Splenic sequestration causes acute anemia and shock. ITP is usually benign in children.",
 tx:["Fever in sickle cell: ceftriaxone, blood culture","Splenic sequestration: transfusion","ITP: observation or IVIG/steroids for bleeding"],
 pr:["Aplastic crisis (parvovirus B19): low reticulocyte count.","Bruising in unusual places: consider abuse and leukemia."],
 q:["Treatment for a febrile child with sickle cell disease?","Blood cultures and IV ceftriaxone promptly."]},

{id:"peds26",u:21,t:"Pediatric oncologic emergencies",r:["145"],
 bl:"Leukemia presents with bone pain, pallor, bruising and fever. Emergencies: febrile neutropenia, tumor lysis, mediastinal mass (avoid sedation), hyperleukocytosis.",
 tx:["Febrile neutropenia: cefepime within 1 hour","Mediastinal mass: avoid sedation or supine positioning"],
 pr:["Anterior mediastinal mass can cause airway collapse under sedation.","Hyperleukocytosis: avoid transfusion (increases viscosity)."],
 q:["Why avoid sedating a child with an anterior mediastinal mass?","Loss of muscle tone can cause airway or vascular collapse."]},

{id:"peds27",u:21,t:"Metabolic emergencies and behavioral disorders",r:["146","149"],
 bl:"Inborn errors of metabolism present with vomiting, lethargy, hypoglycemia or hyperammonemia. Behavioral emergencies in children: de-escalation, safety, and medical screening.",
 tx:["Suspected metabolic crisis: stop feeds, dextrose 10% at 1.5× maintenance, check ammonia","Agitation: verbal de-escalation, then medications as needed"],
 pr:["Hypoglycemia without ketones in a child: fatty acid oxidation defect or hyperinsulinism.","Screen for suicide risk in adolescents."],
 q:["What’s the initial management of suspected inborn error crisis?","Stop protein, give dextrose (D10) at high rates, check ammonia, glucose and gas."]},

{id:"peds28",u:21,t:"Child abuse and neglect",r:["150"],
 bl:"Recognize sentinel injuries: bruising in non-mobile infants, patterned bruises, burns, and fractures inconsistent with history. Report suspected abuse; you don’t need proof.",
 wk:["TEN-4-FACESp bruising rule","Skeletal survey under 2 years; head imaging in infants; LFTs, lipase, UA"],
 pr:["‘Those who don’t cruise rarely bruise.’","Metaphyseal corner fractures and posterior rib fractures are highly specific."],
 q:["What does TEN-4 stand for?","Bruising on torso, ears, neck in children under 4, or any bruising under 4 months."]}
);
L.push(
/* ---------- Unit 22: Psychiatry, abuse & special situations ---------- */
{id:"psych1",u:22,t:"Mental health evaluation, agitation and the elderly",r:["286","287","288"],
 bl:"Medical screening of psychiatric patients is focused, not reflexive: history, exam and vitals find most medical causes. Agitation: verbal de-escalation first, then medications; restraints last.",
 tx:["Agitation: droperidol 5–10 mg IM, olanzapine 10 mg IM, haloperidol 5 mg + lorazepam 2 mg IM, ketamine 4–5 mg/kg IM for severe","Elderly delirium: treat the cause; low-dose haloperidol or quetiapine if needed"],
 ev:[["Droperidol for agitation","Faster sedation than haloperidol or midazolam alone with a low rate of QT-related events in ED studies."]],
 pr:["Avoid olanzapine IM within an hour of IV benzodiazepines (respiratory depression).","New psychosis after age 40: medical cause until proven otherwise."],
 q:["What’s the first step in managing an agitated patient?","Verbal de-escalation, while ensuring safety."]},

{id:"psych2",u:22,t:"Mood, anxiety and psychotic disorders",r:["289","290"],
 bl:"Screen for suicide risk in every patient with a mood disorder. Psychosis: evaluate medical and substance causes, keep the patient and staff safe, and arrange psychiatry.",
 wk:["Suicide screening (ASQ, Columbia); means restriction counseling","Medical causes of psychosis: delirium, intoxication, withdrawal, CNS lesions, thyroid, autoimmune encephalitis"],
 tx:["Anxiety/panic: reassurance, short-acting benzodiazepine sparingly","Acute psychosis: antipsychotic (oral olanzapine or risperidone if cooperative)"],
 pr:["Ask directly about suicidal thoughts; it doesn’t increase risk.","Lethal means counseling (firearms, medication) is effective."],
 q:["Does asking about suicide increase risk?","No."]},

{id:"psych3",u:22,t:"Eating disorders and substance use",r:["291","292"],
 bl:"Anorexia nervosa has the highest mortality of psychiatric disorders: bradycardia, electrolyte abnormalities and refeeding syndrome. Substance use disorders: screen, treat withdrawal and start treatment in the ED.",
 tx:["Eating disorders: correct electrolytes (K, Mg, phosphate); admit for HR under 50, hypotension, orthostasis, severe electrolyte abnormalities","Opioid use disorder: buprenorphine initiation; naloxone kits","Alcohol use disorder: naltrexone or acamprosate referrals"],
 pr:["Refeeding syndrome: hypophosphatemia days after nutrition starts.","SBIRT: screening, brief intervention, referral to treatment."],
 q:["What electrolyte drop defines refeeding syndrome?","Hypophosphatemia."]},

{id:"abuse",u:22,t:"Sexual assault, intimate partner violence and elder abuse",r:["293","294","295"],
 bl:"Trauma-informed care: privacy, consent, and choice. Offer forensic exam, STI prophylaxis, emergency contraception and HIV PEP after sexual assault. Screen for IPV and elder abuse; document carefully.",
 tx:["Post-assault: ceftriaxone 500 mg IM, doxycycline 100 mg BID 7 days, metronidazole 500 mg BID 7 days (women), HIV PEP within 72 h, levonorgestrel or ulipristal","Hepatitis B vaccine and HPV vaccine as indicated"],
 pr:["Strangulation in IPV is a predictor of homicide; image the neck vessels when indicated.","Elder abuse includes neglect and financial exploitation."],
 q:["Within what time frame must HIV PEP start after sexual assault?","Within 72 hours (ideally as soon as possible)."]},

{id:"special1",u:22,t:"Injection drug use, obesity and transgender patients",r:["296","298","299"],
 bl:"People who inject drugs present with skin infections, endocarditis, epidural abscess, and withdrawal. Obesity affects airway, dosing and imaging. Transgender patients need respectful, informed care and attention to hormone therapy complications.",
 tx:["Abscess: I&D; consider MRSA coverage","Obesity: RSI drugs by ideal or adjusted body weight; ramp positioning"],
 pr:["Fever in PWID: blood cultures and echo for endocarditis.","Ask patients their name and pronouns; document accordingly."],
 q:["Why use ramped positioning in obese patients for intubation?","It aligns the ear and sternal notch, improving view and functional residual capacity."]},

function itemSpan(c){const[n,r]=c.split('@');if(r){const[a,b]=r.split('-').map(Number);return[a,b]}return[CH[n][1],CH[n][2]]}
const printed=p=>p-BOOK.printOff;
function itemLabel(c){const[n,r]=c.split('@'),[a,b]=itemSpan(c);
  return{bk:'Ch. '+n+(r?' · part':''),ch:CH[n][0],pp:'pp. '+printed(a)+'–'+printed(b)}}
function itemsOf(l){return l.r}

const KEY='panacea.core.v1';
let S={done:{},notes:{},read:{}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){S.done=r.done||{};S.notes=r.notes||{};S.read=r.read||{}}}catch(e){}
let saveT=null;function writeNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}scheduleSync()}
function save(){clearTimeout(saveT);saveT=setTimeout(writeNow,250)}

const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDay=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDone=id=>!!(S.done[id]&&S.done[id].on);
const isRead=(l,c)=>!!(S.read[l+':'+c]&&S.read[l+':'+c].on);
const IDX=Object.fromEntries(L.map((l,i)=>[l.id,i]));
const unitOf=u=>UNITS.find(x=>x.n===u);
function current(){return L.find(l=>!isDone(l.id))||null}
function doneToday(){const t=today();return L.filter(l=>isDone(l.id)&&S.done[l.id].day===t)}
function streak(){
  const days=new Set(Object.values(S.done).filter(d=>d.on).map(d=>d.day));
  let n=0;const d=new Date();if(!days.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n}

/* ---------- optional sync: reuses ICU Rounder's private GitHub repo setup on this device ---------- */
const SYNC_FILE='core.json';
let SY=null;try{SY=JSON.parse(localStorage.getItem('icu-rounds-sync')||'null')}catch(e){}
let syncState=SY?'idle':'off',syncing=false,syncAgain=false,syncT=null;
const b64enc=str=>{const b=new TextEncoder().encode(str);let s2='';for(const x of b)s2+=String.fromCharCode(x);return btoa(s2)};
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${SY.owner}/${SY.repo}${path}`,{cache:'no-store',...opts,
    headers:{Authorization:`Bearer ${SY.token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return (opts.headers&&opts.headers.Accept||'').includes('raw')?r.text():r.json()}
async function remoteGet(){
  try{const m=await gh('/contents/'+SYNC_FILE);const txt=m.content?b64dec(m.content):await gh('/contents/'+SYNC_FILE,{headers:{Accept:'application/vnd.github.raw+json'}});
    let doc=null;try{doc=JSON.parse(txt)}catch(e){}return{doc,sha:m.sha}}
  catch(e){if(e.status===404||e.status===409)return{doc:null,sha:null};throw e}}
function mergeMap(a,b){const out={...(b||{})};for(const[k,v]of Object.entries(a||{}))if(!out[k]||(v.ts||0)>=(out[k].ts||0))out[k]=v;return out}
const PARTS=['done','notes','read'];
function setSync(s){syncState=s;const d=document.getElementById('syncdot');if(d){d.className='syncdot '+s;d.title=syncTitle()}}
function syncTitle(){return{off:'Saved on this device',idle:'Sync ready',syncing:'Syncing…',ok:'Synced across devices',error:'Not synced right now; saved on this device'}[syncState]}
function scheduleSync(ms=1200){if(!SY)return;clearTimeout(syncT);syncT=setTimeout(syncNow,ms)}
async function syncNow(){if(!SY)return;clearTimeout(syncT);if(syncing){syncAgain=true;return}syncing=true;setSync('syncing');
  try{for(let attempt=0;;attempt++){
      const rem=await remoteGet();
      if(rem.doc){let changed=false;
        for(const k of PARTS){const m=mergeMap(S[k],rem.doc[k]);if(JSON.stringify(m)!==JSON.stringify(S[k]))changed=true;S[k]=m}
        if(changed){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}softRender()}}
      const out={app:'core',version:1,updated:new Date().toISOString()};for(const k of PARTS)out[k]=S[k];
      if(rem.doc&&PARTS.every(k=>JSON.stringify(rem.doc[k]||{})===JSON.stringify(out[k])))break;
      try{await gh('/contents/'+SYNC_FILE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Core sync',content:b64enc(JSON.stringify(out)),...(rem.sha?{sha:rem.sha}:{})})});break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}}
    setSync('ok')}
  catch(e){setSync('error')}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(300)}}}
function softRender(){const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA')return;render(true)}
if(SY){syncNow();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});window.addEventListener('online',syncNow)}

let dbP=null;
function db(){return dbP||(dbP=new Promise((res,rej)=>{const r=indexedDB.open('core-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files',mode);const st=tx.objectStore('files');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
let pdfjsP=null;
function loadPdfjs(){return pdfjsP||(pdfjsP=new Promise((res,rej)=>{if(window.pdfjsLib){res();return}const sc=document.createElement('script');sc.src=PDFJS;
  sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');res()};sc.onerror=()=>{pdfjsP=null;rej(new Error('Couldn’t load the PDF reader. Check your connection.'))};document.head.appendChild(sc)}))}
let DOC=null;
async function getDoc(){if(DOC)return DOC;
  const blob=await idb('readonly',st=>st.get('T'));if(!blob)throw new Error('That PDF isn’t on this device anymore. Link it again.');
  await loadPdfjs();DOC=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;return DOC}
/* For a different printing of the PDF: read printed page numbers to line pages up. */
async function detectOffset(doc){
  const N=doc.numPages,votes={};let used=0;
  for(let k=0;k<30;k++){const i=Math.round(60+(N-120)*(k+.5)/30);let tc;try{tc=await(await doc.getPage(i)).getTextContent()}catch(e){continue}
    const seen=new Set();let any=false;
    for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;any=true;if(!/^\d{1,4}$/.test(s))continue;const n=+s;if(n<1||n>2100)continue;seen.add(i-n)}
    if(any)used++;for(const o of seen)votes[o]=(votes[o]||0)+1}
  let best=null,bv=0;for(const[o,v]of Object.entries(votes))if(v>bv){bv=v;best=+o}
  return bv>=Math.max(3,Math.ceil(used*.3))?best-BOOK.printOff:null}
let linking=false;
async function linkBook(file){linking=true;render(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    let doc=null,pages=null,shift=0;
    try{await loadPdfjs();doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;pages=doc.numPages;
      if(pages!==BOOK.pages){const o=await detectOffset(doc);if(o!==null)shift=o}}catch(e){}
    await idb('readwrite',st=>st.put(file,'T'));DOC=doc;
    BM.T={name:file.name,size:file.size,pages,shift,at:Date.now()};saveBM();
    toast(!pages?'Linked, but the file couldn’t be read as a PDF.':pages===BOOK.pages?'Tintinalli’s linked.':'Linked. This copy differs from the 9th edition PDF; if pages look off, use the shift buttons in the reader.')}
  catch(e){toast(e&&e.name==='QuotaExceededError'?'Not enough storage on this device for that file.':'Couldn’t save that file on this device.')}
  linking=false;render(true)}
async function unlinkBook(){try{await idb('readwrite',st=>st.delete('T'))}catch(e){}delete BM.T;DOC=null;saveBM();render(true)}
const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+' MB';
function renderBooks(){
  document.title='Your PDF · Core';header('Your PDF','#bback');
  const m=BM.T;
  const st=linking?'<span class="st">Saving… a large book can take a minute.</span>':m?(m.pages&&m.pages!==BOOK.pages?`<span class="st bad">Linked · ${m.pages} pages, expected ${BOOK.pages}; pages may be shifted</span>`:`<span class="st ok">Linked · ${esc(m.name)} · ${mb(m.size)}</span>`):'<span class="st">Not linked</span>';
  app.innerHTML=`<div class="card"><p style="margin:0 0 4px">Pick your copy of Tintinalli’s once on this device. Every reading then opens straight to its chapter.</p>
   <p class="note" style="margin-top:6px">The file stays in this browser only. It isn’t uploaded, synced, or added to PANACEA, so link it again on each phone or computer. Progress and notes do sync.</p></div>
   <div class="card"><div class="bkrow"><div class="tx"><div class="nm">${esc(BOOK.short)}</div><div class="st" style="margin-bottom:2px">${esc(BOOK.full)}</div>${st}</div>
   <div class="btnrow" style="flex:none;flex-direction:column;align-items:stretch">
   <label class="btn sm filebtn">${m?'Replace':'Choose PDF'}<input type="file" accept="application/pdf,.pdf" data-file="T"></label>
   ${m?`<button class="linkbtn" data-a="unlink">Remove</button>`:''}</div></div></div>`}

let RD=null;
function closeReader(){if(RD){RD.obs&&RD.obs.disconnect();RD.vis&&RD.vis.disconnect();RD.dead=true;RD=null}const c=document.getElementById('pgchip');if(c)c.remove()}
async function renderReader(c){
  closeReader();
  const n=c.split('@')[0],[a,b]=itemSpan(c),x=itemLabel(c);
  document.title='Ch. '+n+' · Core';header('Ch. '+n+' · '+CH[n][0],'#rback');
  if(!BM.T){app.innerHTML=`<div class="card" style="margin-top:12px"><p style="margin:0 0 10px">Link your PDF on this device to read here.</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  app.innerHTML=`<div class="eyebrow" style="margin-top:6px">Chapter ${esc(n)}${c.includes('@')?' · part':''} · ${esc(x.pp)}</div><h2 class="lt" style="font-size:1.3rem">${esc(CH[n][0])}</h2><div class="reader" id="rdr"><div class="loading">Opening…</div></div>`;
  const me=RD={dead:false};
  let doc;try{doc=await getDoc()}catch(e){if(!me.dead)document.getElementById('rdr').innerHTML=`<div class="card" style="width:100%"><p style="margin:0 0 10px">${esc(e.message)}</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  if(me.dead)return;
  const sh=BM.T.shift||0,s=a+sh,e=b+sh,N=doc.numPages;
  const f0=await doc.getPage(Math.min(Math.max(s,1),N));const vp1=f0.getViewport({scale:1});const ratio=vp1.height/vp1.width;
  if(me.dead)return;
  const box=document.getElementById('rdr');box.innerHTML='';
  const cal=document.createElement('div');cal.className='cal';
  cal.innerHTML=`<span class="tx">Starts on PDF page ${s}.${sh?` Shifted ${sh>0?'+':''}${sh}.`:''} Pages off?</span><button class="btn sm" data-a="shift" data-d="-1" aria-label="Shift back one page">−1</button><button class="btn sm" data-a="shift" data-d="1" aria-label="Shift forward one page">+1</button>`;
  box.appendChild(cal);
  for(let p=s;p<=e;p++){const d=document.createElement('div');const ok=p>=1&&p<=N;d.className='pg'+(ok?'':' miss');d.dataset.p=p;d.style.aspectRatio=(1/ratio).toFixed(4);d.innerHTML=`<span class="pn">p. ${printed(p-sh)}</span>${ok?'':'Not in this PDF'}`;box.appendChild(d)}
  const end=document.createElement('div');end.className='btnrow';end.style.margin='14px 0 64px';end.innerHTML=`<button class="btn" data-go="#rback">Back to the lesson</button>`;box.appendChild(end);
  const chip=document.createElement('div');chip.className='pgchip';chip.id='pgchip';chip.textContent=`Page 1 of ${e-s+1}`;document.body.appendChild(chip);
  const rendered=new Map();
  async function draw(el){const p=+el.dataset.p;if(rendered.has(p)||me.dead||el.classList.contains('miss'))return;rendered.set(p,'busy');
    try{const pg=await doc.getPage(p);if(me.dead)return;const w=el.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(me.dead||!rendered.has(p))return;el.prepend(cv);rendered.set(p,cv)}
    catch(err){rendered.delete(p)}}
  function drop(el){const p=+el.dataset.p,cv=rendered.get(p);if(cv&&cv!=='busy'){cv.width=cv.height=0;cv.remove()}rendered.delete(p)}
  me.obs=new IntersectionObserver(es=>{for(const x of es){if(x.isIntersecting)draw(x.target);else drop(x.target)}},{rootMargin:'1200px 0px'});
  me.vis=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){chip.textContent=`Page ${+x.target.dataset.p-s+1} of ${e-s+1}`}},{rootMargin:'-45% 0px -45% 0px'});
  box.querySelectorAll('.pg').forEach(el=>{me.obs.observe(el);me.vis.observe(el)});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const to=g.dataset.go;if(to==='#l/')return;
    if(to==='#today'){location.hash='';return}
    if(to==='#rback'){location.hash=sessionStorage.getItem('core.readBack')||'';return}
    if(to==='#bback'){const v=sessionStorage.getItem('core.booksBack');location.hash=v===null?'all':v;sessionStorage.removeItem('core.booksBack');return}
    if(to==='#'){location.hash=sessionStorage.getItem('core.back')||'';return}
    const v=route().v;if(to.startsWith('#l/')&&v!=='lesson')sessionStorage.setItem('core.back',v==='all'?'all':'');
    if(to==='#books'&&v!=='books')sessionStorage.setItem('core.booksBack',location.hash.slice(1)||'');
    location.hash=to.slice(1);return}
  const rd=e.target.closest('[data-read]');
  if(rd){const c=rd.dataset.read,back=route().v==='today'?'':'l/'+rd.dataset.from;
    sessionStorage.setItem('core.readBack',back);
    if(BM.T)location.hash='read/'+c;else{sessionStorage.setItem('core.booksBack',back);location.hash='books'}return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const A=b.dataset.a;
  if(A==='unlink'){unlinkBook();return}
  if(A==='shift'){if(!BM.T)return;BM.T.shift=(BM.T.shift||0)+(+b.dataset.d);saveBM();const r=route();if(r.v==='read')renderReader(r.c);return}
  if(A==='rtick'){const key=b.dataset.l+':'+b.dataset.c,on=!isRead(b.dataset.l,b.dataset.c);S.read[key]={on,ts:Date.now()};save();
    const li=b.closest('li');li.classList.toggle('rd',on);b.setAttribute('aria-checked',on);
    const l=L[IDX[b.dataset.l]],its=itemsOf(l),n=its.filter(c=>isRead(l.id,c)).length,ct=document.getElementById('rdct');if(ct)ct.textContent=`${n} of ${its.length} read`;
    if(on&&n===its.length&&!isDone(l.id))toast('All readings done. Complete the lesson when you’re ready.');return}
  if(A==='reveal'){const q=document.getElementById('qz');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Hide answer':'Show answer'}
  else if(A==='done'){const id=b.dataset.id;const wasToday=route().v==='today';S.done[id]={on:true,day:today(),ts:Date.now()};save();
    toast('Lesson complete.');if(wasToday){location.hash='';render()}else render(true)}
  else if(A==='undo'){S.done[b.dataset.id]={on:false,day:'',ts:Date.now()};save();render(true)}
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.file&&t.files&&t.files[0])linkBook(t.files[0])});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filter=t.value;const p=t.selectionStart;renderAll();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.note){S.notes[t.dataset.note]={t:t.value,ts:Date.now()};save()}
});
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
window.addEventListener('hashchange',()=>render());
render();
</script>
