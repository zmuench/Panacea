 wk:["Canadian CT Head Rule or New Orleans criteria in GCS 13–15","CT for anticoagulated patients","Severe TBI: GCS, pupils, CT head and C-spine"],
 tx:["Keep SBP ≥100 (age 50–69) or ≥110 (age 15–49 or over 70), and SpO₂ above 94%","Herniation: head up 30°, hyperosmolar therapy (mannitol 1 g/kg or 3% saline 250 mL or 23.4% saline 30 mL), brief hyperventilation as bridge","Seizure prophylaxis (levetiracetam) for 7 days in severe TBI; reverse anticoagulants"],
 dz:["Mild TBI with normal CT and reliable observation can go home with concussion instructions"],
 ev:[["Canadian CT Head Rule (Lancet 2001)","High sensitivity for neurosurgical injury in minor head injury."],["CRASH-3 (Lancet 2019)","TXA within 3 hours reduced head-injury death in mild-to-moderate TBI."]],
 pr:["A single episode of hypotension doubles mortality in severe TBI.","Epidural hematoma: lucid interval, lens-shaped bleed, middle meningeal artery."],
 q:["What two physiologic insults most worsen outcome after severe TBI?","Hypotension and hypoxia."]},

{id:"tr4",u:8,t:"Spine trauma",r:["258"],
 bl:"Clear the cervical spine clinically with NEXUS or the Canadian C-spine Rule when you can; otherwise CT. Spinal cord injury management is about preventing secondary injury: perfusion, oxygenation and early surgical consultation.",
 wk:["CT C-spine for imaging; MRI for neurologic deficits or suspected ligamentous injury","Thoracolumbar: CT if high-risk mechanism, pain, or other fractures"],
 tx:["Spinal motion restriction (collar) rather than long backboards","Neurogenic shock (hypotension with bradycardia): fluids, norepinephrine or phenylephrine; MAP goal 85–90 for 7 days in cord injury","High cord injury: early intubation (diaphragm C3–5)"],
 ev:[["NEXUS (NEJM 2000)","No midline tenderness, no intoxication, normal alertness, no focal deficit, no painful distracting injury → no imaging needed."],["Canadian C-spine Rule (NEJM 2003)","More sensitive and specific than NEXUS in alert, stable adults."]],
 pr:["Central cord syndrome: upper extremities weaker than lower, often older patients after hyperextension.","Steroids are not recommended for acute spinal cord injury."],
 q:["Name the five NEXUS criteria.","No posterior midline tenderness, no focal neuro deficit, normal alertness, no intoxication, no painful distracting injury."]},

{id:"tr5",u:8,t:"Trauma to the face and neck",r:["259","260"],
 bl:"Facial trauma threatens the airway, eyes and brain. Penetrating neck injury management now relies on hard signs and CTA rather than zones alone.",
 wk:["CT face; check visual acuity, extraocular movements, malocclusion","Penetrating neck: hard signs (expanding hematoma, pulsatile bleeding, bruit/thrill, airway compromise, shock, neuro deficit) → OR; otherwise CTA"],
 tx:["Early definitive airway if expanding hematoma or airway threat; prepare for cric","Don’t probe neck wounds deep to platysma","Mandible and open facial fractures: antibiotics, ENT/OMFS"],
 pr:["Le Fort fractures: check for midface mobility; Le Fort II/III can involve CSF leak.","Blunt cerebrovascular injury: screen with CTA using Denver criteria (seatbelt sign, cervical fractures, etc.)."],
 q:["What are hard signs of vascular injury in penetrating neck trauma?","Active or pulsatile bleeding, expanding hematoma, bruit or thrill, shock, and neurologic deficit; airway compromise is also a hard sign."]},

{id:"tr6",u:8,t:"Pulmonary trauma",r:["261"],
 bl:"Tension pneumothorax and massive hemothorax are immediate killers. Flail chest’s danger is the underlying contusion. Pain control and pulmonary toilet prevent pneumonia and respiratory failure in rib fractures.",
 wk:["eFAST for pneumothorax and hemothorax; chest film; CT chest"],
 tx:["Tension: needle or finger thoracostomy (4th–5th ICS anterior to midaxillary line), then tube","Hemothorax: tube thoracostomy (28 Fr or smaller is often adequate); thoracotomy for over 1500 mL initial or over 200 mL/h","Rib fractures: multimodal analgesia, regional blocks (serratus anterior, erector spinae), incentive spirometry"],
 pr:["Occult pneumothorax on CT can often be observed, even with positive pressure ventilation in selected patients.","Tracheobronchial injury: persistent large air leak after chest tube."],
 q:["What chest tube output suggests the need for thoracotomy?","Over 1500 mL immediately or more than 200 mL/h for 2–4 hours."]},

{id:"tr7",u:8,t:"Cardiac and abdominal trauma",r:["262","263"],
 bl:"Penetrating cardiac injury with tamponade needs the OR or ED thoracotomy. Blunt abdominal trauma is evaluated by FAST in unstable patients and CT in stable ones.",
 wk:["FAST pericardial view; EKG and troponin for blunt cardiac injury","Stable abdominal trauma: CT abdomen/pelvis with IV contrast; seatbelt sign raises concern for hollow viscus injury"],
 tx:["ED thoracotomy: penetrating thoracic trauma with arrest and signs of life within 15 min of CPR (blunt: within 10 min)","Unstable with positive FAST → laparotomy; solid organ injury in stable patients → nonoperative or IR"],
 dz:["Blunt cardiac injury: normal EKG and troponin effectively exclude significant injury"],
 pr:["Beck’s triad is often incomplete; ultrasound is better.","Kehr sign (left shoulder pain) suggests splenic injury."],
 q:["When does ED thoracotomy have the best yield?","Penetrating thoracic injury (especially stab wounds to the heart) with recent loss of signs of life."]},

{id:"tr8",u:8,t:"Flank, buttock, GU and extremity trauma",r:["264","265","266"],
 bl:"Flank and buttock wounds can injure retroperitoneal organs, rectum and vessels. GU trauma: blood at the meatus means retrograde urethrogram before Foley. Extremity trauma: control hemorrhage and look for vascular injury and compartment syndrome.",
 wk:["Hematuria with shock or high mechanism: CT with delayed images","Ankle-brachial index under 0.9 after extremity trauma → CTA","Pelvic fracture: retrograde urethrogram if meatal blood"],
 tx:["Tourniquet for life-threatening extremity bleeding","Testicular rupture: ultrasound and urology","Mangled extremity: hemorrhage control, antibiotics, tetanus, ortho and vascular surgery"],
 pr:["Hard signs of extremity vascular injury go straight to the OR or angiography.","Penile fracture: ‘eggplant’ deformity, emergent urology."],
 q:["What finding mandates retrograde urethrogram before Foley insertion?","Blood at the urethral meatus (also high-riding prostate, perineal hematoma)."]},

/* ---------- Unit 9: Gastrointestinal ---------- */
{id:"gi1",u:9,t:"Acute abdominal pain, nausea and vomiting",r:["71","72"],
 bl:"Abdominal pain is high risk in the elderly, immunocompromised and pregnant. Think vascular (AAA, mesenteric ischemia), obstructive, perforating, and extra-abdominal causes (MI, DKA). Treat pain early; analgesia doesn’t mask diagnosis.",
 wk:["Pregnancy test in every woman of reproductive age","Lipase, LFTs, UA, lactate, CBC; EKG in elderly","CT abdomen/pelvis for most undifferentiated pain in adults; ultrasound for RUQ pain and pregnancy"],
 tx:["Analgesia: opioids or ketorolac; antiemetics: ondansetron, metoclopramide, prochlorperazine, droperidol","Cannabinoid hyperemesis: haloperidol or droperidol, topical capsaicin, cessation counseling"],
 dz:["Discharge with return precautions and re-evaluation in 12–24 hours when the diagnosis is unclear"],
 ev:[["Analgesia in acute abdominal pain","Multiple trials show opioids don’t reduce diagnostic accuracy."]],
 pr:["Pain out of proportion to exam: mesenteric ischemia.","Elderly patients with abdominal pain have high rates of surgery and mortality; normal labs don’t exclude disease."],
 q:["What vascular causes of abdominal pain must you consider in the elderly?","Ruptured or symptomatic AAA and mesenteric ischemia (also MI presenting as epigastric pain)."]},

{id:"gi2",u:9,t:"Diarrhea and constipation",r:["73","74"],
 bl:"Most acute diarrhea is viral and self-limited. Test and treat selectively: bloody diarrhea, fever, recent antibiotics, immunocompromise, or prolonged symptoms. Constipation in the elderly can hide obstruction or fecal impaction.",
 wk:["Stool testing when bloody, febrile, severe, or persistent; C. difficile testing after antibiotics or hospitalization","Avoid antibiotics in suspected STEC (E. coli O157:H7): increased HUS risk"],
 tx:["Oral rehydration for most; loperamide for non-bloody diarrhea","C. difficile: oral vancomycin 125 mg QID or fidaxomicin","Constipation: osmotic laxative (PEG), enemas for impaction, manual disimpaction"],
 pr:["Clostridioides difficile can present with leukocytosis and ileus without diarrhea.","Opioid-induced constipation: peripheral μ-antagonists (methylnaltrexone) when laxatives fail."],
 q:["Why avoid antibiotics in suspected STEC infection?","They may increase toxin release and the risk of hemolytic uremic syndrome."]},

{id:"gi3",u:9,t:"GI bleeding and esophageal emergencies",r:["75","76","77"],
 bl:"GI bleeding: resuscitate, transfuse to Hb 7 (8 with cardiac disease), and arrange endoscopy. Variceal bleeding needs octreotide and antibiotics. Esophageal emergencies: food impaction, foreign bodies, Boerhaave’s rupture.",
 wk:["CBC, type and cross, coags, BUN/Cr; Glasgow-Blatchford score","Esophageal rupture: CT chest with oral contrast; pneumomediastinum"],
 tx:["PPI infusion or high-dose bolus for suspected ulcer bleeding","Variceal: octreotide 50 mcg bolus then 50 mcg/h, ceftriaxone 1 g, endoscopy within 12 hours; balloon tamponade as a bridge","Food impaction: glucagon has poor evidence; endoscopy within 24 hours (sooner if complete obstruction)"],
 dz:["Glasgow-Blatchford score 0–1: outpatient management"],
 ev:[["Villanueva (NEJM 2013)","Restrictive transfusion (Hb 7) improved survival in upper GI bleeding."],["HALT-IT (Lancet 2020)","TXA didn’t reduce death from GI bleeding and increased VTE."]],
 pr:["Elevated BUN:Cr ratio suggests upper GI source.","Boerhaave: vomiting, chest pain, subcutaneous emphysema (Mackler’s triad)."],
 q:["What two medications should every suspected variceal bleed receive?","Octreotide and prophylactic antibiotics (ceftriaxone)."]},

{id:"gi4",u:9,t:"Peptic ulcer, pancreatitis and biliary disease",r:["78","79"],
 bl:"Ulcer disease bleeds or perforates. Pancreatitis is diagnosed by lipase (over 3 × normal) plus typical pain; treat with fluids and analgesia. RUQ ultrasound is the first test for biliary disease.",
 wk:["Perforation: upright chest film or CT for free air","Pancreatitis: lipase, LFTs, triglycerides, calcium, ultrasound for gallstones","Cholecystitis: RUQ ultrasound (wall thickening, pericholecystic fluid, sonographic Murphy)"],
 tx:["Pancreatitis: moderate goal-directed fluid (lactated Ringer’s), early oral feeding, analgesia","Cholecystitis: antibiotics, surgery consult; ascending cholangitis (Charcot’s triad) needs ERCP","Perforated ulcer: antibiotics, PPI, surgery"],
 ev:[["WATERFALL (NEJM 2022)","Aggressive fluid resuscitation in pancreatitis increased fluid overload without better outcomes than moderate fluids."]],
 pr:["Elderly and diabetic patients may have cholecystitis without fever or Murphy’s sign.","Emphysematous cholecystitis: gas in the gallbladder wall, diabetics, urgent surgery."],
 q:["What is Charcot’s triad?","Fever, RUQ pain and jaundice (cholangitis); Reynolds pentad adds hypotension and altered mental status."]},

{id:"gi5",u:9,t:"Hepatic disorders and appendicitis",r:["80","81"],
 bl:"Cirrhotic patients decompensate from infection, bleeding, and encephalopathy; tap ascites to rule out SBP. Appendicitis is common, often atypical; scoring and imaging help, and antibiotic-first management is an option in selected patients.",
 wk:["Diagnostic paracentesis: PMN ≥250 cells/mm³ = SBP","Hepatic encephalopathy: find the trigger (infection, bleeding, constipation, sedatives)","Appendicitis: Alvarado or AIR score; ultrasound in children and pregnancy; CT in adults"],
 tx:["SBP: ceftriaxone (cefotaxime) plus albumin","Encephalopathy: lactulose, rifaximin","Appendicitis: surgery; antibiotics-first is reasonable for uncomplicated cases after shared decision"],
 ev:[["CODA (NEJM 2020)","Antibiotics were noninferior to appendectomy for quality of life at 30 days; about 3 in 10 needed appendectomy within 90 days (higher with appendicolith)."]],
 pr:["Ammonia levels don’t correlate well with encephalopathy severity.","Appendicitis in pregnancy may present with RUQ pain."],
 q:["What PMN count on ascitic fluid diagnoses SBP?","250 cells/mm³ or more."]},

{id:"gi6",u:9,t:"Diverticulitis, bowel obstruction and hernias",r:["82","83","84"],
 bl:"Uncomplicated diverticulitis can be managed without antibiotics in selected patients. Small bowel obstruction is usually adhesive; CT confirms. Hernias that are tender and irreducible are strangulated until proven otherwise.",
 wk:["CT with IV contrast for diverticulitis and SBO","Lactate and signs of ischemia in obstruction"],
 tx:["Uncomplicated diverticulitis: outpatient, antibiotics selectively (immunocompromised, systemic signs)","SBO: NPO, NG tube, fluids, surgical consult","Incarcerated hernia: reduction with analgesia if not strangulated"],
 ev:[["DIABOLO and AVOD trials","Antibiotics didn’t speed recovery in uncomplicated diverticulitis."]],
 pr:["Closed-loop obstruction and volvulus need emergent surgery.","Sigmoid volvulus: endoscopic decompression; cecal volvulus: surgery."],
 q:["When should you not reduce an incarcerated hernia?","When signs of strangulation are present (fever, peritonitis, skin changes, elevated lactate) or it has been incarcerated for many hours."]},

{id:"gi7",u:9,t:"Anorectal disorders",r:["85"],
 bl:"Most anorectal complaints are hemorrhoids, fissures and abscesses. Perirectal abscess needs drainage; a deep or supralevator abscess and Fournier’s gangrene need surgery.",
 tx:["Thrombosed external hemorrhoid within 72 hours: excision","Fissure: sitz baths, fiber, topical nitroglycerin or nifedipine","Perianal abscess: I&D; perirectal (ischiorectal, supralevator) → surgery","Rectal foreign body: careful removal, assess for perforation"],
 pr:["Fournier’s gangrene: perineal pain out of proportion, crepitus, diabetics; emergent debridement.","Pilonidal abscess: I&D off midline when possible."],
 q:["Treatment for a thrombosed external hemorrhoid in the first 72 hours?","Elliptical excision under local anesthesia."]},

{id:"gi8",u:9,t:"GI devices and surgical complications",r:["86","87"],
 bl:"G-tubes dislodge, ostomies obstruct, bariatric patients have unique complications (marginal ulcers, internal hernias, leaks). Post-op patients with fever, tachycardia or worsening pain need a leak or abscess hunt.",
 tx:["Dislodged G-tube: replace within hours to keep the tract open; confirm with contrast study if tract is new (under 4–6 weeks)","Post-op fever: think the five Ws (wind, water, wound, walking, wonder drugs) by timing"],
 pr:["Tachycardia is the earliest sign of a post-bariatric leak.","Internal hernia after gastric bypass can occur with normal imaging; involve the bariatric surgeon."],
 q:["Why is replacement urgent when a G-tube falls out?","The tract can begin to close within hours."]},

/* ---------- Unit 10: Renal & genitourinary ---------- */
{id:"renal1",u:10,t:"Acute kidney injury and rhabdomyolysis",r:["88","89"],
 bl:"AKI is prerenal, intrinsic, or postrenal. Find obstruction with a bladder scan and ultrasound, fix volume, stop nephrotoxins. Rhabdomyolysis: CK over 5× normal; aggressive fluids to prevent kidney injury.",
 wk:["BMP, UA with microscopy, urine Na/FENa, bladder scan, renal ultrasound","Rhabdo: CK, K⁺, phosphate, calcium, urine myoglobin (heme-positive UA without RBCs)"],
 tx:["Rhabdo: isotonic fluids targeting urine output about 200–300 mL/h; treat hyperkalemia","Dialysis indications: AEIOU (acidosis, electrolytes, intoxications, overload, uremia)"],
 pr:["Hypocalcemia in rhabdo shouldn’t be treated unless symptomatic or hyperkalemic.","FENa under 1% suggests prerenal (unreliable on diuretics; use FEurea)."],
 q:["What urinalysis pattern suggests rhabdomyolysis?","Dipstick positive for blood with few or no RBCs on microscopy."]},

{id:"renal2",u:10,t:"ESRD, UTIs and hematuria",r:["90","91"],
 bl:"Dialysis patients present with hyperkalemia, volume overload, access complications and infection. UTI treatment depends on location (cystitis vs pyelo), host and local resistance.",
 wk:["ESRD: K⁺, EKG, chest film; fistula thrill/bruit","UTI: UA and culture (not needed in uncomplicated cystitis), pregnancy test"],
 tx:["Cystitis: nitrofurantoin 100 mg BID 5 days, or TMP-SMX 3 days, or fosfomycin single dose","Pyelonephritis outpatient: ciprofloxacin 500 mg BID 7 days or TMP-SMX 14 days, with initial IV ceftriaxone if resistance high","Bleeding fistula: direct pressure, protamine if recently heparinized"],
 pr:["Asymptomatic bacteriuria is treated only in pregnancy and before urologic procedures.","Never place BP cuffs or IVs on the fistula arm."],
 q:["Name one first-line antibiotic for uncomplicated cystitis.","Nitrofurantoin for 5 days (alternatives: TMP-SMX 3 days, fosfomycin single dose)."]},

{id:"renal3",u:10,t:"Urinary retention and male genital problems",r:["92","93"],
 bl:"Urinary retention: drain the bladder and find the cause (BPH, drugs, cord compression). Acute scrotal pain is testicular torsion until proven otherwise; time to detorsion is everything.",
 wk:["Retention: post-void residual, UA, creatinine; neuro exam if new","Scrotal pain: Doppler ultrasound (don’t delay urology if high suspicion); TWIST score"],
 tx:["Foley catheter; coude catheter for BPH; start tamsulosin; outpatient urology","Torsion: emergent urology; manual detorsion (‘open the book’) while waiting","Epididymitis: STI risk → ceftriaxone 500 mg IM + doxycycline 100 mg BID for 10 days; enteric risk (insertive anal sex, older age, recent instrumentation) → add or use levofloxacin per CDC","Priapism: aspiration and phenylephrine injection for ischemic priapism"],
 pr:["Testicular salvage is about 90% within 6 hours of onset.","Anticholinergics, opioids and decongestants commonly trigger retention."],
 q:["What’s the time-critical window for testicular torsion?","About 6 hours for the best salvage; don’t let imaging delay urology."]},

{id:"renal4",u:10,t:"Stones and urologic devices",r:["94","95"],
 bl:"Renal colic: NSAIDs for pain, imaging selectively, and urgent urology for infected obstructed stones. Most stones under 5 mm pass.",
 wk:["UA, creatinine, CBC; point-of-care ultrasound for hydronephrosis; low-dose CT if diagnosis unclear or first stone in older adult"],
 tx:["Ketorolac 10–15 mg IV; opioids as rescue","Tamsulosin may help stones 5–10 mm","Infected obstructed stone: antibiotics plus emergent decompression (stent or nephrostomy)"],
 ev:[["STONE (NEJM 2014)","Ultrasound-first strategy led to lower radiation with no increase in serious missed diagnoses."]],
 pr:["First-time renal colic in an older adult: rule out AAA.","Fever plus obstructing stone is a urologic emergency."],
 q:["What’s the emergent treatment for an infected obstructing kidney stone?","Antibiotics and emergent decompression (ureteral stent or percutaneous nephrostomy)."]}
);
L.push(
/* ---------- Unit 11: Obstetrics & gynecology ---------- */
{id:"ob1",u:11,t:"Abnormal uterine bleeding and pelvic pain",r:["96","97"],
 bl:"First question: is she pregnant? Then: is she unstable? Nonpregnant pelvic pain includes ovarian torsion, ruptured cyst, PID, tubo-ovarian abscess and non-gynecologic causes.",
 wk:["Pregnancy test, CBC, type and screen if heavy bleeding","Pelvic ultrasound with Doppler; normal Doppler flow doesn’t exclude torsion"],
 tx:["Heavy AUB, unstable: IV conjugated estrogen 25 mg q4–6h or TXA; gynecology for D&C or tamponade","Stable AUB: high-dose oral contraceptive taper or medroxyprogesterone","Suspected torsion: gynecology for laparoscopy"],
 pr:["Torsion can be intermittent; sudden pain with vomiting and an enlarged ovary is enough to call gynecology.","Ruptured hemorrhagic cyst can cause significant hemoperitoneum."],
 q:["Does normal Doppler flow on ultrasound exclude ovarian torsion?","No; dual blood supply and intermittent torsion mean flow can be present."]},

{id:"ob2",u:11,t:"Ectopic pregnancy and the first 20 weeks",r:["98"],
 bl:"Any pregnant patient with pain or bleeding needs an intrauterine pregnancy confirmed or ectopic excluded. A ruptured ectopic with hemoperitoneum is a surgical emergency.",
 wk:["Quantitative β-hCG, Rh type, CBC; transvaginal ultrasound","Bedside FAST for free fluid in unstable patients","hCG above the discriminatory zone (about 1500–3500) without IUP on TVUS: ectopic concern"],
 tx:["Unstable ectopic: resuscitation, OR","Stable ectopic meeting criteria: methotrexate","Rh-negative with bleeding: anti-D immunoglobulin","Threatened or incomplete abortion: expectant, medical (misoprostol) or surgical management"],
 dz:["Pregnancy of unknown location, stable: repeat hCG in 48 hours with strict return precautions"],
 pr:["Heterotopic pregnancy is more common with IVF.","Hyperemesis: thiamine before dextrose, ondansetron or doxylamine-pyridoxine."],
 q:["What’s the first test for a pregnant patient with first-trimester bleeding and hypotension?","Bedside FAST looking for free fluid (with immediate gynecology consult for suspected ruptured ectopic)."]},

{id:"ob3",u:11,t:"Comorbid disorders in pregnancy",r:["99"],
 bl:"Pregnancy changes physiology (higher HR, lower BP, respiratory alkalosis, hypercoagulability) and drug choices. Treat the mother appropriately; most standard imaging and medications are acceptable when needed.",
 tx:["PE in pregnancy: LMWH; avoid DOACs and warfarin","Asthma: treat normally, including systemic steroids","UTI: nitrofurantoin (avoid near term), cephalexin; treat asymptomatic bacteriuria","Thyroid storm: PTU in first trimester"],
 pr:["Normal pregnancy Pco₂ is about 30; a ‘normal’ 40 is respiratory failure.","Imaging with radiation is not withheld when clinically needed; fetal dose from CT chest is very low."],
 q:["What Pco₂ is normal in late pregnancy?","About 28–32 mmHg (chronic compensated respiratory alkalosis)."]},

{id:"ob4",u:11,t:"Late pregnancy emergencies and delivery",r:["100","101"],
 bl:"After 20 weeks: preeclampsia/eclampsia, abruption, previa, preterm labor, PPROM. Emergency delivery requires controlled delivery of the head, managing complications like shoulder dystocia, and treating postpartum hemorrhage.",
 wk:["Preeclampsia: BP, urine protein, platelets, LFTs, creatinine; HELLP","Vaginal bleeding after 20 weeks: no digital exam until ultrasound excludes previa"],
 tx:["Eclampsia: magnesium 4–6 g IV over 15–20 min then 1–2 g/h; severe BP (≥160/110): labetalol, hydralazine or oral nifedipine","Shoulder dystocia: McRoberts, suprapubic pressure, then rotational maneuvers or posterior arm delivery","Postpartum hemorrhage: fundal massage, oxytocin, TXA 1 g within 3 hours, methylergonovine (avoid in HTN), carboprost (avoid in asthma), misoprostol"],
 ev:[["WOMAN (Lancet 2017)","TXA reduced death due to bleeding in postpartum hemorrhage, especially when given within 3 hours."]],
 pr:["Eclampsia can occur up to 6 weeks postpartum.","Uterine atony causes most postpartum hemorrhage (the four Ts: tone, trauma, tissue, thrombin)."],
 q:["First-line treatment for an eclamptic seizure?","IV magnesium sulfate."]},

{id:"ob5",u:11,t:"Vulvovaginitis and PID",r:["102","103"],
 bl:"Vaginitis: bacterial vaginosis, candida and trichomonas, each with characteristic findings. PID is a clinical diagnosis; treat liberally to prevent infertility and tubo-ovarian abscess.",
 wk:["Wet prep, pH, whiff test, NAAT for gonorrhea/chlamydia/trichomonas","PID: cervical motion, uterine or adnexal tenderness; ultrasound if TOA suspected"],
 tx:["BV: metronidazole 500 mg BID 7 days","Candida: fluconazole 150 mg once","Trichomonas: metronidazole 500 mg BID 7 days (women); treat partners","PID outpatient: ceftriaxone 500 mg IM + doxycycline 100 mg BID + metronidazole 500 mg BID for 14 days"],
 dz:["Admit PID with TOA, pregnancy, severe illness, failed outpatient therapy, or inability to tolerate PO"],
 pr:["Fitz-Hugh–Curtis: perihepatitis with RUQ pain in PID.","Expedited partner therapy is legal in most states."],
 q:["What is the CDC outpatient PID regimen?","Ceftriaxone 500 mg IM once plus doxycycline 100 mg BID and metronidazole 500 mg BID for 14 days."]},

{id:"ob6",u:11,t:"Breast disorders and gynecologic procedure complications",r:["104","105"],
 bl:"Mastitis in lactation is treated while continuing breastfeeding; abscess needs drainage. Post-procedure complications include bleeding, infection, and perforation.",
 tx:["Mastitis: dicloxacillin or cephalexin; clindamycin or TMP-SMX if MRSA risk; continue breastfeeding","Breast abscess: ultrasound-guided aspiration or I&D","Post-hysterectomy cuff cellulitis/abscess: broad-spectrum antibiotics, gynecology"],
 pr:["Inflammatory breast cancer mimics mastitis; ensure follow-up if not resolving.","Post-op ureteral injury: flank pain, fever, or urine leak after pelvic surgery."],
 q:["Should a mother with mastitis stop breastfeeding?","No; continued emptying of the breast helps resolution."]},

/* ---------- Unit 12: Infectious disease ---------- */
{id:"id1",u:12,t:"Sepsis and soft tissue infections",r:["151","152"],
 bl:"Sepsis is life-threatening organ dysfunction from infection. Early antibiotics, source control and hemodynamic support save lives. For skin: purulent infections need drainage; nonpurulent cellulitis is mostly strep; necrotizing infection is a surgical emergency.",
 wk:["Lactate, blood cultures before antibiotics (don’t delay), source-specific studies","qSOFA, SIRS and NEWS are screening aids, not definitions","Necrotizing infection: pain out of proportion, crepitus, rapid spread; CT may help but don’t delay surgery"],
 tx:["Antibiotics within 1 hour for septic shock; 30 mL/kg crystalloid for hypotension or lactate ≥4 with reassessment","Norepinephrine for MAP 65; hydrocortisone 50 mg q6h for refractory shock","Abscess: I&D; add TMP-SMX or doxycycline for MRSA in larger abscesses or systemic signs","Nonpurulent cellulitis: cephalexin; necrotizing: vancomycin + piperacillin-tazobactam + clindamycin and surgery"],
 ev:[["Talan (NEJM 2016)","TMP-SMX after drainage modestly improved cure of uncomplicated abscesses."],["ADRENAL (NEJM 2018)","Hydrocortisone didn’t reduce 90-day mortality but shortened shock and ventilation."]],
 pr:["Hypothermia in sepsis predicts higher mortality.","Ultrasound distinguishes abscess from cellulitis better than exam."],
 q:["What antibiotic timing is recommended for septic shock?","Within 1 hour of recognition."]},

{id:"id2",u:12,t:"Sexually transmitted infections",r:["153"],
 bl:"Test and treat empirically when suspicion is high; the visit may be the only one. Syphilis is resurging; think of it in every rash and many neuro presentations.",
 tx:["Gonorrhea: ceftriaxone 500 mg IM (1 g if ≥150 kg)","Chlamydia: doxycycline 100 mg BID for 7 days (azithromycin 1 g in pregnancy)","Primary/secondary syphilis: benzathine penicillin G 2.4 million units IM","HSV: valacyclovir 1 g BID for 7–10 days first episode"],
 wk:["NAAT for gonorrhea and chlamydia; HIV and syphilis testing with any STI; pregnancy test"],
 pr:["Disseminated gonococcal infection: tenosynovitis, dermatitis, polyarthralgia.","Offer HIV PEP within 72 hours of high-risk exposure."],
 q:["Current CDC gonorrhea treatment?","Ceftriaxone 500 mg IM once (1 g if weight 150 kg or more)."]},

{id:"id3",u:12,t:"Serious viral infections and tetanus",r:["154","157"],
 bl:"Influenza, COVID-19, measles, varicella and other viruses cause serious disease in vulnerable hosts; isolate and treat selectively. Tetanus: prevent with proper wound prophylaxis; treat with immune globulin, wound care, benzodiazepines and supportive care.",
 tx:["Influenza: oseltamivir 75 mg BID for 5 days for hospitalized, high-risk, or severe illness","Tetanus prophylaxis: Td/Tdap if over 10 years (5 years for dirty wounds); TIG if unknown or fewer than 3 doses with dirty wound","Tetanus disease: TIG 500 units IM, metronidazole, benzodiazepines, airway"],
 pr:["Measles: airborne isolation; Koplik spots precede rash.","Tetanus can follow minor or unnoticed wounds."],
 q:["When does a dirty wound need tetanus immune globulin?","When the patient has had fewer than 3 doses of tetanus toxoid or the history is unknown."]},

{id:"id4",u:12,t:"HIV infection",r:["155"],
 bl:"ED presentations of HIV: acute retroviral syndrome, opportunistic infections at low CD4, ART toxicities, and immune reconstitution. CD4 count frames the differential.",
 wk:["CD4 under 200: PCP; under 100: toxoplasmosis, cryptococcus; under 50: MAC, CMV","Fever and headache: CT then LP with opening pressure, cryptococcal antigen"],
 tx:["PCP: TMP-SMX high dose plus prednisone if Pao₂ under 70","PEP: start within 72 hours (preferably within hours) for 28 days"],
 pr:["Acute HIV looks like mono; ask about exposures and test with a 4th-generation assay.","Abacavir hypersensitivity: fever, rash, GI symptoms; never rechallenge."],
 q:["When should steroids be added to PCP treatment?","When Pao₂ is under 70 mmHg or the A–a gradient is 35 or more."]},

{id:"id5",u:12,t:"Endocarditis and rabies",r:["156","158"],
 bl:"Endocarditis: fever plus a murmur, injection drug use, prosthetic valve, or embolic phenomena; get blood cultures before antibiotics. Rabies is nearly 100% fatal once symptomatic; post-exposure prophylaxis is fully effective.",
 wk:["Three sets of blood cultures before antibiotics; echo (TEE for prosthetic valves); modified Duke criteria"],
 tx:["Empiric endocarditis: vancomycin plus ceftriaxone (or cefepime); add gentamicin or modify for prosthetic valve per ID","Rabies PEP: wound washing, human rabies immune globulin 20 IU/kg into and around wound, vaccine days 0, 3, 7, 14 (plus 28 if immunocompromised)"],
 pr:["Bat exposure (even a bat in the room with a sleeping person) warrants PEP consideration.","Septic emboli to lungs in right-sided endocarditis mimic pneumonia."],
 q:["What’s the rabies PEP schedule for a previously unvaccinated, immunocompetent patient?","HRIG on day 0 plus vaccine on days 0, 3, 7 and 14."]},

{id:"id6",u:12,t:"Malaria and foodborne illness",r:["159","160"],
 bl:"Fever after travel to a malaria region is malaria until proven otherwise. Foodborne illnesses vary by incubation and toxin; botulism and Vibrio are the dangerous ones.",
 wk:["Malaria: thick and thin smears ×3 over 12–24 hours or rapid antigen test; parasitemia percent","Foodborne: timing of symptoms, raw seafood, home canning"],
 tx:["Severe malaria (parasitemia over 5%, altered mental status, organ failure): IV artesunate","Uncomplicated falciparum: artemether-lumefantrine or atovaquone-proguanil","Botulism: antitoxin from public health, airway monitoring with serial vital capacities"],
 pr:["Ciguatera: perioral paresthesias and temperature reversal after reef fish.","Scombroid: flushing and headache after tuna; antihistamines."],
 q:["What finding defines severe malaria?","Organ dysfunction (cerebral, renal, respiratory, shock, acidosis, severe anemia) or parasitemia over 5%."]},

{id:"id7",u:12,t:"Zoonoses and occupational exposures",r:["161","163"],
 bl:"Tickborne diseases (Lyme, RMSF, ehrlichiosis, anaplasmosis) are treated with doxycycline, including in children for serious disease. Needlestick: wash, assess source, and start PEP when indicated.",
 tx:["RMSF suspicion: doxycycline immediately, don’t wait for rash or tests","Erythema migrans: doxycycline 100 mg BID 10–14 days","Lyme prophylaxis after Ixodes bite over 36 h: single doxycycline 200 mg within 72 h of removal","Needlestick from HIV-positive source: PEP within 72 h; hepatitis B vaccine/HBIG per immunity"],
 pr:["RMSF rash starts on wrists and ankles and spreads centrally; may be absent early.","Tularemia: rabbit exposure, ulceroglandular disease."],
 q:["What antibiotic treats most tickborne rickettsial disease, even in young children?","Doxycycline."]},

{id:"id8",u:12,t:"Global travelers",r:["162"],
 bl:"Travel history, timing and exposures narrow the differential: malaria, dengue, typhoid, rickettsial disease, and emerging infections. Isolate when a highly contagious disease is possible.",
 wk:["Fever after travel: malaria testing, CBC, LFTs, blood cultures, dengue serology/NS1"],
 tx:["Typhoid: ceftriaxone or azithromycin (resistance varies)","Dengue: supportive; avoid NSAIDs; watch for plasma leak"],
 pr:["Incubation narrows the list: dengue and rickettsial infections usually present within 2 weeks of return; malaria can appear weeks to months later.","Eosinophilia after travel suggests helminth infection."],
 q:["Why avoid NSAIDs in suspected dengue?","Risk of bleeding with thrombocytopenia and plasma leak."]},

/* ---------- Unit 13: Endocrine ---------- */
{id:"endo1",u:13,t:"Diabetes in the ED and hypoglycemia",r:["223","224"],
 bl:"Hypoglycemia is the most dangerous diabetes complication in the ED. Sulfonylurea hypoglycemia recurs; octreotide prevents it. Most ED hyperglycemia without acidosis just needs good follow-up.",
 tx:["Hypoglycemia: dextrose 25 g IV (D50 50 mL or D10 250 mL), glucagon 1 mg IM if no access","Sulfonylurea-induced: octreotide 50–100 mcg SC/IV q6–12h and admission/observation","Insulin pump problems: suspend pump if hypoglycemic; switch to injections if malfunction"],
 pr:["Hypoglycemia can mimic stroke or seizure.","Metformin plus contrast: hold metformin if AKI; risk of lactic acidosis is low."],
 q:["Why give octreotide in sulfonylurea overdose?","It suppresses insulin release, preventing recurrent hypoglycemia that dextrose alone provokes."]},

{id:"endo2",u:13,t:"DKA and ketoacidotic syndromes",r:["225","226"],
 bl:"DKA treatment: fluids first, then insulin, with potassium replacement guiding the pace. Close the gap before stopping insulin. Alcoholic and starvation ketoacidosis respond to dextrose and fluids.",
 wk:["Glucose, BMP, anion gap, VBG, β-hydroxybutyrate, K⁺, phosphate, lipase, cultures if infection","Euglycemic DKA with SGLT2 inhibitors"],
 tx:["NS or balanced crystalloid 1–2 L in the first hour","Check K⁺ before insulin: if under 3.3, replete first","Insulin 0.1 units/kg/h (bolus optional); add dextrose when glucose under 250; continue insulin until gap closed","Subcutaneous long-acting insulin 1–2 hours before stopping the drip"],
 ev:[["SMART DKA subgroup (2020)","In a secondary analysis, balanced crystalloids resolved DKA faster than saline."]],
 pr:["Cerebral edema is the main risk in pediatric DKA.","Alcoholic ketoacidosis: urine ketones may be falsely low (β-hydroxybutyrate predominant)."],
 q:["What potassium level requires repletion before starting insulin in DKA?","Below 3.3 mEq/L."]},

{id:"endo3",u:13,t:"HHS and adrenal insufficiency",r:["227","230"],
 bl:"HHS: extreme hyperglycemia and hyperosmolality with profound dehydration, usually in older type 2 diabetics. Adrenal crisis: refractory shock in patients on chronic steroids or with adrenal disease; give hydrocortisone first, test later.",
 tx:["HHS: aggressive fluids (larger deficit than DKA), lower insulin dose after fluids, slow osmolality correction","Adrenal crisis: hydrocortisone 100 mg IV, then 50 mg q6h; dextrose and fluids"],
 wk:["HHS: serum osmolality over 320, glucose often over 600, minimal ketones","Adrenal crisis: Na low, K high, glucose low; random cortisol before steroids if it won’t delay them"],
 pr:["Stress-dose steroids for any patient on chronic steroids with significant illness or surgery.","Dexamethasone doesn’t interfere with cortisol assays (if testing is needed)."],
 q:["Treatment for suspected adrenal crisis?","Hydrocortisone 100 mg IV immediately, plus fluids and dextrose."]},

{id:"endo4",u:13,t:"Thyroid emergencies",r:["228","229"],
 bl:"Thyroid storm: fever, tachycardia, altered mental status, GI symptoms, heart failure; treat with β-blockade, thionamide, iodine (after thionamide) and steroids. Myxedema coma: hypothermia, bradycardia, altered mental status; give IV levothyroxine and hydrocortisone.",
 tx:["Storm: propranolol 60–80 mg PO q4h (or esmolol), PTU 500–1000 mg load then 250 mg q4h (or methimazole), iodine 1 hour after thionamide, hydrocortisone 100 mg q8h","Myxedema: hydrocortisone 100 mg IV first, levothyroxine 200–400 mcg IV, passive rewarming, supportive"],
 ev:[["Burch–Wartofsky score","Clinical scoring system for thyroid storm likelihood."]],
 pr:["Iodine before thionamide can fuel more hormone synthesis.","Myxedema coma is often triggered by infection or cold exposure."],
 q:["In thyroid storm, why give the thionamide before iodine?","Iodine given first can provide substrate for more thyroid hormone synthesis."]},

/* ---------- Unit 14: Hematology & oncology ---------- */
{id:"heme1",u:14,t:"Anemia, hemostasis and acquired bleeding",r:["231","232","233"],
 bl:"Classify anemia by MCV and reticulocytes. Bleeding disorders: platelet problems cause mucosal bleeding; coagulation factor problems cause deep bleeding. Liver disease, DIC and medications cause most acquired coagulopathy.",
 wk:["CBC, smear, retic, iron studies, B12/folate, hemolysis labs","PT/INR, PTT, fibrinogen, D-dimer; viscoelastic testing where available"],
 tx:["Transfuse at Hb 7 for most (8 in cardiac disease or active ischemia)","DIC: treat cause; platelets, cryo, FFP for bleeding","Uremic bleeding: desmopressin 0.3 mcg/kg, dialysis"],
 pr:["Schistocytes plus thrombocytopenia: TTP until proven otherwise; don’t give platelets.","Isolated thrombocytopenia: ITP, drugs (heparin), pseudothrombocytopenia (clumping)."],
 q:["What is the first-line ED therapy for uremic platelet dysfunction bleeding?","Desmopressin 0.3 mcg/kg IV."]},

{id:"heme2",u:14,t:"Clotting disorders, hemophilia and hemolytic anemia",r:["234","235","237"],
 bl:"Hemophilia patients with any significant bleed or head injury get factor replacement first, imaging second. TTP is a hematologic emergency treated with plasma exchange. HIT: stop heparin and use a non-heparin anticoagulant.",
 tx:["Hemophilia A: factor VIII to 80–100% for serious bleeds (head, neck, abdomen); hemophilia B: factor IX; emicizumab patients need special management","von Willebrand: desmopressin (type 1) or vWF-containing concentrate","TTP: plasma exchange; caplacizumab; steroids","HIT: argatroban or bivalirudin; avoid platelet transfusion"],
 pr:["PLASMIC score helps estimate TTP probability.","Factor before CT in a hemophiliac with head trauma."],
 q:["What should come first for a hemophilia A patient with head injury?","Factor VIII replacement to near 100%, then imaging."]},

{id:"heme3",u:14,t:"Sickle cell disease and transfusion",r:["236","238"],
 bl:"Sickle cell pain crises need fast, adequate opioid analgesia (within 60 minutes). Dangerous complications: acute chest syndrome, stroke, splenic sequestration, aplastic crisis, sepsis. Know transfusion reactions and how to stop them.",
 tx:["Vaso-occlusive crisis: IV or SC opioids within 60 min, individualized plan, reassess every 15–30 min","Acute chest syndrome: antibiotics (ceftriaxone + azithromycin), oxygen, incentive spirometry, transfusion","Transfusion reaction: stop transfusion, check vitals, send samples; treat anaphylaxis, hemolysis, TRALI, TACO"],
 wk:["Acute chest: new infiltrate plus fever or respiratory symptoms","Stroke in sickle cell: exchange transfusion"],
 pr:["Fever in sickle cell is functionally asplenic sepsis risk.","TACO responds to diuretics; TRALI doesn’t."],
 q:["Define acute chest syndrome.","New pulmonary infiltrate plus chest pain, fever, tachypnea, cough or hypoxemia in a sickle cell patient."]},

{id:"heme4",u:14,t:"Antithrombotics and their reversal",r:["239"],
 bl:"Know the anticoagulants and their reversal agents. Life-threatening bleeding gets specific reversal; minor bleeding often needs only local measures and a pause in therapy.",
 tx:["Warfarin with major bleeding: 4-factor PCC (weight/INR-based) plus vitamin K 10 mg IV","Dabigatran: idarucizumab 5 g","Apixaban/rivaroxaban: andexanet alfa or 4-factor PCC 50 units/kg","Heparin: protamine 1 mg per 100 units given in prior 2–3 hours","Lytic complications: stop infusion, cryoprecipitate, TXA"],
 pr:["Vitamin K takes hours; PCC works in minutes.","Antiplatelet-associated ICH: platelet transfusion doesn’t help and may harm (PATCH)."],
 q:["Reversal agent for dabigatran?","Idarucizumab."]},

{id:"heme5",u:14,t:"Emergency complications of malignancy",r:["240"],
 bl:"Oncologic emergencies: febrile neutropenia, tumor lysis, hypercalcemia, cord compression, SVC syndrome, hyperviscosity, malignant effusions. Neutropenic fever needs antibiotics within an hour.",
 tx:["Febrile neutropenia (ANC under 500 and fever): cefepime or piperacillin-tazobactam within 1 hour; add vancomycin for line infection, skin infection, or instability","Cord compression: dexamethasone 10 mg IV, MRI whole spine, radiation oncology/neurosurgery","Tumor lysis: fluids, rasburicase for high uric acid, treat hyperkalemia","Hypercalcemia of malignancy: NS, calcitonin, zoledronic acid"],
 dz:["MASCC score ≥21 identifies low-risk febrile neutropenia that may be managed as outpatient"],
 pr:["New back pain in a cancer patient: cord compression until proven otherwise.","SVC syndrome is rarely an emergency unless airway or brain is affected."],
 q:["What antibiotic timing is expected for febrile neutropenia?","Within 1 hour of presentation."]}
);
L.push(
/* ---------- Unit 15: Environmental ---------- */
{id:"env1",u:15,t:"Cold injuries and hypothermia",r:["208","209"],
 bl:"Hypothermia staging guides rewarming: passive for mild, active external for moderate, active internal or ECMO for severe or arrest. Frostbite: rapid rewarming in warm water once refreezing is impossible.",
 wk:["Core temperature (esophageal or bladder for severe), K⁺ (over 10–12 predicts nonsurvival in arrest), glucose, EKG (Osborn waves)"],
 tx:["Moderate: forced-air warming, warm IV fluids","Severe with arrest: CPR, ECMO or cardiopulmonary bypass rewarming; limit shocks and drugs until about 30°C","Frostbite: rewarm in 37–39°C water, analgesia, consider tPA or iloprost for severe within 24 hours"],
 pr:["‘Not dead until warm and dead’: continue resuscitation during rewarming.","Handle severely hypothermic patients gently to avoid VF."],
 q:["What temperature is the target for frostbite rewarming water?","37–39°C."]},

{id:"env2",u:15,t:"Heat, drowning and altitude",r:["210","215","216"],
 bl:"Heat stroke is hyperthermia with CNS dysfunction; cool first, then transport. Drowning is hypoxic injury; ventilation is the priority. Altitude illness: descend, oxygen, and drugs for HAPE and HACE.",
 tx:["Heat stroke: cold-water immersion to about 39°C as fast as possible; no antipyretics","Drowning: rescue breaths, oxygen, PEEP, no Heimlich; C-spine only if mechanism suggests","AMS: acetazolamide 125–250 mg BID; HACE: dexamethasone 8 mg then 4 mg q6h plus descent; HAPE: descent, oxygen, nifedipine"],
 ev:[["Cold-water immersion","Cooling rates of 0.15–0.35°C/min; the fastest method and associated with near-zero mortality in exertional heat stroke when applied promptly."]],
 pr:["Drowning victims who are asymptomatic after 4–6 hours with normal oxygenation can go home.","HAPE presents with dyspnea at rest, cough, and decreased exercise tolerance in the first days at altitude."],
 q:["What’s the most effective cooling method for exertional heat stroke?","Cold-water immersion."]},

{id:"env3",u:15,t:"Bites, stings and snakebite",r:["211","212"],
 bl:"Most arthropod bites are local; black widow causes muscle cramps and autonomic symptoms; brown recluse causes necrotic wounds. Pit viper envenomation: elevate limb, track swelling, give antivenom for progression or coagulopathy.",
 tx:["Pit viper: CroFab 4–6 vials (or Anavip 10 vials), repeat for progression; no tourniquets, ice, incision or suction","Black widow: analgesia, benzodiazepines; antivenom rarely","Scorpion (Centruroides): supportive, benzodiazepines; antivenom for severe neurotoxicity"],
 wk:["Snakebite: CBC, PT/INR, fibrinogen, CK, serial limb circumference every 15–30 min"],
 pr:["Coral snake: ‘red on yellow’ in North America; delayed neurotoxicity, antivenom early.","Dry bites happen in about 20–25% of pit viper bites."],
 q:["Indications for antivenom after a pit viper bite?","Progressive swelling, coagulopathy or thrombocytopenia, or systemic toxicity."]},

{id:"env4",u:15,t:"Marine envenomation, diving and hyperbaric oxygen",r:["213","214","21"],
 bl:"Marine envenomation: hot water for stingray and spine injuries, vinegar for some jellyfish. Diving disorders: barotrauma, decompression sickness, arterial gas embolism; 100% oxygen and recompression.",
 tx:["Stingray: hot water immersion (around 45°C) 30–90 min, wound exploration and imaging","Decompression sickness or arterial gas embolism: 100% oxygen, supine position, fluids, hyperbaric recompression","Hyperbaric indications: DCS, AGE, CO poisoning, necrotizing infections, crush injury, radiation injury, certain wounds"],
 pr:["AGE presents within minutes of surfacing with stroke-like symptoms.","Transport by ground or low-altitude flight after diving injuries."],
 q:["Why is hot water effective for stingray stings?","The venom is heat-labile; immersion relieves pain."]},

{id:"env5",u:15,t:"Thermal and chemical burns",r:["217","218"],
 bl:"Burn care: airway (inhalation injury), fluid resuscitation guided by TBSA and urine output, wound care, and transfer criteria. Chemical burns: remove the agent and irrigate copiously.",
 wk:["TBSA by rule of nines or Lund–Browder (children); exclude superficial burns","Inhalation injury: facial burns, singed hairs, carbonaceous sputum, hoarseness, stridor"],
 tx:["Parkland: 4 mL × kg × %TBSA over 24 h, half in the first 8 h from time of burn (newer guidelines start at 2 mL); titrate to urine output 0.5 mL/kg/h","Early intubation for airway edema signs","Hydrofluoric acid: calcium gluconate; alkali eye injuries: irrigate to pH 7–7.5"],
 dz:["Burn center criteria: partial thickness over 10% TBSA, face/hands/feet/genitalia/major joints, full thickness, inhalation, electrical, chemical, comorbidities, children"],
 pr:["Cyanide and CO poisoning accompany smoke inhalation.","Circumferential full-thickness burns may need escharotomy."],
 q:["Parkland formula?","4 mL/kg/%TBSA of crystalloid over 24 hours, half in the first 8 hours."]},

{id:"env6",u:15,t:"Electrical and lightning injuries",r:["219"],
 bl:"Electrical injury damages deep tissues more than the skin suggests. High-voltage injuries need cardiac monitoring, CK, and assessment for compartment syndrome. Lightning causes asystole and respiratory arrest; reverse triage the apparently dead.",
 wk:["EKG, CK, UA for myoglobin, troponin for high voltage"],
 tx:["Fluids for rhabdomyolysis; fasciotomy for compartment syndrome","Lightning arrest: prolonged CPR and ventilation; many recover"],
 dz:["Low-voltage household exposure, asymptomatic, normal EKG: discharge"],
 pr:["Keraunographic (Lichtenberg) figures are pathognomonic for lightning.","Cataracts can develop months after electrical injury."],
 q:["What is ‘reverse triage’ in lightning strike mass casualty?","Treat the apparently dead first, since they may have respiratory arrest that is reversible with ventilation."]},

/* ---------- Unit 16: Orthopedics ---------- */
{id:"ortho1",u:16,t:"Principles of orthopedic injuries",r:["267"],
 bl:"Describe fractures precisely, check neurovascular status before and after every intervention, reduce deformities that threaten skin or vessels, and splint the joint above and below.",
 wk:["Two views minimum (often three); image the joint above and below for shaft fractures","Salter–Harris classification for physeal fractures"],
 tx:["Open fracture: antibiotics (cefazolin ± gram-negative coverage), tetanus, sterile dressing, ortho","Hematoma blocks or procedural sedation for reductions","Sugar-tong, posterior, ulnar gutter, thumb spica splints by injury"],
 pr:["Antibiotics for open fractures within 1 hour reduce infection.","Pain out of proportion after splinting: compartment syndrome or tight splint."],
 q:["What does Salter–Harris type II involve?","Fracture through the physis and metaphysis (most common)."]},

{id:"ortho2",u:16,t:"Hand and digit injuries",r:["268"],
 bl:"Hand injuries need careful exam: tendons, nerves, perfusion, rotation. High-pressure injection injuries and fight bites are surgical emergencies.",
 tx:["Boxer’s fracture: ulnar gutter splint; correct rotational deformity","Mallet finger: extension splint of the DIP for 6–8 weeks","Gamekeeper’s thumb (UCL): thumb spica, hand surgery follow-up","Fight bite: irrigation, amoxicillin-clavulanate, hand surgery"],
 pr:["Check finger rotation with fingers flexed: they should point to the scaphoid.","High-pressure injection: small wound, devastating injury; immediate hand surgery."],
 q:["How long does a mallet finger need continuous splinting?","6–8 weeks with the DIP in extension, without flexing it."]},

{id:"ortho3",u:16,t:"Wrist injuries",r:["269"],
 bl:"Scaphoid fractures are missed on initial films; treat snuffbox tenderness as a fracture. Perilunate and lunate dislocations are commonly missed and need prompt reduction.",
 tx:["Suspected scaphoid fracture: thumb spica, repeat imaging (or MRI/CT)","Distal radius fracture: reduction if displaced or angulated, sugar-tong splint","Lunate/perilunate dislocation: emergent ortho"],
 pr:["Lateral film: lunate should sit in the radius like a cup; ‘spilled teacup’ = lunate dislocation.","Median nerve symptoms with distal radius fracture: acute carpal tunnel."],
 q:["Management of snuffbox tenderness with normal X-rays?","Thumb spica splint and repeat imaging in 10–14 days (or advanced imaging)."]},

{id:"ortho4",u:16,t:"Elbow and forearm injuries",r:["270"],
 bl:"Elbow fat pad signs reveal occult fractures. Monteggia (ulna fracture + radial head dislocation) and Galeazzi (radius fracture + DRUJ dislocation) are commonly missed.",
 tx:["Radial head fracture: sling, early motion","Elbow dislocation: reduce, check neurovascular status, splint at 90°","Forearm shaft fractures: ortho, often operative in adults"],
 pr:["Posterior fat pad is always abnormal.","Always image the elbow and wrist with a forearm fracture."],
 q:["What is a Monteggia fracture?","Proximal ulna fracture with radial head dislocation."]},

{id:"ortho5",u:16,t:"Shoulder and humerus injuries",r:["271"],
 bl:"Anterior shoulder dislocation is common and usually reducible with gentle techniques. Posterior dislocations (seizure, electrocution) are missed. Humeral shaft fractures threaten the radial nerve.",
 tx:["Anterior dislocation: intra-articular lidocaine or sedation; external rotation, Cunningham, FARES, scapular manipulation","Check axillary nerve (deltoid sensation) before and after","Humeral shaft: coaptation splint; check wrist extension"],
 pr:["‘Lightbulb sign’ on AP film suggests posterior dislocation.","AC joint separations are graded I–VI; most are nonoperative."],
 q:["What nerve is most commonly injured in anterior shoulder dislocation?","The axillary nerve."]},

{id:"ortho6",u:16,t:"Pelvis, hip and femur injuries",r:["272","273"],
 bl:"Pelvic ring fractures can cause massive bleeding: binder at the greater trochanters. Hip fractures in the elderly need early analgesia (fascia iliaca block) and surgery within 48 hours.",
 tx:["Pelvic binder for suspected unstable pelvic ring","Hip fracture: fascia iliaca or PENG block, early ortho","Hip dislocation: reduce within 6 hours to reduce avascular necrosis"],
 pr:["Occult hip fracture: MRI if X-rays negative but cannot bear weight.","Posterior hip dislocation: shortened, flexed, adducted, internally rotated; check sciatic nerve."],
 q:["Where should a pelvic binder be placed?","Over the greater trochanters."]},

{id:"ortho7",u:16,t:"Knee, leg and compartment syndrome",r:["274","275","278"],
 bl:"Ottawa knee rules limit imaging. Knee dislocation threatens the popliteal artery: check ABIs. Compartment syndrome: pain out of proportion and pain with passive stretch; measure pressures if unclear and get a fasciotomy.",
 wk:["Knee dislocation: ABI; under 0.9 → CTA","Compartment pressure: delta pressure (diastolic − compartment) under 30 mmHg suggests compartment syndrome"],
 tx:["Patellar dislocation: extend the knee with medial pressure","Tibial plateau fracture: knee immobilizer, non-weight bearing, ortho","Compartment syndrome: remove casts, keep limb at heart level, fasciotomy"],
 ev:[["Ottawa Knee Rule","Imaging if age 55+, isolated patellar tenderness, fibular head tenderness, inability to flex to 90°, or inability to bear weight 4 steps."]],
 pr:["Pulses don’t exclude compartment syndrome.","Spontaneously reduced knee dislocation is still a knee dislocation."],
 q:["What delta pressure suggests compartment syndrome?","Diastolic pressure minus compartment pressure under 30 mmHg."]},

{id:"ortho8",u:16,t:"Ankle and foot injuries",r:["276","277"],
 bl:"Ottawa ankle and foot rules reduce imaging. Maisonneuve, Lisfranc and fifth metatarsal fractures are frequently missed and can be serious.",
 tx:["Ankle sprain: functional support, early weight bearing","Lisfranc injury: non-weight bearing, ortho","Fifth metatarsal: avulsion fracture (walking boot) vs Jones fracture (non-weight bearing, ortho)","Achilles rupture: Thompson test; plantar-flexion splint, ortho"],
 ev:[["Ottawa Ankle Rules","Near 100% sensitive for clinically significant fractures."]],
 pr:["Proximal fibula tenderness with ankle injury: Maisonneuve.","Plantar ecchymosis of the midfoot suggests Lisfranc injury."],
 q:["What’s the difference between a 5th metatarsal avulsion fracture and a Jones fracture?","Avulsion is at the tuberosity (good healing); Jones is at the metaphyseal–diaphyseal junction (poor healing, non-weight bearing)."]},

/* ---------- Unit 17: Musculoskeletal ---------- */
{id:"msk1",u:17,t:"Neck, back and shoulder pain",r:["279","280"],
 bl:"Most back pain is benign. Red flags (cancer, infection, cauda equina, fracture, AAA) guide imaging. Shoulder pain is usually rotator cuff disease but can be referred from heart, lungs or abdomen.",
 wk:["Cauda equina: urinary retention (bladder scan over 200 mL), saddle anesthesia, bilateral deficits → emergent MRI","Epidural abscess: fever, IVDU, immunosuppression; ESR/CRP"],
 tx:["Nonspecific low back pain: NSAIDs, heat, activity; avoid opioids and bed rest","Rotator cuff tendinopathy: NSAIDs, activity modification, PT"],
 pr:["Post-void residual over 200 mL increases suspicion of cauda equina.","Left shoulder pain with exertion: angina."],
 q:["What are the key features of cauda equina syndrome?","Urinary retention or incontinence, saddle anesthesia, bilateral leg symptoms, and decreased rectal tone."]},

{id:"msk2",u:17,t:"Hip and knee pain",r:["281"],
 bl:"Atraumatic hip and knee pain: osteoarthritis, bursitis, septic joint, gout, avascular necrosis, referred pain. Any warm, swollen joint with fever needs arthrocentesis.",
 tx:["Septic arthritis: arthrocentesis, antibiotics (vancomycin + ceftriaxone), ortho washout","Bursitis: NSAIDs; aspirate if concern for septic bursitis"],
 pr:["Hip pathology can present as knee pain, especially in children.","Avascular necrosis risk: steroids, alcohol, sickle cell."],
 q:["What’s the best ED test for a suspected septic joint?","Arthrocentesis with cell count, Gram stain, culture and crystals."]},

{id:"msk3",u:17,t:"Rheumatic diseases and foot problems",r:["282","285"],
 bl:"Systemic rheumatic diseases present with flares, infections from immunosuppression, and organ-threatening complications (scleroderma renal crisis, lupus nephritis, vasculitis).",
 tx:["Gout: NSAIDs, colchicine, or steroids","Scleroderma renal crisis: ACE inhibitor (captopril) even with AKI","Giant cell arteritis: high-dose steroids immediately if vision at risk"],
 pr:["Fever in a lupus patient on immunosuppression: infection first.","Plantar fasciitis: morning heel pain; stretching and supportive footwear."],
 q:["What drug class treats scleroderma renal crisis?","ACE inhibitors."]},

{id:"msk4",u:17,t:"Nontraumatic hand problems, joints and bursae",r:["283","284"],
 bl:"Flexor tenosynovitis (Kanavel signs) needs IV antibiotics and hand surgery. Monoarthritis: septic joint, crystals, trauma; tap it.",
 wk:["Synovial fluid: WBC over 50,000 suggests septic arthritis (lower in prosthetic joints); crystals don’t exclude infection"],
 tx:["Felon and paronychia: drainage","Flexor tenosynovitis: IV antibiotics, hand surgery","Gout flare: NSAIDs, colchicine, prednisone"],
 pr:["Kanavel signs: flexed posture, fusiform swelling, tenderness along sheath, pain with passive extension.","Prosthetic joint pain with fever: don’t tap in the ED without ortho input."],
 q:["Name the four Kanavel signs.","Fusiform swelling, flexed resting posture, tenderness along the flexor sheath, pain with passive extension."]}
);

/* ---------- Unit 18: Wounds, analgesia & sedation ---------- */
{id:"pain1",u:18,t:"Acute and chronic pain",r:["35","38"],
 bl:"Treat pain early and multimodally: acetaminophen, NSAIDs, regional anesthesia, ketamine, and opioids when needed. For chronic pain, avoid escalating opioids and focus on function.",

 ev:[["Motov (Ann Emerg Med 2017)","Ketorolac 10 mg provided analgesia similar to 15 and 30 mg."]],
 pr:["Prescribe the smallest opioid quantity needed and check the PDMP.","Undertreatment of pain is more common in minority patients; use objective protocols."],
 q:["What is the analgesic ceiling dose of IV ketorolac?","About 10–15 mg; higher doses add side effects without more analgesia."]},

{id:"pain2",u:18,t:"Local and regional anesthesia",r:["36"],
 bl:"Know maximum doses, buffer and warm lidocaine to reduce injection pain, and recognize local anesthetic systemic toxicity (LAST).",
 tx:["Lidocaine max 4.5 mg/kg plain, 7 mg/kg with epinephrine","Bupivacaine max 2.5 mg/kg plain, 3 mg/kg with epinephrine","LAST: stop injection, airway, benzodiazepines for seizures, 20% lipid emulsion 1.5 mL/kg bolus then infusion"],

{id:"sed",u:18,t:"Procedural sedation",r:["37"],
 bl:"Procedural sedation is safe with preparation: presedation assessment, monitoring with capnography, the right drug for the procedure, and readiness to rescue the airway.",
 tx:["Ketamine 1–2 mg/kg IV (dissociative), propofol 0.5–1 mg/kg then 0.5 mg/kg boluses, ketofol, etomidate 0.1–0.15 mg/kg","Laryngospasm with ketamine: jaw thrust, positive pressure, small-dose succinylcholine if persistent"],
 wk:["ASA class, airway assessment, NPO status (not required to delay emergent procedures)"],
 ev:[["ACEP fasting guidance","Recent food intake isn’t a contraindication to ED procedural sedation."]],
 pr:["Capnography detects hypoventilation before desaturation.","Emergence reactions with ketamine are less common in children; midazolam can treat them."],
 q:["What does capnography detect earlier than pulse oximetry during sedation?","Hypoventilation and apnea."]},

{id:"wound1",u:18,t:"Wound evaluation, preparation and aftercare",r:["39","40","47"],
 bl:"Explore wounds for foreign bodies and tendon injury, irrigate with tap water or saline under pressure, and close when appropriate. Most simple lacerations don’t need antibiotics.",
 tx:["Irrigation: tap water is as effective as sterile saline","Prophylactic antibiotics for bites (especially cat and human), heavily contaminated wounds, open fractures","Suture removal: face 5 days, scalp 7–10, trunk/extremities 7–14, over joints 10–14"],
 pr:["Image for glass when depth unknown; most glass is radio-opaque.","Golden period for closure is longer than once thought for clean wounds (up to 12–18 h, longer for face)."],
 q:["Is tap water acceptable for wound irrigation?","Yes; infection rates are similar to sterile saline."]},

{id:"wound2",u:18,t:"Wound closure",r:["41"],
 bl:"Choose closure by location, tension and cosmetic importance: sutures, staples, tissue adhesive or strips. Evert edges; avoid excess tension.",
 tx:["Simple interrupted for most; horizontal mattress for high-tension; vertical mattress for eversion","Staples for scalp and trunk; adhesive for low-tension linear lacerations","Absorbable sutures are acceptable for many lacerations, including in children"],
 pr:["Don’t use tissue adhesive across joints or on mucosa.","Hair apposition technique works for scalp lacerations."],
 q:["When is tissue adhesive a good choice?","Clean, linear, low-tension lacerations not over joints, mucosa or hairy areas."]},

{id:"wound3",u:18,t:"Face, scalp, arm and hand lacerations",r:["42","43"],
 bl:"Facial lacerations need precise alignment (vermilion border first). Hand lacerations require tendon and nerve exam in all positions.",

 pr:["Don’t shave eyebrows.","Tendon lacerations can be missed when the finger is examined only in extension."],
 q:["What’s the first suture in a lip laceration crossing the vermilion border?","Aligning the vermilion border."]},

{id:"wound4",u:18,t:"Leg and foot lacerations, punctures and bites",r:["44","46"],
 bl:"Plantar puncture wounds through shoes risk Pseudomonas osteomyelitis. Dog, cat and human bites carry different risks; cat bites and hand bites need antibiotics.",
 tx:["Bite prophylaxis: amoxicillin-clavulanate 875/125 mg BID for 3–5 days","Puncture through sneaker with signs of infection: ciprofloxacin for Pseudomonas coverage","Rabies and tetanus prophylaxis as indicated"],
 pr:["Cat bites: high infection risk (Pasteurella); don’t close.","Dog bites to the face can usually be closed after irrigation."],
 q:["Antibiotic of choice for bite prophylaxis?","Amoxicillin-clavulanate."]},

{id:"wound5",u:18,t:"Soft tissue foreign bodies",r:["45"],
 bl:"Imaging guides removal: X-ray for glass and metal, ultrasound for wood and plastic. Set a time limit for exploration.",
 tx:["Fishhook: retrograde, string-yank, or advance-and-cut technique","Splinters: incise along the track; wood fragments break, remove completely"],
 pr:["Retained foreign bodies are a common source of litigation; document exploration and imaging.","Ultrasound detects wood well; it’s invisible on X-ray."],
 q:["Best imaging for a wooden splinter?","Ultrasound."]},

/* ---------- Unit 19: Eye, ENT & oral ---------- */
{id:"eye1",u:19,t:"Eye exam, ophthalmic medications and the red eye",r:["241@1568-1577"],
 bl:"Every eye complaint gets visual acuity (the vital sign of the eye), pupils, pressure (when no globe rupture), and slit lamp exam.",
 key:["Red flags in red eye: decreased vision, photophobia, ciliary flush, abnormal pupil, high pressure, corneal opacity","Cycloplegics relieve pain from ciliary spasm","Topical anesthetics are diagnostic only; don’t prescribe them"],
 pr:["Fluorescein reveals abrasions, ulcers and dendrites.","Contact lens wearers with abrasion need antipseudomonal drops (fluoroquinolone)."],
 q:["What’s the ‘vital sign’ of the eye?","Visual acuity."]},

{id:"eye2",u:19,t:"Ocular infections, cornea and uveitis",r:["241@1578-1589"],
 bl:"Orbital cellulitis (pain with eye movement, proptosis, vision change) needs CT and IV antibiotics. Herpes zoster ophthalmicus and corneal ulcers threaten vision. Uveitis causes photophobia and ciliary flush.",
 tx:["Orbital cellulitis: vancomycin plus ceftriaxone; ophthalmology/ENT","Bacterial conjunctivitis: topical antibiotics; gonococcal hyperacute conjunctivitis: ceftriaxone IM/IV","HSV keratitis: topical or oral antivirals, no steroids","HZO: oral antivirals, ophthalmology if eye involvement"],
 pr:["Hutchinson sign (zoster on the nose tip) predicts eye involvement.","Endophthalmitis after surgery is an emergency."],
 q:["Name findings that suggest orbital rather than preseptal cellulitis.","Pain with eye movement, ophthalmoplegia, proptosis, decreased vision, or afferent pupillary defect."]},

{id:"eye3",u:19,t:"Eye trauma and chemical injury",r:["241@1589-1598"],
