<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracing">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<title>Tracing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: Dubin's steps one at a time on the left, the live read pinned on the right; stacks to one column on phones.
   Fixed light theme to match Hx, Px, Dispo and the rest of PANACEA. Example strips are drawn on pink EKG paper. */
html,body{margin:0}
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --ink:#14233A; --muted:#5A6A7E; --line:#D2DAE1;
  --accent:#1D4ED0; --accent-soft:#E1E9FB; --accent-ink:#FFFFFF;
  --paper:#FFF6F3; --grid:#F6DAD4; --grid2:#EAB2A7; --trace:#14233A;
  --warn:#8A4300; --warn-soft:#FCEFDF; --alert:#A3122B; --alert-soft:#FBE6E9;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light only;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:8px}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font-size:1.7rem;letter-spacing:-.01em;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.92rem;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1840AE;color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,.info:focus-visible,.stepbtn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* step rail */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0;position:relative}
.stepbtn .n{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepbtn .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepbtn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0}
.stepbtn.done .dot{opacity:1}
.stepbtn[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.stepbtn[aria-current="step"] .n{color:var(--accent)}
@media (max-width:640px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}.stepbtn{padding:6px 8px}.stepbtn .t{font-size:.84rem}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .eb{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:0;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.ph .cue{margin:2px 0 0;color:var(--muted);font-size:.93rem;max-width:62ch}
.pfoot{display:flex;justify-content:space-between;gap:10px;padding-top:4px;border-top:1px solid var(--line);padding-top:16px}

/* fields */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.flab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.flab .sub{font-weight:400;color:var(--muted);font-size:.85rem}
.info{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:.78rem;font-style:italic;font-family:Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.info:hover{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;cursor:pointer;min-height:38px;line-height:1.2;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{padding:5px 10px;min-height:34px;font-size:.86rem}
.chip.quick{border-style:dashed;color:var(--muted)}
.chip.quick:hover{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.num{display:flex;flex-direction:column;gap:4px;min-width:0}
.num label{font-size:.82rem;color:var(--muted);font-weight:700}
.num .box{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.num .box:focus-within{border-color:var(--accent)}
.num input{border:0;outline:0;background:transparent;width:84px;padding:9px 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.num input[type=text]{width:150px}
.num .u{padding:0 10px 0 0;color:var(--muted);font-size:.85rem}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--bg);border-radius:12px;padding:12px}
@media (max-width:560px){.calc{grid-template-columns:minmax(0,1fr)}}
.calc .num input{width:100%}
.calc .res{font-size:.85rem;color:var(--muted);min-height:1.3em;font-variant-numeric:tabular-nums}
.calc .res b{color:var(--ink)}
.calc .use{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:.85rem}
.leadrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.leadrow .lbl{width:68px;flex:none;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.lchip{min-width:46px;text-align:center;justify-content:center}
.hint{margin:0;font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.calcout{margin:0;font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:8px 11px}
.calcout b{font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line)}
.group-title{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* output */
.out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:900px){.out{position:static;max-height:none}}
.out h3{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.imp{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.imp li::marker{color:var(--accent);font-weight:700}
.imp li.crit{color:var(--alert);font-weight:700}
.empty{margin:0;color:var(--muted);font-size:.92rem}
.dict{white-space:pre-wrap;font-size:.86rem;line-height:1.5;background:var(--bg);border-radius:10px;padding:12px;margin:0;font-family:var(--f-body);overflow-wrap:anywhere}
.outbtns{display:flex;gap:8px;flex-wrap:wrap}
.outbtns .btn{flex:1}
.toast{font-size:.82rem;color:var(--accent);min-height:1.2em;margin:0}

/* popover */
.pop{position:fixed;z-index:50;width:340px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,35,58,.18);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:min(70vh,560px);overflow:auto}
.pop.pinned{width:400px}
.pop .pt{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pop p{margin:0;font-size:.88rem;color:var(--ink)}
.pop .pg{color:var(--muted);font-size:.78rem}
.pop .close{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.pop .exitem{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.pop .exitem b{font-size:.88rem}
.strip{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--grid2)}
.pop table{border-collapse:collapse;font-size:.84rem;width:100%;font-variant-numeric:tabular-nums}
.pop td,.pop th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
.pop th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){
  .pop,.pop.pinned{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;max-height:70vh;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="titlerow"><a class="homebtn" href="../#clinical" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a><h1>Tracing</h1></div>
      <p>Dubin's five-step EKG read, written up as a dictation and impression.</p>
    </div>
    <button class="btn" id="reset" type="button">New EKG</button>
  </header>

  <nav class="steps" id="steps" aria-label="Steps"></nav>

  <div class="grid">
    <main id="panes"></main>
    <aside class="out" aria-live="polite">
      <h3>Impression</h3>
      <div id="impWrap"></div>
      <h3>Full read</h3>
      <pre class="dict" id="dict"></pre>
      <div class="outbtns">
        <button class="btn primary" id="copyImp" type="button">Copy impression</button>
        <button class="btn" id="copyAll" type="button">Copy full read</button>
      </div>
      <p class="toast" id="toast"></p>
    </aside>
  </div>
</div>

<div class="pop" id="pop" hidden role="dialog" aria-live="polite"></div>

<script>
/* ===================== Waveform engine (schematic example strips) ===================== */
const G=(t,c,a,w)=>{const x=(t-c)/w;return a*Math.exp(-x*x)};
const sig=x=>1/(1+Math.exp(-x));
function beat(o){
  o=Object.assign({p:.14,pw:22,ps:'n',pr:160,q:-.06,qwid:0,r:1,s:-.28,qw:9,rp:0,st:0,t:.3,tc:300,tw:55,tasym:0,u:0,as:0,ponly:0,spike:0,prd:0,amp:1},o);
  const qw=o.qw;
  return t=>{
    let y=0;
    if(o.as) y+=G(t,-o.pr-6,1.2,1.4);
    if(o.p){const c=-o.pr+45,a=o.p;
      switch(o.ps){
        case 'rae': y+=G(t,c-6,a*2,15)+G(t,c+24,-a*.25,14);break;
        case 'lae': y+=G(t,c-18,a*.7,13)+G(t,c+16,-a*1.4,22);break;
        case 'inv': y+=G(t,c,-a,o.pw);break;
        case 'notch': y+=G(t,c-16,a,16)+G(t,c+20,a*.95,16);break;
        case 'bi': y+=G(t,c-12,a*.8,14)+G(t,c+18,-a*.5,14);break;
        default: y+=G(t,c,a,o.pw);
      }}
    if(o.prd) y+=o.prd*sig((t-(-o.pr+95))/6)*sig((-qw*2-t)/6);
    if(o.ponly) return y*o.amp;
    if(o.spike) y+=G(t,-qw*2.4,1.4,1.4);
    if(o.q) y+=G(t,-qw*1.6,o.q,o.qwid||qw*.7);
    y+=G(t,0,o.r,qw);
    if(o.s) y+=G(t,qw*1.8,o.s,qw*.9);
    if(o.rp) y+=G(t,qw*3.4,o.rp,qw*1.1);
    if(o.st){const a=qw*(o.rp?4.6:2.7);y+=o.st*sig((t-a)/5)*sig((o.tc-o.tw*.4-t)/30)}
    if(o.t){const w=o.tasym?(t<o.tc?o.tw*1.5:o.tw*.55):o.tw;y+=G(t,o.tc,o.t,w)}
    if(o.u) y+=G(t,o.tc+185,o.u,42);
    return y*o.amp;
  };
}
function sample(spec){
  const dur=spec.dur||3000, fns=(spec.beats||[]).map(b=>({at:b.at,f:beat(b)})), pts=[];
  for(let t=0;t<=dur;t++){let y=spec.base?spec.base(t):0;for(const b of fns){const d=t-b.at;if(d>-800&&d<900)y+=b.f(d)}pts.push(y)}
  return pts;
}
function gridSVG(x0,W,H,dur,sc,y0){
  let s='';const px=W/dur;
  for(let t=0;t<=dur;t+=40){const x=(x0+t*px).toFixed(1);s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${t%200?'var(--grid)':'var(--grid2)'}" stroke-width="${t%200?.5:.8}"/>`}
  const step=.1*sc;let k=0;
  for(let y=y0;y<=H;y+=step,k++)s+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x0+W}" y2="${y.toFixed(1)}" stroke="${k%5?'var(--grid)':'var(--grid2)'}" stroke-width="${k%5?.5:.8}"/>`;
  k=1;for(let y=y0-step;y>=0;y-=step,k++)s+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x0+W}" y2="${y.toFixed(1)}" stroke="${k%5?'var(--grid)':'var(--grid2)'}" stroke-width="${k%5?.5:.8}"/>`;
  return s;
}
function pathOf(pts,x0,W,dur,sc,y0){
  const px=W/dur;let d='';
  for(let i=0;i<pts.length;i++){d+=(i?'L':'M')+(x0+i*px).toFixed(1)+' '+(y0-pts[i]*sc).toFixed(1)}
  return `<path d="${d}" fill="none" stroke="var(--trace)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function stripSVG(spec){
  const W=320,H=spec.h||76;
  if(spec.svg) return spec.svg;
  if(spec.panels){
    const n=spec.panels.length, pw=W/n, dur=spec.pdur||640;
    const all=spec.panels.map(p=>sample({dur,beats:[Object.assign({at:spec.pat||280},p.b)]}));
    let mn=0,mx=0;all.forEach(a=>a.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v}));
    const pad=12,sc=spec.scale||Math.min(26,(H-pad-6)/Math.max(.8,mx-mn));
    const y0=pad+mx*sc+((H-pad-6)-(mx-mn)*sc)/2;
    let g='',tr='',lb='';
    all.forEach((pts,i)=>{const x0=i*pw;g+=gridSVG(x0,pw,H,dur,sc,y0);tr+=pathOf(pts,x0,pw,dur,sc,y0);
      lb+=`<text x="${x0+4}" y="11" font-size="9.5" font-weight="700" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${spec.panels[i].l}</text>`;
      if(i)lb+=`<line x1="${x0}" y1="0" x2="${x0}" y2="${H}" stroke="var(--grid2)" stroke-width="1.4"/>`});
    return `<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Example tracing"><rect width="${W}" height="${H}" fill="var(--paper)"/>${g}${tr}${lb}</svg>`;
  }
  const dur=spec.dur||3000, pts=sample(spec);
  let mn=0,mx=0;pts.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v});
  const pad=6,sc=spec.scale||Math.min(26,(H-2*pad)/Math.max(.8,mx-mn));
  const y0=pad+mx*sc+((H-2*pad)-(mx-mn)*sc)/2;
  const lab=spec.lead?`<text x="4" y="11" font-size="9.5" font-weight="700" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${spec.lead}</text>`:'';
  return `<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Example tracing"><rect width="${W}" height="${H}" fill="var(--paper)"/>${gridSVG(0,W,H,dur,sc,y0)}${pathOf(pts,0,W,dur,sc,y0)}${lab}</svg>`;
}
const R=(rr,start,o={},dur=3000)=>{const b=[];for(let t=start;t<dur+200;t+=rr)b.push(Object.assign({at:t},o));return b};
const at=(arr,o={})=>arr.map(a=>Object.assign({at:a},o));
const WIDE={p:0,q:0,r:.95,s:-.35,qw:26,t:-.45,tc:340,tw:70};
const fib=t=>.035*Math.sin(t/23)+.028*Math.sin(t/13.7+1)+.022*Math.sin(t/8.3+2)+.018*Math.sin(t/31+4);
const saw=t=>{const ph=(t%200)/200;return ph<.72? .07-.26*ph/.72 : -.19+.26*(ph-.72)/.28};

const EX={
  nsr:{lead:'II',beats:R(800,300)},
  sbrady:{lead:'II',beats:R(1300,350)},
  stach:{lead:'II',beats:R(480,250,{t:.25,tc:250,tw:45})},
  sarr:{lead:'II',beats:at([250,1000,1850,2600])},
  wap:{lead:'II',beats:[{at:250},{at:1050,p:.08,pr:130},{at:1800,p:.1,ps:'inv',pr:110},{at:2600,p:.16,ps:'notch',pr:170}]},
  mat:{lead:'II',beats:[{at:200},{at:700,p:.08,pr:130},{at:1260,ps:'inv',p:.1,pr:110},{at:1680,ps:'notch'},{at:2250,p:.07,pr:120},{at:2680,ps:'inv',p:.09},{at:3200}].map(b=>Object.assign({t:.24,tc:260,tw:45},b))},
  af:{lead:'II',base:fib,beats:at([300,860,1310,2050,2440,2990],{p:0})},
  flutter:{lead:'II',base:saw,beats:at([440,1240,2040,2840],{p:0,t:.12})},
  svt:{lead:'II',beats:R(370,200,{p:0,t:.22,tc:220,tw:40})},
  patblock:{lead:'II',beats:[...R(340,150,{ponly:1,p:.14,pr:150}),...R(680,300,{p:0,t:.2,tc:240,tw:45})]},
  junct:{lead:'II',beats:R(1250,350,{p:0})},
  ivr:{lead:'II',beats:R(1700,450,WIDE)},
  vt:{lead:'II',beats:R(340,150,Object.assign({},WIDE,{tc:200,tw:55}))},
  vflut:{lead:'II',base:t=>.9*Math.sin(t/32)},
  vf:{lead:'II',base:t=>(.3+.18*Math.sin(t/410))*Math.sin(t/37)+.18*Math.sin(t/21+1)+.12*Math.sin(t/63+2)},
  torsades:{lead:'II',base:t=>(.15+.85*Math.abs(Math.sin(t/650)))*Math.sin(t/36)},
  vpaced:{lead:'II',beats:R(860,320,Object.assign({},WIDE,{spike:1,r:.85}))},
  apaced:{lead:'II',beats:R(860,320,{as:1})},
  dpaced:{lead:'II',beats:R(860,320,Object.assign({},WIDE,{p:.13,pr:180,as:1,spike:1,r:.85}))},
  spaced:{lead:'II',beats:R(860,320,Object.assign({},WIDE,{p:.14,pr:170,spike:1,r:.85}))},
  ftc:{lead:'II',beats:[{at:350,...WIDE,spike:1,r:.85},{at:1210,ponly:1,p:0,spike:0},{at:2070,...WIDE,spike:1,r:.85}],base:t=>G(t,1210-62,1.4,1.4)},

function fmtLeads(ls){
  const ord=LEADS.filter(l=>ls.includes(l));const limb=ord.filter(l=>!l.startsWith('V')),ch=ord.filter(l=>l.startsWith('V')).map(l=>+l.slice(1));
  const runs=[];let a=null,b=null;
  ch.forEach(n=>{if(a===null){a=b=n}else if(n===b+1){b=n}else{runs.push([a,b]);a=b=n}});if(a!==null)runs.push([a,b]);
  const cs=runs.flatMap(([x,y])=>y-x>=2?[`V${x}–V${y}`]:y>x?[`V${x}`,`V${y}`]:[`V${x}`]);
  return [...limb,...cs].join(', ');
}
function regions(ls){
  const c=a=>a.filter(l=>ls.includes(l)).length;
  const out=[],art=[];
  const sept=c(['V1','V2']),ant=c(['V3','V4']),prec=c(['V1','V2','V3','V4']);
  const lat=c(['I','aVL','V5','V6']),inf=c(['II','III','aVF']);
  let a=null;
  if(prec>=2||(prec>=1&&c(['V5','V6'])>=1&&ls.includes('V4'))){a=sept&&ant?'anteroseptal':sept?'septal':'anterior'}
  const hasLat=lat>=2;
  if(a&&hasLat&&c(['V1','V2','V3','V4','V5','V6'])>=5){out.push('extensive anterior');art.push('LAD (proximal)')}
  else if(a==='anterior'&&hasLat){out.push('anterolateral');art.push('LAD','diagonal/circumflex')}
  else{ if(a){out.push(a);art.push('LAD')} if(hasLat){out.push(c(['I','aVL'])>=2&&!c(['V5','V6'])?'high lateral':'lateral');art.push('circumflex')} }
  if(inf>=2){if(out.length===1&&out[0].includes('lateral')&&!a){out[0]='inferolateral';art.unshift('RCA or circumflex')}else{out.push('inferior');art.push('RCA (or circumflex)')}}

}
const joinW=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];

function axisInfo(){
  const I=S.leadI,F2=S.leadF,II=S.leadII;if(!I||!F2)return null;
  let quad=null,name='',deg=null;
  if(I==='iso'&&F2==='iso')return {name:'Indeterminate axis',quad:null,abn:true};
  if(I==='iso'){deg=F2==='pos'?90:-90;quad=F2==='pos'?'normal':'lad';name=F2==='pos'?'Normal axis':'Left axis deviation'}
  else if(F2==='iso'){deg=I==='pos'?0:180;quad=I==='pos'?'normal':'rad';name=I==='pos'?'Normal axis':'Right axis deviation'}
  else if(I==='pos'&&F2==='pos'){quad='normal';name='Normal axis'}
  else if(I==='pos'&&F2==='neg'){quad='lad';name=II==='pos'?'Normal axis (leftward, 0° to −30°)':'Left axis deviation'}
  else if(I==='neg'&&F2==='pos'){quad='rad';name='Right axis deviation'}
  else {quad='ext';name='Extreme axis deviation (northwest)'}
  const T={normal:{aVF:0,III:30,aVL:60,I:90},lad:{I:-90,aVR:-60,II:-30,aVF:0},rad:{aVF:180,II:150,aVR:120,I:90},ext:{I:-90,aVL:-120,III:-150,aVF:-180}};
  let isoBad=false;

  if(deg!==null&&quad==='lad'&&!II)name=deg>-30?'Normal axis (leftward)':'Left axis deviation';
  const abn=name.startsWith('Left')||name.startsWith('Right')||name.startsWith('Extreme');
  return {name,quad,deg,abn,isoBad};
}
const degStr=d=>d===null||d===undefined?'':(d>0?'+':d<0?'−':'')+Math.abs(d)+'°';

function qtc(){const qt=num('qt'),v=num('vrate');if(!qt||!v)return null;return Math.round(qt/Math.sqrt(60/v))}

function rhythmText(){
  const r=S.rhythm,v=num('vrate'),a=num('arate');
  const blockAtrial=['third','high','twoone'].includes(S.avb);
  const sr=blockAtrial&&a?a:v;
  const rateTxt=(n,lab)=>n?`, ${lab?lab+' ':''}rate ${n}`:'';

      t+=blockAtrial&&a?`, atrial rate ${a}`:rateTxt(v);break;

    case 'wap': t=(v>100?'Multifocal atrial tachycardia':'Wandering atrial pacemaker')+rateTxt(v);break;
    case 'mat': t='Multifocal atrial tachycardia'+rateTxt(v);break;

    case 'aflutter': {const fr=S.flutterRatio;t='Atrial flutter'+(fr?(fr==='variable'?' with variable AV conduction':` with ${fr} AV conduction`):'')+rateTxt(v,'ventricular');break}

    case 'patblock': t='Atrial tachycardia with block'+(a?`, atrial rate ${a}`:'')+(v?`, ventricular rate ${v}`:'');break;
    case 'junct': t=(!v||v<60?'Junctional escape rhythm':v<=100?'Accelerated junctional rhythm':'Junctional tachycardia')+rateTxt(v);break;
    case 'ivr': t=(!v||v<40?'Idioventricular (ventricular escape) rhythm':v<=100?'Accelerated idioventricular rhythm':'Ventricular tachycardia')+rateTxt(v);break;
    case 'vt': t='Ventricular tachycardia'+rateTxt(v);break;

    case 'vflutter': t='Ventricular flutter';break;

      t=m+rateTxt(v);if(S.capture==='ftc')t+=', with failure to capture';if(S.capture==='fts')t+=', with failure to sense';if(S.capture==='ok')t+=', appropriate capture and sensing';break}

function avbText(){
  const pr=num('pr'),v=num('vrate');let avb=S.avb;

function compute(){

    const qOver=ql.filter(l=>steT.includes(l));
    let t;
    if(R1.names.length){
      const lab=joinW(R1.names);
      t=qOver.length>=2?`Acute/recent ${lab} infarction: Q waves and ST elevation in ${fmtLeads(steT)}`:`ST elevation in ${fmtLeads(steT)} (${lab}): acute injury, concerning for STEMI`;
      t+=`; suggests ${joinW(R1.arts)} occlusion`;
    } else t=`ST elevation in ${fmtLeads(steT)}, not in a contiguous territory`;
    if(recip.length){t+=`, with reciprocal ST depression in ${fmtLeads(recip)}`;stdUsed=stdUsed.concat(recip)}
    if(S.rhythm==='paced'||S.bbb==='lbbb')t+=` (${S.bbb==='lbbb'?'LBBB':'paced rhythm'} present: apply Sgarbossa criteria)`;
    ml.push(t);imp.push(t);if(R1.names.length)crit.add(t);
  } else if(ste.includes('aVR')&&!(std.length>=6)){const t='ST elevation in aVR';ml.push(t);imp.push(t)}
  const qOnly=ql.filter(l=>!steT.includes(l));
  if(qOnly.length){const R2=regions(qOnly);const t=R2.names.length?`Q waves in ${fmtLeads(qOnly)}, consistent with ${joinW(R2.names)} infarction, age indeterminate`:`Q waves in ${fmtLeads(qOnly)}`;ml.push(t);imp.push(t)}
  const stdLeft=std.filter(l=>!stdUsed.includes(l));
  if(stdLeft.length&&S.posterior!=='yes'||stdLeft.filter(l=>!['V1','V2'].includes(l)).length){
    const L=S.posterior==='yes'?stdLeft.filter(l=>!['V1','V2'].includes(l)):stdLeft;
    if(L.length){const R3=regions(L);const t=`ST depression in ${fmtLeads(L)}${R3.names.length?` (${joinW(R3.names)})`:''}${S.misc&&S.misc.includes('dig')?'':': subendocardial ischemia'}`;ml.push(t);imp.push(t)}
  }
  if(S.posterior==='yes'){const t='Posterior infarction pattern (tall R with ST depression in V1–V2), likely RCA or circumflex; consider posterior leads V7–V9';ml.push(t);imp.push(t);crit.add(t)}
  if(ti.length){const R4=regions(ti);const t=`Symmetric T-wave inversion in ${fmtLeads(ti)}${R4.names.length?` (${joinW(R4.names)})`:''}: ischemia`;ml.push(t);imp.push(t)}
  if(ml.length)D.push('Ischemia/infarction: '+ml.join('. ')+'.');
  // Misc
  const misc=S.misc||[];
  const mm={pe:'Pattern suggesting acute right heart strain / pulmonary embolism (S1Q3T3)',hyperk:'Peaked T waves, consistent with hyperkalemia',hyperkx:'Absent P waves with markedly widened QRS, consistent with severe hyperkalemia',hypok:'Flat T waves with prominent U waves, consistent with hypokalemia',hyperca:'Short QT, consistent with hypercalcemia',hypoca:'Prolonged QT from ST lengthening, consistent with hypocalcemia',dig:'Digitalis effect (scooped ST depression)',diglox:'Findings concerning for digitalis toxicity',longqt:'QT prolongation consistent with drug effect',lowvolt:'Low QRS voltage',peri:'Diffuse ST elevation with PR depression, pericarditis pattern'};
  if(misc.length){const ts=misc.map(x=>mm[x]);D.push('Other: '+ts.join('. ')+'.');ts.forEach((t,i)=>{imp.push(t);if(['hyperkx','diglox'].includes(misc[i]))crit.add(t)})}
  // Comparison
  if(S.compare){const d=S.priorDate&&String(S.priorDate).trim();const c={noprior:'No prior EKG available for comparison',same:`No significant change compared with prior${d?` (${d})`:''}`,new:`New changes compared with prior${d?` (${d})`:''}`}[S.compare];D.push('Comparison: '+c+'.');imp.push(c)}
  // Normal EKG
  const normal=S.rhythm==='sinus'&&v&&v>=60&&v<=100&&(!S.avb||S.avb==='none')&&(!pr||(pr>=120&&pr<=200))&&(!S.bbb||S.bbb==='none')&&(!S.hemi||S.hemi==='none')&&!ect.length&&(!qrs||qrs<120)&&(!qc||(qc<470&&qc>=340))&&ax&&!ax.abn&&(!S.transition||S.transition==='normal')&&!hl.length&&S.noisch==='yes'&&!ml.slice(1).length&&!steT.length&&!ql.length&&!std.length&&!ti.length&&S.posterior!=='yes'&&!misc.length;
  if(normal){const i=imp.findIndex(x=>/^No significant|^New|^No prior/.test(x));imp.splice(i<0?imp.length:i,0,'Normal EKG')}
  return {imp,D,crit};
}

/* ===================== Render ===================== */
function setPressed(){
  document.querySelectorAll('.chip[data-k]').forEach(b=>{const k=b.dataset.k,v=b.dataset.v;const f=F[k];
    const on=f.type==='multi'||f.type==='leads'?has(k,v):S[k]===v;b.setAttribute('aria-pressed',on?'true':'false')});
}
function show(id,txt){const el=document.getElementById(id);if(!el)return;if(txt){el.innerHTML=txt;el.hidden=false}else{el.hidden=true;el.innerHTML=''}}
function update(){
  setPressed();
  document.querySelectorAll('[data-f]').forEach(el=>{const f=F[el.dataset.f];if(f&&f.when)el.hidden=!f.when()});
  const v=num('vrate'),a=num('arate'),pr=num('pr'),qrs=num('qrs'),qc=qtc();
  // rate hint
  let rh='';if(v&&a&&Math.abs(v-a)>5&&!S.rhythm)rh='Atrial and ventricular rates differ. Look for AV block, flutter, or AV dissociation in Step 2.';
  show('hint-rate',rh);
  // intervals
  show('qtc',qc?`QTc <b>${qc} ms</b> (Bazett, at a rate of ${v})`:num('qt')&&!v?'Enter the ventricular rate in Step 1 to calculate QTc.':'');
  const ih=[];
  if(pr&&pr>200&&!S.avb)ih.push(`PR ${pr} ms is over 200: first-degree AV block will be added.`);
  if(pr&&pr>200&&S.avb==='none')ih.push(`PR ${pr} ms is over 200 but AV block is set to None.`);
  if(pr&&pr<120)ih.push(`Short PR (${pr} ms): consider a junctional or low atrial origin, or pre-excitation.`);
  if(qrs&&qrs>=120&&(!S.bbb||S.bbb==='none')&&!['vt','ivr','vf','torsades','vflutter','paced'].includes(S.rhythm))ih.push(`QRS ${qrs} ms: choose RBBB, LBBB or nonspecific IVCD below.`);
  if(qc&&qc>=470)ih.push(`QTc ${qc} ms is prolonged${qc>=500?' (500 or more: torsades risk)':''}.`);
  show('hint-int',ih.join(' '));
  const rh2=[];
  if(S.rhythm==='sinus'&&S.pBefore==='no')rh2.push('Sinus rhythm needs a P before every QRS. Recheck the rhythm or look for junctional beats.');
  if(S.qAfter==='no'&&(!S.avb||S.avb==='none')&&!['af','aflutter','patblock'].includes(S.rhythm))rh2.push('Some P waves are not followed by a QRS: choose the type of AV block.');
  show('hint-rhythm',rh2.join(' '));
  // axis
  const ax=axisInfo();
  let ao='';if(ax){ao=`<b>${ax.name}</b>${ax.deg!==null&&ax.deg!==undefined?` · <b>${degStr(ax.deg)}</b>`:''}`;}
  show('axisOut',ao);
  const ah=[];
  if(ax&&ax.isBad)ah.push('');
  if(ax&&ax.isoBad)ah.push(`${S.isoLead} is not on Dubin's chart for this quadrant. Recheck lead I and aVF, or pick another lead.`);
  if(ax&&ax.quad==='lad'&&S.leadII!=='pos'&&(!S.hemi||S.hemi==='none'))ah.push('Left axis deviation: rule out left anterior hemiblock (Q1S3).');
  if(ax&&ax.quad==='rad'&&(!S.hemi||S.hemi==='none'))ah.push('Right axis deviation: consider RVH, then left posterior hemiblock (S1Q3).');
  show('hint-isoLead',ah.filter(Boolean).join(' '));
  // LVH
  const sv=num('sv1'),r5=num('rv5');
  show('lvhOut',sv!==null&&r5!==null?`SV1 + RV5 = <b>${sv+r5} mm</b> · ${sv+r5>35?'meets LVH voltage (over 35 mm)':'does not meet LVH voltage'}`:'');
  show('hint-hyp',(S.bbb==='rbbb'||S.bbb==='lbbb')?'Bundle branch block is selected: hypertrophy voltage criteria are unreliable.':'');
  // MI hints
  const mh=[];
  if(S.bbb==='lbbb'&&((S.ste||[]).length||(S.q||[]).length))mh.push('LBBB makes infarction hard to read on EKG. Use Sgarbossa criteria and the old EKG.');
  if(S.noisch==='yes'&&['q','ste','std','tinv'].some(k=>(S[k]||[]).length))mh.push('"No changes" is selected but leads are marked. The marked leads will be used.');
  if((S.q||[]).includes('aVR'))mh.push('Q waves in aVR are normal and are left out.');
  show('hint-mi',mh.join(' '));
  // step dots
  const filled=[['vrate','arate'],['rhythm','regularity','pBefore','qAfter','pr','qrs','qt','avb','bbb','hemi','ectopy'],['leadI','leadF','isoLead','transition'],['pv1','rvh','sv1','rv5','lvhStrain'],['noisch','q','ste','std','tinv','posterior','compare'],['misc']];
  document.querySelectorAll('.stepbtn').forEach((b,i)=>{b.classList.toggle('done',filled[i].some(k=>{const x=S[k];return Array.isArray(x)?x.length:x!==undefined&&x!==''&&x!==null}));b.setAttribute('aria-current',i===cur?'step':'false')});
  // output
  const {imp,D,crit}=compute();
  const iw=document.getElementById('impWrap');
  iw.innerHTML=imp.length?`<ol class="imp">${imp.map(x=>`<li${crit.has(x)?' class="crit"':''}>${esc(x)}</li>`).join('')}</ol>`:'<p class="empty">The impression builds here as you work through the steps. Hover any choice, or tap ⓘ, for an example strip.</p>';
  const dict=D.length?`EKG INTERPRETATION\n${D.join('\n')}${imp.length?`\n\nIMPRESSION:\n${imp.map((x,i)=>`${i+1}. ${x}`).join('\n')}`:''}`:'';
  document.getElementById('dict').textContent=dict||'Nothing entered yet.';
  window.__out={imp:imp.map((x,i)=>`${i+1}. ${x}`).join('\n'),all:dict};
}

/* ===================== Popovers ===================== */
const pop=document.getElementById('pop');let hoverT=null,pinned=false;
function exHTML(key){return key&&EX[key]?stripSVG(EX[key]):''}
const svgCache={};function exC(key){if(!key)return'';if(!(key in svgCache))svgCache[key]=exHTML(key);return svgCache[key]}
function axisTable(){return `<table><tr><th>Quadrant</th><th>Isoelectric lead → axis</th></tr>
<tr><td>Normal</td><td>aVF 0°, III +30°, aVL +60°, I +90°</td></tr>
<tr><td>Left</td><td>aVF 0°, II −30°, aVR −60°, I −90°</td></tr>
<tr><td>Right</td><td>I +90°, aVR +120°, II +150°, aVF +180°</td></tr>
<tr><td>Extreme right</td><td>I −90°, aVL −120°, III −150°, aVF −180°</td></tr></table>`}
function optTip(k,v){const o=F[k].opts.find(x=>x[0]===v);return `<div class="pt"><span>${esc(o[1])}</span>${o[4]?`<span class="pg">Dubin ${o[4]}</span>`:''}</div>${exC(o[3])}<p>${esc(o[2])}</p>`}
function fieldTip(k){
  const f=F[k];let h=`<div class="pt"><span>${esc(f.label)}</span><button class="close" type="button" aria-label="Close">×</button></div>`;
  if(f.pg)h+=`<span class="pg">Dubin ${f.pg}</span>`;
  if(f.ex)h+=exC(f.ex);
  if(f.tip)h+=`<p>${esc(f.tip)}</p>`;
  if(f.table)h+=axisTable();
  if(f.opts)f.opts.filter(o=>o[2]).forEach(o=>{h+=`<div class="exitem"><b>${esc(o[1])}${o[4]?` <span class="pg">${o[4]}</span>`:''}</b>${exC(o[3])}<p>${esc(o[2])}</p></div>`});
  return h;
}
function place(el){
  if(innerWidth<=640){pop.style.left='';pop.style.top='';return}
  const r=el.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.min(Math.max(12,r.left),innerWidth-pw-12),y=r.bottom+8;
  if(y+ph>innerHeight-12)y=Math.max(12,r.top-ph-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function openPop(html,el,pin){pinned=!!pin;pop.innerHTML=html;pop.classList.toggle('pinned',pinned);pop.hidden=false;place(el)}
function closePop(){pop.hidden=true;pinned=false}
document.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse'||pinned)return;const c=e.target.closest('[data-tip]');if(!c)return;
  clearTimeout(hoverT);hoverT=setTimeout(()=>{const [k,v]=c.dataset.tip.split(':');openPop(optTip(k,v),c,false)},220);
});
document.addEventListener('pointerout',e=>{
  if(e.pointerType!=='mouse'||pinned)return;const c=e.target.closest('[data-tip]');if(!c)return;
  if(e.relatedTarget&&c.contains(e.relatedTarget))return;clearTimeout(hoverT);closePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('[data-tip]');if(c&&!pinned&&c.matches(':focus-visible')){const [k,v]=c.dataset.tip.split(':');openPop(optTip(k,v),c,false)}});

/* ===================== Events ===================== */
function goto(i){cur=Math.max(0,Math.min(STEPS.length-1,i));document.querySelectorAll('.pane').forEach(p=>p.hidden=+p.dataset.pane!==cur);update();closePop();
  const top=document.getElementById('steps').getBoundingClientRect().top+scrollY-8;if(scrollY>top)scrollTo({top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.close')){closePop();return}
  const info=t.closest('[data-info]');
  if(info){e.preventDefault();if(pinned&&pop.dataset.for===info.dataset.info){closePop();return}openPop(fieldTip(info.dataset.info),info,true);pop.dataset.for=info.dataset.info;return}
  if(pinned&&!t.closest('#pop'))closePop();
  const sb=t.closest('[data-step]');if(sb){goto(+sb.dataset.step);return}
  const go=t.closest('[data-go]');if(go){goto(+go.dataset.go);return}
  const ch=t.closest('.chip[data-k]');
  if(ch){const k=ch.dataset.k,v=ch.dataset.v,f=F[k];
    if(f.type==='multi'||f.type==='leads'){const arr=new Set(S[k]||[]);arr.has(v)?arr.delete(v):arr.add(v);S[k]=[...arr]}
    else S[k]=S[k]===v?undefined:v;
    if(k==='rhythm'&&S.rhythm!=='aflutter')delete S.flutterRatio;
    update();return}
  const qk=t.closest('[data-quick]');if(qk){const k=qk.dataset.quick;const set=new Set(S[k]||[]);const ls=qk.dataset.leads.split(',');const all=ls.every(l=>set.has(l));ls.forEach(l=>all?set.delete(l):set.add(l));S[k]=[...set];update();return}
  const cl=t.closest('[data-clear]');if(cl){S[cl.dataset.clear]=[];update();return}
  const use=t.closest('[data-use]');if(use){S.vrate=use.dataset.use;document.getElementById('f-vrate').value=use.dataset.use;update();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;update();return}
  if(t.dataset.calc){
    const n=parseFloat(t.value),id='r-'+t.dataset.calc;const el=document.getElementById(id);
    if(!isFinite(n)||n<=0){el.innerHTML='';return}
    const r=Math.round(t.dataset.calc==='big'?300/n:t.dataset.calc==='small'?1500/n:n*10);
    el.innerHTML=`= <b>${r} bpm</b> · <button type="button" class="use" data-use="${r}">Use</button>`;
  }
});
addEventListener('resize',()=>{if(!pop.hidden&&innerWidth<=640){pop.style.left='';pop.style.top=''}});
document.getElementById('reset').addEventListener('click',()=>{S={};document.querySelectorAll('input').forEach(i=>i.value='');document.querySelectorAll('.calc .res').forEach(r=>r.innerHTML='');goto(0);toast('Cleared for a new EKG.')});
function toast(m){const t=document.getElementById('toast');t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',2200)}
async function copy(txt,label){
  if(!txt){toast('Nothing to copy yet.');return}
  try{await navigator.clipboard.writeText(txt);toast(label+' copied.')}
  catch(_){const d=document.getElementById('dict');const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Copy blocked here. The full read is selected; press Ctrl/⌘ C.')}
}
document.getElementById('copyImp').addEventListener('click',()=>copy(window.__out&&window.__out.imp,'Impression'));
document.getElementById('copyAll').addEventListener('click',()=>copy(window.__out&&window.__out.all,'Full read'));

build();update();
</script>
</body>
