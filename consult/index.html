<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consult">
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EBEFF2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Consult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Consult: prep a consult call by service. Palette and type match the rest of PANACEA. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--ink:#14233A;--muted:#5A6A7E;--line:#D2DAE1;
  --accent:#1D4ED0;--accent-ink:#FFFFFF;--accent-soft:#E1E9FB;
  --warn:#A8261C;--warn-soft:#FBE7E5;--ok:#1D6E49;--ok-soft:#E1F2E9;
  --paper:#FBFCFD;
  color-scheme:light only;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
main.wrap{padding-top:12px;padding-bottom:120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:56px}
.hd h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:2.1rem;line-height:1;padding:0 8px 4px 0;cursor:pointer;font-family:inherit}
.homebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-6px;border-radius:10px;color:var(--muted);flex:none;text-decoration:none}
.homebtn:hover,.homebtn:active{color:var(--ink);background:rgba(127,127,127,.12)}
.homebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:1.05rem;margin:22px 0 8px;letter-spacing:.01em}
h2.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card>h3{margin:0 0 8px;font-size:1rem}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4;min-height:44px;display:block;max-width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld>span{font-size:.85rem;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px}.row>.fld{flex:1;min-width:0}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.92rem;font-weight:700;padding:6px 2px;cursor:pointer}
.linkbtn.danger{color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:38px;text-align:left}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip:hover,.seg button:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* home */
.search{margin:4px 0 4px}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:64px;text-decoration:none}
.svc:hover{border-color:var(--accent)}
.svc .ab{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.82rem;letter-spacing:.01em}
.svc .txt{flex:1;min-width:0}
.svc .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.svc .ds{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .dr{flex:none;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.go{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
details.me{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:20px 0 12px}
details.me>summary{list-style:none;padding:14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:10px}
details.me>summary::-webkit-details-marker{display:none}
details.me>summary .sm{flex:1;color:var(--muted);font-weight:400;font-size:.9rem;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.me .inner{padding:0 14px 14px}
.tips{margin:0;padding-left:18px;font-size:.92rem}
.tips li{margin:5px 0}
.empty{text-align:center;color:var(--muted);padding:24px 10px}

/* service view */
.flags{border-color:var(--warn);background:var(--warn-soft)}
.flags h3{color:var(--warn)}
.flags ul{margin:0;padding-left:18px;font-size:.95rem}
.flags li{margin:3px 0}
.grp{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 2px}
.grp:first-of-type{margin-top:4px}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ib{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:.98rem;color:var(--ink);background:none;border:0;padding:10px 0;cursor:pointer;min-height:46px}
.bx{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;margin-top:-1px}
.bx svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.on .bx{background:var(--ok);border-color:var(--ok)}
.item.on .bx svg{opacity:1}
.ib .lb{flex:1;min-width:0}
.ib .lb small{display:block;color:var(--muted);font-size:.82rem;margin-top:1px}
.ib .vv{flex:none;max-width:42%;color:var(--ok);font-weight:700;font-size:.9rem;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:2px}
.iv{display:none;padding:0 0 10px 38px}
.item.open .iv{display:block}
.iv input{padding:8px 10px;background:var(--paper)}
.count{font-size:.85rem;color:var(--muted);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:.95rem;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px;margin:0 0 10px}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<header class="top"><div class="wrap hd" id="hd"></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

 qs:['Percutaneous drain','Embolization for bleeding','Nephrostomy tube','Line placement'],
 flags:['Active hemorrhage on CTA.'],
 items:['H|Procedure requested and why|','I|Imaging showing the target|','L|INR|','L|Platelets|','H|Anticoagulants/antiplatelets and last dose|','L|Creatinine (contrast)|','H|Contrast allergy|','H|Last PO (sedation)|','X|Hemodynamics|','H|Can the patient consent?|']}
];
const G={H:'History',X:'Exam',L:'Labs & data',I:'Imaging',T:'Done in ED'};
const GO=['H','X','L','I','T'];
const URG={emer:['Emergent','This is emergent; I need someone to see the patient now.'],urg:['Urgent','I’d like recommendations within the hour.'],rout:['Routine','This is not urgent.']};
const OUT={see:'will see the patient in the ED',recs:'gave recommendations by phone',adm:'accepts the patient for admission',cb:'will call back'};
const SVC=Object.fromEntries(SERVICES.map(s=>[s.id,s]));

/* storage: per-device only */
const KEY='panacea.consult.v1';
let S={me:{name:'',role:'',cb:''},d:{}};
/* Your name, role and callback number are remembered; consult drafts start blank on every visit, on the service list. */
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){S.me={...S.me,...(r.me||{})}}}catch(e){}
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({me:S.me}))}catch(e){toast('Could not save on this device.')}},250)}
function draft(id){return S.d[id]||(S.d[id]={age:'',sex:'',bed:'',urg:'',q:'',one:'',chk:{},val:{},done:'',pend:'',who:'',recs:'',out:'',t:''})}
function started(id){const d=S.d[id];if(!d)return false;return !!(d.q||d.one||d.age||Object.values(d.chk||{}).some(Boolean)||Object.values(d.val||{}).some(v=>v&&v.trim()))}
function parse(s){return s.items.map((x,i)=>{const[g,t,ph]=x.split('|');return{i,g,t,ph:ph||''}})}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOME=`<a class="homebtn" href="../" aria-label="Back to Panacea" title="Panacea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></a>`;
const CHECK=`<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const hd=document.getElementById('hd'),app=document.getElementById('app');
let filter='';

function render(){
  const id=location.hash.slice(1);
  if(SVC[id])renderSvc(SVC[id]);else renderHome();
}

function renderHome(){
  document.title='Consult';
  hd.innerHTML=`${HOME}<h1>Consult</h1>`;
  const f=filter.toLowerCase();
  const list=SERVICES.filter(s=>!f||(s.name+' '+s.ds+' '+s.ab+' '+s.qs.join(' ')).toLowerCase().includes(f));
  let html=`<p class="sub" style="margin-top:6px">Pick the service. Have what they’ll ask for before you dial, and lead with your question.</p>
  <input class="search" id="q" type="search" placeholder="Search services or problems" value="${esc(filter)}" autocomplete="off">`;
  let last='';
  for(const s of list){
    if(s.sec!==last){html+=`<h2 class="sec">${s.sec}</h2>`;last=s.sec}
    html+=`<a class="svc" href="#${s.id}"><span class="ab">${s.ab}</span><span class="txt"><span class="nm">${s.name}</span><span class="ds" style="display:block">${s.ds}</span></span>${started(s.id)?'<span class="dr">Draft</span>':''}<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>`;
  }
  if(!list.length)html+=`<div class="empty">No service matches “${esc(filter)}”.</div>`;
  const me=S.me;
  html+=`<details class="me"${me.name?'':' open'}><summary>You<span class="sm">${esc([me.name,me.role].filter(Boolean).join(', ')||'Used in the script opener')}</span></summary><div class="inner">
    <div class="row"><label class="fld"><span>Name</span><input data-me="name" value="${esc(me.name)}" placeholder="Zach"></label>
    <label class="fld"><span>Role</span><input data-me="role" value="${esc(me.role)}" placeholder="medical student in the ED"></label></div>
    <label class="fld"><span>Callback number</span><input data-me="cb" value="${esc(me.cb)}" inputmode="tel" placeholder="x4-1234"></label>
  </div></details>
  <div class="card"><h3>On every call</h3><ul class="tips">
    <li>Say who you are and the specific question in the first two sentences.</li>
    <li>Know your ask: a bedside eval, phone recs, admission, or a procedure.</li>
    <li>Say how urgent it is, and why.</li>
    <li>Have the chart open; numbers beat adjectives.</li>
    <li>Before hanging up, read back the recommendations and confirm who is seeing the patient and when.</li>
  </ul></div>
  <p class="foot">Saved only on this device. Don’t enter names, MRNs, or dates of birth.</p>`;
  app.innerHTML=html;
}

function script(s,d){
  const me=S.me,L=[];
  const who=[me.name?`this is ${me.name}`:'this is',me.role].filter(Boolean).join(', ');
  L.push(`Hi, ${who}${me.name||me.role?'':' ___'}.${me.cb?` Callback ${me.cb}.`:''}`);
  const pt=[d.age?`${d.age}-year-old`:'',d.sex].filter(Boolean).join(' ')||'patient';
  L.push(`I’m calling ${s.name} about a ${pt}${d.bed?` in ${d.bed}`:''}.`);
  L.push(`My question: ${d.q||'___'}`.replace(/\.?$/,'.'));
  if(d.urg)L.push(URG[d.urg][1]);
  if(d.one)L.push('',d.one.trim());
  const items=parse(s).filter(it=>(d.val[it.i]||'').trim());
  for(const g of GO){
    const gi=items.filter(it=>it.g===g);
    if(!gi.length)continue;
    L.push('',G[g]+':');
    for(const it of gi)L.push(`• ${short(it.t)}: ${d.val[it.i].trim()}`);
  }
  if(d.done.trim())L.push('','In the ED so far: '+d.done.trim());
  if(d.pend.trim())L.push('Pending: '+d.pend.trim());
  return L.join('\n');
}
function short(t){return t.split(/[;(:?]/)[0].trim()}
function docline(s,d){
  const t=d.t||'';const who=d.who.trim();
  let x=`Case discussed with ${who?who+' of ':''}${s.name}${t?' at '+t:''}`;
  x+=d.out?`, who ${OUT[d.out]}.`:'.';
  if(d.recs.trim())x+=` Recommendations: ${d.recs.trim().replace(/\.?$/,'.')}`;
  return x;
}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}

function renderSvc(s,keep){
  const d=draft(s.id);const its=parse(s);
  document.title=s.name+' · Consult';
  hd.innerHTML=`${HOME}<button class="back" data-a="home" aria-label="All services">‹</button><h1>${s.name}</h1>`;
  const nChk=its.filter(it=>d.chk[it.i]).length;
  let h='';
  if(s.flags&&s.flags.length)h+=`<div class="card flags"><h3>Call now</h3><ul>${s.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`;
  h+=`<div class="card"><h3>The ask</h3>
    <div class="row"><label class="fld" style="flex:.7"><span>Age</span><input data-f="age" inputmode="numeric" value="${esc(d.age)}" placeholder="54"></label>
    <div class="fld" style="flex:1.3"><span>Sex</span><div class="seg" data-seg="sex">${['M','F'].map(v=>`<button type="button" data-v="${v==='M'?'male':'female'}" aria-pressed="${d.sex===(v==='M'?'male':'female')}">${v}</button>`).join('')}</div></div>
    <label class="fld" style="flex:1"><span>Room</span><input data-f="bed" value="${esc(d.bed)}" placeholder="ED 12"></label></div>
    <label class="fld"><span>Your question</span><input data-f="q" value="${esc(d.q)}" placeholder="What do you want from them?"></label>
    <div class="chips">${s.qs.map(q=>`<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="fld" style="margin-top:12px"><span>Urgency</span><div class="seg" data-seg="urg">${Object.entries(URG).map(([k,v])=>`<button type="button" data-v="${k}" aria-pressed="${d.urg===k}">${v[0]}</button>`).join('')}</div></div>
    <label class="fld"><span>One-liner</span><textarea data-f="one" rows="2" placeholder="PMHx of ___ presenting with ___, found to have ___.">${esc(d.one)}</textarea></label>
  </div>`;
  h+=`<div class="card"><div class="btnrow" style="justify-content:space-between"><h3 style="margin:0">What they’ll ask</h3><span class="count" id="cnt">${nChk} of ${its.length}</span></div>
    <div class="bar"><i id="bar" style="width:${its.length?nChk/its.length*100:0}%"></i></div>
    <p class="hint" style="margin:0 0 6px">Tap to check off; add the value and it goes in the script.</p>`;
  for(const g of GO){
    const gi=its.filter(it=>it.g===g);if(!gi.length)continue;
    h+=`<div class="grp">${G[g]}</div><div>`;
    for(const it of gi){
      const v=d.val[it.i]||'';
      h+=`<div class="item${d.chk[it.i]?' on':''}${d.chk[it.i]&&!v?' open':''}" data-i="${it.i}">
        <button type="button" class="ib" data-a="tog"><span class="bx">${CHECK}</span><span class="lb">${esc(it.t)}</span><span class="vv">${esc(v)}</span></button>
        <div class="iv"><input data-v="${it.i}" value="${esc(v)}" placeholder="${esc(it.ph?'e.g. '+it.ph:'Value or finding (optional)')}"></div></div>`;
    }
    h+='</div>';
  }
  h+=`</div>`;
  h+=`<div class="card"><label class="fld" style="margin-top:0"><span>Done in the ED (not listed above)</span><textarea data-f="done" rows="2">${esc(d.done)}</textarea></label>
    <label class="fld"><span>Pending</span><textarea data-f="pend" rows="1">${esc(d.pend)}</textarea></label></div>`;
  h+=`<h2>Script</h2><pre class="out" id="scr">${esc(script(s,d))}</pre>
    <div class="btnrow"><button class="btn primary" data-a="copy">Copy script</button></div>`;
  h+=`<h2>After the call</h2><div class="card">
    <div class="row"><label class="fld" style="margin-top:0"><span>Who you spoke with</span><input data-f="who" value="${esc(d.who)}" placeholder="Dr. ___"></label>
    <label class="fld" style="margin-top:0;flex:.6"><span>Time</span><input data-f="t" type="time" value="${esc(d.t)}"></label></div>
    <div class="fld"><span>Outcome</span><div class="seg" data-seg="out">${Object.entries({see:'Seeing patient',recs:'Phone recs',adm:'Accepts admission',cb:'Will call back'}).map(([k,v])=>`<button type="button" data-v="${k}" aria-pressed="${d.out===k}">${v}</button>`).join('')}</div></div>
    <label class="fld"><span>Recommendations (read these back)</span><textarea data-f="recs" rows="3">${esc(d.recs)}</textarea></label>
    <pre class="out" id="doc" style="margin-top:10px">${esc(docline(s,d))}</pre>
    <div class="btnrow"><button class="btn sm" data-a="copydoc">Copy for the note</button></div>
  </div>
  <div class="btnrow" style="justify-content:center;margin-top:18px"><button class="linkbtn danger" data-a="clear">Clear this consult</button></div>
  <p class="foot">Saved only on this device. Don’t enter names, MRNs, or dates of birth.</p>`;
  const y=window.scrollY;app.innerHTML=h;if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
}

function refreshOut(){
  const s=SVC[location.hash.slice(1)];if(!s)return;const d=draft(s.id);
  const a=document.getElementById('scr');if(a)a.textContent=script(s,d);
  const b=document.getElementById('doc');if(b)b.textContent=docline(s,d);
  const its=s.items.length,n=Object.values(d.chk).filter(Boolean).length;
  const c=document.getElementById('cnt');if(c)c.textContent=`${n} of ${its}`;
  const br=document.getElementById('bar');if(br)br.style.width=(n/its*100)+'%';
}

app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filter=t.value;const pos=t.selectionStart;renderHome();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
  if(t.dataset.me){S.me[t.dataset.me]=t.value;save();return}
  const s=SVC[location.hash.slice(1)];if(!s)return;const d=draft(s.id);
  if(t.dataset.f){d[t.dataset.f]=t.value}
  else if(t.dataset.v!==undefined){const i=t.dataset.v;d.val[i]=t.value;if(t.value.trim())d.chk[i]=true;const it=t.closest('.item');it.classList.toggle('on',!!d.chk[i]);it.querySelector('.vv').textContent=t.value}
  save();refreshOut();
});

app.addEventListener('click',async e=>{
  const s=SVC[location.hash.slice(1)];
  const segb=e.target.closest('.seg button');
  if(segb&&s){const d=draft(s.id),k=segb.parentElement.dataset.seg,v=segb.dataset.v;d[k]=d[k]===v?'':v;if(k==='out'&&d[k]&&!d.t)d.t=nowHM();save();renderSvc(s,true);return}
  const chip=e.target.closest('.chip');
  if(chip&&s){const d=draft(s.id);d.q=chip.dataset.q;save();const q=app.querySelector('[data-f="q"]');q.value=d.q;refreshOut();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tog'&&s){
    const d=draft(s.id),it=b.closest('.item'),i=it.dataset.i;
    if(!d.chk[i]){d.chk[i]=true;it.classList.add('on','open');const inp=it.querySelector('input');if(!(d.val[i]||'').trim())inp.focus({preventScroll:true})}
    else if(!it.classList.contains('open')){it.classList.add('open');it.querySelector('input').focus({preventScroll:true})}
    else{d.chk[i]=false;d.val[i]='';it.classList.remove('on','open');it.querySelector('input').value='';it.querySelector('.vv').textContent=''}
    save();refreshOut();
  }
  else if(a==='copy'&&s){const ok=await copyText(script(s,draft(s.id)));toast(ok?'Script copied.':'Couldn’t copy on this device.')}
  else if(a==='copydoc'&&s){const ok=await copyText(docline(s,draft(s.id)));toast(ok?'Copied for the note.':'Couldn’t copy on this device.')}
  else if(a==='clear'&&s){if(confirm('Clear everything entered for '+s.name+'?')){delete S.d[s.id];save();renderSvc(s);toast('Cleared.')}}
});
hd.addEventListener('click',e=>{if(e.target.closest('[data-a="home"]')){location.hash=''}});
/* collapse a checked item's value field when focus leaves it */
app.addEventListener('focusout',e=>{const it=e.target.closest&&e.target.closest('.item');if(it&&e.target.matches('.iv input')){setTimeout(()=>{if(!it.contains(document.activeElement))it.classList.remove('open')},120)}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.iv input')){e.preventDefault();e.target.blur()}});

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
window.addEventListener('hashchange',()=>{render()});
render();
</script>
</body>
</html>
