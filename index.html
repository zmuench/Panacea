<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PANACEA</title>
<meta name="apple-mobile-web-app-title" content="PANACEA">
<meta name="theme-color" content="#1E3550">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* muench.md, styled after an EHR workspace (title bar, toolbar, patient-style storyboard,
   vertical activity tabs, grid report). Same apps, same group links (#clinical, #curricula, #residency, #sync), same sync logic. */
:root{
  --title:#1E3550; --title2:#2A4A6E; --tool:#EEF2F6; --tool2:#DCE3EA;
  --sb:#25476B; --sb2:#1D3A59; --sbtxt:#E8EFF6; --sbmuted:#A9BCD0;
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2733; --muted:#5B6877; --line:#C9D2DB; --line2:#E2E7EC;
  --link:#0B5CAD; --band:#3D6E9E; --band2:#2F5E8C; --hover:#E6F0FA; --sel:#FFF7D6; --zebra:#F7F9FB;
  --ok:#2E7D32; --warn:#F6D46B; --err:#B3261E;
  --f:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light only;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13px;line-height:1.4;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}

/* Title bar */
.titlebar{background:linear-gradient(var(--title2),var(--title));color:#fff;display:flex;align-items:stretch;height:34px;padding-left:6px;flex:none}
.menu{display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;margin:4px 6px 4px 0;border-radius:3px;background:linear-gradient(#3B5F86,#2C4D72);border:1px solid #4F7399;font-weight:700;letter-spacing:.04em;font-size:12px}
.menu img{width:18px;height:18px;border-radius:4px}
.wstabs{display:flex;align-items:flex-end;gap:2px}
.wstab{display:flex;align-items:center;gap:6px;height:28px;padding:0 14px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.12);color:#D6E2EE;font-size:12px;white-space:nowrap}
.wstab.on{background:var(--tool);color:var(--ink);font-weight:600}
.wstab .x{opacity:.5;font-size:11px}
.tright{margin-left:auto;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:#C9D7E5}
.tright b{color:#fff;font-weight:600}

/* Toolbar */
.toolbar{background:linear-gradient(var(--tool),var(--tool2));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:3px 6px;flex:none;overflow-x:auto}
.tb{display:flex;align-items:center;gap:5px;border:1px solid transparent;background:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px;white-space:nowrap;min-height:28px}
.tb:hover{background:#fff;border-color:var(--line)}
.tb svg{width:16px;height:16px;fill:none;stroke:var(--band2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:#fff;border-color:#9DB3C9;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}

/* Workspace */
.ws{flex:1;display:grid;grid-template-columns:232px 168px minmax(0,1fr);min-height:0}

/* Storyboard */
.story{background:linear-gradient(var(--sb),var(--sb2));color:var(--sbtxt);padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px;border-right:1px solid #16304A}
.who{display:flex;gap:10px;align-items:center}
.who img{width:46px;height:46px;border-radius:6px;border:2px solid rgba(255,255,255,.25)}
.who h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;color:#fff}
.who .sub{font-size:12px;color:var(--sbmuted)}
.flag{border-radius:3px;padding:4px 8px;font-size:12px;font-weight:600}
.flag.allergy{background:var(--warn);color:#4A3A00}
.sbsec{border-top:1px solid rgba(255,255,255,.14);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.sbsec h3{margin:0 0 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sbmuted);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.kv span:first-child{color:var(--sbmuted)}
.kv b{font-weight:600;color:#fff;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.pill i{width:7px;height:7px;border-radius:50%;background:#9AA7B4}
.pill.on{background:#DDF1DF;color:#1B5E20}.pill.on i{background:var(--ok)}

/* Activity tabs */
.acts{background:#E7ECF1;border-right:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column}
.act{appearance:none;border:0;background:none;text-align:left;padding:8px 12px 8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;border-left:3px solid transparent;color:#2B3B4C;min-height:36px}
.act:hover{background:#F3F6F9}
.act[aria-selected="true"]{background:var(--surface);border-left-color:#E08A1E;font-weight:700;color:var(--ink);box-shadow:0 1px 0 var(--line),0 -1px 0 var(--line)}
.act:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.act .ct{font-size:11px;font-weight:700;color:var(--band2);background:#D6E2EE;border-radius:999px;padding:0 7px}
.acts .div{height:1px;background:var(--line);margin:8px 10px}

/* Report area */
.main{padding:10px 12px 24px;min-width:0;overflow:auto}
.band{background:linear-gradient(var(--band),var(--band2));color:#fff;padding:5px 10px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;border-radius:3px 3px 0 0}
.band small{font-weight:400;opacity:.85}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px}
.filter{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line2);background:#FAFBFC}
.filter label{font-size:12px;color:var(--muted)}
.filter input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:2px;padding:3px 6px;min-height:26px;width:220px;max-width:100%}
.filter input:focus{outline:2px solid #8DB4DB;outline-offset:0;border-color:#6A9BCB}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);background:#EEF2F5;border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr:focus-within{background:var(--sel)}
td.ic{width:34px;padding-right:0}
td.ic span{width:26px;height:26px;border-radius:4px;background:#E3ECF5;display:grid;place-items:center}
td.ic svg{width:17px;height:17px;fill:none;stroke:var(--band2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
td.nm a{color:var(--link);font-weight:700;text-decoration:none}
td.nm a:hover{text-decoration:underline}
td.nm a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
td.ty{white-space:nowrap;color:#33475B}
td.ds{color:var(--muted)}
tr.sech th{background:#E3ECF5;color:var(--band2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
tbody tr.sech,tbody tr.sech:hover{background:none;cursor:default}
@media (max-width:760px){tbody tr.sech{display:block;padding:0}tr.sech th{display:block}}
.empty{padding:14px;color:var(--muted);font-style:italic}

/* Sync form */
.form{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.form p{margin:0;color:#33475B}
.form ul.what{margin:0;padding-left:18px;color:#33475B}
.grid{display:grid;grid-template-columns:120px minmax(0,320px);gap:6px 10px;align-items:center}
.grid label{text-align:right;font-weight:600;font-size:12.5px;color:#33475B}
.grid input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:2px;padding:4px 7px;min-height:28px;width:100%;background:#FFFDE8}
.grid input:focus{outline:2px solid #8DB4DB;outline-offset:0}
.req{color:var(--err)}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line2);padding-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #9FB0C1;background:linear-gradient(#FFFFFF,#E6EBF0);border-radius:3px;padding:4px 12px;min-height:30px;cursor:pointer;font-size:12.5px;font-weight:600}
.btn:hover{border-color:#6A8BAD}
.btn:disabled{opacity:.6;cursor:default}
.btn .ck{color:var(--ok);font-weight:900}
.btn .xx{color:var(--err);font-weight:900}
.err{background:#FDECEA;border:1px solid #F1B8B2;color:var(--err);padding:5px 8px;border-radius:2px}
.form details summary{cursor:pointer;color:var(--link);font-weight:600}
.form ol{margin:6px 0 0;padding-left:20px;color:#33475B;display:flex;flex-direction:column;gap:3px}
code{font-family:Consolas,ui-monospace,monospace;font-size:12px;background:#EEF2F5;padding:0 3px;border-radius:2px}

.status{flex:none;background:#E1E7ED;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);padding:3px 10px;display:flex;gap:16px}

/* Phones: storyboard becomes a header strip, activity tabs go horizontal, rows stack */
@media (max-width:760px){
  body{font-size:14px}
  .titlebar .wstab:not(.on),.tright span.t{display:none}
  .toolbar{display:none}
  .ws{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .story{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px}
  .story .sbsec{display:none}
  .story .sbsec.keep{display:flex;border:0;padding:0;flex-direction:row;gap:8px}
  .story .sbsec.keep h3,.story .sbsec.keep .kv span:first-child{display:none}
  .who img{width:38px;height:38px}
  .acts{flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .acts .div{display:none}
  .act{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px;flex:none}
  .act[aria-selected="true"]{border-bottom-color:#E08A1E;box-shadow:none}
  .main{padding:8px}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:34px 1fr;grid-template-areas:"i n" "i t" "i d";padding:8px 6px;border-bottom:1px solid var(--line2)}
  td{border:0;padding:0 4px}
  td.ic{grid-area:i;padding-top:2px}
  td.nm{grid-area:n}td.ty{grid-area:t;font-size:12px}td.ds{grid-area:d;font-size:12.5px}
  .grid{grid-template-columns:1fr}.grid label{text-align:left}
  .filter input{width:100%}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="titlebar">
  <div class="menu"><img src="favicon.svg" alt="">PANACEA</div>
  <div class="wstabs">
    <div class="wstab on">Shift Tools <span class="x">✕</span></div>
    <div class="wstab">In Basket</div>
    <div class="wstab">Schedule</div>
  </div>
  <div class="tright"><span><b>muench.md</b></span><span class="t" id="clock"></span></div>
</div>

<div class="toolbar" aria-hidden="true">
  <button class="tb" data-jump="clinical" tabindex="-1"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M12 9v6M9 12h6"/></svg>Clinical Tools</button>
  <button class="tb" data-jump="curricula" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></svg>Curricula</button>
  <button class="tb" data-jump="residency" tabindex="-1"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="7" ry="3"/><path d="M12 13v6M9 20h6"/></svg>Residency</button>
  <span class="sep"></span>
  <button class="tb" data-jump="sync" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Sync</button>
  <button class="tb" onclick="window.print()" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7"/></svg>Print</button>
</div>

<div class="ws">
  <aside class="story" aria-label="Summary">
    <div class="who"><img src="favicon.svg" alt=""><div><h1>PANACEA</h1><div class="sub">Shift tools in one place</div></div></div>
    <div class="flag allergy">No Known Allergies</div>
    <div class="sbsec keep"><h3>Sync</h3><div class="kv"><span>Status</span><b id="sbSync"></b></div></div>
    <div class="sbsec"><h3>Census</h3>
      <div class="kv"><span>Clinical tools</span><b id="n-clinical"></b></div>
      <div class="kv"><span>Curricula</span><b id="n-curricula"></b></div>
      <div class="kv"><span>Residency</span><b id="n-residency"></b></div>
    </div>
    <div class="sbsec"><h3>Service</h3>
      <div class="kv"><span></span><b>Emergency Medicine</b></div>
    </div>
    <div class="sbsec"><h3>Code Status</h3><div class="kv"><span></span><b>Full Code</b></div></div>
  </aside>

  <nav class="acts" role="tablist" aria-label="App groups">
    <button class="act" role="tab" id="tab-clinical" aria-controls="pane" data-g="clinical">Clinical Tools<span class="ct">11</span></button>
    <button class="act" role="tab" id="tab-curricula" aria-controls="pane" data-g="curricula">Curricula<span class="ct">5</span></button>
    <button class="act" role="tab" id="tab-residency" aria-controls="pane" data-g="residency">Residency<span class="ct">1</span></button>
    <div class="div"></div>
    <button class="act" role="tab" id="tab-sync" aria-controls="pane" data-g="sync">Sync</button>
  </nav>

  <main class="main" id="pane" role="tabpanel"></main>
</div>

<div class="status"><span id="stat"></span><span>Shift tools in one place</span></div>

<script>
const I={
 hx:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8 8.5h8M8 12h5"/>',
 px:'<path d="M6 3v5a4 4 0 0 0 8 0V3"/><path d="M10 12v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>',
 tracing:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 12h4l1.5-2.5 2 6 2.5-9 2 5.5h6"/>',
 silhouette:'<path d="M12 3v7"/><path d="M12 10l-2.5 2.5M12 10l2.5 2.5"/><path d="M9.5 5C6 5 4 8.5 4 13c0 3 .5 5.5 1.5 7 2-1.5 4-2 5.5-1.5"/><path d="M14.5 5C18 5 20 8.5 20 13c0 3-.5 5.5-1.5 7-2-1.5-4-2-5.5-1.5"/>',
 dispo:'<path d="M2.5 13.5l19-8-5 14-4.5-5z"/><path d="M12 14.5l9.5-9"/>',
 consult:'<path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/><path d="M15 3.5a6 6 0 0 1 5.5 5.5M15 7a2.5 2.5 0 0 1 2 2"/>',
 spectrum:'<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.6"/><circle cx="14.5" cy="8.5" r="1"/><circle cx="14" cy="14.5" r="2"/><circle cx="9" cy="15" r=".7"/>',
 admit:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M12 9v6M9 12h6"/>',
 ap:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 9.5h7"/><path d="M8.5 13h7M10 16.5h5.5"/>',
 icu:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8 13h2l1.5-3 2 5 1.5-2h1"/>',
 sweep:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-4.5"/><circle cx="9" cy="15.5" r=".6"/>',
 ether:'<path d="M6.5 10h11l-1.6 6.4A3.5 3.5 0 0 1 12.5 19h-1a3.5 3.5 0 0 1-3.4-2.6z"/><path d="M12 10V6.5A2.5 2.5 0 0 1 14.5 4H18"/><path d="M4 13h2.9M17.1 13H20"/>',
 primer:'<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>',
 core:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
 rhythm:'<path d="M2.5 13h4l1.5-3 2.5 8 3-14 2.5 9h5.5"/>',
 rhythm2:'<path d="M1.5 13h3l1-2.5 1.5 6 2-11 1.5 7.5h3l1-2.5 1.5 6 2-11 1.5 7.5h2"/>',
 systole:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/><path d="M3 12.5h4l1.5-2.5 2 5 2-6.5 1.5 4h7"/>',
 nenya:'<ellipse cx="12" cy="9" rx="7" ry="3"/><path d="M7 11.5c1.5 1 3.2 1.5 5 1.5s3.5-.5 5-1.5"/><path d="M12 13v6M9 20h6"/>'
};
const G={
 clinical:{title:'Clinical Tools',apps:[
  ['hx','Hx','hx/','HPI builder','Pick a chief complaint, mark pertinent positives and negatives, get the HPI.','EM'],
  ['px','Px','px/','Exam builder','Focused exams by complaint, plus ICU, full neuro and NIHSS, written for the note.','EM'],
  ['dispo','Dispo','dispo/','ED MDM builder','Flow-chart inputs that write the MDM and discharge instructions.','EM'],
  ['consult','Consult','consult/','Consult call prep','Pick a service, gather what they’ll ask about, and get a call script and note line.','EM'],
  ['admit','Admit','admit/','ICU & floor H&P','Problems with ready plans, antibiotics by source, FAST HUGS BID, then send to ICU Rounder.','ICU'],
  ['ap','A/P','ap/','Assessment & plan','Each problem as a header, an italic assessment built from what matters, and a bulleted plan.','ICU'],
  ['icu','ICU Rounder','icu-rounder/','Daily rounds','Patient profiles through discharge, daily inputs, problem-based A/P.','ICU'],
  ['sweep','Sweep','sweep/','ICU considerations','A morning pass through every system, with open items flagged for rounds.','ICU'],
  ['tracing','Tracing','tracing/','EKG dictation','Walk Dubin’s five steps with example strips, and get the read and impression.','Interpretation'],
  ['silhouette','Silhouette','silhouette/','Chest X-ray read','Film check, then A to E finding by finding, with diagrams; get the report and impression.','Interpretation'],
  ['spectrum','Spectrum','spectrum/','ID consults','ID HPI, cultures and antibiotic days, the daily note, and a bugs and drugs reference.','Specialty Services'],
  ['ether','Ether','ether/','Anesthesia plan','Review the chart, score the risk, build the anesthetic plan, and print a card for the OR.','Specialty Services']]},
 curricula:{title:'Curricula',apps:[
  ['primer','Primer','primer/','ICU curriculum','One lesson a day: readings, what to order, the evidence, and a self-check.'],
  ['core','Core','core/','EM curriculum','All of Tintinalli’s, one lesson a day: chapters, workup, treatment and dispo.'],
  ['rhythm','Rhythm','rhythm/','EKG curriculum','Dubin’s Rapid Interpretation of EKG’s, one lesson a day, with your copy open beside it.'],
  ['rhythm2','Rhythm 2','rhythm2/','ECG curriculum','Chizner’s ECG Interpretation Made Ridiculously Simple, one lesson a day, ending with 55 practice ECGs.'],
  ['systole','Systole','systole/','Cardiology curriculum','Chizner’s Clinical Cardiology Made Ridiculously Simple, one lesson a day, for the cardiology sub-I.']]},
 residency:{title:'Residency',apps:[
  ['nenya','Nenya','nenya/','EM rank list','Weight what matters, add programs as you interview, watch the list sort.']]}
};
// Counts in the tabs come from the lists themselves
for(const k in G){const c=document.querySelector(`#tab-${k} .ct`);if(c)c.textContent=G[k].apps.length}
for(const k in G)document.getElementById('n-'+k).textContent=G[k].apps.length;

const escH=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pane=document.getElementById('pane');
const tabs=[...document.querySelectorAll('.act')];
let cur='clinical',q='';

function rows(list){
  const f=q.toLowerCase();
  const r=list.filter(a=>!f||(a[1]+' '+a[3]+' '+a[4]).toLowerCase().includes(f));
  if(!r.length)return `<tr><td colspan="4" class="empty">No apps match “${escH(q)}”.</td></tr>`;
  let last='';
  return r.map(([ic,n,h,t,d,sec])=>(sec&&sec!==last?(last=sec,`<tr class="sech"><th colspan="4" scope="colgroup">${escH(sec)}</th></tr>`):'')+`<tr data-href="${h}"><td class="ic"><span><svg viewBox="0 0 24 24" aria-hidden="true">${I[ic]}</svg></span></td><td class="nm"><a href="${h}">${escH(n)}</a></td><td class="ty">${escH(t)}</td><td class="ds">${escH(d)}</td></tr>`).join('');
}
function renderGroup(k){
  const g=G[k];
  pane.innerHTML=`<div class="band">${g.title}<small>${g.apps.length} item${g.apps.length>1?'s':''}</small></div>
  <div class="panel"><div class="filter"><label for="flt">Filter</label><input id="flt" type="search" value="${escH(q)}" placeholder="Name, type or description" autocomplete="off"></div>
  <table><thead><tr><th></th><th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody id="tb">${rows(g.apps)}</tbody></table></div>`;
  document.getElementById('flt').addEventListener('input',e=>{q=e.target.value;document.getElementById('tb').innerHTML=rows(g.apps)});
  document.getElementById('stat').textContent=`${g.title}: ${g.apps.length} apps`;
}
pane.addEventListener('click',e=>{const tr=e.target.closest('tr[data-href]');if(tr&&!e.target.closest('a'))location.href=tr.dataset.href});

function show(k,focus){
  cur=k;q='';
  tabs.forEach(b=>{const on=b.dataset.g===k;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()});
  document.querySelectorAll('.tb[data-jump]').forEach(b=>b.classList.toggle('on',b.dataset.jump===k));
  pane.setAttribute('aria-labelledby','tab-'+k);
  if(k==='sync'){renderSync();document.getElementById('stat').textContent='Sync settings'}else renderGroup(k);
}
tabs.forEach((b,i)=>{
  b.addEventListener('click',()=>{show(b.dataset.g);history.replaceState(null,'','#'+b.dataset.g)});
  b.addEventListener('keydown',e=>{const d=(e.key==='ArrowDown'||e.key==='ArrowRight')?1:(e.key==='ArrowUp'||e.key==='ArrowLeft')?-1:0;if(!d)return;e.preventDefault();const n=tabs[(i+d+tabs.length)%tabs.length];show(n.dataset.g,true);history.replaceState(null,'','#'+n.dataset.g)});
});
document.querySelectorAll('.tb[data-jump]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.jump);history.replaceState(null,'','#'+b.dataset.jump)}));
function fromHash(){const k=location.hash.slice(1);show(G[k]||k==='sync'?k:'clinical')}
window.addEventListener('hashchange',fromHash);
window.addEventListener('pageshow',fromHash);

/* Sync across devices: unchanged logic, same storage key as every app. */
const SYNC_KEY='icu-rounds-sync';
let syncErr='',syncBusy=false,typed={token:'',repo:''};
function getSync(){try{const r=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return r&&r.token&&r.owner&&r.repo?r:null}catch(e){return null}}
const ownerGuess=()=>location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'your-username';
function renderSB(){const on=!!getSync();document.getElementById('sbSync').innerHTML=`<span class="pill${on?' on':''}"><i></i>${on?'On':'Off'}</span>`}
function renderSync(){const SY=getSync();renderSB();
  const what=`<ul class="what"><li>ICU Rounder and Spectrum patients, and Ether cases</li><li>Progress and notes in Primer, Core, Rhythm, Rhythm 2 and Systole</li><li>The PDFs you link in those curricula</li></ul>`;
  pane.innerHTML=`<div class="band">Sync Across Devices<small>${SY?'Active':'Not configured'}</small></div><div class="panel"><div class="form">`+(SY?
   `<p>This device syncs through your private repo <b>${escH(SY.owner)}/${escH(SY.repo)}</b>:</p>${what}
    <p>Set up each phone or computer the same way, with the same repo and token.</p>
    <div class="btns"><button type="button" class="btn" data-s="off"><span class="xx">✕</span>Stop syncing on this device</button></div>`
  :`<p>Turn on sync once per device to keep these the same on your phone, laptop and desktop:</p>${what}
    <p>Everything is saved to a <b>private</b> GitHub repo with a token you paste once on each device.</p>
    <div class="grid"><label for="syncToken"><span class="req">*</span> GitHub token</label><input type="password" id="syncToken" placeholder="github_pat_…" autocomplete="off" value="${escH(typed.token)}">
    <label for="syncRepo"><span class="req">*</span> Private repo</label><input type="text" id="syncRepo" value="${escH(typed.repo||ownerGuess()+'/panacea-data')}" autocapitalize="off" spellcheck="false"></div>
    ${syncErr?`<div class="err">${escH(syncErr)}</div>`:''}
    <details><summary>How to set this up</summary><ol>
    <li>On github.com, create a new <b>private</b> repository named <code>panacea-data</code>.</li>
    <li>Profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
    <li>Repository access: <em>Only select repositories</em> → <code>panacea-data</code>. Permissions → Contents: <em>Read and write</em>.</li>
    <li>Paste the token here and click <b>Accept</b>. Repeat on each device.</li></ol></details>
    <div class="btns"><button type="button" class="btn" data-s="on"${syncBusy?' disabled':''}><span class="ck">✓</span>${syncBusy?'Checking…':'Accept'}</button><button type="button" class="btn" data-s="cancel"><span class="xx">✕</span>Cancel</button></div>`)+`</div></div>`}
async function turnOn(){
  const token=document.getElementById('syncToken').value.trim(),full=document.getElementById('syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
  typed={token,repo:full};const[owner,repo]=full.split('/');syncErr='';
  if(!token||!owner||!repo){syncErr='Add your token and the repo as owner/name.';renderSync();return}
  syncBusy=true;renderSync();
  try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}`,{cache:'no-store',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
    if(!r.ok){syncErr=r.status===401?'GitHub didn’t accept that token.':r.status===404?`This token can’t see ${owner}/${repo}. Check the name and that the token includes that repo.`:'Couldn’t reach GitHub. Check your connection.'}
    else{const info=await r.json();
      if(!info.private)syncErr=`${owner}/${repo} is public. Make it private (its Settings → General → Danger Zone) so patient data and PDFs aren’t visible to anyone.`;
      else if(info.permissions&&!info.permissions.push)syncErr='That token can read the repo but not save to it. Give it “Contents: Read and write”.';
      else{localStorage.setItem(SYNC_KEY,JSON.stringify({token,owner:info.owner&&info.owner.login||owner,repo:info.name||repo}));typed={token:'',repo:''};try{localStorage.removeItem('panacea.spectrum.sync')}catch(e){}}}}
  catch(e){syncErr='Couldn’t reach GitHub. Check your connection.'}
  syncBusy=false;renderSync()}
pane.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
  if(b.dataset.s==='on')turnOn();
  else if(b.dataset.s==='cancel'){typed={token:'',repo:''};syncErr='';show('clinical');history.replaceState(null,'','#clinical')}
  else if(b.dataset.s==='off'){if(b.dataset.armed){localStorage.removeItem(SYNC_KEY);try{localStorage.removeItem('panacea.spectrum.sync')}catch(e){}renderSync()}else{b.dataset.armed='1';b.lastChild.textContent='Click again to stop. Data on this device stays.'}}});

const clk=document.getElementById('clock');
function tick(){clk.textContent=new Date().toLocaleString([], {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,30000);
renderSB();fromHash();
</script>
