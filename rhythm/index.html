  document.title='All lessons · Rhythm';header('All lessons','#today');
  const f=filter.toLowerCase(),cur=current();
  let h=`<input class="search" id="q" type="search" placeholder="Search lessons" value="${esc(filter)}" autocomplete="off">`;
  for(const u of UNITS){
    const ls=L.filter(l=>l.u===u.n&&(!f||(l.t+' '+l.bl+' '+l.key.join(' ')).toLowerCase().includes(f)));
    if(!ls.length)continue;
    const all=L.filter(l=>l.u===u.n),nd=all.filter(l=>isDone(l.id)).length;
    const open=f||(cur&&cur.u===u.n);
    h+=`<details class="unit"${open?' open':''}><summary><span class="un">${u.n}</span><span class="nm">${esc(u.t)}</span><span class="ct${nd===all.length?' all':''}">${nd}/${all.length}</span>${CHEV}</summary>`;
    for(const l of ls){const d=isDone(l.id),pg=l.p.map(([a,b])=>a+'–'+b).join(', ');
      h+=`<button class="lrow${d?' d':''}${cur===l?' today':''}" data-go="#l/${l.id}"><span class="dn">Day ${IDX[l.id]+1}</span><span class="lt2">${esc(l.t)}<small>${d?`Done ${fmtDay(S.done[l.id].day)}`:cur===l?'Up next':pg?'pp. '+pg:'Beyond the book'}</small></span><span class="bx">${CK}</span></button>`}
    h+=`</details>`}
  h+=`<div class="btnrow" style="margin-top:6px"><button class="btn block" data-go="#books">Your PDF · ${BM.D?'linked on this device':BM.R?'reference sheets linked':'not linked yet'}</button></div>`;
  h+=`<div class="foot">Readings point to printed page numbers in ${esc(BOOKS.D.full)}. Lessons are summaries for learning, not orders for a specific patient.${SY?'':' Progress and notes are saved on this device; if ICU Rounder sync is turned on here, Rhythm syncs through the same private repo.'}</div>`;
  app.innerHTML=h;
}

/* ---------- your PDF: kept only in this browser (IndexedDB), never uploaded ---------- */
const BMKEY='panacea.rhythm.books';
let BM={};try{BM=JSON.parse(localStorage.getItem(BMKEY)||'{}')||{}}catch(e){}
const saveBM=()=>{try{localStorage.setItem(BMKEY,JSON.stringify(BM))}catch(e){}};
let dbP=null;
function db(){return dbP||(dbP=new Promise((res,rej)=>{const r=indexedDB.open('rhythm-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files',mode);const st=tx.objectStore('files');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
let pdfjsP=null;
function loadPdfjs(){return pdfjsP||(pdfjsP=new Promise((res,rej)=>{if(window.pdfjsLib){res();return}const sc=document.createElement('script');sc.src=PDFJS;
  sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');res()};sc.onerror=()=>{pdfjsP=null;rej(new Error('Couldn’t load the PDF reader. Check your connection.'))};document.head.appendChild(sc)}))}
const DOCS={};
async function getDoc(code){if(DOCS[code])return DOCS[code];
  const blob=await idb('readonly',st=>st.get(code));if(!blob)throw new Error('That PDF isn’t on this device anymore. Link it again.');
  await loadPdfjs();const data=new Uint8Array(await blob.arrayBuffer());
  DOCS[code]=await pdfjsLib.getDocument({data}).promise;return DOCS[code]}
/* Which linked file shows a printed page, and at which PDF page. */
function srcFor(p){
  if(BM.D){const pp=p+(BM.D.off||0);if(!BM.D.pages||(pp>=1&&pp<=BM.D.pages))return{code:'D',off:BM.D.off||0}}
  if(BM.R&&p>=333&&p<=346)return{code:'R',off:BM.R.off??-332};
  return null}
/* Read printed page numbers from the PDF's text to line printed pages up with PDF pages. */
async function detectOffset(doc){
  const N=doc.numPages,idx=[];const want=Math.min(N,40);
  for(let k=0;k<want;k++){const i=N<=40?k+1:Math.round(1+(N-1)*(k+.5)/want);if(!idx.includes(i))idx.push(i)}
  const votes={};let used=0;
  for(const i of idx){let tc;try{tc=await(await doc.getPage(i)).getTextContent()}catch(e){continue}
    const seen=new Set();let any=false;
    for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;any=true;if(!/^\d{1,3}$/.test(s))continue;const n=+s;if(n<1||n>400)continue;seen.add(i-n)}
    if(any)used++;for(const o of seen)votes[o]=(votes[o]||0)+1}
  let best=null,bv=0;for(const[o,v]of Object.entries(votes))if(v>bv){bv=v;best=+o}
  return bv>=Math.max(2,Math.ceil(used*.3))?best:null}
let linking='';
async function linkBook(code,file){linking=code;render(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    let doc=null,pages=null,off=null;
    try{await loadPdfjs();doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;pages=doc.numPages;off=await detectOffset(doc)}catch(e){}
    if(code==='D'&&pages&&pages<=20&&off!==null&&333+off>=1&&346+off<=pages)code='R';  // the 14-page reference sheets picked in the book slot
    await idb('readwrite',st=>st.put(file,code));DOCS[code]=doc;
    if(off===null)off=code==='R'?-332:0;
    BM[code]={name:file.name,size:file.size,pages,off,auto:off!==null,at:Date.now()};saveBM();
    toast(!pages?'Linked, but the file couldn’t be read as a PDF.':code==='R'?'Reference sheets linked.':'Dubin linked. If pages look off, use the shift buttons in the reader.')}
  catch(e){toast(e&&e.name==='QuotaExceededError'?'Not enough storage on this device for that file.':'Couldn’t save that file on this device.')}
  linking='';render(true)}
async function unlinkBook(code){try{await idb('readwrite',st=>st.delete(code))}catch(e){}delete BM[code];delete DOCS[code];saveBM();render(true)}
const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+' MB';
function renderBooks(){
  document.title='Your PDF · Rhythm';header('Your PDF','#bback');
  let h=`<div class="card"><p style="margin:0 0 4px">Pick your copy of Dubin once on this device. Every reading then opens straight to its pages.</p>
   <p class="note" style="margin-top:6px">Files stay in this browser only. They aren’t uploaded, synced, or added to PANACEA, so link them again on each phone or computer. Your progress and notes do sync.</p></div><div class="card">`;
  for(const[k,b]of Object.entries(BOOKS)){const m=BM[k];
    const st=linking===k?'<span class="st">Saving…</span>':m?`<span class="st ok">Linked · ${esc(m.name)} · ${m.pages?m.pages+' pages · ':''}${mb(m.size)}</span>`:'<span class="st">Not linked</span>';
    h+=`<div class="bkrow"><div class="tx"><div class="nm">${esc(k==='D'?'The book':b.short)}</div><div class="st" style="margin-bottom:2px">${esc(b.full)}${k==='R'?' · only needed if you don’t link the whole book':''}</div>${st}</div>
      <div class="btnrow" style="flex:none;flex-direction:column;align-items:stretch">
      <label class="btn sm filebtn">${m?'Replace':'Choose PDF'}<input type="file" accept="application/pdf,.pdf" data-file="${k}"></label>
      ${m?`<button class="linkbtn" data-a="unlink" data-b="${k}">Remove</button>`:''}</div></div>`}
  h+=`</div>`;
  if(srcFor(333))h+=`<button class="btn block" data-a="openref">Open the quick reference sheets</button>`;
  app.innerHTML=h}

let RD=null;
function closeReader(){if(RD){RD.obs&&RD.obs.disconnect();RD.vis&&RD.vis.disconnect();RD.dead=true;RD=null}const c=document.getElementById('pgchip');if(c)c.remove()}
async function renderReader(a,b){
  closeReader();
  const lab=a===b?'p. '+a:'pp. '+a+'–'+b;
  document.title='Dubin '+lab+' · Rhythm';header('Dubin · '+lab,'#rback');
  const src=srcFor(a);
  if(!src){app.innerHTML=`<div class="card" style="margin-top:12px"><p style="margin:0 0 10px">Link your PDF on this device to read here.</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  app.innerHTML=`<div class="reader" id="rdr" style="margin-top:12px"><div class="loading">Opening…</div></div>`;
  const me=RD={dead:false};
  let doc;try{doc=await getDoc(src.code)}catch(e){if(!me.dead)document.getElementById('rdr').innerHTML=`<div class="card" style="width:100%"><p style="margin:0 0 10px">${esc(e.message)}</p><button class="btn sm" data-go="#books">Your PDF</button></div>`;return}
  if(me.dead)return;
  const off=src.off,first=await doc.getPage(Math.min(Math.max(a+off,1),doc.numPages));const vp1=first.getViewport({scale:1});const ratio=vp1.height/vp1.width;
  if(me.dead)return;
  const box=document.getElementById('rdr');box.innerHTML='';
  const cal=document.createElement('div');cal.className='cal';
  cal.innerHTML=`<span class="tx">Printed p. ${a} is PDF page ${a+off}. Pages off?</span><button class="btn sm" data-a="shift" data-c="${src.code}" data-d="-1" aria-label="Shift back one page">−1</button><button class="btn sm" data-a="shift" data-c="${src.code}" data-d="1" aria-label="Shift forward one page">+1</button>`;
  box.appendChild(cal);
  for(let p=a;p<=b;p++){const pp=p+off,w=document.createElement('div');w.className='pgw';
    const ok=pp>=1&&pp<=doc.numPages;
    w.innerHTML=`<div class="pg${ok?'':' miss'}" data-p="${pp}" style="aspect-ratio:${(1/ratio).toFixed(4)}"><span class="pn">p. ${p}</span>${ok?'':'Not in this PDF'}</div>`;
    box.appendChild(w)}
  const end=document.createElement('div');end.className='btnrow';end.style.margin='14px 0 64px';end.innerHTML=`<button class="btn" data-go="#rback">Back to the lesson</button>`;box.appendChild(end);
  const chip=document.createElement('div');chip.className='pgchip';chip.id='pgchip';chip.textContent=a===b?'p. '+a:`p. ${a} · 1 of ${b-a+1}`;document.body.appendChild(chip);
  const rendered=new Map();
  async function draw(el){const p=+el.dataset.p;if(rendered.has(p)||me.dead||el.classList.contains('miss'))return;rendered.set(p,'busy');
    try{const pg=await doc.getPage(p);if(me.dead)return;const w=el.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(me.dead||!rendered.has(p))return;el.prepend(cv);rendered.set(p,cv)}
    catch(err){rendered.delete(p)}}
  function drop(el){const p=+el.dataset.p,cv=rendered.get(p);if(cv&&cv!=='busy'){cv.width=cv.height=0;cv.remove()}rendered.delete(p)}
  me.obs=new IntersectionObserver(es=>{for(const x of es){if(x.isIntersecting)draw(x.target);else drop(x.target)}},{rootMargin:'1200px 0px'});
  me.vis=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting){const p=+x.target.dataset.p-off;chip.textContent=a===b?'p. '+p:`p. ${p} · ${p-a+1} of ${b-a+1}`}},{rootMargin:'-45% 0px -45% 0px'});
  box.querySelectorAll('.pg').forEach(el=>{me.obs.observe(el);me.vis.observe(el)});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const to=g.dataset.go;if(to==='#l/')return;
    if(to==='#today'){location.hash='';return}
    if(to==='#rback'){location.hash=sessionStorage.getItem('rhythm.readBack')||'';return}
    if(to==='#bback'){const v=sessionStorage.getItem('rhythm.booksBack');location.hash=v===null?'all':v;sessionStorage.removeItem('rhythm.booksBack');return}
    if(to==='#'){location.hash=sessionStorage.getItem('rhythm.back')||'';return}
    const v=route().v;if(to.startsWith('#l/')&&v!=='lesson')sessionStorage.setItem('rhythm.back',v==='all'?'all':'');
    if(to==='#books'&&v!=='books')sessionStorage.setItem('rhythm.booksBack',location.hash.slice(1)||'');
    location.hash=to.slice(1);return}
  const rd=e.target.closest('[data-read]');
  if(rd){const c=rd.dataset.read,[a,b]=itemPages(c),back=route().v==='today'?'':'l/'+rd.dataset.from;
    sessionStorage.setItem('rhythm.readBack',back);
    if(srcFor(a))location.hash='read/'+a+'-'+b;else{sessionStorage.setItem('rhythm.booksBack',back);location.hash='books'}return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const A=b.dataset.a;
  if(A==='unlink'){unlinkBook(b.dataset.b);return}
  if(A==='openref'){sessionStorage.setItem('rhythm.readBack','books');location.hash='read/333-346';return}
  if(A==='shift'){const m=BM[b.dataset.c];if(!m)return;m.off=(m.off??(b.dataset.c==='R'?-332:0))+(+b.dataset.d);m.auto=false;saveBM();const r=route();if(r.v==='read')renderReader(r.a,r.b);return}
  if(A==='rtick'){const key=b.dataset.l+':'+b.dataset.c,on=!isRead(b.dataset.l,b.dataset.c);S.read[key]={on,ts:Date.now()};save();
    const li=b.closest('li');li.classList.toggle('rd',on);b.setAttribute('aria-checked',on);
    const l=L[IDX[b.dataset.l]],its=items(l),n=its.filter(c=>isRead(l.id,c)).length,ct=document.getElementById('rdct');if(ct)ct.textContent=`${n} of ${its.length} read`;
    if(on&&n===its.length&&!isDone(l.id))toast('All readings done. Complete the lesson when you’re ready.');return}
  if(A==='reveal'){const q=document.getElementById('qz');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Hide answer':'Show answer'}
  else if(A==='done'){const id=b.dataset.id;const wasToday=route().v==='today';S.done[id]={on:true,day:today(),ts:Date.now()};save();
    toast('Lesson complete.');if(wasToday){location.hash='';render()}else render(true)}
  else if(A==='undo'){S.done[b.dataset.id]={on:false,day:'',ts:Date.now()};save();render(true)}
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.file&&t.files&&t.files[0])linkBook(t.dataset.file,t.files[0])});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){filter=t.value;const p=t.selectionStart;renderAll();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.note){S.notes[t.dataset.note]={t:t.value,ts:Date.now()};save();return}
});
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
window.addEventListener('hashchange',()=>render());
render();
</script>
